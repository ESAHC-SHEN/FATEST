<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CPA《会计》教材重点清单 · 划线助手（单文件版）</title>
<style>
:root{
  --bg:#f5f7fb; --panel:#ffffff; --ink:#1f2430; --ink-2:#5a6478; --ink-3:#8b95a8;
  --line:#e3e8f0; --accent:#2f6fed; --accent-soft:#eaf1ff;
  --done:#16a34a; --done-soft:#e8f7ee;
  --star3:#dc2626; --star2:#ea8c00; --star1:#94a3b8;
  --tierA:#dc2626; --tierB:#ea8c00; --tierC:#94a3b8;
  --shadow:0 1px 2px rgba(16,24,40,.04), 0 8px 24px -8px rgba(16,24,40,.12);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12151c; --panel:#1a1f29; --ink:#e8ecf3; --ink-2:#a8b2c4; --ink-3:#78839a;
    --line:#2a3140; --accent:#6f9bff; --accent-soft:#1e2a44;
    --done:#4ade80; --done-soft:#14301f;
    --star3:#f87171; --star2:#fbbf24; --star1:#78839a;
    --tierA:#f87171; --tierB:#fbbf24; --tierC:#78839a;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px -8px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font:15px/1.75 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}

/* ---------- 顶栏 ---------- */
header{
  position:sticky; top:0; z-index:50;
  background:color-mix(in srgb, var(--panel) 88%, transparent);
  backdrop-filter:saturate(180%) blur(12px);
  border-bottom:1px solid var(--line);
}
.hwrap{max-width:1180px;margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{font-weight:700;font-size:16px;letter-spacing:.2px;white-space:nowrap}
.brand small{display:block;font-weight:400;font-size:11.5px;color:var(--ink-3);letter-spacing:0}
.spacer{flex:1}
.pbar{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.track{width:150px;height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--done));transition:width .25s}
.btn{
  border:1px solid var(--line); background:var(--panel); color:var(--ink);
  padding:7px 13px; border-radius:9px; font-size:13.5px; cursor:pointer;
  font-family:inherit; transition:.15s; white-space:nowrap;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08);color:#fff}
.btn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

/* ---------- 布局 ---------- */
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 80px;display:grid;grid-template-columns:236px 1fr;gap:26px;align-items:start}
@media (max-width:900px){ .wrap{grid-template-columns:1fr;gap:16px} }
nav.side{
  position:sticky; top:66px; background:var(--panel); border:1px solid var(--line);
  border-radius:14px; padding:12px; box-shadow:var(--shadow); max-height:calc(100vh - 90px); overflow:auto;
}
@media (max-width:900px){ nav.side{position:static;max-height:none} }
nav.side h4{margin:4px 6px 8px;font-size:11.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--ink-3);font-weight:600}
nav.side a{
  display:flex;align-items:center;gap:8px;padding:6px 9px;border-radius:8px;
  color:var(--ink-2);font-size:13.5px;line-height:1.4;
}
nav.side a:hover{background:var(--accent-soft);color:var(--accent);text-decoration:none}
nav.side a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.side .dot{width:7px;height:7px;border-radius:99px;flex:none;background:var(--tierC)}
nav.side .dot.A{background:var(--tierA)} nav.side .dot.B{background:var(--tierB)}
nav.side .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.side .tick{font-size:11px;color:var(--done);font-weight:700}

main{min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:22px 26px;margin-bottom:20px}
@media (max-width:600px){ .card{padding:16px 15px} .wrap{padding:14px 12px 60px} }

/* ---------- 目录页 ---------- */
.hero h1{margin:0 0 6px;font-size:24px;letter-spacing:-.3px}
.hero p{margin:0;color:var(--ink-2);font-size:14px}
table{width:100%;border-collapse:collapse;margin:14px 0;font-size:14px}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
th{background:var(--accent-soft);font-weight:600;font-size:13px}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.tier{display:inline-block;width:19px;height:19px;line-height:19px;text-align:center;border-radius:99px;color:#fff;font-size:11.5px;font-weight:700}
.tier.A{background:var(--tierA)} .tier.B{background:var(--tierB)} .tier.C{background:var(--tierC)}

/* ---------- Markdown 渲染 ---------- */
.md h1{font-size:22px;margin:0 0 4px;letter-spacing:-.3px}
.md h2{font-size:18px;margin:30px 0 10px;padding-top:16px;border-top:1px solid var(--line)}
.md h3{
  font-size:15.5px;margin:22px 0 8px;padding:9px 12px;border-radius:9px;
  background:var(--accent-soft);border-left:3px solid var(--accent);
  display:flex;align-items:flex-start;gap:9px;cursor:pointer;user-select:none;
}
.md h3 .box{
  flex:none;width:18px;height:18px;margin-top:2px;border:1.5px solid var(--ink-3);
  border-radius:5px;display:flex;align-items:center;justify-content:center;
  font-size:12px;color:#fff;transition:.15s;background:transparent;
}
.md h3.done .box{background:var(--done);border-color:var(--done)}
.md h3.done{background:var(--done-soft);border-left-color:var(--done)}
.md h3 .txt{flex:1}
.md h3.lv2{font-size:15px;background:transparent;border-left:3px solid var(--line)}
.md h3.lv2.done{background:var(--done-soft);border-left-color:var(--done)}
.md h4{font-size:14.5px;margin:18px 0 6px;color:var(--ink-2)}
.md ul,.md ol{margin:8px 0;padding-left:24px}
.md li{margin:4px 0}
.md p{margin:9px 0}
.md blockquote{
  margin:12px 0;padding:10px 14px;border-left:3px solid var(--accent);
  background:var(--accent-soft);border-radius:0 9px 9px 0;color:var(--ink-2);font-size:14px;
}
.md blockquote p{margin:4px 0}
.md code{
  background:var(--bg);border:1px solid var(--line);border-radius:5px;
  padding:1px 5px;font-size:13px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
.md pre{
  background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:13px 15px;overflow:auto;font-size:13px;line-height:1.6;
}
.md pre code{background:none;border:none;padding:0}
.md hr{border:none;border-top:1px solid var(--line);margin:26px 0}
.md strong{font-weight:700}
.md .star3{color:var(--star3);font-weight:700;letter-spacing:-1px}
.md .star2{color:var(--star2);font-weight:700;letter-spacing:-1px}
.md .star1{color:var(--star1);font-weight:700;letter-spacing:-1px}
.md .tag{
  display:inline-block;padding:1px 7px;border-radius:99px;font-size:12px;
  background:var(--accent-soft);color:var(--accent);border:1px solid var(--line);
  margin:0 2px;white-space:nowrap;
}
.md .qref{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;color:var(--accent)}

/* ---------- 搜索 ---------- */
.search{position:relative;flex:1;min-width:170px;max-width:300px}
.search input{
  width:100%;padding:7px 12px 7px 30px;border:1px solid var(--line);border-radius:9px;
  background:var(--bg);color:var(--ink);font-size:13.5px;font-family:inherit;
}
.search input:focus{outline:none;border-color:var(--accent);background:var(--panel)}
.search::before{content:"⌕";position:absolute;left:9px;top:5px;color:var(--ink-3);font-size:15px}

mark{background:#fde68a;color:#000;border-radius:3px;padding:0 1px}
@media (prefers-color-scheme: dark){ mark{background:#8a6d1f;color:#fff} }

.loading{color:var(--ink-3);text-align:center;padding:50px 0}
.empty{color:var(--ink-3);text-align:center;padding:36px 0;font-size:14px}

/* ---------- 打印 ---------- */
@media print{
  :root{--bg:#fff;--panel:#fff;--line:#bbb;--ink:#000;--ink-2:#333;--ink-3:#666;--shadow:none}
  header,nav.side,.noprint{display:none !important}
  .wrap{display:block;max-width:none;padding:0}
  .card{border:none;box-shadow:none;padding:0;margin:0}
  .md h3{background:none;border-left:3px solid #000;break-after:avoid}
  .md h2{break-after:avoid}
  .md pre,.md blockquote{break-inside:avoid}
  body{font-size:11.2pt;line-height:1.5}
  a{color:#000;text-decoration:none}
}
</style>
</head>

  <div class="hwrap">

    <div class="spacer"></div>
    <div class="search noprint"><input id="search" type="search" placeholder="搜索考点 / 准则 / 分录" autocomplete="off"></div>

<script>
/* === 单文件版内联数据：30 章 Markdown 全文（由 打包单文件版.ps1 生成）=== */
window.MD_INDEX = {
    "1": "# 第一章 总论\n\n> 本题库考察频次：1 题 ｜ 优先级：C ｜ 建议投入：通读一遍，牢牢记住会计信息质量要求与计量属性\n\n本章在题库中只有 1 题（2018-15），且是与第二、四、十七章联考的判断题，但它提供的**资产确认条件**「与该资源有关的经济利益很可能流入企业＋成本能够可靠计量」是全书所有资产章节的总闸门，因此「通读一遍」的标准是：八项质量要求能背、五个计量属性能举例、六个要素的确认条件能一字不差说出。\n\n---\n\n## 考点清单\n### 财务报告目标\n- **优先级**：★\n- **内容**：我国财务报告目标兼顾两种观点——①**决策有用观**：向财务报告使用者提供与企业财务状况、经营成果和现金流量等有关的会计信息，有助于使用者作出经济决策；②**受托责任观**：反映企业管理层受托责任的履行情况。财务报告使用者主要包括投资者、债权人、政府及其有关部门和社会公众等，其中**投资者是首要使用者**。\n- **易错**：不要只写「提供决策有用信息」而漏掉「反映受托责任履行情况」——两个目标是并列的，命题人常在多选里把「仅反映受托责任」当成错误选项。\n- **考察**：—\n\n### 会计基本假设与会计基础\n- **优先级**：★★\n- **内容**：会计基本假设是对会计核算所处**时间、空间环境**所作的合理设定，包括四个：\n\n| 假设 | 核心含义 | 一句话理解 |\n|---|---|---|\n| **会计主体** | 界定会计确认、计量和报告的**空间范围** | 只核算企业本身（不是老板本身）的交易 |\n| **持续经营** | 在可预见的将来，企业按当前规模和状态继续经营，不会停业、不会大规模削减业务 | 是历史成本、折旧摊销存在的前提 |\n| **会计分期** | 将持续经营活动划分为一个个连续的、长短相同的期间（年度＋中期） | 折旧、摊销、权责发生制由此产生 |\n| **货币计量** | 以货币为计量单位反映生产经营活动 | 非财务信息用附注补充披露弥补其缺陷 |\n\n- **内容（会计基础）**：企业会计的确认、计量和报告应当以**权责发生制**为基础——凡是当期已经实现的收入和已经发生或应当负担的费用，无论款项是否收付，都作为当期；凡不属于当期的，即使款项已在当期收付，也不作为当期。\n- **易错**：①**会计主体 ≠ 法律主体**：法律主体必然是会计主体，但会计主体不一定是法律主体（企业集团、证券投资基金、企业年金基金都是会计主体而非法律主体）；②**有限寿命本身不影响持续经营假设**——封闭式基金、理财产品、信托计划等寿命固定或可确定的结构化主体仍适用持续经营假设；③**破产清算**以**非持续经营**为前提（见《企业破产清算有关会计处理规定》，财会〔2016〕23 号）。\n- **考察**：—\n\n### 会计信息质量要求（八项，本章最高频的背诵点）\n- **优先级**：★★★\n- **内容**：八项要求＝**可靠性、相关性、可理解性、可比性、实质重于形式、重要性、谨慎性、及时性**。\n- **重点一：实质重于形式（命题最偏爱的一项）**：要求企业按照交易或者事项的**经济实质**进行会计确认、计量和报告，而不应仅以交易或者事项的**法律形式**为依据。典型情形：\n  - **融资租入固定资产**：法律上所有权不属于承租人，但按经济实质视同自有资产确认入账并计提折旧；\n  - **具有融资性质的售后回购**：商品所有权凭证已转移，但按实质属于融资行为，**不确认收入**；\n  - **控制的判断**：即使持股比例未过半，若通过协议、表决权安排等能够主导被投资方相关活动，也按实质确认控制并纳入合并范围。\n- **重点二：谨慎性**：要求企业对交易或者事项进行会计确认、计量和报告时保持应有的谨慎，**不应高估资产或者收益、不应低估负债或者费用**。\n  - 允许：计提资产减值准备、对售出商品可能发生的保修义务确认预计负债、对可能发生的资产减值损失予以确认等。\n  - **禁止**：**不允许企业设置秘密准备**（即不得为以后期间\"留一手\"而故意压低当期资产、多计费用）；谨慎性也不意味着可以随意计提减值——必须有确凿证据，否则由谨慎性变成人为调节利润。\n- **重点三：重要性**：要求企业提供的会计信息应当反映所有对使用者决策有重要影响的交易或者事项。重要性应当从**性质**和**金额**两方面判断，并**依赖职业判断**——某项信息如果省略或错报会影响使用者据此作出的经济决策，该信息就具有重要性。\n- **其余四项对齐记忆**：可靠性＝如实反映、中立、无重要错报（以实际发生的交易或事项为依据）；相关性＝与使用者决策需要相关，具有反馈价值和预测价值；可理解性＝清晰明了，但假定使用者具有一定专业知识和愿意付出努力；可比性＝同一企业不同时期可比（会计政策不得随意变更）＋不同企业同一期间可比；及时性＝不得提前或延后，与可靠性冲突时以使用者决策需要为判断标准。\n- **易错**：①**重要性是\"免于错报的门槛\"，不是\"可以不算\"** ——金额小但性质严重的（如舞弊）仍然必须披露；②可比性**不是禁止变更会计政策**，按规定变更并能提供更相关可靠信息的可以变更，只在附注中说明；③谨慎性与可靠性冲突时**不得以谨慎性为由随意计提减值**。\n\n> **教材 OCR 提示**：本章「第三节 会计信息质量要求」的标题与部分小标题在 OCR 中**未能完整提取**（OCR 中仅能确认「四、可比性」「五、实质重于形式」「八、及时性」三个小标题，可靠性、相关性、可理解性、谨慎性、重要性的标题段落缺失）。上述八项要求的定义与规则为准则/教材通行表述，**条目标注不含教材定位**。\n\n- **考察**：—\n\n### 会计要素的定义及其确认条件\n- **优先级**：★★★\n- **内容**：会计要素分为**资产、负债、所有者权益、收入、费用和利润**六个；资产、负债和所有者权益侧重反映**财务状况**，收入、费用和利润侧重反映**经营成果**。各要素的**确认条件**（缺一不可）如下：\n\n| 要素 | 定义要点 | 确认条件 | 特征关键词 |\n|---|---|---|---|\n| **资产** | 企业**过去的**交易或者事项形成的、由企业**拥有或者控制的**、**预期会给企业带来经济利益**的资源 | ①与该资源有关的**经济利益很可能流入企业**；②该资源的**成本或者价值能够可靠地计量** | 预期带来经济利益、拥有或控制、过去交易形成 |\n| **负债** | 企业**过去的**交易或者事项形成的、**预期会导致经济利益流出企业**的**现时义务** | ①与该义务有关的**经济利益很可能流出企业**；②未来流出的经济利益的**金额能够可靠地计量** | 现时义务（含**法定义务**与**推定义务**）、过去交易形成、预期导致流出 |\n| **所有者权益** | 企业**资产扣除负债后**，由所有者享有的**剩余权益** | 依赖于其他要素，尤其是**资产和负债的确认**；金额也主要取决于资产和负债的计量 | 剩余索取权；来源＝所有者投入的资本＋直接计入所有者权益的利得和损失（其他综合收益）＋留存收益 |\n| **收入** | 企业在**日常活动中**形成的、会导致**所有者权益增加**的、与所有者投入资本**无关**的经济利益的总流入 | 企业履行了合同中的履约义务，即**客户取得相关商品或服务控制权**时确认 | 日常活动、与所有者投入资本无关、导致所有者权益增加 |\n| **费用** | 企业在**日常活动中**发生的、会导致**所有者权益减少**的、与向所有者分配利润**无关**的经济利益的总流出 | ①与费用相关的经济利益**很可能流出企业**；②流出结果会导致**资产减少或者负债增加**；③流出的**金额能够可靠计量** | 日常活动、与分配利润无关、导致所有者权益减少 |\n| **利润** | 企业在一定会计期间的**经营成果** | 依赖于**收入和费用以及利得和损失的确认**，金额取决于其计量 | ＝收入－费用＋直接计入当期利润的利得－损失 |\n\n- **易错**：①**\"很可能\"是确认的门槛**——不满足「很可能流入」的资源不能确认为资产（典型：企业积累的原始数据因关联性、精确性、及时性欠缺、找不到应用场景，**不确认为资产**）；②**推定义务也是负债**——依以往习惯做法、已公开承诺或声明、已公开宣布的经营政策而承担的义务（如长期销售政策下的售后保修）应确认负债；③**未来将发生的承诺、签订的合同不形成负债**（必须由过去交易或事项形成）；④**收入与利得、费用与损失的区分**靠「是否日常活动」，非日常活动的经济利益流入/流出计入利得/损失而非收入/费用。\n- **考察**：2018-15（据资产确认条件来判断广告宣传目的的影视作品制作支出能否资本化）\n\n### 会计要素计量属性（五种）\n- **优先级**：★★★\n- **内容**：会计要素的计量属性包括**历史成本、重置成本、可变现净值、现值、公允价值**五种。\n\n| 计量属性 | 定义（资产口径） | 典型应用 |\n|---|---|---|\n| **历史成本** | 按照购置时支付的现金或现金等价物的金额，或购置时所付出的对价的公允价值计量 | **一般应当采用**；固定资产、存货的初始计量 |\n| **重置成本**（现行成本） | 按照现在购买相同或者相似资产所需支付的现金或者现金等价物的金额计量 | 盘盈固定资产、盘盈存货的入账价值 |\n| **可变现净值** | 正常对外销售所能收到的金额，扣减至完工时估计将要发生的成本、估计的销售费用以及相关税费后的金额 | 存货期末计量（第二章） |\n| **现值** | 预计从其持续使用和最终处置中所产生的未来净现金流入量的折现金额 | 具有融资性质的分期付款购买资产、弃置费用、资产减值可收回金额 |\n| **公允价值** | 市场参与者在**计量日**发生的**有序交易**中，出售一项资产所能收到或者转移一项负债所需支付的**价格（脱手价格）** | 以公允价值进行后续计量的投资性房地产、金融工具、非同一控制下企业合并中取得的可辨认资产和负债等 |\n\n- **内容（选用原则）**：企业在对会计要素进行计量时，**一般应当采用历史成本**；采用重置成本、可变现净值、现值、公允价值计量的，应当保证**所确定的金额能够取得并可靠计量**。\n- **易错**：①**历史成本通常反映过去的价值**，重置成本、可变现净值、现值和公允价值反映**现时成本或现时价值**；②「一般应当采用历史成本」是原则，其他四种是例外，但例外需要满足「能取得且可靠计量」的条件；③**公允价值是脱手价，不是买入价**（这一条与第二十九章共用）。\n- **考察**：—\n\n### 公允价值的定义与适用范围（与第二十九章衔接）\n- **优先级**：★★\n- **内容**：公允价值＝市场参与者在计量日发生的有序交易中，出售一项资产所能收到或者转移一项负债所需支付的价格，即**脱手价格**。企业以公允价值计量相关资产或负债，应当假定：出售资产或转移负债的有序交易在**当前市场条件**下发生，并在该资产或负债的**主要市场**进行；不存在主要市场的，假定在**最有利市场**进行。\n- **内容（适用范围）**：教材列举涉及公允价值计量的资产或负债包括——以公允价值进行后续计量的**投资性房地产**、以公允价值进行后续计量的**生物资产**、使用公允价值确定**可收回金额**的资产、以公允价值计量的**企业年金基金投资**、以非货币性资产形式取得的**政府补助**、非同一控制下企业合并中取得的**可辨认资产和负债以及作为合并对价发行的权益工具**、以公允价值计量且其变动计入当期损益或计入其他综合收益的**金融资产和金融负债**等。\n- **不遵循公允价值计量准则的例外（易考的\"排除项\"）**：存货的**可变现净值**、资产减值中的**预计未来现金流量现值**与公允价值类似但**不遵循**《企业会计准则第 39 号——公允价值计量》；**股份支付**和**租赁**业务相关的计量也**不遵循**公允价值计量的有关规定。\n- **易错**：把「可变现净值」「预计未来现金流量现值」当成公允价值计量——它们是类似但**适用不同准则**的计量属性；把「股份支付/租赁中的公允价值」也往第 39 号准则上套。\n- **考察**：—\n\n### 可持续信息披露\n- **优先级**：★\n- **内容**：可持续信息（又称可持续发展信息）＝企业**环境（E）、社会（S）和治理（G）**方面的可持续议题相关**风险、机遇和影响**的信息。可持续议题是对企业、经济、社会、环境和利益相关方具有影响的事项或因素（如气候变化、污染物排放、员工健康与安全、反商业贿赂等）。\n- **内容（披露目标）**：向**投资者、债权人、政府及其有关部门和其他利益相关方**提供有关企业**重要的可持续风险、机遇和影响**的信息，从而使其了解可持续议题如何影响企业的未来发展、经营成果和财务状况，并了解企业的经营活动如何影响环境与社会，以作出资源配置等经济决策或其他决策。其中**投资者和债权人是可持续信息的基本使用者**。\n- **内容（重要性＝\"双重重要性\"）**：披露应当符合重要性原则，按**财务重要性**与**影响重要性**分别评估——\n  - 对**可持续风险和机遇**信息：重要性评估看该项信息的省略、错报或模糊处理是否会影响**基本使用者（投资者和债权人）**据此作出决策（财务重要性视角：是否给企业带来重要的当期或预期财务影响，包括对现金流量、融资渠道及资本成本的影响）；\n  - 对**可持续影响**信息：重要性评估看企业是否对**经济、社会和环境**产生重要影响。实际消极影响以**严重程度**（规模、范围、不可补救程度）为评估标准；可预见的潜在消极影响以**严重程度和发生的可能性**为评估标准；实际积极影响以**规模和范围**为评估标准；潜在积极影响以**规模、范围和发生的可能性**为评估标准。\n- **内容（报告期间与主体范围）**：报告期间应当与财务报表的报告期间保持一致；报告主体范围应当与财务报表主体保持一致；报告主体为合并主体时，涵盖的母公司和子公司应当与合并财务报表合并范围保持一致。此外还应当考虑**价值链**情况（与企业业务模式及其所处外部环境相关的互动、资源和关系，包括产品/服务从概念到交付、消费直至生命周期结束所涉及的各环节）。\n- **内容（四个核心要素）**：企业披露的可持续信息应当使使用者了解**治理、战略、风险和机遇管理（或治理、战略、风险、机遇和影响管理）、指标和目标**四个核心要素。我国企业可持续披露准则与国际可持续披露准则（ISSB Standards）中，四个核心要素的披露**仅适用于可持续风险和机遇**；欧洲可持续报告准则（ESRS）中则适用于可持续风险、机遇和影响。除四个核心要素外，我国准则还要求企业根据信息使用者的信息需求，针对**重要的可持续影响信息**按规定披露。\n- **易错**：①不要把它当成\"社会责任报告的科普\"——考点落在**披露目标、基本使用者、双重重要性、四个核心要素、期间与主体范围与财报保持一致**这五处；②**财务重要性 vs 影响重要性的评估维度不同**（前者看对使用者的决策影响，后者看对经济、社会和环境的影响），不要把两者的评估标准互换；③注意 **E/S/G 是\"可持续信息\"的三个维度**，而**治理、战略、风险和机遇管理、指标和目标才是\"披露的四个核心要素\"**，二者不要混淆。\n- **考察**：—\n\n---\n\n## 本章易错陷阱汇总\n\n1. **把「很可能」写成「可能」**：资产、负债、收入、费用的确认门槛都是**很可能（>50%）**，不是\"可能\"；达不到门槛的只能计入损益或作为或有事项披露。\n2. **混淆「会计主体」与「法律主体」**：法律主体必然是会计主体，会计主体不一定是法律主体（企业集团、证券投资基金、企业年金基金）。\n3. **用「持续经营」套所有主体**：封闭式基金、理财产品、信托计划等**寿命固定或可确定**的结构化主体，有限寿命**不影响**持续经营假设的成立；反之，破产清算以**非持续经营**为前提。\n4. **谨慎性被滥用的两个方向**：一是**设置秘密准备**（绝对禁止）；二是\"以谨慎为名\"随意计提减值或预计负债——谨慎性不允许高估负债和费用，必须有确凿证据。\n5. **重要性只看金额**：重要性必须**从性质和金额两方面**判断，金额小但性质严重（涉及舞弊、关联方、违法违规）的信息仍然重要。\n6. **把「可变现净值」「预计未来现金流量现值」当成公允价值**：这两个计量属性与公允价值类似，但**不适用**《企业会计准则第 39 号——公允价值计量》；股份支付、租赁中的计量同样不适用。\n7. **2018-15 的落脚点**：广告宣传目的的影视作品制作支出**不能**作为存货（也不符合无形资产确认条件）资本化，因为**不能确定该支出预期能够给企业带来经济利益**，应当于**发生时一次性计入当期损益（销售费用）**——结论是**错误**。判这类题就一句话：**先看是否满足资产的确认条件，再看该支出的性质是不是\"使资产达到预定用途\"的成本**。\n\n## 本章分录模板\n\n本章为总论，无独立分录。唯一与本章直接相关的分录（2018-15 的正确处理、教材定位在第二章/第四章）：\n\n```\n广告宣传目的的影视作品制作支出（不满足资产确认条件）\n借：销售费用\n    贷：银行存款 / 应付账款等\n\n对照：为生产产品、提供劳务等日常活动发生的、满足资本化条件的支出\n借：存货 / 无形资产（开发支出）等\n    贷：银行存款 / 应付账款等\n```\n\n## 与其他章的联动\n\n- **与第二章（存货）、第四章（无形资产）、第十七章（收入）**：2018-15 就是四章联考题。判断\"某笔支出能否资本化\"，必须回到本章的**资产确认条件**（经济利益很可能流入＋成本能可靠计量）和**费用确认条件**（很可能流出＋导致资产减少或负债增加＋金额可靠计量），再叠加各章的具体资本化门槛（存货的可变现净值、无形资产开发阶段五条件、收入的履约义务与控制权转移）。\n- **与第三章（固定资产）**：**融资租入固定资产按经济实质视同自有资产**，是\"实质重于形式\"最标准的举例；弃置费用的计量属性为**现值**。\n- **与第七章（资产减值）、第五章（投资性房地产）、第十三章（金融工具）**：这些章节在后续计量中选用**公允价值**或**现值**，其正当性依据都来自本章的计量属性选用原则——\"一般应当采用历史成本，采用其他计量属性应保证所确定的金额能够取得并可靠计量\"。\n- **与第二十九章（公允价值计量）**：本章只给出公允价值的定义（**脱手价格**、有序交易、主要市场/最有利市场）与适用范围，**详细规则（四个基本要求、主要市场与最有利市场、估值技术三法、三个层次输入值、非金融资产最佳用途、不履约风险、金融资产与负债组合净敞口计量）全部在第二十九章**，两章的定义必须一字不差地一致记忆。\n- **与第二十四章（会计政策、会计估计及其变更和差错更正）、第二十五章（资产负债表日后事项）**：**重要性**与**谨慎性**是判断\"该差错是否重要到需要追溯重述\"的直接依据；**实质重于形式**是判断\"该交易是调整事项还是非调整事项\"的底层逻辑。\n",
    "2": "# 第二章 存货\n\n> 本题库考察频次：2 题 ｜ 优先级：C 类（低频章，≤4 题） ｜ 建议投入：通读一遍 + 把「可变现净值」的计算默写熟（本章是后续所有资产减值、所得税、合并抵销的地基）\n\n---\n\n## 一、存货的范围与确认\n\n### 存货的定义与内容（六类）\n- **优先级**：★★★\n- **内容**：存货＝企业在日常活动中持有以备出售的产成品或商品、处在生产过程中的在产品、在生产过程或提供劳务过程中耗用的材料和物料等。教材列举六类：①原材料；②在产品；③半成品；④产成品；⑤商品；⑥周转材料。\n- **易错**：①消耗性生物资产**不属于**本章存货范围；②通过建造等服务合同归集的合同履约成本按收入准则处理，不按存货准则；③企业日常活动中持有、最终目的用于出售的数据资源，符合定义和确认条件的应确认为存货（如汽车销售企业购进用于销售的二手车）；④周转材料若符合固定资产定义，应当作为固定资产处理。\n- **考察**：—\n\n### 存货的确认条件\n- **优先级**：★★\n- **内容**：符合定义 + 同时满足两个条件：①与该存货有关的经济利益**很可能流入**企业；②该存货的成本**能够可靠计量**。\n- **易错**：教材主要靠「广告宣传目的的影视作品制作支出」这类案例考这一点——不符合存货（也不能确认为无形资产）的支出，应当于发生时一次性计入当期损益（销售费用）。见 2018 年 15 题。\n- **考察**：2018-15\n\n---\n\n## 二、存货的初始计量\n\n### 外购存货的成本构成\n- **优先级**：★★\n- **内容**：外购存货成本＝购买价款＋相关税费＋运输费＋装卸费＋保险费＋其他可归属于采购成本的费用；**不包括**按规定可以抵扣的增值税进项税额。\n- **要点**：\n  - 相关税费：进口关税、消费税、资源税、**不能抵扣的增值税进项税额**。\n  - 其他可归属费用：采购过程中的仓储费、包装费、运输途中**合理损耗**、入库前挑选整理费；能分清负担对象的直接计入，不能分清的按数量或采购价格比例分配。\n  - 采购过程中的毁损短缺：向供货单位、外部运输机构收回的赔偿冲减采购成本；**定额内合理损耗**计入采购成本；**超定额损耗/自然灾害等非正常损失**计入当期损益（管理费用/营业外支出）。\n  - 商品流通企业进货费用计入所购商品成本；金额较小的可在发生时直接计入当期销售费用。\n- **易错**：合理损耗**只增加单位成本、不减少总成本**（总成本不变，入库数量减少）；非正常损耗则要从成本中剔除。\n- **考察**：—\n\n### 加工取得存货的成本\n- **优先级**：★★\n- **内容**：由采购成本＋加工成本构成，某些还包括可直接认定的产品设计费等「使存货达到目前场所和状态的其他成本」。加工成本＝直接人工＋制造费用，**不含**由材料转移来的价值。\n- **要点**：制造费用包括生产部门管理人员职工薪酬、折旧费、办公费、水电费、机物料消耗、劳动保护费、季节性及修理期间停工损失等；停工停产期间符合存货成本确认条件的固定资产折旧、无形资产摊销也应计入相应存货成本。\n- **不应当计入存货成本、应于发生时计入当期损益的三项**：①非正常消耗的直接材料、直接人工及制造费用（如超定额废品损失、自然灾害损失）；②采购入库**后**的仓储费用（但生产过程中为达到下一个生产阶段所必需的仓储费应计入存货成本，如酒的陈酿）；③不能归属于使存货达到目前场所和状态的其他支出。\n- **易错**：制造费用与期间费用的边界是常考陷阱，「入库前的挑选整理费计入、入库后的仓储费不计入」。\n- **考察**：—\n\n### 盘盈存货的成本\n- **优先级**：★\n- **内容**：盘盈存货按**重置成本**作为入账价值，通过「待处理财产损溢」核算，报经批准后处理。\n- **易错**：与固定资产盘盈（作为前期差错，通过「以前年度损益调整」）对比记忆——存货盘盈用的是重置成本，不是前期差错更正。\n- **考察**：—\n\n---\n\n## 三、发出存货的计量（成本流转假设）\n\n### 发出存货成本的计价方法\n- **优先级**：★\n- **内容**：发出存货成本的计价方法包括先进先出法、月末一次加权平均法、移动加权平均法、个别计价法等；计价方法一经确定不得随意变更，变更属会计政策变更。\n- **计算**：\n  - 月末一次加权平均：单价＝（月初成本＋本月全部购入成本）÷（月初数量＋本月全部购入数量）；**月末才计算，平时无法反映结存**。\n  - 移动加权平均：每次进货后重新计算单价＝（原结存成本＋本次购入成本）÷（原结存数量＋本次购入数量）。\n- **易错**：①教材 OCR 中「第二节 发出存货的计量」标题可辨（目录行可读），但具体计价方法的正文段落**未能从 OCR 中稳定抽出**，故本条只列准则层面的通用规则，不做教材定位。②先进先出法在物价上涨期会高估期末存货、低估销货成本。\n- **考察**：—\n\n---\n\n## 四、周转材料\n\n### 周转材料的范围与处理\n- **优先级**：★\n- **内容**：周转材料指企业能够多次使用、但不符合固定资产定义的材料——为包装本企业商品而储备的各种包装物、各种工具、管理用具、玻璃器皿、劳动保护用品、经营过程中周转使用的容器，以及低值易耗品和建造承包商的钢模板、木模板、脚手架等。\n- **要点**：周转材料符合固定资产定义的，应作为固定资产处理（对应第 3 章）；一般通过「周转材料」科目核算，摊销可采用一次转销法或五五摊销法。\n- **易错**：包装物若随同商品出售且**不单独计价**，计入销售费用；**单独计价**的，作为销售商品处理（其他业务收入/其他业务成本）。\n- **考察**：—\n\n---\n\n## 五、期末计量与存货跌价准备（本章主线）\n\n### 可变现净值的定义与构成\n- **优先级**：★★★\n- **内容**：可变现净值＝存货的**估计售价**－估计的**销售费用**－**相关税费**。它不是售价或合同价，而是预计未来**净**现金流入。\n- **计算**（两类存货的构成不同，务必分开背）：\n  | 存货类型 | 可变现净值公式 |\n  |---|---|\n  | 产成品、商品、用于出售的材料等**直接出售**的存货 | 估计售价 － 估计销售费用 － 相关税费 |\n  | 需要**经过加工**的材料存货 | 所生产**产成品**的估计售价 － 至完工时估计将要发生的成本 － 估计销售费用 － 相关税费 |\n- **易错**：①材料存货不能直接用自己的售价减去自己的费用，必须**先算产成品**；②关键变量是「估计售价」的选取，见下条。\n- **考察**：2021-5\n\n### 存货估计售价的确定（必须区分有无合同）\n- **优先级**：★★★\n- **内容**：五条规则：\n  1. 为执行销售合同或劳务合同而持有的存货，以**合同价格**为基础；若合同标的物尚未生产出来，但持有专门用于该标的物生产的原材料，其可变现净值**也以合同价格为计算基础**。\n  2. 持有数量**多于**合同订购数量：超出部分以一般销售价格（市场销售价格）为基础。\n  3. 持有数量**少于**合同订购数量：实际持有的存货以**合同价格**为基础；该合同若为亏损合同，还应按或有事项准则处理。\n  4. 没有销售合同约定的存货（不含用于出售的材料）：以产成品或商品的一般销售价格为基础。\n  5. 用于出售的材料：以市场价格为基础；若存在销售合同约定，按合同价格。\n- **易错**：**同一项存货**中一部分有合同价、另一部分没有合同价的，应当**分别确定**可变现净值、分别与其对应成本比较，分别确定跌价准备的计提或转回金额，**由此计提的存货跌价准备不得相互抵销**。这是命题人最爱的陷阱。\n- **考察**：2021-5\n\n### 材料存货的期末计量（两步判断法）\n- **优先级**：★★★\n- **内容**：材料存货的期末价值，以**其所生产的产成品的可变现净值与产成品成本的比较**为基础确定：\n  1. 若用该材料生产的**产成品的可变现净值预计高于产成品成本** → 材料**仍按成本**计量，不计提跌价准备（哪怕材料本身的市价已经下跌）。\n  2. 若**材料价格下降表明产成品的可变现净值低于产成品成本** → 材料应按其**可变现净值**计量，差额计提存货跌价准备。\n- **计算**：材料跌价准备＝材料成本 －（产成品估计售价 － 至完工估计将发生成本 － 估计销售费用及相关税费）\n- **易错**：容易犯的错是直接拿「材料市价 vs 材料成本」比较；正确做法是**穿透到产成品**。\n- **考察**：2021-5\n\n### 存货跌价准备的计提方法（单个／类别／合并）\n- **优先级**：★★\n- **内容**：①通常按**单个存货项目**计提，逐项比较成本与可变现净值取较低者；②数量繁多、单价较低的存货，可按**存货类别**计提；③与同一地区生产和销售的产品系列相关、具有相同或类似最终用途或目的且难以分开计量的存货，可**合并**计提。\n- **易错**：按类别/合并计提会「以盈掩亏」，考试中若题目明确要求按单项计提，就不能用类别数据互相抵销。\n\n### 表明可变现净值低于成本、以及可变现净值为零的情形\n- **优先级**：★★\n- **内容**：\n  - 通常表明**可变现净值低于成本**的五种情形：①市场价格持续下跌且可预见未来无回升希望；②使用该项原材料生产的产品的**成本大于销售价格**；③因产品更新换代，原有库存原材料已不适应新产品需要，而该原材料市场价格又低于账面成本；④因商品或劳务过时、消费者偏好改变导致市场需求变化，价格逐渐下跌；⑤其他足以证明确已减值的情形。\n  - 通常表明**可变现净值为零**的四种情形：①已霉烂变质；②已过期且无转让价值；③生产中已不再需要且已无使用价值和转让价值；④其他足以证明已无使用价值和转让价值。\n- **易错**：「持续下跌」＋「无回升希望」两个条件要同时具备，只跌不涨的短期波动不算。\n- **考察**：—\n\n### 存货跌价准备的转回（限额规则）\n- **优先级**：★★★\n- **内容**：转回条件是「以前减记存货价值的影响因素**已经消失**」，而不是当期造成可变现净值高于成本的其他影响因素；转回金额**以将存货跌价准备余额冲减至零为限**，冲减额贷记「资产减值损失——存货减值损失」。\n- **计算例题（教材例 2-2）**：W7 型机器账面成本 500 万元。\n  - 2×22 年末可变现净值 400 万元 → 计提跌价准备 **100 万元**。\n  - 2×23 年 6 月 30 日可变现净值回升至 475 万元 → 应有余额 500－475＝25 万元，当期**转回 75 万元**（100－25）。\n    ```\n    借：存货跌价准备      750 000\n      贷：资产减值损失——存货减值损失  750 000\n    ```\n  - 2×23 年 12 月 31 日可变现净值 555 万元（已高于成本）→ 应有余额为 0，当期**只能转回 25 万元**（不是 555－500＝55 万元），因为余额冲减至零为限。\n- **易错**：恢复后可变现净值高于成本的差额**不能**确认为收益，转回额以原计提额为上限。\n- **考察**：2021-5\n\n### 存货跌价准备的结转\n- **优先级**：★★\n- **内容**：已计提跌价准备的存货部分对外销售时，结转销售成本的同时应**结转**已计提的存货跌价准备；因债务重组、非货币性资产交换转出的存货也应同时结转。\n- **计算**：按类别计提的，按**转出存货成本占该类别未转出前成本的比例**结转相应跌价准备。\n- **易错**：结转跌价准备冲减的是「主营业务成本/其他业务成本」，不是「资产减值损失」——计提走损失，结转走成本。\n- **考察**：—\n\n### 存货清查（盘盈盘亏）\n- **优先级**：★★\n- **内容**：通过「待处理财产损溢」核算，报经批准后：\n  - 属于计量收发差错和管理不善造成的短缺：扣除残料价值、可收回保险赔偿和过失人赔偿后，净损失计入**管理费用**。\n  - 属于自然灾害等非常原因造成的毁损：扣除处置收入、保险及过失人赔偿后，净损失计入**营业外支出**。\n  - 属于重大会计差错的，按第 28 号准则（前期差错更正）处理。\n  - 盘盈：属自然溢余的调整库存数量及单位成本；属日常收发计量且不重大的差错，按重置成本冲减当期管理费用或计入营业外收入。\n- **易错**：因盘亏或毁损按规定**不能抵扣的增值税进项税额应当转出**。\n- **考察**：—\n\n### 存货的列示\n- **优先级**：★\n- **内容**：资产负债表「存货」项目＝「材料采购」＋「在途物资」＋「原材料」＋「库存商品」＋「发出商品」＋「委托加工物资」＋「周转材料」＋「生产成本」＋「合同履约成本（初始确认时摊销期限不超过一年或一个正常营业周期）」等科目期末余额合计，**减去**「存货跌价准备」「合同履约成本减值准备」「商品进销差价」等科目期末余额；计划成本核算的还应加减「材料成本差异」。\n- **考察**：—\n\n---\n\n## 本章易错陷阱汇总\n\n1. **可变现净值 ≠ 售价/合同价**：必须先减估计销售费用和相关税费；材料存货还要再减「至完工估计将发生的成本」。\n2. **有无合同必须分开算**：同一项存货一部分有合同价、一部分无合同价的，分别确定可变现净值，**计提的跌价准备不得相互抵销**。\n3. **材料存货不能只看自己**：要穿透到「用该材料生产的产成品」的可变现净值与成本比较；产成品没跌价，材料就不计提。\n4. **跌价准备转回有上限**：以原计提余额冲减至零为限，回升超过成本的部分不确认收益。\n5. **合理损耗 vs 非正常损耗**：合理损耗计入采购成本（只抬高单位成本）；非正常损耗计入当期损益。\n6. **入库前 vs 入库后**：入库前挑选整理费、采购中仓储费计入成本；入库**后**的仓储费计入当期损益（唯一例外：为达到下一生产阶段所必需的仓储费，如陈酿）。\n7. **周转材料的双重身份**：符合固定资产定义的周转材料按固定资产处理。\n8. **盘盈用重置成本，不是前期差错**（与固定资产盘盈相反）。\n\n## 本章分录模板\n\n```\n【计提存货跌价准备】\n借：资产减值损失——存货减值损失\n  贷：存货跌价准备\n\n【转回存货跌价准备（以余额冲减至零为限）】\n借：存货跌价准备\n  贷：资产减值损失——存货减值损失\n\n【销售时结转跌价准备】\n借：主营业务成本（其他业务成本）\n    存货跌价准备\n  贷：库存商品（原材料等）\n\n【存货盘亏（管理不善，净损失）】\n借：待处理财产损溢\n  贷：原材料/库存商品等\n      应交税费——应交增值税（进项税额转出）\n借：管理费用（营业外支出——非常损失）\n    其他应收款（赔偿）\n  贷：待处理财产损溢\n\n【存货盘盈（非重大差错，按重置成本）】\n借：原材料/库存商品等\n  贷：待处理财产损溢\n借：待处理财产损溢\n  贷：管理费用\n```\n\n## 与其他章的联动\n\n- **与第 12 章（或有事项）**：亏损合同若存在**标的资产**，应先对标的资产计提减值（存货跌价准备 / 资产减值损失），**只有超过标的资产减值的部分**才确认预计负债（营业外支出）；无标的资产的亏损合同直接确认预计负债。本题库 2016-2 就是考这条边界：跌价准备与预计负债不能重复确认。\n- **与第 7 章（资产减值）**：存货跌价准备**可以转回**，而固定资产、无形资产、投资性房地产（成本模式）的减值准备**一经计提不得转回**——这是最常考的对比。\n- **与第 19 章（所得税）**：存货跌价准备计提当期形成**可抵扣暂时性差异**，确认递延所得税资产（本题库 2021-5 明确要求确认递延所得税资产 10 万元）；存货的账面价值＝成本－跌价准备，计税基础＝成本。\n- **与第 4 章（无形资产）**：研发过程中产出的、符合存货定义和确认条件的产品或副产品，应确认为存货；而**已费用化的研发样机支出不得在以后期间冲回转入存货**（教材例 4-5）。\n- **与第 3 章（固定资产）**：周转材料符合固定资产定义的按固定资产处理；建造承包商的钢模板、木模板、脚手架属周转材料（存货）。\n- **与第 27 章（合并财务报表）**：内部购进存货计提的跌价准备在合并层面要区分「相对于集团成本多提的部分（可转回抵销）」和「集团本身已减值的部分（不予抵销）」，连续编制时还要抵销上期资产减值损失对期初未分配利润的影响。\n- **与第 25 章（资产负债表日后事项）**：资产负债表日后存货售价波动，若能对资产负债表日已存在情况提供新的或进一步证据，则在确定可变现净值时予以考虑，否则不考虑。\n",
    "3": "# 第三章 固定资产\n\n> 本题库考察频次：8 题 ｜ 优先级：B 类（常考章，5–13 题） ｜ 建议投入：重点掌握 + 默写折旧四种方法（尤其双倍余额递减法最后两年改直线）与弃置费用的全过程分录\n\n---\n\n## 一、固定资产的定义、特征与确认\n\n### 固定资产的定义与三个特征\n- **优先级**：★★★\n- **内容**：固定资产＝同时具有下列特征的有形资产：①为**生产商品、提供劳务、出租或经营管理**而持有；②**使用寿命超过一个会计年度**。三个特征：目的（劳动手段而非直接出售的产品）、寿命（长期资产）、有形（有实物形态）。\n- **易错**：①「出租」的固定资产仅指用于出租的**机器设备类**固定资产，**不包括出租的建筑物**——以经营租赁方式出租的建筑物属于**投资性房地产**；②出租的建筑物不因「出租」而变成固定资产；③使用寿命可以是预计期间，也可以是所能生产产品或提供劳务的**数量**（发电设备按发电量、汽车/飞机按行驶或飞行里程）；④没有实物形态的资产即使符合其他特征也不是固定资产（是无形资产）。\n- **考察**：—\n\n### 固定资产的确认条件与初始计量总原则\n- **优先级**：★★\n- **内容**：同时满足①与该固定资产有关的**经济利益很可能流入**企业；②该固定资产的**成本能够可靠计量**，才能确认。初始计量＝取得成本，即达到**预定可使用状态前**所发生的一切合理的、必要的支出。\n- **易错**：「达到预定可使用状态」是贯穿本章的时间界线——转固、停止借款费用资本化、开始计提折旧都以它为准。\n- **考察**：2017-9、2020-5\n\n---\n\n## 二、固定资产的初始计量\n\n### 外购固定资产的成本\n- **优先级**：★★\n- **内容**：＝购买价款＋相关税费＋使固定资产达到预定可使用状态前发生的可归属于该项资产的运输费、装卸费、安装费和**专业人员服务费**等；**不包括**按规定可抵扣的增值税进项税额。\n- **易错**：①**员工培训费**不计入固定资产成本（计入当期损益）；②不需要安装的固定资产购入即可达到预定可使用状态；③一笔款项购入多项没有单独标价的固定资产，按**各项资产公允价值比例**分配总成本。\n\n### 分期付款（具有融资性质）购入固定资产\n- **优先级**：★★★\n- **内容**：超过正常信用条件延期支付、实质上具有融资性质的，固定资产成本按**各期付款额的现值之和**确定，差额计入「未确认融资费用」，在信用期间内按**实际利率法**摊销。\n- **计算/分录（教材例 3-1 思路）**：\n  - 购买价款现值＝每期付款额×年金现值系数（教材数据：900 000×6.1446＝5 530 140 元，总价 9 000 000 元，未确认融资费用 3 469 860 元）。\n  ```\n  借：在建工程——××设备              5 530 140\n      未确认融资费用                  3 469 860\n    贷：长期应付款——乙公司            9 000 000\n  ```\n  - 每期分摊：\n  ```\n  借：在建工程（安装期间，符合资本化条件）\n     财务费用（达到预定可使用状态后）\n    贷：未确认融资费用\n  借：长期应付款\n    贷：银行存款\n  ```\n- **易错**：①**安装期间**的融资费用分摊额符合资本化条件计入固定资产成本；**达到预定可使用状态后**的分摊额计入财务费用；②教材该例中固定资产最终成本＝5 530 140＋553 014＋518 315.40＋398 530.60＝**7 000 000 元**（分期付款本金＋资本化融资费用）。\n- **考察**：—\n\n### 自行建造固定资产的成本（在建工程）\n- **优先级**：★★★\n- **内容**：由建造该项资产达到预定可使用状态前所发生的必要支出构成：工程用物资成本、人工成本、缴纳的相关税费、**应予资本化的借款费用**以及应分摊的间接费用等。实务中通过「在建工程」科目核算，分自营与出包两种方式。\n- **要点**：\n  - **待摊支出**：不能直接计入某项固定资产价值、应由所建造固定资产共同负担的费用——管理费、可行性研究费、临时设施费、公证费、监理费、应负担的税金、符合资本化条件的借款费用、建设期间发生的**工程物资盘亏、报废及毁损净损失**、负荷联合试车费等。\n  - 待摊支出分配率＝累计发生的待摊支出÷（建筑工程支出＋安装工程支出＋在安装设备支出）×100%。\n  - **为建造固定资产通过出让方式取得土地使用权而支付的土地出让金，不计入在建工程成本，应确认为无形资产（土地使用权）**。\n  - **试运行销售**：将固定资产达到预定可使用状态前产出的产品或副产品对外销售的，应按收入、存货准则分别确认收入和成本计入**当期损益**，**不得**将试运行销售收入抵销成本后的净额冲减固定资产成本。\n  - 已达预定可使用状态但尚未办理竣工结算的，应按**暂估价值**转入固定资产并计提折旧；**待办理竣工决算后按实际成本调整原来的暂估价值，但不需要调整原已计提的折旧额**。\n- **易错**：①工程物资盘亏、报废及毁损**净损失**在建设期间计入在建工程（作为待摊支出），这是与生产期盘亏（营业外支出）的区别；②「负荷联合试车费」计入成本，而「试运行对外销售产品」的收入成本走损益——两者不可混。\n- **考察**：2017-9、2018-17、2020-5\n\n### 投资者投入、非货币性资产交换/债务重组/企业合并取得的固定资产\n- **优先级**：★★\n- **内容**：①投资者投入：按投资合同或协议**约定的价值**＋应支付的相关税费作为入账价值；约定价值**不公允**的，按**公允价值**入账，公允与约定价值的差额计入**资本公积**。②通过非货币性资产交换、债务重组、企业合并取得的，分别按第 7 号、第 12 号、第 20 号准则确定成本，但**后续计量和披露执行固定资产准则**。\n- **易错**：非同一控制下企业合并中取得的固定资产按**购买日公允价值**计量，并以此为基础在购买方账上计提折旧（本题库 2018-1 涉及以固定资产等非货币性资产出资、2016 年企业合并题涉及购买日公允价值调整）。\n- **考察**：2018-1\n\n### 存在弃置义务的固定资产（弃置费用）★★★必背\n- **优先级**：★★★\n- **内容**：弃置费用通常指根据国家法律、行政法规、国际公约等规定，企业承担的**环境保护和生态恢复**等义务所确定的支出。对特殊行业的特定固定资产，应按或有事项准则，**按现值**计入固定资产成本，同时确认**预计负债**。确认后，在固定资产使用寿命内按预计负债的**摊余成本和实际利率**计算确定的利息费用，在发生时计入**财务费用**。\n- **计算/分录（教材例题数据）**：核反应堆建造成本 2 500 000 万元，使用寿命 40 年，预计弃置费用 250 000 万元，折现率 10%，(P/F,10%,40)＝0.0221。\n  - 弃置费用现值＝250 000×0.0221＝**5 525 万元**；固定资产成本＝2 500 000＋5 525＝**2 505 525 万元**。\n  ```\n  借：固定资产——××核反应堆        25 055 250 000\n    贷：在建工程——××核反应堆        25 000 000 000\n        预计负债——弃置费用                55 250 000\n  ```\n  - 第 1 年利息费用＝55 250 000×10%＝5 525 000 元：\n  ```\n  借：财务费用              5 525 000\n    贷：预计负债——弃置费用     5 525 000\n  ```\n- **弃置义务后续变动的调整原则（必背）**：\n  - 因技术进步、法律要求或市场环境变化导致**支出金额、预计弃置时点、折现率**变动：\n    ① 预计负债**减少**：以该固定资产**账面价值为限**扣减固定资产成本；减少额**超过**固定资产账面价值的，超出部分**确认为当期损益**。\n    ② 预计负债**增加**：**增加**该固定资产成本。\n    ③ 按上述原则调整的固定资产，在**剩余使用年限内**计提折旧；一旦固定资产使用寿命结束，预计负债的所有后续变动应在发生时**确认为损益**。\n  - 教材示例：2×26 年末弃置费用由 250 000 万元降至 200 000 万元，折现率不变，预计负债减少 1 780 万元，冲减固定资产成本：\n  ```\n  借：预计负债——弃置费用   17 800 000\n    贷：固定资产——××核反应堆  17 800 000\n  ```\n- **注意**：**一般工商企业的固定资产发生的报废清理费用不属于弃置费用**，应在发生时作为固定资产处置费用处理。\n- **易错**：①弃置费用的「现值」用的是**预计弃置时点的支出**折现，不是累计折旧；②减少预计负债时「以账面价值为限」是经典陷阱（超过部分走损益）；③后期利息费用只走财务费用，**不再**计入固定资产成本（因为资产已达预定可使用状态）。\n- **考察**：—（本题库未直接考，但教材例题完整，属必背计算）\n\n---\n\n## 三、固定资产的折旧（本章最高频）\n\n### 影响折旧的因素与计提范围\n- **优先级**：★★★\n- **内容**：影响折旧的四个因素：①固定资产**原价**；②**使用寿命**（应考虑预计生产能力或实物产量、预计有形损耗、预计无形损耗、法律或类似规定对使用的限制）；③**预计净残值**；④固定资产**减值准备**。\n- **计提范围**：应当对**所有**固定资产计提折旧，但以下两项除外：①**已提足折旧仍继续使用**的固定资产；②**单独计价入账的土地**。\n- **计提起点与终点**：固定资产**应当按月计提折旧**，自**达到预定可使用状态时**开始计提，**终止确认时或划分为持有待售非流动资产时停止计提**。\n- **易错**：**当月增加的固定资产当月不提折旧，从下月起计提；当月减少的固定资产当月仍提折旧，从下月起停止计提**。教材例 3-6 中当月新购置的生产设备，**本月不提折旧，应从下月（2×22 年 2 月）开始计提**。计提减值准备后，应在剩余使用寿命内按**调整后的账面价值**（原价－累计折旧－累计减值准备）和预计净残值重新计算折旧率和折旧额。\n- **考察**：2017-9、2020-5、2021-12\n\n### 折旧方法一：年限平均法（直线法）\n- **优先级**：★★★\n- **内容**：将应计折旧额**均衡**地分摊到预计使用寿命内，每期折旧额相等。\n- **计算**：\n  ```\n  年折旧率 ＝（1 － 预计净残值率）÷ 预计使用寿命（年）× 100%\n  月折旧率 ＝ 年折旧率 ÷ 12\n  月折旧额 ＝ 固定资产原价 × 月折旧率\n  ```\n- **易错**：公式的分子是**原价×（1－净残值率）**，不是「原价÷年限」。用净残值**率**时按原价乘，用净残值**额**时直接从原价中减。\n- **考察**：2017-9、2020-5\n\n### 折旧方法二：双倍余额递减法 ★★★（带数字必背）\n- **优先级**：★★★\n- **内容**：在**不考虑预计净残值**的情况下，根据每期期初固定资产**净值**（原价－累计折旧）和**双倍的直线法折旧率**计算折旧。\n- **计算**：\n  ```\n  年折旧率 ＝ 2 ÷ 预计使用寿命（年）× 100%\n  月折旧率 ＝ 年折旧率 ÷ 12\n  月折旧额 ＝ 固定资产净值 × 月折旧率\n  ```\n- **关键规则**：由于每年年初固定资产净值**没有扣除预计净残值**，必须注意不能使净值降到预计净残值以下，即应在折旧年限**到期前两年内**，将固定资产净值扣除预计净残值后的余额**平均摊销**（改按直线法）。\n- **计算例题（教材例 3-4）**：设备原价 120 万元，预计使用寿命 5 年，预计净残值率 4%，未计提减值准备。年折旧率＝2/5×100%＝**40%**。\n  | 年份 | 计算 | 折旧额（万元） |\n  |---|---|---|\n  | 第 1 年 | 120×40% | **48** |\n  | 第 2 年 | (120－48)×40% | **28.8** |\n  | 第 3 年 | (120－48－28.8)×40% | **17.28** |\n  | 第 4、5 年 | (120－48－28.8－17.28－120×4%)÷2 | **各 10.8**（改为直线法） |\n- **易错**：①前三年计算时**完全不减残值**，只对净值乘 40%；②判断「最后两年」的时点＝折旧年限到期前 2 年（本例第 4 年起），**不是**等净值降到残值才改；③最后两年的分子要**扣除预计净残值 120×4%＝4.8 万元**。\n- **考察**：—（本题库 2020-5、2022-3 涉及加速折旧与税法差异，见第 19 章联动）\n\n### 折旧方法三：年数总和法（年限合计法）★★★\n- **优先级**：★★★\n- **内容**：将固定资产的**原价减去预计净残值的余额**（应计折旧额）乘以一个**逐年递减的分数**计算折旧。\n- **计算**：\n  ```\n  年折旧率 ＝ 尚可使用年限 ÷ 预计使用年限的年数总和 × 100%\n  年折旧额 ＝（固定资产原价 － 预计净残值）× 年折旧率\n  ```\n- **计算例题（教材表 3-2）**：应计折旧额 1 152 000 元，5 年，年数总和＝5+4+3+2+1＝**15**。\n  | 年份 | 尚可使用年限 | 分数 | 年折旧额（元） | 累计折旧（元） |\n  |---|---|---|---|---|\n  | 第 1 年 | 5 | 5/15 | 384 000 | 384 000 |\n  | 第 2 年 | 4 | 4/15 | 307 200 | 691 200 |\n  | 第 3 年 | 3 | 3/15 | 230 400 | 921 600 |\n  | 第 4 年 | 2 | 2/15 | 153 600 | 1 075 200 |\n  | 第 5 年 | 1 | 1/15 | 76 800 | 1 152 000 |\n- **易错**：①年数总和法的基数是**原价－净残值**（与双倍余额递减法的「净值」完全不同）；②双倍余额递减法**前几年不扣残值**，年数总和法**每年都按扣除残值后的余额**乘分数——这是两者的核心区别点，也是命题人最爱设的对比陷阱；③两者都属于**加速折旧法**，早期多提、后期少提。\n- **考察**：2020-5、2022-3\n\n### 折旧的会计处理（按用途归属）\n- **优先级**：★★★\n- **内容**：按月计提，通过「累计折旧」核算，按**用途**计入相关资产成本或当期损益：\n  | 固定资产使用部门/用途 | 借方科目 |\n  |---|---|\n  | 基本生产车间 | 制造费用 |\n  | 管理部门 | 管理费用 |\n  | 销售部门 | 销售费用 |\n  | 自行建造固定资产过程中使用 | 在建工程 |\n  | 经营租出的固定资产 | 其他业务成本 |\n- **分录**：\n  ```\n  借：制造费用 / 管理费用 / 销售费用 / 在建工程 / 其他业务成本\n    贷：累计折旧\n  ```\n- **易错**：「经营租出的固定资产」折旧计入**其他业务成本**（因为租金收入走其他业务收入）；而如果是**投资性房地产**（成本模式），折旧计入「其他业务成本」同时贷记「投资性房地产累计折旧」——科目不同。\n- **考察**：2015-13\n\n### 折旧方法变更属会计估计变更（未来适用法）★★★\n- **优先级**：★★★\n- **内容**：企业**至少应当于每年年度终了**，对固定资产的**使用寿命、预计净残值和折旧方法**进行复核。使用寿命、预计净残值、折旧方法与原先估计数有差异的，应当作出相应调整，并**按照会计估计变更处理**——即采用**未来适用法**，不追溯调整，不计算累积影响数，只在变更当期及以后期间按新方法计提。\n- **计算（本题库 2022-3 数据）**：折旧方法由年限平均法改为**年数总和法**，2021 年折旧费用＝225（按原方法 1—? 月）＋393.75（改为年数总和法后）＝**618.75 万元**；由此产生折旧的暂时性差异 168.75 万元，确认**递延所得税资产 42.1875 万元**（＝168.75×25%）。\n- **易错**：①**折旧方法变更＝会计估计变更＝未来适用法**；②**投资性房地产后续计量模式变更（成本模式→公允价值模式）＝会计政策变更＝追溯调整法**——两者绝不能混（本题库 2022-3 与 2015-14/2017-6 正是这组对照）；③复核后改变折旧年限也是会计估计变更，如教材例 3-10 中玻璃幕墙改造：**不能仅依据发生改造就直接认定折旧年限变更**，必须判断是否满足资本化条件并终止确认被替换部分账面价值，同时应复核主体使用寿命并有确凿证据。\n- **考察**：2022-3\n\n---\n\n## 四、固定资产的后续支出\n\n### 资本化的后续支出（改扩建、更新改造）\n- **优先级**：★★★\n- **内容**：符合固定资产确认条件的后续支出计入固定资产成本，同时**将被替换部分的账面价值扣除**（避免重复计算）；不符合资本化条件的计入当期损益。\n- **处理步骤**：\n  1. 将该固定资产的**原价、已计提的累计折旧和减值准备转销**，将**账面价值**转入「在建工程」；转入时**应停止计提折旧**。\n  2. 归集后续支出。\n  3. 完工达到预定可使用状态时，从「在建工程」转为固定资产，按**重新确定的原价、使用寿命、预计净残值和折旧方法**计提折旧。\n- **计算例题（教材例 3-8）**：生产线建造成本 1 136 000 元，年限平均法，预计净残值率 3%，预计使用寿命 6 年。\n  - 应计折旧额＝1 136 000×(1－3%)＝1 101 920 元；年折旧额＝1 101 920÷6＝183 653.33 元。\n  - 2×21、2×22 两年折旧后，2×23 年 1 月 1 日账面价值＝1 136 000－183 653.33×2＝**768 693.34 元**。\n  ```\n  借：在建工程——××生产线        768 693.34\n      累计折旧                    367 306.66\n    贷：固定资产——××生产线        1 136 000\n  借：在建工程——××生产线            537 800\n    贷：银行存款                       537 800\n  借：固定资产——××生产线      1 306 493.34\n    贷：在建工程——××生产线      1 306 493.34\n  ```\n  - 改扩建后使用寿命延长 4 年（共 10 年），净残值率为改扩建后账面价值的 3%：应计折旧额＝1 306 493.34×(1－3%)＝1 267 298.54 元；月折旧额＝1 267 298.54÷（7×12＋9）＝**13 626.87 元**；2×23 年（3 月 31 日转固，当年 9 个月）应提折旧＝13 626.87×9＝**122 641.83 元**。\n  ```\n  借：制造费用      122 641.83\n    贷：累计折旧      122 641.83\n  ```\n- **易错**：①改扩建期间**不提折旧**；②转固后按**重新确定的**原价、寿命、净残值、方法计提，且**当月增加的固定资产下月才提**——本例 3 月 31 日转固，当年只提 **9 个月**（4—12 月），不是 12 个月、也不是 10 个月；③净残值率的分母是**改扩建后的账面价值**。\n\n### 替换组成部分的处理\n- **优先级**：★★★\n- **内容**：后续支出涉及**替换原固定资产某组成部分**时，符合资本化条件的应计入固定资产成本，同时**将被替换部分的账面价值扣除**。\n- **计算例题（教材例 3-9，飞机更换发动机）**：飞机总计 8 000 万元（含发动机），发动机当时购价 500 万元，年折旧率 3%。\n  - 2×29 年初累计折旧＝80 000 000×3%×8＝19 200 000 元，转入在建工程。\n  - 老发动机账面价值＝5 000 000－5 000 000×3%×8＝**3 800 000 元**，终止确认：\n  ```\n  借：营业外支出        3 800 000\n    贷：在建工程——××飞机  3 800 000\n  ```\n  - 新发动机购价 7 000 000＋安装费 51 000＝7 051 000 元计入在建工程。\n  - 飞机入账价值＝60 800 000（转入在建的飞机账面价值）＋7 051 000－3 800 000＝**64 051 000 元**。\n- **易错**：老发动机的账面价值按「原价－按原价与年折旧率计算的累计折旧」计算（3%×8 年），**不能用飞机整体的账面价值比例反推**；剔除时借记「营业外支出」（报废处理，无残值）。\n- **考察**：2020-5\n\n### 费用化的后续支出\n- **优先级**：★★\n- **内容**：与固定资产有关的**修理费用**等后续支出，不符合资本化条件的，在发生时按**受益对象**计入当期损益或计入相关资产的成本。企业对固定资产进行**定期检查**发生的大修理费用，有确凿证据表明符合资本化条件的部分可计入固定资产成本或其他相关资产成本；不符合资本化条件的应费用化计入当期损益。\n- **易错**：日常修理费用（管理费用/销售费用/制造费用视用途）vs 大修理费用（有条件可资本化），先判断是否满足资本化条件。\n- **考察**：2017-9\n\n---\n\n## 五、固定资产的处置\n\n### 出售、转让、报废、毁损的处置路径\n- **优先级**：★★★\n- **内容**：\n  - **划分为持有待售类别**的固定资产或处置组 → 按第 15 章持有待售的规定处理。\n  - **未划分为持有待售**的出售、转让 → 通过「固定资产清理」归集，处置收入扣除账面价值和相关税费后的利得或损失转入**「资产处置损益」**。\n  - 因**报废或毁损**等原因终止确认 → 通过「固定资产清理」归集，产生的利得或损失计入**营业外收入或营业外支出**。\n- **处置四步骤**：\n  1. **转入清理**：按账面价值借记「固定资产清理」，按已提折旧借记「累计折旧」，按已提减值借记「固定资产减值准备」，按账面余额贷记「固定资产」。\n  2. **清理费用**：借记「固定资产清理」，贷记「银行存款」「应交税费」等。\n  3. **出售收入和残料**：收到价款、残料价值和变价收入时冲减清理支出，借记「银行存款」「原材料」等，贷记「固定资产清理」。\n  4. **结转净损益**：正常出售转让转「资产处置损益」；报废毁损转「营业外收入/支出」。\n- **易错**：**弃置费用对应的预计负债**在固定资产处置时应一并结转；划分为持有待售后**不再通过「固定资产清理」**，而是按第 15 章走「资产处置损益」。\n- **考察**：2018-1、2021-12\n\n### 固定资产盘亏与盘盈\n- **优先级**：★★\n- **内容**：\n  - **盘亏**：借记「待处理财产损溢——待处理固定资产损溢」（按账面价值）、「累计折旧」、「固定资产减值准备」，贷记「固定资产」（原价）；报经批准后，按可收回的保险赔偿或过失人赔偿借记「其他应收款」，按应计入营业外支出的金额借记「营业外支出——盘亏损失」，贷记「待处理财产损溢」。\n  - **盘盈**：作为**前期差错**处理，先通过「以前年度损益调整」科目核算，按第 28 号准则处理。\n- **易错**：固定资产盘盈走「以前年度损益调整」（前期差错），**存货盘盈走重置成本**——方向相反，常考对比。\n- **考察**：—\n\n---\n\n## 本章易错陷阱汇总\n\n1. **折旧起始月份**：当月增加的固定资产**当月不提**、下月起提；当月减少的**当月仍提**、下月起停提。改扩建转固的，按转固月份的次月起计提（教材例 3-8 中 3 月 31 日转固，当年只提 9 个月）。\n2. **双倍余额递减法前几年不扣残值、最后两年改直线**：判断「最后两年」用「折旧年限到期前 2 年」，不是等净值降到残值。\n3. **双倍余额递减法的基数是「净值」，年数总和法的基数是「原价－净残值」**——最经典的对比陷阱。\n4. **一般工商企业的报废清理费用不是弃置费用**，在发生时作为处置费用处理；只有特殊行业（核电站、油气开采等）因法律或国际公约承担的环保与生态恢复义务才是弃置费用。\n5. **弃置义务预计负债减少时以固定资产账面价值为限扣减**，超出部分确认为当期损益。\n6. **在建工程与无形资产的分界**：为建造固定资产通过出让方式取得土地使用权支付的土地出让金**不计入在建工程**，应确认为无形资产。\n7. **试运行销售不能冲减固定资产成本**：试运行产出的产品或副产品对外销售，收入与成本分别计入当期损益。\n8. **竣工决算后调整暂估价值但不调整已提折旧**。\n9. **折旧方法变更＝会计估计变更＝未来适用法**（对比：投资性房地产计量模式变更＝会计政策变更＝追溯调整法）。\n10. **出租的建筑物是投资性房地产，不是固定资产**；出租机器设备的折旧计入其他业务成本。\n11. **固定资产盘盈是前期差错（以前年度损益调整），存货盘盈是重置成本**。\n\n## 本章分录模板\n\n```\n【外购需要安装的固定资产】\n借：在建工程\n      应交税费——应交增值税（进项税额）\n  贷：银行存款\n借：固定资产\n  贷：在建工程\n\n【分期付款购入（具有融资性质）】\n借：在建工程（各期付款额现值合计）\n    未确认融资费用（差额）\n  贷：长期应付款（各期付款额合计）\n借：在建工程（安装期间，资本化）/ 财务费用（转固后）\n  贷：未确认融资费用\n借：长期应付款\n  贷：银行存款\n\n【存在弃置义务的固定资产】\n借：固定资产（建造成本＋弃置费用现值）\n  贷：在建工程\n      预计负债——弃置费用\n借：财务费用（按摊余成本×实际利率）\n  贷：预计负债——弃置费用\n（预计负债减少，以账面价值为限）\n借：预计负债——弃置费用\n  贷：固定资产\n（预计负债增加）\n借：固定资产\n  贷：预计负债——弃置费用\n\n【计提折旧】\n借：制造费用/管理费用/销售费用/在建工程/其他业务成本\n  贷：累计折旧\n\n【资本化后续支出（改扩建）】\n借：在建工程（账面价值）\n    累计折旧\n    固定资产减值准备\n  贷：固定资产\n借：在建工程\n  贷：银行存款等\n借：固定资产\n  贷：在建工程\n（替换部分终止确认）\n借：营业外支出\n  贷：在建工程\n\n【固定资产清理（正常出售）】\n借：固定资产清理（账面价值）\n    累计折旧\n    固定资产减值准备\n  贷：固定资产\n借：固定资产清理\n  贷：银行存款/应交税费\n借：银行存款\n  贷：固定资产清理\n      应交税费——应交增值税（销项税额）\n借：资产处置损益        ← 或贷方（利得）\n  贷：固定资产清理\n\n【报废毁损】\n借：营业外支出\n  贷：固定资产清理\n\n【盘亏】\n借：待处理财产损溢——待处理固定资产损溢（账面价值）\n    累计折旧\n    固定资产减值准备\n  贷：固定资产\n借：其他应收款（赔偿）\n    营业外支出——盘亏损失\n  贷：待处理财产损溢——待处理固定资产损溢\n```\n\n## 与其他章的联动\n\n- **与第 4 章（无形资产）**：土地使用权与地上建筑物的**分别处理**是高频交叉点——外购土地使用权用于自行建造厂房时，土地使用权仍作为无形资产核算、不在在建工程中核算，但**建设期间**的土地使用权摊销应计入**在建工程成本**（本题库 2018-17：建设期内 120 万元摊销计入在建工程，工程开始前的 60 万元摊销计入当期损益）；达到预定可使用状态后，土地使用权摊销计入制造费用（或其他相关成本），厂房折旧单独计提。\n- **与第 11 章（借款费用）**：「达到预定可使用状态」是停止资本化的分界点；本题库 2017-9 要求判断在建工程转固时点并把本应费用化的借款费用从在建工程转出。\n- **与第 19 章（所得税）**：会计折旧方法与税法规定不一致（如会计用年数总和法/双倍余额递减法、税法要求直线法）形成**暂时性差异**，需确认递延所得税资产或负债；本题库 2020-5（补提折旧 900 万元、调减应交所得税 90 万元、确认递延所得税资产 75 万元）、2022-3（递延所得税资产 42.1875 万元）都考这一点。\n- **与第 24 章（会计政策、会计估计变更和差错更正）**：使用寿命、预计净残值、折旧方法的变更属**会计估计变更→未来适用法**；达到预定可使用状态未及时转固、漏提折旧属**前期差错**，通过「以前年度损益调整」更正（本题库 2020-5、2022-3）。\n- **与第 26 章（企业合并）**：非同一控制下企业合并中取得的固定资产按**购买日公允价值**计量，并以此为基础在购买方账上计提折旧；购买日后 12 个月内取得评估报告等新证据的，视同在购买日确定的公允价值调整并**调整比较报表**，超过 12 个月则作为**前期差错**处理。\n- **与第 15 章（持有待售）**：固定资产一旦划分为持有待售类别，**自划分日起停止计提折旧**（本题库 2019-11：仓库 2×25 年 1 月 31 日签署转让协议并划分，1 月份仍按固定资产准则计提折旧，此后不再计提）；处置时通过「资产处置损益」而非「固定资产清理」。\n- **与第 5 章（投资性房地产）**：自用房地产转换为投资性房地产时，成本模式下按转换日原价、累计折旧、减值准备**分别对应结转**；公允价值模式下按转换日公允价值入账，公允大于账面计入**其他综合收益**（处置时转损益），公允小于账面计入公允价值变动损益。\n- **与第 7 章（资产减值）**：固定资产减值准备**一经计提不得转回**；计提减值后应在剩余使用寿命内按调整后账面价值重新计算折旧率和折旧额。\n",
    "4": "# 第四章 无形资产\n\n> 本题库考察频次：8 题 ｜ 优先级：B 类（常考章，5–13 题） ｜ 建议投入：重点掌握 + 默写「研发支出——费用化支出/资本化支出」双科目分录与土地使用权摊销的去向\n\n---\n\n## 一、无形资产的定义、特征与内容\n\n### 无形资产的定义与特征（可辨认性）\n- **优先级**：★★★\n- **内容**：无形资产＝企业拥有或控制的**没有实物形态**的**可辨认**非货币性资产。三大特征：①由企业拥有或控制、并能带来未来经济利益；②不具有实物形态；③属于**非货币性长期资产**。\n- **可辨认性标准（满足其一即可）**：\n  1. 能够**从企业中分离或者划分出来**，并能单独用于出售或转让等，而不需要同时处置在同一获利活动中的其他资产；某些情况下需要与有关的合同一起用于出售、转让等的，也视为可辨认。\n  2. **产生于合同性权利或其他法定权利**，无论这些权利是否可以从企业或其他权利和义务中转移或者分离（如特许权合同、商标权、专利权）。\n- **易错（必考）**：①**客户关系、人力资源**等，由于企业无法控制其带来的未来经济利益，**不符合无形资产定义，不应确认为无形资产**；②**内部产生的品牌、报刊名、刊头、客户名单**和实质上类似项目的支出，由于不能与整个业务开发成本区分开来，**也不应确认为无形资产**；③应收款项虽无实物形态，但属于**货币性**资产，不是无形资产。\n- **考察**：2018-15\n\n### 无形资产的内容（六类及其法定年限）\n- **优先级**：★★\n- **内容**：通常包括**专利权、非专利技术、商标权、著作权、特许权、土地使用权**。\n  | 类别 | 关键期限 |\n  |---|---|\n  | 专利权 | 发明专利权 **20 年**、实用新型专利权 **10 年**、外观设计专利权 **15 年**，均自**申请日**起算 |\n  | 商标权 | 注册商标有效期 **10 年**，自**核准注册之日**起算；期满需继续使用的应在期满前 **12 个月**内申请续展，可给予 **6 个月**宽展期；每次续展有效期 **10 年** |\n  | 著作权 | 公民作品的发表权等财产性权利保护期为作者终生及死亡后 **50 年**，截止于死亡后第 50 年的 12 月 31 日；合作作品截止于最后死亡作者死亡后第 50 年的 12 月 31 日；署名权、修改权、保护作品完整权保护期不受限制 |\n  | 非专利技术 | 不为外界所知、已采用、不享有法律保护的技术和诀窍（自我保密维持独占性） |\n  | 土地使用权 | 国家准许企业在一定期间内对国有土地享有开发、利用、经营的权利；取得方式包括行政划拨、外购（如缴纳土地出让金）、投资者投资等 |\n- **易错**：非专利技术**不受专利法保护**，靠保密维持独占性；专利权三种类型的年限容易混（发明 20、实用新型 10、外观设计 15）。\n- **考察**：—\n\n### 无形资产的确认条件\n- **优先级**：★★\n- **内容**：符合定义 + 同时满足：①**与该无形资产有关的经济利益很可能流入企业**；②**该无形资产的成本能够可靠地计量**。\n- **易错**：教材用数据资源类案例反复强调——**需求前景不明、缺乏潜在客户、尚未构建清晰应用场景、无法确认预期能带来经济利益**的支出，不能确认为无形资产；**企业内部产生的品牌、报刊名**因成本无法可靠计量而不确认。\n- **考察**：2018-15\n\n---\n\n## 二、无形资产的初始计量\n\n### 外购无形资产的成本\n- **优先级**：★★\n- **内容**：＝购买价款＋相关税费＋直接归属于使该项资产达到预定用途所发生的其他支出（如专业服务费用）。**不包括**为引入新产品进行宣传发生的广告费、管理费用及其他间接费用，也不包括无形资产已达到预定用途以后发生的费用。\n- **计算例题（教材例 4-1）**：购入专利权，实际支付价款 300 万元＋相关税费 1 万元＋专业服务费 5 万元 → 入账价值＝300＋1＋5＝**306 万元**。\n  ```\n  借：无形资产——专利权   3 060 000\n    贷：银行存款           3 060 000\n  ```\n- **易错**：**广告费（宣传费）、管理费用**不入成本；达到预定用途**以后**发生的费用（如后续维护费）也不入成本。\n- **考察**：—\n\n### 分期付款（具有融资性质）购入无形资产\n- **优先级**：★★★\n- **内容**：超过正常信用条件延期支付、实质上具有融资性质的，成本按**各期付款额的现值之和**确定，差额计入「未确认融资费用」，在付款期间内按**实际利率法**摊销，计入**财务费用**。\n- **计算例题（教材例 4-2）**：商标权总价 1 000 万元，每年末付款 200 万元，5 年付清，同期贷款利率 5%，5 年期年金现值系数 4.3295。\n  - 无形资产现值＝1 000×4.3295＝**865.9 万元**；未确认融资费用＝1 000－865.9＝**134.1 万元**。\n  ```\n  借：无形资产——商标权        8 659 000\n      未确认融资费用          1 341 000\n    贷：长期应付款            10 000 000\n\n  2×22 年末付款时：\n  借：长期应付款   2 000 000\n    贷：银行存款     2 000 000\n  借：财务费用       433 000\n    贷：未确认融资费用  433 000\n  ```\n  - 各年财务费用依次为 43.30、35.46、27.23、18.59、9.52 万元（合计 134.1 万元）。\n- **易错**：①与固定资产分期付款不同，无形资产的分期付款**没有「安装期间资本化」**的环节，全部融资费用计入财务费用（除非用于资本化条件的资产购建）；②现值用**年金现值系数**，不要误用复利现值系数。\n- **考察**：2021-6\n\n### 投资者投入、政府补助、非货币性资产交换/债务重组取得的无形资产\n- **优先级**：★★\n- **内容**：①投资者投入：按投资合同或协议**约定价值**确定；约定价值不公允的按**公允价值**入账，差额计入**资本公积**。②通过政府补助取得：按**公允价值**计量，公允价值不能可靠取得的按**名义金额**计量（按第 16 号准则处理）。③通过非货币性资产交换、债务重组取得：分别按第 7 号、第 12 号准则确定成本。\n- **易错**：**债务重组**方式取得无形资产时，债权人**不确认债务重组损益以外的差额**——本题库 2021-6 明确「无形资产入账价值应为 500 万元（债务重组不确认损益）」。\n- **考察**：2021-6\n\n### 土地使用权的处理 ★★★（本章最常考）\n- **优先级**：★★★\n- **内容**：企业取得的土地使用权，通常应当按照取得时所支付的价款及相关税费确认为**无形资产**。土地使用权用于**自行开发建造厂房等地上建筑物**时，土地使用权的账面价值**不与地上建筑物合并计算其成本**，而仍作为无形资产核算，**土地使用权与地上建筑物分别进行摊销和提取折旧**。\n- **两种例外情形（必须记住）**：\n  1. **房地产开发企业**取得的土地使用权用于建造**对外出售**的房屋建筑物，相关的土地使用权应当计入**所建造的房屋建筑物成本**（作为存货）。\n  2. 企业**外购的房屋建筑物**，实际支付的价款中包括土地以及建筑物的价值，应当对支付的价款按合理方法（例如公允价值）**在土地和地上建筑物之间进行分配**；确实无法合理分配的，**全部作为固定资产**处理。\n- **其他联动**：\n  - 企业**改变土地使用权的用途**，将其用于出租或增值目的时，应将其转为**投资性房地产**。\n  - 在土地上建造厂房期间，**达到预定可使用状态前**的土地使用权摊销应计入**在建工程成本**；工程开始前（或与建造无关期间）的摊销计入当期损益。\n  - 房地产开发企业依法取得的、用于开发后出售的土地使用权属于**存货**，即使决定待增值后再转让，也**不得**确认为投资性房地产。\n- **计算例题（教材例 4-4）**：A 公司 2×25 年 1 月 1 日购入土地使用权 8 000 万元，并在该土地上自行建造厂房，发生材料支出 12 000 万元、工资费用 8 000 万元、其他相关费用 10 000 万元。土地使用权使用年限 50 年，厂房使用年限 25 年，两者均无净残值、均采用直线法。\n  - 取得时：\n  ```\n  借：无形资产——土地使用权   80 000 000\n    贷：银行存款               80 000 000\n  ```\n  - 建造（略：土地使用权摊销在达到预定可使用状态前计入在建工程成本）：\n  ```\n  借：在建工程  300 000 000\n    贷：原材料等 300 000 000\n  借：固定资产  300 000 000\n    贷：在建工程  300 000 000\n  ```\n  - 达到预定可使用状态后每年摊销/折旧：\n  ```\n  借：制造费用（土地摊销）      1 600 000   ← 80 000 000 ÷ 50\n      制造费用（厂房折旧）     12 000 000   ← 300 000 000 ÷ 25\n    贷：累计摊销                1 600 000\n        累计折旧               12 000 000\n  ```\n- **易错**：①土地使用权**永远不并入**厂房成本（房地产开发企业对外出售的除外）；②**土地使用权摊销年限用土地使用权年限（50 年），厂房折旧年限用厂房年限（25 年）**，两者不能统一按 50 年或 25 年；③本题库 2018-17：**建设期内**的土地使用权摊销 120 万元计入在建工程成本，**工程开始前**的 60 万元摊销计入当期损益——\"是否在建设期内\"是判断摊销去向的唯一标准。\n- **考察**：2018-17\n\n### 企业合并中取得的无形资产\n- **优先级**：★★\n- **内容**：①**同一控制**下吸收合并，按合并日被合并方相关无形资产在**最终控制方合并财务报表中的账面价值**确认；同一控制下控股合并，合并方在合并日编制合并报表时按同样口径作为合并基础。②**非同一控制**下企业合并，购买方取得的无形资产应以其在**购买日的公允价值**计量，包括被购买企业原已确认的和**原未确认但公允价值能够可靠计量**的无形资产（后者应**独立于商誉**单独确认为无形资产）。\n- **非同一控制下应确认为无形资产的两个条件（满足其一即可）**：①源于**合同性权利或其他法定权利**；②能够**从被购买方中分离或者划分出来**，并能单独或与相关合同、资产和负债一起用于出售、转移、授予许可、租赁或交换。\n- **易错**：被购买方**正在进行中的一个研究开发项目**，符合无形资产定义且公允价值能够可靠计量的，购买方应**独立于商誉**确认为一项无形资产；若取得的无形资产本身可单独辨认但其计量或处置必须与有形资产一并作价（如天然矿泉水的商标与特定泉眼），且各自公允价值不能可靠计量，则应将**该资产组**独立于商誉确认为单项资产。\n- **考察**：—\n\n---\n\n## 三、内部研究开发支出的确认与计量（本章主线考点）\n\n### 研究阶段与开发阶段的划分\n- **优先级**：★★★\n- **内容**：\n  - **研究阶段**：为获取新的科学或技术知识并理解它们而进行的**独创性的有计划调查**。特点：①**计划性**（研发项目已经董事会或相关管理层批准，着手收集资料、市场调查等）；②**探索性**（基本上是探索性的，为进一步开发活动做准备，**不会形成阶段性成果**）。\n  - **开发阶段**：在进行**商业性生产或使用前**，将研究成果或其他知识应用于某项计划或设计，以生产出新的或具有实质性改进的材料、装置、产品等。特点：①具有**针对性**；②**形成成果的可能性较大**。\n  - **两者的四个不同点**：①目标不同（研究目标不具体、不具针对性；开发针对具体目标、产品、工艺）；②对象不同（研究很难具体化到特定项目；开发往往形成对象化成果）；③风险不同（研究成功概率很难判断、风险较大；开发成功率较高、风险相对较小）；④结果不同（研究多为研究报告等基础性成果；开发多为具体的新技术、新产品等）。\n- **易错**：研究阶段支出**全部费用化**；进入开发阶段**不等于**可以资本化，还要同时满足五个条件。\n- **考察**：2020-4\n\n### 开发阶段支出资本化的五个条件 ★★★（必背）\n- **优先级**：★★★\n- **内容**：**在开发阶段，同时满足下列五个条件**的，将有关开发支出资本化计入无形资产的成本：\n  1. **完成该无形资产以使其能够使用或出售在技术上具有可行性**；\n  2. **具有完成该无形资产并使用或出售的意图**；\n  3. **无形资产产生经济利益的方式**，包括能够证明运用该无形资产生产的产品存在市场或无形资产自身存在市场；无形资产将在内部使用的，应当证明其有用性；\n  4. **有足够的技术、财务资源和其他资源支持**，以完成该无形资产的开发，并有能力使用或出售该无形资产；\n  5. **归属于该无形资产开发阶段的支出能够可靠地计量**。\n- **要点**：对于第 5 个条件，企业对于开发活动发生的支出应**单独核算**（如开发人员的工资、材料费等）；同时从事多项开发活动时，所发生的支出**同时用于支持多项开发活动**的，应按一定标准在各项开发活动之间分配，**无法明确分配的，应予费用化计入当期损益**，不计入开发活动的成本。\n- **易错**：①**「同时满足」**是关键词——差一个条件就不能资本化；②第 3 个条件要按「对外销售／内部使用」分别论证；③教材对数据资源类无形资产的五个条件做了大量细化（需有立项、可行性分析报告、审批、技术条件、开发计划、技术路线图、技术验证等），考试若考数据资源要能对应到这五个条件上。\n- **考察**：2020-4\n\n### 内部开发无形资产的计量与「已费用化支出不得转回」原则\n- **优先级**：★★★\n- **内容**：内部研发活动形成的无形资产，其成本由**可直接归属于该资产的创造、生产并使该资产能够以管理层预定的方式运作**的所有必要支出组成。内部开发无形资产的成本**仅包括**在满足资本化条件的**时点至无形资产达到预定用途前**发生的支出总和；对于**同一项无形资产在开发过程中达到资本化条件之前已经费用化计入损益的支出，不再进行调整**。\n- **教材例 4-5 的关键结论（高频）**：甲公司以前期间将不满足资本化条件的研发支出（**包括研发样机的相关支出**）全部费用化计入当期研发费用；此后与客户签订销售合同并实现销售时，**不应**将以前期间已费用化的研发样机支出金额从本期研发费用中冲回、再转入存货（如果尚未销售）或营业成本（如果已经销售）。\n- **易错**：①研发过程中产出的**产品或副产品**在对外销售前，符合存货定义和确认条件的应确认为**存货**（若当期就判断不满足存货/无形资产确认条件而费用化，事后销售时不冲回）；②「已费用化不得转回」是命题人常设的陷阱，容易与「前期差错更正」混淆。\n- **考察**：2020-4、2018-15\n\n### 内部研究开发支出的会计处理（双科目）\n- **优先级**：★★★\n- **内容**：企业自行开发无形资产发生的研发支出，**不满足**资本化条件的借记「**研发支出——费用化支出**」，**满足**资本化条件的借记「**研发支出——资本化支出**」；期末将费用化支出转入管理费用，达到预定用途时资本化支出转入无形资产。\n- **基本原则**：研究阶段的支出**全部费用化**计入当期损益（管理费用——研究费用）；开发阶段的支出符合条件的资本化，不符合资本化条件的计入当期损益；**如果确实无法区分研究阶段和开发阶段的支出，应将其所发生的研发支出全部费用化**计入当期损益。企业**购买正在进行中的研究开发项目**且符合资本化条件的，应确认为无形资产；取得后发生的研究开发支出比照内部研发的规定处理。\n- **计算例题（教材例题）**：累计发生研究与开发支出 10 000 万元（材料 5 000 万、人工工资 1 000 万、其他费用 4 000 万），其中符合资本化条件的支出为 6 000 万元；2×25 年 12 月 31 日专利技术达到预定用途。\n  ```\n  （1）发生研发支出：\n  借：研发支出——费用化支出   40 000 000\n      研发支出——资本化支出   60 000 000\n    贷：原材料                50 000 000\n        应付职工薪酬          10 000 000\n        银行存款              40 000 000\n\n  （2）达到预定用途：\n  借：管理费用——研究费用      40 000 000\n      无形资产                60 000 000\n    贷：研发支出——费用化支出   40 000 000\n        研发支出——资本化支出   60 000 000\n  ```\n- **易错**：①费用化支出的最终归宿是**「管理费用——研究费用」**（在利润表中列示为「**研发费用**」项目），不是「营业外支出」、也不是「销售费用」；②资产未达到预定用途前，资本化支出停留在「研发支出——资本化支出」科目，资产负债表中列示为「**开发支出**」项目，**不是**「无形资产」。\n- **考察**：2020-4\n\n### 研发费用加计扣除的所得税影响（★与第 19 章交叉的必考点）\n- **优先级**：★★★\n- **内容**：企业发生的研究开发支出，按税法规定可以加计扣除（费用化的按一定比例加计扣除，形成无形资产的按无形资产成本的一定比例在税前摊销）。由此形成的**账面价值与计税基础的差异**，属于**可抵扣暂时性差异**，但：\n  - **内部研发形成无形资产（以及内部研发费用化支出）的初始确认所产生的可抵扣暂时性差异，不确认相应的递延所得税资产**——这是所得税准则规定的**初始确认豁免**的典型情形之一。\n  - 因此在账务上只调整**当期应交所得税/所得税费用**，不确认递延所得税资产。\n- **本题库证据**：\n  - **2020-4**：更正后无形资产入账价值 300 万元、2019 年摊销 10 万元；调增管理费用 145 万元（净额）、**减少应交所得税 38.0625 万元**；对以前年度损益调整的净影响为**减少利润 106.9375 万元**。\n  - **2022-5**：**不确认递延所得税资产**；当期所得税费用**减少 225 万元**（＝800×25%＋2 000/10/12×6×25%）；更正分录为 `借：应交税费——应交所得税 25、贷：所得税费用 25` 与 `借：所得税费用 475、贷：递延所得税资产 475`。\n- **易错**：①把内部研发形成的无形资产差异**误认为要确认递延所得税资产**——这是最常设的陷阱（教材所得税章有专门例题讲解「内部研发形成无形资产的例外条款」）；②费用化部分加计扣除直接减少当期应交所得税，只影响当期所得税费用；③**外购**的无形资产不适用该豁免，其账面价值与计税基础的差异正常确认递延所得税。\n- **考察**：2020-4、2022-5、2017-3\n\n---\n\n## 四、无形资产的后续计量\n\n### 使用寿命的确定与复核\n- **优先级**：★★★\n- **内容**：无形资产初始确认和计量后，在其后使用期间内应以**成本减去累计摊销额和累计减值损失后的余额**计量。\n  - 无形资产的使用寿命分为**使用寿命有限**和**使用寿命不确定**两类；使用寿命有限的无形资产，应在其**预计的使用寿命内**采用**系统合理的方法**对应摊销金额进行摊销。\n  - **使用寿命不确定**的无形资产**不应摊销**，但应当在**每个会计期间**对该使用寿命进行**复核**；如果有证据表明其使用寿命是有限的，应当估计其使用寿命并按使用寿命有限的无形资产的处理原则进行处理。\n  - 对使用寿命有限的无形资产，其**使用寿命及摊销方法**应于每年年度终了进行复核；使用寿命及摊销方法与以前估计不同的，应当改变摊销期限和摊销方法，并**按会计估计变更处理**。\n- **易错**：**使用寿命不确定 ≠ 不计提减值**：使用寿命不确定的无形资产无论是否存在减值迹象，**每年都应当进行减值测试**；使用寿命有限的无形资产则在**出现减值迹象时**进行减值测试。\n- **考察**：2021-6、2016-5\n\n### 摊销方法、摊销去向与残值\n- **优先级**：★★★\n- **内容**：\n  - **摊销方法**：应反映与该项无形资产有关的经济利益的**预期消耗方式**。企业通常**不应以包括使用无形资产在内的经济活动所产生的收入为基础进行摊销**；但下列极其有限的情况除外：①企业根据合同约定确定无形资产固有的根本性限制条款（如使用时间、使用无形资产生产产品的数量、或因使用无形资产而应取得**固定的收入总额**）的，当该条款为因使用无形资产而应取得的固定收入总额时，取得的收入可以成为摊销的合理基础（如企业获得勘探开采黄金的特许权，合同明确规定该特许权在销售黄金的收入总额达到某固定金额时失效）；②有确凿的证据表明**收入的金额和无形资产经济利益的消耗是高度相关**的。**企业采用车流量法对高速公路经营权进行摊销的，不属于以收入为基础的摊销方法。**\n  - **摊销去向**：某项无形资产包含的经济利益通过所生产的产品或其他资产实现的，其摊销金额应当计入**相关资产的成本**（如用于产品生产的非专利技术，摊销计入**制造费用**）；无形资产用于管理或其他用途的，摊销计入**管理费用**。划分为持有待售的无形资产或处置组中的无形资产**不进行摊销**，按第 42 号准则处理。\n  - **残值**：使用寿命有限的无形资产的残值**一般应当视为零**，除非：①有第三方承诺在无形资产使用寿命结束时购买该项无形资产；②存在活跃市场，通过市场可以得到无形资产使用寿命结束时的残值信息，并且从目前情况看，在无形资产使用寿命结束时该市场还可能存在。残值确定以后，在持有无形资产期间**至少应于每年年末进行复核**，预计其残值与原估计金额不同的，应按**会计估计变更**处理。\n- **计算例题（教材例题）**：购入非专利技术 5 000 万元（使用寿命 10 年，用于产品生产）与商标权 3 000 万元（使用寿命 15 年），净残值均为零，按直线法摊销。\n  ```\n  借：无形资产——非专利技术   50 000 000\n      无形资产——商标权       30 000 000\n    贷：银行存款              80 000 000\n\n  按年摊销时：\n  借：制造费用——非专利技术    5 000 000   ← 50 000 000 ÷ 10\n      管理费用——商标权        2 000 000   ← 30 000 000 ÷ 15\n    贷：累计摊销               7 000 000\n  ```\n- **会计估计变更示例**：2×23 年 12 月 31 日根据技术发展趋势判断该非专利技术 4 年后将被淘汰，决定再使用 4 年后不再使用 → 当日起**变更估计使用寿命**，按**会计估计变更**处理（不追溯），按剩余账面价值在剩余 4 年内摊销。\n- **易错**：①**摊销去向由「经济利益实现方式」决定**：用于生产→制造费用；用于管理→管理费用；②残值一般为零，例外只有两种；③改变使用寿命/摊销方法/残值都是**会计估计变更**（未来适用法）。\n- **考察**：2021-6、2016-5\n\n### 无形资产的减值 ★★（不可转回）\n- **优先级**：★★\n- **内容**：企业应当在资产负债表日判断无形资产是否存在可能发生减值的迹象。\n  - **使用寿命有限**的无形资产：在**出现减值迹象时**进行减值测试。\n  - **使用寿命不确定**的无形资产：在持有期间内，如果期末重新复核后仍为不确定的，**无论是否存在减值迹象，每年都应当进行减值测试**。\n  - 经减值测试表明可收回金额低于账面价值的，按差额确认资产减值损失：\n  ```\n  借：资产减值损失\n    贷：无形资产减值准备\n  ```\n  **无形资产减值准备一经计提，不得转回。** 资产减值损失确认后，使用寿命有限的无形资产，其**摊销费用应当在未来期间作相应调整**，以使该无形资产在**剩余使用寿命内**系统合理地分摊调整后的账面价值。\n- **计算例题（教材例题）**：2×24 年购入商标 6 000 万元，因可无限次以较低手续费申请延期且有证据表明有能力延期、综合判断将在不确定期间内带来现金流量，**视为使用寿命不确定的无形资产，持有期间不摊销**；2×25 年末减值测试，公允价值 4 000 万元。\n  ```\n  借：资产减值损失            20 000 000   ← 60 000 000 － 40 000 000\n    贷：无形资产减值准备——商标权  20 000 000\n  ```\n- **易错**：①**使用寿命不确定 → 不摊销，但每年必须减值测试**，这是最强对比；②减值**不得转回**（对比存货跌价准备可以转回）；③减值后要**在未来剩余期间调整摊销额**。\n- **考察**：—\n\n---\n\n## 五、无形资产的处置与列报\n\n### 无形资产的出售与报废\n- **优先级**：★★\n- **内容**：无形资产的处置主要指**出售、报废**，此时无形资产无法为企业带来未来经济利益，应予转销并终止确认。企业出售某项无形资产，表明企业放弃无形资产的所有权。\n- **分录**：\n  ```\n  借：银行存款\n      累计摊销\n      无形资产减值准备\n    贷：无形资产\n        应交税费——应交增值税（销项税额）\n        资产处置损益（差额，或借方）\n  ```\n- **易错**：①无形资产出售的差额通过「**资产处置损益**」核算（不是「营业外收入/支出」，也不是「其他业务收入/成本」）；②**报废**造成的损失计入「营业外支出」；③划分为持有待售的无形资产按第 15 章处理。\n\n### 无形资产的列示与披露\n- **优先级**：★★★\n- **内容**（三个报表项目必须分清）：\n  | 报表项目 | 填列依据 |\n  |---|---|\n  | **无形资产** | 「无形资产」科目账面余额 **减去**「累计摊销」科目余额和「无形资产减值准备」科目余额 |\n  | **开发支出** | 「研发支出——**资本化支出**」科目的账面余额，减去相关减值准备期末余额后的金额分析填列 |\n  | **研发费用**（利润表） | 「管理费用」科目下的「**研究费用**」明细科目发生额 ＋「管理费用」下「**无形资产摊销**」明细科目的相关发生额分析填列 |\n- **要点**：企业应当根据重要性原则并结合实际情况，在「无形资产」项目下增设「**其中：数据资源**」项目；在「开发支出」项目下也增设「其中：数据资源」项目。附注中应按无形资产类别披露期初和期末账面余额、累计摊销额及减值准备累计金额，使用寿命有限的无形资产其使用寿命的估计情况，使用寿命不确定的无形资产其使用寿命不确定的判断依据等。\n- **易错**：①**「开发支出」只含资本化部分**，费用化部分不在资产负债表上；②「研发费用」是**利润表**项目，由管理费用下的研究费用与自行开发无形资产的摊销构成；③「无形资产」项目是**净额**（已减累计摊销和减值准备）。\n- **考察**：—\n\n---\n\n## 本章易错陷阱汇总\n\n1. **客户关系、人力资源、内部产生的品牌/报刊名/客户名单不确认为无形资产**（不能控制未来经济利益 / 成本无法可靠计量 / 不能与整个业务开发成本区分）。\n2. **广告费、为引入新产品的宣传费、达到预定用途以后发生的费用不计入无形资产成本**。\n3. **无形资产与地上建筑物分别核算、分别摊销和折旧**，两个年限不能混用（教材例 4-4 中土地 50 年摊销、厂房 25 年折旧）；只有房地产开发企业为建造**对外出售**房屋建筑物取得的土地使用权才计入房屋建造成本。\n4. **外购房屋建筑物含地价时按合理方法（如公允价值）在土地与建筑物之间分配；无法合理分配的，全部作为固定资产**。\n5. **研究阶段支出全部费用化；进入开发阶段也不等于能资本化，必须同时满足五个条件**；确实无法区分研究阶段和开发阶段的，**全部费用化**。\n6. **达到资本化条件之前已经费用化的支出不得转回**（包括研发样机支出，事后销售也不冲回研发费用）。\n7. **费用化支出的归宿是「管理费用——研究费用」**，在利润表中列示为「研发费用」；资本化未完工部分在资产负债表中列示为「开发支出」。\n8. **折旧方法/摊销方法变更、使用寿命变更、残值变更都是会计估计变更**（未来适用法），不是会计政策变更。\n9. **使用寿命不确定的无形资产不摊销，但每年必须减值测试**；使用寿命有限的在出现减值迹象时测试。\n10. **无形资产减值准备一经计提不得转回**，且减值后要调整未来期间的摊销额。\n11. **内部研发（费用化与资本化）形成的可抵扣暂时性差异适用初始确认豁免，不确认递延所得税资产**——只调整当期应交所得税与所得税费用。\n12. **出售无形资产的差额走「资产处置损益」**，不是营业外收支；报废损失走营业外支出。\n\n## 本章分录模板\n\n```\n【外购无形资产】\n借：无形资产（买价＋相关税费＋专业服务费等）\n    应交税费——应交增值税（进项税额）\n  贷：银行存款\n\n【分期付款购入（具有融资性质）】\n借：无形资产（各期付款额现值合计）\n    未确认融资费用（差额）\n  贷：长期应付款（各期付款额合计）\n借：长期应付款\n  贷：银行存款\n借：财务费用\n  贷：未确认融资费用\n\n【土地使用权与地上建筑物（分别核算）】\n借：无形资产——土地使用权\n  贷：银行存款\n（建造期间）\n借：在建工程   ← 建设期内的土地使用权摊销\n  贷：累计摊销\n（达到预定可使用状态后）\n借：制造费用（土地使用权摊销）\n  贷：累计摊销\n借：制造费用（厂房折旧）\n  贷：累计折旧\n\n【内部研发（双科目）】\n借：研发支出——费用化支出\n    研发支出——资本化支出\n  贷：原材料/应付职工薪酬/银行存款等\n借：管理费用——研究费用\n  贷：研发支出——费用化支出\n借：无形资产\n  贷：研发支出——资本化支出\n\n【无形资产摊销】\n借：制造费用（用于产品生产）/管理费用（管理用途）\n  贷：累计摊销\n\n【无形资产减值】\n借：资产减值损失\n  贷：无形资产减值准备          ← 不得转回\n\n【出售无形资产】\n借：银行存款\n    累计摊销\n    无形资产减值准备\n    资产处置损益（损失时）\n  贷：无形资产\n      应交税费——应交增值税（销项税额）\n      资产处置损益（利得时）\n\n【报废】\n借：营业外支出\n    累计摊销\n    无形资产减值准备\n  贷：无形资产\n```\n\n## 与其他章的联动\n\n- **与第 3 章（固定资产）**：**土地使用权与地上建筑物的分别处理**是最核心的交叉点——自行建造厂房期间，土地使用权摊销在**达到预定可使用状态前**计入**在建工程成本**，之后计入制造费用；厂房本身按固定资产核算。本题库 2018-17 正是考「建设期内 120 万元摊销计入在建工程、工程开始前 60 万元计入当期损益」。另：外购房屋建筑物无法在土地与建筑物之间合理分配的，**全部作为固定资产**。\n- **与第 15 章（持有待售）**：划分为持有待售的无形资产或处置组中的无形资产**不进行摊销**，改按第 42 号准则计量；本题库 2019-11、2021-6、2021-7 都把无形资产（或含无形资产）的持有待售与摊销中止联系起来。\n- **与第 21 章（债务重组）**：债权人受让无形资产时按**放弃债权的公允价值**为基础的分配结果计量，**不确认债务重组损益以外的差额**（本题库 2021-6：无形资产入账价值应为 500 万元）。\n- **与第 19 章（所得税）**：①内部研发费用化加计扣除**直接减少当期应交所得税**；②内部研发形成无形资产的账面价值与计税基础差异适用**初始确认豁免，不确认递延所得税资产**（本题库 2020-4、2022-5 的核心结论，教材所得税章设有专门例题）；③外购无形资产正常确认递延所得税。\n- **与第 5 章（投资性房地产）**：企业**改变土地使用权的用途**，将其用于出租或增值目的时，应将土地使用权转为**投资性房地产**；自用土地使用权转为以公允价值模式计量的投资性房地产，转换日公允价值大于账面价值的差额计入**其他综合收益**（处置时转损益）。\n- **与第 26 章（企业合并）**：非同一控制下企业合并中，被购买方**原未确认**但满足「合同性权利/可分离」条件且公允价值能可靠计量的无形资产（如正在进行的研发项目），购买方应**独立于商誉**确认为无形资产；无法单独可靠计量的，将资产组独立于商誉确认为单项资产。\n- **与第 24 章（会计政策、会计估计变更和差错更正）**：使用寿命、摊销方法、残值的变更属**会计估计变更（未来适用法）**；漏计无形资产摊销属**前期差错**，通过「以前年度损益调整」更正（本题库 2016-5 即考漏计摊销的前期差错更正）。\n- **与第 27 章（合并财务报表）**：内部无形资产交易的抵销，以及合并层面无形资产摊销年限的调整（内部交易抵销后按集团口径重算摊销）。\n",
    "5": "# 第五章 投资性房地产\n\n> 本题库考察频次：8 题 ｜ 优先级：B 类（常考章，5–13 题） ｜ 建议投入：重点掌握 + 把「成本模式 vs 公允价值模式」和「转换的 8 种情形」做成对比表反复默写（计入其他综合收益的只有 1 种）\n\n---\n\n## 一、投资性房地产的定义与范围\n\n### 投资性房地产的定义与三个项目\n- **优先级**：★★★\n- **内容**：投资性房地产＝为**赚取租金**或**资本增值**，或**两者兼有**而持有的房地产。范围包括三项：\n  1. **已出租的土地使用权**；\n  2. **持有并准备增值后转让的土地使用权**；\n  3. **已出租的建筑物**。\n- **要点**：\n  - 已出租的土地使用权，指企业通过**出让或转让**方式取得的、以**经营租赁**方式出租的土地使用权（包括一级市场交纳土地出让金取得、二级市场接受其他单位转让取得）。企业对于**租入的土地使用权再转租**给其他单位的，**不能**确认为投资性房地产。\n  - 持有并准备增值后转让的土地使用权，指企业取得的、准备增值后转让的土地使用权。**按国家有关规定认定的闲置土地，不属于**持有并准备增值后转让的土地使用权，也就不属于投资性房地产。\n  - 已出租的建筑物，指企业**拥有产权**的、以经营租赁方式出租的建筑物，主要包括自行建造或开发活动完成后用于出租的建筑物，以及**正在建造或开发过程中将来用于出租**的建筑物。\n- **易错**：投资性房地产的确认时点——已出租的土地使用权、已出租的建筑物一般为**租赁期开始日**（即进入出租状态、开始赚取租金的日期）；持有并准备增值后转让的土地使用权为**企业将自用土地使用权停止自用、准备增值后转让的日期**。\n- **考察**：2021-13\n\n### 不属于投资性房地产的三类（常考排除项）\n- **优先级**：★★★\n- **内容**：\n  1. **自用房地产**：为生产商品、提供劳务或经营管理而持有的房地产（如自用办公楼、自用厂房、自用土地使用权）。其中\"出租\"的固定资产只指用于出租的**机器设备类**固定资产，**不包括出租的建筑物**——以经营租赁方式出租的建筑物属于投资性房地产，不属于固定资产。\n  2. **作为存货的房地产**：房地产开发企业在日常活动中销售的或为销售而正在开发的商品房。**从事房地产经营开发的企业依法取得的、用于开发后出售的土地使用权属于存货**，即使房地产开发企业决定待增值后再转让其开发的土地，**也不得**将其确认为投资性房地产。\n  3. **企业租入再转租的建筑物**（教材举例：甲公司将拥有产权的仓库出租给乙公司，乙公司第 4 年将该仓库转租给丙公司赚取租金差价，**该仓库对乙公司而言不属于投资性房地产**）。\n- **混合用途的处理（高频）**：实务中存在某项房地产部分自用或作为存货出售、部分用于赚取租金或资本增值的情形。**如果不同用途的部分能够单独计量和出售，应当分别确认为固定资产（或无形资产、存货）和投资性房地产**。\n- **易错**：①判断「是否投资性房地产」先看**产权归属**（必须是企业拥有产权），再看**持有目的**（赚租金/资本增值）；②房地产开发企业的商品房永远不因出租而变成投资性房地产以外的东西——**已出租的商品房**若符合条件可以是投资性房地产，但**待售的商品房**是存货（教材例 5-8 是房地产开发企业将开发的一栋写字楼出租）。\n- **考察**：—\n\n### 投资性房地产的确认条件与初始计量\n- **优先级**：★★★\n- **内容**：同时满足①与该投资性房地产有关的**经济利益很可能流入**企业；②该投资性房地产的**成本能够可靠地计量**，才能确认。投资性房地产应当按照**成本**进行初始计量。\n- **外购投资性房地产**：按取得时的**实际成本**初始计量，包括购买价款、相关税费和可直接归属于该资产的其他支出。\n- **部分出租、部分自用**：企业购入的房地产部分用于出租（或资本增值）、部分自用，用于出租（或资本增值）的部分应当予以单独确认的，应按照**不同部分的公允价值占公允价值总额的比例**将成本在不同部分之间进行分配。\n- **自行建造投资性房地产**：成本由建造该项资产达到**预定可使用状态前**发生的必要支出构成，包括土地开发费、建筑成本、安装成本、应予资本化的借款费用、支付的其他费用和分摊的间接费用等。**建造过程中发生的非正常性损失，直接计入当期损益，不计入建造成本。**\n- **计算例题（教材例 5-1）**：2×24 年 5 月 25 日甲公司支付 1 000 万元购入一栋办公楼，董事会决议将 1～10 层（50%）对外出租、另 50% 作自用办公用房；5 月 30 日签订租赁合同，6 月 1 日起租。假定公允价值与实际成本相同。\n  ```\n  借：投资性房地产——办公楼   5 000 000   ← 1 000 万 × 50%\n      固定资产               5 000 000\n    贷：银行存款            10 000 000\n  ```\n- **易错**：采用**公允价值模式**计量时，需要在「投资性房地产」科目下设置「**成本**」和「**公允价值变动**」两个明细科目（即使处于成本模式，后续变更也要用，见 2015-14）。\n- **考察**：2015-12\n\n### 与投资性房地产有关的后续支出\n- **优先级**：★★\n- **内容**：与投资性房地产有关的后续支出，满足投资性房地产确认条件的，应当计入投资性房地产成本（如改建、扩建、装修支出）。\n- **关键规则**：企业对某项投资性房地产进行**改扩建等再开发且将来仍作为投资性房地产**的，在再开发期间应**继续将其作为投资性房地产**，**再开发期间不计提折旧或摊销**。\n- **计算例题（教材例 5-2）**：厂房按成本模式计量，原价 2 000 万元，已计提折旧 600 万元；2×24 年 3 月 15 日进入改扩建，12 月 10 日完工，共发生支出 150 万元。\n  ```\n  （1）转入改扩建：\n  借：投资性房地产——厂房（在建）   14 000 000\n      投资性房地产累计折旧          6 000 000\n    贷：投资性房地产——厂房         20 000 000\n  （2）发生改扩建支出：\n  借：投资性房地产——厂房（在建）    1 500 000\n    贷：银行存款等                   1 500 000\n  （3）完工：\n  借：投资性房地产——厂房\n    贷：投资性房地产——厂房（在建）\n  ```\n- **易错**：在建期间**不计提折旧或摊销**（与固定资产改扩建停提折旧的逻辑一致）；注意「投资性房地产累计折旧」科目要随原值一并结转。\n\n---\n\n## 二、投资性房地产的后续计量（两大模式对比）\n\n> **教材本文对「第三节 后续计量」中成本模式/公允价值模式的完整规则段落，OCR 损坏较严重**（仅能摘到零星表述与例题），以下内容依据准则规则与本题库考点编写，**条目标注不含教材定位**。\n\n### 成本模式下的后续计量（计提折旧/摊销、计提减值）\n- **优先级**：★★★\n- **内容**：采用成本模式计量的投资性房地产，应**按期（月）计提折旧或摊销**，借记「其他业务成本」，贷记「投资性房地产累计折旧（摊销）」；取得的租金收入计入「**其他业务收入**」。存在减值迹象的，应计提**投资性房地产减值准备**，**一经计提不得转回**（按第 8 号准则处理）。\n- **计算例题（本题库 2015-13 数据）**：1 月 1 日收到一年租金 480 万元，1 月 31 日确认当月租金和折旧：\n  ```\n  1月1日：借：银行存款   480\n            贷：预收账款  480\n  1月31日：借：预收账款     40     ← 480 ÷ 12\n            贷：其他业务收入  40\n          借：其他业务成本  6.5\n            贷：投资性房地产累计折旧  6.5\n  ```\n- **本题库 2019-8 数据（减值＋折旧双重更正）**：应计提减值 **7 500 万元**（更正冲回已多计的 2 500 万元）、下半年应计提折旧 **406.25 万元**（更正补提 31.25 万元）。\n- **易错**：①计提减值后，应在**剩余使用寿命内**按调整后的账面价值重新计算折旧（与固定资产一致）；②「**不计提折旧或摊销**」是公允价值模式的专属特征，成本模式**必须**计提；③成本模式下的投资性房地产**可以**计提减值，公允价值模式**不提减值**（公允价值变动已反映）。\n- **考察**：2015-12、2015-13、2017-6、2019-8\n\n### 公允价值模式下的后续计量（不计提折旧、公允价值变动计损益）\n- **优先级**：★★★\n- **内容**：采用公允价值模式计量的投资性房地产，**不对投资性房地产计提折旧或摊销**，应当以资产负债表日的**公允价值**为基础调整其账面价值，**公允价值与账面价值之间的差额计入当期损益（公允价值变动损益）**。取得的租金收入计入「其他业务收入」。\n- **计算例题（本题库 2015-15 数据）**：确认公允价值变动收益 **78 万元**：\n  ```\n  借：投资性房地产——公允价值变动   78\n    贷：公允价值变动损益               78\n  ```\n  （教材例 5-8 中 2×24 年 12 月 31 日公允价值变动同样处理：借「投资性房地产——公允价值变动」1 000 万元、贷「公允价值变动损益」1 000 万元。）\n- **采用公允价值模式的两个前提条件**（同时满足）：①投资性房地产所在地有**活跃的房地产交易市场**；②企业能够从房地产交易市场上取得**同类或类似房地产的市场价格及其他相关信息**，从而对投资性房地产的公允价值作出**科学合理的估计**。\n- **在建投资性房地产的特殊规定**：采用公允价值模式对投资性房地产进行后续计量的企业，对于**在建投资性房地产**（包括企业首次取得的在建投资性房地产），如果其**公允价值无法可靠确定**但**预期该房地产建成后其公允价值能够可靠确定**的，应当**按照成本模式**对该在建投资性房地产进行计量，**待其完工（达到预定可使用状态）后，再改按公允价值模式**进行后续计量。\n- **易错**：①**公允价值模式不计提折旧或摊销、不计提减值**——这是选择题的第一大陷阱；②公允价值变动**计入当期损益（公允价值变动损益）**，不是其他综合收益；③公允价值模式**不能随意选**，必须同时满足两个前提条件。\n- **考察**：2015-15\n\n### 后续计量模式的变更（会计政策变更、追溯调整）★★★\n- **优先级**：★★★\n- **内容**：投资性房地产的后续计量模式**可以从成本模式变更为公允价值模式**，其变更属于**会计政策变更**，应当**采用追溯调整法**处理，将变更时公允价值与账面价值的差额**调整期初留存收益**（盈余公积和未分配利润）。**已采用公允价值模式计量的投资性房地产，不得从公允价值模式转为成本模式。**\n- **计算例题（本题库证据）**：\n  - **2015-14**：差额 **1 000 万元**，调整**盈余公积 100 万元、利润分配——未分配利润 900 万元**；变更后投资性房地产（成本）**4 472 万元**。\n  - **2017-6**：更正分录 `借：其他综合收益 1 296，贷：盈余公积 129.6、利润分配——未分配利润 1 166.4`（即把原错记入其他综合收益的差额改记期初留存收益）；另 `借：投资性房地产——成本 1 120，贷：投资性房地产——公允价值变动 1 120`。\n- **分录模板**：\n  ```\n  借：投资性房地产——成本（变更日公允价值）\n      投资性房地产累计折旧（摊销）\n      投资性房地产减值准备\n    贷：投资性房地产\n        盈余公积（差额 × 10%）\n        利润分配——未分配利润（差额 × 90%）\n  ```\n- **易错**：①**成本模式 → 公允价值模式 = 会计政策变更 = 追溯调整法 = 调整期初留存收益**；**折旧方法变更 = 会计估计变更 = 未来适用法**——本题库 2015-14、2017-6、2022-3 是这组对照的三道原题；②变更差额**不能**计入当期损益，本题库 2017-6 的更正分录正是要求把原先错记入「其他综合收益」的 1 296 万元调整到期初留存收益；③公允价值模式**不得反向转回**成本模式。\n- **考察**：2015-14、2017-6\n\n---\n\n## 三、投资性房地产的转换\n\n### 转换的确认与计量总原则\n- **优先级**：★★★\n- **内容**：非投资性房地产转换为投资性房地产，实质上是**因房地产用途发生改变而对房地产进行的重新分类**。\n  - 如果投资性房地产采用**成本模式**计量，则按照该项房地产在**转换日的账面价值**入账；\n  - 如果投资性房地产采用**公允价值模式**计量，则按该项房地产在**转换日的公允价值**入账。\n- **易错**：转换的会计处理方向**取决于转换后（或转换时）所采用的模式**，而不是转换前的模式。\n\n### 投资性房地产 → 非投资性房地产（转出）\n- **优先级**：★★★\n- **内容**：\n  - **成本模式 → 自用房地产**：按该项房地产在转换日的原价、累计折旧、减值准备**分别对应结转**：\n  ```\n  借：固定资产（原价）\n      投资性房地产累计折旧\n      投资性房地产减值准备\n    贷：投资性房地产（原价）\n        累计折旧\n        固定资产减值准备\n  ```\n  - **成本模式 → 存货**：按转换日的账面价值，借记「开发产品」，按已计提折旧或摊销借记「投资性房地产累计折旧（摊销）」，原已计提减值准备的借记「投资性房地产减值准备」，按账面余额贷记「投资性房地产」。\n  - **公允价值模式 → 自用房地产**：以**转换当日的公允价值**作为自用房地产的账面价值，**公允价值与原账面价值的差额计入当期损益**。\n  - **公允价值模式 → 存货**：以**转换日的公允价值**作为存货的账面价值，差额计入当期损益。\n- **计算例题（教材例 5-3）**：厂房原价 5 000 万元，累计已提折旧 1 235 万元，账面价值 3 765 万元，2×24 年 8 月 1 日收回自用，采用成本模式：\n  ```\n  借：固定资产                50 000 000\n      投资性房地产累计折旧     12 350 000\n    贷：投资性房地产            50 000 000\n        累计折旧                12 350 000\n  ```\n- **计算例题（公允价值模式 → 自用，教材例题）**：投资性房地产成本 4 500 万元、公允价值变动增值 250 万元（账面 4 750 万元），转换日公允价值 4 800 万元：\n  ```\n  借：固定资产                       48 000 000\n    贷：投资性房地产——成本           45 000 000\n        投资性房地产——公允价值变动      2 500 000\n        公允价值变动损益                  500 000\n  ```\n- **计算例题（公允价值模式 → 存货，教材例 5-5）**：写字楼成本 5 000 万元、公允价值变动增值 600 万元（账面 5 600 万元），转换日公允价值 5 800 万元：\n  ```\n  借：开发产品                     58 000 000\n    贷：投资性房地产——成本         50 000 000\n        投资性房地产——公允价值变动   6 000 000\n        公允价值变动损益              2 000 000\n  ```\n- **易错**：公允价值模式下**转出自用房地产或存货时，差额一律计入当期损益（公允价值变动损益）**，不影响其他综合收益。\n\n### 非投资性房地产 → 投资性房地产（转入）★★★（最高频）\n- **优先级**：★★★\n- **内容**：\n  - **存货 → 成本模式投资性房地产**：按该项存货在转换日的**账面价值**，借记「投资性房地产」，原已计提跌价准备的借记「存货跌价准备」，按其账面余额贷记「开发产品」等。\n  - **自用房地产 → 成本模式投资性房地产**：按该项建筑物或土地使用权在转换日的**原价、累计折旧、减值准备分别转入**「投资性房地产」「投资性房地产累计折旧（摊销）」「投资性房地产减值准备」。**不产生损益**。\n    ```\n    借：投资性房地产（原价）\n        累计折旧/累计摊销\n        固定资产减值准备/无形资产减值准备\n      贷：固定资产/无形资产（原价）\n          投资性房地产累计折旧（摊销）\n          投资性房地产减值准备\n    ```\n  - **存货 → 公允价值模式投资性房地产**：以**转换日的公允价值**入账；**转换日的公允价值小于账面价值的，差额借记「公允价值变动损益」；大于账面价值的，差额贷记「其他综合收益」**。\n  - **自用房地产 → 公允价值模式投资性房地产**：按转换日公允价值借记「投资性房地产——成本」，按已计提累计摊销或累计折旧借记「累计摊销」「累计折旧」，原已计提减值准备的借记「无形资产减值准备」「固定资产减值准备」，按账面余额贷记「固定资产」「无形资产」；**转换日公允价值小于账面价值的差额借记「公允价值变动损益」，大于账面价值的差额贷记「其他综合收益」**。\n- **计算例题（本题库 2015-12 数据，自用 → 成本模式）**：\n  ```\n  借：投资性房地产——写字楼      3 940\n      累计折旧                    312\n    贷：固定资产                 3 940\n        投资性房地产累计折旧        312\n  ```\n  转换日账面价值 **3 628 万元**。\n- **计算例题（教材例 5-7，自用 → 公允价值模式）**：2×24 年 10 月 30 日办公楼原价 5 亿元、已提折旧 14 250 万元（账面 35 750 万元）、公允价值 35 000 万元：\n  ```\n  借：投资性房地产——成本   350 000 000\n      累计折旧             142 500 000\n      公允价值变动损益       7 500 000   ← 账面 357 500 000 － 公允 350 000 000\n    贷：固定资产            500 000 000\n  ```\n- **计算例题（教材例 5-8，存货 → 公允价值模式）**：2×24 年 4 月 15 日写字楼账面余额 45 000 万元、公允价值 47 000 万元：\n  ```\n  借：投资性房地产——成本   470 000 000\n    贷：开发产品            450 000 000\n        其他综合收益         20 000 000   ← 公允价值大于账面价值，计入其他综合收益\n  ```\n- **★★★ 核心规则（转换\"不对称\"是本章第一考点）**：\n  | 转换方向 | 差额处理 |\n  |---|---|\n  | 非投资性房地产 → **成本模式**投资性房地产 | **不产生差额**（按原账面价值/原价对应结转） |\n  | 非投资性房地产 → **公允价值模式**投资性房地产，公允 **>** 账面 | 差额贷记「**其他综合收益**」（**处置时转入当期损益**） |\n  | 非投资性房地产 → **公允价值模式**投资性房地产，公允 **<** 账面 | 差额借记「**公允价值变动损益**」（当期损益） |\n  | 公允价值模式投资性房地产 → 自用/存货 | 差额一律计入「**公允价值变动损益**」（当期损益） |\n- **易错**：①**只有\"非投资性房地产 → 公允价值模式\"且公允大于账面**这一种情形才走「其他综合收益」，**其余全部走当期损益**——这是命题人最爱设的对照题；②计入其他综合收益的部分在**处置该项投资性房地产时应转入当期损益**；③自用房地产转成本模式的\"对应结转\"要按原价、累计折旧、减值准备**分项**结转，不能只转账面价值一个数。\n- **考察**：2021-13\n\n---\n\n## 四、投资性房地产的处置\n\n### 成本模式下的处置\n- **优先级**：★★★\n- **内容**：当投资性房地产被**处置**，或者**永久退出使用且预计不能从其处置中取得经济利益**时，应当**终止确认**该项投资性房地产。处置收入扣除其账面价值和相关税费后的金额计入当期损益。\n- **分录**：\n  ```\n  借：银行存款\n    贷：其他业务收入\n        应交税费——应交增值税（销项税额）\n  借：其他业务成本\n      投资性房地产累计折旧（摊销）\n      投资性房地产减值准备\n    贷：投资性房地产\n  ```\n- **易错**：通过「**其他业务收入/其他业务成本**」核算（不是「资产处置损益」）——这是投资性房地产处置与其他非流动资产处置的最大区别。\n\n### 公允价值模式下的处置（含其他综合收益转损益）★★★\n- **优先级**：★★★\n- **内容**：处置采用公允价值模式计量的投资性房地产时，按实际收到的金额借记「银行存款」等，贷记「其他业务收入」「应交税费——应交增值税（销项税额）」；按该项投资性房地产的账面余额借记「其他业务成本」，按其成本贷记「投资性房地产——成本」，按其累计公允价值变动贷记或借记「投资性房地产——公允价值变动」。**若存在原转换日计入其他综合收益的金额，也一并结转（转入当期损益）。**\n- **计算例题（教材例 5-8 完整链条，也能对应本题库 2015-15、2015-16）**：\n  - 2×24 年 4 月 15 日存货转入（公允价值 47 000 万元，账面 45 000 万元）：\n  ```\n  借：投资性房地产——成本   470 000 000\n    贷：开发产品            450 000 000\n        其他综合收益         20 000 000\n  ```\n  - 2×24 年 12 月 31 日公允价值 48 000 万元：\n  ```\n  借：投资性房地产——公允价值变动   10 000 000\n    贷：公允价值变动损益             10 000 000\n  ```\n  - 2×25 年 6 月以 55 000 万元出售：\n  ```\n  借：银行存款                 550 000 000\n      公允价值变动损益          10 000 000\n      其他综合收益              20 000 000\n      其他业务成本             450 000 000\n    贷：投资性房地产——成本      470 000 000\n        投资性房地产——公允价值变动  10 000 000\n        其他业务收入             550 000 000\n  ```\n- **本题库 2015-16 数据（可直接对照）**：\n  ```\n  借：银行存款            4 600\n    贷：其他业务收入       4 600\n  借：其他业务成本        4 550\n    贷：投资性房地产——成本        4 472\n        投资性房地产——公允价值变动    78\n  借：公允价值变动损益        78\n    贷：其他业务成本            78\n  ```\n  处置净损益 **＋50 万元**（＝4 600 － 转换日公允价值 4 472 － 上一年度已确认的公允价值变动 78；4 600 与 4 472 的差额 128 万元中，78 万元已在公允价值变动损益中确认过）。\n- **关键结论（必背）**：公允价值模式下处置投资性房地产的**最终净损益 = 处置价款 － 转换日（或取得日）的公允价值**，其中属于转换日之后、处置日之前已经计入「公允价值变动损益」的部分**不重复计入**处置损益。本题库 2015-16 中：价款 4 600 万元 － 转换日公允价值 4 472 万元 ＝ 128 万元，其中 78 万元是上一年度已确认的公允价值变动收益，因此**处置净损益为 50 万元**。\n- **易错**：①**「其他综合收益 → 其他业务成本」**这一步是必写的（本题库 2015-16 与教材例 5-8 都要求结转）；②「公允价值变动损益 → 其他业务成本」的结转是为了让「其他业务成本」反映真实成本、使处置损益口径一致；③若漏结转其他综合收益，处置损益会算错。\n\n---\n\n## 本章易错陷阱汇总\n\n1. **公允价值模式不计提折旧或摊销、不计提减值**；成本模式**必须**计提折旧/摊销，并可计提减值（不得转回）。\n2. **成本模式 → 公允价值模式 = 会计政策变更 = 追溯调整法**（调整期初留存收益）；**公允价值模式 → 成本模式不允许**。而折旧方法变更是会计估计变更（未来适用法）。\n3. **转换的\"不对称\"规则**：只有\"非投资性房地产 → 公允价值模式\"且公允 **>** 账面这一种情形计入**其他综合收益**；其余差额全部计入**当期损益**。\n4. **转换成成本模式不产生差额**（按原价、累计折旧、减值准备分项对应结转）。\n5. **转换日计入其他综合收益的金额，在处置该项投资性房地产时转入当期损益**（本题库 2015-16、教材例 5-8）。\n6. **处置一律通过「其他业务收入 / 其他业务成本」**，不用「资产处置损益」，也不用「营业外收支」。\n7. **在建投资性房地产（公允价值模式企业）**：公允价值无法可靠确定但预期完工后能够可靠确定的，**先按成本模式计量，完工后改按公允价值模式**。\n8. **改扩建的再开发期间应继续作为投资性房地产，不计提折旧或摊销**。\n9. **房地产不同用途部分能单独计量和出售的，分别确认为固定资产（或无形资产、存货）和投资性房地产**；部分出租部分自用外购的，按**公允价值比例分配成本**。\n10. **房地产开发企业待增值后再转让的已开发土地仍属存货**，不得确认为投资性房地产；企业**租入再转租**的建筑物不属于本企业的投资性房地产。\n11. **投资性房地产出租的租金收入计入「其他业务收入」**；成本模式下折旧计入「其他业务成本」、贷记「投资性房地产累计折旧」（不是「累计折旧」）。\n12. **建造过程中发生的非正常性损失直接计入当期损益**，不计入投资性房地产建造成本。\n\n## 本章分录模板\n\n```\n【外购投资性房地产（部分出租、部分自用，按公允价值比例分配）】\n借：投资性房地产\n    固定资产\n  贷：银行存款\n\n【成本模式：按月计提折旧/摊销】\n借：其他业务成本\n  贷：投资性房地产累计折旧（摊销）\n\n【成本模式：取得租金】\n借：银行存款\n  贷：其他业务收入\n      应交税费——应交增值税（销项税额）\n（预收租金）\n借：银行存款\n  贷：预收账款\n借：预收账款\n  贷：其他业务收入\n\n【公允价值模式：期末公允价值变动】\n（升值）\n借：投资性房地产——公允价值变动\n  贷：公允价值变动损益\n（贬值，反向）\n\n【成本模式 → 公允价值模式（会计政策变更、追溯调整）】\n借：投资性房地产——成本（变更日公允价值）\n    投资性房地产累计折旧（摊销）\n    投资性房地产减值准备\n  贷：投资性房地产\n      盈余公积（差额×10%）\n      利润分配——未分配利润（差额×90%）\n\n【自用房地产 → 成本模式投资性房地产（对应结转，不产生损益）】\n借：投资性房地产（原价）\n    累计折旧\n    固定资产减值准备\n  贷：固定资产（原价）\n      投资性房地产累计折旧\n      投资性房地产减值准备\n\n【自用房地产 → 公允价值模式投资性房地产】\n（公允 > 账面）\n借：投资性房地产——成本（转换日公允价值）\n    累计折旧\n    固定资产减值准备\n  贷：固定资产（原价）\n      其他综合收益（差额）\n（公允 < 账面）\n借：投资性房地产——成本（转换日公允价值）\n    累计折旧\n    固定资产减值准备\n    公允价值变动损益（差额）\n  贷：固定资产（原价）\n\n【存货 → 公允价值模式投资性房地产】\n借：投资性房地产——成本（转换日公允价值）\n  贷：开发产品（账面余额）\n      其他综合收益（公允大于账面的差额）\n\n【公允价值模式投资性房地产 → 自用房地产】\n借：固定资产（转换日公允价值）\n  贷：投资性房地产——成本\n      投资性房地产——公允价值变动\n      公允价值变动损益（差额，或借方）\n\n【成本模式：处置】\n借：银行存款\n  贷：其他业务收入\n      应交税费——应交增值税（销项税额）\n借：其他业务成本\n    投资性房地产累计折旧（摊销）\n    投资性房地产减值准备\n  贷：投资性房地产\n\n【公允价值模式：处置（含其他综合收益结转）】\n借：银行存款\n  贷：其他业务收入\n      应交税费——应交增值税（销项税额）\n借：其他业务成本\n    公允价值变动损益（或贷方）\n    其他综合收益          ← 原转换日计入的部分，转入当期损益\n  贷：投资性房地产——成本\n      投资性房地产——公允价值变动（或借方）\n（同时结平公允价值变动损益与其他业务成本）\n借：公允价值变动损益\n  贷：其他业务成本\n```\n\n## 与其他章的联动\n\n- **与第 19 章（所得税）**：教材明确区分——采用**成本模式**的投资性房地产，其账面价值与计税基础的确定**与固定资产、无形资产相同**；采用**公允价值模式**计量的投资性房地产，**期末按公允价值调整账面价值而税法不确认公允价值变动**，形成**暂时性差异**，应确认递延所得税资产或负债。同时，**转换日计入其他综合收益**的部分产生的暂时性差异，其递延所得税也**计入其他综合收益**而不是所得税费用（与第 13 章其他权益工具投资的逻辑一致）。\n- **与第 3 章（固定资产）**：**以经营租赁方式出租的建筑物属于投资性房地产，不属于固定资产**；自用房地产与投资性房地产之间的相互转换是两章的核心接口（本题库 2015-12 即自用 → 成本模式投资性房地产）。\n- **与第 4 章（无形资产）**：**土地使用权**改变用途用于出租或增值目的时，应转为投资性房地产；「已出租的土地使用权」是投资性房地产的第一个项目，而房地产开发企业为开发后出售取得的土地使用权属于存货。\n- **与第 24 章（会计政策、会计估计变更和差错更正）**：投资性房地产后续计量模式的变更属**会计政策变更**，采用**追溯调整法**调整期初留存收益（本题库 2015-14、2017-6）；而折旧年限/方法、残值的变更属**会计估计变更**（未来适用法）。\n- **与第 7 章（资产减值）**：只有**成本模式**的投资性房地产才需计提减值（可收回金额低于账面价值的差额），**公允价值模式不提减值**；本题库 2019-8 同时考了减值金额与减值后按剩余使用寿命重新计算折旧。\n- **与第 14 章（租赁）**：出租方以经营租赁方式出租建筑物取得的租金，按第 21 号准则（租赁）确认租赁收入；教材在本题库 2015-13 中把「投资性房地产租金收入」同时挂在第 5 章与第 14 章租赁（经营租赁出租人的会计处理）下。另外，售后租回交易中出租方取得的资产若符合定义可确认为投资性房地产。\n- **与第 21 章（债务重组）**：债务人以投资性房地产清偿债务、债权人受让投资性房地产时，按放弃债权公允价值为基础计量受让资产；本题库 2020-10 考的是债权人受让**处置组**（含多项资产）的初始计量。\n- **与第 20 章（非货币性资产交换）**：换出资产为投资性房地产的，按换出资产公允价值或换入资产公允价值确认**其他业务收入**，按换出资产账面价值结转**其他业务成本**，两者差额计入当期损益。\n- **与第 27 章（合并财务报表）**：子公司作为投资性房地产核算的大厦，若**出租给集团内其他企业使用**，母公司应在合并财务报表层面**作为固定资产反映**（站在集团角度该资产仍为自用）；本题库 2021-13 的内部租赁交易抵销正是这一逻辑的延伸。\n",
    "6": "# 第六章 长期股权投资与合营安排\n\n> 本题库考察频次：20 题 ｜ 优先级：A 类（高频核心章） ｜ 建议投入：精读＋默写分录（本章是全书主观题的\"总开关\"，初始计量、权益法、核算方法转换、丧失控制权四块必须能默写完整分录，并与第26、27章串联成一条链）\n\n---\n\n## 一、基本概念与范围\n\n### 长期股权投资的核算范围（三类投资＋两条排除）\n- **优先级**：★★\n- **内容**：长期股权投资只核算三类：①对子公司投资（控制）；②对合营企业投资（共同控制）；③对联营企业投资（重大影响）。对不具控制、共同控制、重大影响的股权投资，按第13章金融工具核算，不进本科目。\n- **易错**：投资性主体对子公司投资的例外——只把\"为投资性主体的投资活动提供相关服务\"的子公司按长投＋成本法核算，其余子公司按公允价值计量且其变动计入当期损益。\n- **考察**：`2022-10`、`2021-7`\n\n### 重大影响的判断（\"参与决策的权力\"而非\"正在行使的权力\"）\n- **优先级**：★★\n- **内容**：重大影响是投资方对被投资方财务和经营政策有参与决策的权力，但并不能控制或与其他方共同控制。典型情形：①在董事会或类似权力机构派有代表；②参与财务和经营政策制定；③发生重要交易；④派出管理人员；⑤提供关键技术资料。\n- **易错**：存在上述一种或多种情形**并不必然**构成重大影响；判断核心是\"是否具备参与并施加重大影响的权力\"，是否正在行使不是关键。持股比例、股权结构未实质变化时，不应在不同会计期间就同一投资作出相互矛盾的判断。\n- **考察**：`2022-13`\n\n### 长期股权投资的确认时点（\"交易日\"概念）\n- **优先级**：★\n- **内容**：对联营、合营企业投资，通常在投资方实际取得股权、且与被投资单位相关的风险和报酬已转移时确认。分步取得股权的，企业应在**每一交易日**确认对被投资单位的各项投资。\n- **易错**：认缴制下尚未实缴出资——若章程规定股东按**认缴比例**行使表决权、参与分配，则应在认缴时点全额确认资产和负债；若按**实缴比例**行使，则未实缴股东不确认负债，或在出现不可避免支付义务时确认。\n- **考察**：—\n\n## 二、初始计量（本章第一个必考分录区）\n\n### 同一控制下控股合并：初始投资成本＝份额＋商誉\n- **优先级**：★★★\n- **内容**：初始投资成本＝**被合并方所有者权益在最终控制方合并财务报表中的账面价值的份额＋最终控制方收购被合并方时形成的商誉**。付出对价一律按**账面价值**结转，**不确认损益**；差额调整资本公积（资本溢价/股本溢价），不足依次冲减盈余公积、未分配利润。\n- **计算/分录**：\n  ```\n  借：长期股权投资——投资成本        （份额＋商誉）\n      累计摊销 / 累计折旧等\n      资本公积——资本溢价/股本溢价     （差额，可能在贷方）\n      盈余公积、利润分配——未分配利润   （资本公积不足冲减时）\n    贷：有关资产（账面价值）、银行存款、股本、资本公积（差额在贷方）\n  ```\n- **易错**：①\"账面价值\"**不是**被合并方个别报表上的净资产，而是以最终控制方取得时的公允价值为基础**持续计算**的金额（例：最终控制方当年按公允价值5 000万元购入，被合并方按公允价值口径累计净利润1 200万元，则份额基础为6 200万元）；②中介费用计入管理费用，不进投资成本；③**不产生新的商誉**，但被合并方账上原已确认的商誉要作为合并中取得的资产确认。\n- **考察**：`2016-15`、`2022-13`、`2015-1`\n\n### 非同一控制下控股合并：初始投资成本＝付出对价公允价值\n- **优先级**：★★★\n- **内容**：按**企业合并成本**（付出资产、发生或承担的负债、发行的权益性证券的**公允价值**之和）作为初始投资成本；不含应自被投资单位收取的现金股利或利润。\n- **计算/分录**：\n  ```\n  借：长期股权投资                  （合并成本）\n      应收股利                      （已宣告未发放部分）\n      累计摊销 / 累计折旧\n    贷：无形资产 / 固定资产清理 / 银行存款 / 股本 / 资本公积——股本溢价\n        资产处置损益 / 投资收益      （付出资产公允价值与账面价值之差）\n  ```\n- **易错**：①付出非货币性资产的公允价值与账面价值差额计入**资产处置损益**（属于\"资产处置收益\"而非\"营业外收入\"）；②负商誉在母公司个别报表中**不体现**，只在合并报表中确认为营业外收入；③商誉因素包含在长投初始成本中，仅编制合并报表时才单独列示。\n- **考察**：`2015-1`、`2015-2`、`2015-3`、`2018-4`、`2022-10`\n\n### 交易费用的三道分水岭（命题人最爱设的陷阱）\n- **优先级**：★★★\n- **内容**：三种费用处理完全不同。\n  | 费用性质 | 处理 |\n  |---|---|\n  | 审计、法律服务、评估咨询等中介费用及其他相关管理费用 | 发生时计入当期损益（**管理费用**） |\n  | 与发行**权益性工具**作为合并对价直接相关的交易费用（承销费、佣金） | 冲减**资本公积（资本溢价/股本溢价）**，不足依次冲减盈余公积、未分配利润 |\n  | 与发行**债务性工具**作为合并对价直接相关的交易费用 | 计入**债务性工具初始确认金额** |\n- **计算/分录**：\n  ```\n  借：管理费用                        贷：银行存款\n  借：资本公积——股本溢价              贷：银行存款\n  ```\n- **易错**：非企业合并方式（如取得联营企业投资）下，为取得长期股权投资支付的**直接相关费用、税金**要计入投资成本；只有企业合并才费用化。这是最常见的一处混淆。\n- **考察**：`2015-2`、`2018-4`、`2022-10`\n\n### 分步取得控制权的初始计量（三条路径三种口径）\n- **优先级**：★★★\n- **内容**：\n  | 形成控制前的原投资核算 | 个别报表初始投资成本 |\n  |---|---|\n  | 权益法 | 原权益法下的**账面价值**＋购买日新增投资成本（公允价值） |\n  | 金融资产（以公允价值计量且其变动计入当期损益） | 原股权**公允价值**＋新增对价公允价值；原公允价值与账面价值差额计入当期损益 |\n  | 指定为以公允价值计量且其变动计入其他综合收益的**非交易性权益工具投资** | 原股权公允价值＋新增对价公允价值；原其他综合收益**直接转入留存收益**，不得计入当期损益 |\n- **计算/分录**：\n  ```\n  借：长期股权投资                  （原股权公允价值＋新增对价）\n    贷：其他权益工具投资——成本 / ——公允价值变动\n        银行存款\n  借：其他综合收益                 贷：利润分配——未分配利润（影响盈余公积的一并调整）\n  ```\n- **易错**：分步同一控制下合并，则以\"持股比例计算的合并日应享有被合并方权益份额\"为初始投资成本，与原账面价值＋新支付对价**账面价值**之和的差额调整资本公积；不能与上述非同一控制口径混用。\n- **考察**：`2018-4`、`2022-13`\n\n### 一项交易中同时自最终控制方和其他第三方购买股权\n- **优先级**：★★\n- **内容**：自集团内取得的股权能形成控制的，按**同一控制下企业合并**确定成本；自外部独立第三方取得的股权视为取得控制权后**购买少数股权**，按**实际支付价款**确定。\n- **易错**：两笔要分别计量，不能整体按同一控制处理；合并报表中购买少数股权的部分按**权益性交易**调整资本公积，不确认损益。\n- **考察**：`2016-15`\n\n### 已宣告未发放现金股利单独作为应收项目\n- **优先级**：★★\n- **内容**：无论以何种方式取得长期股权投资，取得投资时实际支付价款中包含的被投资单位**已宣告但尚未发放**的现金股利或利润，作为应收项目单独核算，**不构成**初始投资成本。\n- **易错**：与\"取得后被投资单位宣告分派\"区分——后者在成本法下确认投资收益、在权益法下冲减长投账面价值。\n- **考察**：`2022-13`\n\n## 三、后续计量\n\n### 成本法的适用范围与处理\n- **优先级**：★★★\n- **内容**：只适用于能够对被投资单位**实施控制**的长期股权投资（母公司个别报表）。除追加或收回投资、计提减值外，账面价值一般不调整；被投资单位宣告分派现金股利或利润时确认为**投资收益**。\n- **计算/分录**：`借：应收股利 贷：投资收益`\n- **易错**：成本法下收到的现金股利**不区分**是否为投资后实现的净利润；减值准备一经计提**不得转回**。\n- **考察**：`2015-4`、`2022-10`\n\n### 权益法：初始投资成本小于应享可辨认净资产公允价值份额的差额\n- **优先级**：★★★\n- **内容**：比较\"初始投资成本\"与\"取得投资时应享有被投资单位**可辨认净资产公允价值**份额\"：前者**大于**后者，属于商誉，**不调整**账面价值；前者**小于**后者，差额计入当期**营业外收入**，同时调增长期股权投资成本。\n- **计算/分录**：\n  ```\n  借：长期股权投资——投资成本（差额）    贷：营业外收入\n  ```\n- **易错**：①分母是\"可辨认净资产**公允价值**\"份额，不是账面价值份额；②差额走**营业外收入**，不是\"投资收益\"，也不是资本公积；③注意\"可辨认\"——要把被投资单位的商誉剔除。\n- **考察**：`2017-7`\n\n### 权益法：投资损益的确认与\"公允价值基础\"调整\n- **优先级**：★★★\n- **内容**：以取得投资时被投资单位各项**可辨认资产、负债的公允价值**为基础，调整被投资单位的账面净利润后再按持股比例确认。需调整的项目：①会计政策与会计期间不一致的，先统一；②以公允价值为基础计提的折旧额、摊销额与账面基础的差额；③以公允价值为基础确定的资产减值准备。\n- **计算/分录**：\n  ```\n  调整后净利润＝账面净利润－（存货公允价值－账面价值）×当期对外销售比例\n                －（固定资产公允价值折旧－账面折旧）－（无形资产摊销差额）＋减值差额\n  借：长期股权投资——损益调整        贷：投资收益\n  ```\n- **易错**：存货增值只有在**对外销售**时才结转调整；固定资产、无形资产增值按**剩余使用年限**分摊，不是按总年限。\n- **考察**：`2015-7`、`2019-16`、`2019-18`\n\n### 权益法：未实现内部交易损益的抵销（顺流 vs 逆流）\n- **优先级**：★★★\n- **内容**：投资方与其**联营企业、合营企业**之间的未实现内部交易损益，按**持股比例**计算归属于投资方的部分应予抵销。顺流＝投资方向联营/合营企业投出或出售资产；逆流＝联营/合营企业向投资方出售资产。纳入合并范围的子公司与联营/合营企业之间的内部交易损益同样抵销。\n- **计算/分录**：\n  ```\n  顺流（个别报表无分录，仅调整损益确认金额）：\n     借：长期股权投资——损益调整  [（被投资方净利润－未实现损益）×持股比例]\n       贷：投资收益\n  顺流（编制合并报表时调整）：\n     借：营业收入（售价×持股比例）\n       贷：营业成本（成本×持股比例）\n           投资收益（差额）\n  逆流（个别报表）：\n     乙公司调整后净利润＝被投资方净利润－（售价－成本）\n     借：长期股权投资——损益调整     贷：投资收益\n  逆流（合并报表）：\n     借：长期股权投资——损益调整  [（售价－成本）×持股比例]\n       贷：存货\n  ```\n- **易错**：①**损失**只有在属于资产减值损失时才**全额确认**，不按比例抵销；②后续对外出售或消耗时，未实现损益**视为已实现**，在确认投资损益时调增；③顺流、逆流在个别报表与合并报表的调整方式完全不同，命题人常要求写出\"合并报表工作底稿中的调整分录\"。\n- **考察**：`2018-1`、`2018-2`、`2019-16`、`2019-18`\n\n### 权益法：取得现金股利、其他综合收益与其他权益变动\n- **优先级**：★★★\n- **内容**：①被投资单位宣告分派现金股利或利润——冲减**长期股权投资（损益调整）**，不确认投资收益；②被投资单位其他综合收益变动——按份额调整长投并计入**其他综合收益**；③被投资单位除净损益、其他综合收益、利润分配以外的所有者权益其他变动（接受其他股东资本性投入、发行可分离交易可转债的权益成分、以权益结算的股份支付、其他股东增资导致持股比例变动等）——按份额调整长投并计入**资本公积（其他资本公积）**。\n- **计算/分录**：\n  ```\n  借：应收股利                贷：长期股权投资——损益调整\n  借：长期股权投资——其他综合收益   贷：其他综合收益\n  借：长期股权投资——其他权益变动   贷：资本公积——其他资本公积\n  ```\n- **易错**：股票股利**不作账务处理**，只在除权日注明增加的股数。\n- **考察**：`2015-7`、`2018-1`、`2016-13`、`2018-8`\n\n### 权益法：超额亏损的确认顺序（三步＋备查登记）\n- **优先级**：★★★\n- **内容**：确认应分担的净亏损或其他综合收益减少净额，原则上以长期股权投资及其他实质上构成对被投资单位净投资的**长期权益**减记至零为限。\n  | 顺序 | 处理 |\n  |---|---|\n  | 第一步 | 减记长期股权投资账面价值 |\n  | 第二步 | 冲减其他实质上构成净投资的长期权益（通常为无明确清收计划的长期应收款；**不包括**商品购销、提供劳务形成的长期债权） |\n  | 第三步 | 按投资合同或协议约定仍需承担额外损失弥补义务的，确认**预计负债** |\n  | 剩余 | 账外备查登记 |\n- **计算/分录**：\n  ```\n  借：投资收益            贷：长期股权投资——损益调整\n  借：投资收益            贷：长期应收款\n  借：投资收益            贷：预计负债\n  ```\n- **易错**：以后期间被投资单位实现净利润或其他综合收益增加净额时，按**相反顺序**恢复：先弥补未确认投资净损失，再依次恢复其他长期权益、恢复长期股权投资，同时**重新复核预计负债**账面价值。\n- **考察**：`2015-7`\n\n### 权益法：被动稀释损失的处理\n- **优先级**：★★\n- **内容**：因其他方增资导致股权被动稀释产生**损失**的，首先将其作为股权投资**发生减值的迹象之一**，进行减值测试；若发生减值，先确认减值损失并减记长投账面价值，**再**计算稀释影响。稀释损失计入**资本公积（其他资本公积）借方**，贷方余额不足冲减时仍继续借记资本公积。\n- **易错**：顺序不能颠倒（先减值、后稀释）；稀释**收益/损失**走资本公积，不是投资收益。\n- **考察**：`2016-13`\n\n### 长期股权投资的减值\n- **优先级**：★★\n- **内容**：对子公司、联营企业、合营企业的投资，按第7章资产减值确定可收回金额（公允价值减处置费用后的净额与预计未来现金流量现值**孰高**）并计提减值。\n- **易错**：长期股权投资减值准备**提取后不允许转回**；被投资单位股价大幅下跌属于减值迹象。\n- **考察**：`2021-7`\n\n## 四、核算方法的转换及处置\n\n### 成本法转为权益法（因子公司股权部分处置或被动稀释丧失控制权）\n- **优先级**：★★★\n- **内容**：两步走——①**剩余股权按权益法追溯调整**：比较剩余长投成本与按剩余持股比例计算的原投资时应享有被投资单位可辨认净资产公允价值份额，前者大于后者的属于商誉不调整；前者小于后者的，调整长投成本的同时调整**期初留存收益**。②对原取得投资后至处置投资日之间被投资单位实现净损益中应享有的份额，调整留存收益（处置当期期初以前部分）与当期损益；其他综合收益、其他权益变动按相应项目结转。\n- **计算/分录**：\n  ```\n  借：长期股权投资——投资成本\n    贷：盈余公积 / 利润分配——未分配利润\n  借：长期股权投资——损益调整\n    贷：盈余公积、利润分配——未分配利润（原投资日至上年末部分）\n        投资收益（本年年初至处置日部分）\n  借：长期股权投资——其他综合收益   贷：其他综合收益\n  ```\n- **易错**：①已宣告未发放的现金股利部分要先从长投中扣除再追溯；②追溯调整的留存收益在所有者权益变动表中列示于\"上年年末余额\"到\"本年年初余额\"之间的\"**其他**\"项目，**不追溯调整比较期间数据**。\n- **考察**：`2015-6`、`2016-13`、`2018-8`\n\n### 金融资产（公允价值计量）转为权益法核算\n- **优先级**：★★★\n- **内容**：转换日按**原股权公允价值＋新增投资对价公允价值**作为改按权益法核算的初始投资成本。\n- **计算/分录**：\n  ```\n  借：长期股权投资                      （原公允价值＋新增对价）\n    贷：其他权益工具投资——成本 / ——公允价值变动\n        银行存款\n  借：其他综合收益                     贷：利润分配——未分配利润\n  ```\n- **易错**：①原投资是指定为以公允价值计量且其变动计入其他综合收益的**非交易性权益工具投资**的，原计入其他综合收益的累计公允价值变动**转入留存收益**，**不得**计入当期损益；②再比较初始投资成本与应享有可辨认净资产公允价值份额，前者小者计入**营业外收入**。\n- **考察**：`2017-7`\n\n### 公允价值计量或权益法转为成本法（追加投资取得控制权）\n- **优先级**：★★★\n- **内容**：按第六章对子公司投资**初始计量**的规定处理——非同一控制下：原股权公允价值（或原权益法账面价值）＋新增投资成本；同一控制下：按份额口径确定。\n- **计算/分录**：见\"分步取得控制权的初始计量\"。\n- **易错**：原权益法下形成的其他综合收益、其他资本公积**暂时不作处理**，待处置该项投资时采用与被购买方直接处置相关资产或负债**相同的基础**结转。\n- **考察**：`2018-4`、`2022-13`\n\n### 权益法转为公允价值计量的金融资产\n- **优先级**：★★★\n- **内容**：丧失共同控制或重大影响时，剩余股权改按金融工具准则处理。①剩余股权**公允价值与账面价值差额计入当期损益**；②原权益法下确认的其他综合收益，在终止权益法时采用与**被投资单位直接处置相关资产或负债相同的基础**处理（能转损益的转损益，属于非交易性权益工具投资的公允价值变动转入留存收益）；③原计入资本公积（其他资本公积）的**全部转入当期损益**。\n- **计算/分录**：\n  ```\n  借：银行存款 / 其他权益工具投资（剩余股权公允价值）\n    贷：长期股权投资——投资成本/损益调整/其他综合收益/其他权益变动\n        投资收益（差额）\n  借：其他综合收益                    贷：利润分配——未分配利润（或投资收益）\n  借：资本公积——其他资本公积          贷：投资收益\n  ```\n- **易错**：其他综合收益的结转**去向取决于来源**，不能一律转投资收益。\n- **考察**：`2015-6`、`2018-8`\n\n### 成本法转为公允价值计量的金融资产\n- **优先级**：★★\n- **内容**：丧失控制权且不再具有共同控制或重大影响时，剩余股权在**丧失控制权日按公允价值重新计量**，公允价值与账面价值差额计入**当期损益**。\n- **易错**：必须重新计量，不能沿用原账面价值；剩余股权指定为以公允价值计量且其变动计入其他综合收益的，属于企业选择权。\n- **考察**：`2018-9`\n\n### 长期股权投资的处置与丧失控制权（个别报表）\n- **优先级**：★★★\n- **内容**：结转账面价值，取得价款与账面价值差额确认为处置损益；同时将原计入其他综合收益、资本公积（其他资本公积）的部分**按比例**转入当期损益。\n- **计算/分录**：\n  ```\n  第一步：\n  借：银行存款\n    贷：长期股权投资 [（投资成本＋损益调整＋其他综合收益＋其他权益变动）÷原持股比例×处置比例]\n        投资收益\n  第二步（结转原OCI/资本公积）：\n  借：资本公积——其他资本公积（按比例）\n      其他综合收益（按比例）\n    贷：投资收益\n  ```\n- **易错**：①**处置原通过同一控制下企业合并取得的子公司并丧失控制权时**，无论对手方是否为关联方，原合并日因初始投资成本与合并对价账面价值差额调整的资本公积，在个别报表中不得转入损益；在合并报表中同样**不得转出至当期损益或留存收益**；②剩余股权需改按权益法（仍具重大影响/共同控制）或按公允价值计量。\n- **考察**：`2015-5`、`2018-8`、`2022-10`、`2016-13`\n\n## 五、合营安排\n\n### 合营安排的认定与共同控制\n- **优先级**：★★★\n- **内容**：合营安排是**两个或两个以上参与方共同控制**的安排。特征：①各参与方均受该安排约束；②两个或两个以上参与方对该安排实施共同控制，任何一方都不能单独控制，任何一方均能阻止其他方单独控制。共同控制＝按相关约定对某项安排所共有的控制，且该安排的**相关活动必须经分享控制权的参与方一致同意**才能决策。\n- **易错**：①共同控制**不同于**控制（共同控制由两个及以上参与方实施，控制由单一参与方实施），也**不同于**重大影响（重大影响方只有参与决策权，不能控制或共同控制）；②判断顺序：先判断是否所有参与方或参与方组合**集体控制**该安排，再判断相关活动决策是否须经这些参与方**一致同意**。\n- **考察**：—\n\n### 争议解决机制对共同控制判断的影响\n- **优先级**：★★\n- **内容**：允许在未达成一致意见时决策的仲裁等争议解决条款，**不妨碍**该安排构成共同控制。但如果在各方未就重大决策达成一致的情况下，一方具备\"**一票通过权**\"或潜在表决权等特殊权力，则很可能该方实质上具备**控制权**，不构成合营安排。\n- **考察**：—\n\n### 合营安排的分类：共同经营 vs 合营企业\n- **优先级**：★★★\n- **内容**：分类依据是合营方享有的**权利和承担的义务**。\n  | 类型 | 定义 | 合营方会计处理 |\n  |---|---|---|\n  | 共同经营 | 合营方享有该安排**相关资产**且承担该安排**相关负债** | 按份额确认资产、负债、收入、费用（**合并/比例合并**思路） |\n  | 合营企业 | 合营方**仅对该安排的净资产**享有权利 | 采用**权益法**核算 |\n- **易错**：判断标准不是法律形式，而是\"对**资产和负债**享有权利\"还是\"对**净资产**享有权利\"；通过单独主体设立但按约定享有资产、承担负债的，仍属共同经营。\n- **考察**：—\n\n## 本章易错陷阱汇总\n1. **同一控制下初始成本的基础**：不是被合并方个别报表净资产，而是\"以最终控制方取得被合并方时确定的资产、负债价值为基础持续计算\"的账面价值份额**加最终控制方收购时形成的商誉**。\n2. **中介费用 vs 发行费用**：审计、评估、法律服务等中介费用一律计入**管理费用**（不进合并成本、不进长投成本）；发行权益工具的交易费用冲减**资本公积——股本溢价**；发行债务工具的交易费用计入债务工具初始确认金额。\n3. **权益法初始成本差额**：只调\"成本小于份额\"的情形，且计入**营业外收入**；大于份额属商誉，不调账。\n4. **顺流、逆流在个别报表与合并报表的处理方式不同**，考试常要求同时写出个别报表的损益调整和合并工作底稿的调整分录。\n5. **内部交易损失**：属于资产减值的，**全额确认**，不按持股比例抵销。\n6. **超额亏损恢复顺序**：与确认顺序完全相反，且要重新复核预计负债。\n7. **其他综合收益的结转去向**不能一律转投资收益，要看被投资单位处置该资产或负债的基础。\n8. **同一控制下丧失控制权**时，原合并日调整的资本公积在合并报表中**不得转入当期损益**。\n9. **成本法下收到的现金股利**全部确认投资收益；**权益法下收到的现金股利**冲减长投账面价值。\n10. **股票股利不作账务处理**。\n\n## 本章分录模板\n\n**① 同一控制下控股合并（合并方个别报表）**\n```\n借：长期股权投资——投资成本     （被合并方权益在最终控制方合并报表中账面价值份额＋商誉）\n    累计摊销/累计折旧\n    资本公积——资本溢价/股本溢价  （借方差额，不足依次冲减盈余公积、未分配利润）\n  贷：银行存款 / 无形资产 / 固定资产清理 / 股本\n      资本公积——资本溢价/股本溢价  （贷方差额）\n```\n\n**② 非同一控制下控股合并（购买方个别报表）**\n```\n借：长期股权投资                 （合并成本＝付出对价公允价值之和）\n    应收股利                     （已宣告未发放部分）\n    累计摊销/累计折旧\n  贷：银行存款 / 无形资产 / 固定资产清理 / 股本 / 资本公积——股本溢价\n      资产处置损益 / 投资收益\n借：管理费用                     （中介费用）   贷：银行存款\n借：资本公积——股本溢价           （发行权益工具交易费用）  贷：银行存款\n```\n\n**③ 权益法完整链条**\n```\n取得时：\n借：长期股权投资——投资成本           贷：银行存款\n借：长期股权投资——投资成本           贷：营业外收入      （成本＜份额时）\n持有期间：\n借：长期股权投资——损益调整           贷：投资收益        （调整后净利润×持股比例）\n借：应收股利                          贷：长期股权投资——损益调整\n借：长期股权投资——其他综合收益       贷：其他综合收益\n借：长期股权投资——其他权益变动       贷：资本公积——其他资本公积\n超额亏损：\n借：投资收益   贷：长期股权投资——损益调整 → 长期应收款 → 预计负债 → 账外备查登记\n```\n\n**④ 成本法转权益法追溯调整**\n```\n借：长期股权投资——投资成本/损益调整/其他综合收益/其他权益变动\n  贷：盈余公积、利润分配——未分配利润（原投资日至上年末部分）\n      投资收益（本年年初至处置日部分）\n      其他综合收益 / 资本公积——其他资本公积\n```\n\n**⑤ 处置长期股权投资（不丧失控制权，权益法）**\n```\n借：银行存款\n  贷：长期股权投资 [（各明细合计）÷原持股比例×处置比例]\n      投资收益\n借：资本公积——其他资本公积（按比例）\n    其他综合收益（按比例）\n  贷：投资收益\n```\n\n## 与其他章的联动\n- 与第27章（合并财务报表）：本章是合并报表的\"上游\"。初始计量口径直接决定合并日/购买日的抵销分录与商誉金额；\"丧失控制权\"在个别报表（本章）与合并报表（第27章）的处理**完全不同**，必须分两套写。\n- 与第26章（企业合并）：同一控制/非同一控制的**类型判断**在26章，**初始计量与后续计量**在本章，两者互为答案的前后半段。\n- 与第13章（金融工具）：金融资产↔权益法↔成本法的转换，转换日的公允价值口径、其他综合收益结转去向均来自第13章的分类结论。\n- 与第19章（所得税）：权益法下长投账面价值与计税基础不同，一般不确认递延所得税，**但**有近期处置计划等例外情形（见 `2020-7`）。\n- 与第15章（持有待售）：拟出售部分股权划分持有待售后**停止权益法**（后半段不再确认投资损益），见 `2021-7`。\n- 与第10章（股份支付）：集团内股份支付在合并报表中的抵销涉及对子公司长投与资本公积的冲减。\n",
