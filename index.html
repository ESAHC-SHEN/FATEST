风险、续保风险**（保单持有人取消合同的时间早于或晚于预计时间）**不属于**保险风险。企业应当评估各单项合同的**保险风险是否重大**，据此判断该合同是否为保险合同。\n- **易错**：把价格风险、失效风险当作保险风险；忽略\"保险风险重大\"这一判断门槛。\n- **考察**：—\n\n### 考点27　金融工具的列报与披露（要点速记）\n- **优先级**：★\n- **内容**：①资产负债表或附注中按类别列报账面价值：以摊余成本计量的金融资产/负债、FVOCI 的金融资产（**分别反映**分类为 FVOCI 的与指定为 FVOCI 的）、FVTPL 的金融资产/负债。②指定为 FVOCI 的**非交易性权益工具投资**应披露：每一项指定、指定原因、期末公允价值、本期确认的股利收入（**终止确认的**与**期末仍持有的**分别单独披露）、累计利得和损失。③复合金融工具嵌入了价值相互关联的多项衍生工具的（如可赎回的可转换债务工具），应披露相关特征。④还须披露各类金融工具风险的定性与定量信息（信用风险、流动性风险、市场风险）及风险集中度。\n- **考察**：—\n\n---\n\n## 本章易错陷阱汇总\n\n1. **FVOCI 债权 vs FVOCI 权益工具的处置**：债权投资处置时累计 OCI **转入当期损益**；非交易性权益工具投资处置时累计 OCI **转入留存收益**，**永不转损益**。这是本章第一高频陷阱（2019-14）。\n2. **FVTPL 处置时不再结转\"公允价值变动损益\"**：期末公允价值变动已通过公允价值变动损益进入利润表，处置时只比较售价与**账面价值**（新准则下已取消结转分录）。\n3. **三阶段利息收入的计算基础**：第一、二阶段用**账面余额**，**只有第三阶段**用**摊余成本**；折现率自始至终用**初始确认时的实际利率**，不随信用风险变化（2018-19）。\n4. **实际利率不考虑预期信用损失**：确定实际利率时剔除预期信用损失，但计算预期信用损失时要用**原实际利率**折现。\n5. **股票不可能分类为摊余成本或 FVOCI 债权**：股利和剩余权益不符合本金和利息的定义，SPPI 测试必然不通过。\n6. **\"固定换固定\"看结算方式**：普通股总额结算 = 权益工具；现金净额或普通股净额结算 = 金融负债。权益工具类期权后续**不做**公允价值变动处理（2019-13）。\n7. **可转债分拆的折现率是\"不含转换权的市场利率\"**，不是实际利率；发行费用要在负债与权益成分之间**按公允价值比例分摊**（2021-1）。\n8. **回购自身股份一律计入库存股**，不得确认利得或损失；注销时差额先冲资本公积——股本溢价，不足再冲盈余公积和未分配利润（2018-14）。\n9. **金融负债不得重分类**；条款变更导致终止确认的**不叫重分类**。\n10. **永续债的利率跳升**必须与\"同期同行业同类型工具平均利率\"比较封顶利率后才能定性，跳升本身不等于间接义务。\n11. **应收款项/合同资产/租赁应收款不走三阶段**，始终按整个存续期预期信用损失计量。\n12. **附追索权的贴现、卖出回购协议**通常不满足终止确认条件，收到的款项应确认为**金融负债**。\n\n## 本章分录模板\n\n**1. 债权投资（摊余成本）全周期**\n```\n初始：借：债权投资——成本（面值）\n             ——利息调整（含交易费用，或贷方）\n        贷：银行存款\n计息：借：债权投资——应计利息（到期一次还本付息）／应收利息（分期付息）\n        贷：投资收益（期初摊余成本×实际利率）\n            债权投资——利息调整（差额）\n减值：借：信用减值损失\n        贷：债权投资减值准备\n处置：借：银行存款\n          债权投资减值准备\n        贷：债权投资——成本／——利息调整／——应计利息\n            投资收益（差额）\n```\n\n**2. 其他债权投资（FVOCI 债权）**\n```\n公允价值上升：借：其他债权投资——公允价值变动\n                贷：其他综合收益\n减值：借：信用减值损失\n        贷：其他综合收益——信用减值准备\n处置：借：银行存款　其他综合收益\n        贷：其他债权投资——成本／——公允价值变动\n            投资收益（含 OCI 转出额）\n```\n\n**3. 其他权益工具投资（指定为 FVOCI 的非交易性权益工具）**\n```\n公允价值变动：借：其他权益工具投资——公允价值变动\n                贷：其他综合收益\n宣告股利：借：应收股利　贷：投资收益\n处置：借：银行存款\n        贷：其他权益工具投资——成本／——公允价值变动\n      借：其他综合收益\n        贷：盈余公积／利润分配——未分配利润      ← 不转损益\n```\n\n**4. 可转换公司债券（发行方）**\n```\n发行：借：银行存款\n        应付债券——利息调整\n        贷：应付债券——面值\n            其他权益工具\n计息：借：财务费用／在建工程（期初负债摊余成本×实际利率）\n        贷：应付债券——应计利息／应付利息\n            应付债券——利息调整\n转股：借：应付债券——面值／——利息调整\n          其他权益工具\n        贷：股本\n            资本公积——股本溢价\n```\n\n## 与其他章的联动\n\n- **与第八章（负债）**：应付债券的科目设置（面值、利息调整、应计利息）与溢折价摊销表在本章实际利率法下通用；「其他权益工具」科目的使用需与第八章发行债券的核算衔接。\n- **与第六章（长期股权投资与合营安排）**：原持有股权为「其他权益工具投资」的，因追加投资改按权益法核算时，原计入其他综合收益的累计公允价值变动**转入留存收益**（2019-14）；丧失控制权后剩余股权按金融工具核算也要回用到本章分类规则。\n- **与第二十六章（企业合并）**：或有对价按金融工具准则初始及后续计量，公允价值变动计入当期损益且**不调整商誉**（2018-10、2018-11、2018-13）。\n- **与第二十一章（债务重组）**：债权人受让的金融资产按本章分类与初始计量（2020-10）；债务重组中债权、债务的终止确认遵循 CAS 22 与 CAS 23。\n- **与第二十二章（外币折算）**：以公允价值计量的外币非货币性项目（股票、基金）折算差额的处理，取决于该工具在本章的**分类**（FVTPL → 当期损益；指定为 FVOCI 的非交易性权益工具 → 其他综合收益）；外币债券的摊余成本同时涉及本章实际利率法与外币折算（2016-6、2022-6）。\n- **与第二十四章（会计政策、会计估计及其变更和差错更正）**：漏记、错用本章分类与计量规则往往以**前期差错更正**形式命题（2022-6）。\n- **与第二十七章（合并财务报表）**：内部持有的债券投资与应付债券的抵销、以及对子公司投资分类的衔接。\n- **与第十一章（借款费用）**：外币专门借款的利息费用按本章实际利率法计算，再按资本化条件处理（2016-6 至 2016-9）。\n",
    "14": "# 第十四章 租赁\n\n> 本题库考察频次：9 题 ｜ 优先级：B（常考章） ｜ 建议投入：精读+默写分录\n\n> 定位提示：教材目录 OCR 可辨的节标题为「第一节 租赁概述」「第二节 承租人会计处理」「第三节 出租人会计处理」「第四节 特殊租赁业务的会计处理」（目录文字有 OCR 讹误，节名按可辨内容整理）。教材正文标题层 OCR 损坏严重，以下条目不标注页码。\n\n---\n\n### 考点1　租赁的定义与识别三要素\n- **优先级**：★★★\n- **内容**：如果合同一方**让渡了在一定期间内控制一项或多项已识别资产使用的权利以换取对价**，则该合同为**租赁或者包含租赁**。一项租赁应当包含三项要素：**①存在一定期间；②存在已识别资产；③资产供应方向客户转移了对已识别资产使用权的控制**。三要素必须**同时**满足。\n- **易错**：只看合同名称或是否收取租金；把\"服务合同\"当作租赁（未识别出具体资产、供应商可自由替换资产时不构成租赁）。\n- **考察**：2020-12\n\n### 考点2　已识别资产的判断（含实质性替换权）\n- **优先级**：★★\n- **内容**：已识别资产通常由合同**明确指定**，也可以在资产可供客户使用时**隐性指定**（如供应商仅拥有一项可满足合同的资产）。即使合同已指定，若资产供应方在整个使用期间拥有**实质性替换权**，该资产**不**构成已识别资产。判断替换权是否\"实质性\"要考虑：①供应方是否有替换的实际能力（能否获得替代资产、替换成本）；②供应方是否因行使替换权而获得经济利益。若客户无法合理预期供应方会行使替换权，或替换对客户无实质影响，也可能认定为不具实质性。\n- **易错**：只要合同\"写明\"某项资产就认定已识别，忽略实质性替换权；把\"产能保证\"条款当作已识别资产。\n- **考察**：—\n\n### 考点3　客户是否控制已识别资产的使用（三要素）★必背★\n- **优先级**：★★★\n- **内容**：客户**同时**满足以下三项，才视为拥有对已识别资产使用权的控制：\n  1. 客户有权在使用期间**主导**该资产的**使用**（获得几乎全部经济利益）；\n  2. 客户有权获得在使用期间因使用该资产所产生的**几乎全部经济利益**；\n  3. 客户有权主导该资产的**用途和使用方式**（如资产如何使用、何时使用、是否改变产出、是否生产多少等）。\n  在评估时还应当考虑：客户是否有权**自行运营**资产（或指示他人按自己的方式运营）、是否设计了资产并在设计时已预定其用途、**供应商是否有权在整个使用期间改变使用方式**（若供应商有此权，则客户不控制）。\n- **易错**：把\"客户承担了部分成本\"或\"客户排他占用\"当作控制；忽略\"主导用途和使用方式\"这一条——**决定产出的类型和数量**才是核心。\n- **考察**：2020-12\n\n### 考点4　租赁的分拆与合并\n- **优先级**：★★\n- **内容**：合同中同时包含租赁部分和非租赁部分的，**承租人**应当按各部分**单独价格**的**相对比例**分摊合同对价（分拆）；**出租人**应当根据《企业会计准则第 14 号——收入》关于交易价格分摊的规定分摊合同对价。两份或多份与同一交易方（或其关联方）在**同一时间或相近时间**订立的包含租赁的合同，满足下列条件**之一**时应当**合并**为一份合同：①基于总体商业目的订立并构成**\"一揽子交易\"**；②某份合同的对价金额取决于其他合同的定价或履行情况；③各合同让渡的资产使用权**合起来构成一项单独租赁**。合并后仍须区分租赁部分与非租赁部分。\n- **易错**：承租人与出租人的分摊方法混用（承租人用相对单独价格，出租人用收入准则的交易价格分摊）；满足合并条件的合同仍分开核算。\n- **考察**：2021-13\n\n### 考点5　租赁期的确定（不可撤销期间＋续租／终止选择权）★必背★\n- **优先级**：★★★\n- **内容**：**租赁期**是指承租人有权使用租赁资产且**不可撤销的期间**。在此基础上：①承租人有**续租选择权**且**合理确定将行使**的，租赁期包含续租选择权涵盖的期间；②承租人有**终止租赁选择权**且**合理确定将不会行使**的，租赁期包含终止租赁选择权涵盖的期间。评估\"合理确定\"时应考虑：与行使选择权相关的**经济激励**（如续租租金明显低于市场价、提前终止需支付重大罚金）、**租赁资产对承租人的重要程度**（是否专门资产、位置、可替代性）、**与行使选择权直接相关的经营决策**（如处置互补性资产）、**行使选择权所需的条件及满足条件的可能性**。\n- **租赁期变化**：不可撤销期间发生变化的（如实际行使了原先未涵盖的选择权、未行使原已涵盖的选择权、合同规定有义务行使或禁止行使等），应当**修改租赁期**。\n- **易错**：把\"续租选择权\"一律计入租赁期（只有\"合理确定将行使\"才计入）；把\"6 个月罚金重大\"的情形仍按可终止处理——正确做法是**合理确定不会终止**，故按 10 年确定租赁期（教材例 14-7）。\n- **考察**：2021-13\n\n### 考点6　租赁期开始日（与起租日、免租期的区分）\n- **优先级**：★★★\n- **内容**：**租赁期开始日**是指**出租人提供租赁资产使其可供承租人使用的起始日期**。如果承租人在协议约定的起租日或租金起付日**之前**已获得对租赁资产使用权的控制，则表明租赁期已经开始。**协议中对起租日或租金支付时间的约定，并不影响租赁期开始日的判断**。→ 因此**免租期包含在租赁期内**（教材例 14-3：1 月 1 日交钥匙，起租日 4 月 1 日，则租赁期开始日为 1 月 1 日，租赁期包含 3 个月免租期）。\n- **易错**：以合同约定的\"起租日\"作为租赁期开始日；把免租期排除在租赁期之外；把\"租金开始支付日\"当作计量起点。\n- **考察**：2015-13\n\n### 考点7　租赁付款额（承租人租赁负债的构成）★必背★\n- **优先级**：★★★\n- **内容**：**租赁付款额**包括五项：\n  1. **固定付款额及实质固定付款额**，存在**租赁激励**的，**扣除**租赁激励相关金额。**实质固定付款额**＝形式上可能包含变量但**实质上无法避免**的付款额（常见：①可变条款几乎不可能发生，没有真正经济实质；②多套付款额方案中只有一套可行；③有多套可行方案但必须选择其一 → 采用**总折现金额最低**的一套）。\n  2. **取决于指数或比率的可变租赁付款额**，按**租赁期开始日**的指数或比率确定。**只有取决于指数或比率的可变租赁付款额才纳入租赁负债初始计量**，其他可变租赁付款额（与销售额、使用量挂钩）在实际发生时计入当期损益。\n  3. **购买选择权的行权价格**，前提是承租人**合理确定将行使**该选择权。\n  4. **行使终止租赁选择权需支付的款项**，前提是租赁期反映出承租人将行使终止租赁选择权（此时**租赁期不包含**终止选择权涵盖的期间）。\n  5. **根据承租人提供的担保余值预计应支付的款项**，反映**预计将支付的金额**，而非担保余值下的**最大敞口**。\n- **两个必须剔除的项目**：①承租人支付的款项中**包含的增值税**不属于租赁付款额，不纳入租赁负债和使用权资产的计量；②出租人收取的**租赁保证金**不属于承租人的租赁付款额，应作为**单独的资产**处理。\n- **易错**：把与销售额挂钩的可变租金计入租赁负债；把增值税计入租赁负债；把担保余值的**最大敞口**而不是**预计支付额**计入；忘记扣除租赁激励。\n- **考察**：2021-13、2020-16\n\n### 考点8　折现率：租赁内含利率与承租人增量借款利率\n- **优先级**：★★★\n- **内容**：计算租赁付款额现值时，**首选租赁内含利率**；**无法确定**租赁内含利率的，采用**承租人增量借款利率**。**租赁内含利率**＝使**出租人的租赁收款额的现值与未担保余值的现值之和（即租赁投资净额）等于租赁资产公允价值与出租人的初始直接费用之和**的利率。**承租人增量借款利率**＝承租人在**类似经济环境下**为获得与**使用权资产价值接近**的资产、在**类似期间**以**类似抵押条件**借入资金须支付的利率；相关因素包括：承租人自身偿债能力与信用状况、\"借款\"期限（即租赁期）、\"借入\"金额（即租赁负债金额）、抵押条件、经济环境（司法管辖区、计价货币、合同签订时间）。\n- **易错**：**承租人**无法确定租赁内含利率时用市场一般利率而不是**增量借款利率**；把出租人的内含利率与增量借款利率混用；折现率在后续重新计量时未按\"修订后的折现率\"处理。\n- **考察**：2021-13\n\n### 考点9　使用权资产的初始计量（四项成本）★必背★\n- **优先级**：★★★\n- **内容**：在**租赁期开始日**，承租人应当按照**成本**对使用权资产进行初始计量，成本包括**四项**：\n  1. **租赁负债的初始计量金额**；\n  2. **在租赁期开始日或之前支付的租赁付款额**，存在**租赁激励**的，应**扣除**已享受的租赁激励相关金额；\n  3. 承租人发生的**初始直接费用**；\n  4. 承租人为拆卸及移除租赁资产、复原租赁资产所在场地或将租赁资产恢复至租赁条款约定状态**预计将发生的成本**（属于为生产存货发生的，按存货准则处理）。\n- **公式**：`使用权资产 = 租赁负债 + 租赁期开始日或之前已付租金 + 初始直接费用 + 预计复原成本 − 已享受的租赁激励`\n- **易错**：把已付的第一期租金漏计入使用权资产同时重复计入租赁负债（正确做法：**已付部分计入使用权资产，不计入租赁负债**）；漏减租赁激励；把复原成本直接费用化。\n- **考察**：2020-17、2021-13\n\n### 考点10　租赁负债的后续计量\n- **优先级**：★★★\n- **内容**：租赁期开始日后，按以下三条原则后续计量：①**确认租赁负债的利息时，增加租赁负债的账面金额**；②**支付租赁付款额时，减少租赁负债的账面金额**；③因**重估或租赁变更**等原因导致租赁付款额变动时，重新计量租赁负债的账面价值。计息使用的**周期性利率**＝初始计量时采用的折现率，或重新计量时采用的**修订后的折现率**。利息费用计入当期损益（按借款费用等准则应计入相关资产成本的除外）。未纳入租赁负债计量的可变租赁付款额（非取决于指数或比率的），在实际发生时计入当期损益。\n- **分录**：\n  ```\n  支付租金：借：租赁负债——租赁付款额\n              贷：银行存款\n  确认利息：借：财务费用——利息费用\n              贷：租赁负债——未确认融资费用\n  ```\n- **易错**：把当期利息按\"租赁付款额×利率\"算，而不是**期初租赁负债账面价值（摊余成本）×周期性利率**；把未确认融资费用的摊销方向写反。\n- **考察**：2021-13\n\n### 考点11　租赁负债的重新计量（四种情形）\n- **优先级**：★★\n- **内容**：发生下列**四种情形**时，承租人应当按**变动后的租赁付款额的现值**重新计量租赁负债，并**相应调整使用权资产的账面价值**；使用权资产账面价值**已调减至零**但租赁负债仍需进一步调减的，剩余金额**计入当期损益**：\n  1. **实质固定付款额发生变动**（如原为可变租赁付款额，后因可变性消除而成为实质固定付款额）；\n  2. **取决于指数或比率的可变租赁付款额的变动**（采用反映变动后指数或比率的新折现率）；\n  3. **根据担保余值预计应付金额的变动**；\n  4. **购买选择权、续租选择权或终止租赁选择权的评估结果或实际行使情况发生变化**（如市场房价显著上涨使承租人合理确定将行使购买选择权）。\n- **易错**：把重新计量差额计入当期损益（正确做法是**调整使用权资产**，只有使用权资产已减至零的剩余部分才进损益）；忘记更换折现率。\n- **考察**：—\n\n### 考点12　使用权资产的后续计量（折旧、减值、不得转回）\n- **优先级**：★★★\n- **内容**：承租人应当采用**成本模式**对使用权资产进行后续计量，即以**成本减累计折旧及累计减值损失**计量。①**折旧**：参照固定资产准则，**自租赁期开始日起**计提折旧；通常自租赁期开始的**当月**计提，当月计提确有困难的可以选择自**下月**计提，但应对同类使用权资产采取**相同**的折旧政策。②**折旧期间**：能够合理确定租赁期届满时取得租赁资产所有权的，在租赁资产**剩余使用寿命**内计提折旧；否则在**租赁期与租赁资产剩余使用寿命两者孰短**的期间内计提。③**减值**：按资产减值准则处理，借记「资产减值损失」、贷记「使用权资产减值准备」；**使用权资产减值准备一旦计提，不得转回**，并按扣除减值损失之后的账面价值计提后续折旧。\n- **易错**：按使用权资产的\"全新使用寿命\"折旧（应为**孰短**）；把减值准备转回；重新计量租赁负债时忘记同步调整使用权资产。\n- **考察**：2020-17、2021-13\n\n### 考点13　租赁变更的会计处理\n- **优先级**：★★★\n- **内容**：**租赁变更**是指原合同条款之外的**租赁范围、租赁对价、租赁期限**的变更（包括增加或终止一项或多项租赁资产的使用权、延长或缩短合同规定的租赁期）；**租赁变更生效日**＝双方就租赁变更达成一致的日期。分两条路径：\n  - **作为一项单独租赁处理**（须**同时**满足）：①该变更通过**增加**一项或多项租赁资产的使用权而**扩大了租赁范围**；②**增加的对价**与租赁范围扩大部分的**单独价格**按该合同情况调整后的金额**相当**。\n  - **不作为单独租赁处理**：在变更生效日，按租赁分拆规定对变更后合同对价进行分摊；按租赁期规定确定变更后的租赁期；采用**变更后的折现率**（**剩余租赁期间的租赁内含利率**；无法确定的，用**租赁变更生效日的承租人增量借款利率**）对变更后的租赁付款额折现，重新计量租赁负债。然后区分：①变更导致**租赁范围缩小或租赁期缩短**的 → **调减使用权资产**账面价值，反映租赁的部分终止或完全终止，相关**利得或损失计入当期损益**；②**其他变更** → 相应**调整使用权资产**账面价值。\n- **特别提醒**：租赁变更导致**租赁期缩短至 1 年以内**的，应当**调减使用权资产**账面价值，部分终止租赁的相关利得或损失记入**\"资产处置损益\"**科目；**企业不得改按短期租赁进行简化处理或追溯调整**。\n- **易错**：把\"扩大范围但加价与单独价格不相当\"的变更当成单独租赁；变更后仍用原折现率；租赁期缩短至 1 年内就改用短期租赁简化处理（**明确禁止**）。\n- **考察**：—\n\n### 考点14　短期租赁和低价值资产租赁的简化处理\n- **优先级**：★★★\n- **内容**：对于**短期租赁**和**低价值资产租赁**，承租人**可以选择**不确认使用权资产和租赁负债；作出该选择的，应当将租赁付款额在**租赁期内各个期间按照直线法或其他系统合理的方法计入相关资产成本或当期损益**。\n  - **短期租赁**：指在**租赁期开始日**，租赁期**不超过 12 个月**的租赁。注意：**不能简单认为\"合同期 1 年\"就是短期租赁**——必须基于所有相关事实和情况判断可强制执行合同的期间以及是否存在**实质续租、终止等选择权**；如果历史上有**逐年续签惯例**，或**承租人与出租人互为关联方**，尤其应当谨慎确定租赁期（教材例 14-13：不可撤销期 9 个月＋可合理确定行使的 5 个月续租权 → 租赁期 14 个月 → **不属于**短期租赁）。含**购买选择权**的租赁也**不属于**短期租赁。\n  - **低价值资产租赁**：指**单项租赁资产为全新资产时价值较低**的租赁。判断应基于**租赁资产全新状态下的绝对价值**，**不受承租人规模、性质影响，也不考虑资产已使用年限及对承租人的重要性**；还须满足：承租人可从**单独使用**该资产或将其与易于获得的其他资源一起使用中获利，且该资产与合同中的其他资产**不存在高度依赖或高度关联关系**。常见低价值资产：平板电脑、普通办公家具、电话等小型资产。**如果承租人已经或者预期要转租该租赁资产，则不能**将原租赁按低价值资产租赁简化处理。符合低价值资产租赁的判断，**不代表**承租人若购入该资产时其不符合固定资产的确认条件。\n  - **变更衔接**：按简化会计处理的短期租赁发生租赁变更或因其他原因导致租赁期发生变化的，承租人应当将其**视为一项新租赁**，重新判断是否可选择简化会计处理。\n- **易错**：按资产的\"账面残值\"或\"承租人重要性水平\"判断低价值（应为**全新状态绝对价值**）；把含续租/购买选择权的 1 年期合同当短期租赁；对已计划转租的低价值资产用简化处理。\n- **考察**：—\n\n### 考点15　出租人的租赁分类（融资租赁与经营租赁）★必背★\n- **优先级**：★★★\n- **内容**：**出租人**应当在租赁期开始日将租赁分为**融资租赁**和**经营租赁**（**承租人**是单一模型，**不区分**）。**融资租赁**是指实质上转移了与租赁资产所有权有关的**几乎全部风险和报酬**的租赁；**经营租赁**是除此之外的租赁。分类为融资租赁的**常见情形**：①租赁期届满时租赁资产的所有权**转移**给承租人；②承租人有**购买选择权**，且所订立的购买价款预计**远低于**行使选择权时租赁资产的公允价值；③租赁期占租赁资产**使用寿命的大部分**；④租赁收款额的现值**几乎相当于**租赁资产公允价值；⑤**租赁资产性质特殊**，如不作较大改造，只有承租人才能使用。此外，存在下列**一项或多项迹象**的，也可能分类为融资租赁：①若承租人撤销租赁，撤销对出租人造成的损失由**承租人承担**；②租赁资产余值的公允价值波动产生的利得或损失**归属于承租人**；③承租人**有能力以远低于市场水平的租金继续租赁**至下一期间。\n- **重要说明**：上述情形和迹象**并非总是决定性的**，相关量化标准只是**指导性标准**；应综合考虑经济激励的有利与不利方面，以**与租赁资产所有权相关的风险和报酬的转移程度**为依据作综合判断。若有其他特征充分表明实质上**没有**转移几乎全部风险和报酬（如租赁期结束时以相当于届时公允价值的**可变付款额**转让所有权，或因存在可变租赁付款额导致实质上未转移），则应分类为**经营租赁**。\n- **易错**：用\"是否最终转移所有权\"作为唯一标准；把\"生产商出租其产品构成融资租赁\"误判为经营租赁（2020-12 的答案就是**融资租赁**）。\n- **考察**：2020-12\n\n### 考点16　出租人对融资租赁的会计处理（租赁投资净额与未实现融资收益）\n- **优先级**：★★★\n- **内容**：在租赁期开始日，出租人应当**确认应收融资租赁款**，并**终止确认融资租赁资产**。应收融资租赁款以**租赁投资净额**作为入账价值。**租赁投资净额＝未担保余值＋租赁期开始日尚未收到的租赁收款额按租赁内含利率折现的现值**。**租赁内含利率**＝使租赁收款额的现值与未担保余值的现值之和（即租赁投资净额）等于**租赁资产公允价值与出租人的初始直接费用之和**的利率 → 因此**出租人的初始直接费用包含在租赁投资净额中，也即包含在应收融资租赁款的初始入账价值中**。**租赁收款额**包括五项：①承租人需支付的固定付款额及实质固定付款额（存在租赁激励的应扣除）；②取决于指数或比率的可变租赁付款额（按租赁期开始日的指数或比率确定）；③合理确定承租人将行使的购买选择权行权价格；④承租人行使终止租赁选择权需支付的款项（前提是租赁期反映出承租人将行使）；⑤由承租人、与承租人有关的一方以及有经济能力履行担保义务的独立第三方向出租人提供的**担保余值**。**增值税不属于租赁收款额**，不纳入应收融资租赁款的计量；出租人收取的**租赁保证金**不属于租赁收款额，应作为**单独的负债**处理，**不应冲减**应收融资租赁款。\n- **后续计量**：按**实际利率法**（租赁内含利率）在租赁期内分摊**未实现融资收益**，确认**租赁收入**。\n- **分录**：\n  ```\n  租赁期开始日：借：应收融资租赁款——租赁收款额\n                  贷：银行存款（初始直接费用）\n                      融资租赁资产（账面价值）\n                      资产处置损益（公允价值与账面价值之差，可借贷）\n                      应收融资租赁款——未实现融资收益\n  分摊收益：  借：应收融资租赁款——未实现融资收益\n                贷：财务费用——利息收入（租赁收入）\n  收到租金：  借：银行存款\n                贷：应收融资租赁款——租赁收款额\n  ```\n- **易错**：把出租人的初始直接费用**费用化**（普通融资租赁出租人应计入租赁投资净额）；用合同利率或市场利率而不是**租赁内含利率**摊销未实现融资收益；忘记把租赁激励从租赁收款额中扣除。\n- **考察**：2020-15、2021-13\n\n### 考点17　出租人对经营租赁的会计处理\n- **优先级**：★★★\n- **内容**：①**租金收入**：在租赁期内各个期间按照**直线法**（或其他系统合理的方法）确认为收入；**初始直接费用应当资本化**至租赁资产的成本，在租赁期内按照**与租金收入相同的确认基础**分期计入当期损益。②**折旧**：对于经营租赁资产中的固定资产，应当采用与自有应计提折旧资产相一致的折旧政策计提折旧。③**减值**：按资产减值准则处理。④**可变租赁付款额**：取得**未纳入租赁投资净额计量**的可变租赁付款额（如与资产未来绩效或使用情况挂钩），在实际发生时计入当期损益。\n- **注意**：投资性房地产以经营租赁方式出租的，租金收入计入**其他业务收入**，折旧计入**其他业务成本**（教材与第五章衔接）。\n- **分录（经营租赁出租人）**：\n  ```\n  预收租金：借：银行存款　贷：预收账款\n  按期确认：借：预收账款　贷：其他业务收入\n  结转折旧：借：其他业务成本　贷：投资性房地产累计折旧／固定资产累计折旧\n  ```\n- **易错**：按收付实现制确认租金（应**按直线法分摊**，预收不直接确认收入）；把初始直接费用一次计入当期损益；漏提出租资产的折旧。\n- **考察**：2015-13、2020-16\n\n### 考点18　生产商或经销商出租人（销售型融资租赁）★必背★\n- **优先级**：★★★\n- **内容**：生产商或经销商出租其产品或商品**构成融资租赁**时，该交易产生的损益应相当于按照考虑适用的**交易量或商业折扣后的正常售价**直接销售租赁资产所产生的损益。在**租赁期开始日**：\n  - **收入**：按**租赁资产公允价值**与**租赁收款额按市场利率折现的现值**两者**孰低**确认；\n  - **销售成本**：按**租赁资产账面价值扣除未担保余值的现值后的余额**结转；\n  - 收入与销售成本的差额作为**销售损益**（同时反映\"销售利润\"与后续按实际利率法确认的\"融资收益\"）。\n  - **取得融资租赁所发生的成本**：由于主要与生产商或经销商赚取的**销售利得**相关，应当在**租赁期开始日计入损益**（**销售费用/管理费用**）——**与其他融资租赁出租人不同，生产商或经销商出租人的此类成本不属于初始直接费用，不计入租赁投资净额**。\n  - 由于收入与租赁投资净额是基于租赁资产的**公允价值**确定的，需要根据**租赁收款额、未担保余值和租赁资产公允价值重新计算租赁内含利率**，再按实际利率法分摊未实现融资收益。\n- **易错**：把取得租赁的成本（差旅费、法律费用、佣金）计入**租赁投资净额**（2020-14 的正确答案是**全部计入当期损益**：管理费用 0.5 万、销售费用 1.5 万）；用租赁收款额全额而不\"孰低\"确认收入；把销售损益与融资收益混为一谈。\n- **考察**：2020-12、2020-13、2020-14\n\n### 考点19　转租赁\n- **优先级**：★\n- **内容**：转租情况下，**原租赁合同和转租赁合同通常都是单独协商的，交易对手也是不同的企业**，转租出租人应当**分别**根据承租人和出租人的会计处理要求进行会计处理。转租出租人在对转租赁进行分类时，应**基于原租赁中产生的使用权资产**（而非作为租赁对象的不动产或设备）进行分类——因为原租赁资产不归转租出租人所有，也未计入其资产负债表。**原租赁为短期租赁**且转租出租人作为承租人已按短期租赁简化处理的，转租赁应当分类为**经营租赁**。\n- **易错**：基于\"原租赁资产\"而不是\"使用权资产\"分类；把原租赁与转租赁合并为一项处理。\n- **考察**：—\n\n### 考点20　售后租回——是否属于销售的判断★必背★\n- **优先级**：★★★\n- **内容**：卖方兼承租人将资产转让给其他企业（买方兼出租人）并从买方兼出租人租回该项资产的，**卖方兼承租人和买方兼出租人均应按照售后租回交易的规定进行会计处理**。企业应当**按照《企业会计准则第 14 号——收入》的规定，评估确定售后租回交易中的资产转让是否属于销售**，并进行相应会计处理。\n- **关键判断点**：**是否具有资产的法定所有权本身并非会计处理的决定性因素**。如果承租人在资产转移给出租人**之前**已经取得对该资产的**控制**，则该交易属于售后租回交易；如果承租人在资产转移给出租人之前**未能取得对该资产的控制**，那么即使承租人在资产转移之前先获得了该资产的**法定所有权**，该交易**也不属于**售后租回交易。\n- **典型\"不属于销售\"的情形**：约定在租赁期届满时以**远低于届时公允价值**的价格回购（教材例 14-19：以 100 元购买 36 000 000 元的建筑物）→ 表明买方在转让时点**未取得控制权**，不符合收入准则关于销售成立的条件。\n- **易错**：以\"是否办理了产权过户\"判断是否属于销售；忽略回购价格与公允价值的比较。\n- **考察**：2017-10、2020-17\n\n### 考点21　售后租回——资产转让属于销售\n- **优先级**：★★★\n- **内容**：卖方兼承租人应当**按照资产账面价值中与租回获得的使用权有关的部分**，计量售后租回所形成的**使用权资产**，并**仅就转让至买方兼出租人的权利**确认相关**利得或损失**。买方兼出租人按其他适用准则对资产购买进行会计处理，并按租赁准则对资产出租进行会计处理。\n- **售价与公允价值不一致的处理**：①销售对价**低于**市场价格的款项 → 作为**预付租金**处理；②销售对价**高于**市场价格的款项 → 作为买方兼出租人向卖方兼承租人提供的**额外融资**处理。同时，承租人按**公允价值调整**相关销售利得或损失，出租人按**市场价格调整**租金收入。确定差额时应当按以下**二者中较易确定者**进行：a. 销售对价的公允价值与资产的公允价值的差异；b. 合同付款额的现值与按市场租金计算的付款额的现值的差异。\n- **公式**（教材例 14-20 口径）：\n  - `使用权资产 = 该建筑物原账面价值 × （租赁相关付款额的现值 ÷ 该建筑物的公允价值）`\n  - `出售全部利得 = 公允价值 − 原账面价值`\n  - `与使用权相关的利得 = 全部利得 × （租赁相关付款额的现值 ÷ 公允价值）` → **不予确认**\n  - `与转让至买方兼出租人的权利相关的利得 = 全部利得 − 与使用权相关的利得` → **确认（资产处置损益）**\n  - `租赁负债 = 租赁相关年付款额 × 期数`（按市场利率折现确定现值，差额为未确认融资费用）\n- **分录（简化）**：\n  ```\n  借：固定资产清理（原账面价值扣除累计折旧）\n      累计折旧\n      贷：固定资产\n  借：银行存款（售价中的\"公允价值\"部分）\n      使用权资产\n      租赁负债——未确认融资费用\n      贷：固定资产清理\n          租赁负债——租赁付款额\n          资产处置损益（仅转让至买方的权利对应部分）\n  额外融资部分：借：银行存款　贷：长期应付款\n  ```\n- **易错**：把出售的全部利得一次性确认（应**按比例**只确认与转让至买方的权利相关部分）；把高于市价的售价全额确认为收入（超额部分应作为**额外融资**）；后续计量租赁负债时导致确认与\"租回所获得的使用权\"有关的利得或损失。\n- **考察**：2017-10\n\n### 考点22　售后租回——资产转让不属于销售\n- **优先级**：★★★\n- **内容**：资产转让**不属于销售**的，卖方兼承租人**不终止确认**所转让的资产，而应当将转让所得价款作为**金融负债**（**长期应付款**）处理，并按照 CAS 22 进行会计处理。买方兼出租人**不确认**被转让资产，而应当将支付的现金作为**金融资产**（**长期应收款**）处理，并按 CAS 22 进行会计处理。\n- **分录**：\n  ```\n  卖方兼承租人：借：银行存款　贷：长期应付款\n  买方兼出租人：借：长期应收款　贷：银行存款\n  ```\n- **易错**：仍按\"销售＋租回\"两条线处理并确认资产处置损益；把长期应付款误记入租赁负债；忽略后续按实际利率法确认利息费用与利息收入。\n- **考察**：2020-17\n\n### 考点23　售后回购与售后租回的衔接（与收入准则的分工）\n- **优先级**：★★★\n- **内容**：售后回购交易首先按**收入准则**判断交易实质——**企业因存在与客户的远期安排而负有回购义务或企业享有回购权利**的，表明客户在销售时点并未取得相关商品控制权，应当作为**租赁交易**或**融资交易**处理：①**回购价格低于原售价**的，应当视为**租赁交易**，按租赁准则处理；②**回购价格高于原售价**的，应当视为**融资交易**，按金融工具准则处理（确认为金融负债）。卖方（出租人）不确认销售收入，将收到的款项确认为**预收账款**（售价中等于租赁期内租金收入的部分）与**长期应付款**（回购义务现值），并继续对标的资产计提折旧。\n- **易错**：把售后回购一律作为销售处理；把\"回购价低于原售价\"误判为融资交易；漏提标的资产的折旧。\n- **考察**：2020-16、2020-17\n\n---\n\n## 本章易错陷阱汇总\n\n1. **承租人单一模型、出租人双分类**：承租人**不再区分**融资租赁与经营租赁，一律确认使用权资产和租赁负债；**出租人仍须区分**融资租赁与经营租赁。\n2. **免租期包含在租赁期内**：租赁期开始日取决于\"资产可供承租人使用\"，与合同约定的起租日、租金起付日**无关**。\n3. **续租/终止选择权只看\"合理确定\"**：续租权\"合理确定将行使\"才计入租赁期；终止权\"合理确定将不会行使\"才计入；评估核心是**经济激励**（如罚金是否重大、续租价是否显著低于市价）。\n4. **租赁负债不含增值税、不含租赁保证金、不含与销售额挂钩的可变租金**；保证金对承租人是**单独资产**，对出租人是**单独负债**。\n5. **折现率顺序不能颠倒**：承租人先找**租赁内含利率**，找不到才用**增量借款利率**；出租人用**内含利率**。\n6. **使用权资产四项成本**中，\"租赁期开始日或之前支付的租赁付款额\"要**扣除已享受的租赁激励**；第一期已付租金计入使用权资产而**不再计入租赁负债**。\n7. **租赁负债重新计量的差额调整使用权资产**，使用权资产已减至零的剩余部分才进当期损益。\n8. **使用权资产折旧用\"孰短\"**（租赁期与剩余使用寿命孰短，除非能合理确定取得所有权）；**使用权资产减值不得转回**。\n9. **租赁期缩短至 1 年以内不得改按短期租赁简化处理**，相关利得损失记入\"**资产处置损益**\"。\n10. **短期租赁看\"实质租赁期\"不看\"合同期 1 年\"**；含购买选择权的不是短期租赁；低价值资产看**全新状态绝对价值**，且已计划转租的不能简化。\n11. **出租人初始直接费用的两条路**：普通融资租赁出租人→计入**租赁投资净额**；**生产商/经销商出租人取得租赁的成本→直接计入当期损益**（销售费用/管理费用）。\n12. **生产商或经销商出租人的收入用\"孰低\"**：租赁资产公允价值与租赁收款额按市场利率折现的现值孰低；销售成本扣**未担保余值的现值**；并须**重算租赁内含利率**。\n13. **售后租回第一步是\"是否属于销售\"**：不属于销售 → 卖方作**金融负债（长期应付款）**、不终止确认资产、**不确认处置损益**；买方作**金融资产（长期应收款）**、不确认资产。\n14. **属于销售时只按比例确认利得**：\"与租回所获得的使用权相关\"的利得**不确认**，只确认与转让至买方的权利相关的部分。\n15. **售价高于公允价值的部分是\"额外融资\"**，不是收入；售价低于公允价值的部分是\"**预付租金**\"。\n\n## 本章分录模板\n\n**1. 承租人——租赁期开始日**\n```\n借：使用权资产（租赁负债＋已付租金＋初始直接费用＋复原成本－已收激励）\n    租赁负债——未确认融资费用（租赁付款额总额－现值）\n    贷：租赁负债——租赁付款额（未支付租赁付款额合计）\n        银行存款（租赁期开始日或之前支付的租金＋初始直接费用）\n        预计负债（复原成本）\n        银行存款（收到的租赁激励，冲减使用权资产）\n```\n\n**2. 承租人——后续计量**\n```\n确认利息：借：财务费用——利息费用（期初租赁负债余额×周期性利率）\n            贷：租赁负债——未确认融资费用\n支付租金：借：租赁负债——租赁付款额\n            贷：银行存款\n计提折旧：借：管理费用／销售费用／制造费用等\n            贷：使用权资产累计折旧\n计提减值：借：资产减值损失\n            贷：使用权资产减值准备        ← 不得转回\n```\n\n**3. 出租人——融资租赁**\n```\n租赁期开始日：借：应收融资租赁款——租赁收款额\n                  贷：融资租赁资产\n                      银行存款（初始直接费用）\n                      应收融资租赁款——未实现融资收益\n                      资产处置损益（差额，可借可贷）\n分摊融资收益：借：应收融资租赁款——未实现融资收益\n                贷：财务费用——利息收入\n收到租金：    借：银行存款\n                  贷：应收融资租赁款——租赁收款额\n```\n\n**4. 生产商或经销商出租人**\n```\n借：应收融资租赁款——租赁收款额（租赁收款额合计）\n    贷：主营业务收入（租赁资产公允价值与租赁收款额按市场利率折现现值孰低）\n        应收融资租赁款——未实现融资收益\n借：主营业务成本（账面价值－未担保余值的现值）\n    贷：库存商品\n借：销售费用／管理费用（取得租赁发生的成本）\n    贷：银行存款\n```\n\n**5. 售后租回（资产转让不属于销售）**\n```\n卖方兼承租人：借：银行存款　贷：长期应付款\n买方兼出租人：借：长期应收款　贷：银行存款\n```\n\n## 与其他章的联动\n\n- **与第五章（投资性房地产）**：以经营租赁方式出租的投资性房地产，租金收入计入其他业务收入、折旧计入其他业务成本；预收租金先入预收账款（2015-13、2020-16）。\n- **与第八章/第十一章（负债、借款费用）**：租赁负债的利息费用按实际利率法确认，符合条件时应资本化计入相关资产成本；未确认融资费用的摊销结构同长期借款。\n- **与第十七章（收入、费用和利润）**：售后回购交易先在收入准则判断交易实质，再回落到本章的租赁交易或金融工具准则的融资交易（2020-16、2020-17）；生产商或经销商出租人的\"收入/成本\"确认口径与收入准则的销售对价逻辑一致。\n- **与第十三章（金融工具与保险合同）**：售后租回中不属于销售的转让所得确认为长期应付款（金融负债）；无法确定租赁内含利率时的增量借款利率参照金融工具的利率确定思路；租赁应收款须按预期信用损失计提减值。\n- **与第二十七章（合并财务报表）**：母子公司之间的内部租赁交易（承租方与出租方分处集团内）需要抵销使用权资产、租赁负债、内部租赁损益，并调整少数股东损益与少数股东权益（2021-13）。\n- **与第十九章（所得税）**：使用权资产与租赁负债的账面价值与计税基础不同，会产生暂时性差异，需确认递延所得税。\n",
    "15": "# 第十五章 持有待售的非流动资产、处置组和终止经营\n\n> 本题库考察频次：4 题 ｜ 优先级：C 类（低频章，≤4 题） ｜ 建议投入：重点掌握 + 把「划分条件」「孰低计量」「停止计提折旧」三件事背成一条线，本章常以跨章小问出现\n\n---\n\n## 一、持有待售类别的分类\n\n### 划分持有待售类别的两个条件（必须同时满足）\n- **优先级**：★★★\n- **内容**：企业**主要通过出售而非持续使用**一项非流动资产或处置组收回其账面价值的，应当将其划分为持有待售类别。划分为持有待售类别应**同时满足**两个条件：\n  1. **可立即出售**：根据类似交易中出售此类资产或处置组的惯例，在**当前状况下即可立即出售**。为满足该条件，企业应当具有在当前状态下出售该非流动资产或处置组的**意图和能力**，并应在出售前做好相关准备（如按惯例允许买方在报价和签署合同前对资产进行**尽职调查**等）。此处\"出售\"**包括具有商业实质的非货币性资产交换**。\n  2. **出售极可能发生**：即企业**已经就一项出售计划作出决议**且**获得确定的购买承诺**，**预计出售将在一年内完成**。有关规定要求企业相关权力机构或者监管部门批准后方可出售的，应当**已经获得批准**。具体包含三层含义：\n     - 一是出售决议一般需要由企业**相应级别的管理层**作出；若规定要求权力机构或监管部门批准，应当已经获得批准；\n     - 二是企业已经获得**确定的购买承诺**（与其他方签订的具有法律约束力的购买协议，包含交易价格、时间和足够严厉的违约惩罚等重要条款，使协议出现重大调整或撤销的可能性极小）；\n     - 三是预计自划分为持有待售类别起**一年内**，出售交易能够完成。\n- **对\"持有待分配给所有者\"类别**：应同时满足①在当前状况下**即可立即分配**；②分配**很可能发生**（企业已经开展与分配相关的工作，分配出现重大调整或撤销的可能性极小，预计分配将在**一年内**完成）；有关规定要求批准的应当已经获得批准。\n- **易错（本题库 2019-11 的考点）**：①**「可立即出售」和「出售极可能发生」缺一不可**；②只要资产在**当前状态下**不能立即出售（如需先完成积压订单、需先整治污染），就不符合划分条件。教材例 15-2：企业 F 出售生产 D 产品的全套生产线——**情形一**（出售同时把未完成客户订单一并移交买方，不影响转让时间）→ 符合\"可立即出售\"；**情形二**（需完成积压客户订单后再转让）→ **不符合**划分条件。\n- **考察**：2019-11\n\n### 延长一年期限的两种例外\n- **优先级**：★★★\n- **内容**：划分为持有待售类别后，若未能在一年内完成出售，**只有**下列两种情形可以维持原分类：\n  1. **意外设定条件**：买方或其他方**意外**设定导致出售延期的条件，企业针对这些条件**已经及时采取行动**，且**预计能够自设定导致出售延期的条件起一年内顺利化解**延期因素。即企业在初始分类时满足了所有条件，此后买方或其他方提出意料之外的条件，企业已采取措施应对，预计能在一年内满足条件并完成出售，即使出售无法在最初一年内完成，仍可维持原持有待售类别的分类。\n  2. **发生罕见情况**：因发生罕见情况导致未能在一年内完成出售，企业在**最初一年内已经针对这些新情况采取必要措施**且**重新满足了**持有待售类别的划分条件。「罕见情况」主要指因**不可抗力**引发的情况、**宏观经济形势发生急剧变化**等不可控情况（教材例 15-4：全球金融危机导致买方违约、企业降价重新签约，仍可继续划分为持有待售）。\n- **教材例 15-3 的三种情形（判断范式）**：\n  - **情形一**：签订转让合同前**买卖双方均不知晓**影响交易进度的环境污染问题 → 属**符合延长一年期限的例外事项**，发现延期事项后预计一年内消除延期因素，**仍可划分为持有待售类别**。\n  - **情形二**：企业**知晓**污染并在合同中承诺自某日起开展污染清除（预计持续 8 个月）→ 在污染得到整治前该处置组**在当前状态下不可立即出售**，**不符合**划分条件。\n  - **情形三**：企业**知晓**污染但约定**不承担**清除义务，且**转让价格已考虑污染因素** → 该处置组于**协议签署日即符合**划分为持有待售类别的条件。\n- **易错**：判断的**分水岭**是「企业是否知晓该瑕疵、以及该瑕疵是否已反映在交易安排/价格中」——**不知晓 → 例外可维持；知晓且需自行整治 → 不可立即出售；知晓且不承担整治义务 → 立即符合**。\n- **考察**：—\n\n### 不再继续符合划分条件的处理\n- **优先级**：★★\n- **内容**：持有待售的非流动资产或处置组**不再继续满足**持有待售类别划分条件的，企业**不应当**继续将其划分为持有待售类别。部分资产或负债从持有待售的处置组中移除后，如果处置组中**剩余**资产或负债新组成的处置组仍然满足划分条件，企业应当将新组成的处置组划分为持有待售类别；否则应当将**满足**划分条件的非流动资产**单独**划分为持有待售类别。\n- **教材例 15-5**：企业 A 降低写字楼售价并积极开展市场营销，但在原定一年期满前始终没有找到合适买家 → 写字楼**不再符合**划分条件，企业 A 应当根据实际情况**重新**将其作为**固定资产或者投资性房地产**处理。\n- **易错**：从持有待售类别\"退出\"后，该资产**重新开始计提折旧或摊销**（视同未划分过持有待售处理，但已确认的持有待售资产减值损失**不予转回**）。\n\n### 特定分类的具体应用\n- **优先级**：★★★\n- **内容**：\n  - **专为转售而取得的非流动资产或处置组**：对于企业**专为转售**而新取得的非流动资产或处置组，如果在**取得日**满足「预计出售将在一年内完成」的规定条件，且**短期（通常为 3 个月）内很可能满足**划分为持有待售类别的**其他条件**，企业应当**在取得日**将其划分为持有待售类别。其他条件包括：按惯例在当前状况下即可立即出售；企业已经就出售计划作出决议且获得确定的购买承诺；需批准方的应当已经获得批准。\n  - **持有待售的长期股权投资**（高频交叉点）：\n    - 企业出售对子公司投资但**并不丧失控制权**的，**不应当**将拟出售的部分对子公司投资或对子公司投资整体划分为持有待售类别。\n    - 企业因出售对子公司的投资等原因**导致丧失对子公司控制权**的，出售后可能保留部分权益性投资、也可能丧失全部权益。企业应当在拟出售的部分对子公司投资**满足持有待售类别划分条件时**：\n      - 在**母公司个别财务报表**中，将对子公司投资**整体**划分为持有待售类别（**而不是**仅将拟处置的部分投资划分为持有待售类别）；\n      - 在**合并财务报表**中，将子公司**所有资产和负债**划分为持有待售类别（**而不是**仅将拟处置部分相关的资产负债）。\n- **易错**：①「不丧失控制权 → 整体不划分」；「丧失控制权 → 个别报表整体划分、合并报表全部资产负债划分」——两条极易互换的规则（本题库 2021-7 考的就是长期股权投资**部分**拟出售 20% 部分重分类为持有待售资产 2 440 万元，且**不减值**）；②「专为转售取得」的资产是**在取得日**划分，且短期（通常 3 个月）内很可能满足其他条件即可。\n- **考察**：2021-7\n\n---\n\n## 二、持有待售类别的计量\n\n### 划分为持有待售类别时的初始计量（孰低）\n- **优先级**：★★★\n- **内容**：企业初始计量持有待售的非流动资产或处置组时：\n  - 如果其**账面价值低于**其公允价值减去出售费用后的净额 → **不需要**对账面价值进行调整；\n  - 如果**账面价值高于**其公允价值减去出售费用后的净额 → 应当将账面价值**减记**至公允价值减去出售费用后的净额，减记的金额确认为**资产减值损失**，计入当期损益，同时计提**持有待售资产减值准备**，但**不应当重复确认**不适用本章计量规定的资产和负债按相关准则已确认的损失。\n- **公允价值的确定**：按第 39 号准则（公允价值计量）确定。①企业已经获得**确定的购买承诺**的，应当**参考交易价格**确定公允价值，交易价格应当考虑**可变对价、合同中存在的重大融资成分、非现金对价、应付客户对价**等因素的影响；②企业**尚未获得**确定的购买承诺的（如专为转售而取得的），应当对其公允价值作出估计，**优先使用市场报价等可观察输入值**。\n- **出售费用的构成**：是企业发生的**可以直接归属于出售资产或处置组的增量费用**，该费用**直接由出售引起**，并且是企业进行出售所必需的（如果企业不出售资产或处置组，该费用将不会产生）。出售费用包括为出售发生的**特定法律服务、评估咨询等中介费用**，也包括相关的**消费税、城市维护建设税、土地增值税和印花税**等；但**不包括财务费用和所得税费用**。\n- **负净额的兜底规则**：有些情况下，公允价值减去出售费用后的净额可能为**负值**，持有待售的非流动资产或处置组中资产的账面价值应当**以减记至零为限**。是否需要确认相关**预计负债**，应当按照第 13 号准则（或有事项）的规定进行会计处理。\n- **取得日即划分为持有待售的初始计量（常考）**：对于**取得日**划分为持有待售类别的非流动资产或处置组，企业应当在初始计量时比较**假定其不划分为持有待售类别情况下的初始计量金额**和**公允价值减去出售费用后的净额**，以**两者孰低**计量。据此：\n  - 在合并报表中，**非同一控制**下的企业合并中新取得的非流动资产或处置组划分为持有待售类别的，应当按**公允价值减去出售费用后的净额**进行初始计量；\n  - **同一控制**下的企业合并中非流动资产或处置组划分为持有待售类别的，应当按**合并日在被合并方的账面价值**与**公允价值减去出售费用后的净额**孰低进行初始计量；\n  - 除企业合并中取得的非流动资产或处置组外，由以公允价值减去出售费用后的净额作为初始计量金额而产生的差额，应当**计入当期损益**。\n- **计算例题（教材例 15-10）**：公司 L 于 2×25 年 3 月 1 日购入非关联的公司 M 的全部股权，支付价款 1 600 万元；购入前管理层已决议一旦购入将**在一年内**出售给公司 N，公司 M 当前状况下即可立即出售；预计还将支付出售费用 12 万元。\n  - **情形一**：初步议定股权转让价格 **1 620 万元** → 不划分持有待售情况下的初始计量金额 1 600 万元，当日公允价值减出售费用后的净额 1 608 万元（1 620－12），按**孰低**计量 → 取 **1 600 万元**：\n  ```\n  借：持有待售资产——长期股权投资   16 000 000\n    贷：银行存款                     16 000 000\n  ```\n  - **情形二**：尚未议定价格，当日股权公允价值与支付价款 1 600 万元一致 → 净额 1 588 万元（1 600－12），按孰低 → 取 **1 588 万元**，确认资产减值损失 12 万元：\n  ```\n  借：持有待售资产——长期股权投资   15 880 000\n      资产减值损失                    120 000\n    贷：银行存款                     16 000 000\n  ```\n- **易错**：①「取得日即划分」要先造一个**虚拟的不划分时的初始计量金额**（本例是 1 600 万元购买价款），再与净额比较取孰低——**不能**直接用购买价款作为持有待售资产的入账价值；②**持有待分配给所有者**的非流动资产或处置组发生的**分配费用**，是可以直接归属于分配资产或处置组的增量费用，但**不包括财务费用和所得税费用**；除此之外，持有待分配给所有者类别的计量要求与持有待售类别相类似。\n- **考察**：2019-11、2021-6\n\n### 持有待售的非流动资产（非处置组）的后续计量\n- **优先级**：★★★\n- **内容**：**持有待售的非流动资产不应计提折旧或摊销**。（教材同时规定：持有待售的**处置组**中的非流动资产不应计提折旧或摊销；持有待售的处置组中的负债和不适用本章计量规定的金融资产、以公允价值计量的投资性房地产等的利息或租金收入、支出以及其他费用应当**继续予以确认**；资产弃置义务产生的利息费用也应当**继续确认**。）\n- **计算例题（教材例题）**：某仓库原值 100 万元，2×24 年 12 月 31 日已计提折旧 60 万元，2×25 年 1 月 31 日企业 A 与企业 B 签署不动产转让协议，拟在 6 个月内转让，满足其他条件且未发生减值 → 企业 A **应当在 2×25 年 1 月 31 日**（即签署协议并满足划分条件之日）将仓库划分为持有待售类别，并**按照固定资产准则对该固定资产计提 1 月份的折旧**（当月减少的资产当月仍提折旧）；该仓库在划分为持有待售类别前的账面价值为 **59 万元**，**此后不再计提折旧**。\n- **易错**：**划分当月仍要计提折旧（按\"当月减少当月照提\"规则），从划分日之后的期间起停止计提**——这是本章最高频的计算陷阱。本题库 2019-11 考的正是\"持有待售资产的计量\"，正确答案是\"会计处理正确，无需更正（持有待售资产 500 万元，确认资产减值损失 100 万元）\"。\n- **考察**：2019-11\n\n### 持有待售的处置组的后续计量（减值分摊顺序）★★★\n- **优先级**：★★★\n- **内容**：企业在资产负债表日重新计量持有待售的**处置组**时，应当：\n  1. **首先**按照相关会计准则规定计量处置组中**不适用本章计量规定**的资产和负债的账面价值。这些资产和负债可能包括：采用**公允价值模式**进行后续计量的**投资性房地产**、采用**公允价值减去出售费用后的净额**计量的**生物资产**、**金融工具**等不适用本章计量规定的非流动资产，也可能包括流动资产、流动负债和非流动负债（例如处置组中的金融工具应按第 22 号准则计量）。此外，按第 9 号准则（职工薪酬）核算的负债、按第 18 号准则（所得税）核算的**递延所得税资产**、由金融工具准则规范的**金融资产**、由保险合同准则规范的保险合同所产生的权利，也适用各自准则。\n  2. **然后**比较持有待售的处置组**整体**账面价值与公允价值减去出售费用后的净额；若账面价值高于净额，应将账面价值**减记**至净额，减记金额确认为**资产减值损失**计入当期损益，同时计提持有待售资产减值准备，但**不应当重复确认**不适用本章计量规定的资产和负债按相关准则已确认的损失。\n  3. **减值损失的分配顺序**：对于持有待售的处置组确认的资产减值损失金额，如果该处置组包含**商誉**，应当**先抵减商誉的账面价值**，再根据处置组中**适用本章计量规定**的各项非流动资产账面价值**所占比重按比例抵减**其账面价值。确认的资产减值损失金额应当**以适用本章计量规定的各项资产的账面价值为限**，**不应分摊至**处置组中不适用本章计量规定的其他资产。\n  4. **后续增加的处理**：如果后续资产负债表日持有待售的处置组公允价值减去出售费用后的净额**增加**，应……（教材此处规则与\"减值可转回但不得转回商誉\"的框架一致：**以前减记的金额应当予以恢复，并在原已计提的持有待售资产减值准备金额内转回**，转回金额计入当期损益；但**已抵减的商誉账面价值不得转回**）。\n- **计算例题（教材例 15-11，完整链条，务必自己推一遍）**：\n  - 2×25 年 6 月 15 日门店处置组各科目余额（考虑持有待售会计处理前）：库存现金 310 000、应收账款 270 000（坏账准备 10 000）、库存商品 300 000（存货跌价准备 100 000）、其他债权投资 380 000、固定资产 1 100 000（累计折旧 30 000、固定资产减值准备 15 000）、无形资产 950 000（累计摊销 14 000、无形资产减值准备 5 000）、商誉 200 000；持有待售负债：应付账款 310 000、应付职工薪酬 560 000、预计负债 250 000。\n  - **第一步（划分前的先行调整）**：截至 6 月 15 日固定资产还应计提折旧 5 000 元、无形资产还应计提摊销 1 000 元（均用于管理用途）；其他债权投资公允价值降至 360 000 元；固定资产可收回金额降至 1 020 000 元。\n  ```\n  借：管理费用                      6 000\n    贷：累计折旧                    5 000\n        累计摊销                    1 000\n  借：其他综合收益                 20 000\n    贷：其他债权投资               20 000\n  借：资产减值损失                 30 000\n    贷：固定资产减值准备           30 000\n  ```\n  - 调整后各资产负债账面价值：库存现金 310 000、应收账款 **260 000**（270 000－10 000）、库存商品 **200 000**（300 000－100 000）、其他债权投资 **360 000**、固定资产 **1 020 000**、无形资产 **930 000**（950 000－14 000－5 000－1 000）、商誉 **200 000**；**持有待售资产小计 3 280 000 元**；持有待售负债合计 **1 120 000 元**（310 000＋560 000＋250 000），**净额 2 160 000 元**。\n  - **第二步（划分时）**：门店整体公允价值 1 900 000 元，预计转让需支付律师和注册会计师专业咨询费 70 000 元 → 公允价值减去出售费用后的净额 ＝ **1 830 000 元**。持有待售资产小计 3 280 000 元 减去 持有待售负债 1 120 000 元 ＝ 账面净额 **2 160 000 元**，**高于** 1 830 000 元 → 应减记至 1 830 000 元，计提持有待售资产减值准备 **330 000 元**。\n  ```\n  （第一步：将该门店各项资产、负债重分类为持有待售资产/持有待售负债，\n    并把原各项备抵科目结转至「持有待售资产减值准备」相应明细）\n  借：持有待售资产——库存现金 / 应收账款 / 库存商品 / 其他债权投资 /\n                    固定资产 / 无形资产 / 商誉（按账面净额）\n      坏账准备\n      存货跌价准备\n      固定资产减值准备\n      累计折旧\n      累计摊销\n      无形资产减值准备\n    贷：持有待售资产减值准备——坏账准备 / 存货跌价准备\n        持有待售负债——应付账款 / 应付职工薪酬 / 预计负债\n        库存现金 / 应收账款 / 库存商品 / 其他债权投资 /\n        固定资产 / 无形资产 / 商誉（按账面余额）\n\n  （第二步：确认划分时的减值）\n  借：资产减值损失                330 000\n    贷：持有待售资产减值准备——商誉        200 000   ← 先抵减商誉\n        持有待售资产减值准备——固定资产     68 000   ← 130 000 × 1 020/1 950\n        持有待售资产减值准备——无形资产     62 000   ← 130 000 × 930/1 950\n  ```\n  - **重分类分录的要点**：借方「持有待售资产——××」用**账面净额**（如应收账款 260 000、库存商品 200 000、固定资产 1 020 000、无形资产 930 000），贷记原资产科目用**账面余额**（应收账款 270 000、库存商品 300 000、固定资产 1 100 000、无形资产 950 000），差额由各项备抵科目（坏账准备、存货跌价准备、固定资产减值准备、累计折旧、累计摊销、无形资产减值准备）和「持有待售资产减值准备」相应明细承接。\n  - **分配验算**：总减值 330 000 － 商誉 200 000 ＝ 剩余 **130 000** 元，按固定资产 1 020 000 与无形资产 930 000 的**账面价值比例**（1 020∶930）分摊 → 固定资产 68 000 元、无形资产 62 000 元。\n  - **第三步（6 月 30 日重新计量）**：其他债权投资市场报价上升至 370 000 元（适用金融工具准则单独计量，**不参与**持有待售减值）；修理费预计 5 000 元、律师及注册会计师咨询费调整为 40 000 元（**出售费用增加**）；门店公允价值调整为 1 910 000 元 → 公允价值减去出售费用后的净额 ＝ 1 910 000 － 5 000 － 40 000 ＝ **1 865 000 元**；持有待售资产与负债的整体净额为 2 985 000 － 1 120 000 ＋ 10 000（其他债权投资增值）= 1 875 000 元，**高于** 1 865 000 元 → 应**补提**减值 10 000 元。\n  - **列报**：企业 A 在 2×25 年 6 月 30 日资产负债表中应当分别以「持有待售资产」**2 985 000 元**和「持有待售负债」**1 120 000 元**列示。由于该处置组**不符合终止经营定义**，持有待售资产确认的资产减值损失应当在利润表中以**持续经营损益**列示。\n- **易错**：①**必须先处理\"不适用本章计量规定\"的资产负债**（金融资产按金融工具准则、投资性房地产按公允价值模式等），**再**比较整体账面价值与净额——顺序错了金额就错了；②减值损失**先冲商誉，再按适用本章计量规定的非流动资产账面价值比例分摊**，**不得**分摊给金融工具等资产；③**商誉已抵减的部分不得转回**（其他部分在原计提金额内可以转回）；④划分**前**该计提的折旧、摊销、按其他准则应确认的减值（如固定资产可收回金额下降、其他债权投资公允价值下降）仍要照常确认——这一步常被漏掉。\n- **考察**：2019-11、2021-6\n\n### 终止确认（处置持有待售资产时）\n- **优先级**：★★★\n- **内容**：企业**终止确认**持有待售的非流动资产或处置组时，应当将**尚未确认的利得或损失计入当期损益**。按第 19 号准则（外币折算）的规定，企业在处置持有待售的**境外经营**时，应当将与该境外经营相关的外币财务报表折算差额自**其他综合收益转入处置当期损益**；部分处置境外经营的，应当按处置的比例计算处置部分的外币财务报表折算差额，转入处置当期损益。\n- **计算例题（教材例 15-14）**：公司 L 于 2×25 年 6 月 25 日支付律师费 5 万元，6 月 29 日完成股权转让、收到价款 1 607 万元。\n  - **情形一**（2×25 年 3 月 31 日已按净额 1 599 万元与账面 1 600 万元孰低，计提减值 1 万元）：\n  ```\n  （支付出售费用）\n  借：投资收益                50 000\n    贷：银行存款              50 000\n  （完成转让）\n  借：持有待售资产减值准备——长期股权投资   10 000\n      银行存款                        16 070 000\n    贷：持有待售资产——长期股权投资      16 000 000\n        投资收益                         80 000\n  ```\n  - **情形二**（3 月 31 日账面 1 588 万元低于净额 1 599 万元，未计提减值）：\n  ```\n  借：银行存款                                16 070 000\n    贷：持有待售资产——长期股权投资            15 880 000\n        投资收益                                190 000\n  ```\n- **计算例题（教材例 15-15，处置组处置）**：2×25 年 9 月某日门店完成转让，收到价款 1 914 000 元。分录结构（**教材此题的分录金额在 OCR 中数字错乱、加总不平，下列金额仅为结构示意，请以教材原书为准**）：\n  ```\n  （支付修理费、出售费用）\n  借：资产处置损益      5 000        ← 修理费用\n    贷：银行存款        5 000\n  借：资产处置损益     37 000        ← 律师及注册会计师咨询费\n    贷：银行存款       37 000\n\n  （终止确认处置组：结转持有待售资产减值准备与持有待售负债，\n    按账面净额转销持有待售资产各明细，差额计入资产处置损益）\n  借：银行存款\n      持有待售资产减值准备——存货跌价准备\n      持有待售资产减值准备——坏账准备\n      持有待售资产减值准备——固定资产\n      持有待售资产减值准备——无形资产\n      持有待售资产减值准备——商誉\n      持有待售负债——应付账款\n      持有待售负债——应付职工薪酬\n      持有待售负债——预计负债\n      资产处置损益（净损失时）\n    贷：持有待售资产——库存现金\n        持有待售资产——应收账款\n        持有待售资产——库存商品\n        持有待售资产——其他债权投资\n        持有待售资产——固定资产\n        持有待售资产——无形资产\n        持有待售资产——商誉\n        资产处置损益（净利得时）\n\n  （结转原计入其他综合收益的金额）\n  借：资产处置损益\n    贷：其他综合收益\n  （期末结转）\n  借：本年利润\n    贷：资产处置损益\n  ```\n  - **记账要点（比金额更重要）**：①转销「持有待售资产——××」用的是**划分后的账面净额**（如固定资产 1 020 000 元、无形资产 930 000 元、其他债权投资 370 000 元），**不是**划分前的原值；②「持有待售资产减值准备」明细科目**全额冲销**（它承载的是重分类时转入的原各项准备金加上划分后新计提的减值）；③「持有待售负债」按账面金额转销；④倒挤差额计入「资产处置损益」。本题库 2019-11 的正确结论是「会计处理正确，无需更正（持有待售资产 500 万元，确认资产减值损失 100 万元）」，即真正要算准的是**划分时的减值金额**。\n- **易错**：①处置持有待售资产的**尚未确认的利得或损失**计入「**资产处置损益**」；②**处置持有待售的境外经营**时，与该境外经营相关的外币财务报表折算差额应自**其他综合收益转入处置当期损益**；③本题库 2019-11、2021-6 都要求能算到\"划分时确认的减值金额\"和\"处置时的损益\"。\n\n---\n\n## 三、持有待售类别的列报\n\n### 列报要求\n- **优先级**：★★★\n- **内容**：\n  - **持有待售资产和负债不应当相互抵销**。「持有待售资产」和「持有待售负债」应当**分别作为流动资产和流动负债列示**（资产负债表上「持有待售资产」列在流动资产项下、「持有待售负债」列在流动负债项下）。\n  - 对于当期**首次**满足持有待售类别划分条件的非流动资产或划分为持有待售类别的处置组中的资产和负债，**不应当调整可比会计期间资产负债表**，即不对其符合持有待售类别划分条件前各个会计期间的资产负债表进行项目的分类调整或重新列报。\n  - 企业还应当在**附注**中披露有关持有待售的非流动资产或处置组的相关信息。\n  - 非流动资产或处置组在**资产负债表日至财务报告批准报出日之间**满足持有待售类别划分条件的，应当作为**资产负债表日后非调整事项**进行会计处理，并在附注中披露相关信息。\n  - 持有待售资产确认的资产减值损失，若该处置组**不符合**终止经营定义，应当在利润表中以**持续经营损益**列示；若符合终止经营定义，则应按终止经营列报。\n- **易错**：①**不得抵销**——持有待售资产与持有待售负债要分别列示，不能以净额列示；②**不调整可比期间**——这是与\"会计政策变更追溯调整\"完全相反的思路；③资产负债表日后满足划分条件的，属**调整事项还是非调整事项**？教材明确为**非调整事项**（因为划分条件在资产负债表日尚未满足）。\n\n---\n\n## 四、终止经营\n\n### 终止经营的定义与三方面含义\n- **优先级**：★★★\n- **内容**：终止经营，是指企业满足下列条件**之一**的、**能够单独区分**的组成部分，且该组成部分**已经处置或划分为持有待售类别**：\n  1. 该组成部分**代表一项独立的主要业务或一个单独的主要经营地区**；\n  2. 该组成部分是**拟对一项独立的主要业务或一个单独的主要经营地区进行处置的一项相关联计划的一部分**；\n  3. 该组成部分是**专为转售而取得的子公司**。\n- **定义的三方面含义**：\n  1. **应当是企业能够单独区分的组成部分**：该组成部分的经营和现金流量在企业经营和编制财务报表时是能够与企业的其他部分**清楚区分**的。企业组成部分可能是一个**资产组**，也可能是一组**资产组组合**，通常是企业的一个**子公司、一个事业部或事业群**。\n  2. **应当具有一定的规模**：应当代表一项独立的主要业务或一个单独的主要经营地区，或者是拟对一项独立的主要业务或一个单独的主要经营地区进行处置的一项相关联计划的一部分。**并非所有处置组都符合终止经营中的规模条件**，企业需要运用**职业判断**确定终止经营。如果企业主要经营一项业务或主要在一个地理区域内开展经营，企业的**一个主要产品或服务线**就可能满足规模条件。**专为转售而取得的子公司**也是企业的组成部分，但**不要求具有一定规模**，只要是单独区分的组成部分且满足时点要求，即构成终止经营。有些专为转售而取得的重要的**合营企业或联营企业**也可能因为符合上述第 1 项和第 2 项条件而符合终止经营的定义。\n  3. **应当满足一定的时点要求**：符合终止经营定义的组成部分应当属于以下两种情况之一：①组成部分在**资产负债表日之前已经处置**，包括已经出售和结束使用（如关停或报废等）；②组成部分在**资产负债表日尚未处置**，但已经**划分为持有待售类别**。\n- **计算例题（教材例 15-16）**：某快餐企业 A 在全国拥有 500 家零售门店，决定将其位于 Z 市的 8 家零售门店中的**一家门店 C** 出售，并已正式签订转让协议，假设门店 C 符合持有待售类别的划分条件。**判断：尽管门店 C 是一个处置组、也符合持有待售类别的划分条件，但由于它只是一个零售点，不能代表一项独立的主要业务或一个单独的主要经营地区，也不构成拟对一项独立的主要业务或一个单独的主要经营地区进行处置的一项相关联计划的一部分，因此该处置组并不构成企业的终止经营。**\n- **易错**：**「持有待售」≠「终止经营」**——符合持有待售划分条件是成为终止经营的**必要但不充分**条件，还要满足「单独区分 ＋ 规模（或专为转售而取得的子公司）」条件。教材例 15-11 中的门店处置组明确\"满足划分为持有待售类别的条件，但**不符合终止经营的定义**\"，因此其减值损失在利润表中以**持续经营损益**列示。\n- **考察**：—\n\n### 终止经营的列报\n- **优先级**：★★\n- **内容**：企业应当在利润表中**分别列示**「持续经营净利润」和「**终止经营净利润**」；终止经营净利润按**归属于母公司所有者和少数股东**的所有权归属分别列示。持有待售的境外经营处置时，与境外经营相关的外币财务报表折算差额自其他综合收益转入处置当期损益。\n- **易错**：**属于终止经营的处置，其损益在利润表中单独列示为「终止经营净利润」**；不属于终止经营的持有待售处置组的减值损失，则列示为**持续经营损益**。\n\n---\n\n## 本章易错陷阱汇总\n\n1. **划分持有待售的两个条件必须同时满足**：可立即出售 ＋ 出售极可能发生（决议＋确定购买承诺＋一年内完成＋已获批准）。只要资产在当前状态下**不能**立即出售（如需先完成订单、需先自行整治污染），就不符合。\n2. **延长一年期限只有两种情形**：买方或其他方**意外设定**条件且企业已及时行动预计一年内化解；发生**罕见情况**（不可抗力、宏观经济急剧变化）且企业已采取必要措施并重新满足条件。\n3. **划分当月仍要计提折旧/摊销**（按\"当月减少当月照提\"），从划分日之后停止；划分为持有待售后**不再计提折旧或摊销**。\n4. **持有待售资产与持有待售负债不得相互抵销**，分别作为流动资产和流动负债列示。\n5. **不调整可比期间**：首次满足划分条件的，不对以前期间资产负债表作分类调整；资产负债表日后满足划分条件的，作为**日后非调整事项**。\n6. **处置组减值分配顺序**：先处理不适用本章计量规定的资产负债 → 比较整体账面价值与公允价值减出售费用后的净额 → 减值**先抵减商誉** → 余额按适用本章计量规定的各项非流动资产账面价值**比例分摊**，不得分摊给金融工具等。\n7. **商誉已抵减的部分不得转回**；其他部分可在原计提金额内转回。\n8. **出售费用不包括财务费用和所得税费用**（但包括消费税、城建税、土地增值税、印花税及特定法律服务、评估咨询等中介费用）。\n9. **公允价值减去出售费用后的净额为负值时，资产账面价值以减记至零为限**，超出部分按或有事项准则判断是否确认预计负债。\n10. **取得日即划分为持有待售的，要比\"假定的不划分时的初始计量金额\"与净额孰低**，不能直接按购买价款入账。\n11. **丧失控制权 vs 不丧失控制权**：出售对子公司投资**不丧失控制权**的，整体**不得**划分为持有待售；**丧失控制权**的，个别报表将**整体**投资划分、合并报表将子公司**全部**资产负债划分。\n12. **持有待售 ≠ 终止经营**：还要满足单独区分 ＋ 规模（或专为转售而取得的子公司）；不属于终止经营的，其减值损失列示为**持续经营损益**。\n\n## 本章分录模板\n\n```\n【划分为持有待售（处置组），重分类各资产负债】\n借：持有待售资产——各资产（账面余额）\n    各备抵科目（坏账准备、存货跌价准备、累计折旧、累计摊销、固定资产减值准备、无形资产减值准备）\n  贷：持有待售资产减值准备——各明细（原各减值准备的对应结转）\n      持有待售负债——各负债\n      原各资产科目（账面余额）\n\n【划分时的减值（先冲商誉，再按比例分摊）】\n借：资产减值损失\n  贷：持有待售资产减值准备——商誉\n      持有待售资产减值准备——固定资产\n      持有待售资产减值准备——无形资产等\n\n【后续净额回升（原计提金额内转回，商誉部分不得转回）】\n借：持有待售资产减值准备——固定资产/无形资产等\n  贷：资产减值损失\n\n【终止确认（处置）持有待售资产或处置组】\n借：银行存款\n    持有待售资产减值准备——各明细\n    持有待售负债——各负债\n  贷：持有待售资产——各资产\n      资产处置损益（差额，或借方）\n\n【处置持有待售的境外经营】\n借：其他综合收益（外币财务报表折算差额）\n  贷：资产处置损益\n（部分处置的，按处置比例计算）\n\n【不再符合划分条件，重新作为固定资产/无形资产核算】\n借：固定资产/无形资产等（原会计科目）\n    累计折旧/累计摊销等\n  贷：持有待售资产\n      持有待售资产减值准备（结转）\n借：持有待售资产减值准备\n  贷：资产减值损失（在原计提金额内转回，商誉部分除外）\n```\n\n## 与其他章的联动\n\n- **与第 3 章（固定资产）/第 4 章（无形资产）**：**划分为持有待售类别时停止计提折旧或摊销**是本章与这两章最直接的接口；划分**当月**仍按固定资产、无形资产准则计提折旧摊销（本题库 2019-11：仓库 2×25 年 1 月 31 日签署转让协议并划分，1 月份折旧照提，账面价值 59 万元，此后不再计提）。另：**不再符合划分条件**时，应重新将该资产作为**固定资产或投资性房地产**处理并**恢复计提折旧**。\n- **与第 27 章（合并财务报表）**：①丧失对子公司控制权时，**合并财务报表**中将子公司的**所有资产和负债**划分为持有待售类别（**不是**仅将拟处置部分）；②本题库 2017-22 考的是**分步处置子公司股权、构成一揽子交易**时合并报表的商誉、其他综合收益与少数股东权益处理，其答案引用了第十五章；③子公司划分为持有待售时，合并层面需按第 33 号准则作相应调整（如内部交易抵销、少数股东权益的列报）。\n- **与第 6 章（长期股权投资）**：企业出售对子公司投资**但不丧失控制权**的，**不得**将拟出售的部分或整体对子公司投资划分为持有待售类别；**丧失控制权**时，个别报表按**整体**划分，权益法核算**中止**（本题库 2021-7：拟出售 20% 部分 2 440 万元重分类为持有待售资产，**不减值**，并确认递延所得税负债 150 万元与计入其他综合收益的 10 万元）。\n- **与第 20/21 章（非货币性资产交换／债务重组）**：①「出售」**包括具有商业实质的非货币性资产交换**，因此以非货币性资产交换形式换出非流动资产或处置组且该交易具有商业实质的，也应考虑持有待售类别划分；②本题库 2020-10 考的是债权人受让**处置组**（多项资产）的初始计量；③本题库 2021-6 考的是债务重组取得无形资产后**划分为持有待售**时的初始计量与减值（确认资产减值损失 45 万元、递延所得税资产 11.25 万元）。\n- **与第 7 章（资产减值）**：企业合并中取得的商誉应按合理方法**分摊至相关的资产组或资产组组合**，如果处置组即为该资产组或包括在该资产组（组合）中，**处置组也应当包含分摊的商誉**；处置组减值**先抵减商誉**。本章的\"持有待售资产减值准备\"与原准则下的各项减值准备是两套体系——原准备随资产负债重分类**转入**持有待售资产减值准备明细。\n- **与第 19 章（所得税）**：递延所得税资产适用第 18 号准则，**不适用**本章计量规定（即在分配处置组减值时**不参与**比例分摊，也不因其调整而改变计量）；同时持有待售资产的账面价值与计税基础的差异仍需按所得税准则确认递延所得税（本题库 2021-6、2021-7 都要求确认相应递延所得税）。\n- **与第 5 章（投资性房地产）**：采用**公允价值模式**进行后续计量的投资性房地产属于\"**不适用本章计量规定**\"的资产，在处置组的重新计量中应**先**按第 3 号准则（投资性房地产）计量其账面价值，**再**参与处置组整体的账面价值与净额比较，但**不参与**处置组减值的比例分摊。持有待售处置组中此类资产的**租金收入**应当**继续确认**。\n- **与第 13 章（金融工具）**：处置组中的**金融工具**（如以公允价值计量且其变动计入其他综合收益的其他债权投资）按第 22 号准则计量，其公允价值变动**不参与**处置组减值的比例分摊；处置时原计入其他综合收益的金额按金融工具准则结转。\n- **与第 12 章（或有事项）**：弃置义务形成的**预计负债**在资产划分为持有待售类别后，应当作为**持有待售负债**列示，且该资产弃置义务产生的**利息费用应当继续确认**（教材例 15-13：企业 F 转让核电站，原确认 38.55 万元弃置费用预计负债，划分为持有待售类别后转入持有待售负债，利息费用继续确认）。当公允价值减去出售费用后的净额为**负值**、资产账面价值已减记至零时，超出部分是否确认预计负债应按第 13 号准则判断。\n- **与第 25 章（资产负债表日后事项）**：非流动资产或处置组在**资产负债表日至财务报告批准报出日之间**满足持有待售类别划分条件的，应当作为**资产负债表日后非调整事项**处理并在附注中披露。\n- **与第 24 章（会计政策、会计估计变更和差错更正）**：**不调整可比会计期间资产负债表**是本章的明确要求——这与会计政策变更的**追溯调整**形成鲜明对比，是常设的对照题点。\n- **与第 23 章（财务报告）**：资产负债表中「**持有待售资产**」列于流动资产项下、「**持有待售负债**」列于流动负债项下，两者**不得抵销**；利润表中需分别列示「**持续经营净利润**」与「**终止经营净利润**」，终止经营净利润还按归属于母公司和少数股东的所有权归属分别列示。\n",
    "16": "# 第十六章 所有者权益\n\n> 本题库考察频次：0 题（本题库未直接考察） ｜ 优先级：C ｜ 建议投入：重点掌握其他综合收益分类\n\n> ⚠️ **教材文本 OCR 说明**：本章 OCR 可辨认区间自「实收资本增减变动的会计处理」起至「利润分配与股票股利的账务处理」止；**第一节「实收资本概述」中的「一、实收资本增加的会计处理」以及「资本公积」的节内小标题在 OCR 中缺失**，相关条目已在正文标注。可确认的节标题：**第一节 实收资本（含\"二、实收资本增减变动的会计处理\"）**、**第二节 其他权益工具**、**第三节 资本公积、其他综合收益及留存收益**。本章题库未直接考察，全部「考察」字段填 `—`。\n\n## 考点清单\n\n### 实收资本（股本）的确认与计量：面额股与无面额股\n- **优先级**：★★\n- **内容**：实收资本（股份有限公司称\"股本\"）是投资者按照公司章程或合同、协议约定**实际投入企业的资本**，一般按**股票面值总额**（面额股）或**所得股款的一定比例**（无面额股）确认。OCR 保留的无面额股规则：**采用无面额股的，应当将发行股份所得股款的 1/2 以上计入注册资本**。\n- **易错**：①无面额股是\"**1/2 以上**计入注册资本\"，其余部分计入资本公积，不是全额计入股本；②发行股票的**溢价部分（超过面值的股款）计入\"资本公积——股本溢价\"**，不得计入股本；③发行股票支付的**手续费、佣金等交易费用，从溢价收入中扣减**（溢价不足冲减的冲减盈余公积、未分配利润），权益性融资费用**不进当期损益**。\n- **考察**：—\n\n### 实收资本（股本）增加的会计处理\n- **优先级**：★★\n- **内容**：（教材文本 OCR 损坏，条目标注不含教材定位）实收资本（股本）增加的途径主要有三类：①**投资者（含新投资者）追加投入**——按实际收到的出资额借记\"银行存款\"等，按面值或约定份额贷记\"实收资本/股本\"，差额贷记\"资本公积——资本溢价（股本溢价）\"；②**资本公积转增资本**；③**盈余公积转增资本**。后两类都是**所有者权益内部结转**，不改变所有者权益总额。\n- **计算/分录**：\n  ```\n  资本公积转增资本：借：资本公积——资本溢价（股本溢价）　贷：实收资本（股本）\n  盈余公积转增资本：借：盈余公积　　　　　　　　　　　　　贷：实收资本（股本）\n  ```\n- **易错**：①**资本公积、盈余公积转增资本不涉及损益、不产生纳税义务**，只是权益项目内部的重新分类（但会增加股数、影响每股收益）；②**法定公积金转增注册资本后，留存的该项公积金不得少于转增前公司注册资本的 25%**（教材可辨认表述；这是转增的硬约束，转增前必须验算）；③资本溢价（股本溢价）**不能用于弥补亏损**，而盈余公积可以。\n- **考察**：—\n\n### 实收资本（股本）减少与库存股：回购、注销\n- **优先级**：★★★\n- **内容**：实收资本减少的原因大体有两种：①**资本过剩**（一般要发还股款）；②**企业发生重大亏损需要减少实收资本**。有限责任公司和一般企业按法定程序报经批准减资的，借记\"实收资本\"，贷记\"库存现金\"\"银行存款\"等。股份有限公司采**回购本公司股份**方式减资：回购时按实际支付金额借记\"**库存股**\"、贷记\"银行存款\"等；**注销**时按股票面值和注销股数计算的**面值总额借记\"股本\"**，按注销库存股的账面余额**贷记\"库存股\"**，差额**冲减股票发行时原计入资本公积的溢价部分（借记\"资本公积——股本溢价\"）**，回购价格超过\"股本\"与\"资本公积——股本溢价\"之和的部分，**依次借记\"盈余公积\"\"利润分配——未分配利润\"**；回购价格**低于**所对应股本的，差额作为**增加股本溢价**处理（贷记\"资本公积——股本溢价\"）。\n- **计算/分录**（教材例 16-1：发行在外 30 000 000 股、每股面值 1 元，资本公积（股本溢价）6 000 000 元、盈余公积 4 000 000 元；按每股 4 元回购 3 000 000 股并注销）：\n  ```\n  回购：借：库存股 12 000 000　贷：银行存款 12 000 000\n  注销：借：股本 3 000 000、资本公积——股本溢价 6 000 000、盈余公积 3 000 000\n        贷：库存股 12 000 000\n  ```\n- **易错**：①注销是**\"股本→资本公积→盈余公积→未分配利润\"依次冲减**，顺序不能颠倒；②\"库存股\"是**所有者权益的减项**（借方余额），不是资产；③库存股**不得参与利润分配**（教材可辨认表述：\"公司持有的本公司股份不得分配利润\"），**不属于发行在外的普通股**，计算每股收益时不计入分母；④本题库 2018-14 即考注销回购股份，答案冲减**股本 168.75 万元、资本公积——股本溢价 843.75 万元，注销库存股 1012.5 万元**——但该题的教材定位在第十三章（金融工具与保险合同，其中\"权益工具与库存股\"部分）与第二十三章（财务报告），不属于本章直接考察。\n- **考察**：—（本题库 2018-14 涉及库存股与股本，其教材定位在第十三章、第二十三章）\n\n### 资本公积：股本溢价（资本溢价）与其他资本公积\n- **优先级**：★★\n- **内容**：资本公积包括**股本溢价（资本溢价）**与**其他资本公积**两大类。**其他资本公积**的主要形成来源（教材可辨认）：①**以权益结算的股份支付**——换取职工或其他方服务的，按确定的金额借记\"管理费用\"等，同时**增加资本公积（其他资本公积）**；在**行权日**按实际行权的权益工具数量计算确定的金额，**借记\"资本公积——其他资本公积\"**，按计入实收资本或股本的金额**贷记\"实收资本\"或\"股本\"**，差额记入\"**资本公积——资本溢价（或股本溢价）**\"。②**采用权益法核算的长期股权投资**——被投资单位**除净损益、其他综合收益和利润分配以外**的所有者权益其他变动，投资企业按持股比例计算应享有的份额，调整长期股权投资账面价值，同时增加或减少**资本公积（其他资本公积）**；**处置采用权益法核算的长期股权投资时，该项资本公积应当在终止采用权益法核算时全部转入当期损益**。\n- **易错**：①**资本溢价（股本溢价）主要用于转增资本，不能用于弥补亏损**；②权益法下被投资单位的**净损益→投资收益、其他综合收益→其他综合收益、其他权益变动→资本公积（其他资本公积）**，三个去向必须分清，这是权益法的最常见错误；③权益法形成的资本公积**在处置时全部转入当期损益（投资收益）**，而不仅仅是结转比例部分——\"全部\"是关键；④以权益结算的股份支付在**等待期内不进资本公积——股本溢价**，行权时才从\"其他资本公积\"转出。\n- **考察**：—\n\n### 其他权益工具：金融负债与权益工具的区分及其账务处理\n- **优先级**：★★★\n- **内容**：企业发行金融工具应当**按照合同条款及其反映的经济实质而非仅以法律形式**，在初始确认时将该金融工具或其组成部分分类为金融负债或权益工具；除普通股（计入实收资本/股本）以外的、分类为权益工具的，通过\"**其他权益工具**\"科目核算（在所有者权益类科目中设置，按工具种类明细核算）。处理差异（教材可辨认）：\n  | 项目 | 归类为权益工具（无论名称是否含\"债\"） | 归类为金融负债（无论名称是否含\"股\"） |\n  |---|---|---|\n  | 利息支出或股利分配 | 作为发行企业的**利润分配** | 原则上按**借款费用**处理（计入费用/资产成本） |\n  | 回购、注销 | 作为**权益的变动**处理 | 回购或赎回产生的利得或损失计入**当期损益** |\n  | 发行交易费用 | **从权益（资本公积）中扣除**，不够冲减的依次冲减盈余公积、未分配利润 | 分类为债务工具且以**摊余成本**计量的，计入**所发行工具的初始计量金额** |\n- **计算/分录**：\n  ```\n  发行其他权益工具：借：银行存款（实际发行价格）　贷：其他权益工具——优先股、永续债等\n  发行交易费用（承销费、发行登记费）：借：资本公积　贷：银行存款\n  归类为金融负债的：借：银行存款　贷：应付债券——优先股、永续债等（面值）、（利息调整）\n  复合金融工具：先确定负债成分公允价值，余额计入\"其他权益工具\"；交易费用在负债成分与\n                权益成分之间按各自占总发行价款的比例分摊（负债成分部分计入负债初始计量金额，\n                权益成分部分从权益中扣减）——转股/转换时不产生损益\n  ```\n- **易错**：①**\"债\"字不代表负债、\"股\"字不代表权益**，看合同条款与经济实质（如\"固定换固定\"的转股权、发行方有权自主决定是否赎回且不赎回则利率上浮的永续债，可能属于权益工具）；②权益工具的**股利是利润分配、不是费用**，不得计入财务费用；③权益工具的交易费用**冲减权益**，不能费用化，也不能计入资产成本；④金融负债重分类为权益工具、或权益工具重分类为金融负债的，按重分类日的**账面价值/公允价值**调整，差额计入资本公积（不够冲减的依次冲减盈余公积、未分配利润）。\n- **考察**：—\n\n### 其他综合收益的分类：不能重分类进损益 vs 将重分类进损益\n- **优先级**：★★★\n- **内容**：其他综合收益按**以后会计期间能否重分类进损益**分为两类（教材可辨认清单）：\n  | 分类 | 项目 | 处置/终止确认时 |\n  |---|---|---|\n  | 以后会计期间**不能重分类进损益** | ①重新计量设定受益计划净负债或净资产的变动；②权益法下**不能**转损益的其他综合收益；③**其他权益工具投资**（指定为以公允价值计量且其变动计入其他综合收益的非交易性权益工具投资）公允价值变动；④企业**自身信用风险**变动引起的金融负债公允价值变动 | **不得转入当期损益**（非交易性权益工具投资终止确认时，累计利得或损失从其他综合收益**转入留存收益**） |\n  | 以后会计期间在满足规定条件时**将重分类进损益** | ①权益法下**可**转损益的其他综合收益；②其他债权投资（债务工具投资）公允价值变动；③金融资产重分类计入其他综合收益的金额；④其他债权投资信用减值准备；⑤现金流量套期储备（有效套期部分）；⑥外币财务报表折算差额（外币报表折算差额中归属于母公司部分）；⑦自用房地产或作为存货的房地产转换为以公允价值模式计量的投资性房地产，转换日公允价值大于账面价值的差额 | 终止确认/处置时**从其他综合收益中转出，计入当期损益** |\n- **易错**：①**\"其他权益工具投资\"（非交易性权益工具投资）是\"不能重分类\"**，而**\"其他债权投资\"（债务工具投资）是\"将重分类\"**——名字只差一个字，是本考点第一大陷阱；②外币财务报表折算差额只在**处置境外经营**时按比例转入处置当期损益（部分处置按比例转）；③投资性房地产转换形成的其他综合收益，处置该项投资性房地产时全部转入当期损益；④权益法下被投资单位的其他综合收益，**要按被投资单位\"能否重分类\"的属性**对应归入本企业的两类之一，不能一律视为可重分类。\n- **考察**：—\n\n### 留存收益：法定公积金、任意公积金与利润分配顺序\n- **优先级**：★★★\n- **内容**：企业当年实现的净利润，一般按以下顺序分配（教材可辨认）：①**提取法定公积金**——公司制企业按**税后利润的 10%** 提取（非公司制企业也可按超过 10% 的比例提取）；**在计算提取法定盈余公积的基数时，不应包括企业年初未分配利润**；**公司法定公积金累计额为公司注册资本的 50% 以上时，可以不再提取**；**法定公积金不足以弥补以前年度亏损的，在提取法定公积金之前，应当先用当年利润弥补亏损**。②**提取任意公积金**——从税后利润中提取法定公积金后，**经股东会决议**（非公司制企业经类似权力机构批准）提取。③**向投资者分配利润或股利**——弥补亏损和提取公积金后所余税后利润，有限责任公司股东按**实缴出资比例**分取红利（全体股东约定不按出资比例分配的除外）；股份有限公司按**股东持有的股份比例**分配（章程规定不按持股比例分配的除外）。\n- **易错**：①法定公积金的**计提基数是\"当年净利润\"，不含年初未分配利润**（这是本题库最爱设的陷阱，且**提取前要先弥补以前年度亏损**）；②**50% 是\"可以不再提取\"而不是\"必须不再提取\"**，且口径是\"累计额占**注册资本**的比例\"；③向股东分配前的\"弥补亏损—提取法定公积金—提取任意公积金\"顺序不能颠倒；④股东会或董事会违反规定在弥补亏损和提取法定公积金之前分配利润的，**股东必须将违反规定分配的利润退还公司**；公司持有的本公司股份不得分配利润。\n- **考察**：—\n\n### 利润分配与股票股利的账务处理\n- **优先级**：★★\n- **内容**：年度终了结转净利润：借记\"本年利润\"、贷记\"利润分配——未分配利润\"；提取盈余公积：借记\"利润分配——提取法定（任意）盈余公积\"、贷记\"盈余公积——法定（任意）盈余公积\"；**批准发放现金股利**时：借记\"利润分配——应付现金股利\"、贷记\"应付股利\"，实际支付时借记\"应付股利\"、贷记\"银行存款\"；**派发股票股利**（送股）：借记\"**利润分配——转作股本的股利**\"、贷记\"**股本**\"。\n- **计算/分录**（教材例题：股本 100 000 000 元、每股面值 1 元，2×24 年初未分配利润贷方余额 80 000 000 元，2×24 年实现净利润 50 000 000 元；按净利润 10% 提取法定盈余公积、5% 提取任意盈余公积，每股派现 0.2 元、每 10 股送 3 股）：\n  ```\n  结转：借：本年利润 50 000 000　贷：利润分配——未分配利润 50 000 000\n  提取：借：利润分配——提取法定盈余公积 5 000 000、——提取任意盈余公积 2 500 000\n        贷：盈余公积——法定盈余公积 5 000 000、——提取任意盈余公积 2 500 000\n  现金股利：借：利润分配——应付现金股利 20 000 000　贷：应付股利 20 000 000\n  股票股利：借：利润分配——转作股本的股利 30 000 000　贷：股本 30 000 000\n  2×24 年末未分配利润余额 ＝ 80 000 000 + 50 000 000 − 7 500 000 = 122 500 000（元）\n  ```\n- **易错**：①**股票股利不通过\"应付股利\"科目**，直接借\"利润分配——转作股本的股利\"、贷\"股本\"（不涉及现金，不影响所有者权益总额，只改变结构、增加股数）；②**现金股利在\"批准（宣告）发放\"时确认负债**\"应付股利\"，而不是实际支付时；③\"利润分配\"的明细科目（提取法定盈余公积/提取任意盈余公积/应付现金股利/转作股本的股利/未分配利润）要写对，年末只把\"未分配利润\"明细保留余额，其余明细结平；④股票股利按**面值**计入股本（不按市价）。\n- **考察**：—\n\n## 本章易错陷阱汇总\n1. **无面额股**：发行股份所得股款的 **1/2 以上**计入注册资本，其余计入资本公积。\n2. **注销库存股的冲减顺序**：股本 → 资本公积（股本溢价）→ 盈余公积 → 利润分配（未分配利润），顺序错一步即全错；回购价低于股本时差额**增加**股本溢价。\n3. 库存股是**所有者权益的减项**、不得参与利润分配、不属于发行在外普通股（影响每股收益分母）。\n4. 权益法下被投资单位所有者权益变动的三个去向：净损益→**投资收益**；其他综合收益→**其他综合收益**（并按能否重分类细分）；其他权益变动→**资本公积（其他资本公积）**，处置时**全部**转入当期损益。\n5. **其他权益工具投资（不能重分类）vs 其他债权投资（将重分类）**——只看名字极易混淆，判断依据是\"权益工具还是债务工具\"以及\"是否指定\"。\n6. 归类为**权益工具**的金融工具，其**股利分配是利润分配、不是费用**；交易费用**冲减权益**；归类为**金融负债**的，利息按借款费用处理、回购赎回利得损失计入当期损益。\n7. 法定公积金计提基数**不含年初未分配利润**，且提取前须**先弥补以前年度亏损**；累计额达**注册资本 50% 以上**\"可以\"不再提取。\n8. **股票股利不进\"应付股利\"**，现金股利在宣告时确认负债；股票股利按面值计入股本。\n9. 法定公积金**转增注册资本**后，留存的该项公积金**不得少于转增前注册资本的 25%**。\n\n## 本章分录模板（如适用）\n| 业务 | 分录 |\n|---|---|\n| 发行股票（溢价发行） | 借：银行存款（扣除发行费用后净额）　贷：股本、资本公积——股本溢价 |\n| 资本公积转增资本 | 借：资本公积——资本溢价（股本溢价）　贷：实收资本（股本） |\n| 盈余公积转增资本 | 借：盈余公积　贷：实收资本（股本） |\n| 回购本公司股份 | 借：库存股　贷：银行存款 |\n| 注销库存股（回购价高于股本） | 借：股本、资本公积——股本溢价、盈余公积、利润分配——未分配利润　贷：库存股 |\n| 注销库存股（回购价低于股本） | 借：股本　贷：库存股、资本公积——股本溢价 |\n| 以权益结算的股份支付（等待期） | 借：管理费用等　贷：资本公积——其他资本公积 |\n| 权益结算股份支付行权 | 借：资本公积——其他资本公积　贷：股本、资本公积——股本溢价 |\n| 权益法下被投资单位其他权益变动 | 借（贷）：长期股权投资——其他权益变动　贷（借）：资本公积——其他资本公积 |\n| 发行其他权益工具 | 借：银行存款　贷：其他权益工具——优先股、永续债等 |\n| 其他权益工具发行费用 | 借：资本公积　贷：银行存款 |\n| 结转本年净利润 | 借：本年利润　贷：利润分配——未分配利润 |\n| 提取盈余公积 | 借：利润分配——提取法定（任意）盈余公积　贷：盈余公积 |\n| 宣告现金股利 | 借：利润分配——应付现金股利　贷：应付股利 |\n| 派发股票股利 | 借：利润分配——转作股本的股利　贷：股本 |\n\n## 与其他章的联动\n- 与第十章（股份支付）：权益结算的股份支付在等待期形成\"资本公积——其他资本公积\"，行权时转出，本章资本公积考点与之一体两面。\n- 与第八章（负债）：可转换公司债券的**权益成分计入\"其他权益工具\"**，转股后转入\"资本公积——股本溢价\"；负债章的分拆规则在此收口。\n- 与第十三章（金融工具与保险合同）：**金融负债与权益工具的区分原则**、复合金融工具的分拆与交易费用分摊、库存股的准则依据都在第十三章，本章的\"其他权益工具\"考点必须与第十三章对读。\n- 与第十七章（收入、费用和利润）：净利润的结转、\"本年利润\"科目与利润分配的关系。\n- 与第二十三章（财务报告）：**其他综合收益的两类划分**在所有者权益变动表和利润表\"其他综合收益的税后净额\"部分逐项列示，本章分类清单即该表的填表依据。\n- 与第二十四章（会计政策、会计估计及其变更和差错更正）：前期差错更正、会计政策变更的累积影响数最终都调整\"盈余公积\"与\"未分配利润\"（本题库 2020-11）。\n- 与第二十八章（每股收益）：库存股不属于发行在外普通股；派发股票股利、资本公积转增资本需追溯调整每股收益。\n",
    "17": "# 第十七章 收入、费用和利润\n\n> 本题库考察频次：16 题（2016-1、2016-4、2017-5、2017-8、2018-15、2019-6、2019-9、2019-10、2020-8、2020-16、2020-17、2021-8、2021-9、2022-1）｜优先级：A 类（高频核心章）｜建议投入：精读+默写分录\n>\n> 频次说明：题干给定的本章频次为 14 题。逐一核对题库 `textbookRef` 后，提及「第十七章/第17章」的题号去重共 **16 个**：2016-1、2016-4、2017-5、2017-8、2018-15、2019-6、2019-9、2019-10、2020-8、2020-16、2020-17、2021-8、2021-9、2022-1、2022-7、2022-8，其中 2016-4（债务重组）、2016-1（兼前期差错更正）、2019-10（兼政府补助）属兼考，直接考核本章约 13–14 题，与给定频次基本吻合。以下「考察」字段一律填**真实题号**，兼考以「兼」标注，「—」表示该考点在本题库中无对应题目。\n\n---\n\n**第一节 收入**\n\n### 考点1 收入的定义与适用范围\n- **优先级**：★\n- **内容**：收入=企业在**日常活动**中形成的、会导致所有者权益增加的、与所有者投入资本**无关**的经济利益的总流入。适用于向客户转让商品（含服务）的合同。\n- **不适用（排除项）**：对外出租资产收取的租金（→第14章租赁）、债权投资收取的利息、股权投资取得的现金股利、保险合同保费收入。\n- **计算/分录**：营业收入＝主营业务收入＋其他业务收入；确认收入时 `借：应收账款/合同资产/银行存款　贷：主营业务收入/其他业务收入　应交税费——应交增值税（销项税额）`。\n- **易错**：以存货换取客户的存货、固定资产、无形资产、长期股权投资→**按收入准则**处理；其他非货币性资产交换→按《企业会计准则第7号——非货币性资产交换》处理（准则号第7号，教材对应章为第20章）；以存货清偿债务→按第21章债务重组。\n- **考察**：—\n\n### 考点2 合同成立的五个条件与持续评估\n- **优先级**：★★\n- **内容**：五条件——①各方已批准合同并承诺履行各自义务；②合同明确了与所转让商品相关的**权利和义务**；③有明确的与所转让商品相关的**支付条款**；④具有**商业实质**（改变未来现金流量的风险、时间分布或金额）；⑤企业因转让商品而有权取得的对价**很可能收回**。\n- **易错**：合同各方均有权单方面终止**完全未执行**的合同且无须补偿→**视为该合同不存在**；评估对价能否收回时**只考虑客户的信用风险**，不考虑价格折让（折让在估计交易价格时考虑）。\n- **考察**：2016-1（兼）\n\n### 考点3 合同变更的三种情形（与可变对价的区分）\n- **优先级**：★★★\n- **内容**：①变更增加了**可明确区分**的商品及价款，且新增价款反映新增商品**单独售价**→作为**单独合同**；②不属于①、且已转让与未转让商品之间**可明确区分**→视为**原合同终止+新合同订立**（新合同交易价格=原合同尚未确认部分+变更部分已承诺对价）；③不属于①、且已转让与未转让商品之间**不可明确区分**→作为**原合同组成部分**，在变更日**重新计算履约进度**并调整当期收入与成本。\n- **易错**：变更部分为②③组合的，分别按②或③处理尚未转让部分；**合同变更是对原合同范围/价格的后续变更，可变对价是合同约定的金额本身可变**，二者不可混用。\n- **考察**：2021-9\n\n### 考点4 识别单项履约义务（可明确区分）\n- **优先级**：★★★\n- **内容**：同时满足两个条件才是**可明确区分商品**：①客户能够从该商品本身、或从该商品与其他**易于获得的资源**一起使用中受益（商品本身可明确区分）；②企业转让该商品的承诺与合同中其他承诺**可单独区分**。\n- **判为不可明确区分的三种典型情形**：①企业需提供**重大整合服务**形成组合产出（如承诺建造写字楼，而非提供砖头、水泥、人工）；②该商品对合同中其他商品予以**重大修改或定制**（如软件+重大定制安装）；③该商品与合同中其他商品**高度关联**（如产品设计+反复试制样品）。\n- **易错**：评估商品本身能否明确区分时**基于商品自身特性，与客户可能的使用方式无关**，**无须考虑**合同中阻止客户从其他来源取得资源的限制性条款；向客户提供的一系列实质相同、转让模式相同的可明确区分服务→合并作为**单项**履约义务。\n- **考察**：2022-1\n\n### 考点5 运输活动的判断\n- **优先级**：★★\n- **内容**：控制权转移**之后**发生的运输→企业向客户提供了**一项运输服务**，可能构成单项履约义务，按其分摊的交易价格确认运输收入；控制权转移**之前**发生的运输→属于企业为履行合同发生的**必要活动**，不构成单项履约义务，支出计入合同履约成本。\n- **易错**：与履行客户合同**无关**的运输费：属于使存货达到目前场所和状态的必要支出→计入**存货成本**，否则计入期间费用。\n- **考察**：—\n\n### 考点6 交易价格之一：可变对价（期望值/最可能发生金额+限制条件）\n- **优先级**：★★★\n- **内容**：按**期望值**（多种结果，按概率加权）或**最可能发生金额**（只有两种结果时）确定最佳估计数；计入交易价格的可变对价金额必须满足**限制条件**：不超过「相关不确定性消除时累计已确认收入**极可能不会发生重大转回**」的金额。\n- **关键概率表述**：「极可能」显著高于「很可能」（>50%），但**不要求达到「基本确定」**（>95%）；评估转回比重时，应同时考虑合同中的**固定对价与可变对价**。\n- **例外**：该限制条件**不适用**于授予知识产权许可并按客户实际销售/使用情况收取特许权使用费的情形。\n- **每一资产负债表日**须重新估计可变对价并重新评估是否受限。\n- **计算/分录**：`期望值＝Σ（各可能结果金额×对应概率）`；`当期应确认收入＝交易价格总额×履约进度 − 以前期间累计已确认收入`；计入交易价格的可变对价金额受限制条件约束时，`可计入金额＝min（最佳估计数，极可能不会发生重大转回的金额）`。\n- **考察**：2021-9\n\n### 考点7 交易价格之二：重大融资成分\n- **优先级**：★★\n- **内容**：存在重大融资成分→按假定客户在取得商品控制权时即以现金支付的**现销价格**确定交易价格，差额在合同期间内采用**实际利率法**摊销。折现率一经确定，**不得因后续市场利率或客户信用风险变化而变更**。\n- **简化**：合同开始日预计客户取得控制权与支付价款间隔**不超过一年**的，可不考虑重大融资成分（对类似情形一致应用）。\n- **不构成重大融资成分的典型**：①客户预付且可自行决定商品转让时间（储值卡、奖励积分）；②对价中有相当大比例可变，取决于**实质上不受客户或企业控制**的未来事项（按实际销量收取的特许权使用费）；③差额源于提供融资利益以外的其他原因且与原因相称（如履约保护条款）。\n- **易错**：融资成分是否重大应在**单个合同层面**判断，不在合同组合层面；国家有关部门审批所需时间间隔**性质上不是**融资利益（如新能源汽车补贴款）。\n- **考察**：—\n\n### 考点8 交易价格之三：非现金对价与应付客户对价\n- **优先级**：★★\n- **内容**：非现金对价（实物资产、无形资产、股权、客户提供的广告服务等）→按**合同开始日的公允价值**确定交易价格；公允价值不能合理估计→参照承诺转让商品的**单独售价间接**确定。\n- **非现金对价变动**：因**对价形式以外**的原因变动→作为可变对价处理；仅因**对价形式**变动→**不计入**交易价格。\n- **应付客户对价**：冲减交易价格；但为**自客户取得其他可明确区分商品**的除外（按采购处理）。超额部分（应付对价>取得商品公允价值）冲减交易价格；取得商品公允价值不能合理估计的，**全额**冲减交易价格。冲减时点为**确认相关收入与支付（或承诺支付）客户对价二者孰晚**。\n- **考察**：—\n\n### 考点9 分摊交易价格：单独售价、合同折扣、可变对价的分摊与二次分摊\n- **优先级**：★★★\n- **内容**：按各单项履约义务所承诺商品的**单独售价的相对比例**分摊。单独售价无法直接观察→**市场调整法、成本加成法、余值法**合理估计，最大限度采用**可观察输入值**。\n- **余值法适用**：商品近期售价波动幅度巨大，或未定价且未曾单独销售导致售价无法可靠确定。\n- **合同折扣**：一般按比例分摊；有确凿证据表明折扣**仅与一项或多项（非全部）**履约义务相关→分摊至相关履约义务。全额分摊至部分履约义务须同时满足三条件（经常单独或组合销售、经常将其中部分组合按折扣销售、折扣基本相同）。\n- **可变对价分摊**：同时满足①条款**专门针对**该项履约义务的努力/特定结果；②全部计入符合分摊目标→可全部分摊至该项履约义务。**已履行**履约义务分摊的可变对价后续变动额→调整**变动当期**收入。\n- **交易价格后续变动**：按**合同开始日所采用的基础**分摊，**不得**因合同开始日后单独售价变动而重新分摊；合同变更后发生可变对价后续变动的，需按情形判断并可能**二次分摊**。\n- **考察**：2021-9（例17-15口径）\n\n### 考点10 某一时段内履行的三个条件\n- **优先级**：★★★\n- **内容**：满足**之一**即为在某一时段内履行：①客户在企业履约的**同时即取得并消耗**企业履约所带来的经济利益（判断技巧：假定更换为其他企业继续履行，若实质上**无须重新执行**累计至今已完成的工作即满足）；②客户能够**控制**企业履约过程中**在建的商品**（在产品、在建工程、尚未完成的研发项目、正在进行的服务等）；③企业履约过程中所产出的商品具有**不可替代用途**，且企业在整个合同期间内**有权就累计至今已完成的履约部分收取款项**（该款项须能补偿已发生成本+合理利润）。\n- **易错**：③的两个要求必须**同时**满足——船舶按客户要求定制（不可替代）但客户单方解约仅付30%违约金（不能补偿成本+合理利润）→**不属于**某一时段内履行；约定的付款时间表**不一定**意味着有权就累计至今已完成部分收款。\n- **考察**：—\n\n### 考点11 某一时点履行的履约义务与控制权转移迹象\n- **优先级**：★★\n- **内容**：不满足时段条件的→在某一时点履行。判断控制权转移时点应综合考虑：①企业就该商品享有**现时收款权利**；②已将该商品的**法定所有权**转移给客户；③已将该商品**实物转移**给客户；④已将该商品所有权上的**主要风险和报酬**转移给客户；⑤客户已**接受**该商品；⑥其他表明客户已取得控制权的迹象。\n- **易错**：判断④时**不应考虑**保留的因转让商品之外产生**其他履约义务**的风险（如单独承诺的后续维护服务）。\n- **考察**：—\n\n### 考点12 售后代管商品安排\n- **优先级**：★★\n- **内容**：客户取得控制权须**同时**满足：①该安排具有**商业实质**；②客户要求企业代为保管该商品；③该商品**可明确识别**为属于客户的物品；④企业**不能**使用该商品或将其提供给其他客户。\n- **易错**：1万台电脑与其他2000台一起存放、可互相替换→**不满足**售后代管确认收入条件；越通用、越可互相替换的商品越难满足。确认商品收入后还须考虑是否承担了**仓储保管服务**等履约义务，需分摊部分交易价格。\n- **考察**：—\n\n### 考点13 合同资产与合同负债\n- **优先级**：★★★\n- **内容**：**合同负债**=企业已收或应收客户对价而**应向客户转让商品**的义务。**合同资产**=企业已向客户转让商品而有权收取对价的权利，**且该权利取决于时间流逝之外的其他因素**（如还须履行其他履约义务）。**应收款项**=**无条件**收取合同对价的权利（仅随时间流逝即可收款）。\n- **易错**：尚未履行转让义务但已收/应收对价中的**增值税部分**不符合合同负债定义，**不确认为合同负债**；合同资产除**信用风险**外还承担**履约风险**，与应收款项风险不同。\n- **考察**：2022-1\n\n### 考点14 合同履约成本与合同取得成本（资本化、摊销、减值）\n- **优先级**：★★★\n- **内容**：**合同履约成本**资本化须同时满足：①与一份**当前或预期取得的合同直接相关**；②该成本**增加了企业未来用于履行履约义务的资源**；③该成本**预期能够收回**（不属于存货、固定资产、无形资产等其他准则范围）。\n- **应直接计入当期损益的四类支出**：①管理费用（除非明确由客户承担）；②非正常消耗的直接材料、直接人工、制造费用（未反映在合同价格中）；③与履约义务中**已履行部分**相关的支出；④**无法在尚未履行与已履行（或部分已履行）履约义务之间区分**的支出。\n- **合同取得成本**=为取得合同发生的**增量成本**（不取得合同就不会发生的成本，如销售佣金）且预期能够收回；摊销期限**不超过一年**的可在发生时计入当期损益（须对所有类似合同一致采用）。差旅费、投标费、为准备投标资料发生的费用、销售部门经理年度奖金→**均非**增量成本，计入当期损益。\n- **摊销与减值**：按与相关商品**收入确认相同的基础**摊销计入当期损益；合同续约仍需支付与原合同相当佣金→原佣金**只能在原合同期限内**摊销。减值：账面价值高于「剩余对价−估计将发生的成本」的差额计提减值；减值因素变化可**转回**，但转回后账面价值不得超过假定不计提减值情况下该资产在转回日的账面价值。\n- **考察**：2022-1、2018-15（兼）\n\n### 考点15 附有销售退回条款的销售\n- **优先级**：★★★\n- **内容**：客户取得控制权时，按**预期有权收取的对价金额**（不含预期将退还的金额）确认收入；按**预期因销售退回将退还的金额确认负债**（预计负债——应付退货款）；同时按**预期将退回商品转让时的账面价值，扣除收回该商品预计发生的成本（含价值减损）后的余额**确认为一项资产（应收退货成本）；按所转让商品转让时账面价值**扣除上述资产成本的净额**结转成本。\n- **后续**：每一资产负债表日重新估计未来销售退回情况，变化作**会计估计变更**处理。\n- **易错**：客户以类型、质量、状况及价格**均相同**的另一项商品换取→**不应视为退货**；约定客户可将有瑕疵商品退回换取正常商品→按**附有质量保证条款的销售**处理。\n- **计算/分录**：`应确认收入＝总价 × (1 − 预期退货率)`；`预计负债（应付退货款）＝总价（含税）× 预期退货率`；`应收退货成本＝单位成本 × 预期退货量 − 预计收回费用`。教材例17-31：5 000件×500元=2 500 000元，预计退货率20%→预计负债500 000元；单位成本400元×1 000件=400 000元计入应收退货成本。\n- **考察**：2020-8\n\n### 考点16 附有质量保证条款的销售\n- **优先级**：★★\n- **内容**：评估质量保证是否在「保证所销售商品符合既定标准」**之外**提供了一项**单独的服务**：是→**服务类质量保证**，作为**单项履约义务**分摊交易价格、递延确认收入；否→**保证类质量保证**，按《企业会计准则第13号——或有事项》计提预计负债。\n- **易错**：返工服务以保证产品符合既定标准→**保证类**，不构成单项履约义务。\n- **考察**：—\n\n### 考点17 主要责任人与代理人的判断\n- **优先级**：★★★\n- **内容**：核心标准——**在向客户转让商品前是否拥有对该商品的控制权**。拥有控制权（能够主导该商品的使用并从中获得几乎全部经济利益）→**主要责任人**，按**已收或应收对价总额**确认收入；否则→**代理人**，按**预期有权收取的佣金或手续费**（净额）确认收入。\n- **三个迹象**（先识别三方关系，再综合判断，不能只看其中一个）：①企业承担向客户转让商品的**主要责任**；②企业在转让前后承担了该商品的**存货风险**；③企业有权**自主决定**所交易商品的价格。\n- **易错**：仅凭「先收款再转付」「收取固定比例佣金」不足以判定为代理人，必须回到控制权；委托代销业务中**委托方**通常为主要责任人（受托方为代理人）。\n- **考察**：2022-7、2022-8（委托代销）\n\n### 考点18 特定交易（一）：附有客户额外购买选择权\n- **优先级**：★★★\n- **内容**：评估是否提供**重大权利**：客户**只有在订立了一项合同的前提下**才取得额外购买选择权，且行使时能享受**超过**该地区/市场其他同类客户所能享有的折扣→通常构成重大权利→作为**单项履约义务**，按单独售价相对比例分摊交易价格，在客户**未来行使选择权取得商品控制权时或选择权失效时**确认收入。\n- **形式**：销售激励、客户奖励积分、未来购买折扣券、合同续约选择权等。\n- **简化**：行使选择权购买的商品与原合同商品**类似**且按原合同条款提供（如续约选择权）→**无须估计**选择权单独售价，直接把预计额外商品数量与预计对价纳入原合同处理。\n- **易错**：行使选择权时的价格**反映了商品单独售价**的，**不视为**重大权利。\n- **考察**：2019-9\n\n### 考点19 特定交易（二）：授予知识产权许可\n- **优先级**：★★★\n- **内容**：先判断是否构成**单项履约义务**——不构成的情形：①该许可构成**有形商品的组成部分**且对该商品正常使用不可或缺（如内嵌软件）；②客户只有将该许可**和相关服务一起使用**才能获益。\n- **构成单项履约义务的，再判断时段/时点**：同时满足①合同要求或客户**能够合理预期**企业将从事对该项知识产权有**重大影响**的活动；②该活动对客户将产生**有利或不利影响**；③该活动**不会导致向客户转让商品**→**某一时段内**履行；否则→**某一时点**履行。\n- **不作为判断依据的因素**：①该许可在**时间、地域或使用方面的限制**；②企业对知识产权**有效性**以及防止未经授权使用的**保证**。\n- **基于销售或使用量的特许权使用费**：在①客户后续销售或使用行为**实际发生**；②企业**履行相关履约义务**，两者**孰晚**的时点确认收入（是可变对价的**例外规定**，仅适用于特许权使用费**仅与知识产权许可相关**的情形）。\n- **易错**：客户能使用并开始从中获益**之前**不能确认收入（如未交付密钥、未审核批准激活码）。\n- **考察**：2019-6\n\n### 考点20 特定交易（三）：售后回购——不确认收入\n- **优先级**：★★★\n- **内容**：售后回购=销售商品的同时承诺或有权选择日后购回（含相同或几乎相同的商品、以该商品作为组成部分的商品）。\n- **情形（1）企业因与客户的远期安排而负有回购义务，或企业享有回购权利**→表明客户在销售时点**并未取得**相关商品控制权→作为**租赁交易或融资交易**：回购价格**低于**原售价→**租赁交易**（按第14章）；回购价格**不低于**原售价→**融资交易**，收到客户款项时确认**金融负债**，款项与回购价格的差额在回购期间内确认为**利息费用**。\n- **情形（2）**客户有重大经济动因要求回购，或回购价格远高于（低于）回购时市场价值→按上述原则处理。\n- **易错**：负有远期回购义务的销售**不得确认收入**；销售人员到期**未行使**回购权利的，应在权利到期时**终止确认金融负债**，同时**确认收入**。\n- **计算/分录**：融资交易下 `金融负债初始金额＝收到的客户款项`，`每期利息费用＝金融负债账面余额×实际利率（或按回购价与售价的差额在回购期间分摊）`；例17-43：售价200万元、2年后按120万元回购，回购价<售价→租赁交易，实质为乙公司支付80万元（200−120）取得该设备2年使用权。\n- **参考**：教材例17-43、例17-44。\n- **考察**：2017-8、2020-16、2020-17\n\n### 考点21 特定交易（四）：客户未行使的权利与无须退回的初始费\n- **优先级**：★★\n- **内容**：**客户未行使的权利**：预收款项→确认为**合同负债**；若预收款无须退回且客户可能放弃全部或部分合同权利，企业**预期将有权获得**该金额的，按**客户行使合同权利的模式按比例**确认收入；否则只有在客户要求履行剩余履约义务的**可能性极低**时才转为收入。**法律规定须转交其他方**的（如无人认领财产上交政府）→**不得**确认为收入；预收款中**代其他方收取**的部分不属于客户未行使的权利。\n- **无须退回的初始费**：与**已转让**商品相关的→在转让该商品时确认收入；初始活动**本身没有向客户转让已承诺商品**的（如俱乐部入会费的注册登记、制作会员卡）→与未来将转让的已承诺商品相关，**在未来转让该商品时**确认收入，确定履约进度时**不应考虑**这些初始活动，相关支出按合同成本要求确认资产或计入当期损益。\n- **考察**：—\n\n### 考点22 社会资本方对PPP项目合同的会计处理\n- **优先级**：★（本章内属独立小节，考频低）\n- **内容**：适用范围须同时满足**双特征**（①社会资本方在运营期间内代表政府方使用PPP项目资产提供公共产品和服务；②在约定期间内就其提供的公共产品和服务获得补偿）与**双控制**（①政府方控制或管制社会资本方必须提供的公共产品和服务的类型、对象和价格；②合同终止时政府方通过所有权、收益权或其他形式控制项目资产的重大剩余权益）。\n- **三种模式**：**无形资产模式**（有权向使用者收费但金额不确定，不构成无条件收取现金的权利）→确认建造服务收入并确认合同资产，达到预定可使用状态时结转无形资产，运营期收通行费确认运营服务收入；**金融资产模式**（有权收取可确定金额的现金或其他金融资产，仅取决于时间流逝）→在拥有收款权利时确认为应收款项；**混合模式**（建造收入超过有权收取可确定金额现金的差额）→差额确认为无形资产。\n- **对价确定**：属**非现金对价**安排，按合同开始日公允价值确定交易价格；公允价值不能合理估计→采用**成本加成法**确定建造服务的单独售价。\n- **考察**：—\n\n**第二节 费用**\n\n### 考点23 费用的确认与期间费用\n- **优先级**：★\n- **内容**：费用=企业在日常活动中发生的、会导致所有者权益减少的、与向所有者**分配利润无关**的经济利益的总流出；按**权责发生制**确认。确认顺序：先划分**生产费用与非生产费用**，再分清**生产费用与期间费用**，期间费用进一步划分为**管理费用、销售费用、财务费用**。\n- **期间费用**=本期发生的、不能直接或间接归入某种产品成本的、直接计入损益的各项费用。管理费用包括筹建期间开办费、公司经费、工会经费、董事会费、聘请中介机构费、咨询费、诉讼费、业务招待费、技术转让费、行政管理部门固定资产日常修理费、残疾人就业保障金等。期末管理费用余额结转「本年利润」后**无余额**。\n- **考察**：—\n\n**第三节 利润**\n\n### 考点24 利润的构成与结转\n- **优先级**：★★★\n- **内容**：\n  - 营业利润＝营业收入−营业成本−税金及附加−销售费用−管理费用−研发费用−财务费用＋其他收益＋投资收益＋净敞口套期收益＋公允价值变动收益−信用减值损失−资产减值损失＋资产处置收益\n  - 利润总额＝营业利润＋营业外收入−营业外支出\n  - 净利润＝利润总额−所得税费用\n- **科目位置（务必记清划线位置）**：**其他收益**（与日常活动相关的政府补助、增值税即征即退等）、**资产处置损益**（固定资产、无形资产等处置的利得或损失，计入营业利润）、**信用减值损失**（金融工具、合同资产按预期信用损失法计提的减值，属营业利润内项目）、**资产减值损失**（存货、固定资产、无形资产、商誉等，属营业利润内项目）、**营业外收入/支出**（与日常活动**无直接关系**的收支）。\n- **结转**：期末将各损益类科目余额结转「本年利润」，再结转「利润分配——未分配利润」，最后进行提取盈余公积、向投资者分配等利润分配。\n- **考察**：2017-5\n\n### 考点25 营业外收支与视同销售\n- **优先级**：★★\n- **内容**：**营业外收入**主要包括非流动资产**毁损报废利得**、与企业日常活动**无关**的政府补助、盘盈利得、捐赠利得等。企业接受**控股股东（或其子公司）或非控股股东（或其子公司）直接或间接捐赠**，经济实质表明属于**资本性投入**的→计入**所有者权益（资本公积）**，不计入营业外收入。\n- **视同销售**：以自产产品用于职工福利等非货币性福利→按**公允价值**确认收入（或应付职工薪酬并结转成本），涉及增值税销项税额，是本章与第9章职工薪酬的交汇点。\n- **易错**：营业外收入与营业收入的界限须严格区分；政府补助中与日常活动无关的部分才进营业外收入。\n- **考察**：2021-8（兼）\n\n---\n\n### 本章易错陷阱汇总\n\n1. **合同变更 vs 可变对价**：合同变更须经合同各方同意对**原合同范围或价格**作出变更；可变对价是合同本身约定的对价金额可变。价格折让源于市场条件变化且合同开始日无法合理预期→**合同变更**；源于企业以往习惯做法所导致的可预期折让→**可变对价**。\n2. **主要责任人与代理人**不能只凭「谁收款、谁开票、收多少比例」判断，核心是**转让前是否控制商品**；三个迹象须综合分析。\n3. **售后回购不确认收入**——这是最高频的判断点。回购价格<原售价→租赁；≥原售价→融资（确认金融负债，差额作利息费用）；到期未行使回购权利才确认收入。\n4. **销售退回**要用「预计负债——应付退货款」＋「应收退货成本」**双向**处理，成本不能简单按全额结转；每个资产负债表日重新估计（会计估计变更）。\n5. **额外购买选择权的重大权利**判断标准是「仅因订立合同才取得 + 折扣优于其他同类客户」；价格反映单独售价→不构成重大权利。\n6. **知识产权许可**判断时段/时点时，**不考虑**时间地域限制与有效性保证；基于销售的特许权使用费适用**孰晚**确认的例外规定。\n7. **质量保证**只有**服务类**才是单项履约义务；保证类走或有事项。\n8. **合同取得成本只包括增量成本**——差旅费、投标费、年度奖金都不是增量成本。\n9. **合同资产 vs 应收款项**：合同资产的权利还取决于时间流逝**之外**的条件；预收款中的增值税部分不进合同负债。\n10. **营业利润的构成**中，其他收益、资产处置损益、信用减值损失**都在营业利润之内**；营业外收支在营业利润**之外**。\n11. **某一时段内履行的第③个条件**必须同时满足「不可替代用途 + 有权就累计至今已完成部分收取能补偿成本与合理利润的款项」，只满足前者不够。\n12. **PPP项目**三种模式的判别关键是「是否有权收取可确定金额的现金」——不确定→无形资产模式；确定→金融资产模式；部分确定→混合模式。\n\n### 本章分录模板\n\n**（一）在某一时段内履行的建造合同（成本法确定履约进度）**\n```\n归集成本：          借：合同履约成本              贷：原材料/应付职工薪酬等\n确认收入与成本：    借：合同结算——收入结转       贷：主营业务收入\n                    借：主营业务成本              贷：合同履约成本\n结算价款：          借：应收账款                  贷：合同结算——价款结算\n收款：              借：银行存款                  贷：应收账款\n合同预计损失：      借：主营业务成本              贷：预计负债\n```\n期末根据「合同结算」科目余额方向列报：**贷方余额**→合同负债（已结算未履约）；**借方余额**中尚未到收款期的质保金等→合同资产。\n\n**（二）附有销售退回条款的销售**\n```\n发出商品并确认收入：\n  借：应收账款                                     （全额含税）\n      贷：主营业务收入                             （预期不会退回部分）\n          预计负债——应付退货款                     （预期将退还金额）\n          应交税费——应交增值税（销项税额）\n  借：主营业务成本                                 （转让时账面价值−收回资产成本）\n      应收退货成本                                 （预期退回商品账面价值−收回成本）\n      贷：库存商品\n资产负债表日重新估计退货率：\n  退货率下降：借：预计负债——应付退货款  贷：主营业务收入\n              借：主营业务成本          贷：应收退货成本\n  实际发生退货：借：库存商品 / 应交税费——应交增值税（销项税额）/ 预计负债——应付退货款\n                    贷：应收退货成本 / 主营业务收入 / 银行存款\n```\n**（三）附有额外购买选择权（奖励积分）**\n```\n销售时：借：银行存款            贷：主营业务收入（分摊至商品）\n                                    合同负债（分摊至积分）\n兑换积分时：借：合同负债        贷：主营业务收入\n```\n**（四）售后回购（回购价格≥原售价，融资交易）**\n```\n销售时：借：银行存款            贷：金融负债\n回购期间计提：借：财务费用（利息费用）  贷：金融负债\n回购时：借：金融负债            贷：银行存款\n到期未回购：借：金融负债        贷：主营业务收入（或其他相关收入科目）\n```\n**（五）利润结转**\n```\n借：本年利润                    贷：各项费用、损失类科目\n借：各项收入、利得类科目        贷：本年利润\n借：本年利润                    贷：利润分配——未分配利润\n```\n\n### 与其他章的联动\n\n- **与第19章（所得税）**：合同负债的计税基础（预收款已计税时计税基础为0）、预计负债（应付退货款、质保义务）计税基础为0→可抵扣暂时性差异；售后回购的融资交易、附有销售退回条款的销售均需考虑递延所得税（见 2019-1、2020-8）。\n- **与第18章（政府补助）**：新能源汽车补贴、高效照明产品补贴等属于**商品对价组成部分**→按收入准则而非政府补助准则处理（2019-10）；与日常活动相关的政府补助计入**其他收益**，直接影响营业利润。\n- **与第14章（租赁）**：售后回购中回购价格低于原售价→按租赁交易处理；售后租回中资产转让不属于销售的，同样适用（2020-16、2020-17）。\n- **与第13章（金融工具与保险合同）**：从事重大融资成分的合同、售后回购确认的金融负债、以及分类为权益工具的金融工具，其计量与列报衔接金融工具准则。\n- **与第27章（合并财务报表）**：内部交易的抵销以本章的收入确认时点、控制权转移判断为基础；建造合同「合同结算」科目的抵销常与合并抵消题联动。\n- **与第9章（职工薪酬）**：以自产产品发放非货币性福利的「视同销售」处理（2021-8）。\n",
    "18": "# 第十八章 政府补助\n\n> 本题库考察频次：3 题（2018-16、2019-10、2022-4）｜优先级：C 类（低频章）｜建议投入：通读一遍 + 记住总额法/净额法的分录走向\n>\n> 频次说明：题干给定的本章频次为 3 题，与题库核对完全一致。直接考核本章的为 **2022-4**（增值税先征后返）；以本章为第二考点的为 **2018-16**（与资产相关的政府补助及应税补助的递延所得税处理，兼第19章）、**2019-10**（政府价格补贴的收入确认，兼第17章）。以下「考察」字段填**真实题号**，兼考以「兼」标注，「—」表示该考点在本题库中无对应题目。\n\n---\n\n**第一节 政府补助概述**\n\n### 考点1 政府补助的特征\n- **优先级**：★★\n- **内容**：政府补助具有两个特征。\n  1. **来源于政府的经济资源**：政府主要指行政事业单位及类似机构。对企业收到的**来源于其他方**的补助，如有确凿证据表明**政府是补助的实际拨付者**、其他方只是**代收代付**，该项补助也属于来源于政府的经济资源（如母公司代收代付给子公司的政府补助款）。\n  2. **无偿性**：企业取得来源于政府的经济资源，**不需要向政府交付商品或服务等对价**。无偿性是政府补助的**基本特征**。\n- **易错**：政府补助**通常附有一定条件**（对补助的使用时间、范围和方向进行限制），这与无偿性**并不矛盾**；**政府以企业所有者身份投入资本**并享有相应所有者权益，属于**互惠交易**，不是政府补助。\n- **考察**：—\n\n### 考点2 政府补助与收入的区分（政府补助准则的适用范围排除）\n- **优先级**：★★★\n- **内容**：企业从政府取得的经济资源，如果**与企业销售商品或提供劳务等活动密切相关**，且该经济资源是**企业商品或服务的对价或者是对价的组成部分**，应当按《企业会计准则第14号——收入》处理，**不适用**政府补助准则。\n- **典型情形**：新能源汽车厂商以低于成本的价格销售新能源汽车，中央和地方财政补贴实质上是为消费者承担并支付了部分销售价款，与其销售新能源汽车密切相关，是该销售对价的组成部分→**按收入准则**确认收入，合理估计未来补贴款金额，满足收入确认条件时确认为收入。\n- **易错**：**基于原址用地公允价值的搬迁补偿**——政府实质是按相应资产的市场价格购买企业资产，企业取得的经济资源是**让渡资产的对价**，属互惠性交易，**不符合无偿性**，应作为**处置非流动资产的收入**，不作政府补助。\n- **考察**：2019-10（兼）\n\n### 考点3 政府补助的分类\n- **优先级**：★★★\n- **内容**：\n  - **与资产相关的政府补助**：企业取得的、用于**购建或以其他方式形成长期资产**的政府补助。\n  - **与收益相关的政府补助**：除与资产相关的政府补助**之外**的政府补助，主要用于补偿企业**已发生或即将发生**的费用或损失，受益期相对较短，通常在满足补助所附条件时计入当期损益或冲减相关成本。\n- **判断技巧**：补助文件**要求企业将补助资金用于取得固定资产或无形资产等长期资产**→与资产相关；若补助实质是对企业**所付租金等成本费用**的补贴（如按季申请的租金扶持补贴）→**与收益相关**。\n- **易错**：**综合性项目政府补助**（同时包含与资产相关和与收益相关）应采用**合理方法分解**并分别处理；**确实难以区分**的，应将其**整体归类为与收益相关**的政府补助处理。\n- **考察**：2018-16（兼）\n\n**第二节 政府补助的会计处理**\n\n### 考点4 政府补助的确认条件与计量\n- **优先级**：★★\n- **内容**：**确认条件**（同时满足）：①企业**能够满足**政府补助所附条件；②企业**能够收到**政府补助。\n- **「能够收到」的判断**：着眼于「确凿证据」，考虑发放主体是否具备相应权力和资质、补助文件索引的政策依据是否适用、申请流程是否合法合规、是否已履行完补助文件中的要求、收取资金前是否需政府部门实质性审核、同类型补助过往实际发放情况、补助文件是否有明确支付时间、政府是否具备履行支付义务的能力等。\n- **计量**：货币性资产→按**收到或应收的金额**计量（已实际收到按实际收到金额；尚未收到但已获收款权且经济利益很可能流入的，在成为应收款时按应收金额计量）；非货币性资产→按**公允价值**计量，公允价值不能可靠取得的，按**名义金额（1元）**计量。\n- **考察**：2018-16（兼）\n\n### 考点5 总额法与净额法（选定后不得随意变更）\n- **优先级**：★★★\n- **内容**：\n  - **总额法**：在确认政府补助时**将政府补助金额确认为收益**，而不是作为相关资产账面价值或费用的扣减。\n  - **净额法**：将政府补助作为**相关资产账面价值或所补偿费用的扣减**。\n- **一致性要求**：同一企业**不同时期**发生的相同或相似交易或事项，应当采用**一致的会计政策，不得随意变更**；确需变更的，应当在附注中说明。企业应根据经济业务实质判断某一类政府补助业务应采用总额法还是净额法，通常情况下对同类或类似业务应采用**相同**的会计处理方法。\n- **易错**：选定方法后须**一贯运用**，**不得**在同一业务的持有期内从总额法改为净额法。\n- **考察**：2018-16（兼）\n\n### 考点6 与资产相关的政府补助（总额法）\n- **优先级**：★★★\n- **内容**：收到补助资金时按补助金额借记「银行存款」等，贷记「**递延收益**」；在相关资产**使用寿命内**按**合理、系统的方法**分期计入损益。\n- **分摊起点**：①**先收到补助、后购建资产**→在**开始对相关资产计提折旧或摊销时**开始分摊；②**先购建资产、后收到补助**→在相关资产的**剩余使用寿命内**按合理、系统的方法分摊。\n- **结转去向**：借记「递延收益」，贷记「**其他收益**」（与企业日常活动**相关**的政府补助）或「**营业外收入**」（与企业日常活动**无关**的政府补助）。选择总额法后，**结转递延收益时不得冲减相关成本费用**。\n- **易错**：对应长期资产在持有期间发生**减值损失**，递延收益的摊销**保持不变**，**不受**减值因素影响；相关资产在**使用寿命结束或结束前被处置**（出售、转让、报废等），**尚未分摊的递延收益余额应当一次性转入资产处置当期的损益**，不再递延。\n- **考察**：2018-16（兼）\n\n### 考点7 与资产相关的政府补助（净额法）\n- **优先级**：★★★\n- **内容**：按补助资金金额**冲减相关资产的账面价值**。若**先取得补助、再确认所购建的长期资产**：先将取得的政府补助确认为**递延收益**，在相关资产**达到预定可使用状态或预定用途时**将递延收益**冲减相关资产的账面价值**，并按照扣减了政府补助后的账面价值和相关资产的**剩余使用寿命**计提折旧或摊销。\n- **非货币性资产补助**：按公允价值借记有关资产科目、贷记「递延收益」，在相关资产使用寿命内按合理、系统的方法分期计入损益（借记「递延收益」，贷记「其他收益」或「营业外收入」）；**以名义金额（1元）计量**的政府补助，在**取得时计入当期损益**。\n- **易错**：净额法下折旧基数为冲减补助后的金额，故各期折旧额小于总额法；两种方法下**资产的原始入账价值不同**，在处置或减值测试时须注意口径。\n- **计算/分录**：净额法核心分录为 `借：递延收益　贷：固定资产/无形资产`（在达到预定可使用状态时冲减）；例18-5中补助210万元、设备价480万元→净额法下设备入账270万元，每月折旧22 500元（270万÷10年÷12），不再分摊递延收益。\n- **考察**：2018-16（兼）\n\n### 考点8 与收益相关的政府补助\n- **优先级**：★★★\n- **内容**：企业应当选择采用总额法或净额法。**总额法**→计入**其他收益**或**营业外收入**；**净额法**→**冲减相关成本费用**或**营业外支出**。\n- **（一）用于补偿企业以后期间的相关成本费用或损失**：收到时先判断能否满足所附条件，只有满足确认条件才能予以确认（客观情况通常表明能满足）→先确认为**递延收益**，并在**确认相关费用或损失的期间**计入当期损益或冲减相关成本。\n  - **暂时无法确定能否满足所附条件**时：应将收到的补助资金先记入「**其他应付款**」科目，待客观情况表明企业能够满足所附条件后再转入「**递延收益**」科目。\n- **（二）用于补偿企业已发生的相关成本费用或损失**：**直接计入当期损益或冲减相关成本**（这类补助通常与企业已经发生的行为有关，是对已发生成本费用或损失的补偿，或对过去行为的奖励）。\n- **计算/分录**：补偿以后期间（总额法）`收到：借：银行存款　贷：递延收益`→`使用：借：递延收益　贷：其他收益/营业外收入`；（净额法）`使用：借：递延收益　贷：管理费用/生产成本/营业外支出`。补偿已发生（总额法）`借：银行存款/其他应收款　贷：其他收益/营业外收入`。例18-7：软件企业即征即退增值税10万元→`借：其他应收款 100 000　贷：其他收益 100 000`；例18-8：自然灾害补助200万元→`借：银行存款 2 000 000　贷：营业外收入 2 000 000`。\n- **考察**：2022-4、2018-16（兼）\n\n### 考点9 政府补助的退回\n- **优先级**：★★\n- **内容**：已计入损益的政府补助需要退回的，应当在**需要退回的当期**分情况处理：\n  1. **初始确认时冲减相关资产账面价值的**（净额法）→**调整资产账面价值**；\n  2. **存在相关递延收益的**→**冲减相关递延收益账面余额**，**超出部分计入当期损益**；\n  3. **属于其他情况的**→**直接计入当期损益**。\n- **易错**：属于**前期差错**的政府补助退回，应当按照**前期差错更正**进行**追溯调整**，不能简单计入当期损益。\n- **考察**：—\n\n### 考点10 特定业务（一）：综合性项目政府补助\n- **优先级**：★★\n- **内容**：同时包含与资产相关和与收益相关的政府补助，应采用**合理的方法**将其**分解**并分别进行会计处理；**确实难以区分**的，**整体归类为与收益相关**的政府补助处理。\n- **处理示例**：收到补助资金时全额贷记「递延收益」；购入设备时按与资产相关部分（如使用补助资金60万元）`借：递延收益　贷：固定资产`（净额法）；与收益相关的部分在按规定用途实际使用补助资金时计入损益，或在**实际使用的当期期末根据当期累计使用的金额**计入损益。\n- **易错**：分解方法应合理且一贯；不得将难以区分的综合性补助**随意拆分为与资产相关**以递延损益。\n- **考察**：—\n\n### 考点11 特定业务（二）：政策性优惠贷款贴息\n- **优先级**：★★\n- **内容**：政策性优惠贷款贴息是政府为支持特定领域或区域发展、根据国家宏观经济形势和政策目标，对**承贷企业的银行借款利息给予的补贴**。应区分两种情况：\n  - **1. 财政将贴息资金拨付给贷款银行**：由贷款银行以政策性优惠利率向企业提供贷款，受益企业**没有直接从政府取得利息补助**，可选择下列方法**之一**并**一致运用、不得随意变更**：\n    - **方法一**：以**实际收到的金额**作为借款的入账价值，按借款本金和**该政策性优惠利率**计算借款费用（通常实际收到的金额即为借款本金）。\n    - **方法二**：以**借款的公允价值**作为入账价值并按**实际利率法**计算借款费用，**实际收到的金额与借款公允价值之间的差额确认为递延收益**，递延收益在借款存续期内采用**实际利率法摊销，冲减相关借款费用**。\n    - **金融企业（贷款银行）**并不是受益主体，其仍按市场利率收取利息（一部分来自企业、一部分来自财政贴息），发挥的是**中介作用**，**不需要确认**与贷款相关的递延收益。\n  - **2. 财政将贴息资金直接拨付给受益企业**：企业先按**同类贷款市场利率**向银行支付利息，财政部门定期与企业结算贴息。此时实际收到的借款金额通常**就是借款的公允价值**，企业应当将**对应的贴息冲减相关借款费用**。\n- **易错**：方法一与方法二下计入在建工程/财务费用的利息支出**最终一致**（例18-13中均为每月2 500元），差别在**资产负债表列示**：方法一贷款账面价值为1 000 000元；方法二贷款入账价值为890 554元、递延收益109 446元，各月按实际利率法摊销。\n- **考察**：—\n\n### 考点12 增值税相关补助的会计处理（先征后返、即征即退、直接减免、出口退税）\n- **优先级**：★★★\n- **内容**：\n  - **即征即退、先征后返**：先按规定缴纳增值税，然后根据退回的增值税税额，借记「银行存款」等，贷记「**其他收益**」。\n  - **直接减免**应交的增值税税额（如招用自主就业退役士兵按定额扣减增值税）：借记「应交税费——应交增值税（**减免税款**）」，贷记「**其他收益**」。**教材明确表述为：按规定直接减免应交的增值税税额的，也计入其他收益。**（提示：从「是否发生经济资源的转移」角度存在不同理解，但**以教材表述为准**，考试按计入其他收益作答。）\n  - **超比例安排残疾人就业**或为安排残疾人就业作出显著成绩按规定收到的奖励：记入「**其他收益**」科目。\n  - **增值税出口退税不属于政府补助**：出口退税实际上是政府**退回企业事先垫付的进项税**，不是无偿取得的经济资源。\n- **易错**：软件企业**即征即退**增值税因与企业日常销售密切相关，属**与日常活动相关**的政府补助，计入**其他收益**（教材例18-7：`借：其他应收款　贷：其他收益`）；而**自然灾害补助**等与日常活动**无关**的政府补助，总额法下计入**营业外收入**（教材例18-8）。石脑油、燃料油用于生产乙烯芳烃类化工产品而**退还的消费税**，属于**与收益相关**的政府补助，净额法下**冲减生产成本**（教材例18-9）。\n- **考察**：2022-4、2019-10（兼）\n\n### 考点13 政府补助的附注披露\n- **优先级**：★\n- **内容**：因政府补助涉及递延收益、其他收益、营业外收入以及成本费用等多个报表项目，企业应当在附注中**单独披露**：①政府补助的种类、金额和**列报项目**；②**计入当期损益**的政府补助金额；③**本期退回**的政府补助金额及原因。\n- **考察**：—\n\n---\n\n### 本章易错陷阱汇总\n\n1. **政府补助与收入的分水岭是「是否构成商品或服务的对价」**：新能源汽车补贴、高效照明产品财政补贴都是**销售对价的组成部分**→按收入准则；基于资产公允价值的搬迁补偿属**互惠交易**→作处置资产收入；不构成对价、无偿取得→政府补助。\n2. **与资产相关 vs 与收益相关**不能只看文件名称，要看**资金用途是否形成长期资产**；补偿所付租金等成本费用的属**与收益相关**。\n3. **综合性项目政府补助难以区分时，一律整体归类为与收益相关**，不要随意拆分递延。\n4. **总额法与净额法选定后一贯运用**：总额法下递延收益结转时**不得冲减成本费用**，只能转入其他收益或营业外收入；净额法下冲减资产账面价值并据此计提折旧。\n5. **分摊起点**要分清：先收款后购建→自**开始计提折旧或摊销时**分摊；先购建后收款→在**剩余使用寿命内**分摊。\n6. **资产减值不影响递延收益的摊销**；资产**处置时尚未分摊的递延收益余额一次性转入处置当期损益**。\n7. **「其他收益」与「营业外收入」的界限是「是否与日常活动相关」**：软件企业即征即退增值税→其他收益；自然灾害等与日常活动无关的补助→营业外收入。\n8. **政府补助确认的两个条件**是「能满足所附条件」＋「能够收到」；暂时无法确定能否满足条件时，先记「**其他应付款**」，满足后再转「递延收益」。\n9. **政府补助退回**分三种情形：冲减资产账面价值 / 冲减递延收益余额（超出部分进当期损益）/ 直接进当期损益；**属前期差错的要追溯调整**。\n10. **政策性优惠贷款贴息**要看钱拨给谁：拨给贷款银行→企业可选方法一或方法二（选定后一贯运用，银行本身**不确认**递延收益）；直接拨给企业→**冲减相关借款费用**。\n11. **增值税出口退税不属于政府补助**（退回的是事先垫付的进项税）；而**即征即退、先征后返、直接减免**均计入**其他收益**。\n12. **应税政府补助**在总额法下会产生递延收益的可抵扣暂时性差异，需确认递延所得税资产；若属**不征税收入**则不产生差异（跨章陷阱，见 2018-16）。\n\n### 本章分录模板\n\n**（一）与资产相关的政府补助——总额法**（教材例18-5方法一）\n```\n收到补助：    借：银行存款                贷：递延收益\n购入设备：    借：固定资产                贷：银行存款\n按月计提折旧：借：制造费用等              贷：累计折旧\n按月分摊补助：借：递延收益                贷：其他收益（日常活动相关）\n                                            营业外收入（日常活动无关）\n资产毁损报废：\n  借：固定资产清理 / 累计折旧             贷：固定资产\n  借：营业外支出                          贷：固定资产清理\n  转销递延收益余额：借：递延收益          贷：固定资产清理\n  借：固定资产清理                        贷：营业外收入\n```\n**（二）与资产相关的政府补助——净额法**（教材例18-5方法二）\n```\n收到补助：  借：银行存款                  贷：递延收益\n购入设备：  借：固定资产                  贷：银行存款\n达到预定可使用状态时：\n            借：递延收益                  贷：固定资产\n按月折旧（按冲减后账面价值）：借：制造费用等  贷：累计折旧\n```\n**（三）与收益相关的政府补助**\n```\n补偿以后期间：\n  收到：  借：银行存款                    贷：递延收益\n          暂不能确定能否满足条件时：借：银行存款  贷：其他应付款\n  使用：  总额法：借：递延收益            贷：其他收益 / 营业外收入\n          净额法：借：递延收益            贷：管理费用 / 生产成本 / 营业外支出\n补偿已发生：\n  总额法：借：银行存款 / 其他应收款      贷：其他收益 / 营业外收入\n  净额法：借：银行存款 / 其他应收款      贷：管理费用 / 生产成本 / 营业外支出\n```\n**（四）增值税即征即退 / 先征后返**\n```\n申请退税并确定退税额：借：其他应收款      贷：其他收益\n实际收到退税款：      借：银行存款        贷：其他应收款\n直接减免增值税：      借：应交税费——应交增值税（减免税款）  贷：其他收益\n```\n**（五）政府补助退回**\n```\n净额法（原冲减资产账面价值）：借：固定资产（恢复）  贷：银行存款 / 累计折旧\n总额法有递延收益余额：借：递延收益  其他收益（超出部分）  贷：银行存款\n其他情况：              借：营业外支出 / 其他收益        贷：银行存款\n```\n\n### 与其他章的联动\n\n- **与第17章（收入、费用和利润）**：政府补助与收入的区分（政府补贴是否构成商品对价）是本章与第17章的交汇点（2019-10）；「其他收益」计入**营业利润**，「营业外收入」在营业利润**之外**，直接影响利润表结构。\n- **与第19章（所得税）**：应税政府补助在总额法下形成的递延收益余额产生**可抵扣暂时性差异**，需确认递延所得税资产；不征税收入则不产生差异（2018-16，典型跨章综合题）。\n- **与第8章（负债）、第11章（借款费用）**：政策性优惠贷款贴息的两种方法影响长期借款入账价值与借款费用资本化金额，与借款费用章节的资本化计算联动。\n- **与第3章（固定资产）、第4章（无形资产）**：净额法下冲减资产账面价值后，折旧/摊销基数改变，影响后续资产减值测试与处置损益。\n- **与第24章（会计政策、会计估计及其变更和差错更正）**：总额法与净额法的选择属**会计政策**，选定后一贯运用；政府补助退回属**前期差错**时须追溯调整。\n",
    "19": "# 第十九章 所得税\n\n> 本题库考察频次：27 题（全书最高频章节）｜优先级：A 类（高频核心章）｜建议投入：精读+默写分录+动手做完整计算流程\n>\n> 频次说明：题干给定的本章频次为 24 题。逐一核对题库 `textbookRef` 后，提及第十九章/第19章的题号去重共 **24 个**——**主考题**：2017-1、2017-2、2017-3、2017-4、2019-1、2019-2、2019-3、2019-4、2019-5、2020-4、2020-5、2020-7、2020-9、2022-5；**兼考（本章为第二考点）**：2016-5、2016-10、2016-11、2018-5、2018-6、2018-7、2018-16、2020-8、2021-5、2021-6、2021-7、2022-3、2022-11（去重后合计 24 题，与给定频次完全一致）。以下「考察」字段填**真实题号**，兼考以「兼」标注，「—」表示该考点在本题库中无对应题目。\n\n---\n\n**第一节 所得税会计的基本原理**\n\n### 考点1 资产负债表债务法的一般程序\n- **优先级**：★★★\n- **内容**：每一资产负债表日按五步核算：①确定资产负债表中除递延所得税资产、递延所得税负债以外其他资产、负债的**账面价值**；②以适用税收法规为基础确定各资产、负债的**计税基础**；③比较账面价值与计税基础，分析差异性质，区分**应纳税暂时性差异**与**可抵扣暂时性差异**，确定递延所得税负债与递延所得税资产的**应有金额**，与期初余额比较得出本期递延所得税；④按税法计算**当期应纳税所得额**×适用税率=当期应交所得税（当期所得税）；⑤当期所得税＋递延所得税=利润表中的**所得税费用**。\n- **易错**：企业合并等特殊交易或事项发生时，应在确认所取得资产、负债时**同时**确认相关所得税影响；计提减值准备的资产，账面价值=账面余额−已计提的减值准备。\n- **考察**：2019-1、2019-2、2019-3、2019-4、2019-5、2017-1～2017-4\n\n**第二节 资产、负债的计税基础与暂时性差异**\n\n### 考点2 资产的计税基础\n- **优先级**：★★★\n- **内容**：资产的计税基础=企业收回资产**账面价值**过程中，计算应纳税所得额时按照税法规定**可以自应税经济利益中抵扣的金额**，即「未来期间可税前扣除的金额」。公式：`资产的计税基础 = 成本 − 以前期间已税前扣除的金额`。\n- **考察**：2019-1、2017-2、2017-1\n\n### 考点3 固定资产的计税基础（折旧方法与减值准备）\n- **优先级**：★★★\n- **内容**：①**折旧方法、折旧年限差异**：会计可选年限平均法、双倍余额递减法、年数总和法等；税法除规定可加速折旧的情形外基本按年限平均法扣除，并对每类固定资产规定**最低折旧年限**。②**减值准备差异**：税法规定计提的资产减值准备在**发生实质性损失前不允许税前扣除**，故计提减值后账面价值<计税基础，形成**可抵扣**暂时性差异。\n- **计算**：2×24年末账面价值=750−75×2−50（减值）=550（万元）；计税基础=750−750×20%−600×20%=480（万元）。\n- **易错**：会计折旧快于税法→账面价值<计税基础→**可抵扣**；会计折旧慢于税法（如会计5年、税法10年）→账面价值>计税基础→**应纳税**。\n- **考察**：2020-5（兼）、2022-3（兼）\n\n### 考点4 无形资产的计税基础（含加计扣除与初始确认豁免）\n- **优先级**：★★★\n- **内容**：除内部研发形成外，其他方式取得的无形资产初始确认时账面价值一般**等于**计税基础。差异主要来自：①**内部研发形成的无形资产**——会计上资本化金额为成本，税法规定未形成无形资产计入当期损益的按**100%加计扣除**，形成无形资产的按**成本200%摊销**（以教材表述为准），故计税基础>账面价值；②**使用寿命不确定的无形资产**——会计上不摊销（未减值则账面价值=成本），税法按年限（如10年）摊销，账面价值>计税基础，形成**应纳税**暂时性差异。\n- **初始确认豁免**：该无形资产若**不是产生于企业合并**，且在**初始确认时既不影响会计利润也不影响应纳税所得额**，则**不确认**该暂时性差异的所得税影响；持有过程中，在初始未予确认的暂时性差异**范围内的摊销额差异亦不予确认**。\n- **易错**：**研发费用加计扣除本身不确认递延所得税**——加计扣除是国家给予的额外扣除优惠，属**永久性差异**性质，不产生单独的递延所得税资产；实务中常错在把「200%摊销形成的暂时性差异」确认为递延所得税资产。\n- **考察**：2022-5、2020-4（兼）、2019-1（兼）\n\n### 考点5 以公允价值计量的金融资产与投资性房地产的计税基础\n- **优先级**：★★★\n- **内容**：税法规定以公允价值计量的金融资产、金融负债及投资性房地产等，**持有期间公允价值变动不计入应纳税所得额**，在实际处置或结算时按「处置价款−历史成本」计入处置期间应纳税所得额。因此期末**计税基础=取得成本**（金融资产）或**成本−按税法规定可税前扣除的折旧**（投资性房地产）。\n- **易错**：以公允价值计量且其变动计入**其他综合收益**的金融资产（其他债权投资、其他权益工具投资），计税基础确定与交易性金融资产相同，**可比照处理**；但其递延所得税影响计入**其他综合收益**而非所得税费用。\n- **考察**：2019-1、2019-4、2017-2\n\n### 考点6 其他资产（存货、应收账款）的计税基础\n- **优先级**：★★\n- **内容**：**存货**：计提存货跌价准备后账面价值=成本−跌价准备，计税基础不因跌价准备的提取而变化（仍为成本）→**可抵扣**暂时性差异。**应收账款**：计提坏账准备后账面价值=余额−坏账准备，税法规定不符合国务院财政、税务主管部门规定的各项资产减值准备不允许税前扣除→计税基础=余额→**可抵扣**暂时性差异，在应收账款发生实质性损失时减少未来期间应纳税所得额。\n- **考察**：2021-5（兼）\n\n### 考点7 负债的计税基础\n- **优先级**：★★★\n- **内容**：`负债的计税基础 = 账面价值 − 未来期间计算应纳税所得额时按照税法规定可予抵扣的金额`。对于预收收入，所产生负债的计税基础=账面价值−**未来期间非应税收入**的金额。\n- **一般规律**：负债的确认与偿还一般不影响损益、也不影响应纳税所得额，未来期间可抵扣金额为0→**计税基础=账面价值**，不产生暂时性差异。\n- **考察**：2019-1、2017-2\n\n### 考点8 负债计税基础的具体应用（预计负债、合同负债、应付职工薪酬、其他负债）\n- **优先级**：★★★\n- **内容**：\n  - **预计负债（保证类售后服务）**：会计在销售当期确认成本与预计负债；税法规定相关支出**于实际发生时税前扣除**→计税基础=账面价值−未来可税前扣除金额=**0**→**可抵扣**暂时性差异。\n  - **合同负债**：一般税法确认收入原则与会计相同，未来可扣除金额为0→**计税基础=账面价值**；但若按税法规定该预收款应计入**取得当期**应纳税所得额（已计税），则`计税基础=0`→产生**可抵扣**暂时性差异（因其产生时已交所得税，未来期间可全额税前扣除）。\n  - **应付职工薪酬**：税法规定了扣除标准的，超过标准部分**当期不允许扣除、以后期间也不允许扣除**，未来可抵扣金额为0→**计税基础=账面价值**，**不形成**暂时性差异（构成**永久性差异**）。\n  - **其他负债（罚款、滞纳金）**：无论发生当期还是以后期间均不允许税前扣除→**计税基础=账面价值**，不形成暂时性差异。\n- **易错**：区分「现在不能扣、以后能扣」→暂时性差异；「现在不能扣、以后也不能扣」→**永久性差异**，不影响递延所得税。\n- **考察**：2019-1、2020-8（兼）\n\n### 考点9 特殊交易或事项中产生资产、负债计税基础的确定\n- **优先级**：★★\n- **内容**：企业合并中取得的资产、负债计税基础应遵从税法规定。**同一控制下企业合并**取得的资产、负债基本维持原账面价值，不产生新的资产、负债；**非同一控制下企业合并**取得的资产、负债按**购买日公允价值**计量，合并成本大于可辨认净资产公允价值份额的部分确认为**商誉**，小于则计入合并当期损益。\n- **易错**：会计准则与税法对「是否属于企业合并」的划分标准可能不同（如税法下的**免税合并**），由此产生商誉的账面价值与计税基础差异（详见考点13）。\n- **考察**：2016-10（兼）、2018-5（兼）\n\n### 考点10 应纳税暂时性差异\n- **优先级**：★★★\n- **内容**：指在确定**未来收回资产或清偿负债**期间的应纳税所得额时，将导致**产生应纳税金额**的暂时性差异；转回时**增加**未来期间应纳税所得额与应交所得税，产生当期符合条件时确认**递延所得税负债**。\n- **典型情形**：①资产账面价值**大于**计税基础（如公允价值上升的交易性金融资产、会计折旧慢于税法）；②负债账面价值**小于**计税基础（如计税基础为0的预收款项对应的合同负债）。\n- **考察**：2019-1、2017-2、2019-3\n\n### 考点11 可抵扣暂时性差异\n- **优先级**：★★★\n- **内容**：指在确定未来收回资产或清偿负债期间的应纳税所得额时，将导致**产生可抵扣金额**的暂时性差异；转回时**减少**未来期间应纳税所得额与应交所得税，产生当期符合确认条件时确认**递延所得税资产**。\n- **典型情形**：①资产账面价值**小于**计税基础（减值准备、加速折旧的税法口径、内部研发无形资产）；②负债账面价值**大于**计税基础（计税基础为0的预计负债、已计税的合同负债）。\n- **考察**：2019-1、2017-2\n\n### 考点12 特殊项目产生的可抵扣暂时性差异（广告费等非资产/负债项目）\n- **优先级**：★★★\n- **内容**：某些支出虽不体现为资产负债表中的资产或负债，但按税法规定**超过标准的部分允许向以后年度结转税前扣除**，应**视同资产**处理：视其账面价值为**0**，计税基础为**可结转以后年度扣除的金额**，由此产生**可抵扣**暂时性差异，符合条件时确认递延所得税资产。\n- **计算**：当年广告费支出2 000万元，销售收入10 000万元，税法允许当期扣除10 000×15%=1 500万元，未扣除的500万元可结转以后年度扣除→视同资产账面价值0、计税基础500万元→可抵扣暂时性差异500万元。\n- **易错**：同类项目还有**职工教育经费**等有扣除限额并可结转以后年度的支出；**罚款、滞纳金、超标准的、以后也不能扣除的部分不在此列**（那是永久性差异）。\n- **考察**：2020-9\n\n### 考点13 可抵扣亏损及税款抵减产生的暂时性差异\n- **优先级**：★★★\n- **内容**：按税法规定可以**结转以后年度**的**未弥补亏损及税款抵减**，虽不是因资产、负债的账面价值与计税基础不同产生，但与可抵扣暂时性差异具有同样作用（均能减少未来期间应纳税所得额与应交所得税），会计上**视同可抵扣暂时性差异**，预计未来期间能产生足够应纳税所得额时**确认递延所得税资产**。\n- **考察**：2019-3、2019-4\n\n**第三节 递延所得税资产及负债的确认和计量**\n\n### 考点14 递延所得税负债的确认原则\n- **优先级**：★★★\n- **内容**：除准则明确规定可不确认的情况外，企业对于**所有**应纳税暂时性差异均应确认递延所得税负债。除与**直接计入所有者权益**的交易或事项以及与**企业合并**中取得资产、负债相关的以外，确认递延所得税负债的同时**增加利润表中的所得税费用**（体现谨慎性：不高估资产、不低估负债）。\n- **易错**：税率变动时递延所得税负债须按**新税率重新计量**（考点20）。\n- **考察**：2019-3、2017-3\n\n### 考点15 不确认递延所得税负债的特殊情况（三项豁免）\n- **优先级**：★★★\n- **内容**：\n  1. **商誉的初始确认**：非同一控制下企业合并中，合并成本大于取得被购买方可辨认净资产公允价值份额的差额确认为商誉；若按税法规定计税时作为**免税合并**，购买方取得的被购买方资产、负债**维持原计税基础**，被购买方账面上未确认商誉，即**商誉的计税基础为0**，商誉账面价值与计税基础形成应纳税暂时性差异，准则规定**不确认**相关递延所得税负债。\n  2. **除企业合并以外的其他交易或事项**：若交易发生时**既不影响会计利润、也不影响应纳税所得额**，则资产、负债的初始确认金额与计税基础不同形成的应纳税暂时性差异，**交易发生时不确认**相应递延所得税负债（理由是确认会调整资产账面价值或负债账面价值，违背**历史成本原则**、影响会计信息可靠性）。\n  3. **与子公司、联营企业、合营企业投资等相关的应纳税暂时性差异**：一般应确认递延所得税负债，但同时满足①**投资企业能够控制暂时性差异转回的时间**；②该暂时性差异在**可预见的未来很可能不会转回**——两个条件时**不确认**（如权益法下拟长期持有的长期股权投资）。\n- **易错**：若按所得税法规规定，商誉在初始确认时**计税基础等于账面价值**，则该商誉在后续计量过程中因会计与税法规定不同产生暂时性差异的，**应当确认**相关所得税影响（即豁免仅适用于初始确认环节）。\n- **考察**：2019-3、2020-7\n\n### 考点16 企业合并相关的递延所得税\n- **优先级**：★★\n- **内容**：购买方取得的**可抵扣暂时性差异**（如购买日取得的被购买方以前期间发生的未弥补亏损），购买日不符合递延所得税资产确认条件而未予确认的：**购买日后12个月内**取得新的或进一步信息表明**购买日相关情况已经存在**、预期其经济利益能够实现→确认递延所得税资产，**同时减少商誉**；商誉不足冲减的，差额部分确认为**当期损益**。除上述情况以外确认的与企业合并相关的递延所得税资产，**计入当期损益**。\n- **考察**：2016-10（兼）、2018-5（兼）\n\n### 考点17 股份支付相关的当期及递延所得税\n- **优先级**：★★\n- **内容**：若税法规定股份支付相关支出**不允许**税前扣除→**不形成**暂时性差异；若**允许**税前扣除→在按会计准则确认成本费用的期间内，应根据会计期末取得的信息**估计可税前扣除的金额**，计算确定其计税基础及暂时性差异，符合条件时确认递延所得税。\n- **计税基础**：对于附业绩条件或服务条件的股权激励计划，等待期内**不得**税前抵扣，待**可行权时**方可抵扣，可抵扣金额为**实际行权时的股票公允价值与激励对象支付的行权金额之间的差额**；企业应根据**期末股票价格**估计未来可税前抵扣的金额，以未来期间很可能取得的应纳税所得额为限确认递延所得税资产。\n- **易错**：如果预计未来期间**可抵扣的金额超过**等待期内确认的成本费用，**超出部分**形成的递延所得税资产应**直接计入所有者权益（资本公积——其他资本公积）**，而不是计入当期损益。\n- **考察**：—\n\n### 考点18 与单项交易相关的递延所得税（豁免的例外）\n- **优先级**：★★★（新准则修订要点，近年重点）\n- **内容**：对于**不是企业合并**、交易发生时**既不影响会计利润也不影响应纳税所得额（或可抵扣亏损）**，且**初始确认的资产和负债导致产生等额应纳税暂时性差异和可抵扣暂时性差异**的**单项交易**，**不适用**豁免初始确认递延所得税负债和递延所得税资产的规定；应当在交易发生时**分别确认**相应的递延所得税负债和递延所得税资产。\n- **典型单项交易**：承租人在**租赁期开始日**初始确认租赁负债并计入使用权资产的租赁交易；因**固定资产等存在弃置义务**而确认预计负债并计入相关资产成本的交易。\n- **计算示例（租赁）**：租赁负债账面价值2 600 000元、计税基础0→可抵扣暂时性差异2 600 000元；使用权资产账面价值2 650 000元（含初始直接费用50 000元），其中与租赁负债等额部分2 600 000元计税基础为0→应纳税暂时性差异2 600 000元。\n- **分录**：`借：递延所得税资产（2 600 000×25%）650 000　所得税费用 12 500　贷：递延所得税负债（2 650 000×25%）662 500`\n- **考察**：—\n\n### 考点19 递延所得税资产的确认与计量（谨慎性）\n- **优先级**：★★★\n- **内容**：确认递延所得税资产时，应以**预期收回该资产期间的适用所得税税率**为基础计算；无论可抵扣暂时性差异何时转回，递延所得税资产均**不要求折现**。\n- **不确认的情况**：**无法取得足够的应纳税所得额**用以利用可抵扣暂时性差异带来的利益时，不确认递延所得税资产。\n- **复核与减记**：资产负债表日应对递延所得税资产账面价值进行**复核**；如果未来期间很可能无法取得足够应纳税所得额，应**减记**其账面价值。减记的递延所得税资产：**原确认时计入所有者权益的**（资本公积、留存收益、其他综合收益等），减记金额**亦计入所有者权益**；**其他情况**均**增加当期所得税费用**。以后期间判断能够产生足够应纳税所得额时，可**恢复**其账面价值。\n- **计量基础**：无论递延所得税资产还是负债，均应考虑资产负债表日企业**预期收回资产或清偿负债方式**的所得税影响，采用与预期方式相一致的**税率和计税基础**（例如决定将固定资产对外出售且处置适用税率不同时，应按处置口径计量）。\n- **考察**：2019-3、2019-5、2022-5\n\n### 考点20 适用税率变化对已确认递延所得税资产和负债的影响\n- **优先级**：★★★\n- **内容**：因税收法规变化导致企业某一会计期间**适用所得税税率发生变化**的，应对已确认的递延所得税资产和递延所得税负债按**新税率重新计量**。\n- **影响去向**（关键判断）：①一般情况下调整金额计入**所得税费用**（递延所得税费用或收益）；②原交易或事项发生时计入**所有者权益**的（如其他债权投资公允价值变动、其他权益工具投资公允价值变动），其递延所得税调整**仍计入其他综合收益**（或资本公积等相应权益项目）；③与企业合并中取得资产、负债相关的，调整**商誉**或**计入当期损益**的金额，**不影响所得税费用**；④与可转换债券权益工具成分相关的递延所得税负债，初始确认时计入**所有者权益**，后续随金融负债折价摊销的变动金额**计入当期损益**。\n- **易错**：递延所得税资产/负债的重新计量**属于会计估计变更**性质的后续计量调整，不追溯重述以前期间的所得税费用。\n- **考察**：2019-1（兼，2018年税率由25%降至15%）、2019-4、2022-3（兼）\n\n**第四节 所得税费用的确认和计量**（含教材第五节「所得税的列报」）\n\n### 考点21 所得税费用的构成\n- **优先级**：★★★\n- **内容**：`所得税费用（或收益）= 当期所得税 + 递延所得税`。其中：**当期所得税**=当期应纳税所得额×适用税率=当期应交所得税；**递延所得税**=当期应予进一步确认的递延所得税资产/负债金额−应予转销的金额（即`（期末递延所得税负债−期初递延所得税负债）−（期末递延所得税资产−期初递延所得税资产）`）。\n- **应纳税所得额调整**：在会计利润基础上纳税调整——加：不可税前扣除的成本费用损失（超标职工薪酬、罚款、滞纳金、向关联方捐赠、超标准业务招待费等）；减：免税收入（国债利息等）、加计扣除、前期未确认可抵扣亏损的利用等。\n- **递延所得税计入其他项目的例外**：①与**直接计入所有者权益**的交易或事项相关→计入**所有者权益**（其他综合收益、资本公积）；②与**企业合并**中取得资产、负债相关→影响**商誉**或合并当期损益；③**股份支付**超出等待期费用部分及原计入权益的减记→计入**资本公积——其他资本公积**；④**发行方分类为权益工具**的金融工具（如分类为权益工具的永续债）相关股利支出按税法可在税前扣除的，应在确认应付股利时确认其所得税影响，并**按与过去产生可供分配利润的交易或事项相一致的会计处理方式**计入当期损益或所有者权益。\n- **分录**（综合）：\n  `借：所得税费用　递延所得税资产　贷：应交税费——应交所得税　递延所得税负债`\n- **考察**：2019-2、2019-4、2019-5、2017-3、2017-4、2019-1（兼）\n\n### 考点22 所得税的列报与抵销条件\n- **优先级**：★★★\n- **内容**：递延所得税资产和递延所得税负债一般应分别作为**非流动资产**和**非流动负债**在资产负债表中列示；所得税费用应在利润表中**单独列示**，并在附注中披露与所得税有关的信息。\n- **抵销条件**：一般情况下，在**个别财务报表**中，当期所得税资产与当期所得税负债、递延所得税资产与递延所得税负债可以以**抵销后的净额**列示。合并财务报表中，纳入合并范围的企业之间，一方的当期所得税资产（或递延所得税资产）与另一方的当期所得税负债（或递延所得税负债），须满足**同一纳税主体、同一税务机关征收且有法定抵销权**的条件才可抵销。\n- **附注披露**：所得税费用（收益）的**主要组成部分**、所得税费用与会计利润按适用税率计算金额的**调节过程**（表19-5口径：按法定/适用税率计算的所得税费用、子公司适用不同税率的影响、调整以前期间所得税的影响、非应税收入的影响、不可抵扣的成本费用和损失的影响、使用前期未确认递延所得税资产的可抵扣亏损的影响、本期未确认递延所得税资产的可抵扣暂时性差异或可抵扣亏损的影响、研发费用加计扣除等）。\n- **易错**：抵销不得跨纳税主体、跨税务机关进行；个别报表与合并报表的列报口径不同。\n- **考察**：2019-4\n\n**（附）合并财务报表中的所得税会计**\n\n### 考点23 合并报表中所得税会计的合并处理\n- **优先级**：★★★（合并大题高频配套考点）\n- **内容**：编制合并财务报表时，因内部交易**抵销**处理，可能导致合并报表中反映的资产、负债账面价值与其**计税基础**不一致，产生差异，需在合并报表中确认相应的递延所得税影响。\n- **两类典型**：\n  - **购买日公允价值调整**：非同一控制下企业合并中，子公司资产、负债按购买日公允价值调整后，若税法仍以原账面价值为计税基础，则产生暂时性差异，应在合并报表中确认递延所得税资产/负债，并调整**商誉**或资本公积。\n  - **内部交易未实现损益**：内部销售收入、成本及期末未实现内部销售利润抵销后，合并报
