是**持续的**。当环境或情况变化导致控制的一个或多个要素发生变化时，投资方应**重新评估**是否仍控制被投资方。某些事件即使不涉及投资方本身（如其他方拥有的阻止性决策权到期失效），也可能使投资方获得或丧失权力；拥有权力的投资方不再享有可变回报时（如与业绩相关的管理费合同到期），会因此**丧失控制**。\n- **易错**：**报告期内处置了唯一的子公司、期末已无子公司，仍应编制当期合并财务报表**——应将该子公司**期初至处置日**的收入、费用、利润纳入合并利润表，现金流量纳入合并现金流量表，编制合并资产负债表时**不调整期初数**。\n- **考察**：—\n\n## 二、合并财务报表的编制原则与程序\n\n### 合并工作底稿与合并数的计算方向\n- **优先级**：★★★\n- **内容**：合并程序：①设置合并工作底稿；②将母公司和纳入合并范围的子公司个别财务报表各项目数据**过入**工作底稿；③编制**调整分录与抵销分录**；④计算各项目**合并数**；⑤填列合并财务报表。\n- **内容（合并数计算方向，极易记反）**：\n  | 项目类型 | 合并数 |\n  |---|---|\n  | **资产类** | 加总数 **＋借方发生额 －贷方发生额** |\n  | **负债类、所有者权益类** | 加总数 **－借方发生额 ＋贷方发生额** |\n  | **收益类** | 加总数 **－借方发生额 ＋贷方发生额** |\n  | **成本费用类、利润分配类** | 加总数 **＋借方发生额 －贷方发生额** |\n- **易错**：抵销分录使用的是**报表项目**名称（如\"营业成本\"\"未分配利润\"），不是会计科目名称；抵销分录**不登记账簿**，只影响工作底稿。\n- **考察**：`2019-17`\n\n### 合并财务报表需要调整抵销的项目清单\n- **优先级**：★★★\n- **内容**：**合并资产负债表**需要抵销的主要项目：①母公司对子公司股权投资项目与子公司**所有者权益**项目；②母子公司之间、子公司相互之间尚未结算的**内部债权债务**项目；③**存货**项目（内部购进存货价值中包含的未实现内部销售损益）；④**固定资产**项目（原价和累计折旧中包含的未实现内部销售损益）；⑤**无形资产**项目；⑥**应收账款**计提的坏账准备等。\n  **合并利润表**需要抵销的主要项目：①内部营业收入与营业成本；②内部投资收益与子公司利润分配项目；③内部利息收入与利息支出等。\n- **易错**：合并现金流量表中，\"筹资活动——吸收投资收到的现金\"下可增加\"**其中：子公司吸收少数股东投资收到的现金**\"；\"筹资活动——分配股利、利润或偿付利息支付的现金\"下可增加\"**其中：子公司支付给少数股东的股利、利润**\"。合并所有者权益变动表应增加\"**少数股东权益**\"栏目。\n- **考察**：`2019-17`\n\n## 三、长期股权投资与所有者权益的合并处理\n\n### 同一控制下企业合并的合并报表处理\n- **优先级**：★★★\n- **内容**：合并日应编制合并资产负债表、合并利润表、合并现金流量表，将合并方与被合并方的报表**自合并当期期初**起合并，视同合并后形成的报告主体自最终控制方开始实施控制时起一直是一体化存续。\n- **计算/分录**：\n  ```\n  抵销分录：\n  借：实收资本（股本）/ 资本公积 / 盈余公积 / 未分配利润\n    贷：长期股权投资\n  （不确认新的商誉；原已确认的商誉作为合并中取得的资产）\n  留存收益恢复：\n  借：资本公积\n    贷：盈余公积、未分配利润    （以合并方资本公积——资本溢价/股本溢价余额为限）\n  ```\n- **易错**：合并日不产生新的商誉；合并利润表应单列\"其中：被合并方在合并前实现的净利润\"；**比较报表要调整**，以前期间不存在对被合并方的长期股权投资，应将被合并方资产负债并入后，因合并增加的净资产调整所有者权益项下的**资本公积**。\n- **考察**：`2016-15`\n\n### 购买日公允价值调整分录（非同一控制下）\n- **优先级**：★★★\n- **内容**：编制购买日及以后期间的合并财务报表时，应将子公司资产、负债的**购买日公允价值与账面价值的差额**调整相关项目，这一调整实际上等于将资产、负债的**公允价值变动模拟入账**，使子公司报表以公允价值反映。\n- **计算/分录**：\n  ```\n  （1）按购买日公允价值调整子公司报表：\n  借：存货 / 固定资产 / 无形资产等     （评估增值）\n    贷：应收账款                        （评估减值）\n        资本公积\n  （2）按公允价值基础调整折旧、摊销、成本：\n  借：营业成本（存货增值随对外销售实现）\n      管理费用（固定资产增值折旧、无形资产增值摊销）\n    贷：存货 / 固定资产——累计折旧 / 无形资产——累计摊销\n  借：递延所得税资产（评估减值部分）\n    贷：所得税费用\n  借：所得税费用\n    贷：递延所得税负债（评估增值部分）\n  ```\n- **易错**：①调整分录在**购买日**、**以后每期期初**和**每期期末**都要编制（连续编制时金额可能变化）；②评估增值的递延所得税影响会同时改变\"资本公积\"金额；③固定资产增值按**剩余折旧年限**摊销，办公楼增值3 000万元、剩余年限20年，则每年调增管理费用150万元。\n- **考察**：`2022-11`、`2018-6`、`2019-17`\n\n### 成本法转权益法的调整分录（合并报表必备第一步）\n- **优先级**：★★★\n- **内容**：母公司个别报表对子公司长投采用**成本法**，合并报表中必须先把成本法核算结果**调整为权益法**口径，再与子公司所有者权益抵销。\n- **计算/分录**：\n  ```\n  （1）确认应享子公司调整后净利润的份额（扣除现金股利）：\n  借：长期股权投资——损益调整\n    贷：投资收益（本期部分）\n        年初未分配利润（以前期间部分）\n  （2）调整子公司其他综合收益、其他权益变动中归属母公司的份额：\n  借：长期股权投资——其他综合收益\n    贷：其他综合收益\n  借：长期股权投资——其他权益变动\n    贷：资本公积——其他资本公积\n  （3）抵销原成本法已确认的投资收益与收到的现金股利（视具体情况）：\n  借：投资收益\n    贷：长期股权投资\n  ```\n- **易错**：①\"投资收益\"调整的是**当期**部分，\"年初未分配利润\"调整的是**以前期间**部分，两者不能混；②调整后的长期股权投资账面价值＝个别报表长投成本 ＋ 按权益法累计应享有的子公司调整后净资产变动份额 － 已确认的现金股利；③**子公司调整后净利润**要先扣掉购买日公允价值调整的影响（多计的折旧、摊销、已销存货增值）。\n- **考察**：`2019-17`、`2022-11`、`2016-11`、`2021-11`\n\n### 抵销分录（一）：母公司长期股权投资与子公司所有者权益\n- **优先级**：★★★\n- **内容**：这是合并资产负债表的核心抵销分录。非全资子公司下，不属于母公司的份额结转为**少数股东权益**。**关键**：母公司在子公司所有者权益中拥有的份额是按**资产和负债的公允价值**为基础计算的，抵销按公允价值进行，**少数股东权益也按资产和负债公允价值为基础**确定。\n- **计算/分录**：\n  ```\n  借：股本（实收资本）\n      资本公积\n      其他综合收益\n      盈余公积\n      未分配利润\n      商誉                          （合并成本－可辨认净资产公允价值份额）\n    贷：长期股权投资                （调整后＝成本法长投＋权益法追溯调整数）\n        少数股东权益                （倒挤）\n  ```\n- **易错**：①**少数股东权益的计量基础是\"子公司可辨认净资产公允价值份额\"，不包含商誉**；商誉全部归属于母公司；②当母公司对子公司长投调整后金额小于应享有子公司权益份额（含商誉）时，差额为\"**未确认的投资损失**\"或需要在借方反映的其他项目，不能机械倒挤。\n- **考察**：`2016-11`、`2019-17`、`2021-11`、`2022-12`\n\n### 抵销分录（二）：投资收益与子公司利润分配\n- **优先级**：★★★\n- **内容**：将母公司对子公司的投资收益与子公司本年的**利润分配**项目抵销，实质是把子公司的净利润按\"母公司享有的投资收益＋少数股东损益\"进行拆分。\n- **计算/分录**：\n  ```\n  借：投资收益                    （母公司按权益法确认的份额）\n      少数股东损益                （子公司调整后净利润×少数股东持股比例）\n      年初未分配利润              （子公司调整后年初未分配利润）\n    贷：提取盈余公积              （子公司本年提取数）\n        对所有者的分配（应付股利）\n        年末未分配利润            （子公司调整后年末未分配利润）\n  ```\n- **易错**：①\"年初未分配利润\"也是**子公司调整后**的金额，要包含以前期间购买日公允价值调整的累计影响；②\"少数股东损益\"同样按**子公司调整后净利润**计算；③这条分录与上一条抵销分录中的\"未分配利润\"金额必须**一致**。\n- **考察**：`2019-17`、`2022-12`、`2016-11`\n\n### 少数股东权益与少数股东损益的计算\n- **优先级**：★★★\n- **内容**：\n  ```\n  少数股东损益＝子公司调整后净利润 × 少数股东持股比例  （逆流交易需另行分摊未实现损益）\n  少数股东权益（年末）＝少数股东权益（年初）\n                        ＋ 少数股东损益\n                        － 子公司对少数股东的利润分配（含其他减少）\n                        ＋ 少数股东应享有的其他综合收益、其他权益变动份额\n  ```\n- **易错**：①在**逆流交易**（子公司向母公司出售资产）中，未实现内部交易损益应按母公司对该子公司的**分配比例**在\"归属于母公司所有者的净利润\"和\"少数股东损益\"之间分摊抵销；②**子公司之间**出售资产发生的未实现内部交易损益，应按母公司对**出售方子公司**的持股比例在两个项目之间分配抵销；③少数股东权益**不含商誉**；④顺流交易（母公司向子公司出售）形成的未实现损益**全部**由母公司承担，不分摊给少数股东。\n- **考察**：`2021-14`、`2021-11`、`2022-12`、`2021-13`\n\n### 应收股利与应付股利的抵销\n- **优先级**：★★\n- **内容**：母公司按持股比例确认的应收股利与子公司计列的应付股利中相应部分予以抵销。\n- **计算/分录**：`借：应付股利  贷：应收股利`\n- **易错**：只抵销**母子公司之间**的部分，子公司应付给少数股东的部分**不抵销**（作为对少数股东的负债）。\n- **考察**：`2019-17`\n\n## 四、内部交易的合并处理\n\n### 内部商品交易的抵销（当期）\n- **优先级**：★★★\n- **内容**：\n  | 情形 | 抵销分录 |\n  |---|---|\n  | 内部购进的存货**全部未对外销售** | 借：营业收入（内部售价） 贷：营业成本（内部成本） 存货（未实现毛利） |\n  | 内部购进的存货**全部对外销售** | 借：营业收入 贷：营业成本（全额抵销，无存货残留） |\n  | 内部购进的存货**部分对外销售** | 借：营业收入 贷：营业成本 存货（未销售部分包含的未实现毛利） |\n  | 内部交易形成**存货跌价准备** | 借：存货——存货跌价准备 贷：资产减值损失（**以抵销未实现内部销售损益的金额为限**） |\n  | 所得税影响 | 借：递延所得税资产 贷：所得税费用（＝抵销的未实现毛利×所得税税率） |\n- **易错**：①抵销的是**未实现**内部销售损益，判断标准是\"是否向集团外销售\"；②**存货跌价准备**的抵销有限额，不能超过抵销的未实现内部销售损益金额（即合并报表角度应计提的跌价准备与个别报表计提数的差额）；③递延所得税影响根据抵销后合并报表口径的暂时性差异倒算。\n- **考察**：`2022-12`、`2018-7`、`2021-12`\n\n### 连续编制合并报表：内部交易的年初未分配利润处理\n- **优先级**：★★★\n- **内容**：连续编制合并报表时，上期抵销的未实现内部销售损益在本期转为\"**年初未分配利润**\"，并视本期情况调整：\n  | 本期情况 | 抵销分录 |\n  |---|---|\n  | 上期内部购进存货**本期对外销售** | 借：年初未分配利润 贷：营业成本 |\n  | 上期内部购进存货**本期仍未对外销售** | 借：年初未分配利润 贷：存货 |\n  | 上期抵销的**存货跌价准备** | 借：存货——存货跌价准备 贷：年初未分配利润（按本期实际应抵销数调整） |\n  | 上期抵销的**递延所得税资产** | 借：递延所得税资产 贷：年初未分配利润 |\n- **易错**：连续编制时的关键是分清\"**本期新发生**的内部交易\"与\"**以前期间**内部交易在本期的延续\"，前者的抵销用\"营业收入/营业成本\"，后者的抵销用\"**年初未分配利润**\"。\n- **考察**：`2018-7`\n\n### 内部债权债务的合并处理\n- **优先级**：★★★\n- **内容**：\n  ```\n  当期：\n  借：应付账款（应付票据、应付债券、预收款项等）\n    贷：应收账款（应收票据、债权投资、合同负债等）\n  借：应收账款——坏账准备\n    贷：信用减值损失\n  借：所得税费用\n    贷：递延所得税资产       （抵销内部应收款项计提坏账准备所确认的递延所得税资产）\n  连续编制时：\n  借：应付账款          贷：应收账款\n  借：应收账款——坏账准备      贷：年初未分配利润\n  借：年初未分配利润          贷：递延所得税资产\n  （本期坏账准备发生变动的，按本期变动数调整\"信用减值损失\"或\"年初未分配利润\"）\n  ```\n- **易错**：①随着内部债权债务的抵销，因该内部应收款项计提坏账准备所形成的暂时性差异也**不存在**，应将该递延所得税资产**一并抵销**；②连续编制时抵销数用**累计数**（如累计坏账准备20万元全额抵销），不是本期发生额；③应对\"应收账款\"项目抵销坏账准备，不是抵销\"信用减值损失\"（后者只在本期变动时使用）。\n- **考察**：`2018-7`、`2022-12`\n\n### 内部固定资产交易的抵销\n- **优先级**：★★★\n- **内容**：\n  ```\n  交易当期（卖方为存货、买方为固定资产）：\n  借：营业收入（内部售价）\n    贷：营业成本（内部成本）\n        固定资产——原价（未实现销售损益）\n  交易当期（卖方为固定资产、买方为固定资产）：\n  借：资产处置收益（内部售价与账面价值之差）\n    贷：固定资产——原价\n  以后各期（取得后至处置前）：\n  借：年初未分配利润\n    贷：固定资产——原价\n  借：固定资产——累计折旧（以前期间多计提的折旧）\n    贷：年初未分配利润\n  借：固定资产——累计折旧（本期多计提的折旧）\n    贷：管理费用等\n  清理期间：先将固定资产原价、累计折旧中未实现利润抵销，再将清理损益并入\n  ```\n- **易错**：①多计提折旧的抵销要区分\"以前期间（走**年初未分配利润**）\"和\"本期（走**管理费用/制造费用/销售费用**）\"；②清理期间的抵销要先把未实现内部销售损益随着资产退出而**全部转销**；③**逆流**的固定资产交易还需在少数股东损益中分摊。\n- **考察**：`2021-12`、`2019-17`、`2022-12`\n\n### 内部无形资产交易的抵销\n- **优先级**：★★★\n- **内容**：与内部固定资产交易同理，抵销未实现内部销售损益及多计（或少计）的摊销。\n  ```\n  借：资产处置收益（或营业收入/营业成本）\n    贷：无形资产——原价\n  借：无形资产——累计摊销（以前期间多摊销额）\n    贷：年初未分配利润\n  借：无形资产——累计摊销（本期多摊销额）\n    贷：管理费用\n  递延所得税影响：\n  借：递延所得税资产（＝未实现损益净额×税率）\n    贷：所得税费用\n  ```\n- **易错**：①**内部无形资产**抵销后，因合并报表口径无形资产账面价值与计税基础不同形成的可抵扣暂时性差异，应确认**递延所得税资产**，并在抵销分录中体现；②多计摊销额同时影响**少数股东权益**（需按比例分摊）。\n- **考察**：`2016-12`\n\n### 内部交易抵销与少数股东权益的关系\n- **优先级**：★★★\n- **内容**：内部交易抵销后影响净资产的，需在\"归属于母公司所有者的净利润\"与\"少数股东损益\"之间分配。**逆流交易**（子公司向母公司出售）产生的未实现损益按母公司持股比例分配，**顺流交易**（母公司向子公司出售）产生的未实现损益**全部由母公司承担**。\n- **计算/分录**：\n  ```\n  逆流交易分摊：\n  借：少数股东权益     （未实现损益×少数股东持股比例）\n    贷：少数股东损益\n  ```\n- **易错**：内部交易影响**其他综合收益**的（如子公司投资性房地产转换公允价值变动被全额抵销），也要在归属于母公司的其他综合收益与**少数股东其他综合收益**之间分配。\n- **考察**：`2021-14`、`2021-13`、`2022-12`\n\n## 五、特殊交易在合并财务报表中的会计处理\n\n### 不丧失控制权下部分处置子公司股权（权益性交易，不确认损益）\n- **优先级**：★★★\n- **内容**：\n  | 报表 | 处理 |\n  |---|---|\n  | **个别财务报表** | 作为长期股权投资的**处置**，出售价款与所处置投资账面价值的差额确认为**投资收益（处置损益）** |\n  | **合并财务报表** | 因仍能实施控制，不确认损益。处置价款与处置长期股权投资相对应享有子公司**自购买日或合并日开始持续计算的净资产份额**之间的差额，应当**调整资本公积（资本溢价/股本溢价）**，不足依次冲减盈余公积、未分配利润 |\n- **计算/分录**：\n  ```\n  处置20%股权：\n  子公司净资产划分为：归属于母公司的所有者权益（含商誉）＋ 少数股东权益（不含商誉）\n  处置价款 － 处置股权对应享有的子公司净资产份额（含商誉部分）\n     → 调整资本公积（或冲减）\n  合并报表调整：\n  借：银行存款（或其他）\n    贷：资本公积（差额）／相反方向\n  ```\n- **易错**：①买、卖子公司部分股权都是**两类股东之间的交易**（权益性交易），**不确认损益**；②母公司**购买少数股权**时，按比例把少数股东权益（含子公司净资产、**不含商誉**）的账面价值调整至归属于母公司的所有者权益；③少数股东权益**不含商誉**，计算份额时要注意把商誉单独拿出来。\n- **考察**：`2022-12`、`2016-16`、`2016-15`\n\n### 丧失控制权：一次交易处置子公司\n- **优先级**：★★★\n- **内容**：母公司因处置部分股权投资或其他原因丧失对原有子公司控制的，在合并财务报表中应当：\n  1. **终止确认**相关资产、负债、商誉等的账面价值，并终止确认**少数股东权益**（包括属于少数股东的其他综合收益）的账面价值；\n  2. 按照**丧失控制权日的公允价值重新计量剩余股权**，按剩余股权对被投资方的影响程度，将剩余股权作为长期股权投资或金融工具核算；\n  3. **处置损益＝（处置股权取得的对价 ＋ 剩余股权的公允价值）－ （按原持股比例计算应享有原有子公司自购买日开始持续计算的净资产账面价值份额 ＋ 商誉）**，差额计入**丧失控制权当期的投资收益**；\n  4. 与原有子公司股权投资相关的**其他综合收益**，应当在丧失控制权时采用与原有子公司**直接处置相关资产或负债相同的基础**进行会计处理；\n  5. 与原有子公司相关的涉及权益法核算下的其他所有者权益变动，应当在丧失控制权时**转入当期损益**。\n- **计算/分录**：\n  ```\n  合并报表处置损益＝（处置对价 ＋ 剩余股权公允价值）－（原持股比例×自购买日持续计算的净资产账面价值 ＋ 商誉）\n  合并报表调整（在个别报表已确认处置收益基础上）：\n  ①对剩余股权按丧失控制权日公允价值重新计量：\n  借：长期股权投资（公允价值）\n    贷：长期股权投资（原账面价值×剩余比例）\n        投资收益（差额）\n  ②对个别报表中部分处置收益的归属期间进行调整：\n  借：投资收益\n    贷：年初未分配利润 / 其他综合收益（按归属期间拆分）\n  ③原其他综合收益转入损益：\n  借：其他综合收益\n    贷：投资收益\n  ```\n- **易错**：①个别报表的处置损益与合并报表的处置损益**金额不同**，考试常要求分别计算并说明差异；②**处置原通过同一控制下企业合并取得的子公司并丧失控制权**时，无论交易对手方是关联方还是非关联方，原合并日因长投初始投资成本与合并对价账面价值差额调整的**资本公积**，在合并财务报表中**不得转出至当期损益或留存收益**；③不再纳入合并范围后，该子公司自处置日之后的损益不再入合并报表。\n- **考察**：`2018-8`、`2018-9`、`2016-13`、`2022-12`\n\n### 多次交易分步处置直至丧失控制权与\"一揽子交易\"的判断\n- **优先级**：★★★\n- **内容**：通过多次交易分步处置对子公司股权投资**直至丧失控制权**的，在合并财务报表中**首先应判断**分步交易是否属于\"**一揽子交易**\"。\n  **属于一揽子交易的迹象**：①这些交易是**同时订立**或者在考虑了**彼此影响**的情况下订立的；②这些交易**整体上才能达成一项完整的商业结果**；③**一项交易的发生取决于其他交易的发生**；④一项交易**单独看是不经济的**，但与其他交易一并考虑才是经济的。\n  | 判断结果 | 处理 |\n  |---|---|\n  | **属于**一揽子交易 | 将各项交易**作为一项处置子公司并丧失控制权的交易**进行会计处理；在丧失控制权**之前**的每一次处置价款与处置投资对应的享有子公司净资产份额的差额，在合并财务报表中确认为**其他综合收益**，在丧失控制权时**一并转入**丧失控制权当期的损益 |\n  | **不属于**一揽子交易 | 丧失控制权**之前**的每一次处置，按\"**不丧失控制权下部分处置**\"处理（差额调整资本公积，不确认损益）；丧失控制权**时**再按\"丧失控制权\"规则处理 |\n- **计算/分录**：\n  ```\n  属于一揽子交易：\n  第一次处置（30%，仍控制）：\n    处置价款3 000 － 对应净资产份额1 500 ＝1 500 → 计入其他综合收益\n  丧失控制权时：\n    将第一次计入其他综合收益的1 500 转入当期损益\n  ```\n- **易错**：①判断\"一揽子交易\"要写**理由**——同一协议同时约定、整体才能达成商业目的、对价相互关联调整、单独看不经济，三到四条；②不属于一揽子交易时，第一次处置**不确认损益**（调资本公积），这与\"属于一揽子交易\"时计入其他综合收益的处理**都不进当期损益**，是常见陷阱；③\"一揽子交易\"分步**取得**控制权（购买方角度）同样有对应的判断与处理规则。\n- **考察**：`2017-21`、`2017-22`、`2017-23`\n\n### 其他股东对子公司增资导致母公司股权稀释\n- **优先级**：★★★\n- **内容**：\n  | 情形 | 处理 |\n  |---|---|\n  | 稀释但**仍控制**子公司 | 按增资**前**持股比例计算其在增资前子公司自购买日（合并日）开始持续计算的净资产账面价值中的份额，与增资后按母公司持股比例计算的在增资后子公司净资产账面价值份额之间的**差额计入资本公积**，不足依次冲减盈余公积、未分配利润 |\n  | 稀释并**丧失控制权** | 按\"母公司因处置对子公司长期股权投资而丧失控制权\"处理 |\n- **计算/分录**：\n  ```\n  增资前份额＝增资前子公司净资产×原持股比例\n  增资后份额＝增资后子公司净资产×新持股比例\n  差额 → 调整资本公积\n  借：长期股权投资（或相反）\n    贷：资本公积（不足则冲减盈余公积、未分配利润）\n  ```\n- **易错**：个别报表中被动稀释导致丧失控制权的，要先把\"按新持股比例享有原子公司因增资扩股而增加净资产的份额\"与\"应结转持股比例下降部分所对应的长投原账面价值\"的差额**计入当期损益**，再按新持股比例**视同自取得投资时即采用权益法**追溯调整。\n- **考察**：`2022-12`、`2016-13`\n\n### 交叉持股的合并处理\n- **优先级**：★★\n- **内容**：交叉持股指母公司持有子公司股份并对其实施控制，同时子公司也持有母公司股份。编制合并财务报表时：\n  - 母公司持有的子公司股权，与通常的\"母公司长期股权投资与子公司所有者权益抵销\"处理**相同**；\n  - 对于子公司持有的母公司股权，应按**库存股**处理（视为母公司回购自身股份），在合并报表中作为所有者权益的减项列示。\n- **易错**：子公司持有母公司股权不能在合并报表中同时确认\"长期股权投资\"和\"股本\"。\n- **考察**：—\n\n### 其他特殊交易（集团角度的重述）\n- **优先级**：★★\n- **内容**：站在企业集团合并财务报表角度的确认和计量结果与其所属母公司或子公司个别财务报表层面不一致的，编制合并报表时应**站在企业集团角度对该特殊交易事项予以调整**。典型例子：①母公司把借款作为实收资本投入子公司用于长期资产建造，合并层面应反映**借款利息的资本化金额**；②子公司作为投资性房地产的大厦出租给集团内其他企业使用，合并层面应作为**固定资产**反映。\n- **考察**：`2015-10`、`2020-1`\n\n## 六、所得税会计相关的合并处理\n\n### 内部应收款项相关所得税的合并处理\n- **优先级**：★★★\n- **内容**：随着内部债权债务的抵销，内部应收账款计提的坏账准备也应抵销；抵销后合并财务报表中该内部应收账款已不存在，**因该内部应收账款账面价值与计税基础之间的差异所形成的暂时性差异也不能存在**，因此对持有该集团内部应收款项的企业因该暂时性差异确认的**递延所得税资产应予抵销**。\n- **计算/分录**：\n  ```\n  借：所得税费用\n    贷：递延所得税资产    （＝抵销的坏账准备×所得税税率）\n  ```\n- **易错**：抵销的是**个别报表中已确认的**递延所得税资产，金额＝内部应收款项抵销的坏账准备×税率；连续编制时通过\"**年初未分配利润**\"过渡。\n- **考察**：`2018-7`、`2022-12`\n\n### 内部存货、固定资产交易相关所得税的合并处理\n- **优先级**：★★★\n- **内容**：内部交易抵销后，合并报表口径的资产账面价值（不含未实现内部销售损益）**小于**其计税基础（税法以内部售价为基础），形成**可抵扣暂时性差异**，应确认**递延所得税资产**。\n- **计算/分录**：\n  ```\n  借：递延所得税资产       （＝期末未实现内部销售损益×所得税税率）\n    贷：所得税费用\n  连续编制时：\n  借：递延所得税资产\n    贷：年初未分配利润\n  （本期变动额调整\"所得税费用\"）\n  ```\n- **易错**：①递延所得税资产余额按**期末未实现内部销售损益余额**计算，不是按当期发生额；②内部交易影响**其他综合收益**的项目（如投资性房地产），其递延所得税影响也应计入**其他综合收益**而非所得税费用；③抵销分录中递延所得税**同时影响少数股东权益**时，需按比例分摊。\n- **考察**：`2016-12`、`2022-12`、`2021-14`\n\n### 内部交易抵销的完整链条示例（存货→固定资产→清理）\n- **优先级**：★★\n- **内容**：内部存货交易中，买方将购入存货作为固定资产使用的（如子公司买入存货转作固定资产），需同时处理两层抵销：①存货交易本身的未实现损益；②转为固定资产后按公允价值基础多计的折旧。\n  ```\n  借：营业收入 / 营业成本（未实现内部销售损益）\n    贷：固定资产——原价\n  借：固定资产——累计折旧（多计折旧）\n    贷：管理费用 / 营业成本（若该固定资产用于生产，则调整营业成本）\n  ```\n- **易错**：多计折旧冲减的对象取决于该固定资产的**使用部门**（生产部门→营业成本，管理部门→管理费用）；已售出部分冲减\"**营业成本**\"，未售出部分冲减\"**存货**\"。\n- **考察**：`2021-12`\n\n## 七、合并现金流量表\n\n### 合并现金流量表的编制要点\n- **优先级**：★★\n- **内容**：合并现金流量表以母公司和纳入合并范围的子公司的个别现金流量表为基础，抵销内部交易产生的现金流量影响。需抵销的主要项目：①母公司与子公司、子公司相互之间**当期以现金投资或收购股权**增加的投资所产生的影响；②当期取得投资收益收到的现金与分派股利、利润或偿付利息支付的现金；③**内部购销商品、提供劳务**产生的现金流量；④内部固定资产、无形资产等**长期资产交易**产生的现金流量；⑤内部债权债务的清偿。\n- **易错**：①少数股东权益的增减变动在合并现金流量表中列示在**筹资活动**；②\"子公司吸收少数股东投资收到的现金\"、\"子公司支付给少数股东的股利、利润\"作为\"**其中**\"项目单列；③同一笔内部交易在合并现金流量表中**借贷双方项目都要抵销**，不能只抵一方。\n- **考察**：—\n\n## 本章易错陷阱汇总\n1. **抵销分录中的\"年初未分配利润\"**：连续编制时，以前期间内部交易对本期的延续影响一律通过\"年初未分配利润\"过渡（存货已销走\"营业成本\"、未销走\"存货\"、跌价准备走\"存货——存货跌价准备\"、递延所得税走\"递延所得税资产\"）。\n2. **少数股东权益不含商誉**——商誉全部归属于母公司。计算少数股东权益份额时务必把商誉剥离出去。\n3. **顺流与逆流**：逆流交易的未实现损益要在\"归属于母公司所有者的净利润\"与\"少数股东损益\"之间按持股比例分摊（借：少数股东权益 贷：少数股东损益）；顺流交易全部由母公司承担。\n4. **不丧失控制权下处置部分子公司股权**：个别报表**确认投资收益**，合并报表**调整资本公积、不确认损益**——两张报表的结论相反，最容易出错。\n5. **丧失控制权的处置损益公式**必须记牢：（处置对价＋剩余股权公允价值）－（原持股比例×自购买日持续计算的净资产账面价值＋商誉）；并且剩余股权要按**丧失控制权日公允价值重新计量**。\n6. **同一控制下合并取得的子公司丧失控制权**时，原合并日调整的资本公积在合并报表中**不得转入**当期损益或留存收益。\n7. **一揽子交易**判断要写理由（同时订立、整体商业目的、对价相互关联、单独看不经济）；属于一揽子交易时，丧失控制权前的处置差额计入**其他综合收益**，丧失控制权时**一并转损益**。\n8. **成本法转权益法调整**中，\"投资收益\"调**当期**、\"年初未分配利润\"调**以前期间**；子公司净利润要先用**购买日公允价值调整**后的口径。\n9. **内部交易的递延所得税抵销方向**：内部债权债务抵销→**冲减**递延所得税资产（借所得税费用）；内部存货、固定资产抵销→**确认**递延所得税资产（贷所得税费用）。两个方向相反。\n10. **购买日公允价值调整**要在**每期**重做（折旧、摊销、存货销售的实现），不能只在购买日做一次。\n11. **报告期内处置唯一子公司**：期末无子公司仍须编制本年合并财务报表，合并资产负债表的**期初数不调整**。\n12. **合并所有者权益变动表**必须增加\"少数股东权益\"栏目。\n\n## 本章分录模板\n\n**模板 A：购买日/以后期间的三步走（非同一控制下）**\n```\n第一步——按购买日公允价值调整子公司报表：\n借：存货 / 固定资产 / 无形资产等\n  贷：应收账款 / 资本公积\n\n第二步——成本法转权益法（调整母公司长投）：\n借：长期股权投资——损益调整\n  贷：投资收益（本期） / 年初未分配利润（以前期间）\n借：长期股权投资——其他综合收益      贷：其他综合收益\n借：长期股权投资——其他权益变动      贷：资本公积——其他资本公积\n\n第三步——抵销：\n（1）长投与子公司所有者权益：\n借：股本 / 资本公积 / 其他综合收益 / 盈余公积 / 未分配利润\n    商誉\n  贷：长期股权投资\n      少数股东权益\n（2）投资收益与利润分配：\n借：投资收益 / 少数股东损益 / 年初未分配利润\n  贷：提取盈余公积 / 对所有者的分配 / 年末未分配利润\n（3）应收股利与应付股利：\n借：应付股利        贷：应收股利\n```\n\n**模板 B：内部存货交易**\n```\n当期：\n借：营业收入                       （内部售价）\n  贷：营业成本                       （内部成本）\n      存货                           （未实现毛利）\n借：存货——存货跌价准备              （以抵销的未实现损益为限）\n  贷：资产减值损失\n借：递延所得税资产                  （未实现毛利×税率）\n  贷：所得税费用\n连续编制：\n借：年初未分配利润                  贷：营业成本（本期已对外销售部分）\n                                         存货（本期仍未销售部分）\n借：存货——存货跌价准备              贷：年初未分配利润\n借：递延所得税资产                  贷：年初未分配利润\n```\n\n**模板 C：内部固定资产交易**\n```\n交易当期（卖方为存货）：\n借：营业收入                      贷：营业成本、固定资产——原价\n以后各期：\n借：年初未分配利润                  贷：固定资产——原价\n借：固定资产——累计折旧（以前期间多提） 贷：年初未分配利润\n借：固定资产——累计折旧（本期多提）     贷：管理费用/营业成本\n清理期间：将固定资产原价、累计折旧中的未实现损益全部转销\n```\n\n**模板 D：内部无形资产交易**\n```\n借：资产处置收益（或营业收入/营业成本）\n  贷：无形资产——原价\n借：无形资产——累计摊销（多摊销额）\n  贷：管理费用 / 年初未分配利润\n借：递延所得税资产\n  贷：所得税费用\n```\n\n**模板 E：内部债权债务**\n```\n借：应付账款 / 应付票据 / 应付债券 / 预收款项\n  贷：应收账款 / 应收票据 / 债权投资 / 合同负债\n借：应收账款——坏账准备\n  贷：信用减值损失（本期变动） / 年初未分配利润（以前期间）\n借：所得税费用（或年初未分配利润）\n  贷：递延所得税资产\n```\n\n**模板 F：丧失控制权（合并财务报表）**\n```\n合并处置损益＝（处置对价＋剩余股权公允价值）\n            －（原持股比例×自购买日持续计算的净资产账面价值份额＋商誉）\n① 剩余股权按丧失控制权日公允价值重新计量：\n借：长期股权投资（公允价值）\n  贷：长期股权投资（原账面价值×剩余比例）\n      投资收益\n② 对个别报表已确认处置收益的归属期间调整：\n借：投资收益\n  贷：年初未分配利润 / 其他综合收益\n③ 原其他综合收益转入损益：\n借：其他综合收益\n  贷：投资收益\n④ 终止确认少数股东权益及子公司资产负债、商誉\n⑤ 同一控制下取得的子公司：原合并日调整的资本公积不得转出\n```\n\n**模板 G：不丧失控制权下处置部分子公司股权**\n```\n个别报表：\n借：银行存款\n  贷：长期股权投资（对应账面价值）\n      投资收益                     （个别报表确认损益）\n合并报表：\n借：银行存款\n  贷：资本公积（差额）              （处置价款与对应享有子公司自购买日持续计算净资产份额之差）\n（不确认损益；不足时依次冲减盈余公积、未分配利润）\n```\n\n## 与其他章的联动\n- 与第6章（长期股权投资与合营安排）：合并报表的\"成本法转权益法调整\"直接复用第6章权益法的全套规则；**丧失控制权**在个别报表（6章）与合并报表（27章）的处理完全不同，是跨章综合题的核心。\n- 与第26章（企业合并）：本章的**购买日、合并成本、可辨认净资产公允价值、商誉**四个数据全部来自26章；同一控制下合并的合并报表处理在两章间分工。\n- 与第19章（所得税）：合并抵销产生的暂时性差异、递延所得税资产/负债的方向与金额，是本章第十节的全部内容。\n- 与第7章（资产减值）：商誉减值测试、资产组减值与合并报表的商誉抵销相互衔接。\n- 与第10章（股份支付）：集团内涉及不同企业的股份支付交易，在合并报表中需抵销\"资本公积——其他资本公积\"与\"长期股权投资\"。\n- 与第14章（租赁）：内部租赁交易的抵销（承租方确认使用权资产、租赁负债与出租方确认的固定资产、其他综合收益）需要按集团角度重述，并影响少数股东损益与其他综合收益。\n- 与第15章（持有待售）：**分步处置子公司股权至丧失控制权构成一揽子交易**时，第一次处置的30%股权若同时满足持有待售条件，需按持有待售准则计量与列报。\n",
    "28": "# 第二十八章 每股收益\n\n> 本题库考察频次：3 题（2021-2、2021-3、2021-4） ｜ 优先级：C 类（低频章，≤4 题） ｜ 建议投入：重点掌握加权平均股数与稀释每股收益计算\n\n**说明**：本章在本题库中没有以「第二十八章」为教材定位的独立题目，但 **2021-3、2021-4 是本章的真实考题**（分别与第十章股份支付、综合题联考），2021-2 也与本章计算相关——即本章实际在 2021 年综合题中**两度被用来计算**。因此「C 类」只是就题量与定位方式而言，**本章的公式必须像分录一样默写到条件反射**：本章是全卷唯一\"纯公式就能拿分\"的计算章，且一旦考到必然是大分值计算题。\n\n**教材结构（OCR 可确认）**：第一节 每股收益的基本概念；第二节 基本每股收益（一、分子的确定；二、分母的确定）；第三节 稀释每股收益（一、基本计算原则；二、可转换公司债券；三、认股权证、股份期权；四、授予员工的限制性股票或股份期权；五、回购合同；六、多项潜在普通股）；第四节 每股收益的列报（一、重新计算；二、列报）。\n\n---\n\n## 考点清单\n### 基本每股收益的计算公式与分子（归属于普通股股东的净利润）\n- **优先级**：★★★\n- **内容**：**基本每股收益 ＝ 归属于普通股股东的当期净利润 ÷ 当期发行在外普通股的加权平均数**。分子即企业当期实现的可供普通股股东分配的净利润或应由普通股股东分担的净亏损金额；**发生亏损的企业，每股收益以负数列示**。以**合并财务报表**为基础计算的每股收益，分子应当是**归属于母公司普通股股东的当期合并净利润，即扣减少数股东损益后的余额**。\n- **内容（其他权益工具的处理）**：企业存在发行在外的除普通股以外的权益工具的，基本每股收益的分子**不应包含其他权益工具的股利或利息**：\n  - **不可累积优先股**等其他权益工具：扣除**当期宣告发放**的股利；\n  - **累积优先股**等其他权益工具：**无论当期是否宣告发放股利，均应扣除**归属于其他权益工具持有者的股利；\n  - 与普通股股东**一起参加剩余利润分配**的其他权益工具（如可参加机制）：归属于普通股股东的净利润**不应包含**按可参加机制计算应归属于其他权益工具持有者的净利润。\n- **计算/分录**：\n  ```\n  归属于普通股股东的净利润（合并口径＝归母净利润 − 其他权益工具股利/利息）\n  基本每股收益 = ────────────────────────────────────────────────\n                        当期发行在外普通股的加权平均数\n  ```\n- **易错**：①**累积优先股是\"无论宣告与否都扣\"**，不可累积优先股是\"只扣当期已宣告的\"——这是最爱设陷阱的一处对照；②合并口径用的是**归属于母公司普通股股东**的净利润（已扣少数股东损益）；③亏损企业每股收益为**负数**，不要写\"0\"。\n- **考察**：2021-3\n\n### 分母：发行在外普通股加权平均数\n- **优先级**：★★★\n- **内容**：分母为**当期发行在外普通股的加权平均数**，即期初发行在外普通股股数根据当期新发行或回购的普通股股数**与相应时间权数的乘积**调整后的股数。**库存股不属于发行在外的普通股，且无权参与利润分配，应当在计算分母时扣除**。\n- **计算/分录**：\n  ```\n  发行在外普通股加权平均数\n    = 期初发行在外普通股股数\n    + 当期新发行普通股股数 × 已发行时间 ÷ 报告期时间\n    − 当期回购普通股股数     × 已回购时间 ÷ 报告期时间\n  ```\n  其中作为权数的已发行时间、报告期时间和已回购时间**通常按天数计算**；在不影响计算结果合理性的前提下，**也可以采用简化的计算方法，如按月数计算**。\n- **内容（新发行股数从何时起算）**：新发行普通股股数应当根据发行合同的具体条款，**从应收或实收对价之日起计算**确定：\n  - **为收取现金**而发行的普通股：从**应收现金之日**起计算；\n  - **因债务转资本**而发行的普通股：从**停计债务利息之日或结算日**起计算；\n  - **非同一控制下企业合并**作为对价发行的普通股：从**购买日**起计算；**同一控制下企业合并**作为对价发行的普通股：应当计入**与合并净利润口径一致的相关各列报期间**普通股的加权平均数；\n  - **为购买非现金资产**而发行的普通股：从**确认所购买的资产之日**起计算。\n- **易错**：①**库存股必须扣除**（回购的股票以备将来奖励职工之用，在回购期间不属于发行在外普通股）；②时间权数按月还是按天，一题之内口径要统一；③\"同一控制下企业合并作为对价发行的股数要计入比较期间\"是最容易漏的一条。\n- **考察**：2021-3\n\n### 股票股利、公积金转增股本、拆股和并股的追溯调整\n- **优先级**：★★★\n- **内容**：企业派发**股票股利**、**公积金转增资本**、**拆股或并股**等，会增加或减少其发行在外普通股或潜在普通股的数量，但**并不影响所有者权益金额**，既不影响企业所拥有或控制的经济资源，也不改变企业的盈利能力，因此**应当视同该变化在报告期期初（即列报最早期间期初）就已经发生**，并据此**重新计算各列报期间的每股收益**（**追溯调整**）。\n- **计算/分录**：\n  ```\n  调整后股数 = 原股数 × 送股/转增比例系数（如每 10 股送 3 股 → × 1.3）\n  比较期间：原发行在外普通股加权平均数 × 系数（全期间同乘，不做时间加权）\n  ```\n- **易错**：①**不要把股票股利按时间加权**——它不带来经济资源流入，必须**视同期初已发生**；而**按市价新发行的股份仍要按时间加权**（两者在同一题里同时出现是标准考法）；②拆股、并股同理，并股是反向乘系数。\n- **考察**：—\n\n### 稀释每股收益：基本计算原则与潜在普通股\n- **优先级**：★★★\n- **内容**：稀释每股收益是以基本每股收益为基础，**假设企业所有发行在外的稀释性潜在普通股均已转换为普通股**，从而分别调整**归属于普通股股东的当期净利润**（分子）以及**发行在外普通股的加权平均数**（分母）计算而得的每股收益。\n  - **潜在普通股**＝赋予其持有者在报告期或以后期间享有取得普通股权利的一种金融工具或其他合同。我国企业发行的潜在普通股主要有**可转换公司债券、认股权证、股份期权**等（另有**限制性股票**、回购合同等安排）。\n  - **稀释性潜在普通股**＝假设当期转换为普通股会**减少每股收益或增加每股亏损**的潜在普通股；只考虑稀释性潜在普通股，**不考虑不具稀释性的潜在普通股**。\n- **分子调整**：①当期已确认为费用的**稀释性潜在普通股的利息**；②稀释性潜在普通股**转换时将产生的收益或费用**。上述调整应当**考虑相关的所得税影响**。对于包含负债和权益成分的金融工具，**仅需调整属于金融负债部分**的相关利息、利得或损失。\n- **分母调整**：当期发行在外普通股的加权平均数 ＝ 计算基本每股收益时的加权平均数 ＋ 假定稀释性潜在普通股转换为已发行普通股而**增加的普通股股数的加权平均数**。\n- **内容（稀释性判断的标准口径）**：判断标准是看其对**持续经营每股收益**的影响——假定当期转换为普通股，如果会**减少持续经营每股收益或增加持续经营每股亏损**，表明具有稀释性，否则具有反稀释性。存在**终止经营**的，应当按照**扣除终止经营净利润以后**的当期归属于普通股股东的持续经营净利润作为比较基准。\n- **易错**：①稀释性判断用的是**持续经营**口径（有终止经营时必须先剔除）；②分子调整必须**税后**，且负债权益分拆的工具**只调负债成分**；③在**合并财务报表**中，计算稀释每股收益只考虑**母公司发行的潜在普通股**（子公司发行的潜在普通股不影响合并稀释每股收益）。\n- **考察**：2021-4\n\n### 认股权证、股份期权与回购合同（库藏股法）\n- **优先级**：★★★\n- **内容（认股权证、股份期权）**：对于**盈利企业**，认股权证、股份期权等的**行权价格低于当期普通股平均市场价格**时，具有稀释性。对于**亏损企业**，其自身发行的认股权证、股份期权的假设行权一般**不影响净亏损**，但**增加普通股股数**，从而导致**每股亏损金额减少**，实际上产生了**反稀释**作用，因此这种情况下**不应当计算稀释每股收益**。对于稀释性认股权证、股份期权，**一般无须调整分子净利润金额**，只调整分母。\n- **计算/分录（库藏股法四步）**：\n  ```\n  ① 假设在当期期初（或发行日）已经行权，计算按约定行权价格发行普通股将取得的股款金额\n  ② 按当期普通股平均市场价格，计算需发行多少普通股能带来上述相同股款金额\n  ③ 差额部分＝无对价发行的普通股，作为发行在外普通股股数的净增加：\n     增加的普通股股数 = 拟行权时转换的普通股股数\n                        − 行权价格 × 拟行权时转换的普通股股数 ÷ 当期普通股平均市场价格\n  ④ 将净增加的普通股股数乘以其假设发行在外的时间权数，调整稀释每股收益的分母\n  ```\n  **原理**：行权时发行的普通股视为两部分——一部分按**平均市场价格**发行（资源与股数同比例增加，**无稀释也无反稀释**）；另一部分**无对价发行**（资源没增加但股数增加，**具有稀释性**）。当期发行认股权证或股份期权的，普通股平均市场价格应当**自发行日起计算**。\n- **内容（回购合同）**：企业承诺回购其股份的，采用与认股权证相同的思路（先按市价发行募资、再按约定价格回购）：\n  ```\n  增加的普通股股数 = 回购价格 × 承诺回购的普通股股数 ÷ 当期普通股平均市场价格\n                     − 承诺回购的普通股股数\n  ```\n  假设口径：企业于**期初**按当期普通股平均市场价格发行普通股以募集足够资金履行回购合同；**合同日晚于期初的，则假设于合同日**按自合同日至期末的普通股平均市场价格发行足量普通股。比较假设发行的股数与假设回购的股数，差额作为净增加的发行在外普通股股数，再乘以**相应的时间权数**调整分母。\n- **内容（平均市场价格的计算）**：理论上应当包括该普通股每次交易的价格，实务操作中通常对**每周或每月具有代表性的股票交易价格进行简单算术平均**：价格平稳时可采用每周或每月**收盘价**；波动较大时可采用每周或每月**最高价与最低价的平均值**。方法**一经确定不得随意变更**，除非股票价格波动情况发生明显改变或有其他确凿证据表明原计算方法不再适用。\n- **易错**：①**行权价格 ≥ 平均市场价格时没有稀释性**，直接跳过；②**亏损企业不计算稀释每股收益**是常考的\"反直觉\"结论；③回购合同计算出的\"增加股数\"**可能为负**（回购价低于市价时），该情形下增量为 0、无稀释性；④时间权数别忘了乘（合同日在中途时按剩余月数加权）。\n- **考察**：2021-4（2019 年回购合同增量股每股收益为 0）\n\n### 可转换公司债券（假设转换法）\n- **优先级**：★★★\n- **内容**：对于可转换公司债券，可以采用**假设转换法**判断其稀释性并计算稀释每股收益：假设这部分可转换公司债券在当期**期初（或发行日）**即已转换成普通股，一方面**增加了发行在外的普通股股数**，另一方面**节约了公司债券的利息费用、增加了归属于普通股股东的当期净利润**。用**增加的净利润 ÷ 增加的普通股股数**得出**增量股的每股收益**，与原来的每股收益比较：**增量股的每股收益小于原每股收益**，则说明具有稀释作用，应当计入稀释每股收益的计算。\n- **计算/分录**：\n  ```\n  分子调整（增加的净利润）= 当期已确认为费用的利息等的税后影响额\n                          ≈ 利息费用 ×（1 − 所得税税率）（含溢折价摊销）\n  分母调整（增加的普通股股数，加权）= 转换股数 × 自期初（或发行日）起的月份数 ÷ 12\n  增量股每股收益 = 分子调整 ÷ 分母调整\n  稀释每股收益 = （原归属于普通股股东的净利润 + 分子调整）÷（原加权平均股数 + 分母调整）\n  ```\n  **转股股数**＝债券面值 ÷ 转股价格（如每 100 元债券可转换为 10 股面值 1 元的普通股，即转股价格为每股 10 元）。\n  教材示例（例 28-3）：基本每股收益 1.91 元/股，增量股每股收益 0.22 元/股 < 1.91，具有稀释作用，稀释每股收益 1.52 元/股。\n- **易错**：①对于**包含负债和权益成分**的可转换公司债券，只能调整**负债成分**的利息（即按**实际利率法**确认的利息费用，含折溢价的摊销），**不能**用票面利息；②分子调整必须是**税后**金额；③**当期发行的可转债**分母从**发行日**起加权；④**转股价格必须用\"每多少元债券转多少股\"换算**，不要直接用面值除以 100。\n- **考察**：2021-4（2018 年可转债增量股每股收益 0.92、2019 年 0.95、2020 年 0.97）\n\n### 授予员工的限制性股票（等待期内每股收益）\n- **优先级**：★★★\n- **内容（基本每股收益）**：限制性股票由于未来可能被回购，**性质上属于或有可发行股票**，因此**在计算基本每股收益时不应当包括在内**（分母**不应包含限制性股票的股数**）。等待期内基本每股收益的计算，视**发放的现金股利是否可撤销**采取不同方法：\n\n| 情形 | 分子处理 | 分母处理 |\n|---|---|---|\n| **现金股利可撤销**（未达解锁条件时，被回购限制性股票的持有者将无法获得或需退回等待期内应收/已收的现金股利） | **扣除**当期分配给**预计未来可解锁**限制性股票持有者的**现金股利** | 不包含限制性股票股数 |\n| **现金股利不可撤销**（不论是否解锁均有权获得） | **扣除归属于预计未来可解锁限制性股票的净利润**（此时属于与普通股股东一起参加剩余利润分配的其他权益工具） | 不包含限制性股票股数 |\n\n- **内容（稀释每股收益，解锁条件仅为服务期限条件）**：公司应**假设资产负债表日尚未解锁的限制性股票已于当期期初（或晚于期初的授予日）全部解锁**，并**参照股份期权的有关规定**考虑其稀释性——行权价格低于当期普通股平均市场价格时应当考虑稀释性。\n  ```\n  行权价格 = 限制性股票的发行价格\n             + 资产负债表日尚未取得的职工服务按《企业会计准则第 11 号——股份支付》\n               有关规定计算确定的公允价值\n  ```\n  （教材例 28-5：授予价格 8 元、授予日公允价值 15 元、等待期 3 年，第 1 年末行权价格＝8＋15×2/3＝18 元；例 28-9：授予价格 10 元、授予日公允价值 5 元、等待期 3 年，第 1 年末行权价格＝10＋5×2/3＝13.33 元。）再按**库藏股法**计算净增加股数：\n  ```\n  稀释每股收益 = 归属于普通股股东的净利润\n                ÷ [ 发行在外普通股加权平均数\n                    + （发行在外限制性股票加权平均数\n                       − 行权价格 × 限制性股票加权平均数 ÷ 当期普通股平均市场价格）]\n  ```\n- **易错**：①**基本每股收益的分母绝不含限制性股票**（这是 2021-3 的核心考点）；②现金股利**可撤销扣\"股利\"、不可撤销扣\"净利润\"**，两者标的完全不同；③行权价格中的\"尚未取得的职工服务公允价值\"要按**剩余等待期比例**计算（如等待 3 年、第 1 年末为 15×2/3），不要用全部公允价值；④限制性股票的**加权平均数**也要按时间权重（授予日在期初之后时按实际天数/月数加权）；⑤解锁条件**不是**仅为服务期限条件时的处理与本条不同，教材另有规定。\n- **考察**：2021-3、2021-4、2021-2（2021-2 的等待期限制性股票每股收益计算，教材定位以第十章为主）\n\n### 多项潜在普通股的计入顺序与反稀释\n- **优先级**：★★★\n- **内容**：企业对外发行不同潜在普通股的，**单独考察**其中某潜在普通股可能具有稀释作用，但**与其他潜在普通股一并考察时可能恰恰变为反稀释作用**。为了反映潜在普通股**最大的稀释作用**，应当按照**各潜在普通股的稀释程度从大到小的顺序**计入稀释每股收益，**直至稀释每股收益达到最小值**。\n- **内容（稀释程度的衡量）**：稀释程度根据**增量股的每股收益**衡量，即假定稀释性潜在普通股转换为普通股的情况下，**将增加的归属于普通股股东的当期净利润除以增加的普通股股数**的金额。**增量股每股收益越小，稀释程度越大**。**企业每次发行的潜在普通股应当视作不同的潜在普通股，分别判断其稀释性**，而不能作为一个总体考虑。\n- **内容（排序的经验规律）**：通常情况下，**股份期权和认股权证排在前面计算**，因为其假设行权**一般不影响净利润**（增量股每股收益趋于 0，稀释程度最大）。\n- **计算/分录（分步法）**：\n  ```\n  第 1 步：逐项计算各潜在普通股的\"增量股每股收益 = 净利润增加额 ÷ 股数增加额\"\n  第 2 步：按增量股每股收益从小到大排序（越小越稀释，先计入）\n  第 3 步：依次累加，每加一项就重算一次每股收益；\n           若加入后每股收益反而上升（该潜在普通股变为反稀释），则不再考虑该项\n  第 4 步：取全程的最小值作为稀释每股收益\n  ```\n  教材示例（例 28-7）：基本每股收益 0.30 元/股；依次计入认股权证（增量股每股收益≈0）后为 0.27、计入 1.4% 可转债（增量股每股收益 0.105）后为 0.20；再计入 2.6% 可转债（增量股每股收益 0.244）后反升至 0.21，属**反稀释**，不予考虑——最终稀释每股收益 0.20 元/股。\n- **易错**：①**判断顺序不能颠倒**：必须**从小到大**按增量股每股收益排序，不能按发行时间或金额大小排；②一旦某项变为**反稀释就\"到此为止\"不再考虑**（不是只跳过该项继续加后面的——教材口径是依次计入直至达到最小值）；③**辅助股（子公司发行的潜在普通股）**的处理要分两步走：先算子公司的每股收益（含其自身潜在普通股），再按母公司的持股比例折算；母公司持有子公司认股权证的部分还要单独计入合并稀释每股收益（见下方易错汇总）；④以前期间计算的稀释每股收益**不因后续期间反稀释而追溯调整**。\n- **考察**：2021-4（2018 年限制性股票增量股每股收益 0.89、可转债 0.92；2019 年回购合同 0、限制性股票 0.61、可转债 0.95；2020 年限制性股票 0.01、可转债 0.97）\n\n### 每股收益的列报、重新计算与披露\n- **优先级**：★★\n- **内容（列报）**：对于普通股或潜在普通股**已公开交易**的企业，以及正处于**公开发行普通股或潜在普通股过程中**的企业，如果**不存在稀释性潜在普通股**则应当在利润表中**单独列示基本每股收益**；如果**存在稀释性潜在普通股**则应当**分别单独列示基本每股收益和稀释每股收益**。编制**比较财务报表**时，**各列报期间中只要有一个期间列示了稀释每股收益，那么所有列报期间均应当列示稀释每股收益**，**即使其金额与基本每股收益相等**。\n- **内容（配股的重新计算）**：配股是向**全部现有股东以低于当前股票市价的价格**发行普通股，实际可以理解为**按市价发行股票和无对价送股的混合体**。因此计算基本每股收益时应当考虑配股中的**送股因素**，将这部分**无对价的送股（注意不是全部配发的普通股）**视同**列报最早期间期初就已发行在外**，并据以调整各列报期间发行在外普通股的加权平均数。\n  ```\n  每股理论除权价格 =（行权前发行在外普通股的公允价值总额 + 配股收到的款项）\n                    ÷ 行权后发行在外的普通股股数\n  调整系数 = 行权前发行在外普通股的每股公允价值 ÷ 每股理论除权价格\n  因配股重新计算的上年度基本每股收益 = 上年度基本每股收益 ÷ 调整系数\n  本年度基本每股收益 = 归属于普通股股东的当期净利润\n                     ÷（配股前发行在外普通股股数 × 调整系数 × 配股前普通股发行在外的时间权重\n                        + 配股后发行在外普通股加权平均数）\n  ```\n  教材示例（例 28-11）：配股前市价 11 元、配股价格 6 元、每 4 股配 1 股，2×23 年度原基本每股收益 2.64 元/股，因配股重新计算的 2×23 年度基本每股收益为 2.40 元/股（2.64 ÷ 1.1，调整系数 1.1）。\n- **内容（以前年度损益的追溯调整或追溯重述）**：按照《企业会计准则第 28 号——会计政策、会计估计变更和差错更正》的规定对以前年度损益进行追溯调整或追溯重述的，**应当重新计算各列报期间的每股收益**。\n- **内容（附注披露）**：①基本每股收益和稀释每股收益**分子、分母的计算过程**；②**列报期间不具有稀释性但以后期间很可能具有稀释性的潜在普通股**；③**资产负债表日至财务报告批准报出日之间**，企业发行在外普通股或潜在普通股发生**重大变化**的情况。企业如有**终止经营**，应当在附注中**分别持续经营和终止经营**披露基本每股收益和稀释每股收益。\n- **内容（合并报表口径）**：企业对外提供合并财务报表的，**仅要求以合并财务报表为基础计算每股收益并在合并财务报表中列报**；与合并财务报表一同提供的**母公司财务报表中不要求计算和列报每股收益**，企业自行选择列报的，应当以母公司**个别财务报表**为基础计算并在个别财务报表中列报。\n- **易错**：①**\"只要有一个期间列示了稀释每股收益，所有列报期间都要列示\"**——即使其他期间金额与基本每股收益相等；②配股公式里**只有\"无对价送股\"部分视同期初发生**，不是全部配发股份；③**向特定对象以低于市价发行股票**（战略投资者入股）虽有\"低价\"特征，但属于**向非特定对象增发**情形以外的安排，可以视为**不存在送股因素，视同发行新股处理**（按时间加权）；④配股调整要**同时重算上年度**的每股收益。\n- **考察**：—\n\n---\n\n## 本章易错陷阱汇总\n\n1. **累积 vs 不可累积优先股**：累积优先股**无论是否宣告**都要从分子中扣除股利；不可累积优先股**只扣当期已宣告**的。\n2. **库存股必须从分母剔除**：回购以备将来奖励职工的股票不属于发行在外普通股，且无权参与利润分配。\n3. **限制性股票在基本每股收益中\"不进分母\"**：它是或有可发行股票；在稀释每股收益中才参照股份期权、按\"发行价格＋尚未取得的职工服务公允价值\"作为行权价格考虑稀释性。\n4. **股票股利/转增/拆并股必须追溯调整，不能按时间加权**；而按市价发行的新股**必须按时间加权**。两者同题出现是标准陷阱。\n5. **配股只把\"无对价送股\"部分视同期初发生**，并要按调整系数**同时重算比较期间**的每股收益。\n6. **稀释性判断用\"持续经营每股收益\"口径**：存在终止经营时，必须先从归属于普通股股东的净利润中扣除终止经营净利润。\n7. **可转债分子调整＝负债成分的税后利息费用**（含溢折价摊销），不是票面利息、不是税前。\n8. **亏损企业的认股权证/股份期权不计算稀释每股收益**（假设行权会增加股数从而减少每股亏损，属于反稀释）。\n9. **多项潜在普通股必须按增量股每股收益从小到大依次计入**，某一步出现反稀释即止；**每次发行的潜在普通股要分别判断**，不能合并成一个总体。\n10. **子公司潜在普通股在合并稀释每股收益中的特殊处理**（教材例 28-8、28-9）：先算子公司每股收益（含其自身潜在普通股影响），再分两块折算——\n    - 子公司净利润中**归属于普通股且由母公司享有**的部分 ＝ 子公司稀释每股收益 × 子公司普通股加权平均数 × 母公司持股比例；\n    - 子公司净利润中**归属于认股权证等潜在普通股且由母公司享有**的部分 ＝ 子公司稀释每股收益 × 增加的普通股股数 × **母公司持有的潜在普通股占子公司全部潜在普通股的比例**；\n    - 合并稀释每股收益 ＝（母公司净利润 ＋ 上述两部分）÷ 母公司发行在外普通股加权平均数。\n11. **比较报表的\"全有或全无\"规则**：只要有一个列报期间列示了稀释每股收益，所有列报期间都要列示。\n\n## 本章分录模板\n\n本章为纯计算章，**不涉及会计分录**。必须默写的是三张\"公式卡\"：\n\n```\n【一】基本每股收益\n  归属于普通股股东的当期净利润（合并口径＝归母净利润 − 其他权益工具股利/利息）\n  ────────────────────────────────────────────────────────────\n  加权平均股数 = 期初股数 + 新增股数 × 已发行月数/12 − 回购股数 × 已回购月数/12\n  （股票股利/转增/拆并股、配股中的无对价送股 → 视同期初已发生，追溯调整）\n\n【二】稀释每股收益（分母调整额）\n  认股权证/股份期权：拟行权股数 − 行权价格 × 拟行权股数 ÷ 平均市价\n  回购合同：        回购价格 × 承诺回购股数 ÷ 平均市价 − 承诺回购股数\n  可转债：          转换股数 × 自期初或发行日起的月数/12   （分子加回税后利息）\n  限制性股票：      加权平均限制性股票数 − 行权价格 × 该股数 ÷ 平均市价\n                    行权价格 = 发行价格 + 尚未取得的职工服务公允价值（按剩余等待期比例）\n\n【三】排序与总计\n  逐项算增量股每股收益 → 从小到大排序 → 依次累加（含反稀释即止）→ 取最小值\n```\n\n## 与其他章的联动\n\n- **与第十章（股份支付）**：本章限制性股票在等待期内的每股收益计算，其\"尚未取得的职工服务公允价值\"直接取自第十章股份支付对等待期内服务成本的确认结果；2021-2、2021-3 都是本两章联考的原型。第十章的限制性股票分录（授予日\"库存股＋其他应付款——限制性股票回购义务\"、等待期确认费用、未解锁回购注销）与本章的分母处理必须成对记忆。\n- **与第二十七章（合并财务报表）**：合并口径下每股收益的分子是**归属于母公司普通股股东的净利润（扣减少数股东损益）**；子公司存在潜在普通股时，合并稀释每股收益需要按母公司持股比例和持有潜在普通股比例分两块折算（例 28-8、28-9）。反向购买中，比较前期合并财务报表的基本每股收益应当以**法律上子公司**在每一比较报表期间归属于普通股股东的净损益除以**在重组中发行的、以购买方的普通股股数计算的法律上母公司发行在外普通股股数**计算。\n- **与第十三章（金融工具）**：可转换公司债券负债/权益成分的分拆（《企业会计准则第 37 号——金融工具列报》）决定了稀释每股收益分子中\"只能调整负债部分利息\"；\"与普通股股东一起参加剩余利润分配的其他权益工具\"的界定也来自金融工具列报准则。\n- **与第十七章（收入、费用和利润）、第二十四章（会计政策、会计估计及其变更和差错更正）**：终止经营的划分影响稀释性判断口径；以前年度损益的追溯调整或追溯重述，应当**重新计算各列报期间的每股收益**。\n- **与第十六章（所有者权益）**：股票股利、公积金转增资本、拆股并股\"不影响所有者权益金额\"这一结论，与所有者权益章中\"未分配利润转增股本、资本公积转增股本只是内部结构调整\"完全一致，可与\"其他权益工具\"的股利分配对照记忆。\n- **与第二十五章（资产负债表日后事项）**：资产负债表日至财务报告批准报出日之间发行在外普通股或潜在普通股发生重大变化的，属附注披露事项。\n",
    "29": "# 第二十九章 公允价值计量\n\n> 本题库考察频次：1 题 ｜ 优先级：C ｜ 建议投入：通读一遍，把「脱手价＋三个层次输入值＋主要市场/最有利市场」三块背成条件反射\n\n**说明**：本章在本题库中直接对应的只有 **2015-15**（第五章投资性房地产采用公允价值模式计量、确认公允价值变动收益，教材定位写「第五章」），但**本章是第十三章金融工具、第五章投资性房地产、第二十六章企业合并、第二十七章合并报表中\"公允价值\"三个字的总解释器**——凡题目出现\"公允价值\"，其计量口径均回指本章。因此本章属于\"题少但不可跳过\"的章节。\n\n**教材结构（OCR 可确认）**：第一节 公允价值概述（一、公允价值的定义；二、公允价值计量的基本要求）；第二节 公允价值计量要求（一、公允价值初始计量；二、估值技术；三、输入值；四、公允价值层次；一、非金融资产的公允价值计量；二、负债和企业自身权益工具的公允价值计量）。第三节「公允价值计量的具体应用」**仅在目录中可见，正文 OCR 缺失**（源文件在第二节末尾即结束）。\n\n---\n\n## 考点清单\n### 公允价值的定义与适用范围\n- **优先级**：★★★\n- **内容**：**公允价值，是指市场参与者在计量日发生的有序交易中，出售一项资产所能收到或者转移一项负债所需支付的价格**。它是**脱手价格**——不是买入价（进入价格），也不是特定主体的价值。\n- **内容（适用范围）**：教材列举涉及公允价值计量的资产或负债包括——以公允价值进行后续计量的**投资性房地产**（《企业会计准则第 3 号》）、以公允价值进行后续计量的**生物资产**（第 5 号）、使用公允价值确定**可收回金额**的资产（第 8 号）、以公允价值计量的**企业年金基金投资**（第 10 号）、以非货币性资产形式取得的**政府补助**（第 16 号）、非同一控制下企业合并中取得的**可辨认资产和负债以及作为合并对价发行的权益工具**（第 20 号）、以公允价值计量且其变动计入当期损益或计入其他综合收益的**金融资产和金融负债**（第 22 号）等。\n- **内容（不遵循本准则的\"类似但不同\"计量属性）**：存货的**可变现净值**（第 1 号）、资产减值中的**预计未来现金流量现值**（第 8 号）等计量属性，**与公允价值类似但并不遵循**《企业会计准则第 39 号——公允价值计量》；**股份支付**（第 11 号）和**租赁**（第 21 号）业务相关的计量**也不遵循**公允价值计量的有关规定。\n- **易错**：①**脱手价 vs 进入价格**——取得资产时支付的价格是\"进入价格\"，公允价值是\"脱手价格\"，两者在初始计量时**可能不等**；②**\"有序交易\"是定义的必要组成部分**，不是有序交易的（被迫交易、清算）市场价格不能作为公允价值；③**可变现净值、预计未来现金流量现值、股份支付/租赁中的公允价值都不适用第 39 号准则**，这是最爱考的\"排除清单\"。\n- **考察**：2015-15（第五章投资性房地产公允价值模式的应用实例，教材定位：第五章）\n\n### 公允价值计量的四个基本要求\n- **优先级**：★★★\n- **内容**：为了更好地理解公允价值的定义，应当从**四个方面**掌握公允价值计量的基本要求：①以公允价值计量的**相关资产或负债**；②应用于相关资产或负债公允价值计量的**有序交易**；③有序交易发生的**主要市场或最有利市场**；④主要市场或最有利市场中的**市场参与者**。\n- **内容（1）相关资产或负债的\"特征\"**：相关资产或负债的特征，是指**市场参与者在计量日对该资产或负债进行定价时考虑的特征**，包括**资产状况及所在位置、对资产出售或者使用的限制**等。如果市场参与者在计量时会考虑这些特征，企业计量时也应当考虑。\n  - **资产状况和所在位置**：地理位置和环境、使用功能、结构、新旧程度、可使用状况等——需据此对类似资产和可观察市场价格或其他交易信息进行调整。\n  - **对资产出售或使用的限制——关键区分**：应当区分该限制是**针对资产持有者的**还是**针对资产本身的**。判断方法：**假定在特殊情况下将该资产转让给另一方时，该限制是否会\"传递\"至转入方**——会传递 → 针对**资产本身**（任何持有者都受影响，**应当考虑**该限制）；不会传递 → 针对**资产持有者**（只影响当前持有者，**不予考虑**）。\n    - 例：甲上市公司的**限售股**（指定期间内无法在公开市场出售）——限制传递，针对资产本身，应当**从公开市场报价中扣除**市场参与者因承担流动性受限风险而要求补偿的金额。\n    - 例：甲公司以**土地使用权作抵押**、承诺偿还借款前不转让——该承诺针对**持有者**，不会转移给其他市场参与者，确定该土地使用权公允价值时**不予考虑**。\n- **内容（2）有序交易**：有序交易是指在**计量日前一段时期内**相关资产或负债**已经存在市场活动**、且该市场活动**是惯常的**交易。**不属于有序交易**的情形（教材列举）：\n  - ①在当前市场情况下，市场在计量日之前一段时间内**不存在**相关资产或负债的**惯常市场交易活动**；\n  - ②在计量日之前，虽存在惯常的市场交易，但资产出售方或负债转移方**仅与单一的市场参与者**进行交易；\n  - ③资产出售方或负债转移方**处于或者接近于破产或托管状态**（已陷入财务困境）；\n  - ④资产出售方为满足法律或者监管规定而**被要求出售**资产（**被迫出售**）；\n  - ⑤与相同或类似资产或负债近期发生的其他交易相比，出售资产或转移负债的价格是一个**异常值**。\n  - **有序交易价格的应用**：判定是有序交易的，**应当以交易价格为基础**确定公允价值；赋予交易价格的权重应当考虑**交易量、交易的可比性、交易日与计量日的临近程度**等因素。判定**不是**有序交易的，**不应考虑**该交易的价格，或应**赋予该交易价格较低权重**。依据现有信息**不足以判定**是否为有序交易的，**应当考虑该交易的价格，但不应将其作为计量公允价值的唯一依据或者主要依据**，相对于其他已知的有序交易价格应当**赋予该交易较低权重**。\n- **内容（3）主要市场或最有利市场**（详见下一条考点）。\n- **内容（4）市场参与者**：市场参与者是指在相关资产或负债的主要市场（或在不存在主要市场情况下的最有利市场）中，**相互独立的、熟悉资产或负债情况的、能够且愿意进行资产或负债交易的买方和卖方**。三个特征：\n  - **相互独立，不存在关联方关系**（但如果有证据表明关联方之间的交易是按**市场条款**达成的，该交易可以作为市场参与者之间的交易，其交易价格可作为公允价值计量的基础）；\n  - **熟悉情况**（根据可获得的信息，包括通过正常的尽职调查获取的信息）；\n  - **有能力并自愿**进行相关资产或负债的交易，而非被迫或以其他强制方式进行交易。\n  - **市场参与者的确定**至少应当考虑：①所计量的相关资产或负债（金融资产与非金融资产的市场参与者差别较大）；②该资产或负债的主要市场（或最有利市场）；③企业将在主要市场或最有利市场进行交易的市场参与者。\n  - **核心立场**：企业应当从**市场参与者角度**计量公允价值，**而不应考虑企业自身持有资产、清偿或者以其他方式履行负债的意图和能力**。例：甲公司取得竞争对手乙公司 100% 股权后决定不再使用乙公司商标，仍应当基于将该商标**出售给其他市场参与者**的价格计量，**不能**因自愿放弃使用而将其公允价值确定为零。\n- **易错**：①**\"针对资产本身的限制要考虑，针对持有者的限制不考虑\"**——用\"限制是否会传递至转入方\"判断；②**有序交易的五种\"不是\"情形**要能默写；③**关联方交易未必不能作为公允价值基础**（能证明按市场条款达成就可用）；④**不能因为自身\"打算不使用/不履约\"就调低公允价值**（要从市场参与者角度）。\n- **考察**：—\n\n### 主要市场与最有利市场、交易费用与运输费用\n- **优先级**：★★★\n- **内容**：企业以公允价值计量相关资产或负债，应当**假定出售资产或者转移负债的有序交易在该资产或负债的主要市场进行**；**不存在主要市场的**，应当假定该交易在相关资产或负债的**最有利市场**进行。\n  - **主要市场**＝相关资产或负债**交易量最大和交易活跃程度最高的市场**。\n  - **最有利市场**＝在**考虑交易费用和运输费用后**，能够以**最高金额出售相关资产**或者以**最低金额转移相关负债**的市场。\n- **内容（识别顺序）**：企业根据可合理取得的信息，**能够在交易日确定**相关资产或负债**交易量最大和交易活跃程度最高的市场**的，应当将该市场作为主要市场；**无法在交易日确定**的，应当在**考虑交易费用和运输费用后**，将能够以最高金额出售该资产或以最低金额转移该负债的市场作为**最有利市场**。识别时应当考虑**所有可以合理取得的信息**，但同时应当考虑**成本效益原则**，不应花费大量成本去考察所有可能的市场。**通常情况下，如果不存在相反的证据，企业正常进行资产出售或者负债转移的市场可以视为主要市场或最有利市场。**\n- **内容（可进入性与\"企业自身角度\"）**：主要市场（或最有利市场）应当是**企业可进入的市场**，但**不要求企业于计量日在该市场上实际出售资产或者转移负债**。企业应当**从自身角度，而非市场参与者角度**，判定主要市场（或最有利市场）——不同企业可以进入不同的市场，对相同资产或负债，不同企业可能有不同的主要市场（例：只能进入利率互换零售市场的企业与能进入做市商市场的银行，主要市场不同）。\n- **内容（交易费用与运输费用的处理）**：\n  - **交易费用**＝企业发生的**可直接归属于资产出售或者负债转移的不可避免的费用**，直接由交易引起且是进行交易所必需的。**交易费用不计入公允价值**——因为交易费用不是相关资产或负债的特征，而是交易本身的特征。\n  - **运输费用计入公允价值**——运输费用是使资产到达其\"所在位置\"这一特征的组成部分。\n  - **应用规则**：企业应当以**主要市场**上相关资产或负债的价格为基础计量公允价值；**即使企业能够于计量日在主要市场以外的另一个市场获得更高的出售价格或更低的转移价格，仍应当以主要市场上相关资产或负债的价格为基础**计量。不存在或无法确定主要市场的，以**最有利市场**的价格为基础计量，此时确定最有利市场应当**考虑交易费用、运输费用等**。\n- **计算/分录（教材示例的算法结构）**：\n  ```\n  【示例1】委托证券公司买入交易性金融资产，每股 10 元、共支付 1 002 万元（含手续费 2 万元）\n    → 初始计量时每股公允价值为 10 元，而不是 10.02 元（手续费＝交易费用，不计入公允价值）\n\n  【示例2】非同一控制下企业合并取得 500 吨原材料\n    A 市场：交易量 3 000 万吨、价格 26 万元/万吨、相关税费 1 500 万元、运输成本 100 万元\n    B 市场：交易量   50 万吨、价格 28 万元/万吨、相关税费 1 600 万元、运输成本 200 万元\n    第 1 步：交易量最大、活跃程度最高 → 判定 A 市场为主要市场（不选价格更高的 B 市场）\n    第 2 步：公允价值 = 13 000 万元（500 吨 × 26 万元/万吨）− 运输成本 100 万元 = 12 900 万元\n    注意：1 500 万元相关税费属交易费用，不扣减\n  ```\n- **易错**：①**\"交易费用不计、运输费用计\"**是本考点的命门；②**即使别处价格更优，也必须用主要市场的价格**；③主要市场由**交易量最大＋交易活跃程度最高**确定，**不是**价格最高；④主要市场是**从企业自身角度**判定，而非市场参与者角度（这一点与\"公允价值计量要从市场参与者角度\"形成对照，容易张冠李戴）；⑤不要求企业在计量日实际在该市场交易。\n- **考察**：—\n\n### 公允价值的初始计量与\"首日差额\"\n- **优先级**：★★\n- **内容**：企业应当根据**交易性质**和**相关资产或负债的特征**等，判断初始确认时的公允价值是否与其**交易价格**相等。取得资产或承担负债的交易中，**交易价格是取得该资产所支付或者承担该负债所收到的价格，即进入价格**；而相关资产或负债的公允价值是**脱手价格**。相关资产或负债在初始确认时的公允价值通常与其交易价格相等（**除非**下列情况之一）：\n  1. **关联方之间的交易**（但有证据表明关联方之间的交易按市场条款进行的，该交易价格可作为确定公允价值的基础）；\n  2. **被迫进行的交易**，或者资产出售方（负债转移方）在交易中**被迫接受价格**的交易（如为满足监管或法律要求被迫出售、或正陷入财务困境）；\n  3. **交易价格所代表的计量单元**不同于以公允价值计量的相关资产或负债的计量单元（如企业合并中，以公允价值计量的相关资产或负债仅是交易中的一部分，交易还包括应单独计量但未确认的无形资产）；\n  4. **进行交易的市场不是**该资产或负债的主要市场（或不存在主要市场情况下的最有利市场）（如做市商在交易所市场与客户交易的价格不同于银行间债券市场的价格，应以银行间债券市场为主）。\n- **内容（差额的处理）**：企业以公允价值对相关资产或负债进行初始计量，**交易价格与公允价值不相等的**，其差额应当按照会计准则的要求进行处理；**如果会计准则对此未作出明确规定，企业应当将该差额计入当期损益**。\n- **易错**：①**\"首日差额计入当期损益\"只适用于准则未作明确规定的情形**，准则有专门规定的从其规定（如金融工具的首日损益规定）；②四种例外情形要能默写；③\"交易价格＝公允价值\"是**通常**情况，不是永远成立。\n- **考察**：—\n\n### 估值技术（市场法、收益法、成本法）\n- **优先级**：★★\n- **内容**：估值技术**通常包括市场法、收益法和成本法**，企业应当根据实际情况从这三种方法中选择一种或多种，用于估计相关资产或负债的公允价值。**相关资产或负债存在活跃市场公开报价的，企业应当优先使用该报价确定其公允价值**；除此之外，企业选择三种估值方法中的哪种或哪几种**并不存在优先顺序**。企业在应用估值技术时，应当根据可观察的市场信息**定期校准估值模型**，以确保模型能够反映当前市场状况并识别模型本身可能存在的潜在缺陷。如果估值技术**未能考虑市场参与者在对相关资产或负债估值时所考虑的所有因素**，则通过该技术获得的金额**不能作为对计量日当前交易价格的估计**。\n- **三类方法对比**：\n\n| 估值技术 | 核心思路 | 具体方法/要点 |\n|---|---|---|\n| **市场法** | 利用**相同或类似的**资产、负债或资产和负债组合的**价格**以及其他相关市场交易信息进行估值 | 常用**市场乘数**（如市价/账面价值乘数、EV/EBITDA 乘数）；应当进行职业判断，考虑定性和定量因素，选择恰当的市场乘数；选定可比公司后需对**关键指标差异**（不同市场估值水平、增长性、盈利能力、股本回报率、流动性差异等）进行调整 |\n| **收益法** | 将**未来金额转换成单一现值**的估值技术；应当反映市场参与者在计量日对未来现金流量或收入费用等金额的**预期** | 包括**现金流量折现法**（最常用）、**多期超额收益折现法**、**期权定价模型**等 |\n| **成本法** | 反映当前要求**重置相关资产服务能力**所需金额的估值技术，**通常是指现行重置成本** | 应当根据**折旧贬值**情况对市场参与者获得或构建具有相同服务能力的替代资产的成本进行调整；折旧贬值包括**实体性损耗、功能性贬值、经济性贬值**；主要使用现行重置成本法估计与其他资产一起使用的**有形资产**的公允价值 |\n\n- **内容（现金流量折现法的两种子方法）**：\n  - **传统法（折现率调整法）**：使用在估计金额范围内的**最有可能的现金流量**和**经风险调整的折现率**；\n  - **期望现金流量法**：使用**经风险调整的期望现金流量和无风险利率**，或者使用**未经风险调整的期望现金流量和包含市场参与者要求的风险溢价的折现率**；应当通过以**概率为权重**计算的期望现金流量反映未来所有可能的现金流量。\n    - 期望现金流量法中调整风险溢价的两种方法：①从期望现金流量中扣除风险溢价得到**确定等值现金流量**，再按**无风险利率**折现；②在**无风险利率之上增加风险溢价**得到**期望回报率**，再用其对概率加权现金流量折现。\n  - **折现率与现金流量输入值必须协调**（避免重复计算或遗漏风险因素）：\n    | 现金流量口径 | 应采用的折现率 |\n    |---|---|\n    | 合同现金流量 | 能够反映**预期违约风险**的折现率 |\n    | 概率加权现金流量 | **无风险利率** |\n    | 包含通货膨胀影响的现金流量 | **名义利率** |\n    | 排除通货膨胀影响的现金流量 | **实际利率** |\n    | 税后现金流量 | **税后折现率** |\n    | 税前现金流量 | **税前折现率** |\n    | 人民币现金流量 | 与**人民币**相关的利率 |\n- **内容（期权定价模型）**：可使用**布莱克—斯科尔斯模型、二叉树模型、蒙特卡洛模拟法**等估计期权的公允价值。**布莱克—斯科尔斯模型**可用于**认股权证**和**具有转换特征的金融工具**的简单估值，其输入值包括**即期价格、行权价格、合同期限、预计或内含波动率、无风险利率、期望股息率**等。**蒙特卡洛模拟法**适用于包含**可变行权价格或转换价格、对行权时间具有限制条款**等复杂属性的认股权证或具有转换特征的金融工具。\n- **内容（估值技术的选择因素）**：至少应当考虑：①根据可获得的市场数据和其他信息，**其中一种估值技术是否比其他估值技术更恰当**；②其中一种估值技术所使用的**输入值是否更容易在市场上观察到或者只需作更少的调整**；③其中一种估值技术得到的**估值结果区间是否在其他估值技术的估值结果区间内**；④**市场法和收益法结果存在较大差异的**，应当进一步分析存在较大差异的原因（可能其中一种估值技术使用不当，或其输入值不恰当）。企业在**公允价值后续计量中使用了估值技术并且运用了不可观察输入值**的，应当确保该估值技术**反映了计量日可观察的市场数据**（如类似资产或负债的最近交易价格等）。\n- **易错**：①**有活跃市场公开报价的必须优先使用报价**，三法之间**无优先顺序**；②**成本法＝现行重置成本**，且要扣减**实体性损耗、功能性贬值、经济性贬值**三类贬值；③**折现率与现金流量的口径必须匹配**（税后配税后、名义配含通胀、实际配不含通胀）；④估值技术在后续计量中使用不可观察输入值时，必须确保其反映了计量日可观察的市场数据。\n- **考察**：—\n\n### 输入值与公允价值层次（三个层次）\n- **优先级**：★★★\n- **内容（输入值）**：市场参与者所使用的**假设**即为输入值，可分为**可观察输入值**和**不可观察输入值**。企业使用估值技术时，**应当优先使用可观察输入值，仅当相关可观察输入值无法取得或取得不切实可行时才使用不可观察输入值**。企业通常可以从**交易所市场、做市商市场、经纪人市场、直接交易市场**获得可观察输入值。\n- **内容（与计量单元有关的溢价和折价）**：如果企业能够获得相同或类似资产或负债在活跃市场中的报价且市场参与者会考虑与特征相关的溢价或折价，企业应当根据这些溢价或折价（**控制权溢价、少数股东权益折价、流动性折价**等）对相同或类似资产或负债的市场交易价格进行**调整**。企业**不应考虑与计量单元不一致的溢价或折价**，如反映企业**持有规模**特征的\"**大宗持有因素**\"的溢价或折价。\n- **内容（以出价和要价为基础的输入值）**：当相关资产或负债**存在出价和要价**时，企业应当以**在出价和要价之间最能代表当前情况下公允价值的价格**确定其公允价值。**出价**是经纪人或做市商**购买**一项资产或**处置**一项负债所愿意支付的价格；**要价**是经纪人或做市商**出售**一项资产或**承担**一项负债所愿意收取的价格。企业**可使用出价计量资产头寸、使用要价计量负债头寸**，也可使用市场参与者在实务中使用的**在出价和要价之间的中间价**或其他定价惯例。**无论如何，企业不应使用与公允价值计量假定不一致的方法，例如对资产使用要价、对负债使用出价。**\n- **内容（公允价值层次）**：为提高公允价值计量和相关披露的一致性和可比性，企业应当将估值技术所使用的输入值**划分为三个层次**，并**首先使用第一层次输入值，其次使用第二层次，最后使用第三层次**。\n\n| 层次 | 定义 | 主要内容 | 调整要求 |\n|---|---|---|---|\n| **第一层次** | 企业在**计量日**能够取得的**相同**资产或负债在**活跃市场上未经调整的报价** | 活跃市场＝相关资产或负债**交易量及交易频率足以持续提供定价信息**的市场（交易对象具有同质性，可随时找到自愿交易的买方和卖方，市场价格信息公开） | **通常不应进行调整**（三种例外见下） |\n| **第二层次** | 除第一层次输入值外，相关资产或负债**直接或间接可观察**的输入值 | ①**活跃市场中类似**资产或负债的报价；②**非活跃市场中相同或类似**资产或负债的报价；③除报价以外的其他可观察输入值（包括在正常报价间隔期间可观察的**利率和收益率曲线**等）；④**市场验证的输入值**（通过相关性分析或其他手段，主要来源于可观察市场数据的输入值或经过可观察市场数据验证的输入值） | 应当根据相关资产或负债的**特征**进行调整 |\n| **第三层次** | 相关资产或负债的**不可观察输入值** | 包括不能直接观察和无法由可观察市场数据验证的**利率、股票波动率、企业合并中承担的弃置义务的未来现金流量、企业使用自身数据作出的财务预测**等 | 只能在相关资产或负债**几乎很少存在市场交易活动**、导致相关可观察输入值无法取得或取得不切实可行时使用 |\n\n- **内容（第一层次\"通常不调整\"的三种例外）**：\n  1. 企业持有**大量类似但不相同**的以公允价值计量的资产或负债，这些资产或负债存在活跃市场报价，但**难以获得每项资产或负债在计量日单独的定价信息**——可使用不完全依赖于单个报价的其他定价方法，但**由此取得的公允价值计量结果应当划入第二或第三层次**；\n  2. 因发生**影响公允价值计量的重大事件**等导致活跃市场的报价**不代表计量日的公允价值**（如在证券市场闭市之后但在计量日之前发生的买卖双方直接交易、经纪人交易或公告等重大事项）——企业应当制定相应会计政策并一致应用以识别这类事项；\n  3. 不存在相同或类似负债或企业自身权益工具报价、但**其他方将其作为资产持有**、企业以该资产的公允价值为基础确定该负债或自身权益工具公允价值的，**如果无须对资产报价进行调整**，则公允价值计量结果为**第一层次**；**否则应当划入第二或第三层次**。\n- **内容（第二层次与第三层次的边界）**：企业使用**重要的不可观察输入值对第二层次输入值进行调整**，且**该调整对公允价值计量整体而言是重大的**，那么公允价值计量结果应当**划分为第三层次**。\n- **内容（活跃市场中持有数量的口径）**：在活跃市场中，企业应当以**单项资产或负债的市场报价即第一层次输入值与企业持有数量的乘积**确定其持有的金融资产或金融负债的公允价值。**即使在市场正常日交易量不足以吸收企业的持有量**以致在市场交易中出售该金融资产或转移该金融负债可能影响市场报价的情况下，**企业也应如此**（即不得因此采用\"大宗持有因素\"折价）。\n- **内容（活跃市场的判断）**：当**交易量和交易活动显著下降**、可获得的**价格因时间或市场参与者的不同存在显著差异**、可获得的**价格并非当前的价格**时，当前市场**可能不是活跃市场**。异常的市场报价（如债券交易中出现的**频繁对敲交易**形成的市场价格）**不应作为第一层次输入值**。\n- **易错**：①**层次划分的依据是\"输入值\"的层级，不是\"估值技术\"的层级**——用市场法也可能落到第三层次；②**第一层次要求\"相同\"资产/负债且\"未经调整\"**，只要调整了（哪怕是因流动性受限）就下移层次；③**\"类似\"资产的报价属第二层次**，不要错判为第一层次；④**出价/要价方向不能反**（资产用出价、负债用要价）；⑤**\"大宗持有因素\"不得考虑**——即使持有量超过市场日交易量，仍按报价×持有数量计算。\n- **考察**：—\n\n### 非金融资产的公允价值计量（最佳用途与估值前提）\n- **优先级**：★★\n- **内容**：企业以公允价值计量**非金融资产**，应当考虑市场参与者通过**直接将该资产用于最佳用途**产生经济利益的能力，或者通过**将该资产出售给能够用于最佳用途的其他市场参与者**产生经济利益的能力。**最佳用途**是指市场参与者实现一项非金融资产或其所属的一组资产和负债的**价值最大化**时该非金融资产的用途（评估行业称\"最高最佳使用\"）。企业判定非金融资产的**最佳用途**，应当考虑该用途是否为**法律上允许、实物上可能以及财务上可行**的使用方式。\n- **内容（估值前提）**：企业以公允价值计量非金融资产，应当在**最佳用途**的基础上确定该非金融资产的**估值前提**，即**单独使用**该非金融资产还是将其**与其他资产或负债组合使用**。\n  - 通过**单独使用**实现最佳用途的，公允价值应当是**将该资产出售给同样单独使用该资产的市场参与者的当前交易价格**；\n  - 通过**与其他资产或负债组合使用**实现最佳用途的，公允价值应当是**将该资产出售给以同样组合方式使用资产的市场参与者的当前交易价格**，并且**假定市场参与者可以取得组合中的其他资产或负债**。其中负债包括企业**为筹集营运资金**产生的负债，**但不包括企业为组合之外的资产筹集资金所产生的负债**。最佳用途假定应当**一致地应用于组合中所有相关资产**。\n  - 对于非金融资产，**即使已知该资产通过组合使用能够实现最佳用途，但该资产的计量单元是单项资产**，企业在以公允价值计量时仍应当**假设该资产按照与计量单元相一致的方式出售**，并**假定市场参与者已取得了使该资产正常运作的组合中的其他资产和负债**。\n- **考试示例的算法结构（教材示例）**：\n  ```\n  【最佳用途变更的计量】工业用地 → 区域规划调整后可变更为住宅用地\n    继续用于工业用途的价值：600 万元\n    用于建造住宅的价值：1 000 万元，需发生拆除厂房成本及其他成本 250 万元\n    → 土地使用权的公允价值 = 1 000 − 250 = 750 万元（按最佳用途计量）\n\n  【组合使用但计量单元为单项资产】企业合并中取得的流水线专用精密设备\n    → 假定市场参与者能够取得使该设备正常运转的其他组合资产；\n      按计量单元将组合的估值分配至各项资产，以确定该设备的公允价值\n  ```\n- **易错**：①判最佳用途要同时过**法律上允许、实物上可能、财务上可行**三道关；②**\"最佳用途\"要求扣除为实现该用途必须发生的成本**（如拆除厂房成本）；③**计量单元是单项资产时仍假设市场参与者能取得组合中的其他资产和负债**，不要因为\"单独卖不出去\"就否定了计量前提；④组合使用前提下的负债**只包括为筹集营运资金产生的负债**。\n- **考察**：—\n\n### 负债和企业自身权益工具的公允价值计量\n- **优先级**：★★\n- **内容（基本假定）**：企业以公允价值计量**负债**，应当假定**在计量日将该负债转移给市场参与者，而且该负债在转移后继续存在**，由作为受让方的市场参与者履行相关义务；企业以公允价值计量**自身权益工具**，应当假定**在计量日将该自身权益工具转移给市场参与者，而且该自身权益工具在转移后继续存在**，并由受让方取得与该工具相关的权利、承担相应的义务。任何情况下都应当**优先使用相关的可观察输入值**，只有在可观察输入值无法取得或取得不切实可行时才可以使用不可观察输入值。\n- **内容（确定方法）**：\n  1. **具有可观察市场报价的相同或类似负债或自身权益工具**：应当以该**报价**为基础确定公允价值；\n  2. **无法获得转移报价时**：应当确定该负债或自身权益工具**是否被其他方作为资产持有**——\n     - **被其他方作为资产持有的**：企业应当在计量日**从持有对应资产的市场参与者角度，以对应资产的公允价值为基础**确定该负债或自身权益工具的公允价值；\n     - **没有被其他方作为资产持有的**：企业应当在计量日**从承担负债或者发行权益工具的市场参与者角度，采用估值技术**确定其公允价值。\n  3. **被其他方作为资产持有、但不存在相同或类似报价**的：①如果**对应资产存在活跃市场的报价**且企业能够获得，应当**以对应资产的报价为基础**确定；②如果对应资产**不存在活跃市场报价**，或企业无法获得该报价，可使用其他估值技术。\n- **内容（不履约风险）**：企业以公允价值计量相关负债，**应当考虑不履约风险，并假定不履约风险在负债转移前后保持不变**。**不履约风险是指企业不履行义务的风险，包括但不限于企业自身信用风险**。企业以公允价值计量相关负债时，应当考虑其**信用状况**的影响，以及其他可能影响负债履行的因素（如该负债是否是一项具有偿付现金义务的**金融负债**，或是一项具有提供商品或服务义务的**非金融负债**，或存在与该负债相关的**信用增级条款**）。\n  - 企业应当基于该负债的**计量单元**考虑不履约风险对负债公允价值的影响。**负债附有不可分割的第三方信用增级**（如第三方的债务担保），**并且该信用增级与负债是分别进行会计处理的**，企业估计该负债公允价值时**不应考虑该信用增级的影响**，**而仅应当考虑企业自身的信用状况**。\n- **内容（负债或自身权益工具转移受限）**：企业以公允价值计量负债或自身权益工具，并且该负债或自身权益工具**存在限制转移因素**的——如果企业在公允价值计量的**输入值中已经考虑了这些因素**，则**不应再单独设置相关输入值，也不应对其他输入值进行相关调整**；如果转移限制**未反映**在交易价格或用于公允价值计量的其他输入值中，企业**应当对输入值进行调整，以反映该限制**。\n- **内容（具有可随时要求偿还特征的金融负债）**：具有**可随时要求偿还**特征的金融负债的公允价值，**不应低于**债权人要求偿还时的**应付金额**，即从可要求偿还第一天起折现的现值。\n- **内容（金融资产和金融负债组合计量——以净敞口为基础，三个条件必须同时满足）**：\n  1. 企业在**风险管理或投资策略的正式书面文件中已载明**，以**特定市场风险或特定对手信用风险的净敞口**为基础，管理金融资产和金融负债的组合，并且**应当提供证据证明其一致地基于该净敞口管理金融工具**；\n  2. 企业**以特定市场风险或特定对手信用风险的净敞口为基础，向企业关键管理人员报告**金融资产和金融负债组合的信息；\n  3. 企业在**每个资产负债表日持续以公允价值计量**组合中的金融资产和金融负债。\n  - **市场风险敞口**：基于特定市场风险的净敞口管理的，金融资产和金融负债应当具有**实质上相同的特定市场风险敞口和特定市场风险的期限**，企业应当使用**出价和要价价差内最能代表当前市场环境下公允价值的价格**作为公允价值。**因期限不同而导致在一段时期市场风险未被抵销的**，应当**分别计量**市场风险被抵销时期的**市场风险净敞口**，以及市场风险未被抵销时期的**市场风险总敞口**（示例：用 12 个月期货合约对应 5 年期金融工具中与 12 个月利率风险敞口相关的现金流量，则对组合以**净额**为基础计量 12 个月利率风险敞口的公允价值，以**总额**为基础计量剩余利率风险敞口即第 2 年至第 5 年的公允价值）。\n  - **信用风险敞口**：如果企业已与交易对手达成在出现违约情况下将考虑所有能够缓释信用风险敞口的安排（如**总互抵协议**，或要求**基于各方对另一方信用风险的净敞口交换担保品**的协议），则应在公允价值计量中考虑**交易对手信用风险的净敞口**或该**交易对手对企业信用风险的净敞口**；应当反映市场参与者对这些安排在出现违约情况下**能否依法强制执行**的预期。企业为管理一个或多个特定市场风险净敞口进行组合管理的金融资产和金融负债，**可以不同于**企业为管理其特定交易对手信用风险净敞口而进行组合管理的金融资产和金融负债（因为企业所有合同不可能均与相同的交易对手订立）。\n- **易错**：①**不履约风险＝企业不履行义务的风险，包括但不限于自身信用风险**——\"包括但不限于\"是必须写全的表述，且**假定不履约风险在负债转移前后保持不变**；②**可分离的第三方担保要单独处理**：若信用增级与负债**分别进行会计处理**，则估计负债公允价值时**不考虑该增级**，只看企业**自身**信用状况；③净敞口组合计量的**三个条件必须\"同时满足\"**，缺一不可；④期限不一致时**要拆成净敞口期与总敞口期分别计量**；⑤具有**可随时要求偿还**特征的金融负债公允价值**不应低于**应付金额的现值（下限约束）。\n- **考察**：—\n\n---\n\n## 本章易错陷阱汇总\n\n1. **脱手价 vs 进入价格**：公允价值是出售资产所能收到或转移负债所需支付的价格（脱手价）；交易中支付/收到的价格（进入价格）通常相等但可能不等，差额按准则处理、准则未规定的计入当期损益。\n2. **适用范围排除清单**：存货可变现净值、资产减值中的预计未来现金流量现值**与公允价值类似但不遵循**第 39 号准则；**股份支付、租赁**相关计量也不遵循。\n3. **不属于有序交易的五种情形**：无惯常市场交易活动、仅与单一市场参与者交易、处于或接近破产/托管、被迫出售、价格是异常值。\n4. **限制的归属判断**：限制会\"传递\"至转入方 → 针对**资产本身**（**要考虑**）；不会传递 → 针对**持有者**（**不考虑**）。典型：限售股（考虑）、抵押承诺（不考虑）。\n5. **主要市场 ≠ 价格最高的市场**：主要市场由**交易量最大＋交易活跃程度最高**决定；即使别处价格更优，也**必须用主要市场的价格**。主要市场**从企业自身角度**判定。\n6. **交易费用不计入公允价值，运输费用计入**——这是最高频的一个选择题陷阱。\n7. **估值技术三法无优先顺序**，但**存在活跃市场公开报价时必须优先使用该报价**。\n8. **折现率与现金流量口径必须匹配**：合同现金流配含预期违约风险的折现率、概率加权现金流配无风险利率、含通胀配名义利率、不含通胀配实际利率、税后配税后、税前配税前、人民币配人民币利率。\n9. **成本法＝现行重置成本**，要扣减实体性损耗、功能性贬值、经济性贬值三类贬值。\n10. **公允价值层次看的是\"输入值\"**：第一层次＝**相同**资产/负债在**活跃市场未经调整**的报价；第二层次＝**类似**资产/负债报价或可观察的其他输入值；第三层次＝不可观察输入值。**只要对第一层次报价作了调整（流动性受限等），层次就要下移**。\n11. **出价/要价方向**：资产头寸用**出价**，负债头寸用**要价**；**不得**对资产用要价、对负债用出价。\n12. **\"大宗持有因素\"不得考虑**：即使持有量超过市场正常日交易量，仍按**市场报价 × 持有数量**计量。\n13. **判定为第二层次还是第三层次**：使用**重要的不可观察输入值调整**第二层次输入值，且该调整**对整体而言重大**的 → 划入**第三层次**。\n14. **非金融资产的最佳用途三条件**（法律上允许、实物上可能、财务上可行）与**估值前提**（单独使用 / 组合使用）；组合使用时要**假定市场参与者能取得组合中的其他资产和负债**，但负债**只含为筹集营运资金产生的负债**。\n15. **不履约风险的\"包括但不限于\"**与**转移前后保持不变**的假定；**可分离的第三方信用增级不予考虑**。\n16. **净敞口组合计量的三个条件必须同时满足**：正式书面文件载明＋向关键管理人员报告＋每个资产负债表日持续以公允价值计量。\n\n## 本章分录模板\n\n本章为计量规则章，**不涉及自身分录**。与本章直接相关的分录出现在应用章（第三、五、十三、二十、二十二、二十六章等），典型结构：\n\n```\n【以公允价值模式计量的投资性房地产·期末公允价值变动】（对应 2015-15，教材定位：第五章）\n借：投资性房地产——公允价值变动\n    贷：公允价值变动损益\n（公允价值下跌作相反分录；采用公允价值模式计量的投资性房地产不计提折旧或摊销）\n\n【以公允价值计量且其变动计入当期损益的金融资产·期末计价】\n借：交易性金融资产——公允价值变动\n    贷：公允价值变动损益\n（注意：初始计量时的手续费等交易费用计入当期损益，不构成公允价值）\n\n【非同一控制下企业合并中取得的可辨认资产、负债·按公允价值计量】（第二十六章）\n借：有关资产（按购买日公允价值）\n    商誉（差额）\n    贷：有关负债（按购买日公允价值）\n        银行存款 / 股本、资本公积等（合并对价）\n```\n\n## 与其他章的联动\n\n- **与第十三章（金融工具）**：以公允价值计量且其变动计入当期损益/其他综合收益的金融资产和金融负债，其\"公允价值\"的计量口径、出价与要价的使用、首日差额的处理全部回指本章；负债的公允价值还要叠加**不履约风险（自身信用风险）**的考虑，与金融负债的后续计量直接衔接。\n- **与第五章（投资性房地产）**：公允价值模式后续计量、公允价值变动损益的确认（**2015-15** 的教材定位在第五章）；本章为它提供\"什么是公允价值、如何取得公允价值\"的规则基础，也解释了为什么公允价值模式下**不计提折旧摊销**。\n- **与第三章（固定资产）、第四章（无形资产）**：非金融资产的**最佳用途**与**估值前提**是判断这些资产在合并、置换、减值测试中公允价值的直接依据；弃置义务的公允价值计量（期望现金流量法）与资产弃置费用的现值计量相互呼应。（生物资产的公允价值计量适用《企业会计准则第 5 号——生物资产》，教材不单列章。）\n- **与第七章（资产减值）**：使用公允价值确定**可收回金额**时适用本章；但要注意**预计未来现金流量现值不遵循本章**，两者的折现口径与风险调整方式不同。\n- **与第二十六章（企业合并）、第二十七章（合并财务报表）**：非同一控制下企业合并中取得的可辨认资产和负债按购买日公允价值计量，作为合并对价发行的权益工具也按公允价值计量（第十三章、第二十六章）；反向购买、分步取得控制权等复杂交易中的公允价值计量全部依赖本章的层次与估值技术规则。\n- **与第二十章（非货币性资产交换）、第二十一章（债务重组）**：以公允价值为基础计量换入资产、确定重组损益时，公允价值的层次与输入值选择规则直接适用。\n- **与第一章（总论）**：本章的**公允价值定义（脱手价格、有序交易、主要市场/最有利市场）**与第一章\"会计要素计量属性\"中的表述必须**一字不差地一致**；第一章给出\"一般应当采用历史成本、采用其他计量属性应保证金额能够取得并可靠计量\"的原则，本章则是该原则在公允价值上的展开。\n- **与第十章（股份支付）**：股份支付中权益工具公允价值的确定**不遵循**本章（第 39 号准则），要按《企业会计准则第 11 号——股份支付》的规定处理——这是最容易混错的一处\"跨章排除\"。\n",
    "30": "# 第三十章 政府及民间非营利组织会计\n\n> 本题库考察频次：0 题（本题库未直接考察） ｜ 优先级：C ｜ 建议投入：通读一遍，只需记住「双功能/双基础/双报告＋限定性净资产与捐赠收入的分录骨架」\n\n**说明**：本章在本题库中**未被直接考察**（题库未出现以本章为教材定位的题目），故全部「考察」字段记为 `—`。但本章是全书**唯一\"自成一套记账规则\"**的章节（政府会计是**平行记账**、民间非营利组织会计是**净资产分限定性/非限定性**），一旦命题就是\"背下来就会、记混就全错\"的送分题，因此建议按\"框架＋对照表＋两组分录\"的方式通读一遍即可。\n\n**教材结构（OCR 可确认）**：第一节 政府会计概述（一、政府会计准则；二、政府会计核算模式；三、政府会计要素；四、政府财务报告和决算报告）；第二节 政府单位特定业务的会计核算（含国库集中支付、资产业务、负债业务、部门合并财务报表等）；第三节 民间非营利组织会计（一、民间非营利组织会计概述；二、民间非营利组织特定业务的会计核算）。\n\n---\n\n## 考点清单\n### 政府会计准则制度体系、适用范围与政府会计主体\n- **优先级**：★\n- **内容（体系构成）**：政府会计准则制度体系由**《政府会计准则——基本准则》＋政府会计具体准则＋应用指南＋《政府会计制度》＋准则制度解释**等组成。\n  - **《基本准则》**（财政部令第 78 号）用于规范政府会计**目标、政府会计主体、政府会计信息质量要求、政府会计核算基础，以及政府会计要素定义、确认和计量原则、列报要求**等原则事项；统驭具体准则和制度的制定，并为政府会计实务问题提供处理原则。\n  - **政府会计具体准则**依据基本准则制定，规范政府发生的经济业务或事项的**会计处理原则**；**应用指南**是对具体准则实际应用作出的**操作性规定**。\n  - **《政府会计制度》**依据基本准则、具体准则制定，主要规定政府**会计科目的设置、应用及账务处理、报表体系及编制说明**等。按照政府会计主体不同，主要由**政府财政总会计制度**和**政府单位会计制度**组成。\n  - **政府会计准则制度解释**用于及时回应和解决准则制度执行中的问题。\n- **内容（政府会计主体）**：根据《基本准则》，政府会计主体主要包括**各级政府、各部门、各单位**。\n  - **各级政府**指各级政府**财政总会计**；\n  - **各部门、各单位**指与本级政府财政部门**直接或者间接发生预算拨款关系**的国家机关、军队、政党组织、社会团体、事业单位和其他单位。\n- **内容（不适用情形）**：**军队、已纳入企业财务管理体系的单位**和**执行《民间非营利组织会计制度》的社会团体**，其会计核算**不适用**政府会计准则制度。（另：已纳入企业财务管理体系、执行企业类会计准则制度的事业单位，属于应纳入部门合并财务报表范围的特殊主体，但不是\"适用政府会计准则制度\"的单位——这两点要分开记。）\n- **易错**：**\"适用政府会计准则制度的单位\"与\"纳入部门合并财务报表范围的单位\"不是同一个集合**；军队、纳入企业财务管理体系的单位、执行民间非营利组织会计制度的社会团体**不适用政府会计准则制度**。\n- **考察**：—\n\n### 政府会计核算模式：「双功能」「双基础」「双报告」与平行记账\n- **优先级**：★★★\n- **内容**：**政府会计由预算会计和财务会计构成**，政府会计核算应当实现**预算会计与财务会计适度分离并相互衔接**，全面、清晰反映政府财务信息和预算执行信息。\n\n| 模式 | 具体含义 | 关键词 | 记忆抓手 |\n|---|---|---|---|\n| **\"双功能\"** | 政府会计应当实现**预算会计和财务会计双重功能**。**预算会计**应准确完整反映政府**预算收入、预算支出和预算结余**等**预算执行信息**；**财务会计**应全面准确反映政府的**资产、负债、净资产、收入、费用**等**财务信息** | 两套功能、两套要素 | 预算会计管\"预算\"三要素；财务会计管\"财务\"五要素 |\n| **\"双基础\"** | **预算会计实行收付实现制**（国务院另有规定的，从其规定）；**财务会计实行权责发生制** | 收付实现制 vs 权责发生制 | 预算会计看\"钱有没有收付\"，财务会计看\"权责有没有发生\" |\n| **\"双报告\"** | 政府会计主体应当编制**决算报告**和**财务报告**。**政府决算报告**的编制主要以**收付实现制**为基础，以**预算会计核算生成的数据**为准；**政府财务报告**的编制主要以**权责发生制**为基础，以**财务会计核算生成的数据**为准 | 决算报告 vs 财务报告 | 两报告的数据来源**分别对应**两套核算 |\n\n- **内容（\"适度分离并相互衔接\"的实质）**：政府预算会计和财务会计\"适度分离\"，**并不是要求政府会计主体分别建立预算会计和财务会计两套账**、对同一笔经济业务或事项进行核算，而是要求**政府预算会计要素和财务会计要素相互协调，决算报告和财务报告相互补充**，共同反映政府会计主体的相关信息。\n- **内容（平行记账）**：**对纳入本年度部门预算管理的现金收支业务，在采用财务会计核算的同时应当及时进行预算会计核算**（即\"**平行记账**\"）；对于**不纳入部门预算管理**的业务（如应缴财政款、受托代理资产、计提折旧摊销等非现金业务），**只做财务会计核算，不做预算会计核算**。\n- **易错**：①**\"不是建两套账\"**是必考点——\"适度分离并相互衔接\"决不能被理解为两套独立账簿；②**预算会计的记账基础是收付实现制、财务会计是权责发生制**，两者不能互换；③**\"双报告\"的数据来源是一一对应的**：决算报告→预算会计数据（收付实现制基础），财务报告→财务会计数据（权责发生制基础）；④判断是否做预算会计，只看该业务**是否属于\"纳入部门预算管理的现金收支\"**。\n- **考察**：—\n\n### 政府会计要素与政府资产的计量属性\n- **优先级**：★★\n- **内容（预算会计要素三个）**：\n  - **预算收入**：政府会计主体在**预算年度内依法取得并纳入预算管理的现金流入**。**一般在实际收到时予以确认，以实际收到的金额计量**。\n  - **预算支出**：政府会计主体在**预算年度内依法发生并纳入预算管理的现金流出**。**一般在实际支付时予以确认，以实际支付的金额计量**。\n  - **预算结余**：政府会计主体**预算年度内预算收入扣除预算支出后的资金余额，以及历年滚存的资金余额**。预算结余包括**结余资金**和**结转资金**：\n    - **结余资金**＝年度预算执行终了，预算收入实际完成数扣除预算支出和结转资金后**剩余的资金**；\n    - **结转资金**＝预算安排项目的支出**年终尚未执行完毕或者因故未执行**，且**下年需要按原用途继续使用**的资金。\n- **内容（财务会计要素五个）**：**资产、负债、净资产、收入、费用**。\n  - **资产**：政府会计主体**过去的经济业务或者事项**形成的、由政府会计主体**控制**的、**预期能够产生服务潜力或者带来经济利益流入**的经济资源。**服务潜力**是指政府会计主体利用资产**提供公共产品和服务以履行政府职能**的潜在能力。确认条件：①与该经济资源相关的**服务潜力很可能实现或者经济利益很可能流入**政府会计主体；②该经济资源的**成本或者价值能够可靠地计量**。\n  - **资产的分类**：按流动性分为**流动资产和非流动资产**。流动资产包括库存现金、银行存款、其他货币资金、**零余额账户用款额度、财政应返还额度**、短期投资、应收及预付款项、存货等；非流动资产包括固定资产、在建工程、无形资产、长期投资、**公共基础设施、政府储备物资、文物资源、保障性住房**等。\n  - **资产的计量属性**：主要包括**历史成本、重置成本、现值、公允价值和名义金额**（注意：**没有\"可变现净值\"**）。政府会计主体在对资产进行计量时，**一般应当采用历史成本**；采用重置成本、现值、公允价值计量的，应当保证所确定的资产金额**能够持续、可靠计量**；**无法采用历史成本、重置成本、现值和公允价值计量属性的，采用名义金额（即人民币 1 元）计量**。\n  - **负债**：政府会计主体**过去的经济业务或者事项**形成的、**预期会导致经济资源流出**政府会计主体的**现时义务**。**现时义务**是指政府会计主体在**现行条件下已承担的义务**；**未来发生的经济业务或者事项形成的义务不属于现时义务，不应当确认为负债**。\n  - **净资产**：政府会计主体**资产扣除负债后的净额**，其金额取决于资产和负债的计量。\n  - **收入**：报告期内导致政府会计主体**净资产增加**的、**含有服务潜力或者经济利益**的经济资源的流入。确认条件同时满足三条：①与收入相关的含有服务潜力或者经济利益的经济资源**很可能流入**；②该流入**会导致资产增加或者负债减少**；③**流入金额能够可靠计量**。\n  - **费用**：报告期内导致政府会计主体**净资产减少**的、含有服务潜力或者经济利益的经济资源的流出。确认条件同时满足三条：①**很可能流出**；②该流出**会导致资产减少或者负债增加**；③**流出金额能够可靠计量**。\n- **易错**：①**政府会计资产计量属性是五种但内容与企业不同**——是\"历史成本、重置成本、**现值**、公允价值、**名义金额**\"，**没有可变现净值**，多了**名义金额（人民币 1 元）**；②**预算结余＝结余资金＋结转资金**，二者的区别在\"下年是否需要按原用途继续使用\"；③政府会计的资产定义强调**\"服务潜力\"**（提供公共产品和服务、履行政府职能），这是企业会计没有的概念。\n- **考察**：—\n\n### 政府财务报告、决算报告与部门（单位）合并财务报表\n- **优先级**：★★\n- **内容（政府财务报告）**：政府财务报告是反映政府会计主体**某一特定日期的财务状况和某一会计期间的运行情况和现金流量**等信息的文件；目标是向财务报告使用者提供与政府财务状况、运行情况和现金流量等有关的信息，**反映政府会计主体公共受托责任履行情况**。\n- **内容（报告体系）**：\n\n| 报告类型 | 基础 | 数据来源 | 主要报表 |\n|---|---|---|---|\n| **决算报告** | 主要以**收付实现制**为基础 | 以**预算会计核算**生成的数据为准 | 预算收入支出表、预算结转结余变动表、财政拨款预算收入支出表等 |\n| **财务报告** | 主要以**权责发生制**为基础 | 以**财务会计核算**生成的数据为准 | 资产负债表、收入费用表、净资产变动表、现金流量表等 |\n\n- **内容（部门/单位合并财务报表）**：\n  - **合并范围**：一般应当以**财政预算拨款关系**为基础确定。有下级预算单位的部门（单位）为**合并主体**，其下级预算单位为**被合并主体**；合并主体应当将其**全部**被合并主体纳入合并范围。通常纳入本部门预决算管理的**行政事业单位和社会组织**（社会团体、基金会和社会服务机构）都应当纳入。以下也应当纳入：①部门（单位）所属的**未纳入部门预决算管理的事业单位**；②部门（单位）所属的**纳入企业财务管理体系执行企业类会计准则制度的事业单位**；③财政部规定的其他会计主体。涉及两个或两个以上举办单位的，按**排序第一**的举办单位确认；举办单位之间有协议、章程或管理办法约定的，**按约定执行，不得重复编报**。\n  - **不纳入合并范围**：①部门（单位）所属的**企业**，以及所属企业下属的事业单位；②与行政机关**脱钩的行业协会商会**；③部门（单位）财务部门**按规定单独建账核算**的会计主体（如工会经费、党费、团费和土地储备资金、住房公积金等资金/基金会计主体）；④**挂靠**部门（单位）的**没有财政预算拨款关系**的社会组织以及非法人性质的学术团体、研究会等。\n  - **合并程序**：部门（单位）合并资产负债表应当以部门（单位）**本级**和其被合并主体**符合编制基础和统一会计政策要求的个别资产负债表或合并资产负债表**为基础，在**抵销内部业务或事项**的影响后合并编制。需要抵销的内部业务或事项包括部门（单位）本级与其被合并主体之间、**被合并主体相互之间**的**债权（含应收款项坏账准备）、债务项目**，以及其他业务或事项对合并资产负债表的影响。\n- **易错**：①**\"纳入合并范围的所属事业单位\"与\"适用政府会计准则制度的单位\"不同**；②**\"不纳入\"清单里的四项**（所属企业及企业下属事业单位、脱钩行业协会商会、单独建账的资金/基金会计主体、无预算拨款关系的挂靠组织）必须能默写；③合并范围以**财政预算拨款关系**为基础，不是以产权/控制为基础（这是与企业合并报表最大的区别）。\n- **考察**：—\n\n### 政府单位特定业务的核算要点（国库集中支付、财政应返还额度、零余额账户用款额度）\n- **优先级**：★★\n- **内容（财政直接支付业务）**：单位收到\"**财政直接支付入账通知书**\"时，按通知书的直接支付入账金额——**预算会计**：借记\"行政支出\"\"事业支出\"等，贷记\"**财政拨款预算收入**\"；**同时财务会计**：借记\"库存物品\"\"固定资产\"\"应付职工薪酬\"\"业务活动费用\"\"单位管理费用\"等，贷记\"**财政拨款收入**\"。\n  - **年末**：根据本年度财政直接支付**预算指标数与当年财政直接支付实际支出数的差额**——预算会计借记\"**资金结存——财政应返还额度**\"，贷记\"财政拨款预算收入\"；同时财务会计借记\"**财政应返还额度**\"，贷记\"财政拨款收入\"。\n  - **下年度恢复财政直接支付额度后**发生实际支出时——预算会计借记\"行政支出\"\"事业支出\"等，贷记\"**资金结存——财政应返还额度**\"；同时财务会计借记有关资产/费用科目，贷记\"**财政应返还额度**\"。\n- **内容（财政授权支付业务）**：\n  1. 单位收到代理银行盖章的\"**授权支付到账通知书**\"时——预算会计借记\"**资金结存——零余额账户用款额度**\"，贷记\"财政拨款预算收入\"；同时财务会计借记\"**零余额账户用款额度**\"，贷记\"财政拨款收入\"。\n  2. **按规定支用额度时**——预算会计借记\"行政支出\"\"事业支出\"等，贷记\"资金结存——零余额账户用款额度\"；同时财务会计借记\"库存物品\"\"固定资产\"\"应付职工薪酬\"\"业务活动费用\"\"单位管理费用\"等，贷记\"零余额账户用款额度\"。\n  3. **年末**依据代理银行提供的对账单**注销额度**——预算会计借记\"资金结存——财政应返还额度\"，贷记\"资金结存——零余额账户用款额度\"；同时财务会计借记\"财政应返还额度\"，贷记\"零余额账户用款额度\"。\n  4. **下年年初恢复额度**时——预算会计借记\"资金结存——零余额账户用款额度\"，贷记\"资金结存——财政应返还额度\"；同时财务会计借记\"零余额账户用款额度\"，贷记\"**财政应返还额度——财政授权支付**\"。\n  5. **年末本年度财政授权支付预算指标数大于零余额账户用款额度下达数**的，根据**未下达的用款额度**——预算会计借记\"资金结存——财政应返还额度\"，贷记\"财政拨款预算收入\"；同时财务会计借记\"财政应返还额度\"，贷记\"财政拨款收入\"。下年度收到财政部门批复的上年末未下达额度时，预算会计借记\"资金结存——零余额账户用款额度\"，贷记\"资金结存——财政应返还额度\"；同时财务会计借记\"零余额账户用款额度\"，贷记\"财政应返还额度\"。\n- **内容（其他资产/负债业务的要点，只记规则不铺开）**：\n  - **资产的取得方式**包括外购、自行加工或自行建造、接受捐赠、无偿调入、置换换入、租赁等，**取得时按成本进行初始计量**。外购资产成本通常包括购买价款、相关税费（**不包括按规定可抵扣的增值税进项税额**）以及使资产达到目前场所和状态或交付使用前发生的归属于该资产的其他费用。**接受捐赠的非现金资产**：按有关凭据注明的金额加相关税费等确定；无凭据但经资产评估的，按评估价值加相关税费等确定；无凭据也未经评估的，按**名义金额**（人民币 1 元）计量。\n  - **资产的处置形式**包括无偿调拨、出售、出让、转让、置换、对外捐赠、报废、毁损以及货币性资产损失核销等；通常应当将被处置资产**账面价值转销计入\"资产处置费用\"**，并按**\"收支两条线\"**将处置净收益**上缴财政**；如按规定将资产处置净收益纳入单位预算管理的，应将净收益计入**当期收入**。盘盈、盘亏、报废或毁损的，报经批准前先将账面价值转入\"**待处理财产损溢**\"。**无偿调出**资产时应当**冲减\"无偿调拨净资产\"**。\n  - **应收账款**：除**事业单位收回后不需上缴财政**的应收账款和其他应收款进行减值处理外，**其他资产均未考虑减值**。\n  - **库存物品**：政府储备物资通过\"**政府储备物资**\"科目核算；**受托存储保管和受托转赠的物资**通过\"**受托代理资产**\"科目核算；**为在建工程购买和使用的材料物资**通过\"**工程物资**\"科目核算——以上均**不通过\"库存物品\"科目**。随买随用的零星办公用品可在购进时直接列作费用。\n  - **固定资产**：使用年限**超过一年（不含一年）**、单位价值在规定标准以上、使用过程中基本保持原有物质形态的资产；单位价值**虽未达到规定标准但使用年限超过一年（不含一年）的大批同类物资**（如图书、家具、用具、装具）也应当确认为固定资产。**购入需要安装的**先通过\"**在建工程**\"核算，安装完毕交付使用时再转入\"固定资产\"；**以借入、经营租赁租入方式取得**的固定资产**不通过\"固定资产\"科目核算**，应当设置**备查簿**登记；**融资租入**的固定资产**通过\"固定资产\"科目核算**，并设置\"融资租入固定资产\"明细科目。文物资源对于考古发掘、接受捐赠等方式取得的，按**名义金额**入账。\n  - **年末暂收暂付款项**：对于**纳入本年度部门预算管理的暂付款项**，支付时可不做预算会计处理，待结算或报销时按结算/报销金额处理；但**年末结账前尚未结算或报销的**，应当按照暂付金额借记相关预算支出科目、贷记\"资金结存\"科目。对于**应当纳入下一年度部门预算管理的暂收款项**，收到款项时借记\"银行存款\"等、贷记\"**其他应付款**\"，本年度**不做预算会计处理**；待下年初按暂收金额借记\"其他应付款\"、贷记有关收入科目，同时在预算会计中借记\"资金结存\"、贷记有关预算收入科目。\n- **易错**：①**\"财政应返还额度\"是双基础的连接点**——预算会计中记在\"**资金结存——财政应返还额度**\"明细科目下，财务会计中单设\"**财政应返还额度**\"科目，两边名称相似但位置不同；②**年末补记指标**与**下年使用上年指标**的两笔分录方向相反，最容易写反；③**受托代理物资、政府储备物资、工程物资都不走\"库存物品\"**；④**借入/经营租赁租入的固定资产不通过\"固定资产\"科目核算**（只设备查簿），而**融资租入的通过\"固定资产\"科目核算**——两者方向相反。\n- **考察**：—\n\n### 民间非营利组织会计：适用主体、核算基础与会计要素\n- **优先级**：★★★\n- **内容（适用制度与主体）**：民间非营利组织适用**《民间非营利组织会计制度》**，主体是依照法律法规登记的**社会团体、基金会、民办非企业单位**（社会服务机构）等。\n- **内容（三个特征，即\"什么是民间非营利组织\"）**：\n  1. **为公益目的或其他非营利目的成立**——强调非营利性，与企业的营利性有本质区别；但强调非营利性**并不排除**其因提供商品或者社会服务而**获取相应收入或者收取合理费用**，只要这些营利活动的所得**最终用于组织的非营利事业**。\n  2. **资源提供者向该组织投入资源不取得经济回报**——资金或者其他资源提供者**不能从民间非营利组织中获取回报**；如果出资者等可以从组织中获取回报，**应当将其视为企业，适用企业会计准则和企业会计制度**。\n  3. **资源提供者对该组织的财产不保留或享有任何财产权利**——投入资源后不再保留或享有相关财产的任何权利（如与所有者权益有关的资产出售、转让、处置权以及清算时剩余财产的分配权等）。这一特征既将民间非营利组织与**企业**区分开来，也将其与**各行政事业单位**区分开来——因为**行政事业单位尽管也属于非营利组织，但是国家对这些组织及其净资产拥有所有权**。\n- **内容（会计核算基础与特点）**：\n  - **以权责发生制为会计核算基础**（个别事项可采用收付实现制）——因为权责发生制较收付实现制更有助于加强资产、负债的管理，提高会计信息质量，增强会计信息的有用性。\n  - **在采用历史成本计价的基础上，引入公允价值计量基础**——公允价值的引入是由民间非营利组织的特殊业务活动所决定的，如通过**接受捐赠**等业务取得的资产可能很难或者根本无法确定其实际成本。\n  - **会计要素不包括所有者权益和利润**，而是设置了\"**净资产**\"这一要素（因为资源提供者既不保留或享有该组织的任何财产权利，也不取得经济回报）。\n- **内容（会计要素）**：划分为**反映财务状况的会计要素**和**反映业务活动情况的会计要素**。\n  - **资产**：过去的交易或者事项形成并由民间非营利组织**拥有或者控制**的资源，该资源**预期会给民间非营利组织带来经济利益或者服务潜力**。按流动性分为流动资产、长期投资、固定资产、在建工程、**文物资源**、无形资产和**受托代理资产**等。\n  - **负债**：过去的交易或者事项形成的**现时义务**，履行该义务预期会导致含有经济利益或者服务潜力的资源流出民间非营利组织。按其流动性分为流动负债、长期负债和**受托代理负债**等。\n  - **净资产**：民间非营利组织的**资产减去负债后的余额**，按**是否受到限制**分为**限定性净资产**和**非限定性净资产**。\n  - **收入**：包括**捐赠收入、会费收入、提供服务收入、政府补助收入、商品销售收入、投资收益**和其他收入等。\n  - **费用**：包括**业务活动成本、税金及附加、管理费用、筹资费用、资产减值损失、所得税费用**和其他费用等。民间非营利组织**为了获得捐赠资产而发生的费用**（举办募款活动费、准备、印刷和发放募款宣传资料费以及其他与募款或者争取捐赠资产有关的费用）计入**筹资费用**。各项费用应当按**是否存在限定**区分为**限定性费用**和**非限定性费用**核算；期末将**限定性费用结转至限定性净资产**、**非限定性费用结转至非限定性净资产**，作为净资产的**减项**。\n  - **财务会计报告**：由会计报表、会计报表附注和其他应当披露的相关信息和资料组成；会计报表**至少应当包括资产负债表、业务活动表和现金流量表**三张基本报表。分为**年度**和**中期**财务会计报告；编制中期报告应当采用与年度会计报表**相一致的确认与计量原则**。\n- **易错**：①**民间非营利组织的会计基础是权责发生制**（与政府预算会计的收付实现制形成鲜明对照）；②**会计要素没有\"所有者权益\"\"利润\"**，取而代之的是\"净资产\"（且**净资产要拆成限定性/非限定性两道**）；③**\"资源提供者能从组织获取回报 → 视为企业\"**是判断题的高频开关；④**行政事业单位与民间非营利组织的根本区别：国家对行政事业单位及其净资产拥有所有权**；⑤业务活动表＝民间非营利组织的\"利润表\"性质的主表，不要与企业利润表混记。\n- **考察**：—\n\n### 限定性净资产与非限定性净资产的划分、结转与重分类\n- **优先级**：★★★\n- **内容（划分标准）**：**如果资产或者资产所产生的经济利益（如资产的投资收益和利息等）的使用受到资产提供者或者国家有关法律、行政法规所设置的\"时间限制\"或（和）\"用途限制\"，由此形成的净资产即为限定性净资产**；**国家有关法律、行政法规对净资产的使用直接设置限制的，该受限制的净资产也应作为限定性净资产**；**除此之外的其他净资产应当作为非限定性净资产**。\n  - **时间限制**：资产提供者或者国家有关法律、行政法规要求民间非营利组织在收到资产后的**特定时期之内或特定日期之后**使用该项资产，或者对资产的使用设置了**永久限制**。\n  - **用途限制**：资产提供者或者国家有关法律、行政法规要求民间非营利组织将收到的资产**用于某一特定的用途**。\n  - 实务中**时间限制和用途限制常常同时存在**；限制的存在需要**根据净资产的概念进行判断**。\n- **内容（重要限定：三类\"不算限制\"的情形）**：\n  1. **民间非营利组织的理事会或类似权力机构对净资产的使用所作的限定性决策、决议或拨款限额等**，属于民间非营利组织**内部管理上**对资产使用所作的限制，**不属于**所界定的限定性净资产；\n  2. 资产提供者或者国家有关法律、行政法规所设置的限制，**只有在比民间非营利组织的宗旨、目的或章程等关于资产使用的要求更为具体明确时**，才能成为《民间非营利组织会计制度》所称的\"限制\"；\n  3. **民间非营利组织设立时取得的注册资金，应当直接计入净资产**（其使用受到时间限制或用途限制的，在取得时按规定判断）。\n- **内容（期末结转，两条主线）**：\n  - **限定性净资产**：主要来源是获得了**限定性收入**（主要是限定性捐赠收入和政府补助收入）。期末，民间非营利组织应当将**当期限定性收入的余额转为限定性净资产**，即借记\"**捐赠收入——限定性收入**\"\"**政府补助收入——限定性收入**\"等，贷记\"**限定性净资产**\"；**同时**将各费用类科目所属**限定性费用**明细科目的余额转入\"限定性净资产\"，借记\"限定性净资产\"，贷记\"业务活动成本——限定性费用\"\"管理费用——限定性费用\"等。\n  - **非限定性净资产**：期末，将\"捐赠收入——非限定性收入\"\"会费收入——非限定性收入\"\"提供服务收入——非限定性收入\"\"政府补助收入——非限定性收入\"\"商品销售收入——非限定性收入\"\"投资收益——非限定性收入\"\"总部拨款收入——非限定性收入\"\"其他收入——非限定性收入\"等明细科目的余额转入\"**非限定性净资产**\"，借记各收入科目，贷记\"非限定性净资产\"；同时将\"业务活动成本——非限定性费用\"\"税金及附加——非限定性费用\"\"管理费用——非限定性费用\"\"筹资费用——非限定性费用\"\"资产减值损失——非限定性费用\"\"其他费用——非限定性费用\"\"所得税费用\"等非限定性费用明细科目的余额结转至\"非限定性净资产\"，**借记\"非限定性净资产\"，贷记各费用科目**。\n- **内容（重分类）**：**如果限定性净资产的限制已经解除，应当对净资产进行重新分类，将限定性净资产转为非限定性净资产**，借记\"**限定性净资产**\"，贷记\"**非限定性净资产**\"。\n  - **限制解除的两种典型时点**：①**限制在确认收入的当期即得以解除**的，可以在确认收入时直接判断并把该部分金额从\"限定性收入\"转为\"**非限定性收入**\"（例 30-24：捐款 2 000 元的活动节余由基金会自由支配，借记\"捐赠收入——限定性收入\"2 000，贷记\"捐赠收入——非限定性收入\"2 000）；②**时间限制到期或用途已实现**（如限定在 2×22 年 1 月 1 日之后才能使用的捐款，到该日限制解除；或限定用途的资产在用途实现后仍有结余并经捐赠人同意留归组织）时，做限定性净资产→非限定性净资产的**重分类**。\n- **内容（调整以前年度收入、费用项目对净资产的影响）**：如果因调整**以前期间**收入、费用项目而涉及调整非限定性净资产的，应当就需要调整的金额，借记或贷记有关科目，**贷记或借记\"非限定性净资产\"或\"限定性净资产\"科目**（即直接调整净资产的**期初数**，而不通过当期收入费用）。例如发现上一年度未记录的无形资产摊销 6 000 元，应追溯调整上年度管理费用并**减少非限定性净资产期初数**。\n- **易错**：①**理事会/管理层自己的限定性决议不算\"限制\"**——限制必须由**组织之外的资产提供者或国家法律法规**设置；②**\"限制必须比组织宗旨、章程更具体明确\"**才构成制度所称的\"限制\"；③**重分类的方向**是\"限定性净资产 → 非限定性净资产\"（限制解除），科目是\"限定性净资产\"（借）/ \"非限定性净资产\"（贷），**不是**通过收入科目；④**期末结转顺序不能错**：收入先结转净资产，费用再冲减净资产，**费用在净资产科目下作减项**；⑤**调整以前年度项目直接调整净资产期初数**，不走当期损益。\n- **考察**：—\n\n### 捐赠收入的确认与计量；会费、服务、政府补助等收入\n- **优先级**：★★★\n- **内容（捐赠的概念）**：捐赠属于**非交换交易**的一种，通常是指某个单位或个人（**捐赠人**）自愿地将现金或其他资产**无偿地**转让给另一单位或个人（**受赠人**），或者无偿地清偿或取消该单位或个人的债务。\n- **内容（确认时点）**：民间非营利组织的捐赠收入应当在**同时满足**以下两个条件时予以确认：①**与捐赠相关的经济利益很可能流入**民间非营利组织；②**金额能够可靠计量**。\n  - 实务口径（教材示例的结构）：**协议签订日尚未收到款项、也未取得收取款项权利的，不满足确认条件，不进行账务处理**；**在实际收到款项（或取得收取款项的权利）时**按收到的金额确认捐赠收入。对于\"**每售出一件产品捐赠 1 元**\"式的**非定额、按销量计算**的捐赠，也应当在**每月实际收到款项时**按实际收到的金额确认，协议签订日及承诺的最低金额**不确认**。\n- **内容（按是否附限制条件分类）**：捐赠收入按是否附限制条件分别计入\"**捐赠收入——限定性收入**\"或\"**捐赠收入——非限定性收入**\"；**期末**将\"捐赠收入\"科目各明细科目的余额**分别转入限定性净资产和非限定性净资产**——借记\"捐赠收入——限定性收入\"，贷记\"限定性净资产\"；借记\"捐赠收入——非限定性收入\"，贷记\"非限定性净资产\"；**期末结转后\"捐赠收入\"科目应无余额**。\n- **内容（其他收入的确认要点）**：\n  - **会费收入**：根据章程等的规定向会员收取的会费；**一般情况下为非限定性收入，除非相关资产提供者对资产的使用设置了限制**；会费收入**通常属于非交换交易收入**。应在满足规定的收入确认条件时确认；期末将\"非限定性收入\"明细科目贷方余额转入\"非限定性净资产\"。\n  - **提供服务收入**（学杂费、医疗费、培训收入、承接政府购买服务收入等）：一般为非限定性收入，存在限定的设置\"限定性收入\"明细科目；收取款项时按实际收到或应当收取的价款，借记\"现金\"\"银行存款\"\"应收账款\"等，按应确认的收入金额贷记\"提供服务收入\"，按预收的价款贷记\"**预收账款**\"；以后期间确认时借记\"预收账款\"、贷记\"提供服务收入——非限定性收入\"。期末结转至非限定性净资产。\n  - **政府补助收入**：按**是否存在限定**区分为非限定性收入和限定性收入，设置\"非限定性收入\"\"限定性收入\"明细科目。**如果资产提供者对资产的使用设置了时间限制或（和）用途限制，则所确认的相关收入为限定性收入；除此之外的其他所有收入为非限定性收入。**\n  - **商品销售收入**：按配比原则，在确认销售收入时**同时结转相应的成本**（例 30-31：售出杂志确认\"商品销售收入——非限定性收入\"，同时借记\"业务活动成本——非限定性费用——商品销售成本\"、贷记\"存货\"）。\n- **易错**：①**确认的两个条件与企业收入准则不同**——这里用的是\"经济利益很可能流入＋金额能够可靠计量\"，**不是**\"控制权转移\"；②**协议签订日、捐赠承诺日不确认收入**（未收到款项也未取得收款权利），必须在**实际收到或取得收款权利**时确认；③**期末\"捐赠收入\"必须结转干净、余额为零**；④**限定性与非限定性的判断标准统一是\"资产提供者或国家法律法规是否对资产使用设置了时间/用途限制\"**——收入、费用、净资产三者的划分标准同源，可以一起记；⑤**筹资费用的范围**（为获得捐赠资产而发生的募款活动费等）别与业务活动成本混。\n- **考察**：—\n\n### 受托代理业务的界定与核算\n- **优先级**：★★\n- **内容（界定）**：**受托代理业务**是指民间非营利组织从委托方收到受托资产，并按照委托人的意愿将资产转赠给指定的其他组织或者个人的**受托代理过程**。民间非营利组织接受委托方委托从事受托代理业务而收到的资产即为**受托代理资产**；因从事受托代理业务、接受受托代理资产而产生的负债即为**受托代理负债**。\n  - 《民间非营利组织会计制度》规定的受托代理业务，是指**有明确的转赠或者转交协议**，或者虽然无协议但**同时满足**以下条件的业务：\n    1. 民间非营利组织在**取得资产的同时即产生了向具体受益人转赠或转交资产的现时义务**，**不会导致自身净资产的增加**；\n    2. 民间非营利组织**仅起到中介而非主导发起作用**，帮助委托人将资产转赠或转交给指定的受益人，并且**没有权利改变受益人，也没有权利改变资产的用途**；\n    3. **委托人已明确指出了具体受益人**个人的姓名或受益单位的名称（包括从民间非营利组织提供的名单中指定一个或若干个受益人）。\n- **内容（核算）**：对于受托代理业务，民间非营利组织应当**比照接受捐赠资产的原则确认和计量受托代理资产，同时按照其金额确认相应的受托代理负债**。需要设置\"**受托代理资产**\"和\"**受托代理负债**\"两个会计科目，并设置**受托代理资产登记簿**；在\"受托代理资产\"和\"受托代理负债\"科目下按照**指定的受赠组织或个人**设置明细账，进行明细核算。\n  - **收到**受托代理资产时，按应确认的入账金额：借记\"**受托代理资产**\"，贷记\"**受托代理负债**\"；\n  - **转赠或转出**受托代理资产时，按转出受托代理资产的账面余额：借记\"**受托代理负债**\"，贷记\"**受托代理资产**\"；\n  - 收到的受托代理资产**如果为现金、银行存款或其他货币资金**，可以**不通过\"受托代理资产\"科目**核算，而在\"现金\"\"银行存款\"\"其他货币资金\"科目下设置\"**受托代理资产**\"**明细科目**核算；\n  - 民间非营利组织从事受托代理业务时发生的**应归属于其自身的相关税费、运输费等**，应当**计入当期费用**（借记\"**其他费用**\"，贷记\"银行存款\"等）；\n  - **报表列示**：应当在资产负债表中**单设\"受托代理资产\"和\"受托代理负债\"项目**，并在会计报表附注中披露受托代理业务的情况。\n- **易错**：①**受托代理业务\"不导致自身净资产增加\"**——所以只确认资产和负债，**不确认收入**，这是与捐赠业务最关键的分水岭；②三个并列条件的后两条强调**\"只当中介、不能改变受益人和用途\"**；③**受托代理资产与受托代理负债金额相等**，且要在报表中**单独列示**；④**属于组织自身的税费、运输费**走\"**其他费用**\"，**不能**冲减受托代理资产/负债。\n- **考察**：—\n\n---\n\n## 本章易错陷阱汇总\n\n1. **\"适度分离并相互衔接\" ≠ 建两套账**：是在同一套账内进行**平行记账**，预算会计要素与财务会计要素相互协调、决算报告与财务报告相互补充。\n2. **\"双基础\"不能互换**：预算会计＝**收付实现制**（国务院另有规定的从其规定）；财务会计＝**权责发生制**。\n3. **\"双报告\"的数据来源一一对应**：决算报告←预算会计数据（收付实现制基础）；财务报告←财务会计数据（权责发生制基础）。\n4. **平行记账的判断只看一条**：该业务是否属于\"**纳入本年度部门预算管理的现金收支**\"——非现金业务（如计提折旧摊销、应缴财政款、受托代理资产）**只做财务会计**。\n5. **政府会计资产的计量属性没有\"可变现净值\"**：是历史成本、重置成本、现值、公允价值、**名义金额（人民币 1 元）**；且**一般应当采用历史成本**。\n6. **政府会计不适用主体**：军队、已纳入企业财务管理体系的单位、执行《民间非营利组织会计制度》的社会团体。\n7. **部门合并报表以\"财政预算拨款关系\"为基础**（不是产权/控制）；\"不纳入合并范围\"的四类主体要能默写。\n8. **受托代理物资、政府储备物资、工程物资都不通过\"库存物品\"科目**核算。\n9. **借入/经营租赁租入的固定资产不通过\"固定资产\"科目**（只设备查簿）；**融资租入的通过\"固定资产\"科目**核算。\n10. **民间非营利组织的会计基础是权责发生制**（不是收付实现制）；会计要素**没有所有者权益和利润**，而是设\"净资产\"。\n11. **限定性净资产的\"限制\"必须来自外部**：理事会/管理层的限定性决议、拨款限额**不算**；而**国家有关法律、行政法规对净资产使用直接设置限制的，也算限定性**。\n12. **限制解除走\"重分类\"，不走收入**：借记\"限定性净资产\"、贷记\"非限定性净资产\"；只有在**确认收入的当期即解除**时才通过\"限定性收入→非限定性收入\"处理。\n13. **调整以前年度收入费用项目，直接调整净资产期初数**，不通过当期损益。\n14. **捐赠收入在\"协议签订日\"不确认**：必须在\"经济利益很可能流入＋金额能够可靠计量\"两个条件同时满足（通常为**实际收到或取得收款权利**）时确认。\n15. **受托代理业务不确认收入**（不导致自身净资产增加）；**属于组织自身的税费、运输费计入\"其他费用\"**。\n\n## 本章分录模板\n\n```\n【一】财政直接支付（收到\"财政直接支付入账通知书\"）\n预算会计：借：事业支出 / 行政支出            贷：财政拨款预算收入\n财务会计：借：库存物品 / 固定资产 / 应付职工薪酬 / 单位管理费用   贷：财政拨款收入\n\n【二】年末财政直接支付指标数与实际支出数的差额（补记指标）\n预算会计：借：资金结存——财政应返还额度       贷：财政拨款预算收入\n财务会计：借：财政应返还额度                  贷：财政拨款收入\n（下年度使用上年指标时，两边均反向转出\"财政应返还额度\"）\n\n【三】财政授权支付（收到\"授权支付到账通知书\"）\n预算会计：借：资金结存——零余额账户用款额度   贷：财政拨款预算收入\n财务会计：借：零余额账户用款额度              贷：财政拨款收入\n支用额度：\n预算会计：借：事业支出 / 行政支出             贷：资金结存——零余额账户用款额度\n财务会计：借：库存物品 / 固定资产 / 单位管理费用  贷：零余额账户用款额度\n年末注销额度（依据代理银行对账单）：\n预算会计：借：资金结存——财政应返还额度       贷：资金结存——零余额账户用款额度\n财务会计：借：财政应返还额度                  贷：零余额账户用款额度\n下年年初恢复额度：两边均作上述反向分录\n\n【四】民间非营利组织·收到限定性捐赠\n借：银行存款\n    贷：捐赠收入——限定性收入\n期末结转：借：捐赠收入——限定性收入          贷：限定性净资产\n（非限定性捐赠同理，期末转入\"非限定性净资产\"）\n\n【五】民间非营利组织·限制解除的重分类\n借：限定性净资产\n    贷：非限定性净资产\n（若限制在确认收入当期即解除：借：捐赠收入——限定性收入  贷：捐赠收入——非限定性收入）\n\n【六】民间非营利组织·发生限定性费用并结转\n借：业务活动成本——限定性费用 / 管理费用——限定性费用   贷：银行存款\n期末：借：限定性净资产      贷：业务活动成本——限定性费用\n（非限定性费用期末转入\"非限定性净资产\"借方，作为净资产减项）\n\n【七】民间非营利组织·受托代理业务\n收到：借：受托代理资产（或\"银行存款——受托代理资产\"）   贷：受托代理负债\n转出：借：受托代理负债                                  贷：受托代理资产\n自身发生的税费、运输费：借：其他费用   贷：银行存款\n\n【八】民间非营利组织·以前年度收入费用项目的调整\n借：非限定性净资产（期初数）\n    贷：无形资产 等（追溯调整，不通过当期损益）\n```\n\n## 与其他章的联动\n\n- **与第一章（总论）**：政府会计与民间非营利组织的**资产确认条件**（\"服务潜力很可能实现或经济利益很可能流入＋成本或价值能够可靠计量\"）是第一章资产确认条件在政府/非营利场景的镜像；\"会计基本假设\"\"会计信息质量要求\"同样适用于这两类主体。\n- **与第二章（存货）、第三章（固定资产）、第四章（无形资产）**：政府单位的\"库存物品\"\"固定资产\"\"无形资产\"\"公共基础设施\"\"政府储备物资\"\"文物资源\"在初始计量与后续计量上与企业的同类资产**规则相似但不能直接套用**（例如政府会计资产**不考虑减值**，除事业单位收回后不需上缴财政的应收账款和其他应收款外）；民间非营利组织的\"文物资源\"\"受托代理资产\"也有专门口径。\n- **与第十七章（收入）**：《民间非营利组织会计制度》的捐赠收入确认条件是\"**经济利益很可能流入＋金额能够可靠计量**\"，**不是**企业收入准则的\"**控制权转移**\"——这一对照是命题人最爱设的跨章陷阱；提供服务收入中的\"预收账款\"处理可与企业合同负债对照记忆。\n- **与第十六章（所有者权益）**：民间非营利组织**没有所有者权益**，取而代之的是\"**限定性净资产／非限定性净资产**\"，其\"限制解除重分类\"的机理与企业\"其他综合收益重分类进损益\"的形式相似但性质完全不同（前者是净资产内部结构调整，后者是损益的重新分类）。\n- **与第二十一章（债务重组）**：捐赠定义中包含\"无偿地清偿或取消该单位或个人的债务\"，与债务重组的\"债权人让步\"边界要分清楚（前者是纯粹无偿的非交换交易，后者源于既有债权债务关系）。\n- **与第二十七章（合并财务报表）**：部门（单位）合并财务报表**以财政预算拨款关系为基础**确定合并范围、抵销内部债权债务，与企业合并报表**以控制为基础**、抵销内部交易的做法形成对照，两者的\"合并范围确定依据\"是高频对比考点。\n- **与第二十四章（会计政策、会计估计及其变更和差错更正）、第二十五章（资产负债表日后事项）**：民间非营利组织\"调整以前年度收入、费用项目对净资产的影响\"直接调整净资产期初数，与第二十四章的**追溯调整/追溯重述**思路一致，可与每股收益的重新计算（第二十八章）串成一条\"追溯调整链\"。\n"
};
