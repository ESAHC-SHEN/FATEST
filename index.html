  "use strict";

  var LS = "cpa_checklist_v1";
  var CHAPTERS = [
    { n: 1,  file: "第1章.md",  name: "第一章 总论", tier: "C", q: 1,  short: "总论" },
    { n: 2,  file: "第2章.md",  name: "第二章 存货", tier: "C", q: 2,  short: "存货" },
    { n: 3,  file: "第3章.md",  name: "第三章 固定资产", tier: "B", q: 8,  short: "固定资产" },
    { n: 4,  file: "第4章.md",  name: "第四章 无形资产", tier: "B", q: 8,  short: "无形资产" },
    { n: 5,  file: "第5章.md",  name: "第五章 投资性房地产", tier: "B", q: 8,  short: "投资性房地产" },
    { n: 6,  file: "第6章.md",  name: "第六章 长期股权投资与合营安排", tier: "A", q: 20, short: "长期股权投资" },
    { n: 7,  file: "第7章.md",  name: "第七章 资产减值", tier: "C", q: 3,  short: "资产减值" },
    { n: 8,  file: "第8章.md",  name: "第八章 负债", tier: "B", q: 6,  short: "负债" },
    { n: 9,  file: "第9章.md",  name: "第九章 职工薪酬", tier: "B", q: 7,  short: "职工薪酬" },
    { n: 10, file: "第10章.md", name: "第十章 股份支付", tier: "A", q: 16, short: "股份支付" },
    { n: 11, file: "第11章.md", name: "第十一章 借款费用", tier: "B", q: 5,  short: "借款费用" },
    { n: 12, file: "第12章.md", name: "第十二章 或有事项", tier: "C", q: 4,  short: "或有事项" },
    { n: 13, file: "第13章.md", name: "第十三章 金融工具与保险合同", tier: "B", q: 13, short: "金融工具" },
    { n: 14, file: "第14章.md", name: "第十四章 租赁", tier: "B", q: 9,  short: "租赁" },
    { n: 15, file: "第15章.md", name: "第十五章 持有待售、处置组和终止经营", tier: "C", q: 4, short: "持有待售" },
    { n: 16, file: "第16章.md", name: "第十六章 所有者权益", tier: "C", q: 0,  short: "所有者权益" },
    { n: 17, file: "第17章.md", name: "第十七章 收入、费用和利润", tier: "A", q: 16, short: "收入" },
    { n: 18, file: "第18章.md", name: "第十八章 政府补助", tier: "C", q: 3,  short: "政府补助" },
    { n: 19, file: "第19章.md", name: "第十九章 所得税", tier: "A", q: 27, short: "所得税" },
    { n: 20, file: "第20章.md", name: "第二十章 非货币性资产交换", tier: "C", q: 2, short: "非货币性资产交换" },
    { n: 21, file: "第21章.md", name: "第二十一章 债务重组", tier: "C", q: 3,  short: "债务重组" },
    { n: 22, file: "第22章.md", name: "第二十二章 外币折算", tier: "B", q: 7,  short: "外币折算" },
    { n: 23, file: "第23章.md", name: "第二十三章 财务报告", tier: "C", q: 1,  short: "财务报告" },
    { n: 24, file: "第24章.md", name: "第二十四章 会计政策、会计估计及其变更和差错更正", tier: "B", q: 5, short: "会计政策变更" },
    { n: 25, file: "第25章.md", name: "第二十五章 资产负债表日后事项", tier: "C", q: 2, short: "日后事项" },
    { n: 26, file: "第26章.md", name: "第二十六章 企业合并", tier: "A", q: 18, short: "企业合并" },
    { n: 27, file: "第27章.md", name: "第二十七章 合并财务报表", tier: "A", q: 25, short: "合并财务报表" },
    { n: 28, file: "第28章.md", name: "第二十八章 每股收益", tier: "C", q: 3,  short: "每股收益" },
    { n: 29, file: "第29章.md", name: "第二十九章 公允价值计量", tier: "C", q: 1, short: "公允价值" },
    { n: 30, file: "第30章.md", name: "第三十章 政府及民间非营利组织会计", tier: "C", q: 0, short: "政府会计" }
  ];

  var state = { done: {}, onlyTodo: false, q: "" };
  var cache = {};          // file -> markdown
  var activeN = null;

  /* ---------------- 存储 ---------------- */
  function load() {
    try {
      var raw = localStorage.getItem(LS);
      if (raw) {
        var o = JSON.parse(raw);
        state.done = o.done || {};
      }
    } catch (e) { state.done = {}; }
  }
  function save() {
    try { localStorage.setItem(LS, JSON.stringify({ done: state.done })); } catch (e) {}
  }
  function key(n, i) { return "c" + n + "-" + i; }

  function chapterTotal(n) {
    return (cache[n] ? countPoints(cache[n]) : 0);
  }
  function chapterDone(n) {
    var t = chapterTotal(n), d = 0;
    for (var i = 0; i < t; i++) if (state.done[key(n, i)]) d++;
    return d;
  }
  /* 考点标题的两种写法都要算作可勾选条目：
     「### 考点名」 或 「## 考点N 名称」。
     但结构性小标题（考点清单/本章易错…/与其他章的联动等）不是考点，不要生成勾选框。 */
  var META = /^(考点清单|考点汇总|本章|与其他章|附[:：]|说明|小结)/;
  function isPointHeading(level, text) {
    var clean = text.replace(/[*\s]/g, "");
    if (META.test(clean)) return false;
    if (level === 3) return true;
    if (level === 2) return /^考点\d*/.test(clean) && clean.length > 2;
    return false;
  }
  function countPoints(md) {
    var lines = md.split(/\r?\n/), k = 0;
    for (var i = 0; i < lines.length; i++) {
      var m = lines[i].match(/^(#{1,4})\s+(.*)$/);
      if (m && isPointHeading(m[1].length, m[2].trim())) k++;
    }
    return k;
  }
  function updateProgress() {
    var tot = 0, dn = 0;
    CHAPTERS.forEach(function (c) {
      tot += chapterTotal(c.n);
      dn += chapterDone(c.n);
    });
    var pct = tot ? Math.round(dn / tot * 100) : 0;
    var fill = document.getElementById("fill"), lab = document.getElementById("pct");
    if (fill) fill.style.width = pct + "%";
    if (lab) lab.textContent = pct + "%";
    return { tot: tot, dn: dn, pct: pct };
  }

  /* ---------------- 极简 Markdown 渲染 ---------------- */
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function inline(s) {
    s = esc(s);
    // 代码
    s = s.replace(/`([^`]+)`/g, function (_, a) { return "<code>" + a + "</code>"; });
    // 加粗
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    // 星级
    s = s.replace(/★{3}/g, '<span class="star3">★★★</span>')
         .replace(/★{2}/g, '<span class="star2">★★</span>')
         .replace(/★(?!★)/g, '<span class="star1">★</span>');
    // 题号引用 2021-2 形式
    s = s.replace(/(?<![\w-])((?:20\d{2})-\d+)(?![\w-])/g, '<span class="qref">$1</span>');
    // 链接
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
    return s;
  }

  function renderMarkdown(md, chapN) {
    var lines = md.split(/\r?\n/);
    var out = [], i = 0, ptIdx = 0;
    var inCode = false, codeBuf = [], listBuf = [], listTag = null;

    function flushList() {
      if (listBuf.length) { out.push("<" + listTag + ">" + listBuf.join("") + "</" + listTag + ">"); listBuf = []; listTag = null; }
    }
    function flushCode() {
      if (codeBuf.length) { out.push("<pre><code>" + esc(codeBuf.join("\n")) + "</code></pre>"); codeBuf = []; }
    }

    for (; i < lines.length; i++) {
      var L = lines[i];

      if (/^\s*```/.test(L)) {
        if (inCode) { flushCode(); inCode = false; } else { flushList(); inCode = true; }
        continue;
      }
      if (inCode) { codeBuf.push(L); continue; }

      var fence = L.match(/^\s*\|/);
      if (fence) { /* 表格单独处理，见下 */ }

      // 标题
      var h = L.match(/^(#{1,4})\s+(.*)$/);
      if (h) {
        flushList();
        var lvl = h[1].length, txt = h[2].trim();
        if (lvl === 1) { out.push("<h1>" + inline(txt) + "</h1>"); }
        else if (isPointHeading(lvl, txt)) {
          var k = key(chapN, ptIdx), dn = !!state.done[k];
          out.push('<h3 class="' + (dn ? "done" : "") + (lvl === 2 ? " lv2" : "") + '" data-k="' + k + '">' +
                   '<span class="box">' + (dn ? "✓" : "") + '</span>' +
                   '<span class="txt">' + inline(txt) + '</span></h3>');
          ptIdx++;
        }
        else if (lvl === 2) { out.push("<h2>" + inline(txt) + "</h2>"); }
        else { out.push("<h4>" + inline(txt) + "</h4>"); }
        continue;
      }

      // 表格
      if (fence && i + 1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i + 1])) {
        flushList();
        var head = splitRow(L);
        i += 2;
        var body = [];
        while (i < lines.length && /^\s*\|/.test(lines[i])) { body.push(splitRow(lines[i])); i++; }
        i--;
        var t = '<table><thead><tr>';
        head.forEach(function (c) { t += "<th>" + inline(c) + "</th>"; });
        t += "</tr></thead><tbody>";
        body.forEach(function (r) {
          t += "<tr>";
          for (var j = 0; j < head.length; j++) {
            var cell = r[j] === undefined ? "" : r[j];
            var cls = /^[\s\d.,%－—\-]*$/.test(cell) ? ' class="num"' : "";
            t += "<td" + cls + ">" + inline(cell) + "</td>";
          }
          t += "</tr>";
        });
        t += "</tbody></table>";
        out.push(t);
        continue;
      }

      // 引用
      var bq = L.match(/^>\s?(.*)$/);
      if (bq) {
        flushList();
        var buf = [bq[1]];
        while (i + 1 < lines.length && /^>\s?/.test(lines[i + 1])) { i++; buf.push(lines[i].replace(/^>\s?/, "")); }
        out.push("<blockquote>" + buf.map(function (b) { return "<p>" + inline(b) + "</p>"; }).join("") + "</blockquote>");
        continue;
      }

      // 分隔线
      if (/^\s*(-{3,}|\*{3,})\s*$/.test(L)) { flushList(); out.push("<hr>"); continue; }

      // 列表
      var ul = L.match(/^\s*[-*+]\s+(.*)$/);
      var ol = L.match(/^\s*\d+[.)]\s+(.*)$/);
      if (ul || ol) {
        var tag = ul ? "ul" : "ol";
        if (listTag && listTag !== tag) flushList();
        listTag = tag;
        listBuf.push("<li>" + inline((ul || ol)[1]) + "</li>");
        continue;
      }

      // 空行
      if (!L.trim()) { flushList(); continue; }

      // 段落
      flushList();
      out.push("<p>" + inline(L.trim()) + "</p>");
    }
    flushList(); flushCode();
    return out.join("\n");
  }
  function splitRow(L) {
    return L.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(function (s) { return s.trim(); });
  }

  /* ---------------- 视图 ---------------- */
  function chapterByN(n) {
    for (var i = 0; i < CHAPTERS.length; i++) if (CHAPTERS[i].n === n) return CHAPTERS[i];
    return null;
  }

  function renderSide() {
    var html = "";
    CHAPTERS.forEach(function (c) {
      var t = chapterTotal(c.n), d = chapterDone(c.n);
      var tick = (t && d === t) ? '<span class="tick">✓</span>' : (t ? '<span class="tick" style="color:var(--ink-3)">' + d + "/" + t + "</span>" : "");
      html += '<a href="#ch' + c.n + '" data-n="' + c.n + '" class="' + (activeN === c.n ? "active" : "") + '">' +
              '<span class="dot ' + c.tier + '"></span>' +
              '<span class="nm" title="' + esc(c.name) + '">' + esc(c.short) + "</span>" + tick + "</a>";
    });
    document.getElementById("sideList").innerHTML = html;
  }

  function renderTOC() {
    var rows = "";
    CHAPTERS.forEach(function (c) {
      var t = chapterTotal(c.n), d = chapterDone(c.n);
      rows += '<tr><td><span class="tier ' + c.tier + '">' + c.tier + "</span></td>" +
              '<td><a href="#ch' + c.n + '">' + esc(c.name) + "</a></td>" +
              '<td class="num">' + (c.q || "—") + "</td>" +
              '<td class="num">' + (t ? d + "/" + t : "—") + "</td></tr>";
    });
    return '<div class="card hero">' +
      "<h1>CPA《会计》教材重点清单</h1>" +
      "<p>2026 年注册会计师全国统一考试辅导教材《会计》（30 章）· 按题库考察频次排定优先级</p>" +
      "<blockquote><p><b>用法</b>：点每个考点标题左侧的方框，或在书上划完一处就回来打勾。" +
      "进度自动保存在本机浏览器，关掉再打开不会丢。<b>打印</b>按钮可导出成纸质划线版。" +
      "黄框 🔴 为 A 类高频核心章，橙框 🟡 为 B 类常考章，灰框 ⚪ 为 C 类低频章。</p></blockquote>" +
      "<h2>章节优先级与进度</h2>" +
      '<table><thead><tr><th>类</th><th>章节</th><th class="num">题次</th><th class="num">已划</th></tr></thead><tbody>' +
      rows + "</tbody></table></div>";
  }

  function loadChapter(n, anchor) {
    var c = chapterByN(n);
    if (!c) return;
    activeN = n;
    renderSide();
    var main = document.getElementById("main");

    function paint(md) {
      var head = '<div class="card"><div class="noprint" style="margin-bottom:14px">' +
                 '<button class="btn" id="backBtn">← 返回总目录</button> ' +
                 '<span style="color:var(--ink-3);font-size:13px;margin-left:8px">' +
                 esc(c.name) + " · 本题库考察 " + (c.q ? c.q + " 题次" : "—") + "</span></div>" +
                 '<div class="md" id="mdBody">' + renderMarkdown(md, n) + "</div></div>";
      main.innerHTML = head;
      var b = document.getElementById("backBtn");
      if (b) b.onclick = function () { location.hash = ""; showTOC(); };
      bindChecks();
      applyFilter();
      if (anchor) {
        var t = document.querySelector(anchor);
        if (t) t.scrollIntoView({ block: "start" });
      } else { window.scrollTo(0, 0); }
    }

    if (cache[n]) { paint(cache[n]); return; }

    // 双模式：单文件版用 window.MD_INDEX 内联全部章节；多文件版走 fetch
    if (window.MD_INDEX && typeof window.MD_INDEX[n] === "string") {
      cache[n] = window.MD_INDEX[n];
      paint(cache[n]);
      updateProgress(); renderSide();
      return;
    }

    main.innerHTML = '<div class="card"><div class="loading">载入 ' + esc(c.name) + " …</div></div>";
    fetch("_章节/" + c.file)
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.text();
      })
      .then(function (md) { cache[n] = md; paint(md); updateProgress(); renderSide(); })
      .catch(function (e) {
        main.innerHTML = '<div class="card"><div class="empty">载入失败：' + esc(c.file) +
          "<br><br>本页面需要通过本地服务器打开（浏览器直接双击 HTML 时无法读取 md 文件）。<br>" +
          "请在「财务会计」文件夹下运行 <code>启动划线助手.ps1</code>，" +
          '或使用免服务器的「划线清单_单文件版.html」。' +
          "<br><br><small>" + esc(e.message) + "</small></div></div>";
      });
  }

  function showTOC() {
    activeN = null;
    renderSide();
    document.getElementById("main").innerHTML = renderTOC();
    document.querySelectorAll("#main a[href^='#ch']").forEach(function (a) {
      a.addEventListener("click", function (ev) {
        ev.preventDefault();
        location.hash = a.getAttribute("href");
      });
    });
    window.scrollTo(0, 0);
  }

  /* ---------------- 交互 ---------------- */
  function bindChecks() {
    document.querySelectorAll("#mdBody h3").forEach(function (h) {
      h.addEventListener("click", function () {
        var k = h.getAttribute("data-k");
        var on = !state.done[k];
        if (on) state.done[k] = 1; else delete state.done[k];
        h.classList.toggle("done", on);
        var box = h.querySelector(".box");
        if (box) box.textContent = on ? "✓" : "";
        save(); updateProgress(); renderSide();
      });
    });
  }

  function applyFilter() {
    var q = state.q.trim().toLowerCase();
    var body = document.getElementById("mdBody");
    // 清除旧高亮
    body.querySelectorAll("mark").forEach(function (m) {
      var p = m.parentNode; p.replaceChild(document.createTextNode(m.textContent), m); p.normalize();
    });
    var hits = 0;
    body.querySelectorAll("h2,h3,h4,p,li,tr,blockquote").forEach(function (el) {
      var text = el.textContent.toLowerCase();
      var show = true;
      if (q) show = text.indexOf(q) >= 0;
      if (show && state.onlyTodo && el.tagName === "H3" && el.classList.contains("done")) show = false;
      el.style.display = show ? "" : "none";
      if (show) hits++;
    });
    // 高亮
    if (q) {
      body.querySelectorAll("p,li,td,strong,code").forEach(function (el) {
        if (el.children.length) return;
        var t = el.textContent, low = t.toLowerCase(), idx = low.indexOf(q);
        if (idx < 0) return;
        var frag = document.createDocumentFragment(), last = 0;
        while (idx >= 0) {
          frag.appendChild(document.createTextNode(t.slice(last, idx)));
          var mk = document.createElement("mark");
          mk.textContent = t.slice(idx, idx + q.length);
          frag.appendChild(mk);
          last = idx + q.length;
          idx = low.indexOf(q, last);
        }
        frag.appendChild(document.createTextNode(t.slice(last)));
        el.innerHTML = ""; el.appendChild(frag);
      });
    }
    var n = document.getElementById("noHit");
    if (q && hits === 0) {
      if (!n) {
        n = document.createElement("div");
        n.id = "noHit"; n.className = "empty";
        n.textContent = "没有匹配「" + state.q + "」的内容";
        body.appendChild(n);
      } else n.style.display = "";
    } else if (n) n.style.display = "none";
  }

  /* ---------------- 启动 ---------------- */
  function boot() {
    load();

    // 单文件版：章节内容已内联，直接填充缓存，不做任何网络请求
    var inline = (window.MD_INDEX && typeof window.MD_INDEX === "object");
    if (inline) {
      CHAPTERS.forEach(function (c) {
        if (typeof window.MD_INDEX[c.n] === "string") cache[c.n] = window.MD_INDEX[c.n];
      });
    }
    var jobs = inline ? Promise.resolve() : Promise.all(CHAPTERS.map(function (c) {
      return fetch("_章节/" + c.file).then(function (r) { return r.ok ? r.text() : ""; })
        .then(function (md) { cache[c.n] = md; }).catch(function () { cache[c.n] = ""; });
    }));

    document.getElementById("search").addEventListener("input", function (e) {
      state.q = e.target.value;
      if (activeN) applyFilter(); else renderSide();
    });
    document.getElementById("onlyTodo").addEventListener("click", function () {
      state.onlyTodo = !state.onlyTodo;
      this.classList.toggle("on", state.onlyTodo);
      this.textContent = state.onlyTodo ? "显示全部" : "只看没划的";
      if (activeN) applyFilter();
    });
    document.getElementById("printBtn").addEventListener("click", function () { window.print(); });
    document.getElementById("resetBtn").addEventListener("click", function () {
      if (!confirm("确定清空所有已划标记？此操作不可撤销。")) return;
      state.done = {}; save();
      if (activeN) { var n = activeN; if (cache[n]) loadChapter(n); } else showTOC();
      updateProgress(); renderSide();
    });

    window.addEventListener("hashchange", route);

    jobs.then(function () {
      route();
      updateProgress();
      renderSide();
    });
  }

  function route() {
    var m = location.hash.match(/^#ch(\d+)$/);
    if (m) loadChapter(parseInt(m[1], 10)); else showTOC();
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
</body>
