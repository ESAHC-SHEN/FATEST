表中相关资产（存货、固定资产等）账面价值小于个别报表，与计税基础之间产生**可抵扣**暂时性差异，应确认**递延所得税资产**。\n    - 内部交易形成**存货**：抵销未实现内部销售利润后确认递延所得税资产（例27-x口径，适用税率25%），下期实现对外销售时**转回**。\n    - 内部交易形成**固定资产**：从持有企业角度看账面价值与计税基础相同、不产生暂时性差异；在合并报表中，抵销未实现内部销售利润后的固定资产原价低于计税基础，差额部分确认递延所得税资产；后续按抵销后的原价计算的折旧额与税法扣除额不同，须**逐年调整**递延所得税资产余额。\n  - **内部应收款项**：抵销内部坏账准备后同样产生递延所得税影响（第27章第十节口径）。\n- **易错**：合并报表中的递延所得税**只在合并层面确认**，不影响个别报表；确认时应考虑该差异**是否能在未来期间转回**（如内部交易资产最终对外出售或被消耗）。\n- **考察**：2016-11（兼）、2018-6（兼）、2018-7（兼）、2022-11（兼）\n\n### 考点24 政府补助的应税性及其递延所得税（本章与第18章的交汇）\n- **优先级**：★★\n- **内容**：与资产相关的政府补助若按税法规定**需计入取得当期的应纳税所得额**（应税补助），而会计上采用**总额法**确认为递延收益分期计入损益，则递延收益的账面价值（余额）与其计税基础（0）之间产生**可抵扣**暂时性差异，应确认**递延所得税资产**。\n- **易错**：若该补助属于**不征税收入**，则不产生暂时性差异，不确认递延所得税；总额法与净额法的选择会改变暂时性差异是否存在。\n- **考察**：2018-16（兼）\n\n---\n\n### 本章易错陷阱汇总\n\n1. **折旧方法/年限差异的方向**要分清：会计折旧快于税法→账面价值<计税基础→**可抵扣**；会计折旧慢于税法→账面价值>计税基础→**应纳税**。\n2. **资产减值准备一律不允许税前扣除**（在发生实质性损失前），所以计提减值后一定形成**可抵扣**暂时性差异。\n3. **负债的计税基础**不是「账面价值−已扣除金额」，而是「账面价值−**未来期间**可税前扣除的金额」。罚款、滞纳金、超标准职工薪酬未来**也不能**扣除→计税基础=账面价值→**无**暂时性差异（永久性差异）。\n4. **合同负债要分两种**：一般情况计税基础=账面价值；税法规定**当期已计税**时计税基础=**0**→可抵扣暂时性差异。\n5. **无形资产的初始确认豁免**：非企业合并、初始确认既不影响会计利润也不影响应纳税所得额→**不确认**递延所得税；**研发费用加计扣除不确认递延所得税**（不是暂时性差异）。\n6. **商誉初始确认豁免**只适用于初始确认环节；若商誉初始确认时计税基础=账面价值，后续计量产生差异**应当确认**递延所得税。\n7. **权益法下的长期股权投资**：拟**长期持有**、能够控制转回时间且可预见未来不会转回→**不确认**递延所得税负债；一旦有处置计划（如划分为持有待售），则**应当确认**。\n8. **税率变动**时递延所得税按**新税率**重新计量，影响去向要看原交易：进损益的进损益，进权益的进权益，企业合并形成商誉的调商誉。\n9. **股份支付**超过等待期确认费用部分形成的递延所得税资产→计入**资本公积**，不计入所得税费用。\n10. **单项交易（租赁、弃置义务）**是豁免的**例外**：要同时分别确认**递延所得税资产和递延所得税负债**，不得用豁免条款规避。\n11. **递延所得税资产不折现**；每个资产负债表日必须**复核**，无法取得足够应纳税所得额时**减记**，原计入权益的减记仍计入权益。\n12. **所得税费用=当期所得税+递延所得税**，凡计入所有者权益或商誉的递延所得税**不进**所得税费用，考试常在此处设陷阱。\n13. **合并报表中的递延所得税**只在合并层面确认：购买日公允价值调整→调整商誉；内部交易未实现损益→确认递延所得税资产并在以后期间转回。\n14. **抵销列报**须满足同一纳税主体、同一税务机关且有法定抵销权，不得随意以净额列示。\n\n### 本章分录模板\n\n**（一）递延所得税负债的确认与转回**\n```\n确认：借：所得税费用                贷：递延所得税负债\n转回：借：递延所得税负债            贷：所得税费用\n（因其他债权投资公允价值变动确认时）\n      借：其他综合收益              贷：递延所得税负债\n```\n**（二）递延所得税资产的确认、减记与恢复**\n```\n确认：借：递延所得税资产            贷：所得税费用\n减记：借：所得税费用                贷：递延所得税资产\n      （原确认时计入所有者权益的）\n      借：其他综合收益/资本公积      贷：递延所得税资产\n恢复：借：递延所得税资产            贷：所得税费用\n```\n**（三）综合分录（当期所得税＋递延所得税）**\n```\n借：所得税费用                      （＝当期所得税＋递延所得税）\n    递延所得税资产                  （本期新增额）\n    其他综合收益 / 资本公积——其他资本公积  （计入权益的递延所得税）\n贷：应交税费——应交所得税            （当期应交所得税）\n    递延所得税负债                  （本期新增额）\n```\n**（四）企业合并中购买日后12个月内确认递延所得税资产**\n```\n借：递延所得税资产\n  贷：商誉                          （商誉足以冲减的部分）\n      所得税费用                    （商誉不足冲减的差额部分）\n```\n**（五）股份支付相关的递延所得税**\n```\n借：递延所得税资产                  （按期末股价估计的未来可抵扣金额×税率）\n  贷：所得税费用                    （不超过等待期内确认费用部分）\n      资本公积——其他资本公积        （超出等待期费用部分）\n```\n**（六）与单项交易（租赁）相关的递延所得税**\n```\n借：递延所得税资产（租赁负债×税率）\n    所得税费用（差额，倒挤）\n  贷：递延所得税负债（使用权资产含初始直接费用×税率）\n```\n\n### 与其他章的联动\n\n- **与第17章（收入、费用和利润）**：合同负债（预收款已计税时计税基础为0）、预计负债（应付退货款、质量保证义务）均产生可抵扣暂时性差异（2019-1、2020-8）；利润表中的所得税费用单列于净利润之前（2017-4、2017-5）。\n- **与第18章（政府补助）**：应税补助采用总额法形成的递延收益产生可抵扣暂时性差异，须确认递延所得税资产（2018-16）。\n- **与第4章（无形资产）**：内部研发支出的费用化/资本化划分直接决定账面价值与计税基础，是加计扣除与初始确认豁免的判断前提（2020-4、2022-5）。\n- **与第3章（固定资产）**：折旧方法与年限的会计估计变更，会同时改变本期折旧额与暂时性差异方向（2020-5、2022-3）。\n- **与第5章（投资性房地产）、第13章（金融工具与保险合同）**：公允价值模式下投资性房地产与以公允价值计量的金融资产，持有期间公允价值变动不计入应纳税所得额→计税基础维持成本；其递延所得税影响视资产分类分别计入损益或其他综合收益（2019-1、2019-4）。\n- **与第6章（长期股权投资与合营安排）**：权益法下长期股权投资相关的应纳税暂时性差异，拟长期持有且能控制转回时间、可预见未来不会转回时不确认递延所得税负债；有处置计划或划分为持有待售时应确认（2020-7、2021-7）。\n- **与第10章（股份支付）**：股份支付费用的可税前扣除金额取决于未来行权时的股票公允价值，递延所得税资产按期末股价估计，超出部分计入资本公积。\n- **与第14章（租赁）**：租赁期开始日初始确认租赁负债与使用权资产属「单项交易」，须分别确认递延所得税资产与负债（教材例19-23）。\n- **与第15章（持有待售）**：长期股权投资部分划分为持有待售时，需重新评估是否仍满足不确认递延所得税负债的两个条件（2021-7）。\n- **与第21章（债务重组）、第2章（存货）**：债权人受让资产的入账金额、存货可变现净值均影响账面价值与计税基础之差，进而影响递延所得税资产确认（2021-5、2021-6）。\n- **与第26章（企业合并）、第27章（合并财务报表）**：购买日公允价值调整、商誉初始确认豁免、内部交易未实现损益的内部递延所得税，是合并大题的标准配套（2016-10、2016-11、2018-5、2018-6、2018-7、2022-11）。\n",
    "20": "# 第二十章 非货币性资产交换\n\n> 本题库考察频次：2 题 ｜ 优先级：C ｜ 建议投入：通读一遍，抓住\"25% 补价认定 + 商业实质 + 公允价值/账面价值两条计量路径\"\n\n## 考点清单\n### 非货币性资产交换的概念与非货币性资产的界定\n- **优先级**：★★★\n- **内容**：**货币性资产**是指企业持有的货币资金和收取**固定或可确定金额**的货币资金的权利，包括现金、银行存款、应收账款和应收票据等；**非货币性资产**是指货币性资产以外的资产，其在将来为企业带来的经济利益（即货币金额）是**不固定的或不可确定的**，如存货（原材料、包装物、低值易耗品、库存商品等）、固定资产、在建工程、生产性生物资产、无形资产、投资性房地产、长期股权投资等。**非货币性资产交换**是指企业主要以固定资产、无形资产、投资性房地产和长期股权投资等非货币性资产进行的交换，该交换**不涉及或只涉及少量的货币性资产（即补价）**。\n- **易错**：判断某项资产是否非货币性资产，看的是**未来经济利益金额是否固定或可确定**，不是看形态。固定资产、无形资产、存货等均属非货币性资产；应收账款、应收票据属**货币性**资产。\n\n### 非货币性资产交换的认定：补价比例是否低于 25%\n- **优先级**：★★★\n- **内容**：认定涉及少量货币性资产的交换为非货币性资产交换，通常以**补价占整个资产交换金额的比例是否低于 25%** 作为参考比例（教材锚点：`（三）非货币性资产交换的认定`）。\n- **计算/分录**：\n  | 企业角色 | 比例计算 | 结论 |\n  |---|---|---|\n  | 收到补价方 | 收到的补价的**公允价值** ÷ 换出资产**公允价值**（或：收到的补价 ÷ (换入资产公允价值 + 收到的货币性资产)） | **低于 25%** → 属非货币性资产交换 |\n  | 支付补价方 | 支付的货币性资产的**公允价值** ÷ (换出资产公允价值 + 支付的补价的公允价值)（或：支付的补价 ÷ 换入资产公允价值) | **低于 25%** → 属非货币性资产交换 |\n\n  上述比例**高于 25%（含 25%）**的，**不视为**非货币性资产交换，适用《企业会计准则第 14 号——收入》等相关准则。\n- **易错**：①**分子分母口径不同**——收到补价方分母用**换出资产**公允价值，支付补价方分母用**换出资产公允价值 + 支付的补价**（即换入资产口径）；②是**低于** 25%，**等于 25%** 不算非货币性资产交换；③分母一律用**公允价值**而非账面价值。\n- **考察**：2016-3\n\n### 不适用非货币性资产交换准则的交易和事项\n- **优先级**：★★\n- **内容**：以下交易**不适用**本准则：①**换出资产为存货**的（企业以存货换取客户的非货币性资产，如固定资产、无形资产等，换出存货的企业适用**第 14 号收入**）；②涉及**企业合并**的（适用第 20 号企业合并、第 2 号长期股权投资、第 33 号合并财务报表）；③涉及由**第 22 号金融工具确认和计量**规范的金融资产的；④构成**权益性交易**的（如集团重组中发生的非货币性资产划拨、划转，在股东或最终控制方安排下无代价或以明显不公平的代价转让/接受非货币性资产，实质是**权益性分配或权益性投入**，不确认构成权益交易部分的相关损益）；⑤从政府**无偿取得**非货币性资产的（适用第 16 号政府补助）；⑥将非流动资产或处置组**分配给所有者**的（适用第 42 号持有待售）；⑦以非货币性资产向**职工发放非货币性福利**的（适用第 9 号职工薪酬）；⑧以**发行股票**形式取得非货币性资产的（相当于以权益工具换入资产，成本按相关资产准则确定）；⑨用于交换的资产**尚未列报于资产负债表上、或不存在、或尚不属于本企业**的。\n- **易错**：①\"换出**存货**\"不适用本准则——这是最高频的陷阱（以存货换固定资产要**确认收入、结转成本**，不是非货币性资产交换）；②判断是否构成权益性交易应遵循**实质重于形式**原则；③用于交换的资产必须**符合资产定义、满足确认条件且已列报于资产负债表**。\n\n### 商业实质的判断（两项条件之一）\n- **优先级**：★★★\n- **内容**：满足下列**条件之一**的，表明换入资产与换出资产具有**商业实质**：①换入资产的未来现金流量在**风险、时间分布或金额**方面与换出资产**显著不同**；②使用换入资产所产生的**预计未来现金流量现值**与继续使用换出资产所产生的预计未来现金流量现值**不同**，且其**差额与换入资产和换出资产的公允价值相比是重大的**。\n- **计算/分录**：\n  ```\n  条件②计算口径：按资产在持续使用过程及最终处置时预计产生的\"税后\"未来现金流量\n                （使用企业自身的所得税税率），按\"企业自身\"而非市场参与者的折现率折现\n  ```\n- **易错**：①注意是\"**之一**\"即可，不是同时满足；②\"显著不同\"看的是**风险、时间分布、金额**三个维度中的任意一个；③条件②中现金流量的折现口径是**税后**流量 + **企业自身**折现率——与第七章资产减值中\"税前折现率\"的**口径完全不同，不要混淆**；④典型情形：租期、租金总额相同但**承租人信用状况不同**导致风险不同 → 具有商业实质。\n- **考察**：2016-3\n\n### 计量基础的选择：公允价值 vs 账面价值\n- **优先级**：★★★\n- **内容**：非货币性资产交换**同时满足**下列两个条件的，应当以**公允价值**为基础计量：①该项交换**具有商业实质**；②换入资产**或**换出资产的**公允价值能够可靠计量**。不同时满足上述两个条件的（**不具有商业实质**，或者**换入资产和换出资产的公允价值均不能可靠计量**），应当以**账面价值**为基础计量。\n- **易错**：①条件②是换入资产\"**或**\"换出资产公允价值能可靠计量，二者有其一即可；②条件①和②必须**同时满足**才用公允价值；③**只要公允价值不能可靠计量就退回账面价值口径**，此时**无论是否支付补价均不确认损益**；④补价比例 25% 是\"是否属于非货币性资产交换\"的门槛，与\"用公允价值还是账面价值\"是**两回事**，不要混为一谈。\n- **考察**：2016-3\n\n### 以公允价值计量：换入资产成本的确定与涉及补价\n- **优先级**：★★★\n- **内容**：以公允价值为基础计量时，**不涉及补价**的，以**换出资产的公允价值**（或换入资产的公允价值）加上**应支付的相关税费**作为换入资产的初始计量金额；**涉及补价**的，按下列方式确定（教材锚点：`（工）涉及补价的情况`，位于\"以公允价值为基础的计量\"下）：支付补价方在换出资产公允价值基础上**加上**支付的补价，收到补价方在换出资产公允价值基础上**减去**收到的补价（涉及相关税费另加）。\n- **计算/分录**：\n  ```\n  支付补价方：换入资产成本 = 换出资产公允价值 + 支付的补价 + 应支付的相关税费\n  收到补价方：换入资产成本 = 换出资产公允价值 − 收到的补价 + 应支付的相关税费\n               （教材例 20-3 数据：换入资产总成本 = 1 450 − 40.5 + 0 = 1 409.5 万元）\n  增值税：换出资产按税法规定\"视同销售\"，计算增值税销项税额；\n          换入资产的增值税进项税额（符合抵扣条件）不计入换入资产成本\n  ```\n- **易错**：①以换出资产公允价值为基础时，**换出资产的增值税销项税额不构成换入资产成本**，换入资产的**进项税额单独确认**；②补价是\"公允价值\"口径，不是账面价值；③多项资产的交换中，如以换入资产公允价值为基础计量，则**各项换入资产直接按各自公允价值 + 应支付的相关税费**作为初始计量金额，不走分摊。\n\n### 以账面价值计量：确定换入资产成本、不确认损益\n- **优先级**：★★★\n- **内容**：以**账面价值**为基础计量时：**不涉及补价**的，以**换出资产的账面价值**和应支付的相关税费作为换入资产的初始计量金额，换出资产**终止确认时不确认损益**；**涉及补价**的，将补价作为确定换入资产初始计量金额的**调整因素**——支付补价方以换出资产账面价值**加上支付补价的账面价值**和应支付的相关税费；收到补价方以换出资产账面价值**减去收到补价的公允价值**，加上应支付的相关税费。**无论是否支付补价，均不确认损益**。\n- **计算/分录**：\n  ```\n  支付补价方：换入资产成本 = 换出资产账面价值 + 支付补价的账面价值 + 应支付的相关税费\n  收到补价方：换入资产成本 = 换出资产账面价值 − 收到补价的公允价值 + 应支付的相关税费\n  ```\n- **易错**：①**支付**补价方用**补价的账面价值**，**收到**补价方用**补价的公允价值**——这两个口径不对称，是常见命题点；②以账面价值计量**不论是否涉及补价都不确认损益**，补价只是**调整换入资产成本**；③公允价值不能可靠计量时，即使交换\"看起来公平\"，也**必须**按账面价值计量。\n\n### 换出资产损益的科目归属\n- **优先级**：★★★\n- **内容**：以公允价值为基础计量时，换出资产公允价值与其账面价值的差额**计入当期损益**，按换出资产类别分别归属：\n  | 换出资产 | 差额的科目归属 / 处理 |\n  |---|---|\n  | **存货** | 按第 14 号收入准则**确认收入并结转成本**（该交换本身不适用本章） |\n  | **固定资产、无形资产** | 计入\"**资产处置损益**\" |\n  | **长期股权投资** | 计入\"**投资收益**\" |\n  | **投资性房地产** | 按换出资产（或换入资产）公允价值确认\"**其他业务收入**\"，按账面价值结转\"**其他业务成本**\"，差额计入当期损益 |\n  | **金融资产** | 先按第 22 号、第 23 号判断是否满足**终止确认**条件并作终止确认处理 |\n- **易错**：①换出固定资产/无形资产走\"**资产处置损益**\"（不是\"营业外收入/支出\"）；②换出**交易性金融资产**走\"**投资收益**\"，并同时把原计入**公允价值变动损益**的金额转入投资收益；③换出投资性房地产走\"**其他业务收入/其他业务成本**\"，不走资产处置损益。\n- **考察**：2016-3\n\n### 同时换入或换出多项资产的成本分摊\n- **优先级**：★★\n- **内容**：涉及多项非货币性资产交换时，企业**无法将换出的某一资产与换入的某一特定资产相对应**，计量时同样先判断是否符合以公允价值计量的两个条件，再分情况确定各项换入资产的成本。\n  | 计量基础 | 情形 | 处理 |\n  |---|---|---|\n  | **公允价值**（以换出资产公允价值为基础） | 同时换入多项 | 按各项换入资产**公允价值的相对比例**（不能可靠计量的，按各项换入资产**原账面价值的相对比例**或其他合理比例）分摊 |\n  | **公允价值**（以换出资产公允价值为基础） | 同时换出多项 | 各项换出资产公允价值与账面价值的差额，在各项换出资产**终止确认时**计入当期损益 |\n  | **公允价值**（以换入资产公允价值为基础） | 同时换入多项 | 以各项换入资产**各自的公允价值**和应支付的相关税费作为各项换入资产的初始计量金额 |\n  | **公允价值**（以换入资产公允价值为基础） | 同时换出多项 | 按各项换出资产**公允价值的相对比例**（不能可靠计量的按**账面价值**相对比例），将换入资产公允价值总额（涉及补价的，减去支付补价或加上收到补价的**公允价值**）分摊至各项换出资产，分摊额与各项换出资产账面价值的差额计入当期损益 |\n  | **账面价值** | 同时换入多项 | 按各项换入资产**公允价值的相对比例**（不能可靠计量的，可**按各项换入资产原账面价值的相对比例**或其他合理比例），将换出资产账面价值总额（涉及补价的，**加上支付补价的账面价值或减去收到补价的公允价值**）分摊，加上应支付的相关税费，作为各项换入资产的初始计量金额；同时换出多项资产**均不确认损益** |\n- **易错**：①同时换出的多项资产中**包含金融资产**的，应当先按第 22 号、第 23 号判断并处理终止确认；在确定**其他各项**换出资产终止确认的相关损益时，终止确认的**金融资产公允价值应当从换入资产公允价值总额中扣除**；②以换入资产公允价值为基础时，换出资产的分摊是**倒推**（用换入资产公允价值总额分摊至换出资产），分摊额与账面价值的差额才计入损益；③同时换入多项资产的公允价值比例**不能可靠计量**时，退到**账面价值**相对比例，而不是不分摊。\n- **考察**：—\n\n## 本章易错陷阱汇总\n\n1. **25% 是\"低于\"，等于 25% 不属于**非货币性资产交换；分子分母口径**收付补价方不对称**（收到补价方分母为换出资产公允价值；支付补价方分母为换出资产公允价值 + 支付的补价）。\n2. **换出存货**不适用本章，适用收入准则，要**确认收入并结转成本**；涉及企业合并、构成**权益性交易**、政府无偿划入等同样不适用本章。\n3. **商业实质**只需满足\"风险/时间分布/金额显著不同\"**或**\"预计未来现金流量现值差额重大\"之一；条件②用**税后**流量 + **企业自身**折现率，与第七章资产减值\"税前折现率\"口径不同。\n4. **公允价值计量需同时满足**\"具有商业实质\"**且**\"换入或换出资产公允价值能可靠计量\"；否则一律按**账面价值**计量，**不确认损益**。\n5. **支付补价方用补价的账面价值、收到补价方用补价的公允价值**（账面价值计量口径下的不对称）。\n6. 换出资产损益科目：固定资产/无形资产 → **资产处置损益**；长期股权投资 → **投资收益**；投资性房地产 → **其他业务收入/其他业务成本**；**不要写成营业外收支**。\n7. **增值税**：换出资产视同销售计销项税额；换入资产可抵扣的进项税额**不计入**换入资产成本。\n8. 同时换出多项资产中含**金融资产**时，其公允价值应从换入资产公允价值总额中**先扣除**，再确定其他资产的损益。\n\n## 本章分录模板（如适用）\n\n```\n【以公允价值计量——换出固定资产换入固定资产（不涉及补价）】\n借：固定资产清理                     （账面净值）\n    累计折旧\n    贷：固定资产\n借：固定资产清理                     （清理费用等）\n    贷：银行存款\n借：固定资产——换入资产              （换出资产公允价值 + 相关税费）\n    应交税费——应交增值税（进项税额）\n    资产处置损益                     （换出资产公允价值 < 账面价值时在借方，反之在贷方）\n    贷：固定资产清理\n        应交税费——应交增值税（销项税额）\n\n【以公允价值计量——换出长期股权投资】\n借：长期股权投资/固定资产等（换入资产）\n    投资收益                     （差额损失，收益则在贷方）\n    贷：长期股权投资             （账面价值）\n\n【以账面价值计量（涉及补价）】\n支付补价方：借：换入资产（换出资产账面价值 + 支付补价的账面价值 + 相关税费）\n            贷：换出资产（账面价值）、银行存款\n收到补价方：借：换入资产（换出资产账面价值 − 收到补价的公允价值 + 相关税费）\n                银行存款\n            贷：换出资产（账面价值）\n            ※ 以上两种情形均不确认损益\n```\n\n## 与其他章的联动\n\n- 与第二章（存货）、第三章（固定资产）、第四章（无形资产）、第五章（投资性房地产）：本章的换入资产成本是这些章节初始计量的**特殊来源**；**换出存货**要回到第 14 号收入准则确认收入并结转成本。\n- 与第六章（长期股权投资与合营安排）：以长期股权投资作为换出/换入资产时的成本确定与损益归属（**投资收益**）。\n- 与第十三章（金融工具）：换出或换入金融资产时，需先按第 22 号、第 23 号准则判断**终止确认**；换出交易性金融资产确认投资损失的同时，要将原公允价值变动损益转入投资收益（2016-3 的核心陷阱）。\n- 与第十七章（收入、费用和利润）：换出存货构成收入交易，损益通过\"主营业务收入/主营业务成本\"体现。\n- 与第十五章（持有待售的非流动资产、处置组和终止经营）：将非流动资产或处置组分配给所有者不适用本章。\n- 与第七章（资产减值）：用于交换的资产已计提减值准备的，其**账面价值**为扣除减值准备后的金额，会影响换出资产损益与换入资产成本的确定。\n",
    "21": "# 第二十一章 债务重组\n\n> 本题库考察频次：3 题 ｜ 优先级：C ｜ 建议投入：通读一遍＋默写分录（债务人与债权人两侧的分录必须能分别默写，组合方式与受让处置组是常考落点）\n\n> 题号核对说明：本题库中教材定位写明\"债务重组\"的题号为 **2016-4、2017-7、2020-10**（共 3 题，与给定频次一致）。另有第 4 道债务重组题 **2021-6**（债权人受让无形资产的计量与持有待售），其 `textbookRef` 将章号误标为\"第20章 债务重组\"——按教材章序，债务重组是第二十一章，故该题实为本章考题，本清单在\"债权人\"与\"非金融资产入账价值\"两处同步引用了它，请一并对齐复习。\n\n## 考点清单\n### 债务重组的定义（不改变交易对手方、重新达成协议）\n- **优先级**：★★★\n- **内容**：**债务重组**是在**不改变交易对手方**的情况下，经债权人与债务人协商一致或者依法院裁定，就清偿债务的**时间、金额或者方式**重新达成协议的交易。债务重组**不强调**债务人发生财务困难，也**不论债权人是否作出让步**——只要双方就债务条款重新达成协议，就符合债务重组的定义（例如：债权人减免部分债务本金同时提高剩余债务利息；债权人同意债务人用等值库存商品抵偿到期债务）。债务重组涉及的债权和债务，是指第 22 号准则规范的债权和债务，**包括租赁应收款和租赁应付款**，但**不包括合同资产、合同负债、预计负债**。\n- **易错**：①关键词是\"**不改变交易对手方**\"——有第三方参与（如第三方代债务人偿债、新组建公司承接原债务、资产管理公司购得债权后再与债务人重组）时，应当**首先考虑债权和债务是否终止确认**，适用第 22 号、第 23 号准则，**再**适用第 12 号债务重组准则；②\"**不强调财务困难、不论是否让步**\"是 2019 年修订后的重大变化，不要再套用旧准则\"债务人财务困难 + 债权人作出让步\"的双条件。\n\n### 不属于债务重组的情形（权益性交易）\n- **优先级**：★★★\n- **内容**：债务重组中，交易实质是**一方向另一方进行了权益性分配或接受了另一方的权益性投入**的，应当适用**权益性交易**的会计处理规定，**不确认债务重组相关损益**。典型情形：债权人是债务人的**股东**，以股东身份而非市场交易者身份参与交易——例如甲公司是乙公司股东，在乙公司具有充足偿债能力的情况下仍免除其 800 万元本金，该项交易应作为**权益性交易**处理。判断时应当遵循**实质重于形式**原则。\n- **易错**：①**部分豁免要拆分**——若债务人确实出现财务困难，其他债权人（不含股东）对债务普遍减半豁免，股东比照其他债权人同等减半豁免的 500 万元**确认**债务重组损益，而**多豁免**的 300 万元属于**权益性交易**，**不确认**损益；②**代持也要穿透**——债权人对债务人的权益性投资通过他人代持、债权人虽不具股东身份但实质上拥有股东权利的，也应认为构成权益性交易。\n\n### 债权和债务的终止确认时点\n- **优先级**：★★★\n- **内容**：债务重组中涉及债权和债务的终止确认，应遵循第 22 号、第 23 号准则的规定。**债权人**在**收取债权现金流量的合同权利终止**时终止确认债权；**债务人**在**债务的现时义务解除**时终止确认债务。对于**以资产清偿债务或将债务转为权益工具**方式：债务人在交付资产或权益工具时解除了清偿债务的现时义务，**一般可以**终止确认该债务；债权人在拥有或控制相关资产时，收取债权现金流量的合同权利通常也同时终止，**一般可以**终止确认该债权。\n- **易错**：①债务重组通常需要经历较长时间（如**破产重整**中的债务重组），**在签署债务重组合同的时点，如果债务的现时义务尚未解除，债务人不能确认债务重组相关损益**；②对于在报告期间已经开始协商、但在报告期**资产负债表日后完成**的债务重组，**不属于**资产负债表日后调整事项；③终止确认债权时，债权人应**结转已计提的减值准备中对该债权终止确认部分的金额**；分类为以公允价值计量且其变动计入其他综合收益的债权，之前计入其他综合收益的累计利得或损失应从其他综合收益中**转出，计入\"投资收益\"**。\n\n### 债权人的会计处理（受让金融资产、非金融资产与多项资产）\n- **优先级**：★★★\n- **内容**：①**受让金融资产**（含现金的单项或多项）：按第 22 号准则确认和计量，**初始确认时以其公允价值计量**，金融资产确认金额与债权终止确认日账面价值之间的差额，记入\"**投资收益**\"；②**受让非金融资产**：以**成本**计量，成本包括**放弃债权的公允价值**以及使该资产达到当前位置和状态（或预定可使用状态/预定用途）所发生的、可直接归属于该资产的**税金、运输费、装卸费、保险费、安装费、专业人员服务费**等其他成本（固定资产成本还应考虑**预计弃置费用**因素），**放弃债权的公允价值与账面价值之间的差额，记入\"投资收益\"**；③**受让多项资产**（非金融资产多项，或含金融资产与非金融资产的组合）：先按第 22 号确认和计量受让的金融资产，再按**受让的金融资产以外的各项资产在债务重组合同生效日的公允价值比例**，对**放弃债权在合同生效日的公允价值扣除受让金融资产当日公允价值后的净额**进行分配，并以此为基础分别确定各项资产的成本。\n- **计算/分录**：\n  ```\n  【受让单项非金融资产】\n  借：无形资产 / 固定资产 / 存货等（放弃债权的公允价值 + 可直接归属的税费等）\n      坏账准备\n      投资收益                      （放弃债权账面价值 > 受让资产入账价值时的差额）\n      贷：应收账款 / 债权投资等（账面余额）\n          银行存款（支付的评估费、运输费、安装费等）\n  ※ 反之若入账价值大于放弃债权账面价值，差额在\"投资收益\"贷方\n\n  【受让多项资产】待分配净额 = 放弃债权在合同生效日的公允价值 − 受让金融资产当日公允价值\n  各项非金融资产成本 = 待分配净额 × 该项资产在合同生效日的公允价值 ÷ 各非金融资产公允价值之和\n  ```\n- **易错**：①债权人受让的**非金融资产不按受让资产自身的公允价值**计量，而以**放弃债权的公允价值**为基础——这是本准则最核心、最容易考错的一点；②受让金融资产与其他资产**分别处理、混合分配时金融资产先单独按公允价值确认**，再以扣除后的净额分配；③放弃债权的公允价值与账面价值的差额一律走\"**投资收益**\"（旧准则的\"营业外支出\"口径已不再使用）；④受让资产的**可直接归属税费**要计入资产成本（教材例 21-1：债权人取得无形资产成本 = 债权公允价值 87 + 评估费用 4 = 91 万元）。\n- **考察**：2017-7（债权人受让联营企业股权，并以放弃债权公允价值作为初始投资成本，后续按权益法核算）、2021-6（债权人受让无形资产，入账价值应为 500 万元、以放弃债权公允价值为基础确定，债务重组本身不确认损益）\n\n### 债权人取得资产被划分为持有待售类别的处理\n- **优先级**：★★\n- **内容**：债务人以资产或处置组清偿债务，且债权人在**取得日**未将受让的相关资产或处置组作为非流动资产和非流动负债核算，而是将其**划分为持有待售类别**的，债权人应当在初始计量时，比较假定其**不划分为持有待售类别情况下的初始计量金额**和**公允价值减去出售费用后的净额**，以**两者孰低**计量；公允价值减去出售费用后的净额**低于**不划分为持有待售类别情况下初始计量金额的差额，记入\"**资产减值损失**\"科目。\n- **计算/分录**：\n  ```\n  教材例 21-1 延伸：无形资产入账价值 91 万元 vs 公允价值减出售费用 87 − 1 = 86 万元 → 取 86 万元\n  借：持有待售资产——无形资产 86\n      坏账准备 7\n      投资收益 1\n      资产减值损失 5\n      贷：应收账款 95\n          银行存款 4\n  ```\n- **易错**：①比较的另一方是\"**假定不划分为持有待售类别情况下的初始计量金额**\"（即按\"放弃债权公允价值 + 可直接归属税费\"算出来的金额），**不是**放弃债权的账面价值；②差额走\"**资产减值损失**\"而**不是**投资收益；③\"投资收益 1 万元\"是合同生效日放弃债权公允价值 87 与账面价值（95 − 7 = 88）的差额，要与资产减值损失分开看，不要合并成一项。\n- **考察**：2021-6（债权人受让的无形资产于取得日被划分为持有待售类别：确认资产减值损失 45 万元、递延所得税资产 11.25 万元）\n\n### 债权人受让处置组的初始计量\n- **优先级**：★★★\n- **内容**：债务人以**处置组**清偿债务的，债权人应当：①分别按第 22 号准则和其他相关准则的规定，对处置组中的**金融资产和负债**进行初始计量；②按**金融资产以外的各项资产在债务重组合同生效日的公允价值比例**，对\"**放弃债权在合同生效日的公允价值 + 承担的处置组中负债的确认金额**，扣除**受让金融资产当日公允价值**后的净额\"进行分配，并以此为基础分别确定各项资产的成本；③**放弃债权的公允价值与账面价值之间的差额，记入\"投资收益\"**。\n- **计算/分录**：\n  ```\n  待分配净额 = 放弃债权在合同生效日的公允价值 + 承担的处置组中负债的确认金额\n               − 受让金融资产公允价值 − 可抵扣的增值税进项税额\n  固定资产/无形资产等成本 = 待分配净额 × 该项资产公允价值 ÷ 各非金融资产公允价值之和\n\n  【题库 2020-10 口径】\n  借：其他债权投资 410\n      固定资产    1 080\n      无形资产      720\n      应交税费——应交增值税（进项税额） 102\n      坏账准备      400\n      贷：应收账款        2 302\n          短期借款          200\n          投资收益          210\n  ```\n- **易错**：①分配基数是\"**放弃债权公允价值 + 承担的处置组中负债的确认金额**\"再扣金融资产公允价值——**负债金额要加进来**，这是受让处置组与受让普通多项资产的关键差别；②可抵扣的**增值税进项税额不计入资产成本**；③处置组中的**金融资产按公允价值单独计量**（如其他债权投资 410 万元），**负债按公允价值计量**（如短期借款 200 万元），不参与按比例分摊。\n- **考察**：2020-10\n\n### 债务人的会计处理：以资产清偿债务、债转股与组合方式\n- **优先级**：★★★\n- **内容**：①**以资产清偿债务**：将**所清偿债务的账面价值**与**转让资产的账面价值**之间的差额，计入\"**其他收益——债务重组收益**\"；以**存货**清偿债务的，债务人**不确认销售收入、不结转销售成本**，按**存货账面价值**结转；②**将债务转为权益工具**（债转股）：初始确认时按**权益工具的公允价值**计量，权益工具的公允价值**不能可靠计量**的，按**所清偿债务的公允价值**计量；③**组合方式**：对于权益工具，按权益工具的公允价值计量（不能可靠计量时按所清偿债务的公允价值）；对于修改其他条款形成的重组债务，参照\"修改其他条款\"的规定确认和计量；**所清偿债务的账面价值与转让资产的账面价值以及权益工具和重组债务的确认金额之和的差额，记入\"其他收益——债务重组收益\"（仅涉及金融工具、长期股权投资时记入\"投资收益\"）**。\n- **计算/分录**：\n  ```\n  【题库 2016-4 口径（以资产清偿 + 债转股的组合方式）】\n  债务重组收益 = 所清偿债务账面价值 1 000\n               − 转让资产账面价值（存货成本 415 − 存货跌价准备 5 = 410）\n               − 现金 100 − 权益工具公允价值（100 万股 × 2.2 元/股 = 220） = 270（万元）\n  借：应付账款              1 000\n      存货跌价准备              5\n      贷：银行存款              100\n          库存商品              415\n          股本                  100        （面值总额）\n          资本公积——股本溢价      120        （220 − 100）\n          其他收益——债务重组收益  270\n\n  【教材例 21-3 口径（以存货 + 固定资产 + 债权投资抵债）】\n  借：应付账款 234\n      贷：固定资产清理（账面价值 + 运输费）\n          库存商品（成本 70）\n          应交税费——应交增值税（销项税额）21.45\n          债权投资——成本 15\n          其他收益——债务重组收益 34.9\n  ※ 债务人不确认商品销售收入、不结转销售成本，也不产生\"进项税额转出\"\n  ```\n- **易错**：①以存货抵债**不确认收入、不结转成本、不产生销项税额的\"发出商品\"处理**，同时**不属于进项税额转出**；②债转股时把权益工具公允价值**全额计入股本**是错的——应按**面值总额计入\"股本\"**，差额计入\"**资本公积——股本溢价（资本溢价）**\"；③差额的科目是\"**其他收益——债务重组收益**\"（旧准则为\"营业外收入\"），**只有在仅涉及金融工具、长期股权投资时**才记入\"投资收益\"；④因**破产重整**进行的债务重组，由于协议执行过程及结果存在重大不确定性，企业通常应在**破产重整协议履行完毕后**确认债务重组收益，除非有确凿证据表明不确定性已消除。\n- **考察**：2016-4\n\n### 修改其他条款：10% 实质性修改门槛\n- **优先级**：★★★\n- **内容**：①**实质性修改的判定**：如果**重组债务未来现金流量（包括支付和收取的某些费用）的现值**与**原债务的剩余期间现金流量现值**之间的差异**超过 10%**，则意味着新的合同条款进行了\"**实质性修改**\"，或者重组债务是\"**实质上不同**\"的；有关现值的计算**均采用原债务的实际利率**。②**债务人**：作出实质性修改形成重组债务，或以承担\"实质上不同\"的重组债务替换原债务的，应当**终止确认原债务**，同时按照修改后的条款**确认一项新金融负债**（按公允价值计量），终止确认的债务账面价值与重组债务确认金额之间的差额记入\"**投资收益**\"；**未（或仅部分）导致债务终止确认**的，未终止确认部分继续按**原分类**进行后续计量，以摊余成本计量的债务应根据重新议定合同的现金流量变化情况，按**原实际利率**折现的现值**重新计算该重组债务的账面价值**，相关利得或损失记入\"投资收益\"。③**债权人**：整体考虑是否对全部债权的合同条款作出实质性修改；作出实质性修改或以实质上不同的新金融资产替换债权的，**终止确认原债权**，按修改后的条款以**公允价值**初始计量新金融资产，差额记入\"**投资收益**\"；未导致债权终止确认的，按原分类继续后续计量。④修改或重新议定合同所产生的**成本或费用**，应当**调整修改后的重组债权/债务的账面价值**，并在剩余期限内**摊销**。\n- **易错**：①**10% 的分母/口径**：比较的是\"未来现金流量现值\"的**差异率**，折现一律用**原债务（债权）的实际利率**——不是市场利率、不是名义利率；②是\"**超过** 10%\"，恰好等于 10% 时**不构成**实质性修改；③修改其他条款时债务人的差额走\"**投资收益**\"，**不是**\"其他收益——债务重组收益\"；④未导致终止确认时以摊余成本计量的，重新计算用的是**原实际利率**，购买或源生的**已发生信用减值**的重组债权应按**经信用调整的实际利率**折现。\n- **考察**：2020-10\n\n### 债务重组的披露要求\n- **优先级**：★\n- **内容**：债务重组中涉及的债权、重组债权、债务、重组债务和其他金融工具的披露，按第 37 号金融工具列报的规定处理；此外，债权人和债务人还应当在**附注**中披露与债务重组有关的额外信息。**债权人**：①根据债务重组方式，**分组披露债权账面价值和债务重组相关损益**（可按\"以资产清偿债务方式、将债务转为权益工具方式、修改其他条款方式、组合方式\"为标准分组，也可按重要性原则以更细化的标准分组）；②债务重组导致的**对联营企业或合营企业的权益性投资增加额**，以及该投资占联营企业或合营企业股份总额的比例。**债务人**：根据债务重组方式，分组披露债务账面价值和债务重组相关损益。\n- **易错**：①披露要求是\"**分组**披露账面价值 + 债务重组相关损益\"，债务人与债权人的分组口径一致（按四种重组方式）；②只有**债权人**才需要披露\"权益性投资增加额及持股比例\"。\n- **考察**：—\n\n## 本章易错陷阱汇总\n\n1. **\"不改变交易对手方\"是定义核心**；有第三方参与时先按第 22、23 号准则判断**债权债务是否终止确认**，再适用债务重组准则。\n2. 债务重组**不强调财务困难、不论债权人是否让步**；但**权益性交易**部分（股东身份豁免、代持穿透）**不确认**债务重组损益，部分豁免要**拆分**处理。\n3. **终止确认时点**：债务人以\"**现时义务解除**\"为准，债权以\"**合同权利终止**\"为准；**签署合同日尚未解除义务时不能确认损益**；资产负债表日后完成的债务重组**不属于**日后调整事项。\n4. 债权人受让**非金融资产以放弃债权的公允价值为基础**，**不按受让资产自身公允价值**；差额走\"**投资收益**\"。\n5. 债权人受让**处置组**的分配基数 = 放弃债权公允价值 **+ 承担的处置组负债确认金额** − 受让金融资产公允价值（还要扣可抵扣进项税额）。\n6. 债权人取得资产**划分为持有待售**的，按\"假定不划分为持有待售时的初始计量金额\"与\"公允价值减出售费用\"**孰低**，差额走\"**资产减值损失**\"。\n7. 债务人以**存货**抵债**不确认收入、不结转成本**，也不作\"进项税额转出\"。\n8. 债转股时权益工具公允价值**全额计入股本是错的**，应按面值计入\"股本\"、差额计入\"资本公积——股本溢价\"；权益工具公允价值不能可靠计量时**按所清偿债务的公允价值**计量。\n9. 债务人差额科目：资产清偿/债转股/组合方式 → \"**其他收益——债务重组收益**\"（仅涉及金融工具、长期股权投资时走\"投资收益\"）；**修改其他条款** → \"**投资收益**\"。**不要混用**。\n10. **10% 门槛用原实际利率折现的现值差异率**，\"超过 10%\"才是实质性修改，恰好等于 10% 不算。\n11. **破产重整**的债务重组收益通常在**协议履行完毕后**确认。\n\n## 本章分录模板（如适用）\n\n```\n【一、债务人以资产清偿债务】\n借：应付账款                        （所清偿债务账面价值）\n    存货跌价准备 / 累计折旧 / 固定资产减值准备 / 无形资产累计摊销等\n    贷：银行存款 / 库存商品 / 固定资产清理 / 无形资产 / 长期股权投资等（账面价值）\n        其他收益——债务重组收益      （差额，可能在借方则记\"投资收益\"）\n※ 以存货清偿：不确认收入、不结转成本；抵债资产应缴增值税销项税额单独贷记\n\n【二、债务人将债务转为权益工具（债转股）】\n借：应付账款                        （所清偿债务账面价值）\n    贷：股本                        （权益工具面值总额）\n        资本公积——股本溢价/资本溢价（权益工具公允价值 − 面值总额）\n        银行存款                    （发行权益工具的相关税费）\n        其他收益——债务重组收益      （差额）\n※ 权益工具公允价值不能可靠计量时，按所清偿债务的公允价值计量\n\n【三、债权人受让资产】\n借：无形资产 / 固定资产 / 存货 / 长期股权投资等\n                                    （放弃债权的公允价值 + 可直接归属的税费等；\n                                     多项资产时按各自合同生效日公允价值比例分摊）\n    交易性金融资产 / 其他债权投资等 （按公允价值单独计量）\n    应交税费——应交增值税（进项税额）\n    坏账准备                        （结转已计提的减值准备）\n    投资收益                        （差额）\n    贷：应收账款 / 贷款等            （账面余额）\n        银行存款                    （支付的评估费、安装费等）\n        短期借款等                  （受让处置组时承担的负债，按公允价值）\n※ 划分为持有待售的，按\"不划分为持有待售的初始计量金额\"与\"公允价值减出售费用\"孰低，\n   差额借记\"资产减值损失\"\n\n【四、修改其他条款（不构成实质性修改，以摊余成本计量）】\n债务人：按原实际利率折现的现值重新计算重组债务账面价值，差额记\"投资收益\"\n债权人：按原实际利率折现的现值重新计算重组债权账面余额，差额记\"投资收益\"；\n        修改或重新议定合同的成本或费用，调整账面价值后在剩余期限内摊销\n※ 未来现金流量现值差异\"超过 10%\"→ 实质性修改 → 终止确认原债务/债权，\n   按公允价值确认新金融负债/新金融资产，差额记\"投资收益\"\n```\n\n## 与其他章的联动\n\n- 与第六章（长期股权投资与合营安排）：债务重组中债权人受让股权导致对联营企业或合营企业权益性投资增加时，按**权益法**核算，并以**放弃债权的公允价值**确认初始投资成本；初始投资成本小于应享有可辨认净资产公允价值份额的差额计入**营业外收入**（2017-7：初始投资成本 800 万元、应享份额 875 万元、差额 75 万元计入营业外收入，后续按权益法确认损益调整 70 万元）。\n- 与第十三章（金融工具）：债务重组涉及的债权、债务、重组债权、重组债务的**终止确认与计量**均遵循第 22 号、第 23 号准则；债权人受让的**金融资产按公允价值**单独计量；分类为以公允价值计量且其变动计入其他综合收益的债权终止确认时，累计利得或损失从其他综合收益转出计入投资收益。\n- 与第十五章（持有待售的非流动资产、处置组和终止经营）：债权人取得的资产或**处置组**划分为持有待售的，按孰低计量，差额计入资产减值损失。\n- 与第十七章（收入、费用和利润）：以**存货**清偿债务**不确认销售收入、不结转销售成本**，直接按账面价值结转；债务重组损益体现为\"其他收益\"或\"投资收益\"。\n- 与第二章（存货）：抵债存货已计提的**存货跌价准备**应同时结转，据此计算转让资产的账面价值。\n- 与第三章、第四章（固定资产、无形资产）：抵债的非流动资产应先通过\"固定资产清理\"科目核算，需先结转累计折旧、减值准备与清理费用，再以清理后的账面价值参与差额计算。\n- 与第十九章（所得税）：以资产清偿债务、债转股等方式终止确认债务时，账面价值与计税基础的差异需按资产负债表债务法确认递延所得税影响。\n",
    "22": "# 第二十二章 外币折算\n\n> 本题库考察频次：7 题 ｜ 优先级：B（常考章） ｜ 建议投入：重点掌握\n\n> 定位提示：教材目录 OCR 可辨的节标题为「第一节 记账本位币的确定」「第二节 外币交易的会计处理」「第三节 外币财务报表折算」。教材正文标题层 OCR 损坏严重（第一节开头段落已缺失），以下条目不标注页码；凡 OCR 中无法核实的部分均已在条目内单独标注。\n\n---\n\n### 考点1　记账本位币的确定\n- **优先级**：★★★\n- **内容**：**记账本位币**是企业经营所处的主要经济环境中的货币。企业选定记账本位币应当考虑的因素：①该货币主要**影响商品和劳务的销售价格**，通常以该货币进行商品和劳务的计价和结算；②该货币主要**影响商品和劳务所需人工、材料和其他费用**，通常以该货币进行上述费用的计价和结算；③**融资活动获得的资金**以及**保存从经营活动中收取款项**所使用的货币。企业管理当局根据实际情况确定的记账本位币**只有一种，一经确定不得随意变更**，除非与确定记账本位币相关的企业经营所处的**主要经济环境发生重大变化**。\n- **教材定位说明**：以上\"考虑因素\"三项在教材 OCR 文本中已随第一节开头段落一起丢失，此处按 CAS 19 的规范表述补全；确认不变的是教材原文对\"只有一种、不得随意变更\"的强调。\n- **易错**：把\"企业注册地货币\"或\"母公司记账本位币\"当然视为记账本位币；认为企业可以同时选定两种记账本位币。\n- **考察**：—\n\n### 考点2　记账本位币的变更\n- **优先级**：★★\n- **内容**：企业因经营所处的主要经济环境发生**重大变化**而变更记账本位币的，应当采用**变更当日的即期汇率**将所有项目折算为变更后的记账本位币；该变更属于**会计政策变更**，采用**未来适用法**处理，**不追溯调整**（不计算累积影响数，也不调整以前期间报表）。\n- **教材定位说明**：教材 OCR 仅保留了\"不得随意变更，除非……主要经济环境发生重大变化\"这一条件句，变更的具体处理方法（变更日即期汇率、未来适用法）在 OCR 文本中不可辨，此处按 CAS 19 及 CAS 28 的规范表述补全。\n- **易错**：把记账本位币变更作为**会计估计变更**；采用追溯调整法调整前期比较报表。\n- **考察**：—\n\n### 考点3　境外经营的含义与境外经营记账本位币的确定\n- **优先级**：★★★\n- **内容**：**境外经营**通常是指企业在**境外**的子公司、合营企业、联营企业、分支机构。**当企业在境内的子公司、联营企业、合营企业或者分支机构选定的记账本位币不同于企业的记账本位币时，也应当视同境外经营**。区分某实体是否为该企业的境外经营，**关键有两项**：①该实体与企业的关系，是否为企业的子公司、合营企业、联营企业、分支机构；②该实体的**记账本位币是否与企业记账本位币相同**——**而不是以该实体是否在企业所在地的境外作为标准**。\n- **易错**：把\"境内境外\"的地理位置当作判断标准（境内子公司也可能构成境外经营）；漏判分支机构的记账本位币差异。\n- **考察**：2017-19、2017-20\n\n### 考点4　即期汇率与近似汇率的选择\n- **优先级**：★★★\n- **内容**：**即期汇率**是相对于远期汇率而言的，**买入价和卖出价都是立即交付的结算价格，都属于即期汇率**。为方便核算，准则中企业用于记账的即期汇率一般指**当日中国人民银行公布的人民币汇率的中间价**。在企业发生**单纯的货币兑换交易或涉及货币兑换的交易**时，仅能使用**买入价或卖出价**折算，由此产生的汇率变动差额计入**当期财务费用（汇兑差额）**。\n- **易错**：在货币兑换业务中误用中间价；把银行买入价与卖出价混用（**企业买入外汇用银行卖出价，企业卖出外汇用银行买入价**）。\n- **考察**：2016-6、2016-7\n\n### 考点5　外币交易的初始确认\n- **优先级**：★★★\n- **内容**：**外币**是企业记账本位币以外的货币；**外币交易**是指企业发生以**外币计价或者结算**的交易，包括：①买入或者卖出以外币计价的商品或者劳务；②借入或者借出外币资金；③其他以外币计价或者结算的交易（如接受外币现金捐赠）。企业发生外币交易，应当在**初始确认时**采用**交易发生日的即期汇率**（或**即期汇率的近似汇率**，如当期平均汇率）将外币金额折算为记账本位币金额。\n- **接受外币投资**：**实收资本**（股本）项目应当采用**交易发生日即期汇率**折算，**不采用**合同约定汇率，也不采用即期汇率的近似汇率；因此出资款分次到账时，各次折算金额可能不一致（教材例：合同约定 1 美元＝6.45 元，实际到账日汇率 1 美元＝6.35 元、1 美元＝6.4 元 → **按当日即期汇率**折算）。\n- **易错**：接受外币投资时使用**合同约定汇率**或近似汇率；把分次出资的汇率差异确认为汇兑损益（应直接按当日汇率计入实收资本）。\n- **考察**：2016-6、2016-7、2022-6\n\n### 考点6　货币性项目在资产负债表日的处理★必背★\n- **优先级**：★★★\n- **内容**：**货币性项目**是企业持有的**货币和将以固定或可确定金额的货币收取的资产或者偿付的负债**。**货币性资产**包括：现金、银行存款、应收账款、其他应收款、长期应收款、**债权投资、其他债权投资**等；**货币性负债**包括：应付账款、其他应付款、短期借款、应付债券、长期借款、长期应付款等。**期末或结算**货币性项目时，应当**采用资产负债表日或结算日的即期汇率**折算，因汇率变动产生的**汇兑差额计入当期损益（财务费用——汇兑差额）**；但**符合资本化条件的应当予以资本化**（计入相关资产成本，如在建工程）。\n- **分录**：\n  ```\n  汇兑损失：借：财务费用——汇兑差额\n              贷：银行存款——美元户／应收账款／长期借款等\n  汇兑收益：借：银行存款——美元户／应付债券等\n              贷：财务费用——汇兑差额\n  资本化：  借：在建工程（或贷：在建工程）\n              贷：长期借款——美元（或借方）\n  ```\n- **易错**：把\"其他债权投资\"错分为非货币性项目（**属货币性项目**）；外币借款的汇兑差额一律费用化而忽略资本化条件。\n- **考察**：2016-6、2022-6\n\n### 考点7　非货币性项目在资产负债表日的处理★必背★\n- **优先级**：★★★\n- **内容**：**非货币性项目**是货币性项目以外的项目，如预付账款、预收账款、合同负债、存货、长期股权投资、交易性金融资产（股票、基金）、固定资产、无形资产等。分三种情形：\n\n  | 计量属性 | 资产负债表日的处理 | 差额去向 |\n  |---|---|---|\n  | 以**历史成本**计量 | 已在交易发生日按当日即期汇率折算，**资产负债表日不应改变其原记账本位币金额，不产生汇兑差额** | 无 |\n  | 以**成本与可变现净值孰低**计量（如存货） | 先在**以外币反映的可变现净值**与成本之间孰低确定期末价值，再按**资产负债表日即期汇率**折算 | 折算后与原记账本位币金额的差额计入**资产减值损失**（不是财务费用） |\n  | 以**公允价值**计量 | 先将该外币按**公允价值确定日的即期汇率**折算为记账本位币金额，再与原记账本位币金额比较 | **FVTPL** 的金融资产 → 差额计入**当期损益（公允价值变动损益）**；**指定为 FVOCI 的非交易性权益工具投资** → 差额计入**其他综合收益**（处置时直接转留存收益） |\n- **易错**：以历史成本计量的外币非货币性项目在资产负债表日调整（**不调整**）；存货的可变现净值折算差额计入财务费用（应为**资产减值损失**）；以公允价值计量的股票折算差额与公允价值变动分开列示（应当**合并**反映在公允价值变动损益或 OCI 中，因为其中既含公允价值变动影响又含汇率变动影响）。\n- **考察**：2022-6\n\n### 考点8　外币专门借款的汇兑差额资本化\n- **优先级**：★★★\n- **内容**：外币专门借款（如境外发行的外币债券）在资本化期间内，其**本金和利息的汇兑差额**，符合借款费用资本化条件的，应当**予以资本化**计入符合资本化条件的资产成本；不符合资本化条件的部分（如非资本化期间、超过专门借款部分的资金占用）计入**当期损益（财务费用）**。外币债券同时涉及本章的外币折算与第十一章借款费用的**实际利率法**：需先按实际利率法计算当期利息费用（含溢折价摊销），再按资产负债表日即期汇率调整外币本金与应付利息的折算差额。\n- **易错**：把外币专门借款的**本金**汇兑差额费用化而只资本化利息汇兑差额；停工期间（非正常中断连续超过 3 个月）仍继续资本化。\n- **考察**：2016-6、2016-7、2016-8、2016-9\n\n### 考点9　外币财务报表折算的方法★必背★\n- **优先级**：★★★\n- **内容**：将境外经营通过**合并、权益法核算**等纳入企业财务报表时，需要将境外经营的财务报表折算为以企业记账本位币反映的财务报表。外币报表折算的常见方法有四种：**流动和非流动法、货币性和非货币性法、时态法、现时汇率法**。为与《企业会计准则第 33 号——合并财务报表》所采用的**实体理论**保持一致，我国《企业会计准则第 19 号——外币折算》基本采用**现时汇率法**。折算前**应当先调整境外经营的会计期间和会计政策**，使之与企业会计期间和会计政策相一致，再按下列方法折算：\n\n  | 报表项目 | 折算汇率 |\n  |---|---|\n  | 资产负债表中的**资产和负债**项目 | **资产负债表日的即期汇率** |\n  | 所有者权益项目（**除\"未分配利润\"外**） | **发生时的即期汇率** |\n  | 利润表中的**收入和费用**项目 | **交易发生日的即期汇率**或即期汇率的**近似汇率** |\n  | 产生的外币财务报表折算差额 | 在资产负债表中\"所有者权益\"项目下的**\"其他综合收益\"**项目列示 |\n\n  **比较财务报表的折算比照上述规定处理。**\n- **易错**：把所有者权益项目全部按资产负债表日汇率折算（\"未分配利润\"以外的权益项目应按**发生时**汇率）；把折算差额计入当期损益（应计入**其他综合收益**）；漏做\"先统一会计期间和会计政策\"这一步。\n- **考察**：2017-19\n\n### 考点10　外币财务报表折算差额的计算与列示\n- **优先级**：★★★\n- **内容**：**外币报表折算差额**＝以记账本位币反映的**资产总计与负债合计的差额**，减去以记账本位币反映的**实收资本、资本公积、累计盈余公积及累计未分配利润**后的余额。该差额在合并资产负债表中列示于**\"其他综合收益——外币财务报表折算差额\"**项目（属于**以后会计期间在满足规定条件时转入损益**的其他综合收益类别）。\n- **计算口径（勾稽关系）**：`折算差额 =（按资产负债表日汇率折算的资产合计 − 按资产负债表日汇率折算的负债合计）−（按发生日汇率折算的实收资本、资本公积、累计盈余公积、累计未分配利润）`\n- **易错**：把\"未分配利润\"按发生日汇率折算后再倒挤出折算差额（\"未分配利润\"是**倒挤项**，不直接用汇率折算）；把折算差额当作汇兑损益计入利润表。\n- **考察**：2017-19、2017-20\n\n### 考点11　包含境外经营的合并财务报表编制的特殊处理★必背★\n- **优先级**：★★★\n- **内容**：在企业境外经营为其**子公司**的情况下，编制合并财务报表时，对于境外经营财务报表折算差额，需要在**母公司与子公司少数股东之间**按照**各自在境外经营所有者权益中所享有的份额进行分摊**：\n  - 属于**母公司应分担**的部分 → 在合并资产负债表和合并所有者权益变动表中**所有者权益项目下\"其他综合收益\"项目列示**；\n  - 属于**子公司少数股东应分担**的部分 → **并入\"少数股东权益\"项目列示**。\n  此外，母公司对境外经营的**长期应收款**（构成对境外经营净投资的部分）产生的汇兑差额，在编制合并财务报表时应当计入**其他综合收益**（并在处置境外经营时转入当期损益），其分摊同样涉及少数股东。\n- **易错**：把全部折算差额都归入\"其他综合收益\"而不分给少数股东；忽略构成净投资的长期应收款汇兑差额对少数股东权益的影响（这类题常出现按\"全归母公司\"与\"按比例分摊\"两种口径的数字差异）。\n- **考察**：2017-20\n\n### 考点12　处置境外经营时折算差额的结转\n- **优先级**：★★\n- **内容**：按照外币折算的要求，企业在**处置境外经营的当期**，应当将**已列入合并财务报表所有者权益的外币报表折算差额中与该境外经营相关部分，自\"其他综合收益\"项目转入处置当期损益（投资收益）**。如果是**部分处置**境外经营，应当**按处置的比例**计算处置部分的外币报表折算差额，转入处置当期损益。\n- **衔接**：处置**持有待售的境外经营**时，同样应当将与该境外经营相关的外币财务报表折算差额自其他综合收益转入处置当期损益；部分处置的按处置比例计算。\n- **易错**：处置时忘记把 OCI 结转损益；部分处置按**全部**折算差额结转（应按**比例**）。\n- **考察**：—\n\n### 考点13　外币折算的披露\n- **优先级**：★\n- **内容**：企业应当在附注中披露：①企业及其境外经营选定的**记账本位币及选定的原因**，记账本位币发生变更的，说明变更理由；②采用**近似汇率**折算的，说明该近似汇率及其**与即期汇率的近似程度**；③**外币财务报表折算差额**的处理，以及**处置境外经营**的相关情况。\n- **考察**：—\n\n---\n\n## 本章易错陷阱汇总\n\n1. **记账本位币只有一个**，一经确定不得随意变更；\"境外\"不是判断境外经营的标准，**记账本位币是否与企业相同**才是关键（境内子公司也可能是境外经营）。\n2. **记账本位币变更 = 会计政策变更 = 未来适用法**，不追溯、不算累积影响数。\n3. **接受外币投资用\"交易发生日即期汇率\"**，不用合同约定汇率、不用近似汇率。\n4. **货币性项目用资产负债表日（或结算日）即期汇率**，差额计入**财务费用——汇兑差额**；符合资本化条件的应资本化。\n5. **历史成本计量的非货币性项目在资产负债表日不调整、不产生汇兑差额**。\n6. **以外币购入存货且可变现净值以外币反映**时，折算差额计入**资产减值损失**（属存货跌价准备），**不是**财务费用。\n7. **以公允价值计量的外币非货币性项目**先用**公允价值确定日**汇率折算，再与原记账本位币金额比较；FVTPL → 当期损益，**指定为 FVOCI 的非交易性权益工具投资 → 其他综合收益**。\n8. **\"其他债权投资\"是货币性项目**，不要误分为非货币性项目。\n9. **外币专门借款的本金和利息汇兑差额**在资本化期间均应资本化；同时要叠加第十一章的**实际利率法**计算利息费用。\n10. **折算差额进\"其他综合收益\"，不进利润表**；所有者权益项目除\"**未分配利润**\"外按**发生日**汇率折算（\"未分配利润\"是倒挤项）。\n11. **合并报表中折算差额要分配给少数股东**：母公司部分进\"其他综合收益\"，少数股东部分进\"**少数股东权益**\"。\n12. **处置境外经营时，折算差额自其他综合收益转入处置当期损益**；部分处置按**比例**结转。\n13. **货币兑换用买入价/卖出价**（企业卖出外汇用银行买入价），不是中间价；由此产生的差额计入财务费用。\n14. 本教材 OCR 文本中**未检索到\"恶性通货膨胀经济中的折算\"**相关内容，备考时请以纸质教材实际版面为准，不要以本清单的沉默作为\"不考\"的依据。\n\n## 本章分录模板\n\n**1. 外币交易初始确认（以人民币为记账本位币）**\n```\n借：银行存款——美元户（外币金额×交易日即期汇率）\n    贷：实收资本／主营业务收入／短期借款等\n```\n\n**2. 货币性项目期末调整（汇兑差额）**\n```\n汇兑损失：借：财务费用——汇兑差额\n              贷：应收账款／银行存款——美元户／应付账款等\n汇兑收益：借：应收账款／银行存款——美元户等\n              贷：财务费用——汇兑差额\n资本化：  借：在建工程\n              贷：长期借款——美元（或反向）\n```\n\n**3. 货币兑换（卖出美元）**\n```\n借：银行存款——人民币户（美元金额×银行买入价）\n    财务费用——汇兑差额（差额，可贷方）\n    贷：银行存款——美元户（美元金额×中间价／账面汇率）\n```\n\n**4. 以公允价值计量的外币非货币性项目（指定为 FVOCI 的非交易性权益工具投资）**\n```\n借：其他权益工具投资（公允价值变动＋汇率变动合计差额）\n    贷：其他综合收益\n```\n\n**5. 外币财务报表折算（工作底稿式，无独立分录）**\n```\n资产、负债项目      × 资产负债表日即期汇率\n所有者权益（除未分配利润）× 发生日即期汇率\n收入、费用项目      × 交易日即期汇率或近似汇率（如当期平均汇率）\n折算差额 → 其他综合收益——外币财务报表折算差额（合并报表中再分拆给少数股东）\n```\n\n## 与其他章的联动\n\n- **与第十一章（借款费用）**：外币专门借款同时考\"实际利率法计算利息费用＋汇兑差额资本化＋资本化期间的划分\"，2016-6 至 2016-9 是同一案例的四连问，本题库高频组合。\n- **与第十三章（金融工具与保险合同）**：外币债券投资的摊余成本、FVOCI 与非交易性权益工具投资的分类直接决定折算差额的去向（当期损益 or 其他综合收益）；外币债券的溢折价摊销适用实际利率法（2022-6）。\n- **与第八章（负债）**：外币应付债券的科目设置（面值、利息调整、应计利息）与溢折价摊销表在本章折算前先算好，再按资产负债表日汇率调整。\n- **与第二十三章（财务报告）**：外币财务报表折算差额在其他综合收益中的列示与分类（\"以后会计期间满足规定条件时转入损益\"）属于财务报告的列报要求。\n- **与第二十四章（会计政策、会计估计及其变更和差错更正）**：记账本位币变更属会计政策变更、采用未来适用法；漏记外币业务通常以**前期差错更正**形式命题（2022-6）。\n- **与第二十七章（合并财务报表）**：境外经营子公司的折算差额在母公司与少数股东之间的分摊、构成净投资的长期应收款汇兑差额的处理（2017-19、2017-20）。\n- **与第十五章（持有待售的非流动资产、处置组和终止经营）**：处置持有待售的境外经营时，折算差额自其他综合收益转入处置当期损益，部分处置按比例结转。\n",
    "23": "# 第二十三章 财务报告\n\n> 本题库考察频次：1 题 ｜ 优先级：C ｜ 建议投入：重点掌握流动负债划分与现金流量表分类\n\n> ⚠️ **教材文本 OCR 说明**：本章主要内容可在 OCR 中辨认（财务报表列报的基本要求、资产负债表填列方法、现金流量表各项目、附注、中期财务报告）。**「（二）持续经营」「（五）重要性与汇总」「（六）抵销」等基本要求的个别小标题在 OCR 中缺失**；**「票据贴现」的现金流量列报在第二十三章 OCR 中未能检索到**（其终止确认判断的教材主叙在第十三章金融资产转移），相关条目已在正文注明。可确认的节标题（依教材目录）：**第一节 财务报表概述**、**第二节 资产负债表**、**第三节 利润表**、**第四节 现金流量表**、**第五节 所有者权益变动表**、**第六节 财务报表附注披露**、**第七节 中期财务报告**。\n\n## 考点清单\n\n### 财务报表的组成部分与分类\n- **优先级**：★★\n- **内容**：财务报表**至少**应当包括下列组成部分：①**资产负债表**；②**利润表**；③**现金流量表**；④**所有者权益（或股东权益）变动表**；⑤**附注**。这些组成部分**具有同等的重要程度**。分类：①按**编报期间**不同，分为**中期财务报表**（以短于一个完整会计年度的报告期间为基础编制，包括月报、季报、半年报等）和**年度财务报表**；②按**编报主体**不同，分为**个别财务报表**和**合并财务报表**。\n- **易错**：①**附注是财务报表的组成部分**，不是\"补充资料\"；②\"四表一注\"缺一不可，且**地位同等**；③附注不得用来代替对交易和事项的确认和计量——采用不恰当的会计政策，**不能通过在附注中披露来弥补**。\n- **考察**：—\n\n### 财务报表列报的基本要求\n- **优先级**：★★\n- **内容**：①**依据各项会计准则确认和计量的结果编制**（遵循全部准则时才能声明\"遵循了企业会计准则\"）；②**持续经营**基础（以持续经营为基础编制，若以清算基础编制须披露）；③**权责发生制**——**除现金流量表按照收付实现制编制外**，企业应当按照权责发生制编制其他财务报表；④**列报的一致性**——项目名称、分类、排列顺序各期保持一致，仅在\"会计准则要求改变\"或\"经营业务性质发生重大变化、变更能提供更可靠更相关信息\"时可以改变；⑤**重要性与汇总**；⑥**抵销**（资产与负债、收入与费用不得相互抵销，除非准则另有规定）；⑦**比较信息的列报**；⑧**报告期间**（至少按年编制财务报表）。\n- **计算/分录**（比较信息的具体要求，教材可辨认）：\n  ```\n  通常：至少列报所有列报项目上一个可比会计期间的比较数据\n  追溯应用会计政策/追溯重述/重新分类时：至少列报三期资产负债表、两期其他各报表\n        （利润表、现金流量表、所有者权益变动表）及相关附注\n  ```\n- **易错**：①**权责发生制是\"非现金流量表\"的原则**，现金流量表是**收付实现制**（本考点的固定陷阱）；②比较信息的要求**适用于财务报表的所有组成部分**——既适用于四张报表，也适用于附注；③列报确需变更时，应当**至少对可比期间数据按当期列报要求调整**并披露调整原因、性质与金额；确实不切实可行的，应披露不能调整的原因。\n- **考察**：—\n\n### 资产负债表：内容、结构与填列方法\n- **优先级**：★★\n- **内容**：资产负债表是反映企业在**某一特定日期**财务状况的会计报表，我国采用**账户式结构**（左方资产、右方负债和所有者权益，资产总计＝负债和所有者权益总计），并分\"**期末余额**\"和\"**上年年末余额**\"两栏列报。填列方法分五类：①**根据总账科目的余额填列**（如\"短期借款\"\"应付票据\"\"应交税费\"\"实收资本（或股本）\"\"资本公积\"\"库存股\"\"其他综合收益\"\"盈余公积\"\"递延所得税资产/负债\"等）；②**根据明细账科目的余额计算填列**（如\"应付账款\"\"预收款项\"\"合同负债\"等需按相关明细科目余额分析填列）；③**根据总账科目和明细账科目的余额分析计算填列**（如\"长期借款\"）；④**根据有关科目余额减去其备抵科目余额后的净额填列**（如\"债权投资\"\"长期股权投资\"\"商誉\"\"固定资产\"\"无形资产\"等）；⑤**综合运用上述方法分析填列**（如\"货币资金\"\"存货\"\"应收账款\"\"预付款项\"\"合同资产\"\"长期应付款\"等）。\n- **计算/分录**：\n  ```\n  长期借款项目 ＝ \"长期借款\"总账余额 − 所属明细科目中\"将在资产负债表日起一年内到期、\n                  且企业在资产负债表日没有将负债清偿推迟至资产负债表日后一年以上的\n                  实质性权利\"的部分（后者列入\"一年内到期的非流动负债\"）\n  货币资金 ＝ 库存现金 + 银行存款 + 其他货币资金等总账余额合计\n  其他应付款 ＝ 其他应付款 + 应付利息 + 应付股利\n  ```\n- **易错**：①\"**一年内到期的非流动负债**\"是从长期负债中**剥离出来单独列示**的，不是继续留在\"长期借款\"项目里；②**递延收益**中摊销期限只剩一年或不足一年的部分，**不得**归类为流动负债，仍在该项目填列，**不转入\"一年内到期的非流动负债\"**；③\"长期待摊费用\"中只剩一年或不足一年摊销的部分，同样**仍留在该项目**，不转入\"一年内到期的非流动资产\"；④资产与负债只有在准则允许时才**以抵销后的净额列示**（如满足条件的当期所得税资产与负债、合同资产与合同负债）。\n- **考察**：—\n\n### 流动负债与非流动负债的划分（重点）\n- **优先级**：★★★\n- **内容**：划分的**判断总原则**：资产负债表上对债务流动/非流动的划分，应当**反映在资产负债表日有效的合同安排**，考虑在**资产负债表日起一年内企业是否必须无条件清偿**；**资产负债表日之后（即使是财务报告批准报出日前）的再融资、展期或提供宽限期等行为，与资产负债表日判断负债的流动性状况无关**。具体规则：①**自资产负债表日起一年内（含一年）到期应予以清偿**的负债为流动负债；②对于在资产负债表日起**一年内到期**的负债，企业**有意图且有能力自主地将清偿义务展期至资产负债表日后一年以上**的，**应归类为非流动负债**；不能自主展期的，即使在资产负债表日后、财务报告批准报出日前签订了重新安排清偿计划协议，在资产负债表日**仍应归类为流动负债**；③企业在**资产负债表日或之前违反了长期借款协议，导致贷款人可随时要求清偿**的负债，**应归类为流动负债**（清偿主动权不在企业）；但**贷款人在资产负债表日或之前同意提供在资产负债表日后一年以上的宽限期**，在此期限内企业能够改正违约行为且贷款人不能要求随时清偿的，**应归类为非流动负债**；④对贷款安排产生的负债，\"推迟清偿至资产负债表日后一年以上\"的权利取决于企业是否遵循**契约条件**：**资产负债表日（或之前）应遵循的契约条件**（即使在资产负债表日之后才评估，如基于资产负债表日财务状况评估）**影响**该权利在资产负债表日是否存在的判断；**资产负债表日之后应遵循的契约条件**（如基于资产负债表日后 6 个月的财务状况评估）**不影响**资产负债表日的流动性划分。\n- **易错**（教材例 23-1、例 23-2）：①**发行总面值 5 000 000 元的可转换债券**，持有人有权在到期前（含资产负债表日起 12 个月内）随时转股——判断**负债成分**为流动还是非流动时，**不应考虑转股导致的清偿情况**，该负债成分仍应分类为**非流动负债**；②2×18 年 7 月 1 日举借的**五年期长期借款**，在 2×22 年 12 月 31 日（一年内到期）应划分为**流动负债**；若在**资产负债表日或之前**（如 2×22 年 12 月）完成长期再融资或展期，则划为**非流动负债**；若在**资产负债表日后**（如 2×23 年 2 月，财务报告批准报出日前）才完成，则**仍划为流动负债**；③**\"有意图且有能力自主展期\"**（无需征得债权人同意且企业打算展期）→ 非流动负债，这是\"实质性权利\"的判断；④正常营业周期中的**经营性负债项目**（如应付账款、应付职工薪酬）即使在资产负债表日后**超过一年**才清偿，**仍应划分为流动负债**；⑤对资产和负债进行流动性分类时应当采用**相同的正常营业周期**。\n- **考察**：—\n\n### 利润表：结构与特殊项目的列示\n- **优先级**：★★\n- **内容**：利润表反映企业**一定会计期间**的经营成果，我国采用**多步式结构**，按利润形成的主要环节列示中间性利润指标、分步计算当期净损益。**费用按功能分类**列报（营业成本、税金及附加、销售费用、管理费用、研发费用、财务费用等），同时在**附注中披露费用按性质分类的补充资料**（耗用的原材料、职工薪酬费用、折旧费用、摊销费用等）。利润表项目主要依次为：营业收入、营业成本、税金及附加、销售费用、管理费用、研发费用、财务费用（其中：利息费用、利息收入）、**其他收益**、投资收益（其中：对联营企业和合营企业的投资收益、以摊余成本计量的金融资产终止确认收益）、净敞口套期收益、公允价值变动收益、**信用减值损失**、**资产处置收益**、营业利润、营业外收入、营业外支出、利润总额、所得税费用、净利润、其他综合收益的税后净额、综合收益总额、每股收益（基本/稀释）。\n- **易错**：①**\"其他收益\"**用于政府补助、**当期直接减免或即征即退的增值税**等与日常活动相关但不宜计入收入的收益；②**\"资产处置损益\"**（报表项目为\"资产处置收益\"）用于**固定资产、无形资产等非流动资产**的处置，**不再通过\"营业外收入/支出\"**；③**\"信用减值损失\"**用于金融工具（应收款项、债权投资、合同资产等）按**预期信用损失**计提的减值，与\"资产减值损失\"（存货、固定资产、商誉等）分列；④\"研发费用\"从管理费用中**单独列示**，是利润表列报的固定考点；⑤综合收益总额＝净利润＋其他综合收益的税后净额；每股收益在**净利润之下、综合收益总额之后**列示。\n- **考察**：2018-14\n\n### 现金流量表：编制基础、三类活动与现金及现金等价物\n- **优先级**：★★\n- **内容**：现金流量表按**收付实现制**编制。**现金及现金等价物被视为一个整体**：企业现金形式的转换（如从银行提取现金）、现金与现金等价物之间的转换（如用现金购买三个月到期的国库券）**不构成现金流量**。现金流量按企业业务活动的性质和来源分为三类：**经营活动**（销售商品提供劳务收到的现金、收到的税费返还、购买商品接受劳务支付的现金、支付给职工以及为职工支付的现金、支付的各项税费等）、**投资活动**（收回投资、取得投资收益、处置固定资产无形资产和其他长期资产、购建固定资产无形资产和其他长期资产支付的现金等）、**筹资活动**（吸收投资、取得借款、偿还债务、分配股利利润或偿付利息支付的现金等）；此外还有\"**汇率变动对现金及现金等价物的影响**\"\"现金及现金等价物净增加额\"\"期末现金及现金等价物余额\"等项目。另设**补充资料**：将净利润调节为经营活动现金流量（**间接法**）。\n- **易错**：①三个月的国库券属于**现金等价物**，购买它**不产生现金流量**；②\"收到的税费返还\"与\"支付的各项税费\"是两个不同项目，**本期退回的增值税、所得税在\"收到的税费返还\"中反映，不在\"支付的各项税费\"中抵减**；③增值税**期末留抵退税**：收到的留抵退税款项属**经营活动**，在本项目反映；**缴回**并继续按规定抵扣进项税额的留抵退税款项**不在本项目反映**，在\"支付的各项税费\"中反映；④\"支付给职工以及为职工支付的现金\"**不包括支付给在建工程人员的工资**（后者在\"购建固定资产、无形资产和其他长期资产支付的现金\"中反映）。\n- **考察**：—\n\n### 现金流量表的重点项目与特殊交易\n- **优先级**：★★\n- **内容**（教材可辨认）：①**为购置存货而发生的借款利息资本化部分**，应在\"**分配股利、利润或偿付利息支付的现金**\"项目中反映；②**为购建固定资产、无形资产和其他长期资产而发生的借款利息资本化部分**，同样在\"分配股利、利润或偿付利息支付的现金\"中反映；**偿还租赁负债本金和利息所支付的现金**在\"**支付的其他与筹资活动有关的现金**\"中反映，**不在**\"购建固定资产…支付的现金\"中反映；③**购买股票和债券时实际支付的价款中包含的已宣告但尚未领取的现金股利、已到付息期但尚未领取的债券利息**，在\"**支付的其他与投资活动有关的现金**\"中反映；收回时在\"收到的其他与投资活动有关的现金\"中反映；④**政府补助**：除税费返还外的其他政府补助，教材列在\"**收到其他与经营活动有关的现金**\"项目反映（与购建长期资产直接相关、具有投资活动性质的补助，需按经济实质判断是否列入投资活动）；⑤**处置子公司及其他营业单位收到的现金净额**如为负数，填列至\"支付其他与投资活动有关的现金\"项目；⑥**票据贴现**（教材第二十三章 OCR 中未检索到该项目的详细表述，条目标注不含教材定位）：**不附追索权**的票据贴现，终止确认应收票据，所收款项作为**经营活动**现金流量；**附追索权**（不满足终止确认条件）的贴现，实质是**以票据质押取得借款**，所收款项作为**筹资活动**（取得借款收到的现金），支付的贴现息作为筹资活动（分配股利、利润或偿付利息支付的现金）。\n- **易错**：①**利息支出、股利支出的列报项目是\"分配股利、利润或偿付利息支付的现金\"**，属于**筹资活动**（即使该利息已资本化计入资产成本）；②**借款利息资本化部分不因资本化而变成投资活动**，这是最高频的陷阱；③\"处置子公司收到的现金净额\"要**扣除子公司自带的现金及现金等价物**，不能按处置价款全额列示；④收到的利息、股利在\"取得投资收益收到的现金\"（投资活动）中反映，支付股利在筹资活动中反映。\n- **考察**：—\n\n### 所有者权益变动表：至少单独列示的项目\n- **优先级**：★★\n- **内容**：所有者权益变动表反映构成所有者权益的各组成部分**当期的增减变动情况**，应当至少单独列示：①**综合收益总额**；②**会计政策变更和差错更正的累积影响金额**；③**所有者投入资本和向所有者分配利润**等；④按照有关规定提取的**盈余公积**等。表中按\"**上年年末余额—会计政策变更—前期差错更正—本年年初余额—本年增减变动—本年年末余额**\"的顺序纵向列示，横向按\"实收资本（或股本）\"\"其他权益工具\"\"资本公积\"\"减：库存股\"\"其他综合收益\"\"专项储备\"\"盈余公积\"\"未分配利润\"等项目分列；**本年增减变动**下设\"（一）综合收益总额\"\"（二）所有者投入和减少资本\"\"（三）利润分配\"\"（四）所有者权益内部结转\"\"（五）专项储备\"等。\n- **易错**：①**其他综合收益要按\"不能重分类进损益\"和\"将重分类进损益\"两类分项列示**（详见第十六章\"其他综合收益的分类\"考点），不能只写一个合计数；②\"会计政策变更\"和\"前期差错更正\"分别单独列示为**本年年初余额的调整项**；③综合收益总额＝净利润＋其他综合收益的税后净额，**与利润表口径一致**；④\"所有者权益内部结转\"（资本公积转增资本、盈余公积转增资本、盈余公积弥补亏损等）**不改变所有者权益总额**。\n- **考察**：2018-14\n\n### 附注披露的主要内容\n- **优先级**：★\n- **内容**：附注应当**按照下列顺序**至少披露：①**企业的基本情况**（注册地、组织形式和总部地址；业务性质和主要经营活动；母公司以及集团最终母公司的名称；**财务报告的批准报出者和财务报告批准报出日**）；②**财务报表的编制基础**（若只是**部分**遵循企业会计准则，**附注中不得作出\"遵循了企业会计准则\"的表述**）；③**遵循企业会计准则的声明**；④**重要会计政策和会计估计**（重要会计政策要结合企业实际披露其**确定依据**和财务报表项目的**计量基础**；重要会计估计要披露**关键假设和不确定因素**）；⑤**会计政策和会计估计变更以及差错更正的说明**；⑥**报表重要项目的说明**（按四张报表及其项目列示的顺序，以文字和数字描述相结合的方式披露，**明细金额合计应当与报表项目金额相衔接**）；⑦其他需要说明的重要事项（或有事项、资产负债表日后事项、关联方关系及其交易等）。\n- **易错**：①**财务报告的批准报出者和批准报出日必须在附注中披露**——这也是第二十五章判断日后事项涵盖期间的依据；②只部分遵循准则时**不得声明\"遵循了企业会计准则\"**；③附注中重要项目说明的顺序**要按报表项目顺序**，且明细金额与报表金额必须衔接（这是查错题的常见设问）。\n- **考察**：—\n\n### 中期财务报告的基本要求\n- **优先级**：★\n- **内容**：①**构成**：中期财务报告至少应当包括资产负债表、利润表、现金流量表和附注；②**重要性判断应当以中期财务数据为基础**（既包括本中期的财务数据，也包括年初至本中期末的财务数据），**不得以预计的年度财务数据为基础**；重要性判断标准一经确定**不得随意变更**；③**确认与计量原则应当与年度财务报告相一致**，不得因报告期间缩短而改变；中期会计**计量应当以年初至本中期末为基础**，报告的频率不应当影响年度结果的计量；④**中期不得随意变更会计政策**，应当采用与年度财务报告相一致的会计政策；同一会计年度内以前中期项目在以后中期发生**会计估计变更**的，以后中期报表反映变更后金额，**对以前中期报表项目金额不作调整**；⑤**季节性、周期性或者偶然性取得的收入**应当在**发生时**予以确认和计量，**不应在中期报表中预计或递延**（会计年度末允许预计或递延的除外）；⑥**会计年度中不均匀发生的费用**应在**发生时**确认和计量，**不得在中期报表中预提或待摊**（会计年度末允许预提或待摊的除外）。\n- **易错**：①**重要性以中期数据（含年初至本中期末）为基础**，用全年预计数判断重要性是错的；②中期**不得为\"平滑\"各期损益而预提或待摊**季节性收入与不均匀费用；③中期会计估计变更**不调整以前中期报表数字**；④中期财务报告的**披露**要求包括：中期资产负债表日至中期财务报告批准报出日之间发生的**非调整事项**、上年度资产负债表日以后发生的或有负债和或有资产的变化情况、企业结构变化情况（企业合并、长期股权投资的购买或处置、终止经营等）。\n- **考察**：—\n\n## 本章易错陷阱汇总\n1. **权责发生制不适用于现金流量表**——现金流量表按收付实现制编制。\n2. **附注是财务报表的组成部分**，且不得以披露代替确认和计量。\n3. **长期借款的流动性拆分**：一年内到期且**无实质性展期权利**的部分要转入\"一年内到期的非流动负债\"；**递延收益**只剩一年摊销的部分**不转**。\n4. **资产负债表日之后的再融资、展期、宽限期，与资产负债表日的流动性划分无关**；但**资产负债表日或之前**贷款人提供的、期限在一年以上的宽限期，可以把违约负债划为非流动负债。\n5. 可转换债券的负债成分判断流动性时，**不考虑转股导致的清偿**。\n6. 经营性负债（应付账款、应付职工薪酬）**即使超过一年后清偿仍是流动负债**。\n7. **\"其他权益工具投资\"（不能重分类）vs \"其他债权投资\"（将重分类）**——所有者权益变动表中的其他综合收益必须分类分项列示。\n8. 现金流量表中的高频陷阱：**借款利息资本化部分仍属筹资活动**；三个月国库券是**现金等价物**（不产生现金流量）；**在建工程人员工资属投资活动**；留抵退税**缴回**时不冲减\"收到的税费返还\"。\n9. **附注中必须披露财务报告的批准报出者和批准报出日**（连接第二十五章）。\n10. 中期报告的重要性判断**以中期财务数据为基础**，季节性与不均匀费用**不得预提或待摊**。\n\n## 本章分录模板（如适用）\n本章以**列报与填列**为主，不涉及新的账务处理，重点是\"科目余额→报表项目\"的映射与项目间重分类：\n\n| 报表项目 | 填列要点 |\n|---|---|\n| 货币资金 | 库存现金＋银行存款＋其他货币资金等总账余额合计 |\n| 其他应付款 | \"其他应付款\"＋\"应付利息\"＋\"应付股利\" |\n| 长期借款 | \"长期借款\"总账余额**扣除**一年内到期且无实质性展期权利的部分 |\n| 一年内到期的非流动负债 | 从长期借款、应付债券、租赁负债、长期应付款等**分析剥离** |\n| 存货 | 各存货类科目＋合同履约成本（一年内摊销部分）－存货跌价准备等 |\n| 长期应付款 | \"长期应付款\"－\"未确认融资费用\"＋\"专项应付款\" |\n| 合同资产/合同负债 | 按\"合同资产\"\"合同负债\"\"合同结算\"相关明细科目分析填列（净额列示需满足条件） |\n\n## 与其他章的联动\n- 与第八章（负债）：应付债券、长期借款在报表上的流动/非流动划分与\"一年内到期的非流动负债\"填列，本章给出判断规则。\n- 与第十三章（金融工具与保险合同）：票据贴现、应收票据背书转让的**终止确认**判断在第十三章，本章只处理其现金流量列报；\"其他债权投资/其他权益工具投资\"的分类决定其他综合收益的列示。\n- 与第十五章（持有待售的非流动资产、处置组和终止经营）：**持有待售资产与持有待售负债应当分别作为流动资产和流动负债列示、不得相互抵销**；终止经营在利润表中单独列示。\n- 与第十六章（所有者权益）：所有者权益变动表的项目设置与\"其他综合收益的两类划分\"直接对应。\n- 与第十八章（政府补助）：政府补助在利润表\"其他收益\"及现金流量表中的归类。\n- 与第二十二章（外币折算）：外币财务报表折算差额在所有者权益变动表\"其他综合收益\"中的列示、合并报表中少数股东应分担部分的列示。\n- 与第二十四章（会计政策、会计估计及其变更和差错更正）：会计政策变更与前期差错更正在所有者权益变动表中作为\"本年年初余额\"的调整项单独列示。\n- 与第二十五章（资产负债表日后事项）：**附注中\"财务报告的批准报出日\"是日后事项涵盖期间的终点**；中期财务报告也须披露中期资产负债表日至批准报出日之间的非调整事项。\n- 与第二十七章（合并财务报表）：合并资产负债表、合并利润表、合并现金流量表与少数股东权益、少数股东损益的列报。\n- 与第二十八章（每股收益）：利润表中每股收益列示于净利润与综合收益总额之后。\n",
    "24": "# 第二十四章 会计政策、会计估计及其变更和差错更正\n\n> 本题库考察频次：5 题 ｜ 优先级：B ｜ 建议投入：精读＋默写分录（本组最重要的一章，主观题必考一道）\n\n> 补注：本题库中直接或间接涉及本章的题号共 8 处——2015-14、2016-1、2016-5、2017-6、2018-18、2020-11、2022-3、2022-6。其中 2022-3 考「会计估计变更」，2016-5、2020-11、2022-6 考「前期差错更正」，2015-14、2017-6 考「会计政策变更」。\n>\n> **教材 OCR 提示**：本章正文可读，可确认的节标题为\"第一节 会计政策及其变更概述\"\"第三节 会计政策与会计估计变更的划分\"\"第五节 前期差错及其更正\"；\"第二节 会计估计及其变更概述\"\"第四节 会计政策和会计估计变更的会计处理\"两节标题在 OCR 中未直接出现，故本清单统一**不标注节号**，只写考点名。累积影响数等表格数字 OCR 错位严重，已按算术关系复核后引用。\n\n---\n\n## 考点清单\n\n### 会计政策的定义（原则＋基础＋会计处理方法）★★\n\n- **内容**：会计政策是指企业在**会计确认、计量和报告**中所采用的**原则、基础和会计处理方法**。三要素分别是：①原则——按准则规定的、适合本企业会计要素确认过程的具体会计原则（如\"在客户取得商品控制权时确认收入\"）；②基础——**计量基础（计量属性）**，即历史成本、重置成本、可变现净值、现值和公允价值；③会计处理方法——企业按法规规定采用或选择的、适合本企业的具体处理方法（如发出存货按先进先出法还是加权平均法）。\n- **易错**：会计政策的两个特点要记牢——**选择性**（在准则允许范围内有不止一种可供选择的政策）＋**限定性/强制性**（必须在法规允许范围内选择，不能自创）。某种交易或事项**没有具体准则规定**时，企业应运用基本准则的原则、在考虑相关性和可靠性的前提下**自行确定**一项恰当的会计政策。\n- **考察**：—\n\n### 会计政策变更的两种情形 ★★★\n\n- **内容**：会计政策变更只有两种法定情形——①**法律、行政法规或者国家统一的会计制度等要求变更**（如新准则取消后进先出法、资产减值准备不允许转回、新收入准则按履约义务确认收入）；②**会计政策变更能够提供更可靠、更相关的会计信息**（企业自主变更）。\n- **易错**：第②种情形必须**有充分、合理的证据**表明变更的合理性，并说明变更后能提供更可靠、更相关的会计信息；还须经股东会/董事会/经理（厂长）会议或类似机构**批准**并按规定备案或披露。**无充分合理证据、未重新批准擅自变更、或连续反复自行变更的，视为滥用会计政策，按前期差错更正的方法处理**——这是命题人最爱设的\"定性\"陷阱。\n- **考察**：—\n\n### 不属于会计政策变更的两种情况 ★★★\n\n- **内容**：①**本期发生的交易或者事项与以前相比具有本质差别**而采用新的会计政策（例：企业将自用办公楼改为出租；甲公司以往出租设备均为经营租赁，本年起出租的设备**均改为融资租赁**方式并采用融资租赁会计处理——因业务本质有实质差别，不属于政策变更）；②**对初次发生的或不重要的交易或者事项**采用新的会计政策（例：新设建筑公司首次签订建造合同，按履约进度确认收入，不属于政策变更）。\n- **易错**：判断关键是\"**是同一类交易换了政策，还是换了一类交易**\"。是后者就不叫政策变更，只是为新交易选择了适当的政策。\n- **考察**：—\n\n### 会计估计的定义与特点 ★★\n\n- **内容**：会计估计是指企业对**结果不确定**的交易或者事项，以**最近可利用的信息**为基础所作的判断。三个特点：①会计估计的存在源于经济活动中内在的不确定性；②进行估计时以最近可利用的信息或资料为基础；③进行会计估计**并不会削弱**会计确认和计量的可靠性。\n- **易错**：教材列出的常见会计估计包括——坏账准备/预期信用损失、固定资产折旧年限与净残值、无形资产摊销年限、履约进度、预计负债金额、交易价格中可变对价的确定、与政府补助相关的公允价值、一般借款资本化金额、暂时性差异的确定、非同一控制下企业合并相关公允价值、租赁相关金额、金融工具公允价值与摊余成本等。**\"重要的会计估计应在附注中披露，不具有重要性的可以不披露\"**。\n- **考察**：2022-3\n\n### 会计政策变更与会计估计变更的划分基础（本章第一号判断考点）★★★\n\n- **内容**：应当以**变更事项的会计确认、计量基础和列报项目是否发生变更**作为划分基础：\n  - ①**会计确认**是否变更 → 变了是**政策变更**；\n  - ②**计量基础**（五项计量属性）是否变更 → 变了是**政策变更**（例：固定资产延期付款的初始计量由\"全部价款\"改为\"购买价款的现值\"，属政策变更）；\n  - ③**列报项目**是否变更 → 变了是**政策变更**（例：商品流通企业将采购进货费用由\"直接计入当期损益\"改为\"计入存货采购成本\"）；\n  - ④为取得与资产负债表项目有关的**金额或数值**（如预计使用寿命、净残值）所采用的处理方法，**不是会计政策而是会计估计**，其变更属**会计估计变更**（例：确定公允价值时在市场报价、可观察输入值、不可观察输入值之间选择方法的变更，属于估计变更）。\n- **易错**：一句话总结——\"**政策决定怎么列报，估计决定列报多少金额**\"。**改变计量基础＝政策变更；在同一计量基础下改变金额的取数方法＝估计变更**。\n- **考察**：2022-3\n- **补充规则**：企业**难以区分**某项变更是会计政策变更还是会计估计变更的，应当**将其作为会计估计变更处理**（并按会计估计变更的方法核算，即未来适用法）。\n\n### 追溯调整法：步骤与累积影响数 ★★★\n\n- **内容**：适用于①法规要求变更且国家已发布会计处理办法的按国家规定处理、国家未发布的采用追溯调整法；②企业自主变更且能提供更可靠更相关信息时采用追溯调整法（**除非不切实可行**）。\n- **计算/分录**：追溯调整法的四步固定套路：\n  1. **计算会计政策变更的累积影响数**；\n  2. 编制相关项目的调整分录；\n  3. 调整**列报前期最早期初**财务报表相关项目及其金额；\n  4. 附注说明。\n  累积影响数 = 「按变更后的会计政策对以前各期追溯计算的**列报前期最早期初留存收益应有金额**」−「列报前期最早期初留存收益**现有金额**」。留存收益含**法定盈余公积、任意盈余公积和未分配利润**，但**不考虑**由于损益变化而应补分的利润或股利。\n- **易错**：①调整的是**期初留存收益**（通过\"盈余公积\"\"利润分配——未分配利润\"），**不调整变更当期的当期损益**；②不切实可行时（累积影响数不能确定、需对管理层当时意图作假定、需对金额作重大估计且无法客观区分信息）改用**未来适用法**；③不得使用\"**后见之明**\"。\n- **考察**：2015-14、2017-6\n- **教材示例（弃置费用追溯调整）**：开采平台弃置费用 10 000 000 元、折现率 10%、10 年后弃置，弃置费用现值 = 10 000 000×0.3855 = 3 855 000 元，每年补提折旧 385 500 元，累积影响数净额为借方 4 281 016.05 元；调整分录为借\"固定资产——弃置义务\"3 855 000、贷\"预计负债——弃置义务\"3 855 000，并借\"利润分配——未分配利润\"4 281 016.05、贷\"累计折旧\"1 927 500、\"预计负债\"2 353 516.05。**教材特别提示：此处对留存收益的调整均计入未分配利润；实务中影响盈余公积计提的，还应对盈余公积作相应调整。**\n- **关联真题**：2017-6（投资性房地产由成本模式改为公允价值模式，属会计政策变更，追溯调整：借其他综合收益、贷盈余公积与未分配利润）；2015-14（同类型，差额调整盈余公积与未分配利润）。\n\n### 未来适用法 ★★\n\n- **内容**：未来适用法是指将**变更后的会计政策应用于变更日及以后**发生的交易或者事项，或者在**会计估计变更当期和未来期间**确认会计估计变更影响数的方法。\n- **易错**：未来适用法下**不需要计算累积影响数**，**也无须重编以前年度的财务报表**；变更日之前的账簿记录和报表金额**保留原有金额**，在现有金额基础上按新政策核算。\n- **考察**：2022-3\n- **教材示例**：乙公司发出存货由后进先出法改为先进先出法（因法规要求变更），采用未来适用法。当期销售成本：先进先出法 = 期初 2 500 000 + 购入 18 000 000 − 期末 4 500 000 = 16 000 000 元；后进先出法 = 2 500 000 + 18 000 000 − 2 200 000 = 18 300 000 元。净利润分别为 5 850 000 元与 4 125 000 元，政策变更使**当期净利润增加 1 725 000 元**。\n\n### 会计估计变更：一律采用未来适用法（不追溯、不调留存收益）★★★\n\n- **内容**：会计估计变更的原因只有两类——①**赖以进行估计的基础发生了变化**；②**取得了新的信息、积累了更多的经验**。会计估计变更**并不意味着以前期间的会计估计是错误的**。\n- **计算/分录**：会计估计变更**只能采用未来适用法**，三项铁律：\n  1. **不调整以前各期折旧/摊销，也不计算累积影响数**；\n  2. **变更日以后**发生的经济业务改按新估计处理（按**剩余**使用寿命、**剩余**净残值和**当期**账面价值重新计算）；\n  3. 只影响变更当期及未来期间，**不调整期初留存收益、不追溯重编比较报表**。\n- **易错**：这是与政策变更最容易被混淆的地方。**折旧方法变更（如年限平均法改为年数总和法）、折旧年限变更、净残值变更、坏账计提比例变更、无形资产摊销年限变更——一律是会计估计变更，一律未来适用法。**\n- **考察**：2022-3\n- **教材示例（会计估计变更）**：某管理用设备原值 84 万元、原估计使用寿命 8 年、净残值 4 万元、按年限平均法折旧，至变更时已提折旧 4 年共 40 万元、账面净值 44 万元；第 5 年起估计使用寿命改为 6 年、净残值改为 2 万元，则 2×22 年起每年折旧 = (44−2)÷(6−4) = **21 万元**，分录为借\"管理费用\"210 000、贷\"累计折旧\"210 000；对当年净利润的影响 = (21−10)×(1−25%) = **减少 8.25 万元**。注意分母用的是**剩余年限 2 年（6−4）**，不是全额 6 年。\n- **特别提示**：若前期会计估计**未能合理使用报表编报时已经存在且能够取得的可靠信息**，导致前期估计结果未恰当反映当时情况，则属于**前期差错**，按前期差错更正处理；反之，以当时信息合理估计为基础、随后因情况变化而变更的，属**会计估计变更**。**不能简单地将会计估计与实际结果对比就认定存在差错。**\n\n### 前期差错的概念、分类与重要性判断 ★★★\n\n- **内容**：前期差错是指由于**没有运用或错误运用**下列两种信息，而对前期财务报表造成省略或错报：①编报前期财务报表时**预期能够取得并加以考虑**的可靠信息；②前期财务报告**批准报出时能够取得**的可靠信息。\n- **易错**：前期差错通常包括**计算错误、应用会计政策错误、疏忽或曲解事实以及舞弊产生的影响**。典型情形：购入五年期国债意图长期持有却计入交易性金融资产（计算及账户分类错误）；采用了法规**不允许**的会计政策；控制权已转移却未确认收入（疏忽或曲解事实）。\n- **重要性判断**：**重要的前期差错** = 足以影响财务报表使用者对企业财务状况、经营成果和现金流量作出**正确判断**的差错；**不重要** = 不足以影响。判断取决于**金额规模**和**性质**两方面；金额越大、性质越严重，重要性水平越高。\n- **考察**：2016-5、2018-18\n\n### 前期差错更正：追溯重述法与\"以前年度损益调整\"完整流程 ★★★\n\n- **内容**：**重要的前期差错**采用**追溯重述法**（在发现当期的财务报表中调整前期比较数据）；**不重要的前期差错**可以不追溯，直接计入**发现当期**（如补缴税款计入发现当期的所得税费用）。\n- **计算/分录**：追溯重述法下，\"**以前年度损益调整**\"科目的完整四步流程（教材示例：漏记管理用固定资产折旧费 150 000 元，所得税税率 25%，按净利润的 10% 和 5% 提取法定与任意盈余公积）：\n\n| 步骤 | 分录 | 金额（元） |\n|---|---|---|\n| ① 调整差错本身 | 借：以前年度损益调整 ／ 贷：累计折旧 | 150 000 |\n| ② 调整所得税影响 | 借：应交税费——应交所得税 ／ 贷：以前年度损益调整 | 37 500（150 000×25%） |\n| ③ 结转\"以前年度损益调整\"余额至利润分配 | 借：利润分配——未分配利润 ／ 贷：以前年度损益调整 | 112 500 |\n| ④ 调整盈余公积 | 借：盈余公积 ／ 贷：利润分配——未分配利润 | 16 875（11 250＋5 625） |\n\n- **易错**：\n  - ①\"以前年度损益调整\"科目**期末结转后余额必须为 0**（主观题常问\"该科目余额\"）。\n  - ②**所得税影响要单独判断**：税法允许调整应交所得税的，冲减\"应交税费——应交所得税\"；税法不允许调整的，则调整\"递延所得税资产/负债\"。\n  - ③**盈余公积按差错对净利润影响的合计数、以原提取比例反算**：本例多计净利润 112 500 元，多提法定盈余公积 11 250 元（112 500×10%）＋任意盈余公积 5 625 元（112 500×5%），合计应冲减盈余公积 **16 875 元**，未分配利润调减 **95 625 元**（112 500−16 875）。\n  - ④**报表联动调整**：利润表调增营业成本上年金额 150 000 元、调减所得税费用上年金额 37 500 元、调减净利润上年金额 112 500 元、调减基本每股收益上年金额；所有者权益变动表在\"前期差错更正\"项目中调减盈余公积上年金额 16 875 元、调减未分配利润上年金额 95 625 元、调减所有者权益合计 112 500 元。\n  - ⑤上述处理**也可以不通过**\"以前年度损益调整\"科目，但考试中建议通过该科目以体现追溯重述。\n- **考察**：2016-1、2016-5、2018-18、2020-11、2022-6\n\n### 三类变更/更正的处理方法对照（默写这张表）★★★\n\n| 项目 | 判断关键 | 会计处理方法 | 是否调整留存收益 | 典型例子 |\n|---|---|---|---|---|\n| 会计政策变更 | 会计确认、**计量基础**或列报项目发生变更 | **追溯调整法**（不切实可行时用未来适用法） | **调整**（列报前期最早期初留存收益） | 存货计价方法变更、投资性房地产由成本模式改为公允价值模式、固定资产初始计量由全部价款改为现值 |\n| 会计估计变更 | 涉及对**不确定性**的重新估计；金额或数值的取数方法变化 | **未来适用法**（唯一方法） | **不调整** | 折旧方法变更、折旧年限变更、净残值变更、坏账比例变更、摊销年限变更 |\n| 前期差错更正 | 前期**没有运用或错误运用**当时可取得的可靠信息 | **追溯重述法**（不重要的可当期更正） | **调整**（通过\"以前年度损益调整\"） | 漏提折旧、收入确认错误、账户分类错误、滥用会计政策 |\n| 难以区分政策变更与估计变更 | — | **作为会计估计变更处理** | 不调整 | — |\n\n- **易错**：**只有会计估计变更不调留存收益**；政策变更与前期差错更正都要调整期初留存收益。命题人的经典陷阱就是给一个\"折旧年限变更\"让你追溯调整，或给一个\"计量模式变更\"让你未来适用。\n- **考察**：2022-3、2017-6、2015-14\n\n### 三者的披露要求 ★\n\n- **内容**：\n  - **会计政策变更**：披露变更的性质、内容和原因；当期和各个列报前期财务报表中受影响的项目名称和调整金额；无法进行追溯调整的，说明该事实和原因以及开始应用新政策的时点、具体应用情况。\n  - **会计估计变更**：披露变更的**内容和原因**（含变更日期、变更理由）；变更对**当期和未来期间**的影响数（对损益的影响金额以及对其他各项目的影响金额）。**不需披露累积影响数**。\n  - **前期差错更正**：披露差错的**性质**；各个列报前期财务报表中受影响的**项目名称和更正金额**；无法进行追溯重述的，说明该事实和原因以及对差错开始更正的时点、具体更正情况。**在以后期间的财务报表中，不需要重复披露以前期间已披露过的差错更正信息。**\n- **易错**：\"会计估计变更不披露累积影响数\"\"差错更正在以后期间不再重复披露\"两点最爱考。\n- **考察**：—\n\n---\n\n## 本章易错陷阱汇总\n\n1. **把\"换了一类交易\"当成会计政策变更**：本期发生的交易与以前有本质差别（如经营租赁改融资租赁、自用办公楼改出租），或对初次发生/不重要的交易采用新政策，均**不属于**会计政策变更。\n2. **把会计估计变更做成追溯调整**：折旧方法、折旧年限、净残值、坏账比例、摊销年限的变更**一律为会计估计变更、一律未来适用法**，不计算累积影响数、不调期初留存收益。命题人给\"折旧年限由 8 年改为 6 年\"却要求追溯调整，就是错在这里。\n3. **把政策变更做成未来适用法**：投资性房地产由成本模式改为公允价值模式、存货计价方法变更，都是**政策变更**，必须追溯调整期初留存收益。\n4. **累积影响数算错口径**：只体现**列报前期最早期初**的留存收益差额；**不考虑**因以前期间利润变化而应当补分的利润或股利；留存收益包含盈余公积和未分配利润。\n5. **不切实可行的三种情形记不全**：累积影响数不能确定；需对管理层当时意图作假定；需对金额作重大估计且不能客观区分两类信息。也别忘了**不得使用\"后见之明\"**。\n6. **\"以前年度损益调整\"余额不为零**：所得税影响、\"未分配利润\"结转、盈余公积调整三步都要写全，结转后余额必须为 0。\n7. **把\"估计变更\"与\"因估计错误导致的前期差错\"混为一谈**：前期未合理使用编报时已存在的可靠信息 → 前期差错；以当时信息合理估计、此后情况变化 → 估计变更。**不能把估计数与实际结果直接对比就认定差错。**\n8. **会计估计变更的未来适用法分母用错**：应按**剩余**使用寿命、**剩余**净残值与**当期**账面净值重新计算（如\"改后每年折旧 = (账面净值−新净残值)÷剩余年限\"），不能按全额年限重算。\n9. **滥用会计政策被漏判**：无充分合理证据、未经批准擅自变更、连续反复自行变更会计政策的，**视为滥用会计政策，按前期差错更正处理**。\n10. **会计估计变更的附注披露多写/少写**：只需披露变更内容和原因、对当期和未来期间的影响数，**不含累积影响数**；反之前期差错更正必须披露受影响项目名称和更正金额。\n\n## 本章分录模板（如适用）\n\n**（一）会计政策变更——追溯调整法（以投资性房地产成本模式改公允价值模式为例）**\n\n```\n借：投资性房地产——成本                    （公允价值）\n    投资性房地产——公允价值变动             （或贷方）\n    投资性房地产累计折旧（摊销）            （原已计提数）\n    投资性房地产减值准备                    （原已计提数）\n  贷：投资性房地产                          （原账面原值）\n      递延所得税负债 / 递延所得税资产        （所得税影响）\n      盈余公积                              （累积影响数×法定＋任意提取比例）\n      利润分配——未分配利润                  （累积影响数余额）\n      其他综合收益                          （非投资性房地产转换为投资性房地产时产生的部分）\n```\n\n**（二）会计估计变更——未来适用法（折旧年限与净残值变更）**\n\n```\n借：管理费用（或制造费用、销售费用等）    （重新计算的年折旧额）\n  贷：累计折旧\n```\n> 年折旧额 =（变更日账面净值 − 新预计净残值）÷ 剩余使用寿命；**不调以前年度、不编累积影响数分录**。\n\n**（三）前期差错更正——追溯重述法（\"以前年度损益调整\"四步法）**\n\n```\n① 借：以前年度损益调整                    （差错对损益的影响）\n     贷：累计折旧 / 累计摊销 / 预计负债 / 相关资产科目\n       （或：借：相关资产科目  贷：以前年度损益调整）\n\n② 调整所得税影响\n   税法允许调整应交所得税时：\n   借：应交税费——应交所得税                 （差错影响额×税率）\n     贷：以前年度损益调整\n   税法不允许调整应交所得税时：\n   借：递延所得税资产（或贷：递延所得税负债）\n     贷：以前年度损益调整（或借）\n\n③ 结转\"以前年度损益调整\"余额（结转后余额必须为 0）\n   借：利润分配——未分配利润\n     贷：以前年度损益调整\n   （若为贷方余额则方向相反）\n\n④ 调整盈余公积（按差错对净利润影响额×原提取比例）\n   借：盈余公积\n     贷：利润分配——未分配利润\n```\n\n## 与其他章的联动\n\n- 与**第五章 投资性房地产**：投资性房地产后续计量由成本模式改为公允价值模式，是会计政策变更的经典命题载体（2015-14、2017-6），追溯调整时注意\"非投资性房地产转换为投资性房地产产生的其他综合收益\"与\"政策变更累积影响数\"的分离。\n- 与**第三章 固定资产**：折旧方法变更、折旧年限变更、净残值变更属会计估计变更（2022-3），采用未来适用法；同时涉及折旧的暂时性差异与递延所得税（联动第十九章）。\n- 与**第十九章 所得税**：政策变更累积影响数与前期差错更正均需计算**所得税影响**并分别判断调整\"应交税费——应交所得税\"还是\"递延所得税资产/负债\"；所得税税率变动本身属会计估计变更。\n- 与**第二十五章 资产负债表日后事项**：日后期间**发现的差错**属于**前期差错**（按本章追溯重述法处理），**不属于**日后调整事项；只有资产负债表日**已经存在**的情况在日后取得证据，才是日后调整事项。二者处理结果都调整留存收益，但性质与适用准则不同（2020-11 正是这一辨析的载体）。\n- 与**第十三章 金融工具**：金融资产分类（业务模式）变更属于会计政策变更的判断、金融负债与权益工具的重分类，均以本章的划分基础为前置知识。\n- 与**第十七章 收入、费用和利润**：收入确认时点错误（如对价收回存在重大不确定性仍确认收入）既是收入问题，也是前期差错更正问题（2016-1）。\n",
    "25": "# 第二十五章 资产负债表日后事项\n\n> 本题库考察频次：2 题 ｜ 优先级：C ｜ 建议投入：重点掌握调整/非调整事项判断与前期差错辨析\n\n> ⚠️ **教材文本 OCR 说明**：本章 OCR 可辨认内容为「资产负债表日的确定/财务报告批准报出日」「调整事项与非调整事项的定义及区别」「调整事项的处理原则」「调整事项的具体处理方法」（含诉讼结案、资产减值、购入资产成本与售出收入、销售退回等例题）、「非调整事项的列举」。**日后事项定义句、涵盖期间的具体表述以及第三节的小标题在 OCR 中断损**，相关条目已在正文注明\"教材文本 OCR 损坏，条目标注不含教材定位\"。可确认的节标题：**第一节 资产负债表日后事项概述**、**第二节 调整事项的会计处理**；第三节为非调整事项的会计处理（依教材目录）。\n\n## 考点清单\n\n### 资产负债表日后事项的定义、涵盖期间与财务报告批准报出日\n- **优先级**：★★★\n- **内容**：（教材文本 OCR 损坏，定义句与涵盖期间的完整表述不含教材定位，以下按准则规范表述）资产负债表日后事项，是指**资产负债表日至财务报告批准报出日之间**发生的有利或不利事项；**涵盖期间**自资产负债表日（含）次日起至财务报告批准报出日止。**财务报告批准报出日**是指**董事会或类似机构批准财务报告报出的日期**，通常是指对财务报告的内容负有法律责任的单位或个人批准、财务报告对外公布的日期。如果**母公司或者子公司在国外**，无论其如何确定会计年度和会计中期，其**向国内提供的财务报告都应当根据《会计法》和企业会计准则的要求确定资产负债表日**（教材可辨认）。\n- **易错**：①涵盖期间是\"**资产负债表日至批准报出日之间**\"，**批准报出日之后**发生的事项不属于日后事项（属下一期间事项）；②日后事项**既包括不利事项也包括有利事项**；③对**中期财务报告**而言，涵盖期间的终点是**中期财务报告批准报出日**；④**财务报告批准报出日在附注中必须披露**（与第二十三章附注披露要求联动）。\n- **考察**：—\n\n### 调整事项与非调整事项的判断标准\n- **优先级**：★★★\n- **内容**：**调整事项**是指**对资产负债表日已经存在的情况提供了新的或进一步证据**的事项（即该事项**表明的情况在资产负债表日或之前已经存在**）；**非调整事项**是指**表明资产负债表日后发生的情况**的事项（该情况在资产负债表日并不存在）。判断的根本标准：**该事项表明的情况在资产负债表日或资产负债表日以前是否已经存在**——已存在→调整事项（调整报告年度财务报表）；资产负债表日后才发生→非调整事项（不调整报表数字，仅作附注披露）。\n- **易错**（判断训练，教材例题）：①**乙公司被宣告破产**导致甲公司应收账款无法收回——使乙公司财务状况恶化这一事实**在资产负债表日已经存在**，破产只是**证实**了它，属**调整事项**；②乙公司**发生火灾**导致应收账款无法收回——火灾**不可预计、资产负债表日后才发生**，属**非调整事项**；③同一笔应收账款，仅因\"日后才知道\"与\"日后才发生\"之别，处理结论相反，这是本考点的核心命题手法。\n- **考察**：—\n\n### 调整事项的会计处理原则\n- **优先级**：★★★\n- **内容**：企业发生的调整事项，应当**调整资产负债表日的财务报表**。对于年度财务报告，因日后事项发生在报告年度的次年、报告年度账目已结转（损益类科目已无余额），应分别处理：①**涉及损益的事项**通过\"**以前年度损益调整**\"科目核算——调整**增加**以前年度利润或减少以前年度亏损的记**贷方**；调整**减少**以前年度利润或增加以前年度亏损的记**借方**；②**涉及利润分配调整**的事项，直接在\"**利润分配——未分配利润**\"中核算；③**不涉及损益及利润分配**的事项，调整相关科目；④调整后应同时调整财务报表（资产负债表、利润表、所有者权益变动表及相关附注）相关项目的数字。教材例题的通用假定：**财务报告批准报出日为次年 4 月 30 日、所得税税率 25%、按净利润的 10% 提取法定盈余公积（提取后不再作其他分配）、调整事项按税法规定均可调整应交纳的所得税、涉及递延所得税资产的均假定未来期间很可能取得用来抵扣暂时性差异的应纳税所得额、不考虑报表附注中现金流量表项目的数字**。\n- **计算/分录**：\n  ```\n  ①结转损益影响：借（贷）：以前年度损益调整　贷（借）：相关资产/负债科目\n  ②所得税影响：可调整应交所得税的　借：应交税费——应交所得税　贷：以前年度损益调整\n                不可调整应交所得税的（如预计负债的损失预计时不得税前扣除）\n                             借：以前年度损益调整　贷：递延所得税资产（或贷记递延所得税负债）\n  ③结转留存收益：借（贷）：利润分配——未分配利润　贷（借）：以前年度损益调整\n  ④调整盈余公积：减少利润的　借：盈余公积　贷：利润分配——未分配利润\n                  增加利润的　借：利润分配——未分配利润　贷：盈余公积\n  ```\n- **易错**：①**\"以前年度损益调整\"只是一个过渡科目，调整完毕后必须结平（转入留存收益）**，不得留有余额，也不得直接计入本年损益；②**调整的是报告年度（上年）报表，不是发现当期的报表**；③通过\"以前年度损益调整\"调整的金额，要**按提取盈余公积的比例同步调整盈余公积与未分配利润**；④是否调整**应交所得税**取决于税法是否允许（汇算清缴前的调整事项通常可调），不允许调整的必须考虑**递延所得税**（本题库 2020-11 的得分点正在此）。\n- **考察**：2020-11\n\n### 典型调整事项（一）：日后诉讼案件结案，法院判决证实了资产负债表日的现时义务\n- **优先级**：★★★\n- **内容**：导致诉讼的事项在**资产负债表日已经发生**，日后至批准报出日之间获得新的或进一步证据（**法院判决结果**），表明符合负债确认条件或需要调整已确认负债金额的，应**确认一项新负债**或**按判决结果调整已确认负债**。债权方同理，应将判决结果作为调整事项调整报告年度报表（确认获赔权利）。\n- **计算/分录**（教材例 25-4：甲公司按或有事项准则确认预计负债 300 万元；2×17 年 2 月 10 日判决应赔偿 400 万元并于当日支付；假定该项损失**不允许在预计时税前扣除，只有在损失实际发生时才允许税前扣除**；所得税汇算清缴在 2×17 年 3 月 20 日完成）：\n  ```\n  ①补记赔偿义务：借：以前年度损益调整 1 000 000　贷：其他应付款 1 000 000\n  ②调整应交所得税：借：应交税费——应交所得税 250 000（1 000 000×25%）\n                    贷：以前年度损益调整 250 000\n  ③预计负债对应的暂时性差异此时已\"实际发生\"：\n     借：应交税费——应交所得税 750 000（3 000 000×25%）　贷：以前年度损益调整 750 000\n     借：以前年度损益调整 750 000　贷：递延所得税资产 750 000（冲销原先确认的递延所得税资产）\n  ④结转预计负债与支付赔款：借：预计负债 3 000 000　贷：其他应付款 3 000 000；\n     借：其他应付款 4 000 000　贷：银行存款 4 000 000\n  ⑤结转留存收益：借：利润分配——未分配利润 750 000　贷：以前年度损益调整 750 000\n  ⑥调整盈余公积：借：盈余公积 75 000　贷：利润分配——未分配利润 75 000（750 000×10%）\n  报表调整：调减递延所得税资产 75 万元；调增其他应付款 400 万元、调减应交税费 100 万元、\n            调减预计负债 300 万元；调减盈余公积 7.5 万元、调减未分配利润 67.5 万元；\n            利润表调增营业外支出 100 万元、调减所得税费用 25 万元、调减净利润 75 万元\n  ```\n- **易错**：①**已确认预计负债时的递延所得税资产要冲销**（\"日后事项发生后递延所得税资产不复存在\"），这是本例题最易漏的一笔；②赔款涉及的是\"**其他应付款**\"而不是继续挂\"预计负债\"；③**债权方**的调整方向相反：确认\"其他应收款\"、调增应交所得税、调增净利润并**补提**盈余公积（教材例题：调增其他应收款 400 万元、应交税费 100 万元、盈余公积 30 万元、未分配利润 270 万元）；④不要忘记按 10% 同步调整盈余公积。\n- **考察**：—\n\n### 典型调整事项（二）：日后取得确凿证据表明资产减值、进一步确定购入资产成本或售出资产收入\n- **优先级**：★★★\n- **内容**：①**资产减值**：资产负债表日按当时最佳估计反映、尚未最终确定的损失或减值，日后取得**确凿证据**证明该事实成立的，应对资产负债表日所作的估计予以**修正**。②**购入资产的成本**：资产负债表日前购入的资产已按**暂估金额**入账，日后获得证据可进一步确定成本的，调整已入账的资产成本。③**售出资产的收入**：资产负债表日已按收入确认条件确认销售收入，日后获得进一步证据（如**可变对价**的后续变化）的，调整报告年度收入金额。④**销售退回**：日后期间发生的销售退回，**属于估计偏差**（企业在资产负债表日应当能够合理预见相关情况的）→为资产负债表日已存在情况提供进一步证据→**调整事项**；**属于资产负债表日后退回条件改变，或市场突发难以预期的重大变化导致的**（如日后外汇汇率突然发生此前不可预期的重大变化导致退回比例大幅高于原合理估计）→**非调整事项**。\n- **计算/分录**（教材销售退回例题）：\n  ```\n  ①调整收入：借：以前年度损益调整 1 200 000、应交税费——应交增值税（销项税额）156 000\n             贷：应收账款 1 356 000\n  ②调整成本：借：库存商品 1 000 000　贷：以前年度损益调整 1 000 000\n  ③调整应交所得税：借：应交税费——应交所得税 50 000　贷：以前年度损益调整 50 000\n  ④结转留存收益：借：利润分配——未分配利润 150 000　贷：以前年度损益调整 150 000\n  ⑤调整盈余公积：借：盈余公积 15 000　贷：利润分配——未分配利润 15 000\n  报表调整：调减营业收入 120 万元、调减营业成本 100 万元、调减所得税费用 5 万元、\n            调减净利润 15 万元；调减盈余公积 1.5 万元、调减未分配利润 13.5 万元\n  ```\n- **易错**：①销售退回**同时冲减收入和成本**，还要**冲减增值税销项税额**，不能只冲收入；②\"属于估计偏差\"与\"日后条件改变\"是销售退回的分水岭，**不能一律按调整事项处理**；③暂估入账的资产，日后取得发票确定成本属于**调整事项**（调整报告年度资产成本与折旧），不要误按当期业务处理；④可变对价的后续变化在报告年度**已确认收入**的前提下才调整报告年度报表，若尚未确认收入则属当期业务。\n- **考察**：—\n\n### 典型调整事项（三）：日后期间发现的财务报表舞弊或差错——注意与\"前期差错\"的辨析\n- **优先级**：★★★\n- **内容**：资产负债表日后至财务报告批准报出日之间**发现的财务报表舞弊或差错**，也应作为**调整事项**调整报告年度财务报表（它对资产负债表日已存在的错报提供了进一步证据）。但**从差错的性质看，它属于\"前期差错\"**，其更正适用《企业会计准则第 28 号——会计政策、会计估计变更和差错更正》的**追溯重述法**：通过\"**以前年度损益调整**\"科目核算，再调整留存收益（**盈余公积与未分配利润**）；不重要的前期差错可以不追溯重述，直接计入发现当期（本年）的相关项目。二者**处理结果都调整留存收益，但性质不同、适用的准则不同**——这是命题人最爱的陷阱。\n- **计算/分录**（本题库 2020-11：2019 年度各事项更正对\"以前年度损益调整\"的**净借方发生额 885.6875 万元**，公司按净利润 10% 提取法定盈余公积、不提取任意盈余公积）：\n  ```\n  ①结转以前年度损益调整：借：利润分配——未分配利润 885.6875\n                          贷：以前年度损益调整 885.6875\n  ②按 10% 冲减（反向调整）盈余公积：借：盈余公积 88.56875\n                                    贷：利润分配——未分配利润 88.56875\n  ③未分配利润累计减少 ＝ 885.6875 − 88.56875 ＝ 797.11875（万元）\n  ```\n- **易错**：①**净亏损方向的\"以前年度损益调整\"余额在借方**，结转时**贷记**该科目、**借记**\"利润分配——未分配利润\"，方向写反必错；②因为是**净亏损**，应**冲减（借记）盈余公积**，而不是补提；③题目问\"属调整事项还是非调整事项\"时，若指向的是**日后发现的差错**，应指出其**本质是前期差错**、按差错更正（追溯重述）处理——不要答成\"非调整事项\"，也不要与\"由日后新证据引起的调整事项\"混为一谈；④前期差错**重点在\"是否重要\"**：重要的前期差错追溯调整前期比较数据，不重要的前期差错计入发现当期（教材例 24-4 讨论的正是\"对前期报表不重要、对本年报表重要\"的判断）；⑤期间界限：**报告年度（上年）的差错**通过\"以前年度损益调整\"；**本年度（发现当期）的差错**直接调整本年相关项目，两者不要一律套用\"以前年度损益调整\"。\n- **考察**：2020-11\n\n### 典型调整事项（四）：日后批准的利润分配方案中的现金股利\n- **优先级**：★★\n- **内容**：（教材文本 OCR 损坏，\"利润分配方案\"一条的具体表述不含教材定位；以下按现行准则与教材口径表述）资产负债表日后，企业**董事会或类似机构、股东会批准的利润分配方案中拟分配的现金股利（利润）**，由于**股利分配的权利义务关系在批准（宣告）时才确立**，应作为资产负债表日后**调整事项**处理，于**批准（宣告）时确认\"应付股利\"负债**并调整报告年度报表的相关项目；**宣告发放的股票股利、资本公积转增资本**不确认负债，属于**非调整事项**，只需在**附注中披露**。\n- **计算/分录**：\n  ```\n  确认现金股利：借：利润分配——应付现金股利　贷：应付股利\n  股票股利（不确认负债）：借：利润分配——转作股本的股利　贷：股本\n  ```\n- **易错**：①**现金股利与股票股利的处理相反**：现金股利在宣告时确认负债（调整事项），股票股利只在附注披露（非调整事项）；②不要因\"日后宣告\"而把现金股利计入**发现当期**的费用或损益——它是**利润分配**，不影响净利润；③资本公积转增资本同样是非调整事项（教材在非调整事项中列举）。\n- **考察**：—\n\n### 典型的非调整事项及其披露\n- **优先级**：★★★\n- **内容**：非调整事项**不影响资产负债表日的财务报表数字**，只说明资产负债表日后发生了某些情况；**重要的**非调整事项虽然不调整报表数字，但可能影响报表使用者对日后财务状况和经营成果的估计，**应当在附注中披露**。教材列举的典型非调整事项：①资产负债表日后发生的**重大诉讼、仲裁、承诺**；②日后**资产价格、税收政策、外汇汇率发生重大变化**；③日后因**自然灾害**导致资产发生重大损失；④日后**发行股票和债券以及其他巨额举债**；⑤日后**资本公积转增资本**；⑥日后发生**巨额亏损**；⑦日后**企业合并或处置子公司**；⑧日后**宣告发放股票股利**。另：非流动资产或处置组在**资产负债表日至财务报告批准报出日之间满足持有待售类别划分条件**的，应当作为资产负债表日后**非调整事项**进行会计处理，并在附注中披露相关信息（第十五章持有待售的列报要求，两章联动）。\n- **易错**：①**\"重大诉讼\"要区分节点**：**资产负债表日已存在**的诉讼、日后**结案**→**调整事项**；**日后才发生**的重大诉讼、仲裁、承诺→**非调整事项**——同一个词在两处含义相反，最高频的送命题；②**汇率变化**是典型的非调整事项，但**外币货币性项目在资产负债表日按当日汇率折算**的调整属正常期末折算，不要混为一谈；③**日后发行股票和债券、巨额举债**改变资本结构，是非调整事项（不调整报告年度报表）；④日后发生的**巨额亏损**是非调整事项，与\"日后发现的以前年度重大亏损（前期差错）\"性质完全不同。\n- **考察**：—\n\n### 调整事项对财务报表项目的具体影响与披露要求\n- **优先级**：★★\n- **内容**：调整事项处理后，需**同时调整报告年度财务报表相关项目的数字**：①**资产负债表项目**的年末数调整（如调增/调减应收账款、存货、其他应付款、应交税费、预计负债、递延所得税资产、盈余公积、未分配利润等）；②**利润表项目**的上年金额调整（如调增/调减营业收入、营业成本、营业外支出、营业外收入、所得税费用、净利润）；③**所有者权益变动表项目**的调整（调减/调增净利润、提取盈余公积项目中盈余公积一栏的调整、未分配利润一栏的调整）；④**附注**中披露。**非调整事项**的披露要求：应当说明非调整事项的**性质、内容**，及其**对财务状况和经营成果的影响**；**无法作出估计的，应当说明原因**。\n- **易错**：①调整时**\"净利润\"与\"提取盈余公积\"两栏要同步调整**，未分配利润的变动额＝净利润变动额×（1−提取比例）；②非调整事项**不调整报表数字**，只在附注披露——\"调表\"与\"披露\"不能换位；③无法估计影响时**必须说明原因**，不能略过不提；④现金流量表项目**不作调整**（教材例题特别假定不考虑报表附注中现金流量表项目的数字）。\n- **考察**：—\n\n## 本章易错陷阱汇总\n1. **判断的唯一标准**：该事项表明的情况**在资产负债表日或之前是否已经存在**——已存在→调整事项；资产负债表日后才发生→非调整事项。\n2. **\"日后获得证据\"vs\"日后才发生\"**：破产、诉讼结案、估计偏差导致的销售退回→调整；火灾、自然灾害、汇率突变导致的退回→非调整。\n3. **资产负债表日之后的再融资、展期、宽限期**与负债的流动性划分无关（与第二十三章联动，最高频的跨章陷阱）。\n4. **\"以前年度损益调整\"必须结平**，最终调整的是**盈余公积与未分配利润**（净亏损时冲减盈余公积，净盈利时补提盈余公积）。\n5. **已确认预计负债**的诉讼结案，日后实际发生时**要冲销原确认的递延所得税资产**，并调整应交所得税。\n6. **日后期间发现的差错本质是\"前期差错\"**，按追溯重述法处理；不要答成\"非调整事项\"，也不要与\"会计估计变更\"混淆。\n7. **重要 vs 不重要**：重要的前期差错追溯调整前期比较数据；不重要的前期差错计入发现当期。\n8. **现金股利 vs 股票股利**：现金股利在批准（宣告）时确认\"应付股利\"（调整事项）；股票股利、资本公积转增资本不确认负债，只在附注披露（非调整事项）。\n9. **非调整事项只披露不调表**，且必须说明无法估计影响的原因。\n10. 中期财务报告同样适用日后事项规则，但涵盖期间的终点是**中期财务报告批准报出日**。\n\n## 本章分录模板（如适用）\n| 业务 | 分录 |\n|---|---|\n| 结转以前年度损益调整（减少利润） | 借：利润分配——未分配利润　贷：以前年度损益调整 |\n| 结转以前年度损益调整（增加利润） | 借：以前年度损益调整　贷：利润分配——未分配利润 |\n| 调减盈余公积（净亏损） | 借：盈余公积　贷：利润分配——未分配利润 |\n| 补提盈余公积（净盈利） | 借：利润分配——未分配利润　贷：盈余公积 |\n| 调整应交所得税（可税前扣除） | 借：应交税费——应交所得税　贷：以前年度损益调整 |\n| 冲销原递延所得税资产 | 借：以前年度损益调整　贷：递延所得税资产 |\n| 诉讼结案补记赔偿义务 | 借：以前年度损益调整　贷：其他应付款；借：预计负债　贷：其他应付款 |\n| 销售退回（调整报告年度） | 借：以前年度损益调整、应交税费——应交增值税（销项税额）　贷：应收账款；借：库存商品　贷：以前年度损益调整 |\n| 日后批准现金股利 | 借：利润分配——应付现金股利　贷：应付股利 |\n| 日后宣告股票股利 | 借：利润分配——转作股本的股利　贷：股本（无需确认负债） |\n\n## 与其他章的联动\n- 与第八章（负债）：预计负债、其他应付款的确认金额调整；日后事项影响的负债在报表上的流动性划分（资产负债表日之后的展期行为不影响划分）。\n- 与第十章（股份支付）、第九章（职工薪酬）：日后发现的相关差错（本题库 2018-18）按前期差错处理，与本章的辨析考点同源。\n- 与第十二章（或有事项）：日后诉讼结案是或有事项与日后事项的交叉命题点；预计负债的确认、计量与递延所得税处理在此汇总。\n- 与第十五章（持有待售的非流动资产、处置组和终止经营）：资产负债表日至批准报出日之间**满足持有待售类别划分条件**的，作为**非调整事项**处理并披露。\n- 与第十六章（所有者权益）：调整事项的最终落脚点是\"盈余公积＋未分配利润\"，与留存收益的计提基数、比例规则直接衔接。\n- 与第十九章（所得税）：调整应交所得税与调整递延所得税资产的判断（可税前扣除 vs 预计时不得税前扣除）。\n- 与第二十三章（财务报告）：**附注中披露的\"财务报告批准报出日\"是日后事项涵盖期间的终点**；所有者权益变动表中\"前期差错更正\"栏的填列依据即本章及第二十四章的处理结果。\n- 与第二十四章（会计政策、会计估计及其变更和差错更正）：**日后期间发现的差错适用第 28 号准则**，\"以前年度损益调整\"的结转与留存收益调整规则完全一致；重要性的判断依据亦在第二十四章。\n",
    "26": "# 第二十六章 企业合并\n\n> 本题库考察频次：18 题 ｜ 优先级：A 类（高频核心章） ｜ 建议投入：精读＋默写分录（本章篇幅短但每一条都是命题点，重点在\"类型判断→业务判断→购买日→合并成本→商誉/负商誉→递延所得税→或有对价→反向购买\"这条完整链条上，必须能一口气走完）\n\n---\n\n## 一、企业合并的定义与方式\n\n### 企业合并的定义与\"报告主体变化\"\n- **优先级**：★★★\n- **内容**：企业合并是**将两个或两个以上单独的企业合并形成一个报告主体**的交易或事项。判断要点有两条：①取得的资产或资产、负债组合**是否构成业务**；②交易前后**是否引起报告主体的变化**（报告主体的变化产生于**控制权**的变化）。\n- **内容（典型情形）**：①A增发普通股自B原股东处取得B全部股权，B仍持续经营；②A支付对价取得B全部净资产，撤销B法人资格；③A以自身资产出资投入B，取得对B的控制权，B仍独立经营——均构成企业合并。\n- **易错**：仅购买一组不构成业务的资产，**不是**企业合并，按资产购买处理。\n- **考察**：`2015-1`\n\n### 三种合并方式：控股合并、吸收合并、新设合并\n- **优先级**：★★\n- **内容**：\n  | 方式 | 结果 | 会计要点 |\n  |---|---|---|\n  | 控股合并 | 取得控制权，被合并方保留法人资格 | 合并方个别报表确认长期股权投资；纳入合并范围 |\n  | 吸收合并 | 取得全部净资产，注销被合并方法人资格 | 合并方账簿及个别报表确认各项资产、负债；**不编合并报表** |\n  | 新设合并 | 各方法人资格均注销，新设企业持有 | 按法律法规及合同协议执行 |\n- **易错**：吸收合并下**商誉/负商誉在购买方个别报表中即予确认**；控股合并下商誉只在合并报表中列示。\n- **考察**：`2015-2`\n\n## 二、企业合并类型的划分（第一个必考点）\n\n### 同一控制下企业合并的判断\n- **优先级**：★★★\n- **内容**：参与合并的企业在合并前后**均受同一方或相同的多方最终控制**，且该控制**并非暂时性**的。两个核心要素：①合并前后受同一方或相同多方最终控制；②该最终控制并非暂时性（通常指**1年以上**）。\n- **易错**：①**同受国家控制**的企业之间的合并，**不应仅仅**因为合并前后均受国家控制就认定为同一控制下企业合并；②要按**实质重于形式**综合判断，关注作价是否按市场原则确定；③\"最终控制方\"往往需要穿透多层股权结构去找（如省国资委通过下属投资公司间接控制）。\n- **考察**：`2015-1`、`2016-15`、`2022-13`\n\n### 非同一控制下企业合并的判断\n- **优先级**：★★★\n- **内容**：参与合并各方在合并前后**不受同一方或相同多方最终控制**的合并交易，即同一控制下企业合并以外的其他企业合并，采用**购买法**。\n- **易错**：交易前一方已持有少量股权（如2%）但不构成控制的，不因该存量股权而改变类型判断；判断的关键是\"交易前后是否存在一个能控制**所有**参与合并企业的最终控制方\"。\n- **考察**：`2015-1`、`2021-10`\n\n## 三、业务的判断与集中度测试\n\n### \"业务\"的三要素\n- **优先级**：★★★\n- **内容**：业务是指企业内部某些生产经营活动或资产、负债的组合，该组合具有**投入、加工处理过程、产出**三要素：\n  - **投入**：原材料、人工、必要的生产技术等无形资产，以及构成产出能力的机器设备等其他长期资产。\n  - **加工处理过程**：具有一定管理能力、运营过程，能够组织投入形成产出能力的系统、标准、协议、惯例或规则。\n  - **产出**：为客户提供的产品或服务、为投资者或债权人提供的股利或利息等投资收益，以及企业日常活动产生的其他收益。\n- **易错**：合并方取得的组合**是否具有实际产出并不是**判断其构成业务的必要条件。\n- **考察**：`2015-1`\n\n### 构成业务的两个必要条件\n- **优先级**：★★★\n- **内容**：取得的组合应当**至少同时具有一项投入和一项实质性加工处理过程**，且二者相结合对产出能力有**显著贡献**，才构成业务。\n- **内容（\"实质性\"判断）**：\n  | 情形 | 判断标准 |\n  |---|---|\n  | 合并日**无产出** | 同时满足：①该加工处理过程对投入转化为产出**至关重要**；②具备执行该过程所需技能、知识或经验的有组织的员工，且具备必要的材料、权利、其他经济资源等投入 |\n  | 合并日**有产出** | 满足之一：①对**持续产出至关重要**且具备有组织的员工；②对产出能力有**显著贡献**且该过程**独有、稀缺或难以取代** |\n- **易错**：应从**市场参与者**角度判断该组合能否作为业务进行管理和经营，**不是**根据合并方的管理意图或被合并方的经营历史来判断。反例：只收购一项采矿权和少量现金，无生产设施、未开展开采活动，也无实际产出——不构成业务。\n- **考察**：`2015-1`\n\n### 不构成业务 → 资产购买的后果\n- **优先级**：★★★\n- **内容**：非同一控制下企业合并中取得的组合**不构成业务**的，按**资产购买**处理：不确认商誉，按取得各项资产、负债的相对公允价值（或按其他适当基础）分配购买成本。\n- **易错（与业务合并的三点差异）**：\n  | 项目 | 资产购买 | 业务合并 |\n  |---|---|---|\n  | 交易费用 | 通常作为转让对价的一部分，**资本化**进所购资产成本 | **费用化** |\n  | 商誉 | **不确认商誉** | 合并成本＞可辨认净资产公允价值份额的部分确认**商誉** |\n  | 递延所得税 | 初始确认的暂时性差异**不确认**递延所得税（非业务合并例外） | 购买日资产、负债账面价值与计税基础不同形成的暂时性差异**应确认**递延所得税影响 |\n- **考察**：`2015-1`\n\n### 集中度测试\n- **优先级**：★★\n- **内容**：判断非同一控制下企业合并中取得的组合是否构成业务，购买方**也可选择**采用集中度测试（可选，非强制）。通过测试的，可直接认定为**不构成业务**；未通过的，仍应按前述\"投入＋实质性加工处理过程\"条件判断。\n- **易错**：集中度测试是\"简化通道\"，不是唯一判据；选择使用与否属于企业判断。\n- **考察**：—\n\n## 四、购买方与购买日的确定\n\n### 购买方的确定\n- **优先级**：★★★\n- **内容**：购买方＝在企业合并中**取得对另一方或多方控制权**的一方，按第27章控制的定义和要素综合判断。难以确定时可参考以下迹象：\n  1. 以支付现金、转让非现金资产或承担负债方式进行的合并，**支付方**一般为购买方；\n  2. 股东在合并后主体中拥有**相对较高投票比例**的一方一般为购买方；\n  3. 合并后能**主导生产经营决策**的一方管理层所属企业一般为购买方；\n  4. 参与合并一方的**公允价值远大于**另一方的，公允价值较大一方很可能为购买方；\n  5. 以有表决权股份换取另一方现金及其他资产的，**付出现金或其他资产**的一方很可能为购买方；\n  6. 通过**权益互换**实现的合并，发行权益性证券的一方通常为购买方；但若其在合并后被另一方控制，则为**反向购买**。\n- **考察**：`2015-1`\n\n### 购买日的确定（五个条件＋过渡期损益）\n- **优先级**：★★★\n- **内容**：购买日＝购买方**获得对被购买方控制权**的日期，即控制权转移的日期。同时满足下列条件一般可认为实现控制权转移：\n  1. 企业合并合同或协议已获**股东会等内部权力机构**通过；\n  2. 需要经国家有关主管部门审批的，**已获批准**；\n  3. 参与合并各方已办理必要的**财产权交接手续**；\n  4. 购买方已支付购买价款的**大部分（一般应超过50%）**，且有能力、有计划支付剩余款项；\n  5. 购买方**实际上已经控制**了被购买方的财务和生产经营政策，享有相应收益并承担相应风险。\n- **易错**：①评估基准日至股权转移日之间标的资产**净损益归属**的约定**不影响**购买日的确定，该约定原则上是对合并成本的**调整**；②涉及\"合并、分立、解散、清算\"等特殊事项需董事会**一致通过**的章程条款，**不影响**投资方对日常经营相关活动的控制能力判断；③\"交易日\"是购买方在自身账簿和报表中确认对被投资单位投资的日期，分步实现的企业合并中，购买日是**最终取得控制权**的日期。\n- **考察**：`2021-10`\n\n## 五、非同一控制下企业合并的会计处理\n\n### 购买日可辨认资产、负债的确认与\"单独设置备查簿\"\n- **优先级**：★★★\n- **内容**：购买方在购买日取得的被购买方各项可辨认资产和负债，**不局限于**被购买方合并前已确认的资产、负债，还包括合并前未予确认但购买日符合确认条件的项目（如以前期间因无足够应纳税所得额而未确认的**递延所得税资产**）。\n- **内容（确认条件）**：①各项资产（无形资产除外）——未来经济利益预期能够流入企业且公允价值能够可靠计量；②各项负债（或有负债除外）——履行义务预期导致经济利益流出企业且公允价值能够可靠计量。\n- **内容（无形资产）**：应符合第4章无形资产的界定且购买日公允价值能够可靠计量，关键看是否满足**可辨认性**标准（源于合同或法定权利，或可分离）。\n- **内容（或有负债）**：即使导致经济利益流出的可能性**还比较小**，只要公允价值能够**合理确定**，也需要作为合并中取得的负债确认。\n- **易错**：①被购买方合并前已确认的**商誉和递延所得税项目**，购买方在分配合并成本时**不应予以考虑**，要重新按购买日公允价值确定，再据此确认递延所得税；②母公司应**单独设置备查簿**，记录购买日各项可辨认资产、负债的公允价值及商誉（或计入当期损益的金额），作为以后期间编制合并报表的基础，被购买方纳入合并的资产、负债是以**购买日确定的公允价值为基础持续计算**的结果。\n- **考察**：`2018-5`、`2021-10`\n\n### 合并成本的构成（中介费用不进合并成本）\n- **优先级**：★★★\n- **内容**：企业合并成本＝购买方**付出的资产、发生或承担的负债、发行的权益性证券的公允价值之和**。\n  | 支出性质 | 处理 |\n  |---|---|\n  | 审计、法律服务、评估咨询等中介费用及其他相关管理费用 | 发生时计入当期损益（**管理费用**） |\n  | 与发行**权益性工具**作为合并对价直接相关的交易费用 | 冲减**资本公积（资本溢价/股本溢价）**，不足依次冲减盈余公积、未分配利润 |\n  | 与发行**债务性工具**作为合并对价直接相关的交易费用 | 计入**债务性工具初始确认金额** |\n- **计算/分录**：\n  ```\n  借：长期股权投资                 （合并成本）\n    贷：银行存款 / 无形资产 / 固定资产清理 / 股本 / 资本公积——股本溢价\n        资产处置损益                 （付出资产公允价值与账面价值之差）\n  借：管理费用                     （中介费用）  贷：银行存款\n  ```\n- **易错**：①以库存商品作对价的，按**公允价值**贷记\"主营业务收入\"或\"其他业务收入\"，并同时结转成本；②以分类为以公允价值计量且其变动计入其他综合收益的**债权性**金融资产作对价的，原持有期间的公允价值变动形成的其他综合收益**一并转入投资收益**。\n- **考察**：`2015-2`、`2018-5`\n\n### 商誉与负商誉\n- **优先级**：★★★\n- **内容**：\n  | 情形 | 处理 |\n  |---|---|\n  | 合并成本 **＞** 取得的可辨认净资产公允价值份额 | 差额确认为**商誉**。控股合并下表现为**合并财务报表中列示的商誉**；吸收合并下表现为购买方在**账簿及个别财务报表**中确认的商誉 |\n  | 合并成本 **＜** 取得的可辨认净资产公允价值份额（**廉价购买**） | 差额确认为**当期损益（营业外收入）**，即\"负商誉\" |\n- **计算/分录**：\n  ```\n  商誉＝企业合并成本－合并中取得的被购买方可辨认净资产公允价值份额\n  负商誉（合并报表口径）：\n     借：有关资产（公允价值） / 商誉等\n       贷：长期股权投资 / 有关负债\n           营业外收入          （差额）\n  ```\n- **易错**：①负商誉**不影响**母公司账簿及个别报表中长投初始投资成本的确定，只在**编制合并财务报表时**体现为企业合并发生当期合并利润表的**损益**；②确认负商誉前，应**先复核**各项资产、负债及合并成本的计量是否正确。\n- **考察**：`2015-2`、`2021-10`\n\n### 可辨认净资产公允价值与递延所得税（评估增值→递延所得税负债→减少可辨认净资产→增加商誉）\n- **优先级**：★★★\n- **内容**：购买日按公允价值确定各项可辨认资产、负债后，其**账面价值与计税基础的差额**形成暂时性差异，应按第19章规定确认相应的**递延所得税资产或负债**。评估增值通常形成**递延所得税负债**，该负债本身也是\"合并中取得的可辨认负债\"的组成部分，会**减少可辨认净资产公允价值**，从而**增加商誉**。\n- **计算/分录**：\n  ```\n  可辨认净资产公允价值（税后口径）\n      ＝ 各项资产、负债公允价值之和 － 评估增值 × 所得税税率\n  商誉 ＝ 合并成本 － 可辨认净资产公允价值（税后口径）× 持股比例\n  ```\n- **易错**：①商誉本身**不确认**递延所得税负债（初始确认豁免）；②被购买方合并前已确认的递延所得税项目在分配合并成本时**不予考虑**，要重新计算；③\"可辨认净资产公允价值份额\"必须是**扣减递延所得税负债后**的金额，否则商誉会算小。\n- **考察**：`2018-5`、`2021-10`、`2022-11`\n\n### 递延所得税资产与商誉的动态调整（12个月界限）\n- **优先级**：★★\n- **内容**：\n  | 情形 | 处理 |\n  |---|---|\n  | 购买日取得的被购买方以前期间**未弥补亏损**等可抵扣暂时性差异，在购买日后**12个月内**，因取得新信息表明购买日相关情况已存在且预计未来能取得足够应纳税所得额 | 确认递延所得税资产，**冲减商誉**；商誉不足冲减的，差额计入**当期所得税费用** |\n  | 购买日后**超过12个月**，或购买日不存在相关情况而购买日以后**新出现**的情况 | 确认的递延所得税资产计入**当期损益（所得税费用）**，**不得调整商誉金额** |\n- **易错**：12个月是\"暂估期/计量期\"的概念，方向是\"冲减商誉\"而不是\"增加商誉\"。\n- **考察**：`2018-5`\n\n### 暂时确定价值的后续调整（计量期调整 vs 前期差错）\n- **优先级**：★★\n- **内容**：①购买日因评估报告未取得等原因对可辨认资产、负债价值**暂估**入账的，在取得确凿证据后应**视同在购买日**即以该金额确认，相应调整**比较报表**中的商誉及折旧费用，并在附注中说明；②自购买日算起**12个月以后**对企业合并成本或取得的可辨认资产、负债价值的调整，按第24章会计政策、会计估计变更和差错更正的原则处理，即作为**前期差错**处理。\n- **易错**：暂估调整**不追溯调整已报出的以前年度报表**，而是调整比较报表口径；超期调整走\"前期差错\"而不是\"估计变更\"。\n- **考察**：—\n\n### 补偿性资产（出售方对购买方的补偿承诺）\n- **优先级**：★★\n- **内容**：出售方针对被购买方或有事项、特定资产或负债的不确定性结果给予购买方补偿，形成**补偿性资产**。\n  | 层面 | 处理 |\n  |---|---|\n  | **合并财务报表** | 在确认被补偿项目的同时确认补偿性资产，以**与被补偿项目相同的基础**计量，并考虑管理层对其可收回性的估计。与购买日已确认且以公允价值计量的项目相关的，在购买日按公允价值初始计量；与购买日未确认或未以公允价值计量的项目相关的，采用与被补偿项目相一致的假设。存在补偿约定时，合并层面确认补偿性资产实际**调整了合并对价，从而调整商誉** |\n  | **个别财务报表** | 按第12章或有事项准则，在符合或有资产确认条件（**基本确定能够收到且金额能够可靠计量**）时确认补偿性资产，同时**冲减长期股权投资的初始投资成本** |\n- **计算/分录**：\n  ```\n  个别报表（符合条件时）：\n    借：补偿性资产        贷：长期股权投资\n  收到补偿款：\n    借：银行存款          贷：补偿性资产\n  合并报表（购买日）：\n    借：补偿性资产 / 其他可辨认资产、负债 / 商誉\n      贷：预计负债 / 长期股权投资\n  ```\n- **易错**：①后续每个资产负债表日按与**被补偿项目相一致**的基础调整补偿性资产，预期无法收回的金额计入**投资收益**；②终止确认时差额计入**投资收益**；③\"补偿性资产\"科目在资产负债表中按流动性分别在\"**其他流动资产**\"和\"**其他非流动资产**\"列示。\n- **考察**：`2018-5`\n\n### 或有对价的初始与后续计量（不调整商誉）\n- **优先级**：★★★\n- **内容**：\n  | 时点 | 处理 |\n  |---|---|\n  | **购买日** | 按购买日**公允价值**计入合并成本，相应影响商誉 |\n  | **购买日后** | 在购买日后**12个月内**，若有新证据表明购买日已存在的情况、且属于对计量期内的调整，**调整合并成本及商誉**；**超过12个月**或属于购买日后**新发生**的情况，或有对价公允价值变动计入**当期损益** |\n- **内容（或有对价性质区分）**：\n  | 性质 | 后续计量 |\n  |---|---|\n  | **权益性**或有对价（以自身权益工具结算） | 不重新计量，**不确认公允价值变动** |\n  | **资产性/金融工具**或有对价（如现金补偿） | 按金融工具准则处理，公允价值变动计入**当期损益（公允价值变动损益）** |\n- **计算/分录**：\n  ```\n  购买日：或有对价估计为0 → 长期股权投资成本＝已支付对价\n    借：长期股权投资        贷：银行存款\n  后续（现金补偿类，12个月后/新情况）：\n    借：交易性金融资产      贷：公允价值变动损益\n  ```\n- **易错**：①**个别财务报表中不作为对长期股权投资成本的调整**，相应地**在合并财务报表中亦不能调整购买日原已确认的商誉金额**；②或有对价公允价值下降可能表明购买日已确认的**商誉已发生减值**，应对商誉及相关长期资产进行减值测试；③被购买方未实现承诺利润是\"购买日后新发生的情况\"，即使金额很大也不调商誉。\n- **考察**：`2018-5`、`2021-10`\n\n## 六、同一控制下企业合并的会计处理\n\n### 同一控制下企业合并的处理原则（权益结合法）\n- **优先级**：★★★\n- **内容**：\n  1. 合并方在合并中确认取得的被合并方资产、负债**仅限于被合并方账面上原已确认的**资产和负债，**不产生新的资产和负债**（**不确认新的商誉**），但被合并方在合并前账面上**原已确认的商誉**应作为合并中取得的资产确认。\n  2. 取得的各项资产、负债应维持其在被合并方的**原账面价值不变**；被合并方会计政策、会计期间与合并方不一致的，先按合并方政策**统一调整**。\n  3. 取得的净资产入账价值与支付对价账面价值之间的差额**调整所有者权益**（先资本公积——资本溢价/股本溢价，不足依次冲减盈余公积、未分配利润），**不计入当期损益**。\n  4. 视同合并后形成的报告主体自最终控制方开始实施控制时起**一直是一体化存续**下来的。\n- **易错**：被合并方是最终控制方以前年度**从第三方收购**来的，应以被合并方的资产、负债（**包括最终控制方收购被合并方而形成的商誉**）在**最终控制方财务报表中的账面价值**为基础处理；被合并方同时进行公司制改制并评估调账的，应以**评估调账后的账面价值**并入合并方。\n- **考察**：`2016-15`、`2022-13`\n\n### 同一控制下合并日合并财务报表：留存收益的恢复\n- **优先级**：★★★\n- **内容**：合并资产负债表中，被合并方在合并前实现的**留存收益（盈余公积＋未分配利润）中归属于合并方的部分**，应自合并方的**资本公积**转入盈余公积和未分配利润。\n  | 情况 | 恢复上限 |\n  |---|---|\n  | 合并方账面资本公积（资本溢价/股本溢价）贷方余额 **＞** 归属于合并方的留存收益 | **全额恢复** |\n  | 合并方账面资本公积（资本溢价/股本溢价）贷方余额 **＜** 归属于合并方的留存收益 | 以资本公积贷方余额为限恢复 |\n- **计算/分录**：\n  ```\n  借：资本公积\n    贷：盈余公积、未分配利润\n  （因资本公积不足而未全额恢复的，合并方应在报表附注中说明）\n  ```\n- **易错**：恢复的对象是\"被合并方**合并前**实现的留存收益中**归属于合并方**的部分\"，不是全部留存收益。\n- **考察**：`2016-15`\n\n### 同一控制下合并日合并财务报表：合并利润表、现金流量表与比较报表\n- **优先级**：★★★\n- **内容**：①合并利润表应包含合并方及被合并方**自合并当期期初至合并日**实现的净利润，并在\"净利润\"项下单列\"**其中：被合并方在合并前实现的净利润**\"；②合并现金流量表应包含双方自合并当期期初至合并日产生的现金流量；③**比较报表**应视同参与合并各方在最终控制方开始实施控制时即以目前状态存在，**调整前期比较报表**——因合并实际发生在当期，以前期间合并方账面上并不存在对被合并方的长期股权投资，编制比较报表时应将被合并方有关资产、负债并入后，因合并而增加的净资产在比较报表中调整所有者权益项下的**资本公积（资本溢价或股本溢价）**；④合并资产负债表的**期初数**应调整。\n- **易错**：①合并方的设立日可能**晚于**被合并方，新设公司应**追溯**至自比较期最早期初开始编制合并财务报表，即使该时点早于新设公司成立日，也**不应早于**被注入的其他子公司或业务处于最终控制方控制时点；②同一控制下合并**必须**在合并日编制合并财务报表。\n- **考察**：`2016-15`\n\n## 七、反向购买\n\n### 反向购买的识别与合并成本\n- **优先级**：★★★\n- **内容**：非同一控制下企业合并以**发行权益性证券交换股权**方式进行的，通常发行权益性证券的一方为购买方；但若发行方在合并后其**生产经营决策被参与合并的另一方所控制**，则发行方是**法律上的母公司、会计上的被购买方**，构成**反向购买**。\n- **内容（合并成本）**：法律上的**子公司（购买方）**的企业合并成本＝其**如果以发行权益性证券的方式为获取在合并后报告主体的股权比例，应向法律上母公司的股东发行的权益性证券数量 × 其公允价值**。\n  - 购买方权益性证券在购买日**存在公开报价**的，通常以公开报价作为其公允价值；\n  - **不存在可靠公开报价**的，参照购买方公允价值和被购买方公允价值中**有更明显证据支持**的一个作为基础确定。\n- **计算**：假定B企业发行本企业普通股在合并后主体享有同样股权比例时，B企业应发行股数 ＝ 法律上母公司原股东持股比例 ÷ 购买方假定发行比例 － …（口径：以合并后报告主体股权比例反推）。\n- **考察**：—\n\n### 反向购买合并财务报表的编制（六条原则）\n- **优先级**：★★★\n- **内容**：\n  1. 法律上**子公司**（会计上的购买方）的资产、负债按其**合并前的账面价值**确认和计量；\n  2. 合并财务报表中的**留存收益和其他权益余额**反映的是法律上子公司合并前的金额；\n  3. 合并财务报表中的**权益性工具金额**应当反映法律上子公司合并前发行在外的股份面值以及假定在确定企业合并成本过程中新发行的权益性工具的金额；但**权益结构**应反映法律上**母公司**的权益结构（即法律上母公司发行在外权益性证券的数量和种类）；\n  4. 法律上**母公司**（会计上的被购买方）的有关可辨认资产、负债在并入合并财务报表时，按其**购买日确定的公允价值**合并；企业合并成本大于取得的法律上母公司可辨认净资产公允价值份额的部分确认为**商誉**，小于的部分确认为**合并当期损益**；\n  5. 合并财务报表的**比较信息**应当是法律上**子公司**的比较信息；\n  6. 法律上子公司的股东在合并过程中**未将其持有的股份转换为**法律上母公司股份的，该部分股东享有的权益份额在合并财务报表中作为**少数股东权益**列示（其金额为按持股比例计算享有法律上子公司**合并前净资产账面价值**的份额）；对于**法律上母公司的所有股东**，虽然被认为是会计上的被购买方，但其享有合并形成报告主体的净资产及损益，**不应**作为少数股东权益列示。\n- **易错**：①上述反向购买的会计处理原则**仅适用于合并财务报表的编制**；法律上母公司在合并中形成的对法律上子公司长期股权投资成本的确定，**仍遵从第2号准则**（按付出对价公允价值）。②合并报表中**股本**反映法律上母公司发行在外的股份，**资本公积**为倒挤数。\n- **考察**：—\n\n### 反向购买下每股收益的计算\n- **优先级**：★★\n- **内容**：\n  - 发生反向购买**当期**用于计算每股收益的发行在外普通股加权平均数：①**自当期期初至购买日**，假定为在该项合并中**法律上母公司向法律上子公司股东发行的普通股数量**；②**自购买日至期末**，为**实际发行在外的普通股数量**（即合并后报告主体的实际股数）。\n  - 提供**比较合并财务报表**时，比较前期的基本每股收益应以法律上子公司在每一比较报表期间**归属于普通股股东的净损益**除以在反向购买中**法律上母公司向法律上子公司股东发行的普通股股数**计算确定。\n  - 上述假定法律上子公司发行的普通股股数在比较期间内和自反向购买发生期间的期初至购买日之间**未发生变化**；若发生变动，应适当考虑其影响进行调整。\n- **易错**：比较期间一律用\"法律上母公司为换取法律上子公司股权而发行的股数\"，**不是**法律上子公司的实际股数。\n- **考察**：—\n\n## 八、被购买方的会计处理\n\n### 被购买方能否按公允价值调账\n- **优先级**：★★\n- **内容**：非同一控制下企业合并中，购买方通过企业合并取得被购买方**100%股权**的，被购买方**可以**按照合并中确定的可辨认资产、负债的公允价值确认其账面价值。\n- **易错**：**除此之外的其他情况下，被购买方不应因企业合并改记**有关资产、负债的账面价值。这是常考的一句话判断。\n- **考察**：`2021-10`\n\n### 分步实现非同一控制下企业合并的合并成本\n- **优先级**：★★★\n- **内容**：通过多次交易分步实现非同一控制下企业合并的，**购买日**为购买方最终取得控制权的日期；合并成本＝购买日之前所持被购买方股权的**购买日公允价值**（原权益法核算的为原账面价值，视具体准则口径）＋购买日新增投资成本。\n- **计算/分录**：\n  ```\n  合并成本＝原持有股权在购买日的公允价值 ＋ 新增投资支付对价的公允价值\n  商誉＝合并成本 － 购买日可辨认净资产公允价值（税后口径）× 持股比例\n  ```\n- **易错**：原股权在购买日的**公允价值与账面价值差额**要计入当期损益（原权益法核算的按权益法口径结转），不能直接沿用原账面价值。\n- **考察**：`2018-5`、`2018-6`\n\n## 本章易错陷阱汇总\n1. **中介费用（审计、评估、法律服务）计入管理费用**，既不进合并成本，也不进长期股权投资初始成本；发行权益工具的交易费用冲减资本公积；发行债务工具的交易费用计入债务工具初始确认金额。三个口径每年必考其一。\n2. **同一控制下不确认新的商誉**，但被合并方（或最终控制方收购时形成）的**原已确认商誉**要作为合并中取得的资产确认。\n3. **评估增值产生的递延所得税负债会减少可辨认净资产公允价值份额**，从而使商誉变大——这是计算商誉时最常被漏掉的一步。\n4. **或有对价在个别报表中不调整长期股权投资成本**，在合并报表中也**不调整商誉**；只有购买日后12个月内、属于购买日已存在情况的新证据，才调整合并成本和商誉。\n5. **负商誉只在合并报表中确认为营业外收入**，不影响母公司个别报表长投成本。\n6. **市场参与者角度**判断业务，不是合并方管理意图或被合并方经营历史；**有无实际产出不是构成业务的必要条件**。\n7. **同受国家控制不等于同一控制**，必须按实质重于形式判断。\n8. **被购买方只有被100%收购时才可以按公允价值调账**，其他情况一律不得改记账面价值。\n9. **反向购买中最容易错的是股本与留存收益**：留存收益和其他权益余额反映法律上**子公司**（会计购买方）合并前的金额，权益结构反映法律上**母公司**。\n10. **过渡期损益归属的协议约定不影响购买日的确定**，它是对合并成本的调整。\n\n## 本章分录模板\n\n**① 非同一控制下控股合并（购买方个别报表）**\n```\n借：长期股权投资                      （合并成本）\n    应收股利\n    累计摊销/累计折旧\n  贷：银行存款 / 无形资产 / 固定资产清理 / 股本 / 资本公积——股本溢价\n      资产处置损益 / 投资收益\n借：管理费用                          （中介费用）  贷：银行存款\n借：资本公积——股本溢价                （发行权益工具交易费用）  贷：银行存款\n```\n\n**② 同一控制下控股合并（合并方个别报表）**\n```\n借：长期股权投资——投资成本    （被合并方权益在最终控制方合并报表中账面价值份额＋商誉）\n    累计摊销/累计折旧\n    资本公积——资本溢价/股本溢价  （借方差额）\n    盈余公积 / 利润分配——未分配利润（资本公积不足冲减时）\n  贷：银行存款 / 无形资产 / 固定资产清理 / 股本\n      资本公积——资本溢价/股本溢价  （贷方差额）\n```\n\n**③ 同一控制下吸收合并（合并方账簿）**\n```\n借：各项资产（最终控制方合并报表中的账面价值）\n  贷：各项负债（同上）\n      股本\n      资本公积——股本溢价        （差额，不足则依次冲减盈余公积、未分配利润）\n```\n\n**④ 同一控制下合并日合并报表调整分录**\n```\n借：资本公积\n  贷：盈余公积\n      未分配利润        （以合并方资本公积贷方余额为限）\n```\n\n**⑤ 购买日合并报表——公允价值调整与抵销（非同一控制）**\n```\n（1）按公允价值调整子公司报表：\n借：存货 / 固定资产 / 无形资产等      （评估增值）\n  贷：应收账款 / 资本公积\n借：资本公积                          （评估增值的所得税影响）\n  贷：递延所得税负债\n（2）长期股权投资与子公司所有者权益抵销：\n借：股本 / 资本公积 / 盈余公积 / 未分配利润\n    商誉                              （合并成本－可辨认净资产公允价值份额）\n  贷：长期股权投资\n      少数股东权益\n```\n\n**⑥ 负商誉（廉价购买）**\n```\n借：有关资产、负债（公允价值）\n  贷：长期股权投资\n      营业外收入          （合并成本小于可辨认净资产公允价值份额的差额）\n```\n\n**⑦ 反向购买合并报表核心调整**\n```\n借：法律上母公司各项可辨认资产、负债  （购买日公允价值）\n    商誉                              （合并成本＞法律上母公司可辨认净资产公允价值份额）\n  贷：法律上母公司原所有者权益项目\n      少数股东权益（未参与股权交换的法律上子公司股东按合并前净资产账面价值享有的份额）\n```\n\n## 与其他章的联动\n- 与第6章（长期股权投资与合营安排）：**类型判断在26章，初始计量与后续计量在6章**。同一控制下的\"份额＋商誉\"口径、非同一控制下的\"合并成本＝对价公允价值\"口径，两章要连起来背。\n- 与第27章（合并财务报表）：本章确定**购买日、合并成本、可辨认净资产公允价值、商誉**四个数据，第27章用它们编制购买日及以后期间的调整与抵销分录；同一控制下合并的合并报表编制规则也在两章间分工。\n- 与第19章（所得税）：评估增值→递延所得税→可辨认净资产→商誉这条传导链，以及12个月内冲减商誉/12个月后计入所得税费用的规则。\n- 与第7章（资产减值）：**商誉不摊销，至少每年减值测试**；企业合并中或有对价未实现可能表明商誉已减值。\n- 与第24章（会计政策、会计估计及其变更和差错更正）：购买日后12个月以外对合并成本或可辨认资产、负债价值的调整，作为**前期差错**处理。\n- 与第28章（每股收益）：**反向购买当期与比较期间的每股收益计算**是28章与26章的交集，比较期间用\"法律上母公司为换取股权而发行的股数\"。\n- 与第13章（金融工具与保险合同）：或有对价（现金补偿）按金融工具准则后续计量，公允价值变动计入当期损益；以债权性金融资产作对价时原其他综合收益转入投资收益。\n",
    "27": "# 第二十七章 合并财务报表\n\n> 本题库考察频次：25 题 ｜ 优先级：A 类（高频核心章，全书考察频次最高之一） ｜ 建议投入：精读＋逐笔默写抵销分录（本章是综合题的主战场。请把\"合并范围→合并日/购买日调整→成本法转权益法→六类抵销分录→少数股东权益/损益→特殊交易\"当作一条流水线反复练到手熟，每一环都能单独出题）\n\n---\n\n## 一、合并范围的确定\n\n### 控制的定义与三要素\n- **优先级**：★★★\n- **内容**：合并财务报表的合并范围应当**以控制为基础**予以确定。控制是指投资方拥有对被投资方的**权力**，通过参与被投资方的**相关活动**而享有**可变回报**，并且有能力运用对被投资方的权力**影响其回报金额**。三个基本要素：\n  1. 投资方拥有对被投资方的**权力**；\n  2. 因参与被投资方的相关活动而享有**可变回报**；\n  3. 有能力运用对被投资方的权力**影响其回报金额**。\n  投资方只有**同时具备**三个要素时，才能控制被投资方。\n- **易错**：判断时要综合考虑被投资方的设立目的和设计、相关活动及其决策机制、投资方享有的权利、可变回报、与其他方的关系等；其中\"**设立目的和设计的分析贯穿于控制判断的始终**\"，是分析其他事实和情况的基础。\n- **考察**：`2022-11`\n\n### 相关活动的识别与决策机制\n- **优先级**：★★★\n- **内容**：相关活动是**对被投资方的回报产生重大影响**的活动，常见包括：商品或劳务的销售和购买；金融资产的管理；资产的购买和处置；研究与开发活动；确定资本结构和获取融资。判断相关活动时关注的是对回报有重大影响的活动，**不是**影响甚微的行政活动。\n- **内容（决策机制）**：就相关活动作出的决策包括但不限于：①对被投资方的经营、融资等活动作出决策，包括编制预算；②任命被投资方的关键管理人员或服务提供商并决定其报酬，以及终止其劳务关系或业务关系。\n- **易错**：同一企业在**不同环境和情况下**，相关活动可能不同（如金融资产组合在违约损失超过权益工具金额后，相关活动从\"管理投资组合\"转为\"管理违约资产及剩余金融资产\"）。\n- **考察**：`2022-11`\n\n### 两个或两个以上投资方分别主导不同相关活动时的权力判断\n- **优先级**：★★\n- **内容**：被投资方的相关活动通常有多个且可能不同时进行。当两个或两个以上投资方能够分别单方面主导不同相关活动时，**能够主导对被投资方回报产生最重大影响的活动的一方**拥有权力。需考虑：①被投资方的设立目的；②影响被投资方利润率、收入和企业价值的决定因素；③各投资方拥有的与上述决定因素相关的决策职权的范围及影响程度；④投资方承担可变回报风险的大小。\n- **考察**：—\n\n### 实质性权利与保护性权利\n- **优先级**：★★★\n- **内容**：判断投资方是否拥有权力时，应区分**实质性权利**与**保护性权利**，**仅实质性权利**才予以考虑。\n  | 类型 | 含义与例子 |\n  |---|---|\n  | **实质性权利** | 持有人在对相关活动进行决策时**有实际能力行使**的可执行权利。\"有实际能力行使\"意味着**即使未实际行使**也要考虑。通常应是当前可执行的权利，但某些情况下**目前不可行使的权利也可能是实质性权利**（如潜在表决权、25天后结算但决策日在30天后的远期股权购买合同） |\n  | **保护性权利** | 旨在保护持有人自身权益，**不赋予**其对这些权利所涉及主体的权力。例如：贷款方限制借款方从事会损害其利益的活动的权利；少数股东批准超过正常经营范围的资本性支出或发行权益工具、债务工具的权利；贷款方在违约时扣押资产的权利 |\n- **易错**：①判断实质性权利需综合考虑：行权是否存在**经济或其他方面的障碍**（财务处罚或奖励、行权价或转换价格造成财务障碍、合同条款限制、缺乏行使机制、无法获取必要信息、经营壁垒、法律法规限制）；当权利由多方持有或需多方同意时**是否存在实际可行的机制**使其能一致行使；**权利持有人能否从行使权利中获利**。②需要一致行使权利的投资方越多，权利是实质性权利的可能性越小；但**董事会**可以作为一个众多投资方一致行使权利的机制——独立的董事会持有的罢免权比众多投资方单独持有的同样罢免权**更可能是实质性权利**。③**仅持有保护性权利**的投资方不能实施控制，也不能阻止其他方实施控制。\n- **考察**：—\n\n### 表决权与半数以下表决权的权力判断\n- **优先级**：★★★\n- **内容**：\n  - **半数以上表决权**：被投资方相关活动由持有半数以上表决权的投资方表决决定，或其权力机构多数成员由持有半数以上表决权的投资方指派且决策由多数成员主导时，**拥有权力**。\n  - **表决权比例超过半数但章程要求更高比例**（如需出席会议投资方所持**2/3以上**表决权通过）的，该表决权本身**不足以**赋予权力，应结合其他因素进一步分析。\n  - **半数或半数以下表决权**（或虽超半数但不足主导）时，综合考虑：①投资方持有的表决权**相对其他投资方的大小**及其他投资方的**分散程度**；②潜在表决权；③其他合同安排产生的权利；④其他相关事实和情况。\n- **易错**：其他方拥有的实质性权利（**不一定是提议权**，也可能是批准或否定议案的权利）只要**不仅仅是保护性权利**，就可能使投资方不能控制被投资方。\n- **考察**：`2022-11`\n\n### 代理人 vs 主要责任人（决策者是否拥有权力）\n- **优先级**：★★★\n- **内容**：权力是能够\"**主导**\"被投资方相关活动的**现时能力**，是为**自己**行使权力（主要责任人），而不是代其他方行使（代理人）。代理人代表主要责任人行动并服务于其利益时，**代理人并不拥有控制**，其决策权应被视为由主要责任人直接持有。\n- **内容（四项因素）**：除某一方拥有**罢免该决策者的实质性权利且能够实现无理由罢免**（单凭这一点就足以表明决策者是代理人）外，应全面分析评价：\n  1. **决策者对被投资方的决策权范围**——主导相关活动的决策权范围越广，越能表明决策者拥有权力，但**并不意味着**其一定是主要责任人；\n  2. **其他方享有的实质性权利**——当存在**单独一方**拥有实质性罢免权并能**无理由**罢免决策者时，单凭这一点足以表明决策者是代理人；若多于一方拥有该权利（且无单独一方能不经其他方同意即罢免），则这些权利本身**不足以**得出结论；罢免需要联合一致行使的方越多、决策者其他经济利益的量级和可变动性越大，其他方权利在评价中的**权重越小**；\n  3. **决策者的薪酬水平**——相对于被投资方活动的预期回报，薪酬的量级和**可变动性越大**，决策者越可能是**主要责任人**；薪酬与其所提供服务**相称**则更可能是代理人；\n  4. **决策者因持有被投资方其他权益而承担的可变回报风险敞口**——风险敞口越大，越可能是主要责任人。\n- **易错**：**决策者不会仅仅因为其他方能从其决策中获益而成为代理人**。结构化主体（资管计划、信托、基金）是否纳入合并，本质就是做这套\"主要责任人 vs 代理人\"分析。\n- **考察**：—\n\n### 投资性主体\n- **优先级**：★★★\n- **内容**：母公司**同时满足**以下三个条件时属于**投资性主体**：\n  1. 该公司**以向投资方提供投资管理服务为目的**，从一个或多个投资者获取资金（这是与其他主体的显著区别）；\n  2. 该公司的**唯一经营目的**是通过**资本增值、投资收益或两者兼有**而让投资者获得回报；\n  3. 该公司按照**公允价值**对**几乎所有投资**的业绩进行计量和评价。\n- **内容（会计后果）**：\n  | 主体 | 处理 |\n  |---|---|\n  | **投资性主体**（本身是母公司） | 对**未为其投资活动提供相关服务**的子公司，按**公允价值计量且其变动计入当期损益**，**不纳入合并范围**；只对**为其投资活动提供相关服务**的子公司予以合并 |\n  | **投资性主体的母公司本身不是投资性主体** | 应当将其**控制的全部主体**（包括通过投资性主体控制的主体）纳入合并范围 |\n  | **投资性主体转变为非投资性主体** | 自转变日起对**所有**子公司予以合并，转变日前的子公司视同**购买**（按转变日公允价值作为对价），按**非同一控制下企业合并**处理 |\n  | **非投资性主体转变为投资性主体** | 自转变日起**不再合并**为其投资活动提供相关服务之外的所有子公司 |\n- **易错**：\"唯一经营目的\"的判断可通过募集说明书、公司章程或合伙协议、投资期限、投资退出战略等体现；如果基金的经营目的是**与被投资方合作开发、生产或销售某种产品**，则**不是**投资性主体。例外情形——**母公司是投资性主体，但其自身不是投资性主体的母公司**，仍要合并全部受控主体。\n- **考察**：`2021-7`\n\n### 控制的持续评估与合并范围变动的处理\n- **优先级**：★★\n- **内容**：控制的评估
