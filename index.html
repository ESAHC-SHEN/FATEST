    "7": "# 第七章 资产减值\n\n> 本题库考察频次：3 题 ｜ 优先级：C ｜ 建议投入：通读一遍，抓住商誉减值（含少数股东商誉）与可收回金额两条主线\n\n## 考点清单\n### 资产减值的适用范围与不适用资产\n- **优先级**：★★★\n- **内容**：本章规范的资产通常属于**非流动资产**，具体包括：①对**子公司、联营企业和合营企业**的长期股权投资；②采用**成本模式**进行后续计量的投资性房地产；③固定资产；④生产性生物资产；⑤无形资产（含开发过程中的无形资产）；⑥商誉；⑦使用权资产；⑧探明石油天然气矿区权益和井及相关设施等。\n- **不适用本章（不得按本章计提减值、按各自准则处理）**：\n\n| 资产 | 适用准则/处理 |\n|---|---|\n| 存货、消耗性生物资产 | 第 1 号存货、第 5 号生物资产（存货跌价准备可转回） |\n| 递延所得税资产、融资租赁中出租人未担保余值 | 第 18 号所得税、第 21 号租赁 |\n| 采用**公允价值模式**后续计量的投资性房地产 | 第 3 号投资性房地产（公允价值变动计入损益，不计提减值） |\n| 金融工具准则规范的金融资产 | 第 22 号金融工具确认和计量（预期信用损失） |\n| 划分为**持有待售**的非流动资产、处置组 | 第 42 号持有待售（按账面价值与公允价值减出售费用孰低） |\n\n- **易错**：①**投资性房地产要分模式**——成本模式提减值（本章），公允价值模式**不提减值**；②长期股权投资**减值一律用本章**，不区分成本法/权益法；③\"本章不涉及\"的资产并不是\"不计提减值\"，而是**适用其他准则**。\n\n### 可收回金额的确定：两者孰高\n- **优先级**：★★★\n- **内容**：**可收回金额**应当根据资产的**公允价值减去处置费用后的净额**与**资产预计未来现金流量的现值**两者之间**较高者**确定。资产的可收回金额低于其**账面价值**的，应当将账面价值减记至可收回金额，减记金额确认为**资产减值损失**，计入当期损益，同时计提相应的资产减值准备。\n- **计算/分录**：\n  ```\n  可收回金额 = max（公允价值 − 处置费用后的净额，预计未来现金流量现值）\n  减值损失   = 账面价值 − 可收回金额（仅当账面价值 > 可收回金额时）\n  借：资产减值损失——××资产减值损失\n      贷：固定资产减值准备 / 无形资产减值准备 / 商誉减值准备 /\n          长期股权投资减值准备 / 投资性房地产减值准备 / 使用权资产减值准备 等\n  ```\n- **易错**：①是**孰高**不是孰低（对比存货的可变现净值、持有待售资产的孰低口径）；②**只要有一项高于账面价值即不计提减值**，不必两项都计算；③公允价值减去处置费用后的净额与未来现金流量现值**只要有一项难以可靠估计**，就以另一项作为可收回金额。\n\n### 预计未来现金流量的预计（当前状况基础、税前折现率）\n- **优先级**：★★★\n- **内容**：①以资产的**当前状况**为基础，**不应当包括**与将来可能发生的、**尚未作出承诺**的重组事项或与**资产改良**有关的预计未来现金流量；企业**已经承诺重组**的，则应当反映重组所能节约的费用、重组带来的其他利益以及因重组导致的预计未来现金流出；②预计现金流量应当包括：资产持续使用过程中预计产生的**现金流入**、为实现该流入所必需的**预计现金流出**（含为使资产达到预定可使用状态所发生的现金流出）、以及资产使用寿命结束时处置资产所收到或支付的**净现金流量**；③建立在管理层批准的最近财务预算或预测数据之上，该预算或预测**最多涵盖 5 年**，能证明更长的期间合理方可延长，之后的增长率应以**稳定或递减**的增长率（能证明递增合理者除外）为基础，且不应超过产品、市场、行业或所在国家或地区的长期平均增长率。\n- **计算/分录**：\n  ```\n  传统法：以单一的未来每期最可能现金流量 + 单一折现率计算现值\n  期望现金流量法：每期现金流量期望值 = Σ（各种可能情况下的现金流量 × 发生概率）\n  现值 PV = Σ [第 t 年预计资产未来现金流量 NCFt ÷ (1 + 折现率)^t]\n  ```\n- **易错**：①**尚未作出承诺**的重组、**资产改良**（如更新发动机系统、提高营运绩效的资本性支出）的现金流量**必须剔除**；已确认预计负债的**已承诺重组**则要考虑；②预计现金流量对**资产特定风险已作调整**的，折现率不再重复考虑该风险；③现金流量的**发生时间不确定**时，应按每一种可能情况的**现值及其发生概率直接加权**计算现值。\n\n### 折现率的预计（税前利率）\n- **优先级**：★★\n- **内容**：计算资产未来现金流量现值所使用的折现率应当是反映**当前市场货币时间价值和资产特定风险的税前利率**，即企业在购置或投资资产时所要求的**必要报酬率**。折现率的基础若是税后的，应当调整为**税前**折现率，以与未来现金流量的估计基础一致。折现率首先以该资产的**市场利率**为依据；无法从市场获得时使用**替代利率**（可根据企业加权平均资金成本、增量借款利率或其他相关市场借款利率适当调整后确定）。\n- **易错**：①**税前 vs 税后必须统一**——\"用税后折现率折现税前现金流量\"是典型错误；②通常使用**单一折现率**，但若现值对未来不同期间的**风险差异或利率期间结构**反应敏感，应在未来不同期间采用**不同的折现率**；③替代利率估计时，若预计现金流量已对某些因素作过调整，应当**予以剔除**，避免重复计算。\n\n### 资产组的认定（独立现金流入、一贯性）\n- **优先级**：★★\n- **内容**：**资产组**是企业可以认定的**最小**资产组合，其产生的现金流入应当**基本上独立于**其他资产或者资产组产生的现金流入。认定时应以**该资产组能否独立产生现金流入**为主要依据，并考虑企业管理层对生产经营活动的**管理或者监控方式**（按生产线、业务种类还是按地区）以及对资产的**持续使用或者处置的决策方式**。资产组一经确定，**各个会计期间应当保持一致，不得随意变更**；因企业重组、变更资产用途等原因确需变更的，管理层应证明其合理性，并在**附注**中作相应说明。\n- **易错**：①以**内部转移价格**为基础预计现金流量的资产组，必须调整为**公平交易**前提下的价格最佳估计数；②同一资产组内的资产使用与处置是**一体化决策**的（如 A 车间生产部件、B 车间组装对外销售），应认定为一个资产组；③\"独立产生现金流入\"看的是**能否单独确定现金流**，不是法律主体或核算单位。\n\n### 资产组减值损失的分摊顺序与抵减下限\n- **优先级**：★★★\n- **内容**：资产组（含资产组组合）的可收回金额低于其账面价值的，应当确认减值损失并按以下顺序分摊：①**先抵减**分摊至资产组中**商誉**的账面价值；②再根据资产组中**除商誉之外**的其他各项资产的**账面价值所占比重**，按比例抵减其他各项资产的账面价值。抵减后的各资产的账面价值**不得低于以下三者之中的最高者**：该资产的**公允价值减去处置费用后的净额**（如可确定）、该资产**预计未来现金流量的现值**（如可确定）、**零**。因此而**未能分摊**的减值损失金额，应当按照相关资产组中**其他各项资产的账面价值所占比重继续分摊**（二次分摊）。\n- **计算/分录**：\n  ```\n  第一步：资产组账面价值 vs 可收回金额 → 减值损失总额\n  第二步：先冲减商誉，余额按其他资产账面价值比例分摊\n  第三步：对触及\"下限\"的单项资产，其未能分摊的损失在其余资产间按账面价值比例二次分摊\n  借：资产减值损失——××资产\n      贷：固定资产减值准备 / 无形资产减值准备 / 商誉减值准备 等\n  ```\n- **易错**：①**商誉永远排第一位**冲减，不能按比例与其他资产混在一起同比例抵减；②\"下限\"是**三者孰高**，不是账面价值或零；③触及下限后**剩余部分不能挂账**，必须**二次分摊**给其他资产；④资产组的账面价值与可收回金额**必须建立在一致的基础上**——如资产组已确认的**恢复原貌等预计负债**，确定账面价值和未来现金流量现值时都应当**扣除该负债全额**。\n\n### 总部资产的减值测试\n- **优先级**：★★\n- **内容**：**总部资产**（企业集团或其事业部的办公楼、电子数据处理设备、研发中心等）的显著特征是**难以脱离其他资产或者资产组产生独立的现金流入**，且其账面价值**难以完全归属于**某一资产组，因此通常难以单独进行减值测试，需要结合其他相关资产组或者资产组组合进行。处理分两种情形：①总部资产**能够按照合理和一致的基础分摊**至该资产组的，将该部分总部资产的账面价值**分摊至该资产组**，再比较资产组（含已分摊总部资产）的账面价值与可收回金额，按资产组减值的顺序和方法处理；②**难以按合理和一致的基础分摊**的，先**不考虑**该总部资产，估计和比较资产组的账面价值与可收回金额并处理；再认定由**若干个资产组组成的最小资产组组合**（包含所测试的资产组与可分摊该总部资产的部分），比较该资产组组合（含已分摊总部资产）的账面价值与可收回金额并处理。\n- **易错**：①分摊基数是**按使用寿命加权计算后的账面价值**，不是未加权账面价值；②分摊比例算完后要**分别按比例分摊总部资产**，再与**各资产组可收回金额**分别比较；③各资产组减值损失还要在**总部资产与资产组内资产**之间再按账面价值比例分摊。\n\n### 商誉减值测试与处理（含少数股东商誉）\n- **优先级**：★★★\n- **内容**：①企业合并所形成的商誉**至少应当在每年年度终了进行减值测试**（**无论是否存在减值迹象**）；商誉应当**自购买日起**分摊至相关的**资产组或者资产组组合**，相关资产组或资产组组合应当是能够从企业合并的**协同效应中受益**的，且**不应当大于**按第 35 号分部报告确定的**经营分部**；②测试顺序：**先对不包含商誉**的资产组测试并确认减值损失，**再对包含商誉**的资产组测试，可收回金额低于账面价值的差额**首先抵减商誉**的账面价值，再按其他各项资产账面价值比重按比例抵减；③**存在少数股东商誉**时：合并财务报表中只确认**归属于母公司**的商誉，为使减值测试建立在**一致的基础**上，应当把**归属于少数股东权益的商誉**（按同口径推算的**全部商誉 / 完全商誉**）加入资产组账面价值，再与可收回金额比较；计算出的减值损失中属于商誉的部分，要**在母公司股东与少数股东之间按比例分摊**，合并报表**只确认归属于母公司的商誉减值损失**。\n- **计算/分录**：\n  ```\n  完全商誉 = 合并报表确认的商誉 ÷ 母公司持股比例\n  调整后资产组账面价值 = 可辨认资产账面价值 + 完全商誉\n  减值损失 = 调整后账面价值 − 可收回金额\n  商誉减值损失（合并报表确认）= 商誉减值损失总额 × 母公司持股比例\n  借：资产减值损失\n      贷：商誉减值准备 / ××资产减值准备\n  ```\n- **易错**：①**不管有没有减值迹象，每年年度终了都要测**；②比较的账面价值必须**先加上少数股东商誉**，否则会低估减值；③合并报表确认的商誉减值损失只是**其中母公司份额**，不能把全额计入；④减值损失超过商誉账面价值的部分，**继续冲减其他可辨认资产**；⑤商誉一旦分摊到资产组，处置该资产组中一项经营时，相关商誉应**包括在该经营账面价值中**确定处置损益，或按处置经营与剩余部分价值的**比例**分摊。\n- **考察**：2018-12（主考点在本章）；2016-10、2021-10（商誉初始确认与减值测试的延伸，主考点为第二十六章 企业合并）\n\n### 资产减值损失不得转回；折旧摊销随之调整\n- **优先级**：★★★\n- **内容**：资产减值损失**一经确认，在以后会计期间不得转回**；以前期间计提的资产减值准备**需要等到资产处置时**才可转出。资产减值损失确认后，减值资产的**折旧或者摊销费用应当在未来期间作相应调整**，以使该资产在**剩余使用寿命内**，系统地分摊调整后的资产账面价值（扣除预计净残值）。\n- **易错**：①**不得转回**是本章的\"铁律\"（固定资产、无形资产、商誉等；准则理由是这类减值通常属于**永久性减值**，且为避免确认重估增值和操纵利润）；②**能转回**的只是适用其他准则的资产——存货跌价准备、金融资产（预期信用损失）、持有待售资产等，**不要张冠李戴**；③减值后应**以新的账面价值为基础重新计算未来每期折旧/摊销**，即使以后资产价值回升、现金流量增加，也**不必再计算可收回金额**。\n- **考察**：2018-12、2019-8\n\n## 本章易错陷阱汇总\n\n1. **投资性房地产分模式**：成本模式提减值（本章），公允价值模式**不计提减值**。\n2. **可收回金额取孰高**，而存货（可变现净值）、持有待售资产（公允价值减出售费用）是**孰低**口径。\n3. **尚未承诺的重组、资产改良的现金流量必须剔除**；**已承诺重组（已确认预计负债）**的现金流量必须考虑。\n4. 折现率必须是**税前**、反映当前市场货币时间价值和**资产特定风险**；现金流量已调整特定风险的，折现率**不再重复**考虑。\n5. 资产组减值分摊：**商誉先冲**，其他资产按账面价值比例；单项资产抵减后**不得低于\"公允减处置费用净额、未来现金流量现值、零\"三者孰高**，未分摊完的**二次分摊**。\n6. 资产组账面价值与可收回金额的确定基础**必须一致**（已确认的恢复费用等负债要**全额扣除**）。\n7. 分摊总部资产的基数是**按使用寿命加权后**的资产组账面价值。\n8. 商誉**每年年末必测**，与有无减值迹象无关；含少数股东时比较的账面价值要**加回少数股东商誉**，合并报表**只确认母公司份额**的商誉减值。\n9. 资产减值损失**不得转回**，且减值后要**重算折旧/摊销**。\n\n## 本章分录模板（如适用）\n\n```\n【计提资产减值】\n借：资产减值损失——固定资产减值损失 / 无形资产减值损失 / 长期股权投资减值损失等\n    贷：固定资产减值准备 / 无形资产减值准备 / 商誉减值准备 /\n        长期股权投资减值准备 / 投资性房地产减值准备 / 使用权资产减值准备 /\n        生产性生物资产减值准备 / 在建工程减值准备\n\n【期末结转】\n借：本年利润\n    贷：资产减值损失\n\n【关键规则】\n· 各资产减值准备科目累积每期计提的减值准备，直至相关资产被处置时才予以转出\n· 资产减值损失一经确认，以后会计期间不得转回\n· 计提减值后，未来期间折旧/摊销以调整后的账面价值（扣除预计净残值）为基础在剩余使用寿命内分摊\n```\n\n## 与其他章的联动\n\n- 与第二章、第三章、第四章（存货、固定资产、无形资产）：本章减值损失的计提前提是这些章节的基础计量；固定资产/无形资产减值后**重算折旧或摊销**、处置时减值准备随之转出。\n- 与第五章（投资性房地产）：成本模式后续计量的投资性房地产适用本章；公允价值模式不适用本章。\n- 与第六章（长期股权投资与合营安排）：对子公司、联营企业、合营企业的长期股权投资减值适用本章；权益法核算中确认投资损益后仍需考虑减值。\n- 与第十三章（金融工具）：金融资产减值按第 22 号准则的**预期信用损失**处理，**不适用**本章。\n- 与第二十六章（企业合并）：合并形成的**商誉**是本章减值测试的核心对象，商誉的**初始确认**金额由合并成本与可辨认净资产公允价值的差额决定；2016-10、2021-10 均以此为主线（主考点在企业合并，商誉减值测试为延伸）。\n",
    "8": "# 第八章 负债\n\n> 本题库考察频次：6 题 ｜ 优先级：B 类（常考章，5–13 题） ｜ 建议投入：重点掌握可转债分拆与增值税账务\n\n> ⚠️ **教材文本 OCR 说明**：本章 OCR 可辨认区间为「二、应付票据」至「四、地方政府专项债券」；**「短期借款」「应付账款/预收款项」等前置内容与「应付债券」小节标题在 OCR 中缺失**，相关条目已在正文注明「教材文本 OCR 损坏，条目标注不含教材定位」。可确认的节标题：**第一节 流动负债**、**第二节 非流动负债**。可转换公司债券的完整准则处理，教材安排在**第十三章「复合金融工具」（例 13-21）**，第八章只涉及「应付债券」科目设置；本章第 5、6 个考点按两章联合备考编写。\n\n## 考点清单\n\n### 负债的定义与确认条件\n- **优先级**：★\n- **内容**：负债是**过去交易或者事项形成的、预期会导致经济利益流出企业的现时义务**。现时义务可以是**法定义务**（合同、法规、司法解释产生），也可以是**推定义务**（企业的公开承诺、以往习惯做法使对方形成有效预期）。确认须同时满足：①与该义务有关的经济利益**很可能**流出企业；②未来流出经济利益的金额**能够可靠计量**。\n- **易错**：①\"很可能\"是负债确认的门槛，是**概率判断**而非\"基本确定\"；②不以**已发生的现时义务**为基础的\"预提\"不能确认负债——按工资总额一定比例预提员工持股计划资金，不构成负债（本题库 2018-18 考此判断，其教材定位在第九、十章）。\n- **考察**：—（本题库 2018-18 从\"是否存在现时义务\"角度考查负债确认条件，教材定位为第九、十章）\n\n### 应付票据、应付账款与预收款项/合同负债\n- **优先级**：★★\n- **内容**：**应付票据**（本节 OCR 可确认）按是否带息分为带息与不带息两种：我国商业汇票期限较短，**期末通常对尚未支付的应付票据计提利息，计入当期财务费用**；票据到期支付票款时，尚未计提的利息部分直接计入当期财务费用。不带息应付票据的账面价值就是票据到期时的应付金额。\n- **计算/分录**：\n  | 情形 | 分录 |\n  |---|---|\n  | 期末计提带息票据利息 | 借：财务费用　贷：应付票据 |\n  | 商业承兑汇票到期无力支付 | 借：应付票据　贷：**应付账款** |\n  | 银行承兑汇票到期无力支付（转逾期贷款） | 借：应付票据　贷：**短期借款** |\n- **易错**：①**商业承兑汇票**到期无力支付转\"应付账款\"（重新签发新票据清偿时再转回\"应付票据\"）；**银行承兑汇票**到期无力支付转\"短期借款\"（银行已代付，转为逾期贷款）——两个去向相反，高频送分点；②预收客户对价中尚未履行转让商品义务的部分，应确认为**合同负债**（该处理的教材主叙在第十七章），列报时\"合同负债\"单独列示。\n- **考察**：—\n\n### 长期借款、长期应付款与售后回购形成的其他应付款\n- **优先级**：★\n- **内容**：（本考点分录可在 OCR 中确认）**长期借款**是企业向银行或其他金融机构借入期限**在一年以上（不含一年）**的借款，按**摊余成本和实际利率**计算确定利息费用；设\"长期借款——本金\"\"长期借款——利息调整\"\"长期借款——应计利息\"明细科目。**长期应付款**核算除长期借款和应付债券以外的其他长期应付款项，典型是**具有融资性质的延期付款购买资产**。售后回购融入资金的，按实际收到金额贷记\"其他应付款\"，回购价与原售价的差额在回购期间按期计提利息费用。\n- **计算/分录**：\n  ```\n  长期借款：借：银行存款（实际收到）　贷：长期借款——本金\n            差额借记\"长期借款——利息调整\"；资产负债表日按摊余成本×实际利率确认利息费用\n  延期付款购入资产：借：固定资产/在建工程（购买价款现值）　未确认融资费用（差额）\n                    贷：长期应付款（应付价款总额）\n  售后回购：借：银行存款　贷：其他应付款等；按期：借：财务费用　贷：其他应付款\n  ```\n- **易错**：①\"一年以上\"**不含一年**；②延期付款具有融资性质时，资产按**现值**入账，差额先记\"未确认融资费用\"，在信用期间内按**实际利率法**摊销，不得一次性计入损益或资产成本；③专项债券按是否由本单位承担本息偿还义务区分：承担的通过\"长期应付款——专项债券（本金/应计利息）\"核算。\n- **考察**：—\n\n### 应付债券：发行、实际利率法溢折价摊销与偿还\n- **优先级**：★★★\n- **内容**：应付债券按**面值**\"应付债券——面值\"、**溢折价**\"应付债券——利息调整\"、**应计利息**\"应付债券——应计利息（或应付利息）\"明细核算。发行价格＝未来本金与票面利息按**发行时市场利率**折现的现值；后续按**实际利率法**以摊余成本确认利息费用，摊销溢折价。教材例题（例 8-1）数据：面值 10 000 000 元、票面利率 6%、发行时市场利率 5%、5 年期、每年 12 月 31 日付息，发行价格 = 10 000 000×(P/F,5%,5) + 10 000 000×6%×(P/A,5%,5) = 10 432 700 元；第 2×22 年利息费用 521 635 元，利息调整摊销 78 365 元，期末摊余成本 10 354 335 元。\n- **计算/分录**：\n  ```\n  发行：借：银行存款 10 432 700　贷：应付债券——面值 10 000 000、——利息调整 432 700\n  计息：借：财务费用等（摊余成本×实际利率）　应付债券——利息调整（溢价摊销额）\n        贷：应付债券——应计利息（票面利息 600 000）\n  到期：借：应付债券——面值、——应计利息（或应付利息）　贷：银行存款\n        （利息调整余额一并转出，计入在建工程/制造费用/财务费用等）\n  ```\n- **易错**：①**折价摊销增加利息费用、溢价摊销减少利息费用**，方向不能反；②实际利率是**发行时的市场利率**（题目通常直接给出\"不附转换权时类似债券的市场利率\"）；③最后一期利息费用用**倒挤（尾数调整）**，把摊余成本恰好调至面值；④计提利息与支付利息是两个环节（分期付息时为\"应付利息\"，到期一次还本付息为\"应付债券——应计利息\"），别把\"应计利息\"科目与\"应付利息\"科目混用。\n- **考察**：2016-6、2016-7、2016-9、2021-1\n\n### 可转换公司债券（复合金融工具）的分拆与交易费用分摊\n- **优先级**：★★★\n- **内容**：企业发行的非衍生工具**同时包含金融负债成分和权益工具成分**的，应于**初始确认时**先确定**负债成分的公允价值**（按**不附转换权时类似债券的市场利率**对未来现金流量折现），再从复合金融工具的整体公允价值（发行价格）中扣除负债成分公允价值，**余额作为权益工具成分（\"其他权益工具\"）**；转换权为\"固定金额换固定数量普通股\"（固定换固定）的，分类为**权益工具**。发行复合金融工具发生的手续费、佣金等**交易费用，应当在负债成分和权益成分之间按照各自占总发行价款的比例进行分摊**：分摊至负债成分的，计入**负债的初始计量金额**（冲减应付债券初始账面价值、推高实际利率）；分摊至权益成分的，**从权益（资本公积）中扣减**，资本公积不够冲减的依次冲减盈余公积和未分配利润。\n- **计算/分录**（本题库 2021-1：面值 20000 万元、发行价 110 元/份共 22000 万元、票面 2%、5 年期、不附转换权的市场利率 8%、手续费 197.5 万元）：\n  ```\n  负债成分 ＝ 20000×(P/F,8%,5) + 20000×2%×(P/A,8%,5) ＝ 15209.08（万元）\n  权益成分 ＝ 22000 − 15209.08 ＝ 6790.92（万元）\n  交易费用分摊：负债成分 ＝ 197.5×15209.08/22000 ＝ 136.54（万元）\n                权益成分 ＝ 197.5 − 136.54 ＝ 60.96（万元）；实际利率重算为 8.21%\n  借：银行存款 21802.50\n      应付债券——利息调整 4927.46（20000 − 15209.08 + 136.54）\n    贷：应付债券——面值 20000.00\n        其他权益工具 6729.96（6790.92 − 60.96）\n  ```\n- **易错**：①**先算负债成分，权益成分是倒挤的余额**，不能先算权益成分；②折现率必须用\"**不附转换权的类似债券市场利率**\"，不能用票面利率；③转股权**不是衍生工具**（固定换固定），计入\"其他权益工具\"而不是\"衍生工具\"；④分摊比例是\"**各自占总发行价款的比例**\"，不是简单平均、也不是按面值比例；⑤分摊到负债成分的费用**只增加利息调整**，不直接计入财务费用；分摊到权益成分的费用**冲减权益**，不进损益。\n- **考察**：2021-1\n\n### 可转换公司债券转股：不确认损益，差额计入「资本公积——股本溢价」\n- **优先级**：★★★\n- **内容**：可转换工具**转换时终止确认负债成分，并将其确认为权益**：按转换日应付债券的**账面价值**（面值±利息调整余额）与\"其他权益工具\"的账面价值之和，扣除**股本**（转股股数×每股面值）后的差额，**全部计入\"资本公积——股本溢价\"**。原权益成分从\"其他权益工具\"**结转到\"资本公积——股本溢价\"**（权益内部结转）。\n- **计算/分录**（2021-1，2020 年 6 月 1 日全部转股，200 万份×5 股＝1000 万股）：\n  ```\n  转股日应付债券账面价值 ＝ 20000 − 3183.80 ＝ 16816.20（万元）\n  借：应付债券——面值 20000.00\n      其他权益工具 6729.96\n    贷：应付债券——利息调整 3183.80\n        股本 1000.00\n        资本公积——股本溢价 22546.16（16816.20 + 6729.96 − 1000）\n  ```\n- **易错**：①**转股时不产生损益**——不得确认转股收益或损失，也不通过\"投资收益\"\"公允价值变动损益\"过渡；②\"其他权益工具\"要**全额结转**出去，不能有余额；③利息调整余额的方向（借方/贷方）决定它在分录的哪一方，算错方向会连带股本溢价算错。\n- **考察**：2021-1\n\n### 外币专门借款（以外币债券方式）的资本化利息与汇兑差额资本化\n- **优先级**：★★\n- **内容**：本章与第十一章（借款费用）、第二十二章（外币折算）联合出题。**专门借款**（为购建符合资本化条件的资产而专门借入、有明确用途）在**资本化期间**内：①当期实际发生的利息费用**扣除闲置借款资金的利息收入/投资收益**后资本化；②**因外币借款产生的汇兑差额**，在资本化期间内也**予以资本化**（计入在建工程），资本化暂停/停止期间的汇兑差额计入财务费用。本题库 2016-6、2016-7、2016-9 给出发行美元债券建造环保工程的情形。\n- **计算/分录**（2016-6、2016-7，单位：万元；面值 100 万美元、发行价 102.7 万美元、发行费用 0.3 万美元、票面 6%、市场利率 5%）：\n  ```\n  发行：借：银行存款——美元户 684.032（102.4 万美元×6.68）\n        贷：应付债券——面值 668（100 万美元×6.68）、应付债券——利息调整 16.032\n  资本化利息（2015 年）＝ 684.032×5% − 2.16×6.66 ＝ 19.816\n  汇兑差额资本化（2015 年）＝ 100×(6.66 − 6.68) ＝ −2（汇兑收益，冲减在建工程）\n  2015 年末应付债券摊余成本 ＝ 676.2736\n  ```\n- **易错**：①闲置资金利息收入/投资收益**必须从资本化利息中扣除**，且只扣资本化期间的部分；②汇兑差额**资本化期间全额资本化**（本例 −2 万元是**汇兑收益**，借记\"应付债券\"、贷记\"在建工程\"，方向极易写反）；③发生**非正常中断连续超过 3 个月**时暂停资本化，停工期按 8:4 之类比例拆分资本化与费用化金额（2016-9 的停工 4 个月即考此点）；④发行费用直接从发行收入中扣除时，**先算实际收到的净额（102.4 万美元）再折算**。\n- **考察**：2016-6、2016-7、2016-9\n\n### 增值税（一般计税）：科目设置、购销业务与视同应税交易\n- **优先级**：★★★\n- **内容**：一般纳税人应在\"应交税费\"下设置\"**应交增值税**\"\"**未交增值税**\"\"**预交增值税**\"\"**待抵扣进项税额**\"等明细科目；其中\"应交税费——应交增值税\"下设置\"**进项税额**\"\"**销项税额抵减**\"\"**已交税金**\"\"**转出未交增值税**\"\"**减免税款**\"\"**销项税额**\"\"**出口退税**\"\"**进项税额转出**\"\"**转出多交增值税**\"等专栏。购进阶段**价税分离**：属于价款部分计入购入商品成本，属于增值税税额部分计入进项税额；销售阶段**不含税价确认为收入**，向购买方收取的增值税作为销项税额。\n- **计算/分录**：\n  ```\n  购进：借：固定资产 80 000 000、应交税费——应交增值税（进项税额）7 200 000\n        贷：银行存款 87 200 000\n  视同应税交易（自产/委托加工货物用于集体福利或个人消费、无偿转让货物/无形资产/\n  不动产/金融商品）：借：应付职工薪酬等　贷：应交税费——应交增值税（销项税额）\n  已抵扣进项税额的货物用于集体福利：借：应付职工薪酬\n        贷：应交税费——应交增值税（进项税额转出）、原材料\n  ```\n- **易错**：①**视同应税交易只是税法概念**——会计上仍按业务实质处理（如以自产产品对外投资按非货币性资产交换准则），但**只要税法要求缴纳增值税，就必须计算销项税额**；②用于集体福利的**自产货物**按**视同销售计销项税额**，而**外购货物**用于集体福利是**进项税额转出**，两者处理方向不同；③\"销项税额抵减\"专栏（借方）用于**差额征税**扣减销售额对应的销项税额，不要与\"进项税额转出\"混用。\n- **考察**：—\n\n### 增值税的其他要点：减免与即征即退、小规模纳税人、差额征税、月末转出\n- **优先级**：★★\n- **内容**：①**减免**：当期**直接减免**的增值税，借记\"应交税费——应交增值税（**减免税款**）\"，贷记\"**其他收益**\"；当期按规定**即征即退**的增值税，也计入\"**其他收益**\"。②**小规模纳税人**适用简易计税：购进时支付的增值税**不得抵扣进项税额**，计入相关成本费用；销售时按\"销售额＝含税销售额÷(1＋征收率)\"还原为不含税销售额计税，采用三栏式账户。③**差额征税**（如旅游服务、客运场站服务）通过\"应交税费——应交增值税（**销项税额抵减**）\"专栏核算允许扣减销售额而减少的销项税额。④**月末转出**：计算出当月应交未交的增值税，借记\"应交税费——应交增值税（**转出未交增值税**）\"，贷记\"应交税费——**未交增值税**\"；当月**多交**的增值税作相反分录。\n- **计算/分录**（教材例 8-2，小规模纳税人，征收率 3%）：\n  ```\n  购进：借：原材料 1 130 000　贷：应付票据 1 130 000\n  销售含税 900 000：不含税 ＝ 900 000÷(1+3%) ＝ 873 786；应交增值税 ＝ 873 786×3% ＝ 26 214\n        借：应收账款 900 000　贷：主营业务收入 873 786、应交税费——应交增值税 26 214\n  差额征税（例 8-5 旅游企业）：借：银行存款 530 000　贷：主营业务收入 500 000、\n        应交税费——应交增值税（销项税额）30 000；借：主营业务成本 400 000、\n        应交税费——应交增值税（销项税额抵减）24 000　贷：应付账款 424 000\n  预缴（例 8-6 房地产预售）：借：应交税费——预交增值税　贷：银行存款；\n        月末：借：应交税费——未交增值税　贷：应交税费——预交增值税\n  ```\n- **易错**：①直接减免/即征即退的增值税计入\"**其他收益**\"（利润表单独项目），**不冲减\"税金及附加\"**；②小规模纳税人的进项税额**一律不得抵扣**、计入成本；③预缴增值税通过\"**预交增值税**\"明细，月末再转入\"未交增值税\"，**不直接走\"已交税金\"**；④当月交纳**当月**增值税走\"应交增值税（已交税金）\"，交纳**以前各期**未交增值税走\"未交增值税\"。\n- **考察**：—\n\n### 消费税与其他应交税费要点\n- **优先级**：★\n- **内容**：**消费税**采取**从价定率**和**从量定额**两种征收方法；销售额含增值税的，按\"含增值税的销售额÷(1＋增值税税率或征收率)\"换算。应纳消费税的委托加工应税消费品，由受托方在交货时代收代缴；**委托方收回后直接出售的，代收代缴的消费税计入委托加工物资成本**；**收回后用于连续生产应税消费品的，计入\"应交税费——应交消费税\"借方（准予抵扣）**。**进口**应税消费品交纳的消费税计入该进口消费品成本。**资源税**、**房产税**、**城镇土地使用税**、**车船税**、**印花税**、**城市维护建设税**等一般借记\"税金及附加\"；**土地增值税**中，销售存货/投资性房地产的借记\"税金及附加\"，转让自用房地产（固定资产/无形资产）的借记\"**资产处置损益**\"。\n- **易错**：①委托加工应税消费品\"直接出售\"与\"连续生产\"的消费税处理相反（计入成本 vs 准予抵扣）；②**增值税一般不影响损益（价外税）**，而**消费税、城建税、房产税等计入\"税金及附加\"**，影响营业利润；③转让自用房地产的土地增值税计入\"资产处置损益\"，不是\"税金及附加\"。\n- **考察**：—\n\n## 本章易错陷阱汇总\n1. **商业承兑汇票 vs 银行承兑汇票到期无力支付**：前者转\"应付账款\"，后者转\"短期借款\"，方向相反。\n2. **带息票据期末必须计提利息**，计入当期财务费用；不带息票据账面价值即到期应付金额。\n3. **应付债券的折价摊销增加利息费用、溢价摊销减少利息费用**，最后一期用尾数调整把摊余成本调至面值。\n4. **可转债分拆必须先算负债成分（按不附转换权的类似债券市场利率折现），权益成分倒挤**；把权益成分算在前面的必错。\n5. **交易费用按各自占总发行价款的比例分摊**：负债成分部分计入负债初始计量金额（并推高实际利率），权益成分部分冲减权益。\n6. **转股时不确认损益**，差额计入\"资本公积——股本溢价\"，原\"其他权益工具\"全额结转。\n7. **直接减免/即征即退增值税计入\"其他收益\"**，不是冲减税金及附加；视同应税交易与进项税额转出要分清。\n8. **外币专门借款**：闲置资金利息收入要从资本化利息中扣除；汇兑收益冲减在建工程（借记应付债券、贷记在建工程）。\n9. **一年以上（不含一年）**才是长期借款；延期付款购入资产的差额先记\"未确认融资费用\"，按实际利率法摊销。\n\n## 本章分录模板（如适用）\n| 业务 | 分录 |\n|---|---|\n| 期末计提带息应付票据利息 | 借：财务费用　贷：应付票据 |\n| 商业承兑汇票到期无力支付 | 借：应付票据　贷：应付账款 |\n| 银行承兑汇票到期无力支付 | 借：应付票据　贷：短期借款 |\n| 发行债券（溢价） | 借：银行存款　贷：应付债券——面值、——利息调整 |\n| 资产负债表日计息 | 借：财务费用等（摊余成本×实际利率）　应付债券——利息调整　贷：应付债券——应计利息 |\n| 可转债发行 | 借：银行存款（净额）　应付债券——利息调整　贷：应付债券——面值、其他权益工具 |\n| 可转债转股 | 借：应付债券——面值、其他权益工具　贷：应付债券——利息调整、股本、资本公积——股本溢价 |\n| 外币专门借款资本化 | 借：在建工程　贷：银行存款（利息）；借：银行存款（闲置资金收益）　贷：在建工程 |\n| 外币债券汇兑差额（收益） | 借：应付债券——面值（美元户）　贷：在建工程 |\n| 直接减免/即征即退增值税 | 借：应交税费——应交增值税（减免税款）　贷：其他收益 |\n| 月末转出未交增值税 | 借：应交税费——应交增值税（转出未交增值税）　贷：应交税费——未交增值税 |\n| 视同应税交易（自产货物用于福利） | 借：应付职工薪酬　贷：应交税费——应交增值税（销项税额）等 |\n\n## 与其他章的联动\n- 与第十一章（借款费用）：专门借款/一般借款利息资本化、暂停资本化的\"连续超过 3 个月\"判断，是本题库 2016-6、2016-7、2016-9 的得分主干。\n- 与第十二章（或有事项）：应付票据到期、诉讼形成的现时义务与预计负债的确认边界。\n- 与第十三章（金融工具与保险合同）：**\"复合金融工具\"一节**是可转换公司债券分拆、交易费用分摊、转股不确认损益的准则原文出处（例 13-21），与本考点完全重叠，务必两章对读。\n- 与第十四章（租赁）：租赁负债与长期应付款、长期借款的列报口径对比；售后回购与租赁中的融资安排易混。\n- 与第二十二章（外币折算）：外币专门借款的期末汇兑差额计算、外币货币性项目的折算规则。\n- 与第二十三章（财务报告）：流动负债与非流动负债的划分标准、\"一年内到期的非流动负债\"项目的填列，直接决定应付债券/长期借款的报表分类。\n- 与第十六章（所有者权益）：可转债的权益成分计入\"其他权益工具\"，转股后转入\"资本公积——股本溢价\"，与所有者权益章形成闭环。\n",
    "9": "# 第九章 职工薪酬\n\n> 本题库考察频次：7 题 ｜ 优先级：B ｜ 建议投入：重点掌握（本章在题库中必与第十二章或有事项、第十章股份支付联考，设定受益计划与辞退福利是两条必背主线）\n\n## 核心考点清单\n\n### \"职工\"的范围（含劳务派遣用工）\n- **优先级**：★★\n- **内容**：\"职工\"是指与企业订立劳动合同的**所有人员**，含**全职、兼职和临时职工**，也包括**虽未与企业订立劳动合同但由企业正式任命**的人员。具体包括：①与企业订立劳动合同的所有人员（固定期限、无固定期限、以完成一定工作为期限）；②未订立劳动合同但由企业正式任命的人员（如按规定聘请的**独立董事、外部监事**等）；③在企业的**计划和控制**下，虽未订立劳动合同或未由其正式任命，但**所提供服务与职工所提供服务类似**的人员，如通过企业与劳务中介公司签订用工合同而向企业提供服务的人员。\n- **易错**：判断劳务用工人员是否属于\"职工\"，关键是看**企业如果不使用这些劳务用工人员，也需要雇佣职工订立劳动合同提供类似服务**——即看服务的**实质**而非合同形式。\n- **考察**：—\n\n### 职工薪酬的概念与四大分类\n- **优先级**：★★★\n- **内容**：**职工薪酬**是指企业为获得职工提供的服务或**终止劳动合同关系**而给予的各种形式的报酬或补偿；**企业提供给职工配偶、子女、受赡养人、已故员工遗属及其他受益人的福利，也属于职工薪酬**。四大分类：①**短期薪酬**——企业在职工提供相关服务的**年度报告期间结束后 12 个月内需要全部予以支付**的职工薪酬；②**离职后福利**——企业为获得职工提供的服务而在职工退休或与企业解除劳动关系后提供的各种形式的报酬和福利；③**辞退福利**——企业在职工**劳动合同到期之前**解除与职工的劳动合同关系，或为**鼓励职工自愿接受裁减**而给予职工的补偿；④**其他长期职工福利**——除短期薪酬、离职后福利、辞退福利之外的**所有**职工薪酬，包括长期带薪缺勤、长期残疾福利、长期利润分享计划等。\n- **易错**：①**\"12 个月内需要全部支付\"**是短期薪酬的判断标准，超过 12 个月支付的即归入离职后福利或其他长期职工福利；②**辞退福利的关键词是\"劳动合同到期之前\"**——正常退休养老金属离职后福利，不属于辞退福利；③向**职工家属**支付的福利也计入职工薪酬。\n- **考察**：2017-11、2018-18\n\n### 短期薪酬确认与计量的一般原则\n- **优先级**：★★★\n- **内容**：企业应当在**职工为其提供服务的会计期间**，将**实际发生**的短期薪酬确认为**负债**，并计入**当期损益**，**其他会计准则要求或允许计入资产成本的除外**（即按**受益对象**处理）。\n- **分录**：\n  ```\n  计提：借：生产成本 / 制造费用 / 管理费用 / 销售费用 / 在建工程 / 研发支出等\n            贷：应付职工薪酬——工资 / 医疗保险费 / 住房公积金 / 工会经费 / 职工教育经费等\n  发放：借：应付职工薪酬      贷：银行存款\n  ```\n- **易错**：**职工福利费应当在\"实际发生时\"根据实际发生额计入当期损益或相关资产成本**——不预提。命题人常以\"按计划预提职工福利费/持股计划资金\"设错（2018-18 中预提 5 000 万元管理费用和应付职工薪酬被判定为不正确）。\n- **考察**：2018-18\n\n### 货币性短期薪酬（含社会保险费、住房公积金、工会经费、职工教育经费）\n- **优先级**：★★★\n- **内容**：工资、奖金、津贴和补贴，大部分的职工福利费、医疗保险费、工伤保险费和生育保险费等社会保险费，住房公积金、工会经费和职工教育经费一般属于货币性短期薪酬。企业为职工缴纳的社会保险费、住房公积金以及按规定提取的工会经费和职工教育经费，应当在**职工为其提供服务的会计期间**，根据**规定的计提基础和计提比例**计算确定相应的职工薪酬金额，确认相关负债，并按**受益对象**计入当期损益或相关资产成本。\n- **分录（教材例 9-1 数据）**：应发工资 1 560 万元（生产部门直接生产人员 1 000、生产部门管理人员 200、管理人员 360）；医疗保险费 10%、住房公积金 8%、工会经费 2%、职工教育经费 1.5%，合计 21.5%。\n  ```\n  生产成本 = 1 000 × (1 + 10% + 8% + 2% + 1.5%) = 1 215（万元）\n  制造费用 = 200 × 1.215 = 243（万元）\n  管理费用 = 360 × 1.215 = 437.4（万元）\n  借：生产成本 12 150 000\n      制造费用  2 430 000\n      管理费用  4 374 000\n      贷：应付职工薪酬——工资 15 600 000\n          ——医疗保险费 1 560 000\n          ——住房公积金 1 248 000\n          ——工会经费 312 000\n          ——职工教育经费 234 000\n  ```\n- **易错**：计提基数可以用**工资总额**（本例各项均按工资总额比例计提），答题时务必先算**合计数**再按受益对象拆分，不要漏掉\"计提比例部分\"。\n- **考察**：2018-18\n\n### 累积带薪缺勤\n- **优先级**：★★★\n- **内容**：**累积带薪缺勤**是**带薪权利可以结转下期**的带薪缺勤，本期尚未用完的权利可在未来期间使用。企业应当在**职工提供了服务从而增加了其未来享有的带薪缺勤权利时**，确认与累积带薪缺勤相关的职工薪酬，并以**累积未行使权利而增加的预期支付金额**计量；对于未行使的累积带薪缺勤权利，**职工离开企业时能够获得现金支付**的，企业应当确认必须支付的、**职工全部累积未使用权利**的金额；企业应当根据资产负债表日因累积未使用权利而导致的**预期支付的追加金额**进行预计。\n- **分录（教材例 9-2 数据：1 000 名职工、每人每年 5 天、2×22 年末平均未使用 2 天、预计 2×23 年 50 名经理每人平均享受 6.5 天、日工资 300 元；后进先出法）**：\n  ```\n  追加支付 = 50 名 × (6.5 − 5) 天 × 300 元 = 22 500（元）\n  2×22.12.31：借：管理费用 22 500   贷：应付职工薪酬——累积带薪缺勤 22 500\n  2×23 年若均未享受：借：应付职工薪酬——累积带薪缺勤 22 500   贷：管理费用 22 500（冲回）\n  2×23 年若均享受：2×23 年确认的工资费用应扣除上年度已确认的累积带薪费用\n  ```\n- **易错**：①**只有\"预期会动用\"的超额部分才需计提**——本例 950 人不会超过 5 天，故只对超额使用的 50 人计提；②休假采用**后进先出**基础（先扣当年权利、再扣上年结转）；③**职工离开时不能获得现金支付的**累积带薪缺勤，**不计提**离开时的支付义务；④下一年实际未使用时要**冲回**，不是继续挂账。\n- **考察**：—\n\n### 非累积带薪缺勤\n- **优先级**：★★\n- **内容**：**非累积带薪缺勤**是带薪权利**不能结转下期**的带薪缺勤，本期未用完的权利予以**取消**，且职工离开企业时**无权获得现金支付**。我国企业职工休**婚假、产假、丧假、探亲假、病假**期间的工资通常属于非累积带薪缺勤。由于职工提供服务本身**不能增加**其能够享受的福利金额，**企业在职工未缺勤时不应当计提相关费用和负债**；企业应当在职工**实际发生缺勤**的会计期间确认与非累积带薪缺勤相关的职工薪酬，即**视同职工出勤**确认相关资产成本或当期费用。\n- **易错**：①**非累积带薪缺勤不预提**——\"未缺勤时就计提\"是典型错误；②通常情况下与非累积带薪缺勤相关的职工薪酬**已经包含在企业每期向职工发放的工资等薪酬中，不必作额外的账务处理**。\n- **考察**：—\n\n### 短期利润分享计划\n- **优先级**：★★★\n- **内容**：企业制订并实施利润分享计划，职工完成特定业绩指标或工作到特定期末时其提供服务就会增加企业应付职工薪酬金额，或企业虽无法定义务但有支付惯例、或除支付外没有其他现实选择的，应当及时进行会计处理。**同时满足**下列两个条件的，应当确认相关的应付职工薪酬并计入当期损益或相关资产成本：①企业因**过去事项**导致现在具有支付职工薪酬的**法定义务或推定义务**；②因利润分享计划所产生的应付职工薪酬义务**能够可靠估计**。属下列情形之一的视为**能够可靠估计**：**a. 在财务报告批准报出之前企业已确定应支付的薪酬金额；b. 该利润分享计划的正式条款中包括确定薪酬金额的方式；c. 过去的惯例为企业确定推定义务金额提供了明显证据。** 职工只有在企业工作一段特定期间才能分享利润的，计量时应反映职工**因离职而没有得到支付的可能性**。\n- **分录（教材例 9-3 数据：税前利润 1 000 万元、估计支付比例为 2.5%，其中生产职工 1%、总部管理人员 1.5%；业绩基于 2×22 年 7 月 1 日至 2×23 年 6 月 30 日期间提供的服务，故 2×22 年只确认 50%）**：\n  ```\n  2×22.12.31 应确认 = 10 000 000 × 50% × 2.5% = 125 000（元）\n  借：生产成本 50 000（10 000 000 × 50% × 1%）\n      管理费用 75 000（10 000 000 × 50% × 1.5%）\n      贷：应付职工薪酬——利润分享计划 125 000\n  2×23.6.30 实际支付比例为 2.8%（生产 1.1%、管理 1.7%）\n  余下金额及差额调整合计 = 10 000 000 × 2.8% − 125 000 = 155 000（元）\n  借：生产成本 60 000（10 000 000 × 1.1% − 50 000）\n      管理费用 95 000（10 000 000 × 1.7% − 75 000）\n      贷：应付职工薪酬——利润分享计划 155 000\n  ```\n- **易错**：①**\"业绩期间\"与\"会计期间\"不一致时要按业绩期间分摊**——本例 2×22 年只确认 50%，这是本题最易失分处；②**估计数与实际支付数的差额在支付期调整**，不追溯；③支付义务发生在**年度报告期间结束后 12 个月内**的按短期薪酬处理，**超过 12 个月**的按其他长期职工福利处理。\n- **考察**：—\n\n### 非货币性福利（一）：以自产产品或外购商品发放\n- **优先级**：★★★\n- **内容**：企业向职工提供非货币性福利的，应当**按照公允价值计量**；**公允价值不能可靠取得的，可以采用成本计量**。以**自产产品**发放给职工的，应按该产品的**公允价值**确认职工薪酬，同时**视同销售**确认主营业务收入并结转主营业务成本，并按规定**视同销售计算增值税销项税额**。以**外购商品**发放给职工的，应当将**支付的价款和增值税进项税额**一并计入成本费用（进项税额**不得抵扣**，计入成本费用）。\n- **分录（教材例 9-4 数据：200 名职工、笔记本电脑成本 10 000 元/台、售价 14 000 元/台、手机不含税价 1 000 元/部，增值税率 13%；170 名生产人员、30 名管理人员）**：\n  ```\n  ①自产笔记本电脑（售价总额 2 800 000，销项税额 364 000）\n  决定发放：借：生产成本 2 689 400\n                  管理费用   474 600\n                  贷：应付职工薪酬——非货币性福利 3 164 000\n  实际发放：借：应付职工薪酬——非货币性福利 3 164 000\n                  贷：主营业务收入 2 800 000\n                      应交税费——应交增值税（销项税额）364 000\n            借：主营业务成本 2 000 000\n                  贷：库存商品 2 000 000\n  ②外购手机（售价总额 200 000，进项税额 26 000，不得抵扣）\n  借：生产成本 192 100\n      管理费用  33 900\n      贷：应付职工薪酬——非货币性福利 226 000\n  借：应付职工薪酬——非货币性福利 226 000\n      贷：银行存款 226 000（或原材料等 200 000、应交税费——应交增值税（进项税额转出）26 000）\n  ```\n- **易错**：①**自产产品必须视同销售**——确认收入、结转成本、计销项税额，\"按成本结转应付职工薪酬\"是最常见错误（2021-8 中少计 4 万元职工薪酬即源于此）；②外购商品的**进项税额不得抵扣，要计入职工薪酬成本**；③按**受益对象**（生产人员/管理人员）分别计入生产成本与管理费用。\n- **考察**：2021-8\n\n### 非货币性福利（二）：无偿或低价提供自有资产、服务\n- **优先级**：★★★\n- **内容**：企业有时以**低于企业取得资产或服务成本的价格**向职工提供资产或服务，如以低于成本的价格向职工出售住房、以低于企业支付的价格向职工提供医疗保健服务。以提供包含补贴的住房为例，企业在出售住房等资产时，应当将此类资产的**公允价值与其内部售价之间的差额（即相当于企业补贴的金额）**分别情况处理：①**合同或协议中规定了职工在购得住房后至少应当提供服务的年限、且职工提前离开应退还部分差价的**，企业应当将该项差额作为**长期待摊费用**处理，并在合同或协议规定的**服务年限内平均摊销**，根据**受益对象**分别计入相关资产成本或当期损益；②**合同或协议中未规定职工必须服务年限的**，企业应当将该项差额**直接计入出售住房当期**相关资产成本或当期损益。\n- **分录（教材例 9-5 数据：100 套公寓，80 名生产人员购价 100 万/套、售价 80 万/套；20 名管理人员购价 180 万/套、售价 150 万/套；协议规定服务 15 年）**：\n  ```\n  公允价值与内部售价差额合计 = 80×(100−80) + 20×(180−150) = 1 600 + 600 = 2 200（万元）\n  出售时：借：银行存款 94 000 000（80×80万 + 20×150万）\n              长期待摊费用 22 000 000\n              贷：固定资产 116 000 000（80×100万 + 20×180万）\n  每年摊销（15 年，直线法）：\n  借：生产成本 1 066 667（1 600 万 ÷ 15）\n      管理费用   400 000（600 万 ÷ 15）\n      贷：应付职工薪酬——非货币性福利 1 466 667\n  借：应付职工薪酬——非货币性福利 1 466 667\n      贷：长期待摊费用 1 466 667\n  ```\n- **易错**：①**是否设服务年限**决定了\"长期待摊费用分期摊\"还是\"当期一次计入\"，这是命题人设陷阱的核心；②摊销的**双分录**（先贷应付职工薪酬、再冲长期待摊费用）不能只写一笔；③摊销额按**受益对象**分别计入生产成本与管理费用。\n- **考察**：2021-8\n\n### 设定提存计划\n- **优先级**：★★★\n- **内容**：**设定提存计划**是指企业向**独立于本企业**的基金缴存固定费用后，**不再承担进一步支付义务**的离职后福利计划（如企业年金）。在该计划下，企业的**法定义务以企业同意向基金的缴存额为限**，职工所取得的离职后福利金额取决于向离职后福利计划或保险公司支付的**提存金金额**以及**提存金所产生的投资回报**，**精算风险**（福利将少于预期的风险）和**投资风险**（投资资产将不足以支付预期福利的风险）**实质上由职工承担**。企业应在职工为其提供服务的会计期间，将**应缴存金额**确认为负债，并计入当期损益或相关资产成本。\n- **分录**：\n  ```\n  借：管理费用 / 生产成本等（按受益对象）\n      贷：应付职工薪酬——设定提存计划（或银行存款，直接缴存时）\n  ```\n- **易错**：判断是否为设定提存计划看**企业是否只承担缴存义务**——\"缴存额之外再无其他义务、既不享有缴存资金产生的收益也不承担投资风险\"（例 9-6 中的企业年金）即为设定提存计划。**注意教材例 9-6 存在文字矛盾**：其分析段落已明确认定该企业年金为**设定提存计划**，但该例紧随其后的行文又出现\"该福利计划为设定受益计划\"的表述，应为教材笔误；应以**分析段的结论（设定提存计划）**为准。\n- **考察**：—\n\n### 设定受益计划（一）：与设定提存计划的区分\n- **优先级**：★★★\n- **内容**：**设定受益计划**是指**除设定提存计划以外**的离职后福利计划，两者的区分取决于计划的**主要条款和条件所包含的经济实质**，而不是计划名称。在设定受益计划下，企业的义务是**为现在及以前的职工提供约定的福利**，计划相关的**精算风险和投资风险实质上由企业承担**，如果精算或投资的实际结果比预期差，企业的义务可能增加。当企业负有下列义务时，该计划属于设定受益计划：①**计划福利公式不仅与提存金金额相关，而且要求企业在资产不足以满足该公式的福利时提供进一步的提存金**；②**通过计划间接地或直接地对提存金的特定回报作出担保**。设定受益计划可能是不注资的，也可能全部或部分由企业（有时由其职工）以缴纳提存金形式**注入资金**；**因此设定受益计划所确认的费用并不一定是本期应付的提存金金额**。企业存在**多项**设定受益计划的，应当对**每一项计划分别**进行会计处理。\n- **易错**：①\"计划是否有独立基金\"**不是**区分标准（设定提存计划与注资的设定受益计划都有基金）；②**\"是否承担精算风险与投资风险\"**才是区分标准；③到期时已注资福利的支付不仅取决于基金财务状况和投资业绩，**还取决于企业补偿基金资产短缺的能力和意愿**。\n- **考察**：2017-12、2017-13\n\n### 设定受益计划（二）：四个核算步骤\n- **优先级**：★★★\n- **内容**：设定受益计划的核算涉及四个步骤：\n  - **步骤一：确定设定受益义务现值和当期服务成本。** ①根据**预期累计福利单位法**，采用**无偏且相互一致**的精算假设对有关**人口统计变量**（如职工离职率和死亡率）和**财务变量**（如未来薪金和医疗费用的增加）等作出估计，计量义务并确定**相关义务的归属期间**；②根据**资产负债表日**与设定受益计划义务**期限和币种相匹配**的**国债**或**活跃市场上的高质量公司债券**的市场收益率确定**折现率**，将义务折现，确定设定受益义务现值和**当期服务成本**。\n  - **步骤二：确定设定受益计划净负债或净资产。** 设定受益计划**存在资产**的，企业应当将**设定受益计划义务现值减去设定受益计划资产公允价值**所形成的**赤字或盈余**确认为一项**设定受益计划净负债或净资产**。\n  - **步骤三：确定应当计入当期损益的金额。** 包括**当期服务成本、过去服务成本、结算利得或损失、设定受益计划净负债或净资产的利息净额**（利息净额 = 计划义务的利息费用 − 计划资产的利息收益，并按**资产上限**的影响调整）。\n  - **步骤四：确定应当计入其他综合收益的金额。** **重新计量**设定受益计划净负债或净资产所产生的变动，包括**精算利得或损失、计划资产回报（扣除已计入利息净额的金额）、资产上限影响的变动（扣除已计入利息净额的金额）**，应当计入**其他综合收益**，且**在后续会计期间不允许转回至损益**。\n- **计算（教材例 9-7 前相关数据，折现率取 10%）**：职工退休时可一次性获得福利，当期服务成本按**预期累计福利单位法**逐年确认；当期服务成本折现 = 未来应支付福利 ÷ (1 + r)^n。\n- **易错**：①**折现率必须用\"与义务期限和币种相匹配的国债或高质量公司债券的市场收益率\"**，不能用企业自身借款利率或历史利率；②**\"利息净额\"是净额**（义务利息费用 − 资产利息收益），不是两笔分别列示；③**重新计量（精算利得/损失、计划资产回报、资产上限影响）计入其他综合收益且不得转入损益**——这是与\"其他长期职工福利\"最本质的区别；④累计福利单位法的计算基数是**预计的最终福利**并按服务年限归属。\n- **考察**：2017-12、2017-13\n\n### 辞退福利：定义与确认时点\n- **优先级**：★★★\n- **内容**：**辞退福利**是指企业在**职工劳动合同到期之前**解除与职工的劳动合同关系，或者为**鼓励职工自愿接受裁减**而给予职工的补偿。主要包括：①在职工劳动合同尚未到期前，**不论职工本人是否愿意**，企业决定解除与职工的劳动关系而给予的补偿；②在职工劳动合同尚未到期前，为**鼓励职工自愿接受裁减**而给予的补偿。确认时点（二者孰早）：①**企业不能单方面撤回**解除劳动关系计划或裁减建议所提供的辞退福利时；②企业**确认涉及支付辞退福利的重组相关的成本或费用**时（即承担了重组义务时）。\n- **易错**：①**辞退福利与正常退休养老金应当区分开来**——辞退福利的引发事项是**辞退**；职工正常退休获得的养老金，引发补偿的事项是**职工在职时提供的服务，而不是退休本身**，因此应在**职工提供服务的会计期间**确认和计量（属离职后福利）；②职工虽未与企业解除劳动合同，但**未来不再为企业提供服务、不能为企业带来经济利益**，企业承诺提供实质上具有辞退福利性质的经济补偿的，应当**比照辞退福利处理**；③企业实施**职工内部退休计划**的，在其**正式退休之前应当比照辞退福利处理**，**正式退休之后按照离职后福利处理**。\n- **考察**：2017-11、2020-6\n\n### 辞退福利：计量与列示（不区分受益对象，一律计入管理费用）\n- **优先级**：★★★\n- **内容**：由于**被辞退的职工不再为企业带来未来经济利益**，因此对于**所有**辞退福利，均应当在辞退计划**满足负债确认条件的当期一次计入费用，不计入资产成本**——即**不区分受益对象，一律计入\"管理费用\"**（这是辞退福利区别于短期薪酬、离职后福利的核心特征）。具体计量规则：①**分期或分阶段实施**的解除劳动关系计划或自愿裁减建议，企业应当将**整个计划看作是由各单项解除劳动关系计划或自愿裁减建议组成**，在**每期或每阶段**计划符合预计负债确认条件时，将该期或该阶段计划中由提供辞退福利产生的预计负债予以确认，计入该部分计划**满足预计负债确认条件的当期管理费用**，**不能等全部计划都符合确认条件时再予以确认**。②实施**职工内部退休计划**的，在内退计划符合确认条件时，将**自职工停止提供服务日至正常退休日期间、企业将支付的内退人员工资和缴纳的社会保险费等**确认为应付职工薪酬，**一次计入当期管理费用**，**不能在职工内退后各期分期确认**。③**职工没有选择权**的辞退计划，根据计划条款规定拟解除劳动关系的职工数量、每一职位的辞退补偿等计提应付职工薪酬；**自愿接受裁减**的建议因接受裁减的职工数量不确定，应根据或有事项准则**预计将会接受裁减建议的职工数量**计提。④**辞退福利在确认的年度报告期间结束后 12 个月内完全支付的，适用本章关于短期薪酬的有关规定**；**12 个月内不能完全支付的，适用本章关于其他长期职工福利的有关规定**，即实质性辞退工作一年内实施完毕但补偿款项**超过一年支付**的，应选择恰当的**折现率**，以**折现后的金额**计量应计入当期损益的辞退福利金额。\n- **分录**：\n  ```\n  借：管理费用（辞退福利金额，一次性、不按受益对象分摊）\n      贷：应付职工薪酬——辞退福利\n  超过一年支付需折现的：\n  借：管理费用（折现后的金额）\n      未确认融资费用\n      贷：应付职工薪酬——辞退福利（未来应支付总额）\n  分期摊销时：借：财务费用  贷：未确认融资费用\n  ```\n- **易错**：①**\"一律计入管理费用、一次计入\"**是本章最硬的考点，不要按生产/管理岗位拆分；②**内退人员的工资和社保不能在正式退休前的各期分期确认**，要一次计入；③自愿裁减的建议要**按或有事项准则预计接受裁减的人数**，且计划确认采用**最佳估计数（最可能发生数）**；④与第十二章或有事项的重组义务交叉时，要区分**辞退福利（应付职工薪酬）**与**与重组有关的其他直接支出（预计负债）**，两者科目不能混（2017-11、2020-6）。\n- **考察**：2017-11、2020-6\n\n### 其他长期职工福利\n- **优先级**：★★★\n- **内容**：**其他长期职工福利**是指除短期薪酬、离职后福利和辞退福利以外的**其他所有**职工福利，包括（假设预计在职工提供相关服务的年度报告期末以后 **12 个月内不会全部结算**）：**长期带薪缺勤**（如其他长期服务福利）、**长期残疾福利**、**长期利润分享计划和长期奖金计划**，以及**递延酬劳**等。企业向职工提供的其他长期职工福利，**符合设定提存计划条件**的，按设定提存计划的有关规定处理；**符合设定受益计划条件**的，按设定受益计划的有关规定确认和计量**其他长期职工福利净负债或净资产**。在报告期末，企业应当将其他长期职工福利产生的职工薪酬成本确认为下列组成部分：①**服务成本**；②**其他长期职工福利净负债或净资产的利息净额**；③**重新计量其他长期职工福利净负债或净资产所产生的变动**。**为了简化相关会计处理，上述项目的总净额应当计入当期损益或相关资产成本。**\n- **易错**：①**关键区别**——其他长期职工福利的**重新计量（含精算利得或损失）计入当期损益或相关资产成本**，而设定受益计划的重新计量计入**其他综合收益且不得转损益**，两者方向完全相反，这是命题人最爱的对比陷阱；②**长期残疾福利**：水平**取决于**职工提供服务期间长短的，应在**职工提供服务的期间**确认义务，计量时考虑支付的可能性和预期支付期限；**与**职工提供服务期间长短**无关**的，应在**导致职工长期残疾的事件发生的当期**确认应付长期残疾福利义务；③**递延酬劳**（按比例分期支付或经常性定额支付的递延奖金）应按**奖金计划的福利公式**确认费用，或按**直线法**在相应服务期间分摊确认；④如果企业**内部**为其长期奖金计划或递延酬劳**设立一个账户**，这样的其他长期职工福利**不符合设定提存计划的条件**。\n- **考察**：—\n\n## 本章易错陷阱汇总\n\n1. **辞退福利的\"三个一律\"**：一律在满足负债确认条件的**当期一次**计入费用、**一律计入管理费用**（不区分受益对象）、**不适用资产成本化**。同章的短期薪酬与离职后福利都要按受益对象分摊，唯有辞退福利例外。\n2. **辞退福利 vs 正常退休养老金**：引发事项分别是\"**辞退**\"和\"**职工在职时提供的服务**\"。内退：正式退休前比照辞退福利，正式退休后按离职后福利。\n3. **辞退福利的 12 个月规则**：12 个月内**完全支付**→按短期薪酬规定；**不能完全支付**→按其他长期职工福利规定，需**折现**并按折现后金额计量。\n4. **重新计量的去向是本章最重要的对比**：**设定受益计划→其他综合收益，且后续不允许转回至损益**；**其他长期职工福利→当期损益或相关资产成本**。\n5. **累积带薪缺勤只对\"预期会动用的超额部分\"计提**，且采用后进先出法；**非累积带薪缺勤（婚假、产假、丧假、探亲假、病假）不预提**，实际发生缺勤时视同出勤确认。\n6. **非货币性福利的\"两视同\"**：自产产品发放**视同销售**（确认收入、结转成本、计销项税额）；外购商品发放**进项税额不得抵扣、计入成本费用**。低价售房则看**是否约定服务年限**决定长期待摊费用或当期一次计入。\n7. **利润分享计划要按\"业绩期间\"分摊**，不能全部计入支付义务所属的会计期间。\n8. **职工福利费在实际发生时按实际发生额计入**，不得预提；员工持股计划的资金来源若被预提为职工薪酬负债，则不符合负债确认条件，属前期差错（2018-18）。\n\n## 本章分录模板\n\n```\n【一】货币性短期薪酬（计提与发放）\n借：生产成本 / 制造费用 / 管理费用 / 销售费用 / 在建工程 / 研发支出等（按受益对象）\n    贷：应付职工薪酬——工资 / 社会保险费 / 住房公积金 / 工会经费 / 职工教育经费\n借：应付职工薪酬\n    贷：银行存款\n\n【二】累积带薪缺勤\n计提：借：管理费用等  贷：应付职工薪酬——累积带薪缺勤\n实际未使用冲回：借：应付职工薪酬——累积带薪缺勤  贷：管理费用等\n\n【三】短期利润分享计划\n借：生产成本 / 管理费用等（按受益对象）\n    贷：应付职工薪酬——利润分享计划\n\n【四】非货币性福利·自产产品发放\n决定发放：借：生产成本 / 管理费用等  贷：应付职工薪酬——非货币性福利\n实际发放：借：应付职工薪酬——非货币性福利\n              贷：主营业务收入\n                  应交税费——应交增值税（销项税额）\n          借：主营业务成本  贷：库存商品\n\n【五】非货币性福利·外购商品发放\n借：生产成本 / 管理费用等（含不得抵扣的进项税额）\n    贷：应付职工薪酬——非货币性福利\n借：应付职工薪酬——非货币性福利\n    贷：银行存款 / 应交税费——应交增值税（进项税额转出）\n\n【六】提供含补贴的住房（约定服务年限）\n出售时：借：银行存款、长期待摊费用  贷：固定资产\n每年摊销：借：生产成本 / 管理费用等\n              贷：应付职工薪酬——非货币性福利\n          借：应付职工薪酬——非货币性福利  贷：长期待摊费用\n（未约定服务年限：差额直接计入出售当期相关资产成本或当期损益）\n\n【七】设定提存计划\n借：管理费用 / 生产成本等  贷：应付职工薪酬——设定提存计划（或银行存款）\n缴存时：借：应付职工薪酬——设定提存计划  贷：银行存款\n\n【八】设定受益计划\n服务成本、利息净额：\n借：管理费用等（当期服务成本、过去服务成本、结算利得或损失）\n    财务费用等（设定受益计划净负债或净资产的利息净额）\n    贷：应付职工薪酬——设定受益计划\n重新计量（精算利得或损失、计划资产回报、资产上限影响变动）：\n借：其他综合收益（或贷方）\n    贷：应付职工薪酬——设定受益计划（或借方）\n（后续会计期间不允许转回至损益）\n\n【九】辞退福利（一次计入管理费用，不区分受益对象）\n借：管理费用\n    贷：应付职工薪酬——辞退福利\n超过一年支付：借：管理费用（折现值）、未确认融资费用\n                  贷：应付职工薪酬——辞退福利（未来应付总额）\n摊销：借：财务费用  贷：未确认融资费用\n\n【十】其他长期职工福利\n借：管理费用 / 生产成本等（服务成本、利息净额、重新计量变动三项净额）\n    贷：应付职工薪酬——其他长期职工福利\n（注意：重新计量计入当期损益，而非其他综合收益）\n```\n\n## 与其他章的联动\n\n- **与第十章（股份支付）**：现金结算的股份支付通过\"应付职工薪酬——股份支付\"核算，其负债确认与计量思路与本章一致；员工持股计划的资金来源是否构成职工薪酬负债、股权激励费用是否应确认，需同时适用本章与第十章（2018-18）。\n- **与第十二章（或有事项）**：**重组义务**同时涉及本章辞退福利与或有事项章的预计负债——自愿遣散、强制遣散计入应付职工薪酬，不再使用厂房的租赁撤销费等重组直接支出计入预计负债，两者不能混（2017-11、2020-6）。**自愿接受裁减的建议**因人数不确定，需按或有事项准则预计接受裁减的职工数量。\n- **与第十三章（金融工具）**：设定受益计划的折现率须采用与义务期限和币种相匹配的国债或高质量公司债券的市场收益率；设定受益计划净负债的利息净额核算与金融负债的摊余成本计量逻辑一致。\n- **与第十六章（所有者权益）**：设定受益计划**重新计量**计入**其他综合收益**且不得转回损益，属于\"以后不能重分类进损益的其他综合收益\"，在所有者权益变动表中单独列示；**其他长期职工福利的重新计量则计入当期损益**，两者在权益变动表中的列示位置不同。\n- **与第十七章（收入、费用和利润）**：以自产产品发放非货币性福利**视同销售**，需同时适用收入章关于商品控制权转移与收入确认的规定（2021-8）。\n- **与第十九章（所得税）**：辞退福利、设定受益计划等形成的应付职工薪酬，其**费用在实际支付时才允许税前扣除**，需按所得税章确认递延所得税资产（2020-6 中涉及递延所得税资产的冲回）。\n- **与第二十四章（会计政策、会计估计及其变更和差错更正）**：职工福利费的预提、股份支付费用的确认时点判断错误等，属前期差错，按第二十四章更正（2018-18）。\n",
    "10": "# 第十章 股份支付\n\n> 本题库考察频次：16 题 ｜ 优先级：A ｜ 建议投入：精读+默写分录（本册分值密度最高的一章，权益结算/现金结算两条主线必须能独立默写出完整分录）\n\n## 核心考点清单\n\n### 股份支付的判断（是否适用本章）\n- **优先级**：★★★\n- **内容**：股份支付是\"企业为获取职工或其他方服务而授予权益工具，或承担以权益工具为基础确定的负债\"的交易。判断三要素：以获取服务为目的、对价与股份（股价）未来价值密切相关、属于企业集团与职工之间的交易。\n- **易错**：①普通合伙人在员工持股平台中\"代持\"受让股份（约定将来再授予其他激励对象、本人不享有投票权与受益权），不符合股份支付定义，**不构成新的股份支付**；②控股股东为员工股价下跌损失\"兜底\"（涨归员工、跌由控股股东现金补偿）**构成**股份支付——控股股东合并报表按**现金结算**处理，接受服务的上市公司无结算义务，按**权益结算**处理。\n- **考察**：2018-18、2022-9\n\n### 四个环节与关键日期：授予日、等待期、可行权日、行权日、出售日\n- **优先级**：★★★\n- **内容**：典型环节为授予、可行权、行权、出售。授予日＝股份支付协议**获得批准**的日期（\"获得批准\"＝企业与职工已**达成一致**且经股东会或类似机构批准）；可行权日＝可行权条件得到满足、职工取得权益工具或现金权利的日期；**从授予日至可行权日的时段为等待期**（又称行权限制期）；行权日＝实际行使权利的日期；出售日＝将行权取得的股票出售的日期。\n- **易错**：①实务中股东会已通过方案并定授予价格，但**授权董事会后续确定激励对象及股份数量**的，授予日为**董事会确定对象与数量并与员工沟通达成一致之日**（不是股东会通过日）；②我国法规要求行权日与出售日之间设禁售期，国有控股上市公司禁售期不低于 2 年。\n- **考察**：2017-14、2022-9\n\n### 股份支付工具的两大类四小类\n- **优先级**：★★★\n- **内容**：①**以权益结算**的股份支付（以股份或其他权益工具作为对价）——常用工具为**限制性股票**与**股票期权**；②**以现金结算**的股份支付（承担以股份或其他权益工具为基础计算确定的负债）——如**现金股票增值权**、模拟股票。\n- **易错**：限制性股票是\"职工按协议条款条件从企业**获得一定数量的本企业股票**\"，在确定等待期内或满足特定业绩指标前，出售受持续服务期限条款或业绩条件限制——**不要与股票期权（先付费后买股）混为一谈**，两者的授予日与解锁/行权分录完全不同。\n- **考察**：2021-2、2022-9\n\n### 权益结算 vs 现金结算：判断标准与计量总原则\n- **优先级**：★★★\n- **内容**：\n\n| 对比项 | 以权益结算 | 以现金结算 |\n|---|---|---|\n| 对价形式 | 股份/其他权益工具 | 以股份为基础计算的现金负债 |\n| 计量基础 | **授予日**权益工具公允价值 | **每个资产负债表日**负债公允价值 |\n| 后续是否调整公允价值 | **不再调整** | **每个资产负债表日及结算日重新计量** |\n| 对应科目 | 资本公积——其他资本公积 | 应付职工薪酬——股份支付 |\n| 可行权日之后 | 不再调整已确认成本费用与所有者权益总额 | 不再确认成本费用，负债公允价值变动计入**公允价值变动损益** |\n\n- **易错**：判断\"权益结算还是现金结算\"看的是**企业承担的是交付权益工具的义务还是交付现金的义务**，而不是看工具名称。现金股票增值权虽\"以股价为基础\"，但交付现金→**现金结算**。\n- **考察**：2015-8、2019-7、2020-1、2020-3\n\n### 授予日的会计处理（除立即可行权外不做账）\n- **优先级**：★★★\n- **内容**：**除立即可行权的股份支付外，无论权益结算还是现金结算，授予日均不做会计处理。**\n- **分录**：\n  - 授予后**立即可行权**、换取职工服务的权益结算：借\"管理费用/生产成本等\"，贷\"资本公积——其他资本公积\"（按**授予日**公允价值）。\n  - 授予后**立即可行权**的现金结算：借\"管理费用等\"，贷\"应付职工薪酬——股份支付\"（按**企业承担负债的公允价值**）。\n- **易错**：限制性股票属于\"授予后立即可行权\"还是\"有等待期\"要看清条款——不设解锁条件的立即计入费用；设锁定期/解锁期的按等待期分摊。\n- **考察**：2017-14\n\n### 换取其他方服务的股份支付：计量顺序\n- **优先级**：★★\n- **内容**：以**股份支付所换取服务的公允价值**计量，按其他方服务在**取得日**的公允价值计入相关资产成本或费用；其他方服务公允价值**不能可靠计量**但权益工具公允价值能可靠计量的，改按**权益工具在服务取得日**的公允价值计量。\n- **易错**：计量顺序是\"服务公允价值优先，权益工具公允价值兜底\"，且**用权益工具计量时点也是\"服务取得日\"**，不是授予日。\n- **考察**：—\n\n### 可行权条件的分类：服务期限条件、业绩条件（市场/非市场）、非可行权条件\n- **优先级**：★★★\n- **内容**：**可行权条件**＝能够确定企业是否得到服务、且该服务使职工具有获取权益工具或现金权利的条件，包括**服务期限条件**与**业绩条件**；**业绩条件**又分**市场条件**（行权价格、可行权条件及行权可能性与权益工具**市场价格**相关，如\"股价年增长 10% 以上\"）与**非市场条件**（其他业绩条件，如\"净利润增长率达到 20%\"\"销售目标\"）。不满足上述条件的为**非可行权条件**（如要求职工将部分薪金存入统一账户保管）。\n- **易错**：①确定权益工具**授予日公允价值**时，**应考虑市场条件和非可行权条件**的影响，**不考虑非市场条件**的影响；②市场条件和非可行权条件是否满足**不影响**企业对预计可行权情况的估计；非市场条件是否满足**影响**预计可行权数量的估计。\n- **考察**：2017-15、2020-2\n\n### 可行权条件未满足的处理（本章最高频的判断题）\n- **优先级**：★★★\n- **内容**：只要职工满足了**其他所有非市场条件**（服务期限、利润增长率等），企业就应当**确认已取得的服务**；即使**市场条件**未满足，只要服务期限等其他非市场条件满足，**仍要确认费用**。反之，**非市场条件**未满足（未达到规定的业绩指标），则不能确认已取得的服务，**已确认的费用应当冲回**。\n- **易错**：命题人最爱的陷阱——\"股价未涨到规定水平，所以不确认费用\"是**错**的；\"净利润增长率未达标，所以照常确认费用\"也是**错**的。记住口诀：**市场条件不达标→照确认；非市场条件不达标→不确认并冲回**。\n- **考察**：2017-15、2017-17、2022-9\n\n### 等待期内每个资产负债表日：可行权数量最佳估计 × 授予日公允价值\n- **优先级**：★★★\n- **内容**：等待期内每个资产负债表日，**权益结算**按**对可行权权益工具数量的最佳估计**×**授予日权益工具公允价值**，将当期取得的服务计入相关成本费用和资本公积（其他资本公积），**不确认后续公允价值变动**；**现金结算**按**每个资产负债表日负债的公允价值**重新计量，按可行权情况的最佳估计计算，计入成本费用和应付职工薪酬。\n- **分录（权益结算，通用模板）**：\n  ```\n  借：管理费用 / 生产成本 / 制造费用 / 研发支出等（按受益对象）\n      贷：资本公积——其他资本公积\n  当期费用 = 期末累计应确认数 − 前期累计已确认数\n  累计应确认数 = 预计可行权数量 × 授予日公允价值 × （已过等待期 / 等待期总长）\n  ```\n- **易错**：①每一期都要**用最新估计的可行权数量重算累计数，再倒挤当期数**（即\"累计法\"，不是\"当期数量×当期比例\"）；②权益结算下**人数估计变了要调，公允价值绝不能调**。\n- **考察**：2017-15、2017-16、2019-7\n\n### 一次授予、分期行权：视同几个独立的股份支付计划\n- **优先级**：★★\n- **内容**：对于\"一次授予、分期行权\"，**每个批次是否可行权的结果通常相对独立**，会计上应视同为**同时授予的几个独立股份支付计划**，分别确定每个计划的等待期；按每个计划在**授予日的公允价值**估计费用，在其相应等待期内按\"该会计期间内等待期长度占整个等待期长度的比例\"分摊。\n- **易错**：不要把分批行权当成一个整体等待期平均分摊；\"三年按 1/3、2/3、3/3 线性\"只适用于**单一等待期**的计划。\n- **考察**：—\n\n### 等待期长度的估计变更（属会计估计变更）\n- **优先级**：★★★\n- **内容**：等待期内出现新信息表明需调整对可行权情况的估计的（含**等待期长度**），应当**修改原来的估计**。典型情形：约定\"员工须服务至企业成功完成首次公开募股（IPO），否则所持股份按原认购价回售\"——服务至 IPO 属**服务期限条件**，成功 IPO 属业绩条件中的**非市场条件**；企业应合理估计 IPO 可能性及完成时点，将**授予日至该时点**作为等待期，并在每个资产负债表日重估可行权数量；**重估时点变化时应据重估时点重新确定等待期，用\"截至当期累计应确认 − 前期累计已确认\"确定当期费用**。\n- **易错**：等待期长度的变化属于**会计估计变更**，采用**未来适用法**，不追溯调整；切勿按会计政策变更追溯重述。\n- **考察**：2020-2、2022-9\n\n### 附非市场业绩条件的权益结算股份支付（例10-6型计算）\n- **优先级**：★★★\n- **内容**：三年平均净利润增长等**非市场业绩条件**下，若某年末未达标但企业仍预计未来能达标，则**调整预计等待期**（如第一年末预计 2 年可行权→等待期由 3 年改为 2 年，按 1/2 而非 1/3 计算累计费用），同时调整预计可行权数量；后续再调整回 3 年等待期。\n- **计算**：累计费用 = 预计可行权数量 × 授予日公允价值 ×（已过期间 / 预计等待期总长）；当期费用 = 本期累计 − 上期累计。例10-6 中授予日公允价值 24 元/份，第一年 (100−8−8)×100×24×1/2＝100 800 元，第二年 (100−8−10−12)×100×24×2/3−100 800＝11 200 元，第三年 (100−8−10−8)×100×24−112 000＝65 600 元。\n- **易错**：**等待期长度可变是本考点的灵魂**——只调人数不调等待期是最常见的失分点。\n- **考察**：2020-2\n\n### 附市场条件的权益结算股份支付（例10-3型计算）\n- **优先级**：★★★\n- **内容**：可行权条件为\"服务满 3 年 + 股价年增长 10% 以上\"时，服务满 3 年是**服务期限条件**，10% 股价增长是**市场条件**；市场条件是否满足**不影响**预计可行权数量的估计，企业**三年年末均照常确认费用**（例：第一年 6 000 000×1/3×90%＝1 800 000；第二年 6 000 000×2/3×95%＝3 800 000，当期 2 000 000；第三年 6 000 000×94%＝5 640 000，当期 1 840 000）。\n- **易错**：①计算中乘的比例是**离职率调整后的可行权比例**（90%、95%、94%），**不是**股价增长概率；②\"市场条件未满足\"**绝不**导致费用冲回。\n- **考察**：2020-2\n\n### 现金结算的股份支付（例10-7型计算）\n- **优先级**：★★★\n- **内容**：等待期内按**每个资产负债表日负债公允价值**×**预计可行权数量**×（已过等待期/等待期总长）计算累计负债，倒挤当期费用；**可行权日之后不再确认成本费用**，负债公允价值变动计入**公允价值变动损益**；结算时冲减应付职工薪酬、贷记银行存款。\n- **分录**：\n  ```\n  等待期内：借：管理费用            贷：应付职工薪酬——股份支付\n  可行权后：借：公允价值变动损益     贷：应付职工薪酬——股份支付\n  实际结算：借：应付职工薪酬——股份支付  贷：银行存款\n  ```\n- **易错**：可行权日之后**不再有\"管理费用\"**，只有公允价值变动损益；越是临近结算，负债总额会随公允价值上升而增加，这部分**不进费用总额**（进公允价值变动损益）。\n- **考察**：2020-1、2020-2、2020-3\n\n### 可行权日之后的会计处理\n- **优先级**：★★★\n- **内容**：①**权益结算**：可行权日之后**不再对已确认的成本费用和所有者权益总额进行调整**；行权日按行权情况确认股本和股本溢价，同时**结转等待期内确认的资本公积（其他资本公积）**。②**现金结算**：可行权日之后**不再确认成本费用**，负债公允价值变动计入**当期损益（公允价值变动损益）**。\n- **分录（权益结算行权）**：\n  ```\n  借：银行存款（行权价 × 行权股数）\n      资本公积——其他资本公积（等待期累计确认额）\n      贷：股本（面值 × 股数）\n          资本公积——股本溢价（倒挤）\n  ```\n- **易错**：行权分录中\"资本公积——其他资本公积\"转出的金额是**等待期内累计确认的费用总额**，不是当期数；差额全部进股本溢价。\n- **考察**：2015-11、2020-3\n\n### 回购股份进行职工期权激励\n- **优先级**：★★\n- **内容**：企业以**回购股份**形式奖励本企业职工，**属于权益结算的股份支付**。回购时按**回购股份的全部支出**作为**库存股**处理，同时作备查登记；等待期内按权益工具在**授予日**的公允价值确认成本费用并增加资本公积（其他资本公积）；职工行权购买本企业股份时，**转销交付职工的库存股成本和等待期内累计的资本公积（其他资本公积）**，差额调整**资本公积（股本溢价）**。\n- **分录**：\n  ```\n  回购：借：库存股            贷：银行存款\n  等待期：借：管理费用等        贷：资本公积——其他资本公积\n  行权：借：银行存款\n            资本公积——其他资本公积\n            资本公积——股本溢价（差额，或贷方）\n            贷：库存股\n  ```\n- **易错**：回购用于激励**不通过\"长期股权投资\"或\"其他应付款\"**（除非存在回购义务，见限制性股票）；库存股转销时差额**先冲股本溢价，不足再冲盈余公积、未分配利润**（不得出现借方余额）。\n- **考察**：2021-2、2022-9\n\n### 授予限制性股票进行股权激励：授予日\n- **优先级**：★★★\n- **内容**：上市公司以**非公开发行**方式向激励对象授予一定数量公司股票，规定**锁定期与解锁期**，未解锁而失效/作废的由公司按事先约定价格**回购**。授予日按发行股票取得的价款：借记\"银行存款\"，贷记\"股本\"\"资本公积——股本溢价\"；同时就**回购义务**按约定回购价确认**库存股与其他应付款**。\n- **分录（授予日）**：\n  ```\n  借：银行存款（发行价 × 股数）\n      贷：股本（面值 × 股数）\n          资本公积——股本溢价（差额）\n  借：库存股（回购价 × 股数）\n      贷：其他应付款——限制性股票回购义务\n  ```\n- **易错**：①限制性股票是**两条分录并行**——一条反映发行，一条反映回购义务，缺一即丢分；②回购义务按**约定回购价**而非发行价；③限制性股票的**表决权、股利分配权**通常不受限制，与股票期权不同。\n- **考察**：2017-14、2021-2、2022-9\n\n### 限制性股票：等待期费用与不可解锁的处理\n- **优先级**：★★★\n- **内容**：等待期内按**授予日公允价值**和**预计可解锁数量的最佳估计**分摊确认费用（借\"管理费用\"，贷\"资本公积——其他资本公积\"）；后续信息变化时调整**可解锁数量**估计。**现金股利**分别处理：**预计可解锁**部分对应的股利，按**利润分配**处理（借\"利润分配——应付现金股利或利润\"，贷\"应付股利\"）；**预计不可解锁**部分对应的股利，**冲减其他应付款（回购义务）**，不作为利润分配。\n- **分录（股利与解锁）**：\n  ```\n  预计可解锁部分股利：借：利润分配——应付现金股利或利润   贷：应付股利\n  预计不可解锁部分股利：借：其他应付款——限制性股票回购义务  贷：应付股利\n  解锁时：借：其他应付款——限制性股票回购义务   贷：库存股\n  回购注销未解锁股份：借：其他应付款  贷：银行存款\n                    借：股本、资本公积——股本溢价  贷：库存股\n  ```\n- **易错**：①**不可解锁部分的股利不冲减成本费用**，而是冲减**其他应付款（回购义务负债）**；②回购注销时\"其他应付款\"与\"库存股\"按数量比例对冲，差额调整**股本与股本溢价**，不进损益；③限制性股票在计算**基本每股收益**时，属于发行在外的普通股，但需考虑**回购义务与解锁条件**的影响，无对价发行的部分按时间加权计算。\n- **考察**：2017-15、2017-16、2017-17、2017-18、2021-2、2022-9\n\n### 修改的会计处理：有利修改与不利修改\n- **优先级**：★★★\n- **内容**：**有利修改**——①增加权益工具**公允价值**的：按公允价值增加额相应确认取得服务的增加；修改发生在等待期内的，剩余等待期内既要确认\"以原权益工具授予日公允价值为基础的服务金额\"，也要确认公允价值增加额；修改发生在**可行权日之后**的**立即确认**；若要求职工先完成更长服务期才能取得修改后权益工具，应在**修改日至修改后可行权日**的整个期间确认增加额。②增加权益工具**数量**的：按增加部分的公允价值确认服务增加。③以有利于职工的方式修改**可行权条件**（缩短等待期、变更或取消**非市场条件**）的，处理时**应当考虑修改后的条件**。\n- **分录（有利修改，等待期内）**：\n  ```\n  当期费用 = 原计划当期应确认数 + 权益工具公允价值增加额 × 已过期间/剩余等待期\n  （示例 例10-4：2×22 年确认 198 000 = 原计划 120 000 + 30×1 000×(8.5−5.5)×6/30）\n  ```\n- **易错**：修改**降低行权价**（有利）与**延长等待期**（不利）同时出现时，**延长的等待期不予考虑**（仍按原等待期确认原公允价值部分），只在剩余等待期内确认公允价值的增加额。\n- **考察**：2020-2\n\n### 修改的会计处理：条款和条件的不利修改\n- **优先级**：★★★\n- **内容**：企业以减少股份支付公允价值总额或其他**不利于职工**的方式修改条款条件的，**仍应继续对取得的服务进行会计处理，如同该变更从未发生**，除非企业取消了部分或全部已授予的权益工具。具体：①减少权益工具**公允价值**的，继续以**授予日**公允价值为基础确认服务金额，**不考虑**公允价值的减少；②减少权益工具**数量**的，将减少部分**作为已授予权益工具的取消**处理；③以不利于职工的方式修改**可行权条件**（延长等待期、增加或变更**非市场条件**）的，处理时**不应考虑**修改后的条件。\n- **易错**：**有利修改要\"加\"，不利修改要\"当作没发生\"**——这是命题人区分优劣考生的分水岭。\n- **考察**：2020-2\n\n### 取消或结算（等待期内）\n- **优先级**：★★★\n- **内容**：等待期内取消或结算所授予的权益工具（**因未满足可行权条件而被取消的除外**），企业应当：①**将取消或结算作为加速可行权处理**，将原本应在**剩余等待期内确认的金额立即计入当期损益**，同时确认资本公积（其他资本公积）；②取消或结算时**支付给职工的所有款项均应作为权益的回购处理**，回购支付的金额**高于该权益工具在回购日公允价值的部分计入当期费用**；③向职工授予**新权益工具**并认定其用于**替代**被取消的权益工具的，按与原权益工具条款条件**修改相同的方式**处理，公允价值增加额＝替代权益工具授予日公允价值 − 被取消权益工具净公允价值。\n- **易错**：①\"**职工自愿退出**（认为行权价过高）\"**属于取消**，不属于\"未满足可行权条件\"，因此要**加速确认剩余等待期费用**；②真正因**未满足可行权条件**而作废的，**前期已确认费用要冲回**（如 2017-17 中 2016 年费用为 −180 万元：借\"资本公积——其他资本公积\"贷\"管理费用\"）；③\"加速行权\"不等于\"立即行权\"，只是**把剩余等待期应分摊的金额一次性确认**。\n- **考察**：2017-17、2020-2\n\n### 企业集团内涉及不同企业的股份支付交易（四分表）\n- **优先级**：★★★\n- **内容**：\n  - **结算企业**：以**其本身权益工具**结算的→**权益结算**；除此之外→**现金结算**。结算企业是接受服务企业**投资者**的，应按**授予日权益工具公允价值**或**应承担负债的公允价值**确认为对接受服务企业的**长期股权投资**，同时确认**资本公积（其他资本公积）或负债**。\n  - **接受服务企业**：**没有结算义务**或授予本企业职工的是**其本身权益工具**的→**权益结算**；**具有结算义务**且授予本企业职工的是**集团内其他企业权益工具**的→**现金结算**。\n\n| 组合 | 结算企业 | 接受服务企业 |\n|---|---|---|\n| 母公司用自身权益工具结算 | 权益结算（长期股权投资＋资本公积） | 无结算义务→权益结算（资本公积） |\n| 母公司承担现金结算义务 | 现金结算（长期股权投资＋应付职工薪酬） | 无结算义务→权益结算（资本公积） |\n| 子公司用自身权益工具结算 | 权益结算（长期股权投资＋资本公积） | 权益结算（资本公积） |\n| 子公司承担结算义务（授予集团内其他企业权益工具）→**接受服务企业为现金结算** | — | 现金结算（应付职工薪酬） |\n\n- **易错**：①\"母公司授予子公司员工期权\"时，**母公司按权益结算、子公司也按权益结算**，但**母公司确认的是长期股权投资+资本公积，子公司确认的是管理费用+资本公积**，两者金额口径不同（母按**授予日公允价值**、子按自身受益服务）；②判断\"是否有结算义务\"是选对模式的关键；③合并报表需将母公司\"长期股权投资\"与子公司\"资本公积\"**抵销**。\n- **考察**：2015-8、2015-9、2015-10、2015-11、2019-7、2020-1、2020-2、2020-3\n\n### 集团股份支付：合并财务报表的抵销与结果\n- **优先级**：★★★\n- **内容**：子公司（接受服务企业）确认的资本公积与母公司（结算企业）确认的长期股权投资**在合并层面相互抵销**；抵销后合并报表中应体现的，是**集团整体按结算企业口径（权益结算或现金结算）确认的结果**。\n- **分录（抵销）**：\n  ```\n  借：资本公积——其他资本公积（子公司累计确认数）\n      贷：长期股权投资——××子公司（母公司累计确认数）\n  ```\n- **易错**：①抵销时**只抵子公司累计确认金额与母公司长期股权投资对应部分**，若两者不等，**差额调整管理费用**（2020-1 中差额管理费用 560 万元、2020-2 中差额管理费用 280 万元均属此类）；②**母公司现金结算**的集团股份支付，合并层面最终体现为管理费用与应付职工薪酬，**不体现资本公积**。\n- **考察**：2015-10、2020-1、2020-2、2020-3\n\n### 将现金结算的股份支付修改为权益结算的股份支付\n- **优先级**：★★\n- **内容**：修改日应**终止确认已确认的负债**，同时按**权益工具在修改日的公允价值**将当期取得的服务计入**资本公积**；**两者的差额计入当期损益**。\n- **分录**：\n  ```\n  借：管理费用（差额，或作反向调整）\n      应付职工薪酬——股份支付（已确认负债）\n      贷：资本公积——其他资本公积（按修改日公允价值重新计算的累计服务金额）\n  ```\n- **易错**：修改后的等待期按**修改后**的期限重新计算分摊比例，但**已经度过的期间要按新等待期重新折算比例**（例10-9 中修改日等待期由 4 年延长至 5 年，累计按 2/5 计算＝100×500×16×2/5＝320 000 元，与已确认负债 125 000 元的差额 195 000 元计入当期损益）。\n- **考察**：2020-2\n\n### 权益工具公允价值的确定：股份与股票期权\n- **优先级**：★★\n- **内容**：①**授予职工的股份**：按**市场价格**计量；未公开交易的考虑条款条件估计市场价格。规定职工**无权在等待期内取得股份**的，估计公允价值时应予考虑；规定股份转让在**可行权日后**受限的也应考虑（但不超过\"市场参与者愿为该股份支付的价格受可行权限制影响的程度\"）；**估计授予日公允价值时不应考虑等待期内转让的限制和其他限制**，因为这些限制是可行权条件中的**非市场条件**规定的。②**股票期权**：有相同或类似可观察市场报价的按**市场报价**；没有的采用**期权定价模型**估计。模型至少应考虑：期权期限、行权价格、现行股价、股价预计波动率、预计股利、无风险利率，以及**提前行权行为、职工在企业中所处层级**等因素。\n- **易错**：①\"等待期内不得转让\"的限制**不影响**授予日公允价值；\"**可行权日后**转让受限\"**影响**授予日公允价值；②**预计股利**的处理：职工在授予日至行权日之间**有权取得**基础股份股利的，期权估值时**预计股利输入变量应取零**；职工对等待期内或行权前股利**没有要求权**的，估值时**应考虑预计股利**。\n- **考察**：2017-14、2022-9\n\n### 权益结算股份支付的完整分录模板（例10-5型）\n- **优先级**：★★★\n- **内容**：以\"200 名管理人员、每人 100 份期权、服务 3 年、授予日公允价值 18 元\"为例：\n\n| 时点 | 计算 | 分录 |\n|---|---|---|\n| 授予日 | — | 不做账 |\n| 第1年末 | 200×100×(1−20%)×18×1/3＝96 000 | 借：管理费用 96 000／贷：资本公积——其他资本公积 96 000 |\n| 第2年末 | 200×100×(1−15%)×18×2/3−96 000＝108 000 | 同左结构，金额 108 000 |\n| 第3年末 | 155×100×18−204 000＝75 000 | 同左结构，金额 75 000 |\n| 行权 | 面值 1 元 | 借：银行存款 77 500、资本公积——其他资本公积 279 000／贷：股本 15 500、资本公积——股本溢价 341 000 |\n\n- **易错**：每年都用**最新离职率估计**重算累计数；最后一年要用**实际可行权人数**（155 人）而非估计数。\n- **考察**：2015-11、2017-15\n\n## 本章易错陷阱汇总\n\n1. **市场条件 vs 非市场条件**：市场条件未满足**照样确认费用**；非市场条件未满足**不确认并冲回已确认费用**。确定授予日公允价值时**考虑市场条件、不考虑非市场条件**。市场条件用\"股价/行权价\"识别，非市场条件用\"利润/销售/IPO\"识别。\n2. **权益结算公允价值一律\"锁定不改\"**：只有**数量**（可行权数量最佳估计）可以调整，**价格**（授予日公允价值）永不变。现金结算则**数量与价格双调**。\n3. **等待期长度可变**：非市场业绩条件未达标的年份，要**重估等待期**（如 3 年变 2 年、再变 3 年），只调人数不调等待期是重大失分点。\n4. **职工自愿退出＝取消**，要**加速确认剩余等待期费用**；**未满足可行权条件而作废**才**冲回**已确认费用；两者方向相反。\n5. **限制性股票是\"双分录\"**：发行分录 + 回购义务分录（库存股/其他应付款）。**不可解锁部分的现金股利冲减其他应付款**，不是利润分配，也不是费用。\n6. **集团股份支付先判\"谁结算、用什么结算\"**：结算企业看\"是否用自身权益工具\"，接受服务企业看\"是否有结算义务\"。合并抵销后若两边金额不等，**差额调整管理费用**。\n7. **可行权日之后**：权益结算**什么都不用调**（除行权转销）；现金结算**不进管理费用**，公允价值变动走**公允价值变动损益**。\n8. **有利修改\"加\"，不利修改\"视同未发生\"**；修改同时含降行权价与延长等待期时，**延长等待期不予考虑**。\n\n## 本章分录模板\n\n```\n【一】权益结算·等待期内（每个资产负债表日）\n借：管理费用 / 生产成本 / 制造费用 / 研发支出等（按受益对象）\n    贷：资本公积——其他资本公积\n当期费用 = 预计可行权数量（最新估计）× 授予日公允价值 × 累计应摊比例 − 前期累计已确认\n\n【二】权益结算·可行权日之后行权\n借：银行存款（行权价 × 股数）\n    资本公积——其他资本公积（等待期累计数）\n    贷：股本（面值 × 股数）\n        资本公积——股本溢价（倒挤；如为借方差额依次冲减股本溢价、盈余公积、未分配利润）\n\n【三】现金结算·等待期内\n借：管理费用等\n    贷：应付职工薪酬——股份支付\n累计负债 = 预计可行权数量 × 资产负债表日负债公允价值 × 累计应摊比例\n\n【四】现金结算·可行权日之后\n借：公允价值变动损益\n    贷：应付职工薪酬——股份支付        （公允价值上升）\n实际结算：\n借：应付职工薪酬——股份支付\n    贷：银行存款\n（若为现金股票增值权实际支付额大于/小于已确认负债，差额继续调整公允价值变动损益）\n\n【五】回购股份用于激励\n回购：借：库存股  贷：银行存款\n行权：借：银行存款、资本公积——其他资本公积、资本公积——股本溢价（差额）\n          贷：库存股\n\n【六】限制性股票·授予日\n借：银行存款  贷：股本、资本公积——股本溢价\n借：库存股    贷：其他应付款——限制性股票回购义务\n\n【七】限制性股票·等待期内股利\n预计可解锁部分：借：利润分配——应付现金股利或利润  贷：应付股利\n预计不可解锁部分：借：其他应付款——限制性股票回购义务  贷：应付股利\n\n【八】限制性股票·回购注销未解锁股份\n借：其他应付款——限制性股票回购义务  贷：银行存款\n借：股本、资本公积——股本溢价        贷：库存股\n\n【九】集团股份支付（母公司授予子公司员工权益工具）\n母公司：借：管理费用（自身员工部分）、长期股权投资（子公司员工部分）  贷：资本公积——其他资本公积\n子公司：借：管理费用  贷：资本公积——其他资本公积\n合并抵销：借：资本公积——其他资本公积  贷：长期股权投资\n\n【十】取消或结算（加速可行权）\n借：管理费用（剩余等待期原应确认金额一次计入）\n    贷：资本公积——其他资本公积\n支付给职工的款项超过回购日公允价值部分：\n借：管理费用等  贷：银行存款/其他应付款\n\n【十一】现金结算修改为权益结算\n借：管理费用（差额）\n    应付职工薪酬——股份支付（已确认负债）\n    贷：资本公积——其他资本公积（按修改日公允价值计算的累计服务金额）\n```\n\n## 与其他章的联动\n\n- **与第九章（职工薪酬）**：股份支付中的权益结算与现金结算都涉及\"应付职工薪酬——股份支付\"科目，且集团股份支付中\"子公司职工\"的界定以第九章\"职工\"的概念（含劳务派遣用工）为前提；员工持股计划资金来源若构成职工薪酬负债，则按第九章确认条件判断（2018-18）。\n- **与第十三章（金融工具）**：金融负债与权益工具的区分规则，是判断\"以权益工具结算\"还是\"以现金结算\"的上位依据；现金结算股份支付形成的负债，其后续计量思路与金融负债公允价值变动一致。\n- **与第二十六章（企业合并）**：以权益工具作为对价取得其他企业净资产的交易适用企业合并章，不适用股份支付章。\n- **与第二十七章（合并财务报表）**：集团股份支付中母公司\"长期股权投资\"与子公司\"资本公积\"的抵销、差额调整管理费用，是合并报表内部交易抵销的特殊情形（2015-10、2020-1、2020-2、2020-3）。\n- **与第二十八章（每股收益）**：等待期内限制性股票的每股收益计算需要考虑回购义务与解锁条件（2021-2）。\n- **与第二十四章（会计政策、会计估计及其变更和差错更正）**：等待期长度的估计变更属会计估计变更，员工持股计划预提错误属前期差错更正，均按第二十四章方法处理。\n",
    "11": "# 第十一章 借款费用\n\n> 本题库考察频次：5 题 ｜ 优先级：B ｜ 建议投入：重点掌握（章节篇幅小、公式固定，属于\"背下来就能拿分\"的性价比章节；建议精算一遍专门借款与一般借款的例题）\n\n> ⚠️ **教材文本 OCR 说明**：本章 OCR 文本存在明显缺页——借款费用资本化的**开始条件（\"三个同时满足\"）**、**资本化期间的暂停与停止**、**辅助费用**等内容在本册教材 OCR 全文中无法检索到（文本自\"符合资本化条件的资产\"直接跳至\"专门借款/一般借款利息资本化金额的确定\"，随后跳入第十二章）。以下相关条目标注为\"**教材文本 OCR 损坏，条目标注不含教材定位**\"，其内容依据《企业会计准则第 17 号——借款费用》及本题库相应考点编写。已能确认的节标题：第一节 借款费用概述、第二节 借款费用的确认、第三节 借款费用的计量。\n\n## 核心考点清单\n\n### 借款费用的构成范围\n- **优先级**：★★★\n- **内容**：借款费用是企业因借入资金所付出的代价，包括：①**借款利息费用**（即按金融工具章的实际利率法计算确定的利息费用，**包括借款折价或溢价的摊销和相关辅助费用**）；②**因外币借款而发生的汇兑差额**；③承租人根据租赁准则确认的**融资费用**也属于借款费用。**企业发生的权益性融资费用不应包括在借款费用中。**\n- **易错**：①\"折价或溢价的摊销\"**属于**借款费用，其**实质是对债券票面利息的调整**（将票面利率调整为实际利率），不是单独的损失项目；②**权益性融资费用（如股票发行费用）不属于借款费用**，应从权益中扣减；③辅助费用（手续费、佣金等）在借款费用范围内，但**是否资本化取决于其性质**（见下\"辅助费用\"考点）。\n- **考察**：2016-6、2016-7\n\n### 借款的范围：专门借款与一般借款\n- **优先级**：★★★\n- **内容**：**专门借款**是指为购建或者生产符合资本化条件的资产而**专门借入**的款项，通常**应有明确的用途**并有**标明该用途的借款合同**；**一般借款**是指除专门借款之外的借款，借入时用途通常**没有特指**用于符合资本化条件的资产的购建或生产。\n- **易错**：区分不是看金额大小或期限长短，而是看**借款合同是否限定用途**。判断错这一步，后面的资本化金额公式就全错（专门借款用\"实际利息−闲置资金收益\"，一般借款用\"累计资产支出加权平均数×资本化率\"）。\n- **考察**：2016-6、2016-8\n\n### 符合资本化条件的资产\n- **优先级**：★★★\n- **内容**：符合资本化条件的资产指**需要经过相当长时间的购建或者生产活动才能达到预定可使用或者可销售状态**的**固定资产、投资性房地产和存货**等资产；确认为无形资产的**开发支出**等在符合条件时也可认定为符合资本化条件的资产。符合资本化条件的存货主要包括房地产开发企业开发的用于对外出售的房地产开发产品、企业制造的用于对外出售的大型机械设备等。**\"相当长时间\"通常为一年以上（含一年）。**\n- **易错**：①**人为或故意等非正常因素**导致购建/生产时间相当长的，该资产**不属于**符合资本化条件的资产（这是与\"暂停资本化\"判断相呼应的高频陷阱）；②**购入即可使用**的资产，或购入后只需简单安装即可使用的资产，不属于符合资本化条件的资产；③土地使用权是否计入资本化基数要区分：**自行开发建造厂房**的，土地使用权单独作无形资产、**通常已达到预定可使用状态**，因此应以**建造支出**（不含土地使用权出让金，但含土地使用权在建造期间计入在建工程的摊销额）为基础计算；**房地产开发企业**取得土地使用权用于建造**对外出售**房屋建筑物的，土地使用权应计入所建造房屋建筑物成本，**应包含土地使用权支出**为基础计算。\n- **考察**：2016-6、2017-9\n\n### 借款费用开始资本化的三个条件（三者必须同时满足）\n- **优先级**：★★★\n- **内容**：（教材文本 OCR 损坏，条目标注不含教材定位）借款费用同时满足以下三个条件的，才能开始资本化：①**资产支出已经发生**；②**借款费用已经发生**；③**为使资产达到预定可使用或者可销售状态所必要的购建或者生产活动已经开始**。其中\"资产支出已经发生\"包括**支付现金**、**转移非现金资产**和**承担带息债务**三种形式。\n- **易错**：①**\"承担带息债务\"视同资产支出已经发生**；但企业赊购物资承担的是**不带息债务**的，**不应**将购买价款计入资产支出（偿付前不需承担利息、也未占用借款资金），必须等到**实际偿付债务、发生资源流出**时才能作为资产支出；②\"为使资产达到预定可使用状态的活动已开始\"指的是**实体建造/生产活动已经开始**，仅签订合同、仅购买土地、仅做前期规划**都不算**。\n- **考察**：2016-6、2016-8\n\n### 资本化期间的确定：开始、暂停、停止\n- **优先级**：★★★\n- **内容**：（教材文本 OCR 损坏，条目标注不含教材定位）**资本化期间**是指从借款费用**开始资本化**时点起至**停止资本化**时点止的期间（**暂停资本化期间应予扣除**）。资本化期间内，只有**符合资本化条件的资产**发生的借款费用才可资本化；**不符合资本化条件的期间**（如资产尚未购建、购建活动已停止、非正常中断超过 3 个月）发生的借款费用**计入当期损益（财务费用）**。\n- **易错**：①**资本化期间 ≠ 借款期间**，借款在资产购建前取得或购建完成后仍在存续的，其利息要**分段费用化**；②题目给\"停工期间\"时，必须先判断是**正常中断**还是**非正常中断**，再决定该期间的利息资本化还是费用化（2016-8 的关键就在此）。\n- **考察**：2016-8\n\n### 暂停资本化：非正常中断连续超过 3 个月\n- **优先级**：★★★\n- **内容**：（教材文本 OCR 损坏，条目标注不含教材定位）符合资本化条件的资产的购建或生产活动发生**非正常中断**、且中断时间**连续超过 3 个月**的，应当**暂停借款费用的资本化**。中断期间发生的借款费用**计入当期损益（财务费用）**，直至资产的购建或者生产活动**重新开始**。**正常中断**（如因施工、生产必需的程序或事先可预见的不可抗力导致的中断，如雨季、北方冬季施工、质量安全检查等）**不暂停**资本化。\n- **易错**：①\"**连续超过 3 个月**\"是硬门槛——中断\"累计超过 3 个月\"但每次都不连续的，**不暂停**；②判断\"正常/非正常\"要看**是否属于可预见、必需的工序**：资金短缺、劳务纠纷、安全事故、材料供应不足等属于**非正常中断**；③**暂停期间**汇兑差额的资本化**也一并停止**（2016-8 中汇兑差额 12 万元被拆分为资本化 8 万元、费用化 4 万元，正是这一逻辑）。\n- **考察**：2016-8、2016-9\n\n### 停止资本化：达到预定可使用或可销售状态\n- **优先级**：★★★\n- **内容**：（教材文本 OCR 损坏，条目标注不含教材定位）当**所购建或者生产的符合资本化条件的资产达到预定可使用或者可销售状态**时，应当**停止借款费用的资本化**。此后发生的借款费用**全部计入当期损益**。判断标准是资产的**实体建造/生产工作实质上已经完成**、与设计要求/合同要求相符或基本相符、且继续发生的支出金额很少或几乎不再发生。\n- **易错**：①**\"部分完工、部分停止\"**——如果所购建资产的**各部分分别完工**，且**每部分在其他部分继续建造过程中可供使用或可对外销售**的，应当**在该部分资产达到预定可使用或可销售状态时停止该部分借款费用的资本化**，不能等整个项目全部完工；②如果各部分是**分别完工但必须等到整体完工后才能投入使用或对外销售**的，应**在整个资产整体完工时**停止资本化；③停止资本化后，**在建工程应及时结转固定资产并开始计提折旧**，之后发生的支出不再资本化（2017-9 中把 380 万元错计入在建工程、折旧少提 200 万元，均属此类差错）。\n- **考察**：2017-9\n\n### 专门借款利息资本化金额：实际利息 − 闲置资金利息收入或投资收益\n- **优先级**：★★★\n- **内容**：为购建或者生产符合资本化条件的资产而借入**专门借款**的，应当以**专门借款当期实际发生的利息费用**，**减去**将**尚未动用的借款资金**存入银行取得的**利息收入**或进行**暂时性投资取得的投资收益**后的金额确定资本化金额。**专门借款的资本化金额不与资产支出挂钩**（这是与一般借款最本质的区别）。\n- **计算**：\n  ```\n  专门借款利息资本化金额 = 当期实际发生的专门借款利息费用 − 闲置专门借款资金的利息收入/投资收益\n  当期实际利息 = Σ 各笔专门借款本金 × 利率 × 当期计息期间/全年（注意分段）\n  闲置资金收益 = 未动用金额 × 收益率 × 闲置月数\n  ```\n- **易错**：①**闲置资金的利息收入/投资收益必须扣除**，且**只扣除资本化期间内**的部分；②**扣除额不得超过当期实际利息费用**（否则资本化金额为负数时按 0 处理，多余部分作为财务费用的减项或收益）；③短于一年期间的利率要**按期间折算**（如 7% × 6/12）。\n- **考察**：2016-6、2016-7、2016-8、2016-9\n\n### 一般借款利息资本化金额：累计资产支出加权平均数 × 资本化率\n- **优先级**：★★★\n- **内容**：为购建或者生产符合资本化条件的资产而占用**一般借款**的，应当根据**累计资产支出超过专门借款部分的资产支出加权平均数**乘以**所占用一般借款的资本化率**，计算确定一般借款应予资本化的利息金额。**资本化率应当根据一般借款加权平均利率计算确定。**没有借入专门借款的，直接以**累计资产支出加权平均数**为基础计算。\n- **计算**：\n  ```\n  累计资产支出加权平均数 = Σ [ 每笔资产支出金额 × （该笔支出在资本化期间实际占用的天数/月数 ÷ 当期总天数/月数） ]\n  一般借款资本化率（年）= 所占用一般借款当期实际发生的利息之和 ÷ 所占用一般借款本金加权平均数\n  一般借款利息资本化金额 = 累计资产支出（超过专门借款部分）加权平均数 × 资本化率\n  当期实际一般借款利息费用 = Σ 各笔一般借款本金 × 利率 × 期间\n  ```\n- **易错**：①**公式的分子分母口径要一致**——分子是\"当期实际发生的利息\"，分母是\"本金加权平均数\"（不是简单本金之和）；②**只对超过专门借款部分的资产支出**计算（有专门借款时，专门借款能覆盖的支出不占用一般借款额度）；③资本化金额**不得超过当期相关借款实际发生的利息金额**（上限约束）；④加权平均数的权重用**实际占用期间**，不是\"支出发生月份数\"。例题数据（教材例11-3、11-4）：资本化率 7.67%，2×24 年累计资产支出加权平均数 2 750 万元，资本化金额 210.93 万元；2×24 年实际利息 920 万元（长期借款 120 万元＋债券 800 万元），资本化额未超上限。\n- **考察**：2016-6、2016-8\n\n### 辅助费用的资本化\n- **优先级**：★★\n- **内容**：（教材文本 OCR 损坏，条目标注不含教材定位）**辅助费用**是企业为安排借款而发生的**手续费、佣金**等，属于借款费用。处理原则：**为购建或者生产符合资本化条件的资产而发生的专门借款的辅助费用，在所购建或生产的资产达到预定可使用或可销售状态之前发生的，应当在发生时予以资本化**；**达到预定可使用或可销售状态之后发生的，计入当期损益**；**一般借款的辅助费用，无论是否用于购建符合资本化条件的资产，均于发生当期计入当期损益**。\n- **易错**：①**一般借款的辅助费用一律费用化**（即使该一般借款被用于购建资产）；②辅助费用**按实际发生额**资本化，**不适用\"加权平均数×资本化率\"公式**，也**不扣减闲置资金收益**；③辅助费用金额较小的，也可于发生时直接计入当期损益。\n- **考察**：—\n\n### 外币专门借款汇兑差额的资本化\n- **优先级**：★★★\n- **内容**：在借款费用**资本化期间内**，为购建符合资本化条件的资产而**专门借入的外币借款**所产生的汇兑差额，是购建该资产的一项代价，**应当予以资本化，计入所购建资产的成本**。出于简化核算的考虑，**在资本化期间内，外币专门借款本金及其利息的汇兑差额，均应当予以资本化**；而**除外币专门借款之外的其他外币借款**本金及其利息所产生的汇兑差额，应当作为**财务费用**计入当期损益。\n- **计算**：\n  ```\n  外币借款本金汇兑差额 = 外币本金 × （期末即期汇率 − 期初/上期末即期汇率）\n  外币借款利息汇兑差额 = 外币利息 × （期末即期汇率 − 利息确认日/上期末即期汇率）\n  资本化金额 = 上述两项合计（且限于资本化期间内）\n  ```\n- **易错**：①**外币专门借款本金和利息的汇兑差额都要资本化**，不能只资本化本金部分；②**实际支付利息时**，支付金额与原账面金额之间的差额**仍应继续资本化**（计入在建工程），不能计入财务费用；③资本化期间的**停工（暂停资本化）期间**发生的汇兑差额要**费用化**——判断口径与利息一致；④非专门借款的外币汇兑差额**一律费用化**。\n- **考察**：2016-6、2016-7、2016-8、2016-9\n\n### 借款费用资本化的上限约束\n- **优先级**：★★\n- **内容**：**每一会计期间的利息（含折价或溢价摊销）资本化金额，不应当超过当期相关借款实际发生的利息金额。**\n- **易错**：这是\"兜底条款\"，用于防止资本化金额超过实际利息支出。计算一般借款资本化金额时，若\"累计资产支出加权平均数×资本化率\"大于当期实际利息费用，**只能按实际利息费用资本化**，超出部分不再资本化。\n- **考察**：2016-6、2016-8\n\n### 实务应用：外币专门借款的摊余成本、资本化与费用化划分\n- **优先级**：★★★\n- **内容**：本题库中本章题目全部为**外币专门借款**综合题（发行美元债券专门建造工程），要求一次完成：①按实际利率法计算债券期末**摊余成本**；②计算当期**利息资本化金额**（含折价/溢价摊销额）；③计算**汇兑差额**并划分资本化/费用化；④编制**发行、计付息、收取存款利息、汇兑差额**的全套分录。\n- **易错**：①**票面利息与实际利息分开**——按票面利率计算的利息计入\"应付债券——应计利息\"，与实际利息的差额调整\"应付债券——利息调整\"；②**停工期间**的利息与汇兑差额要**单独切分费用化**；③**在建工程净资本化金额**＝资本化利息 − 计入在建工程的存款利息收益 ＋ 资本化的汇兑差额，三个方向容易颠倒。\n- **考察**：2016-6、2016-7、2016-8、2016-9\n\n## 本章易错陷阱汇总\n\n1. **先判\"专门借款还是一般借款\"**：专门借款公式 = 实际利息 − 闲置资金收益，**不与资产支出挂钩**；一般借款公式 = 累计资产支出（超过专门借款部分）加权平均数 × 资本化率，**必须与资产支出挂钩**。两笔都占用时，**先算专门借款、再算一般借款**，最后相加。\n2. **\"三个条件同时满足\"才可开始资本化**：资产支出已发生（含转移非现金资产、**承担带息债务**；**不含不带息赊购**）、借款费用已发生、购建或生产活动已开始。\n3. **暂停资本化的门槛是\"非正常中断且连续超过 3 个月\"**：正常中断（雨季、冬季施工、必需的质量安全检查）不暂停；资金短缺、劳务纠纷等属非正常中断。\n4. **停止资本化要\"部分完工部分停止\"**：各部分分别完工且可单独使用的，**该部分完工即停止**该部分的资本化；各部分必须整体完工才能使用的，**整体完工时一并停止**。\n5. **资本化金额有上限**：不得超过当期相关借款实际发生的利息金额。\n6. **闲置资金收益只扣资本化期间内的部分**，且专门借款的资本化金额不会因闲置资金收益而变成\"负数资本化\"。\n7. **辅助费用**：专门借款的辅助费用在资产达到预定可使用状态**前**发生→资本化；**之后**发生→费用化；**一般借款的辅助费用一律费用化**。\n8. **汇兑差额**：只资本化**外币专门借款**的本金与利息，且在**资本化期间内**；其他外币借款一律费用化。实际支付利息时账面金额与支付金额的差额**继续资本化**。\n9. **土地使用权是否进资本化基数**：自建厂房→以建造支出（不含土地出让金）为基础；房地产开发企业建造对外出售房屋→**含**土地使用权支出。\n\n## 本章分录模板\n\n```\n【一】专门借款，资本化期间内（按年计息）\n借：在建工程（＝当期实际利息 − 闲置资金利息收入/投资收益）\n    银行存款（收到的闲置资金利息收入或投资收益）\n    贷：长期借款——应计利息 / 应付债券——应计利息（票面利息）\n        长期借款——利息调整 / 应付债券——利息调整（差额，或借方）\n\n【二】占用一般借款（含专门借款不足部分）\n借：在建工程（＝累计资产支出加权平均数 × 资本化率）\n    财务费用（＝当期实际利息总额 − 资本化金额）\n    贷：长期借款——应计利息\n        应付债券——应计利息\n\n【三】外币专门借款的汇兑差额资本化\n借：在建工程（资本化期间内、专门借款的汇兑差额）\n    财务费用（其他外币借款的汇兑差额，或暂停资本化期间的汇兑差额）\n    贷：应付债券（本金及利息的汇兑差额；如为汇兑收益则反向）\n\n【四】实际支付外币借款利息，账面金额与支付金额存在差额\n借：应付债券——应计利息（原账面人民币金额）\n    在建工程（差额，继续资本化）\n    贷：银行存款（实际支付金额按当日汇率折算）\n\n【五】暂停资本化期间 / 停止资本化之后\n借：财务费用（全部利息及汇兑差额）\n    贷：长期借款——应计利息 / 应付债券——应计利息 / 应付债券\n```\n\n## 与其他章的联动\n\n- **与第三章（固定资产）**：自建固定资产成本由建造该项资产达到预定可使用状态前所发生的必要支出构成，**包括应予资本化的借款费用**；停工、完工时点直接决定资本化期间的长短，转固时点决定折旧起点（2017-9）。\n- **与第八章（负债）**：专门借款常表现为长期借款、应付债券，其期末摊余成本、应计利息、利息调整的核算是本章计算的基础（2016-6、2016-7）。\n- **与第十三章（金融工具）**：借款利息费用以**实际利率法**计算确定，债券折价、溢价摊销的金额直接取自金融工具章的摊销表（2016-6）。\n- **与第十四章（租赁）**：承租人确认的**融资费用属于借款费用**，其资本化规则与本章一致。\n- **与第二十二章（外币折算）**：外币专门借款的即期汇率选用、期末折算、汇兑差额的计算口径由外币折算章规范，与本章共同构成本题库全部 4 道计算题的命题框架（2016-6～2016-9）。\n- **与第十六章（所有者权益）**：**权益性融资费用不属于借款费用**，应冲减资本公积（股本溢价），与本章形成\"债性融资费用\"与\"权益性融资费用\"的对比考点。\n",
    "12": "# 第十二章 或有事项\n\n> 本题库考察频次：4 题 ｜ 优先级：C ｜ 建议投入：重点掌握预计负债确认条件、最佳估计数、亏损合同与重组义务（主观题常与第九章职工薪酬合并出题）\n>\n> **教材 OCR 提示**：本章正文段落基本可读，但 OCR 节序号错乱（\"二、保证类质量保证\"\"二、亏损合同\"等出现编号重复与错标），故本清单**不标注节号**，只写考点名，条目标注不含教材定位。相关金额已按算术关系复核后引用（如 360 000 000×(0×80%＋1%×15%＋2%×5%) = 900 000 元；(1 600 000＋2 000 000)÷2 = 1 800 000 元）。\n\n---\n\n## 考点清单\n\n### 或有事项的定义、特征与本章适用范围 ★★\n\n- **内容**：或有事项是指**过去的交易或者事项**形成的，其结果须由某些**未来事项**的发生或不发生才能决定的不确定事项。常见或有事项包括：**未决诉讼或未决仲裁、保证类质量保证（含产品安全保证）、亏损合同、重组义务、弃置义务、环境污染整治、承诺**等。\n- **易错**：本章**适用于所有或有事项**，但下列三类除外：\n  - ①由**职工薪酬、租赁、收入、所得税以及企业合并**等章节规范的或有事项，分别适用相应章节；\n  - ②**待执行合同**不适用本章，但**待执行合同变成亏损合同的，适用本章**亏损合同的规定；\n  - ③适用《企业会计准则第22号——金融工具确认和计量》的**财务担保合同**不适用本章。\n  - 另需记住 PPP 项目合同的特例：社会资本方为使 PPP 项目资产保持一定服务能力或移交前保持使用状态而提供的服务**不构成单项履约义务**的，其预计发生的支出按本章处理。\n- **考察**：—\n\n### 预计负债的三个确认条件（\"很可能\">50%）★★★\n\n- **内容**：同时满足下列三个条件才能确认为预计负债：\n  1. **该义务是企业承担的现时义务**——包括**法定义务**（因合同、法规或司法解释等产生）和**推定义务**（因企业以往习惯做法、已公开的承诺或声明、已公开宣布的政策等而承担的义务，使受影响各方形成企业将履行责任的**合理预期**）；\n  2. **履行该义务很可能导致经济利益流出企业**——即导致经济利益流出的可能性**超过 50%**，但尚未达到基本确定的程度；\n  3. **该义务的金额能够可靠地计量**——即能够合理估计。\n- **计算/分录**：满足三条件时：\n  ```\n  借：管理费用 / 营业外支出 / 销售费用（按或有事项性质确定）\n    贷：预计负债——×××\n  ```\n- **易错**：\n  - ①\"**很可能**\"在本章的定量标准就是**概率 > 50%**（会计上\"基本确定\"通常指 >95%，\"可能\"指 5%~50%，\"极小可能\"指 <5%）——这是数字型考点。\n  - ②**管理层或董事会的决定在资产负债表日并不一定形成推定义务**，除非该决定在资产负债表日之前**已经以相当具体的方式传达给受影响的各方**。\n  - ③对**特定项目**而言经济利益流出的可能性较小，但**包括该项目的该类义务整体**很可能导致经济利益流出的，应视同该项目义务很可能导致经济利益流出（\"总体考虑\"原则，质量保证业务最常用）。\n  - ④资产负债表日后可获得的所有证据、专家意见等，可用于判断资产负债表日是否存在现时义务；判断为**很可能存在**现时义务且符合确认条件的应确认负债；判断为**很可能不存在**的应披露或有负债，除非资源流出的可能性**极小**。\n- **考察**：2017-11、2020-6\n\n### 最佳估计数的确定（三种情形三种算法）★★★\n\n- **内容**：预计负债应当按照履行相关现时义务所需支出的**最佳估计数**进行初始计量。分两种情形三种算法：\n\n| 情形 | 算法 | 典型例子 |\n|---|---|---|\n| 所需支出存在一个**连续范围**（区间），且该范围内各种结果发生的**可能性相同** | 取该范围内的**中间值**（上下限金额的**平均数**） | 赔偿金额在 160 万~200 万元之间的任一金额、可能性大致相同 → 预计负债 = (1 600 000＋2 000 000)÷2 = **1 800 000 元** |\n| 不存在连续范围，或存在连续范围但**各种结果可能性不相同**，且**涉及单个项目** | 按**最可能发生金额**确定 | 一项未决诉讼：败诉可能性 60%，需赔偿 2 000 000 元 → 确认 **2 000 000 元** |\n| 同上，但**涉及多个项目** | 按**各种可能结果及相关概率加权**计算确定 | 保证类质量保证：60 000 件、销售收入 360 000 000 元，80% 不出现问题、15% 较小质量问题（维修费为销售收入的 1%）、5% 较大质量问题（2%） → 确认 = 360 000 000×(0×80%＋1%×15%＋2%×5%) = **900 000 元** |\n\n- **易错**：①\"**涉及单个项目**\"（一项未决诉讼、一项未决仲裁）与\"**涉及多个项目**\"（质量保证下的众多客户）是选择算法的**唯一分水岭**；②估计诉讼相关预计负债时，若判断原告索赔金额经律师辩护后会下降，则预计负债**不仅要考虑预计赔偿给原告的较低金额，还需考虑预计支付给律师的费用**；③诉讼费计入**管理费用**，赔偿支出计入**营业外支出**。\n- **考察**：2019-12\n\n### 预期可获得补偿与计量需考虑的其他因素 ★★\n\n- **内容**：\n  - **预期可获得补偿**：清偿预计负债所需支出全部或部分预期由**第三方或其他方**补偿时，该补偿金额**只有在基本确定能收到时**才能作为**资产单独确认**，且确认的补偿金额**不得超过**所确认负债的账面价值。\n  - **风险和不确定性**：应充分考虑，既不能忽略，也要**避免重复调整**，在低估与高估之间寻找平衡点。\n  - **货币时间价值**：如果确认时点距离实际清偿有较长的时间跨度、货币时间价值影响重大，应当**采用现值计量**（对未来现金流出折现确定最佳估计数）。\n  - **未来事项**：确定最佳估计数时应综合考虑未来事项的影响。\n- **计算/分录**：\n  ```\n  ① 确认预计负债     借：营业外支出等  1 000 000\n                      贷：预计负债       1 000 000\n  ② 基本确定可获补偿 借：其他应收款       400 000\n                      贷：营业外支出等    400 000\n  ```\n- **易错**：\n  - ①**补偿金额必须单独确认为资产，绝不能作为预计负债金额的扣减**（资产和负债不得随意抵销）——典型错误是\"只确认 600 000 元的负债\"（1 000 000−400 000）。\n  - ②确认补偿资产的前提是\"**基本确定**能收到\"（约 >95%），门槛远高于\"很可能\"。\n  - ③折现三点：使用反映货币时间价值的当前市场估计和相关负债特有风险的**税前**利率；风险与不确定性**只能在现金流量或折现率之一中考虑，不能重复反映**；即使现金流量和折现率都不变，预计负债的**现值也会随时间推移逐渐增长**，资产负债表日应**重新计量**预计负债的现值。\n- **考察**：—\n\n### 未决诉讼：账务处理与实际结果差异的四种情形 ★★\n\n- **内容**：未决诉讼是预计负债最常见的应用场景。\n- **计算/分录**（教材示例）：\n  ```\n  借：管理费用——诉讼费                     30 000\n      营业外支出                          1 770 000\n    贷：预计负债——未决诉讼                1 800 000\n  ```\n- **易错**：实际发生的诉讼损失与已计提预计负债之间的差额，必须按四种情形分别处理，这是高频判断题：\n  1. **前期已依据当时实际情况和所掌握的证据合理预计**了预计负债 → 差额**直接计入或冲减当期营业外支出**；\n  2. 前期**原本应当能够合理估计**但所作估计与当时事实**严重不符**（未合理预计损失，或不恰当地多计/少计损失）→ 按**重大会计差错更正**的方法处理；\n  3. 前期**确实无法合理估计**诉讼损失因而**未确认**预计负债 → 在该损失**实际发生的当期**直接计入当期营业外支出；\n  4. **资产负债表日后至财务报告批准报出日之间**发生的需要调整或说明的未决诉讼 → 按《企业会计准则第29号——资产负债表日后事项》处理。\n- **考察**：—\n\n### 保证类质量保证：确认预计负债并计入营业成本 ★★★\n\n- **内容**：**保证类质量保证**通常指销售商或制造商在销售产品或提供劳务后，对客户提供商品或服务的质量符合既定标准的一种承诺，**不构成单项履约义务**。在约定期内（或终身保修），若产品或劳务在正常使用过程中出现质量问题，企业负有更换产品、免费或只收成本价修理等责任。企业应当在符合确认条件的情况下，**于销售成立时确认预计负债**。\n- **计算/分录**：\n  ```\n  （1）计提（按最佳估计数，涉及多个项目，用概率加权）\n      借：主营业务成本（其他业务成本）        900 000\n        贷：预计负债——产品质量保证            900 000\n  （2）实际发生维修费\n      借：预计负债——产品质量保证              850 000\n        贷：银行存款 / 原材料 / 应付职工薪酬等  850 000\n  ```\n  > 科目余额 = 期初余额 30 000＋本期计提 900 000−本期发生 850 000 = **80 000 元**。\n- **易错**：\n  - ①**现行规定（《企业会计准则解释第18号》）要求保证类质量保证形成的预计负债所对应的费用计入\"主营业务成本\"\"其他业务成本\"等营业成本项目**（教材\"列报\"部分亦表述为\"在利润表中作为'营业成本'的组成部分予以反映\"），**不再计入\"销售费用\"**——旧口径为\"销售费用/主营业务成本\"，做老题时注意口径。\n  - ②**实际发生额与预计数相差较大时，应及时调整预计比例**。\n  - ③针对**特定批次**产品确认预计负债的，保修期结束时应将\"预计负债——产品质量保证\"科目余额**冲销、不留余额**，同时冲减\"主营业务成本\"等科目。\n  - ④已确认预计负债的产品**不再生产**的，应在相应产品质量保证期满后将科目余额**冲销、不留余额**。\n- **考察**：—\n\n### 服务类质量保证：属于单项履约义务（与保证类的分界）★\n\n- **内容**：如果企业提供的质量保证**除保证产品符合既定标准之外还提供了一项单独的服务**（如可单独购买、单独定价的延保服务），则该质量保证**构成单项履约义务**，应当按照《企业会计准则第14号——收入》分摊交易价格并在服务期间确认收入，**不作为或有事项计提预计负债**。\n- **易错**：**判断标准是\"是否构成单项履约义务\"**——不构成单项履约义务的**保证类**质量保证走本章（或有事项、计提预计负债）；构成单项履约义务的**服务类**质量保证走收入准则（分摊交易价格、递延确认收入）。命题人常在题干里放一个\"可以单独购买、单独标价的延长保修\"，考你识别这是服务类而非保证类。\n- **考察**：—\n\n### 亏损合同：待执行合同变为亏损合同的处理 ★★★\n\n- **内容**：\n  - **待执行合同**是指合同各方**未履行任何合同义务**，或**部分履行了同等义务**的合同。待执行合同**本身不属于或有事项**，但**待执行合同变为亏损合同的，应当作为或有事项**处理。\n  - **亏损合同**是指履行合同义务**不可避免会发生的成本超过预期经济利益**的合同。其中\"履行合同义务不可避免会发生的成本\"应当反映**退出该合同的最低净成本**，即「**履行该合同的成本**」与「**未能履行该合同而发生的补偿或处罚（违约金）**」**两者中的较低者**。\n- **计算/分录**：\n  - **原则一（能否撤销）**：与亏损合同相关的义务**不需支付任何补偿即可撤销**的 → 通常**不存在现时义务，不应确认预计负债**；义务**不可撤销**的 → 存在现时义务，同时满足\"很可能流出＋金额能可靠计量\"的才确认预计负债。\n  - **原则二（有无标的资产）**：合同**存在用于履行合同的资产（标的资产）**的，应当**先对标的资产进行减值测试并确认减值损失**，此时**不再确认预计负债**；**预计亏损超过该减值损失**的，再将**超过部分**确认为预计负债。\n  ```\n  （1）存在标的资产，总亏损 X、标的资产可变现净值较成本低 Y（Y < X）\n       借：资产减值损失（存货跌价准备等）    Y\n         贷：存货跌价准备等                  Y\n       借：营业外支出                        X−Y\n         贷：预计负债                        X−Y\n  （2）不存在标的资产（或已履行完毕）\n       借：营业外支出                         X\n         贷：预计负债                         X\n  ```\n- **易错**：\n  - ①**先减值、后预计负债**，且预计负债只确认**超过减值损失的部分**；**总亏损额不变，只是科目归属不同**（资产减值损失 vs 营业外支出）——这正是 2016-2 的考点（预计负债由 10 万元更正为 1 万元、营业外支出由 10 万元更正为 1 万元、补提存货跌价准备 9 万元，存货账面净额 99 万元不变）。\n  - ②计量应当取「履行成本」与「违约金」的**较低者**。教材示例：甲公司以每吨 1 500 元采购 2 万吨煤炭，因环保法规无法使用，转售第二方每吨 1 400 元（每吨亏 100 元，共亏 200 万元）；若撤销合同需支付合同总价款 10% 的违约金（300 万元）。**较低者为 200 万元**，故按 200 万元确认预计负债。\n  - ③**不可撤销的租赁合同**在租赁期开始日之前成为亏损合同的，按本章亏损合同处理；**自租赁期开始日起**按《企业会计准则第21号——租赁》处理（与第十四章联动）。\n  - ④亏损合同**不确认\"合同预计损失\"以外的任何资产**，也不确认收入。\n- **考察**：2016-2、2019-12\n\n### 重组义务：确认条件与\"直接支出\"的计量口径 ★★★\n\n- **内容**：\n  - **重组**是指企业制定和控制的，将**显著改变企业组织形式、经营范围或经营方式**的计划实施行为。属于重组的事项主要包括：**①出售或终止企业的部分业务；②对企业的组织结构进行较大调整；③关闭企业的部分营业场所，或将营业活动由一个国家或地区迁移到其他国家或地区。**\n  - **确认条件（两步走）**：首先要**同时存在**下列情况，才表明企业承担了重组义务——**①有详细、正式的重组计划**（包括重组涉及的业务、主要地点、需要补偿的职工人数、预计重组支出、计划实施时间等）；**②该重组计划已对外公告**。其次，还要判断重组义务是否**同时满足预计负债的三个确认条件**（现时义务＋很可能流出＋金额能可靠计量），只有同时满足才能确认为预计负债。\n- **计算/分录**：**企业应当按照与重组有关的直接支出确定预计负债金额，计入当期损益。**\n  ```\n  借：管理费用（辞退福利部分） / 营业外支出等\n    贷：应付职工薪酬（辞退福利） / 预计负债\n  ```\n- **易错（本章最爱考的一张判断表）**：\n\n| 支出项目 | 是否属于与重组有关的直接支出 |\n|---|---|\n| 自愿遣散 | **包括** |\n| 强制遣散（如果自愿遣散目标未满足） | **包括** |\n| 将不再使用的厂房的租赁撤销费 | **包括** |\n| 将职工和设备从拟关闭的工厂转移到继续使用的工厂 | **不包括**（支出与继续进行的活动相关） |\n| 对剩余开分销网络的投资 | **不包括**（与继续进行的活动相关） |\n| 重组的未来可辨认经营损失（最新预计值） | **不包括** |\n| 特定不动产、广场和设备的减值损失 | **不包括**（应按《企业会计准则第8号——资产减值》评估，作为资产的抵减项） |\n\n- **核心口诀**：**直接支出 = 企业重组必须承担的、与主体继续进行的活动无关的支出**；**不包括留用职工岗前培训、市场推广、新系统和营销网络投入等支出**（因为这些支出与**未来经营活动**有关，在资产负债表日**不是重组义务**）。\n- **另一条硬规则**：**企业在计量预计负债时不应当考虑预期处置相关资产的利得或损失**。教材示例：企业转让某球场（转让价格 5 亿元、账面价值 1 亿元），因关闭球场预计支付给球会会员赔偿金约 2 亿元——应当在赔偿金满足确认条件时**确认预计负债 2 亿元**，在球场**控制权转移时**单独确认 **4 亿元的资产处置损益**，二者**不得相互抵销**。\n- **另外要区分**：**重组 ≠ 企业合并 ≠ 债务重组**。重组是企业内部资源的调整和组合、谋求现有资产效能最大化；企业合并是将两个或两个以上单独的企业合并形成一个报告主体；债务重组是在不改变交易对手方的前提下重新达成清偿协议。\n- **考察**：2017-11、2020-6\n\n### 或有事项的列报与披露（预计负债列示、或有负债、或有资产）★★\n\n- **内容**：\n  - **预计负债的列报**：在资产负债表中应当**单独列示预计负债**，与其他负债项目区别开来；按预计负债的**种类、形成原因以及经济利益预期流出时间的长短**，根据总账和明细账余额分析填列。\n    - 期限在**一年或一个营业周期以内**的预计负债 → 在\"**其他流动负债**\"项目列报；\n    - 其他预计负债 → 在非流动负债中的\"**预计负债**\"项目列报；\n    - 将于**一年内到期**的\"预计负债\" → 重分类至\"**一年内到期的非流动负债**\"；\n    - 期限在**一年或一个营业周期以上**的**保证类质量保证**形成的预计负债：预计在未来一年或一个营业周期以内清偿的部分计入**流动负债**（列\"一年内到期的非流动负债\"），其余计入非流动负债（列\"预计负债\"）；如果**不能合理估计**未来一年内清偿的金额，则**全部计入流动负债**，列\"其他流动负债\"。\n  - **费用的列报**：确认预计负债同时确认的支出或费用在利润表中**不单列项目**，而与其他费用或支出合并反映（如保证类质量保证确认的费用作为\"**营业成本**\"组成部分；因对外提供担保、未决诉讼、重组义务确认的费用作为\"**营业外支出**\"\"**管理费用**\"等组成部分）。\n  - **附注披露**：①预计负债的种类、形成原因以及经济利益流出不确定性的说明；②各类预计负债的期初、期末余额和本期变动情况；③或有负债的种类、形成原因及经济利益流出不确定性的说明等。**在涉及未决诉讼、未决仲裁时，若披露全部或部分信息预期对企业造成重大不利影响，企业无须披露这些信息，但应当披露该未决诉讼、未决仲裁的性质，以及未披露该信息的事实和原因。**\n  - **或有资产**：或有资产作为一种**潜在资产，不符合资产确认条件，不予确认**。企业通常不应当披露或有资产，但**或有资产很可能会给企业带来经济利益的**，应当披露其形成的原因、预计产生的财务影响等。\n- **易错**：\n  - ①**或有资产\"不确认、只有很可能时才披露\"**；即使是\"基本确定\"能收到的、作为预计负债补偿的资产，也只是**单独确认资产**，不是确认或有资产。\n  - ②\"不能合理估计未来一年内清偿金额则全部计入流动负债\"这条细节最容易漏。\n- **考察**：—\n\n---\n\n## 本章易错陷阱汇总\n\n1. **把\"很可能\"当定性词而忘记 >50% 的定量标准**：教材明确\"很可能\"= 导致经济利益流出的可能性**超过 50%**，但尚未达到**基本确定**的程度。概率区间的定量参照（实务中通行的量化参考，非准则原文）：基本确定 ≈ 95% 以上，很可能 = 50%~95%，可能 = 5%~50%，极小可能 = 5% 以下。**\"基本确定\"是预期可获得补偿单独确认资产的门槛，远高于\"很可能\"。**\n2. **把补偿金额直接抵减预计负债**：补偿**基本确定**能收到时**单独确认为资产**（其他应收款），**不得超过**所确认负债的账面价值，**绝不能**按净额只确认一个负债。\n3. **最佳估计数算法选错**：先判断\"是否是连续范围且可能性相同\"→ 是则取**中间值**；否则再看\"单个项目\"（取**最可能值**）还是\"多个项目\"（**概率加权**）。\n4. **忘记总体考虑原则**：单个项目流出可能性小，但该类义务整体很可能流出的，**视同**该项目很可能导致经济利益流出。\n5. **亏损合同忘记先做标的资产减值**：存在标的资产时**先计提减值**，预计负债只确认**超过减值损失的部分**；总亏损不变，只是科目在\"资产减值损失\"与\"营业外支出\"之间分配（2016-2、2019-12）。\n6. **亏损合同计量不看违约金**：必须取「履行合同的成本」与「未能履行的补偿或处罚」**两者较低者**（可撤销的合同通常不存在现时义务、不确认预计负债）。\n7. **重组义务把\"与未来经营活动有关\"的支出算进直接支出**：留用职工**岗前培训**、**市场推广**、**新系统和营销网络投入**，以及将职工和设备转移至继续使用工厂的支出、对剩余分销网络的投资，**一律不包括**。\n8. **重组义务把处置资产的利得或损失与预计负债混算**：赔偿金单独确认预计负债，处置资产的损益在**丧失控制权时**单独确认，二者不得抵销。\n9. **重组义务漏掉\"已对外公告\"**：只有详细、正式的重组计划而**未对外公告**，或决定未传达到受影响各方的，企业**尚未承担重组义务**，不应确认预计负债。\n10. **服务类质量保证按或有事项处理**：构成**单项履约义务**的服务类质量保证应按第14号收入分摊交易价格、递延确认收入，**不计提预计负债**；只有**保证类**质量保证才走本章。\n11. **产品质量保证费用错记\"销售费用\"**：现行规定计入**营业成本**（主营业务成本/其他业务成本）；保修期满或产品停产后应将科目余额**冲销、不留余额**。\n12. **或有资产予以确认**：或有资产**一律不确认**，只在**很可能**给企业带来经济利益时披露。\n13. **预计负债列报细节**：一年内到期的要重分类到\"一年内到期的非流动负债\"；长期保证类质量保证**不能合理估计**一年内清偿金额时**全部计入流动负债**。\n\n## 本章分录模板（如适用）\n\n**（一）未决诉讼**\n\n```\n借：管理费用——诉讼费                    （诉讼费）\n    营业外支出                          （预计赔偿金额）\n  贷：预计负债——未决诉讼                （合计最佳估计数）\n```\n\n**（二）保证类产品质量保证**\n\n```\n计提：  借：主营业务成本 / 其他业务成本\n          贷：预计负债——产品质量保证\n\n发生：  借：预计负债——产品质量保证\n          贷：银行存款 / 原材料 / 应付职工薪酬等\n\n保修期满 / 产品停产冲销余额：\n        借：预计负债——产品质量保证\n          贷：主营业务成本 / 其他业务成本\n```\n\n**（三）亏损合同**\n\n```\n存在标的资产：\n  借：资产减值损失                        （标的资产减值额）\n    贷：存货跌价准备 / 固定资产减值准备等\n  借：营业外支出                          （预计亏损超过减值损失的部分）\n    贷：预计负债\n\n不存在标的资产：\n  借：营业外支出                          （最低净成本）\n    贷：预计负债\n```\n\n**（四）重组义务**\n\n```\n借：管理费用（辞退福利部分）              （自愿遣散、强制遣散中属于辞退福利的部分）\n    营业外支出（其他直接支出）\n  贷：应付职工薪酬（辞退福利）\n      预计负债                            （不再使用厂房的租赁撤销费等直接支出）\n```\n> 注意：与重组有关的**自愿遣散、强制遣散**在实务中多通过\"**应付职工薪酬——辞退福利**\"核算（联动第九章职工薪酬），只有**不通过职工薪酬核算的其他直接支出**（如不再使用厂房的租赁撤销费）才计入\"预计负债\"。\n\n**（五）预期可获得第三方补偿**\n\n```\n借：其他应收款                            （基本确定能收到的金额，≤ 预计负债账面价值）\n  贷：营业外支出（或相关费用科目）\n```\n\n## 与其他章的联动\n\n- 与**第九章 职工薪酬**：重组义务中的**自愿遣散、强制遣散**属于**辞退福利**，通过\"应付职工薪酬\"核算；预计负债则用于核算其他直接支出（如不再使用厂房的租赁撤销费）。2020-6、2017-11 就是把两章合并出题（辞退福利负债 208 万元，同时冲回应付职工薪酬、预计负债与管理费用）。\n- 与**第二章 存货**：亏损合同的**标的资产减值**直接考存货跌价准备的计提（2016-2、2019-12 均涉及\"补提/冲回存货跌价准备\"与\"预计负债\"的重分类）。\n- 与**第十四章 租赁**：不可撤销的租赁合同在**租赁期开始日之前**成为亏损合同的，按本章处理；**自租赁期开始日起**改按第21号租赁准则处理。\n- 与**第十七章 收入、费用和利润**：服务类质量保证属于**单项履约义务**，按收入准则分摊交易价格并递延确认收入；保证类质量保证不构成单项履约义务，按本章计提预计负债。\n- 与**第二十五章 资产负债表日后事项**：**资产负债表日后至财务报告批准报出日之间**发生的需要调整或说明的未决诉讼，按第29号资产负债表日后事项处理（很可能属于**调整事项**——法院判决为资产负债表日已存在的现时义务提供了进一步证据）。\n- 与**第七章 资产减值**：重组义务中涉及的**特定不动产、厂房和设备的减值损失**不属于重组直接支出，应按第8号资产减值准则单独评估并作为**资产的抵减项**。\n- 与**第二十三章 财务报告**：预计负债在资产负债表中的**流动/非流动划分与重分类**规则（一年内到期的重分类、长期保证类质量保证不能合理估计时全额计入流动负债）。\n",
    "13": "# 第十三章 金融工具与保险合同\n\n> 本题库考察频次：13 题 ｜ 优先级：B（接近 A） ｜ 建议投入：精读+默写分录\n\n> 定位提示：教材目录 OCR 处该章标题被识别为「第十二章 金融工具与保险合同」（第一节金融工具概述、第二节金融资产和金融负债的分类和重分类、第三节金融负债和权益工具的区分、第四节金融工具的确认和计量、第五节金融资产转移、第六节套期会计、第七节金融工具的披露、第八节保险合同概述）。本题库与本书统一按「第十三章」编号。教材正文的节标题层在 OCR 中大量丢失，以下条目标注节名仅以目录可辨者为限，不标注页码。\n\n---\n\n### 考点1　金融资产三分类的判断标准（分类总框架）\n- **优先级**：★★★\n- **内容**：企业应当根据其管理金融资产的**业务模式**和金融资产的**合同现金流量特征**，将金融资产分为三类：①以摊余成本计量；②以公允价值计量且其变动计入其他综合收益（FVOCI）；③以公允价值计量且其变动计入当期损益（FVTPL）。只有**同时**通过「业务模式测试（以收取合同现金流量为目标）」和「合同现金流量特征测试（本金加利息）」的债权类资产，才能分类为摊余成本计量；同时通过「既收取合同现金流量又出售」业务模式测试＋合同现金流量特征测试的，分类为 FVOCI；其余一律为 FVTPL（**兜底类别**）。\n- **记忆口诀**：先看业务模式 → 再看合同现金流量特征 → 两个都过硬 = 摊余成本；模式「两者兼有」+ 特征过硬 = FVOCI 债权；其余全部 FVTPL。\n- **易错**：把「三分类」当成企业自主选择；实际上前两类是**条件满足即必须如此分类**，不是可选政策；FVOCI 权益工具则是**不可撤销的指定**（见考点8）。\n- **考察**：2016-3、2020-10\n\n### 考点2　业务模式测试（Business Model Test）\n- **优先级**：★★\n- **内容**：业务模式是指企业**如何管理金融资产以产生现金流量**，其判断目标是现金流量来源是「收取合同现金流量」「出售金融资产」还是「两者兼有」。关键点：①应在**金融资产组合层次**（而非单项工具层次）确定；②同一企业可以同时存在**多个业务模式**；③以收取合同现金流量为目标**并不要求持有至到期**，出售本身不否定该业务模式（只要出售不是为获取资本利得、且频率与金额不重大）；④业务模式的变更属于**极少数情形**，且必须由企业高级管理层决定、对经营有重大影响、可向外部方证实。\n- **易错**：把单项资产的出售行为直接推定为「出售型业务模式」；把「发生过出售」等同于「业务模式改变」。\n- **考察**：—\n\n### 考点3　合同现金流量特征测试（本金加利息 / SPPI）\n- **优先级**：★★\n- **内容**：合同条款规定，在特定日期产生的现金流量**仅为对本金和以未偿付本金金额为基础的利息的支付**（本金＋利息）。利息包括对货币时间价值、信用风险、其他基本借款风险与成本、利润率的对价。基准利率由「贷款基准利率」调整为「贷款市场报价利率（LPR）」的，**不视为**改变合同现金流量特征，除非存在其他导致不符合本金加利息特征的因素。\n- **易错**：**股票永远不通过该测试**——股利和清算剩余权益均不符合本金、利息的定义，所以股票（非交易性权益工具除外）只能是 FVTPL 或指定为 FVOCI，**不可能**分类为摊余成本或 FVOCI 债权。\n- **考察**：2016-3\n\n### 考点4　金融资产与金融负债的初始计量及交易费用\n- **优先级**：★★★\n- **内容**：初始确认一律按**公允价值**计量。交易费用（可直接归属于购买、发行或处置金融工具的**增量费用**）的处理分两路：①**FVTPL** 的金融资产/负债 → 交易费用**直接计入当期损益**（投资收益/公允价值变动损益）；②**其他类别**（摊余成本、FVOCI）→ 交易费用**计入初始确认金额**。应收账款未包含重大融资成分或不考虑不超过一年合同中的融资成分的，按**交易价格**初始计量。\n- **分录**：\n  - 债权投资：`借：债权投资——成本（面值）／——利息调整（差额，含交易费用）／——应计利息　贷：银行存款`\n  - 交易性金融资产：`借：交易性金融资产——成本（公允价值）　投资收益（交易费用）　贷：银行存款`\n- **易错**：把交易性金融资产的交易费用计入成本；把「已到付息期但尚未领取的利息」计入成本（应作为**应收利息**单独确认）。\n- **考察**：2020-10、2021-1\n\n### 考点5　实际利率法与摊余成本\n- **优先级**：★★★\n- **内容**：**实际利率**＝将金融资产/负债在**预计存续期**的估计未来现金流量，折现为该金融资产账面余额（不考虑减值）或该金融负债摊余成本所使用的利率。确定时应考虑所有合同条款（提前还款、展期、看涨期权等）**但不考虑预期信用损失**。**摊余成本**＝初始确认金额 − 已偿还本金 ± 采用实际利率法将初始确认金额与到期日金额之间差额摊销形成的累计摊销额 − 已计提的累计信用减值准备（仅金融资产）。\n- **计算（溢折价摊销表）**：`当期利息收入＝期初摊余成本×实际利率`；`当期溢折价摊销额＝票面利息－实际利息`（溢价则相反）。\n- **修改或重新议定合同但未终止确认**：按**原实际利率**折现重新计算账面余额，差额计入当期损益；相关成本费用调整账面价值并在剩余期间摊销。\n- **易错**：用票面利率算利息收入；在确定实际利率时扣除预期信用损失；合同修改后改用市场利率折现。\n- **考察**：2018-19、2022-6\n\n### 考点6　以摊余成本计量的金融资产（债权投资）\n- **优先级**：★★★\n- **内容**：后续按**摊余成本**计量；利得或损失在**终止确认、重分类、按实际利率法摊销或确认减值**时计入当期损益。分期付息与到期一次还本付息的核算差别在于：分期付息用「债权投资——应计利息」还是「应收利息」的科目选择（一次还本付息计入**应计利息**明细，分期付息单独确认**应收利息**）。\n- **分录（处置）**：`借：银行存款　债权投资减值准备　贷：债权投资——成本／——利息调整／——应计利息　投资收益（差额，可借可贷）`\n- **易错**：到期一次还本付息债券的溢折价摊销表要用**复利现值**口径；提前收回部分本金的，要按收回比例先调整账面余额再继续摊销。\n- **考察**：2016-6、2022-6\n\n### 考点7　分类为 FVOCI 的债权投资（其他债权投资）\n- **优先级**：★★\n- **内容**：按**公允价值**后续计量，公允价值变动计入**其他综合收益**，直至该资产终止确认或被重分类；但**按实际利率法计算的利息、减值损失或利得、汇兑损益**仍计入**当期损益**。该类资产计入各期损益的金额，应当与视同其一直按摊余成本计量而计入各期损益的金额**相等**（这是\"利息进损益、公允价值变动进 OCI\"的理论依据）。\n- **分录（处置）**：`借：银行存款　其他债权投资——公允价值变动（或贷）　贷：其他债权投资——成本／——应计利息　投资收益`，同时 `借：其他综合收益　贷：投资收益`（**转损益**）。\n- **易错**：把公允价值变动也计入当期损益；处置时**忘记**把累计其他综合收益转入投资收益。\n- **考察**：2020-10\n\n### 考点8　指定为 FVOCI 的非交易性权益工具投资（其他权益工具投资）★本章最大陷阱★\n- **优先级**：★★★\n- **内容**：**仅限非交易性权益工具投资**，企业可在初始确认时作出**不可撤销**的指定，将其公允价值变动计入其他综合收益。该指定**不得撤销**，且该金融资产**不能**再重分类。**处置时**：之前计入其他综合收益的累计利得或损失应当从其他综合收益中转出，计入**留存收益（盈余公积、未分配利润）**，**不得转入当期损益**。\n- **分录（处置）**：\n  ```\n  借：银行存款\n    贷：其他权益工具投资——成本\n                     ——公允价值变动（或借方）\n        盈余公积／利润分配——未分配利润（差额，即原 OCI 转出）\n  借：其他综合收益\n    贷：盈余公积／利润分配——未分配利润\n  ```\n- **易错**：处置时把 OCI 转「投资收益」——这是最经典的错项；把交易性股票也指定为 FVOCI；把该指定当成可撤销。\n- **考察**：2019-14、2018-3\n\n### 考点9　以公允价值计量且其变动计入当期损益的金融资产（FVTPL）\n- **优先级**：★★★\n- **内容**：后续按公允价值计量，公允价值变动计入**公允价值变动损益**（期末不结转，处置时**不把**公允价值变动损益转入投资收益）；持有期间宣告的现金股利/利息计入**投资收益**（股利确认需同时满足：收取股利的权利已确立、经济利益很可能流入、金额能可靠计量）。处置时售价与**账面价值**的差额计入投资收益。\n- **分录（处置）**：`借：银行存款　贷：交易性金融资产——成本／——公允价值变动　投资收益（差额）`（**不再**做\"借：公允价值变动损益 贷：投资收益\"）\n- **易错**：照搬旧准则把公允价值变动损益结转到投资收益；把交易费用计入成本。\n- **考察**：2016-3、2018-13\n\n### 考点10　金融工具减值——预期信用损失法基础\n- **优先级**：★★\n- **内容**：减值准备的计提**不以减值的实际发生为前提**，而是以未来可能的违约事件造成的损失的**期望值**计量。适用范围：①以摊余成本计量的金融资产；②FVOCI 的金融资产；③租赁应收款；④合同资产；⑤部分贷款承诺和财务担保合同。**预期信用损失**＝以发生违约的风险为权重的金融工具信用损失的**加权平均值**；**信用损失**＝按**原实际利率**折现的、根据合同应收的所有合同现金流量与预期收取的所有现金流量之间的差额。预计存续期无法可靠估计的，基于**剩余合同期间**计算。计量最长期限为**面临信用风险的最长合同期限**（含续约选择权）。\n- **易错**：用**市场利率**折现预期信用损失（2018-19 就是此错）；认为全款可收回就没有信用损失（收款时间晚于合同到期日也会产生）。\n- **考察**：2018-19\n\n### 考点11　预期信用损失三阶段模型（含利息收入计算基础）★必背★\n- **优先级**：★★★\n- **内容**：除购买或源生时已发生信用减值的金融资产、以及应收款项/合同资产/租赁应收款外，每个资产负债表日评估信用风险自初始确认后是否**显著增加**，据此分三阶段：\n\n  | 阶段 | 情形 | 损失准备计量 | 利息收入的计算基础 |\n  |---|---|---|---|\n  | 第一阶段 | 信用风险自初始确认后**未显著增加** | **未来 12 个月**的预期信用损失 | **账面余额**（未扣减值准备）×实际利率 |\n  | 第二阶段 | 信用风险自初始确认后**已显著增加但尚未发生信用减值** | **整个存续期**的预期信用损失 | **账面余额**×实际利率 |\n  | 第三阶段 | 初始确认后**已发生信用减值** | **整个存续期**的预期信用损失 | **摊余成本**（账面余额−已计提减值准备，即账面价值）×实际利率 |\n  | 购买或源生已发生信用减值 | — | 仅将初始确认后**整个存续期预期信用损失的变动**确认为损失准备 | **摊余成本**×**经信用调整的实际利率** |\n- **易错**：三阶段利息收入基础混淆——**只有第三阶段（及购买/源生已减值）才用摊余成本**，第一、二阶段都用账面余额（**不减**减值准备）；同时**折现率始终是初始确认时的原实际利率**，减值后也不改成市场利率。\n- **考察**：2018-19\n\n### 考点12　减值的特殊情形与账务处理\n- **优先级**：★★\n- **内容**：①**较低信用风险**的金融工具，可不与初始确认时比较信用风险，直接按未来 12 个月预期信用损失计量；②**应收款项、合同资产、租赁应收款**（不含重大融资成分或按简化处理的），**始终**按整个存续期预期信用损失计量（不区分三阶段）；③减值损失借记「信用减值损失」（合同资产计提的用「资产减值损失」），贷记「贷款损失准备」「债权投资减值准备」「坏账准备」「合同资产减值准备」「租赁应收款减值准备」「预计负债」「**其他综合收益——信用减值准备**」（用于 FVOCI 债权类资产）。预期信用损失小于当期减值准备账面金额的，差额确认为**减值利得**，作相反分录。\n- **易错**：FVOCI 债权类资产的减值贷方记「其他债权投资减值准备」，正确做法是贷记**其他综合收益**（因为该资产本身按公允价值计量）；已计提的减值**可以转回**（与固定资产、无形资产减值不得转回不同）。\n- **考察**：2018-19\n\n### 考点13　金融资产转移与终止确认\n- **优先级**：★★\n- **内容**：终止确认的判断路径：①**是否转移了收取金融资产现金流量的合同权利**（合法出售或权利合法转移，如票据背书转让、商业票据贴现）；②若是，再看是否**转移了金融资产所有权上几乎所有风险和报酬**（通常考虑利率风险、信用风险、外汇风险、逾期未付风险、提前偿付风险、权益价格风险等）——**转移了**则终止确认；③**保留了**则继续确认；④**既没有转移也没有保留**几乎所有风险和报酬的，看是否**保留了对该金融资产的控制**：未保留控制 → 终止确认；保留控制 → 按**继续涉入**程度确认资产和负债。金融资产**部分转移**且满足终止确认条件的，按转移日各自的**相对公允价值**分摊账面价值。\n- **易错**：看到「已出售、已贴现」就一律终止确认（附追索权的贴现、回购协议往往不满足终止确认）；把「法定所有权转移」当作终止确认的充分条件。\n- **考察**：—\n\n### 考点14　继续涉入与不符合终止确认条件的转移\n- **优先级**：★\n- **内容**：企业仍保留被转移金融资产几乎所有风险和报酬的（如附回购协议的卖出回购、全额补偿信用损失的出售），**不终止确认**，收到的对价确认为**金融负债**（如「卖出回购金融资产款」），并按实际利率法确认利息费用。继续涉入形成的资产，其账面价值按**继续涉入程度**确定，且不得超过转移资产的公允价值。\n- **分录（卖出回购）**：`借：银行存款　贷：卖出回购金融资产款`；`借：利息支出　贷：卖出回购金融资产款`\n- **考察**：—\n\n### 考点15　金融负债与权益工具的区分（总原则）\n- **优先级**：★★★\n- **内容**：区分依据是**合同条款所反映的经济实质**，而非仅以法律形式、监管规定或工具名称为依据。**金融负债**：包括（1）向其他方交付现金或其他金融资产的合同义务；（2）在潜在不利条件下与其他方交换金融资产或金融负债的合同义务；（3）将来须用或可用**自身权益工具**结算的**非衍生工具**合同，且企业将交付**可变数量**的自身权益工具；（4）将来须用或可用自身权益工具结算的**衍生工具**合同（**固定换固定**除外）。**权益工具**：同时满足（1）**不包含**交付现金或其他金融资产、或在潜在不利条件下交换金融资产/负债的**合同义务**；（2）将来须用或可用自身权益工具结算时，非衍生工具**不含**交付可变数量自身权益工具的合同义务，衍生工具只能通过**固定数量的自身权益工具交换固定金额的现金**或其他金融资产结算。\n- **判断不受影响的因素**（易考）：①以前实施分配的情况；②未来实施分配的意向；③不发股利对普通股股价的负面影响；④未分配利润等可供分配权益的金额；⑤对一段期间损益的预期；⑥是否有能力影响当期损益。→ **\"股利制动机制\"\"股利推动机制\"本身不足以把优先股判为金融负债**，只要发行方能自主决定普通股股利的支付。\n- **考察**：2019-13\n\n### 考点16　「固定换固定」原则与基于自身权益工具的衍生工具\n- **优先级**：★★★\n- **内容**：衍生工具若发行方**只能通过以固定数量的自身权益工具交换固定金额的现金或其他金融资产**进行结算，则为**权益工具**；若以固定数量换可变金额、以可变数量换固定金额、或以可变数量换可变金额，则为**衍生金融负债或衍生金融资产**。**结算方式决定分类**：现金净额结算 → 金融负债；普通股净额结算 → 金融负债；**普通股总额结算 → 权益工具**。\n- **分录对比**（发行以自身普通股为标的的看涨期权）：\n  - 现金净额/普通股净额结算：`借：银行存款　贷：衍生工具——看涨期权`；期末公允价值变动计入**公允价值变动损益**。\n  - 普通股总额结算：`借：银行存款　贷：其他权益工具`；**后续不再就公允价值变动做任何账务处理**；行权时 `借：银行存款／其他权益工具　贷：股本／资本公积——股本溢价`。\n- **反稀释调整**：转股价因股份拆分、配股、转增、增发、发放现金股利等作「反稀释」调整，若调整公式能使稀释事件前后每份工具代表的剩余利益与每份普通股的比例**保持不变**，则仍视为满足固定换固定。\n- **易错**：把普通股总额结算的期权确认为「衍生工具」；对权益工具类期权期末确认公允价值变动。\n- **考察**：2019-13\n\n### 考点17　或有结算条款、清算顺序与特殊金融工具\n- **优先级**：★★\n- **内容**：①**或有结算条款**：如果合同要求只有在发生了**极端罕见、显著异常且几乎不可能发生**的事件时才以现金或其他导致该工具成为金融负债的方式结算，可视为**不具有可能性的条款**，不影响权益工具的分类。②**清算顺序**：合同规定发行方清算时该工具**劣后于**普通债券和其他债务的，通常表明**没有**交付现金的合同义务（→权益）；与其他普通债券和债务**同顺位**的，通常表明有（→负债）。③**可回售工具**与**仅在清算时才有义务按比例交付净资产的金融工具**，满足「赋予清算时按比例获得净资产的权利＋类别次于其他所有工具类别＋发行方对该类别所有工具承担按比例交付净资产的同等合同义务」三项特征的，分类为**权益工具**，但需排除同时具备特定特征的其他工具或合同。\n- **易错**：把\"清算时劣后\"理解成\"有清偿义务\"；忽略\"极端罕见\"的例外门槛。\n- **考察**：—\n\n### 考点18　永续债发行方的会计分类（到期日／清偿顺序／利率跳升）\n- **优先级**：★★★\n- **内容**：发行方应当以**合同到期日等条款内含的经济实质**为基础，谨慎判断能否**无条件地避免**交付现金或其他金融资产的合同义务。三个必须逐一检查的条款：\n  1. **到期日**：合同明确规定无固定到期日且持有方在任何情况下均无权要求赎回 → 无交付义务；有固定期限但发行方**有权无限期递延** → 无交付义务；规定了未来赎回时间且**发行方不能无条件递延** → 构成交付义务（→负债）。\n  2. **清偿顺序**：劣后于普通债券和其他债务 → 通常**无**交付义务；同顺位 → 通常**有**。\n  3. **利率跳升与间接义务**：有固定到期日＋未来赎回时间＋发行方有权自主决定是否赎回＋不赎回则票息率上浮的，须判断跳升是否构成**间接义务**。**若跳升次数有限、有最高票息限制（封顶）且封顶利率未超过同期同行业同类型工具平均利率水平，或跳升总幅度较小且封顶利率未超过该平均水平，则该利率跳升不构成交付现金的合同义务**。\n- **易错**：看到\"永续债\"就默认是权益；看到有利率跳升就直接判为负债（**必须比较封顶利率与同期同行业同类型工具平均利率**）；把\"多年来一直支付股利\"当作有支付义务。\n- **考察**：—\n\n### 考点19　复合金融工具——可转换公司债券的分拆与转股★必背★\n- **优先级**：★★★\n- **内容**：发行方应当在**初始确认时**将复合金融工具的各组成部分**分别**分类：先确定**负债成分**的公允价值（用**不含转换权的同类债券的市场利率**对未来现金流量折现，包括本金和票面利息），再从发行价格中扣除负债成分公允价值，余额即**权益成分**（计入「其他权益工具」）。发行费用应当在负债成分与权益成分之间**按各自公允价值比例分摊**。转股时**不确认损益**：结转负债成分的账面价值与权益成分，按面值计入股本、差额计入资本公积——股本溢价。\n- **分录**：\n  ```\n  发行：借：银行存款\n         应付债券——利息调整（折价，或贷方溢价）\n        贷：应付债券——面值\n            其他权益工具（权益成分）\n  转股：借：应付债券——面值\n                  ——利息调整\n          其他权益工具\n        贷：股本（转换股数×每股面值）\n            资本公积——股本溢价（差额）\n  ```\n- **易错**：用**实际利率**（含转换权的影响）而不是\"不含转换权的市场利率\"折现负债成分；转股时确认投资收益；认股权证/股份期权与可转债条款修订（提供更有利转换比率促成提前转换）的处理的混淆。\n- **考察**：2021-1\n\n### 考点20　金融负债与权益工具之间的重分类\n- **优先级**：★\n- **内容**：由于原合同条款约定的条件或事项随**时间的推移**或**经济环境的改变**而发生变化，可能导致已发行金融工具（含特殊金融工具）在金融负债与权益工具之间重分类。重分类时按**重分类日**的金额计量：金融负债重分类为权益工具的，按当日金融负债的**账面价值**计量；反之按当日**公允价值**计量。原合同条款不变、仅因企业意愿改变的不构成重分类。\n- **考察**：—\n\n### 考点21　库存股、权益工具回购与注销\n- **优先级**：★★\n- **内容**：企业回购自身权益工具（含因业绩补偿回购股份）支付的价款，**全部**作为**库存股**（权益的减项）核算，不确认利得或损失。注销库存股时，按股票面值和注销股数冲减**股本**，按注销库存股的账面余额冲减**库存股**，差额先冲减**资本公积——股本溢价**，不足冲减的再冲减**盈余公积**和**未分配利润**。\n- **分录**：\n  ```\n  回购：借：库存股（回购股数×回购价）\n        贷：银行存款\n  注销：借：股本（面值×注销股数）\n          资本公积——股本溢价\n          盈余公积／利润分配——未分配利润（不足冲减部分）\n        贷：库存股\n  ```\n- **易错**：把回购价高于面值的部分全额冲减资本公积而**不先按\"库存股冲销顺序\"处理**；把库存股作为资产列示（应为所有者权益的减项）；把回购确认为损失。\n- **考察**：2018-13、2018-14\n\n### 考点22　嵌入衍生工具的分拆\n- **优先级**：★★\n- **内容**：混合合同包含的主合同**不属于**CAS 22 规范的资产时，若同时满足：①嵌入衍生工具的经济特征和风险与主合同的经济特征和风险**不紧密相关**；②与嵌入衍生工具具有相同条款的单独工具符合**衍生工具的定义**；③该混合合同**不是**以公允价值计量且其变动计入当期损益的，则应将嵌入衍生工具**从主合同中分拆**，作为单独存在的衍生工具处理。主合同**属于**CAS 22 规范的金融资产时，**不**分拆（整体按公允价值计量）。\n- **易错**：对货币性主合同（如可转换债券中的转股权）错误地分拆——发行方可转债的转股权按**权益成分**处理（考点19），而非按嵌入衍生工具分拆。\n- **考察**：—\n\n### 考点23　金融资产的重分类\n- **优先级**：★★\n- **内容**：**仅当企业改变其管理金融资产的业务模式时**，才应当对受影响的相关金融资产进行重分类。重分类一律以**公允价值**为基础计量，具体：\n\n  | 重分类方向 | 计量基础 |\n  |---|---|\n  | 摊余成本 → FVTPL | 按重分类日**公允价值**计量，原账面价值与公允价值的差额**计入当期损益** |\n  | 摊余成本 → FVOCI | 按**公允价值**计量，差额调整其他综合收益（视同一直按公允价值计量） |\n  | FVOCI → 摊余成本 | 将之前计入 OCI 的累计利得或损失**转出**，调整该金融资产在重分类日的公允价值，并以调整后金额作为**新的账面价值**（视同一直按摊余成本计量） |\n  | FVOCI → FVTPL | 继续按**公允价值**计量，之前计入 OCI 的累计利得或损失**转入当期损益** |\n  | FVTPL → 摊余成本 | 以重分类日**公允价值**作为**新的账面余额** |\n  | FVTPL → FVOCI | 以重分类日**公允价值**作为新的账面价值 |\n- **注意**：①**所有金融负债均不得重分类**；②已指定为 FVOCI 的**非交易性权益工具投资**不得重分类；③金融资产**条款变更导致终止确认**的，终止确认原资产并按新条款确认一项**新**金融资产，**不涉及重分类**；④重分类日一般为企业业务模式发生变更后的**首个报告期间的首日**。\n- **易错**：把\"合同条款修改\"当重分类；把金融负债也做重分类；重分类时按**原账面价值**而不是公允价值结转。\n- **考察**：—\n\n### 考点24　企业合并中的或有对价（金融工具视角）\n- **优先级**：★★\n- **内容**：非同一控制下企业合并中，或有对价在**购买日**按**公允价值**计入合并成本；符合金融工具定义的（如以自身权益工具或现金结算的业绩承诺），按 CAS 22 处理。**后续计量**：分类为**金融资产/金融负债**的或有对价，其公允价值变动计入**当期损益（公允价值变动损益）**，**不调整商誉**；分类为**权益工具**的或有对价不再重新计量。\n- **易错**：把后续公允价值变动调整商誉；把应回购的补偿股份按\"资产\"而不是**库存股**核算。\n- **考察**：2018-10、2018-11、2018-13\n\n### 考点25　套期会计（公允价值套期与现金流量套期）\n- **优先级**：★★\n- **内容**：运用套期会计须同时满足：①套期关系**仅**由符合条件的套期工具和被套期项目组成；②套期开始时**正式指定**并准备**书面文件**（载明套期关系、风险管理策略与目标）；③套期关系符合**套期有效性**要求。**套期工具**：FVTPL 的衍生工具（**签出期权除外**，仅在购入期权套期时可作套期工具）、非衍生金融资产或非衍生金融负债（**仅限外汇风险**）。\n  - **公允价值套期**：套期工具与被套期项目的公允价值变动**均计入当期损益**（套期损益），从而在同一期间抵销。\n  - **现金流量套期**：套期工具利得或损失中属于**有效套期**的部分计入**其他综合收益——套期储备**；被套期项目影响损益时，将套期储备**转出调整**被套期项目（如调整主营业务收入）。\n- **易错**：把现金流量套期的全部公允价值变动（含无效部分）都计入 OCI；把签出期权作为套期工具。\n- **考察**：—\n\n### 考点26　保险合同概述（保险风险与重大保险风险测试）\n- **优先级**：★\n- **内容**：**保险事项**是指保险合同所承保的、产生保险风险的**不确定未来事项**（发生概率、发生时间或赔付金额不确定）。**保险风险**是企业必须从保单持有人处接受的、保单持有人**已面临**的风险；任何由合同给企业或保单持有人带来的**新**风险都**不是**保险风险。**失效
